<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="urnBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#facc15" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="urnGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.9" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="#020617" />
  <!-- Rim band -->
  <rect x="14" y="10" width="36" height="6" rx="3" fill="#020617" stroke="#fbbf24" stroke-width="2" />
  <!-- Handles -->
  <path d="M14 18c-4 3-6 7-6 11 0 4 2 8 6 11" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linecap="round" />
  <path d="M50 18c4 3 6 7 6 11 0 4-2 8-6 11" fill="none" stroke="#f97316" stroke-width="2.2" stroke-linecap="round" />
  <!-- Urn body -->
  <path d="M20 18h24c0 10-2 18-12 26C22 36 20 28 20 18z" fill="url(#urnBody)" stroke="#fbbf24" stroke-width="2" />
  <!-- Frieze band -->
  <rect x="22" y="24" width="20" height="6" rx="3" fill="#020617" stroke="#facc15" stroke-width="1.4" />
  <!-- Tiny shield + grid motif inside frieze -->
  <rect x="24" y="26" width="6" height="4" rx="1" fill="none" stroke="#38bdf8" stroke-width="1" />
  <rect x="34" y="26" width="6" height="4" rx="1" fill="none" stroke="#22c55e" stroke-width="1" />
  <path d="M24 28h6" stroke="#38bdf8" stroke-width="0.8" />
  <path d="M34 26h6" stroke="#22c55e" stroke-width="0.8" />
  <!-- Glow base / reflection -->
  <ellipse cx="32" cy="48" rx="12" ry="4" fill="url(#urnGlow)" opacity="0.5" />
</svg>

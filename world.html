<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#b8cbd8" />
<title>Brick World</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8cbd8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1a1f2a}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#b8cbd8}
#gate{position:fixed;left:12px;right:12px;top:calc(58px + env(safe-area-inset-top));z-index:9999;padding:10px;border-radius:16px;background:rgba(250,251,252,.98);box-shadow:0 10px 32px rgba(0,0,0,.24)}
#gate.saved{left:50%;right:auto;transform:translateX(-50%);padding:0;background:transparent;box-shadow:none}
#row{display:flex;gap:8px;align-items:center}
#label{font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
#key{flex:1;min-width:0;height:48px;border:1px solid rgba(26,31,42,.25);border-radius:12px;padding:0 12px;background:#fff;color:#1a1f2a;font:14px ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-user-select:text;user-select:text}
#key:focus{outline:2px solid #c8901c;border-color:transparent}
#save,#edit{height:48px;border:0;border-radius:12px;padding:0 15px;background:#1a1f2a;color:#fff;font:800 12px system-ui;letter-spacing:.08em;text-transform:uppercase}
#edit{display:none;height:34px;font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace}
#note{margin-top:7px;color:#596272;font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
#gate.saved #row,#gate.saved #note{display:none}#gate.saved #edit{display:block}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:#4b5566;font:11px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<div id="boot">enter OpenAI key to start</div>
<iframe id="frame" title="Brick World"></iframe>
<div id="gate">
  <div id="row"><span id="label">OpenAI API key</span><input id="key" type="password" placeholder="paste sk-… key here" autocomplete="off" autocapitalize="none" spellcheck="false"><button id="save" type="button">Save</button></div>
  <div id="note">Stored only in this browser for this site. Builder is locked to GPT-5.6 Sol · max reasoning.</div>
  <button id="edit" type="button">SOL · KEY ✓</button>
</div>
<script>
(function(){
  const K='openai_api_key',M='world.ai.model',E='world.ai.effort';
  const gate=document.getElementById('gate'),key=document.getElementById('key'),save=document.getElementById('save'),edit=document.getElementById('edit'),frame=document.getElementById('frame'),boot=document.getElementById('boot');
  const get=()=>{try{return(localStorage.getItem(K)||'').trim()}catch(e){return''}};
  function patch(){
    let w,d;try{w=frame.contentWindow;d=frame.contentDocument}catch(e){return}if(!w||!d||!d.head||!d.body)return;
    let css=d.getElementById('livePatch');
    if(!css){css=d.createElement('style');css.id='livePatch';css.textContent='body.build #wb{display:none!important}body.build{--wb:0px!important}#wbRead{display:none!important}body.build #hint{bottom:4px!important}';d.head.appendChild(css)}
    const read=d.getElementById('wbRead');if(read){read.style.display='none';read.tabIndex=-1}
    const b=d.getElementById('build');if(b)b.textContent=d.body.classList.contains('build')?'DONE':'BUILD';
    if(!d.getElementById('solFresh')){const s=d.createElement('script');s.id='solFresh';s.src='./world/ai.js?v=bcfda584-'+Date.now();d.head.appendChild(s)}
  }
  frame.addEventListener('load',()=>{boot.style.display='none';patch();setTimeout(patch,250);setTimeout(patch,1000);try{new MutationObserver(patch).observe(frame.contentDocument.body,{attributes:true,attributeFilter:['class']})}catch(e){}});
  function load(){
    try{localStorage.setItem(M,'gpt-5.6-sol');localStorage.setItem(E,'max')}catch(e){}
    gate.classList.add('saved');
    frame.src='word-to-world.html?v=live-'+Date.now()+location.hash;
  }
  function store(){const v=(key.value||'').trim();if(!v)return;try{localStorage.setItem(K,v)}catch(e){}load()}
  save.onclick=store;key.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();store()}});
  edit.onclick=()=>{gate.classList.remove('saved');key.value=get();setTimeout(()=>{key.focus();key.select()},30)};
  if(get())load();else setTimeout(()=>key.focus(),200);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#b8cbd8" />
<title>Brick World</title>
<meta name="robots" content="noindex" />
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8cbd8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#worldFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#b8cbd8}
#apiDock{position:fixed;left:12px;right:12px;top:calc(58px + env(safe-area-inset-top));z-index:5000;display:flex;gap:8px;align-items:center;padding:8px;border-radius:14px;background:rgba(248,250,251,.97);box-shadow:0 8px 30px rgba(0,0,0,.22)}
#apiDock.saved{left:50%;right:auto;transform:translateX(-50%);padding:0;background:none;box-shadow:none}
#apiDock label{flex:0 0 auto;font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:#1a1f2a}
#apiKey{flex:1;min-width:0;height:46px;border:1px solid rgba(26,31,42,.25);border-radius:12px;padding:0 11px;background:#fff;color:#1a1f2a;font:14px ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-user-select:text;user-select:text}
#apiKey:focus{outline:2px solid #c8901c;border-color:transparent}
#apiSave{height:46px;padding:0 15px;border:0;border-radius:12px;background:#1a1f2a;color:#fff;font:800 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
#apiEdit{display:none;height:34px;padding:0 12px;border:0;border-radius:10px;background:#1a1f2a;color:#fff;font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase}
#apiDock.saved label,#apiDock.saved #apiKey,#apiDock.saved #apiSave{display:none}#apiDock.saved #apiEdit{display:block}
#boot{position:fixed;inset:0;display:grid;place-items:center;color:#4b5566;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
</style>
</head>
<body>
<div id="boot">opening world…</div>
<iframe id="worldFrame" title="Brick World"></iframe>
<div id="apiDock">
  <label for="apiKey">OpenAI key</label>
  <input id="apiKey" type="password" placeholder="paste sk-… key here" autocomplete="off" autocapitalize="none" spellcheck="false" />
  <button id="apiSave" type="button">Save</button>
  <button id="apiEdit" type="button">SOL · KEY ✓</button>
</div>
<script>
(function(){
  'use strict';
  const KEY='openai_api_key', MODEL_KEY='world.ai.model', EFFORT_KEY='world.ai.effort';
  const frame=document.getElementById('worldFrame'), dock=document.getElementById('apiDock'), input=document.getElementById('apiKey'), save=document.getElementById('apiSave'), edit=document.getElementById('apiEdit'), boot=document.getElementById('boot');
  try{localStorage.setItem(MODEL_KEY,'gpt-5.6-sol');localStorage.setItem(EFFORT_KEY,'max');}catch(e){}
  function getKey(){try{return (localStorage.getItem(KEY)||'').trim();}catch(e){return '';}}
  function sync(){const k=getKey();dock.classList.toggle('saved',!!k);if(!dock.classList.contains('saved')&&k&&!input.value)input.value=k;}
  function child(){try{return frame.contentWindow;}catch(e){return null;}}
  function saveKey(){
    const v=(input.value||'').trim(); if(!v)return;
    try{localStorage.setItem(KEY,v);localStorage.setItem(MODEL_KEY,'gpt-5.6-sol');localStorage.setItem(EFFORT_KEY,'max');}catch(e){}
    sync();
    const w=child();
    try{if(w&&w.Ai&&w.Ai.setKey)w.Ai.setKey(v);}catch(e){}
    frame.src='./word-to-world.html?keyreload='+Date.now()+location.hash;
  }
  function editKey(){dock.classList.remove('saved');input.value=getKey();setTimeout(()=>{input.focus();input.select();},30);}
  save.onclick=saveKey;edit.onclick=editKey;
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveKey();}});

  function patchChild(){
    const w=child(); if(!w)return;
    let d; try{d=w.document;}catch(e){return;} if(!d||!d.body)return;
    boot.style.display='none';
    let st=d.getElementById('worldParentPatch');
    if(!st){st=d.createElement('style');st.id='worldParentPatch';st.textContent='body.build #wb{display:none!important}body.build{--wb:0px!important}#wbRead{display:none!important}body.build #hint{bottom:4px!important}';d.head.appendChild(st);}
    const read=d.getElementById('wbRead');if(read){read.style.display='none';read.tabIndex=-1;}
    const b=d.getElementById('build');if(b)b.textContent=d.body.classList.contains('build')?'DONE':'BUILD';
    try{if(w.Ai&&getKey()&&w.Ai.setKey)w.Ai.setKey(getKey());}catch(e){}
  }
  frame.addEventListener('load',()=>{patchChild();setTimeout(patchChild,250);setTimeout(patchChild,1000);try{const d=frame.contentDocument;if(d&&d.body)new MutationObserver(patchChild).observe(d.body,{attributes:true,attributeFilter:['class']});}catch(e){}});
  frame.src='./word-to-world.html?outer='+Date.now()+location.search.replace(/^\?/,'&');
  sync();
  if(!getKey())setTimeout(()=>input.focus(),800);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATG Unified Terrain | All Data Sources</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

        :root {
            --bg: #0d0d12;
            --surface: #18181b;
            --surface-alt: #27272a;
            --ink: #fafafa;
            --ink-dim: #a1a1aa;
            --ink-faint: #52525b;
            --accent: #d97706;
            --accent-dim: rgba(217, 119, 6, 0.15);
            --water: #3b82f6;
            --forest: #10b981;
            --peak: #ef4444;
            --valley: #8b5cf6;
        }

        [data-theme="light"] {
            --bg: #f5f5f4;
            --surface: #ffffff;
            --surface-alt: #e7e5e4;
            --ink: #1c1917;
            --ink-dim: #57534e;
            --ink-faint: #a8a29e;
            --accent: #b45309;
            --accent-dim: rgba(180, 83, 9, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        #viewport {
            position: absolute;
            inset: 0;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .texture-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.12;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
        }

        #labels {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* Place names - pure typography */
        .place-name {
            position: absolute;
            transform: translate(-50%, -50%);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--ink);
            text-shadow: 
                0 1px 3px var(--bg),
                0 0 8px var(--bg),
                0 0 16px var(--bg),
                0 0 24px var(--bg);
            pointer-events: auto;
            cursor: pointer;
            text-align: center;
            transition: color 0.2s, transform 0.3s ease-out;
            white-space: nowrap;
            z-index: 10;
        }

        [data-theme="light"] .place-name {
            text-shadow: 
                0 1px 2px rgba(255,255,255,0.8),
                0 0 8px var(--bg),
                0 0 16px var(--bg);
        }

        .place-name:hover {
            color: var(--accent);
            transform: translate(-50%, -50%) scale(1.08);
        }

        .place-name .file-count {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 400;
            opacity: 0.7;
            margin-top: 3px;
            color: var(--ink-dim);
        }

        /* Hitbox for easier dot clicking */
        .dot-hitbox {
            position: absolute;
            width: 44px;
            height: 44px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            pointer-events: auto;
        }

        /* Connection lines layer */
        #connections {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        #connections path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            transition: stroke-dashoffset 0.8s ease-out, stroke 0.3s, stroke-width 0.3s;
        }

        #connections path.visible {
            stroke-dashoffset: 0;
        }

        #connections path.active {
            stroke-width: 2.5 !important;
            stroke: var(--accent) !important;
            filter: drop-shadow(0 0 4px var(--accent));
        }

        /* Map controls - top left */
        .map-controls {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 50;
            display: flex;
            flex-direction: row;
            gap: 12px;
        }

        .ctrl-btn {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            border: 1px solid var(--ink-faint);
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .ctrl-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        /* Timeline - bottom */
        #timeline {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: linear-gradient(to top, var(--bg) 20%, transparent);
            z-index: 40;
            padding: 12px 60px;
            pointer-events: none;
        }

        [data-theme="light"] #timeline {
            background: linear-gradient(to top, var(--bg) 40%, transparent);
        }

        .timeline-track {
            position: absolute;
            bottom: 24px;
            left: 60px;
            right: 60px;
            height: 4px;
            background: var(--ink-faint);
            border-radius: 2px;
            cursor: pointer;
            pointer-events: auto;
        }

        .timeline-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
            transition: width 0.4s ease-out;
        }

        .timeline-dot {
            position: absolute;
            top: -6px;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            border: 2px solid var(--bg);
            transform: translateX(-50%);
            cursor: pointer;
            transition: all 0.15s;
            pointer-events: auto;
        }

        .timeline-dot:hover {
            transform: translateX(-50%) scale(1.25);
            background: var(--ink);
        }

        .timeline-dot.active {
            background: var(--ink);
        }

        .timeline-tooltip {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface);
            color: var(--ink);
            padding: 6px 10px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            border-radius: 4px;
            border: 1px solid var(--ink-faint);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 55;
            transition: opacity 0.15s;
        }

        .timeline-dot:hover .timeline-tooltip,
        .timeline-dot.active .timeline-tooltip {
            opacity: 1;
        }

        .timeline-dot:nth-child(odd) .timeline-tooltip { bottom: 28px; }
        .timeline-dot:nth-child(even) .timeline-tooltip { top: 28px; }

        /* Legend/Key */
        #map-legend {
            position: fixed;
            top: 100px;
            left: 24px;
            background: var(--surface);
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--ink-faint);
            display: none;
            z-index: 45;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }

        .legend-title {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: var(--ink-dim);
        }

        .legend-items { display: flex; flex-direction: column; gap: 6px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; }
        .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

        /* Modal backdrop */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-out;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Zone info modal */
        .zone-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            z-index: 101;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease-out, transform 0.25s ease-out;
        }

        .zone-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        /* LEGOS Dossier Header */
        .lego-header {
            padding: 16px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--ink-faint);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .lego-title-block { flex: 1; }

        .lego-type {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .lego-title {
            font-family: 'EB Garamond', serif;
            font-size: 22px;
            font-weight: 600;
            line-height: 1.1;
            color: var(--ink);
        }

        .lego-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            color: var(--ink-dim);
            margin-top: 4px;
            max-width: 400px;
        }

        .zone-close {
            background: none;
            border: 1px solid var(--ink-faint);
            color: var(--ink-dim);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.15s;
        }

        .zone-close:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg);
        }

        .zone-body {
            padding: 20px;
            overflow-y: auto;
            max-height: calc(80vh - 90px);
        }

        /* Dossier Style Grid */
        .dossier-grid {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 12px 24px;
            margin-bottom: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            border-top: 1px solid var(--ink-faint);
            padding-top: 16px;
        }

        .dossier-label {
            color: var(--ink-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: right;
            font-weight: 600;
        }

        .dossier-value { color: var(--ink); }

        .dossier-tag {
            display: inline-block;
            padding: 2px 6px;
            background: var(--surface-alt);
            border-radius: 3px;
            margin-right: 4px;
            margin-bottom: 4px;
            border: 1px solid var(--ink-faint);
        }

        /* File grid */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: var(--surface-alt);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .file-item:hover { background: var(--accent-dim); }

        .file-ext {
            font-size: 9px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            padding: 3px 6px;
            border-radius: 3px;
        }

        .file-ext.html { background: rgba(249, 115, 22, 0.2); color: #fb923c; }
        .file-ext.json { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .file-ext.md { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .file-ext.mpd { background: rgba(236, 72, 153, 0.2); color: #f472b6; }

        .file-name {
            font-size: 11px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Iframe viewer */
        .iframe-viewer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 90vw;
            height: 85vh;
            background: var(--surface);
            border: 1px solid var(--ink-faint);
            z-index: 200;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            border-radius: 12px;
            overflow: hidden;
        }

        .iframe-viewer.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .iframe-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .iframe-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--ink-faint);
            background: var(--surface);
            border-radius: 4px;
            cursor: pointer;
            color: var(--ink);
            transition: all 0.1s;
            text-decoration: none;
            font-size: 14px;
        }

        .iframe-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .iframe-frame {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
            background: white;
        }

        .minimap-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        /* Date Overlay */
        #date-overlay {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'EB Garamond', serif;
            font-size: 32px;
            font-style: italic;
            color: var(--accent);
            text-shadow: 0 2px 10px var(--bg);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 50;
        }

        #date-overlay.active { opacity: 1; }

        /* Reflection Stream */
        #reflection-stream {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 500px;
            width: 90%;
            text-align: center;
            pointer-events: none;
            z-index: 45;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .reflection-content {
            background: var(--surface);
            padding: 16px 24px;
            border-radius: 8px;
            border: 1px solid var(--ink-faint);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            display: inline-block;
        }

        [data-theme="light"] .reflection-content {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
        }

        .refl-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .refl-text {
            font-family: 'EB Garamond', serif;
            font-size: 18px;
            font-weight: 400;
            font-style: italic;
            color: var(--ink);
            line-height: 1.5;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .map-controls { left: 10px; top: 10px; }
            #reflection-stream { bottom: 90px; width: 95vw; }
            .refl-text { font-size: 16px; }
            #timeline { height: 80px; }
            .timeline-dot { width: 14px; height: 14px; }
            .timeline-dot:nth-child(even) .timeline-tooltip { display: none; }
            .timeline-dot.active .timeline-tooltip { display: block !important; font-size: 14px; bottom: 24px; color: var(--accent); }
            .zone-modal { position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; transform: none !important; width: 100% !important; max-width: 100% !important; max-height: 100% !important; height: 100% !important; border-radius: 0 !important; }
            .zone-modal.active { transform: none !important; }
        }
    </style>
</head>

<body>
    <div id="viewport">
        <canvas id="c"></canvas>
        <div class="texture-overlay"></div>
        <svg id="connections"></svg>
        <div id="labels"></div>
    </div>

    <!-- Reflection Stream -->
    <div id="reflection-stream">
        <div class="reflection-content">
            <div class="refl-title">&lt;SHIFTING CONTEXT&gt;</div>
            <div class="refl-text" id="refl-body">...</div>
        </div>
    </div>

    <!-- Map controls -->
    <div class="map-controls">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <button class="ctrl-btn" id="btn-play" title="Play History">&gt;</button>
            <span style="font-size:9px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;">PLAY</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <button class="ctrl-btn" id="btn-theme" title="Toggle theme">L</button>
            <span style="font-size:9px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;">LIGHT</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <button class="ctrl-btn" id="btn-conn" title="Connections">C</button>
            <span style="font-size:9px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;">CONN</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <button class="ctrl-btn" id="btn-legend" title="Toggle Key">K</button>
            <span style="font-size:9px;color:var(--ink-dim);font-family:'JetBrains Mono',monospace;">KEY</span>
        </div>
    </div>

    <!-- Legend/Key -->
    <div id="map-legend">
        <div class="legend-title">Map Key</div>
        <div class="legend-items">
            <div class="legend-item"><span class="legend-dot" style="background:#ef4444"></span><span>Mountain/Peak</span></div>
            <div class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span><span>River/Stream</span></div>
            <div class="legend-item"><span class="legend-dot" style="background:#10b981"></span><span>Highlands</span></div>
            <div class="legend-item"><span class="legend-dot" style="background:#8b5cf6"></span><span>Valley/Basin</span></div>
            <div class="legend-item"><span class="legend-dot" style="background:#d97706"></span><span>Plateau/Islands</span></div>
            <div class="legend-item"><span class="legend-dot" style="background:#ec4899"></span><span>Settlement</span></div>
        </div>
    </div>

    <!-- Timeline -->
    <div id="timeline">
        <div class="timeline-track" id="track">
            <div class="timeline-fill" id="tl-fill"></div>
        </div>
    </div>

    <!-- Modal backdrop -->
    <div class="modal-backdrop" id="backdrop"></div>

    <div id="date-overlay"></div>

    <!-- Zone modal (LEGOS Dossier Style) -->
    <div class="zone-modal" id="zone-modal">
        <div class="lego-header">
            <div class="lego-title-block">
                <div class="lego-type">&lt;LOCATION&gt;</div>
                <div class="lego-title" id="z-title">Zone</div>
                <div class="lego-subtitle" id="z-intent"></div>
            </div>
            <button class="zone-close" id="z-close">×</button>
        </div>
        <div class="zone-body" id="z-body"></div>
    </div>

    <!-- Iframe viewer -->
    <div class="iframe-viewer" id="iframe-viewer">
        <div class="lego-header">
            <div class="lego-title-block">
                <div class="lego-type" id="if-context-type">&lt;ENTITY&gt;</div>
                <div class="lego-title" id="iframe-name">file.html</div>
                <div class="lego-subtitle">
                    <span class="minimap-dot" id="if-dot"></span><span id="if-location">Location</span>
                </div>
            </div>
            <div class="iframe-nav">
                <span id="iframe-ext" class="file-ext" style="margin-right:8px; font-size:10px;">HTML</span>
                <a class="iframe-btn" id="if-open" href="#" target="_blank" title="Open in New Tab">↗</a>
                <div style="width:1px; height:16px; background:var(--ink-dim); opacity:0.3; margin:0 4px;"></div>
                <button class="iframe-btn" id="if-prev" title="Previous File">←</button>
                <button class="iframe-btn" id="if-next" title="Next File">→</button>
                <div style="width:1px; height:16px; background:var(--ink-dim); opacity:0.3; margin:0 4px;"></div>
                <button class="iframe-btn" id="if-close" title="Close Viewer">×</button>
            </div>
        </div>
        <iframe id="iframe-frame" class="iframe-frame" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
    </div>

    <script>
        (function () {
            // ═══════════════════════════════════════════════════════════════════
            // INTEGRATED DATA FROM ALL THREE SOURCES
            // ═══════════════════════════════════════════════════════════════════
            const ZONES = [
                {
                    id: "FullyConnected", label: "CONNEX PEAKS", type: "mountain", color: "#ef4444", pos: { x: 0.45, y: 0.22 },
                    desc: "Onyx Studio - Fully connected project planning & narrative ontology",
                    intent: "Formalize story structure with 8 narrative types",
                    moves: ["Words Assemble Geometries", "Operative Ekphrasis", "Words Become Worlds"],
                    repo: "tractor-dce-gyo", commits: 50, dateRange: "Nov 14-Dec 7",
                    patterns: ["word-assembly", "ai-legos", "narrative-ontology"], trailLevel: 2,
                    artifacts: [
                        "onyx-abs.html",
                        "onyx-wing.html",
                        "onyx-core-index.html",
                        "onyx-studio-slides.html"
                    ]
                },

                {
                    id: "StreamDelta", label: "STREAM DELTA", type: "river", color: "#3b82f6", pos: { x: 0.22, y: 0.38 },
                    desc: "Training Ground - Operator upgrade flow",
                    intent: "Embodied knowledge through 6-axis decomposition",
                    moves: ["Experience Designer", "Black Metal aesthetic", "operator upgrade"],
                    repo: "func-sub", commits: 20, dateRange: "Nov 4-10",
                    patterns: ["6-axis-decomposition", "operator-triad", "bayesian-update"], trailLevel: 2,
                    artifacts: [
                        "https://hartswf0.github.io/func-sub/func-index.html"
                    ]
                },

            // CANVAS RENDERING
            // ═══════════════════════════════════════════════════════════════════
            const canvas = document.getElementById('c');
            const ctx = canvas.getContext('2d');
            const CONFIG = { GRID_W: 140, GRID_H: 90, LEVELS: 16 };
            let heatGrid, W, H;

            function noise(x, y) { const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return s - Math.floor(s); }
            function fbm(x, y, oct) { let v = 0, a = 0.5; for (let i = 0; i < oct; i++) { v += noise(x * 1.7, y * 1.7) * a; x *= 2; y *= 2; a *= 0.5; } return v; }

            function init() {
                W = window.innerWidth; H = window.innerHeight;
                const dpr = Math.min(devicePixelRatio || 1, 2);
                canvas.width = W * dpr; canvas.height = H * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                CONFIG.GRID_H = Math.floor(CONFIG.GRID_W * (H / W));
                heatGrid = new Float32Array(CONFIG.GRID_W * CONFIG.GRID_H);

                // Generate terrain with peaks at zone positions, weighted by commits
                for (let y = 0; y < CONFIG.GRID_H; y++) {
                    for (let x = 0; x < CONFIG.GRID_W; x++) {
                        const nx = x / CONFIG.GRID_W, ny = y / CONFIG.GRID_H;
                        let h = fbm(nx * 3.5, ny * 3.5, 5) * 0.25;
                        ZONES.forEach(z => {
                            const dx = nx - z.pos.x, dy = ny - z.pos.y;
                            const d = Math.sqrt(dx * dx + dy * dy);
                            const weight = Math.max(1, Math.log10((z.commits || 0) + 1) * 2);
                            if (d < 0.18) h += (0.18 - d) * weight * (z.trailLevel + 1);
                        });
                        heatGrid[y * CONFIG.GRID_W + x] = Math.min(h, 4);
                    }
                }
                renderLabels();
                renderConnections();
                renderTimeline();
                draw();
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                const cw = W / CONFIG.GRID_W, ch = H / CONFIG.GRID_H;

                // Elevation bands with color gradients
                for (let l = CONFIG.LEVELS; l >= 1; l--) {
                    const t = l * 0.2;
                    const hue = isDark ? 22 + (l / CONFIG.LEVELS) * 12 : 30 + (l / CONFIG.LEVELS) * 10;
                    const sat = isDark ? 60 : 35;
                    const lum = isDark ? 45 : 55;
                    const alpha = 0.015 + (l / CONFIG.LEVELS) * 0.04;
                    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${lum}%, ${alpha})`;
                    for (let y = 0; y < CONFIG.GRID_H; y++) {
                        for (let x = 0; x < CONFIG.GRID_W; x++) {
                            if (heatGrid[y * CONFIG.GRID_W + x] >= t) ctx.fillRect(x * cw, y * ch, cw + 0.5, ch + 0.5);
                        }
                    }
                }

                // Contour lines
                ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                for (let l = 1; l <= CONFIG.LEVELS; l++) {
                    const t = l * 0.2, major = l % 3 === 0;
                    ctx.beginPath();
                    ctx.lineWidth = major ? 1.2 : 0.4;
                    ctx.strokeStyle = isDark ? '#d97706' : '#92400e';
                    ctx.globalAlpha = major ? 0.5 : 0.15;
                    for (let y = 0; y < CONFIG.GRID_H - 1; y++) {
                        for (let x = 0; x < CONFIG.GRID_W - 1; x++) {
                            const idx = y * CONFIG.GRID_W + x;
                            const v0 = heatGrid[idx], v1 = heatGrid[idx + 1], v2 = heatGrid[idx + CONFIG.GRID_W + 1], v3 = heatGrid[idx + CONFIG.GRID_W];
                            let bits = 0;
                            if (v0 >= t) bits |= 1; if (v1 >= t) bits |= 2; if (v2 >= t) bits |= 4; if (v3 >= t) bits |= 8;
                            if (bits === 0 || bits === 15) continue;
                            const lx = x * cw, ly = y * ch;
                            const a = { x: lx + cw * 0.5, y: ly }, b = { x: lx + cw, y: ly + ch * 0.5 }, c = { x: lx + cw * 0.5, y: ly + ch }, d = { x: lx, y: ly + ch * 0.5 };
                            switch (bits) {
                                case 1: case 14: ctx.moveTo(d.x, d.y); ctx.lineTo(a.x, a.y); break;
                                case 2: case 13: ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); break;
                                case 4: case 11: ctx.moveTo(b.x, b.y); ctx.lineTo(c.x, c.y); break;
                                case 8: case 7: ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); break;
                                case 3: case 12: ctx.moveTo(d.x, d.y); ctx.lineTo(b.x, b.y); break;
                                case 6: case 9: ctx.moveTo(a.x, a.y); ctx.lineTo(c.x, c.y); break;
                                case 5: ctx.moveTo(d.x, d.y); ctx.lineTo(a.x, a.y); ctx.moveTo(b.x, b.y); ctx.lineTo(c.x, c.y); break;
                                case 10: ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); break;
                            }
                        }
                    }
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;

                // Zone markers
                ZONES.forEach(z => {
                    const px = z.pos.x * W, py = z.pos.y * H;
                    const r = 4 + z.trailLevel * 2 + Math.sqrt(z.commits || 0) * 0.5;
                    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2);
                    ctx.fillStyle = z.color; ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
                });
            }

            function renderConnections(animate = false) {

                CONNECTIONS.forEach((c, idx) => {

                    const x1 = fromZ.pos.x * W, y1 = fromZ.pos.y * H;

                    // Gentle curve

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M${x1},${y1} Q${mx},${my} ${x2},${y2}`);
                    path.setAttribute('stroke', isDark ? 'rgba(161,161,170,0.25)' : 'rgba(87,83,78,0.25)');
                    path.setAttribute('stroke-width', '1.5');
                    path.setAttribute('fill', 'none');
                    path.setAttribute('data-from', c.from);
                    path.setAttribute('data-to', c.to);
                    path.classList.add('conn-path');
                    
                    // Calculate actual path length for proper dash animation
                    svg.appendChild(path);
                    const len = path.getTotalLength();
                    path.style.strokeDasharray = len;
                    path.style.strokeDashoffset = animate ? len : 0;
                    
                    if (animate) {
                        setTimeout(() => {
                            path.classList.add('visible');
                        }, idx * 100);
                    } else {
                        path.classList.add('visible');
                    }
                });
            }

            function renderTimeline() {
                const track = document.getElementById('track');
                track.querySelectorAll('.timeline-dot').forEach(d => d.remove());
                const startDate = new Date('2025-09-01').getTime();
                const endDate = new Date('2025-12-10').getTime();
                const range = endDate - startDate;
                TIMELINE.forEach((t, i) => {

                    const pct = ((d - startDate) / range) * 100;
                    const dot = document.createElement('div');

                    dot.style.left = pct + '%';
                    // Format date nicely
                    const dateObj = new Date(t.date);

                    const day = dateObj.getDate();
                    dot.innerHTML = `<span class="timeline-tooltip">${month} ${day}: ${t.label}</span>`;

            function setTimelinePosition(idx) {
                const t = TIMELINE[idx];
                const startDate = new Date('2025-09-01').getTime();
                const endDate = new Date('2025-12-10').getTime();
                const d = new Date(t.date).getTime();
                const pct = ((d - startDate) / (endDate - startDate)) * 100;
                document.getElementById('tl-fill').style.width = pct + '%';

                document.querySelectorAll('.timeline-dot').forEach((dot, i) => {
                    dot.classList.toggle('active', i === idx);
                });

                // Highlight matching zones
                ZONES.forEach(z => z.highlight = false);
                if (t.zones) {
                    t.zones.forEach(id => {
                        const z = ZONES.find(z => z.id === id);
                        if (z) z.highlight = true;
                    });
                }

                // Update label colors to reflect highlights
                ZONES.forEach(z => {
                    if (z.el) {
                        z.el.style.color = z.highlight ? z.color : '';
                        z.el.style.fontWeight = z.highlight ? '700' : '';
                        z.el.style.transform = z.highlight ? 'translate(-50%, -50%) scale(1.1)' : '';
                    }

                // Highlight connections to/from active zones
                highlightConnections(t.zones || []);

                // Update reflection stream

                const reflEl = document.getElementById('reflection-stream');

                if (isPlaying) {
                    dateEl.textContent = t.date;
                    dateEl.classList.add('active');

                    // Show the intent of highlighted zone(s)
                    const activeZone = t.zones ? ZONES.find(z => z.id === t.zones[0]) : null;

            function togglePlay() {
                isPlaying = !isPlaying;

            function openIframe(url, name) {
                if (!url) return;
                document.getElementById('iframe-name').textContent = name || url;
                const ext = url.substring(url.lastIndexOf('.') + 1);
                document.getElementById('iframe-ext').textContent = ext.toUpperCase();
                document.getElementById('iframe-ext').className = 'file-ext ' + ext;
                document.getElementById('if-open').href = url;
                document.getElementById('if-location').textContent = currentZone ? currentZone.label : 'External';
                document.getElementById('if-dot').style.backgroundColor = currentZone ? currentZone.color : '#888';
                document.getElementById('iframe-frame').src = url;
                document.getElementById('iframe-viewer').classList.add('active');
            }

            function closeIframe() {
                document.getElementById('iframe-viewer').classList.remove('active');
                document.getElementById('iframe-frame').src = '';
            }

            // Events
            document.getElementById('btn-play').onclick = togglePlay;
            document.getElementById('btn-theme').onclick = () => {
                isDark = !isDark;
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
                document.getElementById('btn-theme').textContent = isDark ? 'L' : 'D';
                draw();
                renderConnections();
            };
            document.getElementById('btn-conn').onclick = () => {
                const svg = document.getElementById('connections');
                svg.style.display = svg.style.display === 'none' ? 'block' : 'none';
            };
            document.getElementById('btn-legend').onclick = () => {
                const leg = document.getElementById('map-legend');
                leg.style.display = leg.style.display === 'none' ? 'block' : 'none';
            };

            document.getElementById('z-close').onclick = closeZoneModal;
            document.getElementById('backdrop').onclick = closeZoneModal;
            document.getElementById('if-close').onclick = closeIframe;
            document.getElementById('if-prev').onclick = () => {
                if (!currentZone || !currentZone.artifacts) return;
                currentFileIndex = (currentFileIndex - 1 + currentZone.artifacts.length) % currentZone.artifacts.length;
                const url = currentZone.artifacts[currentFileIndex];
                openIframe(url, url.split('/').pop());
            };
            document.getElementById('if-next').onclick = () => {
                if (!currentZone || !currentZone.artifacts) return;
                currentFileIndex = (currentFileIndex + 1) % currentZone.artifacts.length;
                const url = currentZone.artifacts[currentFileIndex];
                openIframe(url, url.split('/').pop());
            };

            window.onresize = init;
            init();
        })();
    </script>
</body>

</html>

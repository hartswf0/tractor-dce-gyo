<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>The Arena — seven prompts, seven castles, built step by step</title>
<link rel="icon" type="image/svg+xml" href="ball-jar-favicon.svg" />
<style>
:root{
  --bg:#0b0d10; --panel:#11151a; --line:#1e252d; --ink:#dde3ea; --dim:#7d8994; --dimmer:#4d5761;
  --hot:#ff7043; --win:#5cc98b; --loss:#e2565a; --acc:#7fb2ff; --ghost:#232b34;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--mono);overflow:hidden}
a{color:var(--acc);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:2px;cursor:pointer;padding:3px 9px}
button:hover{border-color:var(--dim)}
button.on{background:#1a222b;border-color:var(--hot);color:#fff}
button:disabled{opacity:.35;cursor:default}

#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100dvh}
header{display:flex;gap:14px;align-items:baseline;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{margin:0;font-size:14px;font-weight:normal;letter-spacing:.06em;text-transform:uppercase}
header .sub{color:var(--dim);font-size:12px}
header .right{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--dim);font-size:12px}

#seeds{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.seed{white-space:nowrap;display:flex;gap:8px;align-items:baseline;padding:5px 10px;border:1px solid var(--line);border-radius:2px;cursor:pointer;background:var(--panel)}
.seed:hover{border-color:var(--dim)}
.seed.on{border-color:var(--hot);background:#1a222b}
.seed b{font-weight:600;letter-spacing:.04em}
.seed .wl{font-size:11px;color:var(--dim)}
.seed .wl i{font-style:normal;color:var(--win)}
.seed .wl s{text-decoration:none;color:var(--loss)}

main{display:grid;grid-template-columns:1fr 380px;min-height:0}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:minmax(240px,44dvh) 1fr}}
#stage{position:relative;min-width:0;min-height:0;background:radial-gradient(120% 90% at 50% 30%,#12171d 0%,#0b0d10 70%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#hud{position:absolute;left:12px;top:10px;font-size:11px;color:var(--dim);pointer-events:none;line-height:1.6}
#hud b{color:var(--ink);font-weight:600}
#viewbtns{position:absolute;right:10px;top:10px;display:flex;gap:5px}
#viewbtns button{font-size:11px;padding:2px 7px;background:rgba(11,13,16,.7)}
@media(max-width:900px){#hud .tag{display:none}#hud{font-size:10px;max-width:62%}}
#caption{position:absolute;left:12px;right:12px;bottom:10px;font-size:12px;color:var(--dim);pointer-events:none}
#caption b{color:var(--hot);font-weight:600}
#hint{position:absolute;left:12px;bottom:30px;font-size:11px;color:var(--dimmer);pointer-events:none;transition:opacity .6s}
#hint.gone{opacity:0}

aside{border-left:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;min-height:0;background:var(--panel)}
@media(max-width:900px){aside{border-left:none;border-top:1px solid var(--line)}}
#tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#tabs button{font-size:11px;letter-spacing:.05em}
#pane{overflow:auto;padding:10px 12px;min-height:0;scrollbar-width:thin}
#pane h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px;font-weight:normal}
#pane h3:first-child{margin-top:0}
#pane p{margin:0 0 8px;color:var(--ink)}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 var(--mono);color:var(--ink);margin:0}
.trace .row{padding:3px 6px;border-left:2px solid transparent;cursor:pointer;font-size:12px;color:var(--dim)}
.trace .row:hover{background:#161c23}
.trace .row.on{border-left-color:var(--hot);background:#1a222b;color:var(--ink)}
.trace .row .n{color:var(--dimmer);margin-right:7px}
.trace .row .rep{display:block;color:var(--dimmer);font-size:11px;padding-left:26px}
.trace .row.on .rep{color:var(--dim)}
.trace .ref{color:var(--loss);font-size:11px;padding:2px 6px 2px 32px}
.ev{margin:0 0 8px;border-left:2px solid var(--line);padding:2px 0 2px 8px}
.ev .lab{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dimmer);margin-bottom:2px}
.ev pre{font-size:11.5px;line-height:1.45;color:var(--dim)}
.ev.think{border-left-color:#4b6b8a}.ev.think pre{color:#a9bacb}
.ev.say{border-left-color:var(--acc)}.ev.say pre{color:var(--ink)}
.ev.run{border-left-color:var(--hot)}.ev.run pre{color:#e7b08a}
.ev.back pre{color:var(--dimmer)}
.ev.err{border-left-color:var(--loss)}.ev.err pre{color:#e2565a}
.axes{width:100%;border-collapse:collapse;font-size:12px}
.axes td{padding:2px 6px 2px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.axes td:last-child{white-space:normal}
.axes td.v{width:44px}
.axes .W{color:var(--win)}.axes .L{color:var(--loss)}
.bar{position:relative;height:7px;background:#141a21;border:1px solid var(--line);min-width:110px}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--dimmer)}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--hot);text-decoration:none}
.kv{color:var(--dim)}.kv b{color:var(--ink);font-weight:600}
.warn{color:var(--hot)}

footer{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
footer .t{color:var(--dim);font-size:12px;min-width:150px}
footer .t b{color:var(--ink)}
#scrub{flex:1;min-width:160px;accent-color:var(--hot)}
.speed{display:flex;gap:4px}
.speed button{font-size:11px;padding:2px 7px}
#err{position:fixed;inset:auto 12px 12px 12px;background:#2a1416;border:1px solid var(--loss);padding:10px;font-size:12px;display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>The Arena</h1>
    <span class="sub">seven prompts · seven agents · seven castles · one world · judged blind against <b id="bar">a real kit</b></span>
    <span class="right"><a href="builds.html">builds</a> · <a href="kits.html">kits</a> · <a href="slipcase/index.html">slipcase</a></span>
  </header>
  <div id="seeds"></div>
  <main>
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="hud"></div>
      <div id="viewbtns">
        <button data-view="iso">iso</button><button data-view="spin" id="spinbtn">spin</button>
        <button data-view="front">front</button><button data-view="back">back</button>
        <button data-view="top">top</button><button data-view="ghost" id="ghostbtn">ghost</button>
      </div>
      <div id="caption"></div>
      <div id="hint">drag to orbit · wheel to zoom · shift-drag to pan · space plays</div>
    </div>
    <aside>
      <div id="tabs">
        <button data-tab="trace" class="on">trace</button>
        <button data-tab="verdict">verdict</button>
        <button data-tab="reasoning">reasoning</button>
        <button data-tab="cost">token burn</button>
        <button data-tab="prompt">prompt</button>
        <button data-tab="notes">notes</button>
        <button data-tab="world">world</button>
      </div>
      <div id="pane"></div>
    </aside>
  </main>
  <footer>
    <button id="first" title="first step">⏮</button>
    <button id="prev" title="back one">◀</button>
    <button id="play" title="play">▶</button>
    <button id="next" title="forward one">▶|</button>
    <button id="last" title="finished">⏭</button>
    <input id="scrub" type="range" min="0" max="1" value="0" />
    <span class="t" id="tcount">step 0 / 0</span>
    <span class="speed">
      <button data-sp="1">1×</button><button data-sp="4" class="on">4×</button>
      <button data-sp="12">12×</button><button data-sp="40">40×</button>
    </span>
  </footer>
</div>
<div id="err"></div>
<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fail = m => { const e = $('#err'); e.style.display = 'block'; e.textContent = m; };

// ── state
const V = { data: null, traces: null, spin: 0, filter: 'all', seed: null, step: 0, playing: false, speed: 4, ghost: true,
            yaw: -0.62, pitch: 0.58, zoom: 1, pan: { x: 0, y: 0 }, tab: 'trace', raf: 0, acc: 0, last: 0 };

// ── canvas 3D: every piece is its catalogue box, painter-sorted. No WebGL, no loader:
// the vendored LDraw loader crashes on part 60592 (a window every castle uses), and a
// picture you cannot trust is worse than none.
const cv = $('#c'), ctx = cv.getContext('2d');
function resize() {
  const r = cv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, r.width * d); cv.height = Math.max(1, r.height * d);
  ctx.setTransform(d, 0, 0, d, 0, 0); draw();
}
function rot(x, y, z) {                       // LDraw: y grows downward
  const cy = Math.cos(V.yaw), sy = Math.sin(V.yaw);
  const X = x * cy + z * sy, Z = -x * sy + z * cy;
  const cp = Math.cos(V.pitch), sp = Math.sin(V.pitch);
  return { x: X, y: y * cp + Z * sp, d: Z * cp - y * sp };
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (n >> 16 & 255) * f) | 0, g = Math.min(255, (n >> 8 & 255) * f) | 0, b = Math.min(255, (n & 255) * f) | 0;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function fit(steps) {
  let m = { x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9 };
  for (const s of steps) {
    for (let i = 0; i < 8; i++) {
      const p = rot(i & 1 ? s.b[3] : s.b[0], i & 2 ? s.b[4] : s.b[1], i & 4 ? s.b[5] : s.b[2]);
      if (p.x < m.x0) m.x0 = p.x; if (p.x > m.x1) m.x1 = p.x;
      if (p.y < m.y0) m.y0 = p.y; if (p.y > m.y1) m.y1 = p.y;
    }
  }
  return m;
}
function draw() {
  const S = V.seed; if (!S) return;
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0, 0, W, H);
  const all = S.steps, shown = all.slice(0, V.step);
  const m = fit(all);
  const sc = Math.min((W - 60) / Math.max(m.x1 - m.x0, 1), (H - 70) / Math.max(m.y1 - m.y0, 1)) * V.zoom;
  const ox = W / 2 - (m.x0 + m.x1) / 2 * sc + V.pan.x, oy = H / 2 - (m.y0 + m.y1) / 2 * sc + V.pan.y;
  const P = (x, y, z) => { const p = rot(x, y, z); return [p.x * sc + ox, p.y * sc + oy, p.d]; };
  const face = (pts, fill, stroke, alpha) => {
    ctx.globalAlpha = alpha; ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.globalAlpha = 1;
  };
  const box = (s, alpha, hi) => {
    const [x0, y0, z0, x1, y1, z1] = s.b;
    const hex = V.data.colours[String(s.c)] || '#9aa4ad';
    const c = rot((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    // the three faces that point at the camera
    const xf = rot(1, 0, 0).d < 0 ? x1 : x0, zf = rot(0, 0, 1).d < 0 ? z1 : z0;
    const top = [P(x0, y0, z0), P(x1, y0, z0), P(x1, y0, z1), P(x0, y0, z1)];
    const sx = [P(xf, y0, z0), P(xf, y0, z1), P(xf, y1, z1), P(xf, y1, z0)];
    const sz = [P(x0, y0, zf), P(x1, y0, zf), P(x1, y1, zf), P(x0, y1, zf)];
    const edge = hi ? '#fff' : 'rgba(0,0,0,.45)';
    face(sz, shade(hex, .70), edge, alpha);
    face(sx, shade(hex, .86), edge, alpha);
    face(top, shade(hex, 1.08), edge, alpha);
    if (hi) { ctx.globalAlpha = 1; ctx.strokeStyle = '#ff7043'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(top[0][0], top[0][1]); for (let i = 1; i < 4; i++) ctx.lineTo(top[i][0], top[i][1]); ctx.closePath(); ctx.stroke(); }
    return c.d;
  };
  const depth = s => rot((s.b[0] + s.b[3]) / 2, (s.b[1] + s.b[4]) / 2, (s.b[2] + s.b[5]) / 2).d;
  if (V.ghost) {
    // what is still to come, as a wireframe target: the shape fills itself in
    const rest = all.slice(V.step).slice().sort((a, b) => depth(b) - depth(a));
    ctx.globalAlpha = .5; ctx.strokeStyle = '#38434f'; ctx.lineWidth = 1;
    for (const s of rest) {
      const [x0, y0, z0, x1, y1, z1] = s.b;
      const t = [P(x0, y0, z0), P(x1, y0, z0), P(x1, y0, z1), P(x0, y0, z1)];
      const bo = [P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)];
      ctx.beginPath();
      ctx.moveTo(t[0][0], t[0][1]); for (let i = 1; i < 4; i++) ctx.lineTo(t[i][0], t[i][1]); ctx.closePath();
      for (let i = 0; i < 4; i++) { ctx.moveTo(t[i][0], t[i][1]); ctx.lineTo(bo[i][0], bo[i][1]); }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  const order = shown.slice().sort((a, b) => depth(b) - depth(a));
  for (const s of order) box(s, 1, false);
  const cur = shown[shown.length - 1]; if (cur) box(cur, 1, true);
  const g = cur && cur.g ? ' · in <b>' + esc(cur.g) + '</b>' : '';
  $('#caption').innerHTML = cur ? ('placing <b>' + esc(cur.d) + '</b>' + g) : 'the empty plate';
}

// ── panels
function paneTrace() {
  const S = V.seed, p = el('div', 'trace');
  if (S.cutoff) p.appendChild(el('div', 'warn', 'This run was ' + esc(S.cutoff) + '. What follows is the trace up to the moment it stopped.'));
  if (S.mode === 'composed') {
    p.appendChild(el('h3', null, 'no per-piece trace'));
    p.appendChild(el('p', 'kv', S.id === 'BASE'
      ? 'Nobody drove this one. The layered builder ran unattended; the steps below are the order its own file carries, layer by layer.'
      : 'This agent never placed a piece. It ' + (S.id === 'S06' ? 'answered events by changing one plan parameter per round' : 'wrote a card and recompiled it') + '; the steps below are the order the compiled file carries. Its rounds are under <b>verdict</b>.'));
  }
  let last = null;
  S.steps.forEach((s, i) => {
    if (s.refused) for (const r of s.refused) p.appendChild(el('div', 'ref', esc(r)));
    const label = s.cmd ? esc(s.cmd) : (s.g && s.g !== last ? '— ' + esc(s.g) + ' —' : esc(s.d));
    last = s.g;
    const row = el('div', 'row' + (i === V.step - 1 ? ' on' : ''),
      '<span class="n">' + String(i).padStart(3, '0') + '</span>' + label +
      (s.reply ? '<span class="rep">' + esc(s.reply) + '</span>' : ''));
    row.onclick = () => { setStep(i + 1); };
    p.appendChild(row);
  });
  return p;
}
function paneVerdict() {
  const S = V.seed, p = el('div');
  p.appendChild(el('h3', null, 'against ' + esc(V.data.bar) + ' — blind, per axis, never summed, ties to the kit'));
  const t = el('table', 'axes');
  for (const a of S.axes) {
    const v = a.verdict === 'WIN' ? 'W' : a.verdict === 'LOSS' ? 'L' : 'T';
    const max = Math.max(a.ours, a.bar) * 1.15 || 1;
    t.appendChild(el('tr', null,
      '<td>' + esc(a.id.replace('AX-', '')) + '</td>' +
      '<td class="v ' + v + '">' + v + '</td>' +
      '<td><div class="bar"><i style="width:' + (100 * a.ours / max).toFixed(1) + '%"></i>' +
        '<u style="left:' + (100 * a.bar / max).toFixed(1) + '%"></u></div></td>' +
      '<td class="kv">' + (+a.ours).toFixed(2) + ' <span style="color:var(--dimmer)">vs ' + (+a.bar).toFixed(2) + '</span></td>'));
  }
  p.appendChild(t);
  p.appendChild(el('h3', null, 'the shadow number the critic cannot see'));
  const inb = S.share >= V.data.band[0] && S.share <= V.data.band[1];
  p.appendChild(el('p', 'kv', 'structural open-stud share <b>' + S.share + '</b> — ' +
    (inb ? 'inside' : '<span class="warn">outside</span>') + ' the kit band ' + V.data.band[0] + '–' + V.data.band[1] +
    '. A stud faces air when nothing sits on it; the ground plate does not count.'));
  const c = S.counts || {};
  const bits = [];
  if (c.calls != null) bits.push('world calls <b>' + c.calls + '</b>');
  if (c.seated != null) bits.push('seated <b>' + c.seated + '</b>');
  if (c.refusals != null) bits.push('refusals <b>' + c.refusals + '</b>');
  if (c.undos) bits.push('undos <b>' + c.undos + '</b>');
  if (c.named) bits.push('nouns coined <b>' + c.named + '</b>');
  if (c.instances) bits.push('instances <b>' + c.instances + '</b>');
  if (c.joints && (c.joints.right || c.joints.wrong)) bits.push('JOINTS predictions <b>' + c.joints.right + ' right / ' + c.joints.wrong + ' wrong</b>');
  if (c.rounds) bits.push('rounds <b>' + c.rounds + '</b>');
  if (bits.length) { p.appendChild(el('h3', null, 'what the run cost')); p.appendChild(el('p', 'kv', bits.join(' · '))); }
  if (c.refusals && S.mode === 'placed') p.appendChild(el('p', 'kv',
    'The world counted every refusal but only recorded the text of some of them, so the trace shows fewer refusals than this count.'));
  if (S.rounds && S.rounds.length) {
    p.appendChild(el('h3', null, 'round by round'));
    const t2 = el('table', 'axes');
    t2.appendChild(el('tr', null, '<td class="kv">round</td><td class="kv">pieces</td><td class="kv">W/L</td><td class="kv">open share</td>'));
    for (const r of S.rounds) t2.appendChild(el('tr', null,
      '<td>' + r.n + '</td><td class="kv">' + (r.pieces != null ? r.pieces : '—') + '</td>' +
      '<td class="kv">' + (r.wins != null ? r.wins + '/' + r.losses : '—') + '</td>' +
      '<td class="kv">' + (r.share != null ? r.share : '—') + '</td>'));
    p.appendChild(t2);
    for (const r of S.rounds) if (r.spec) {
      p.appendChild(el('h3', null, 'round ' + r.n + ' — what was changed'));
      p.appendChild(el('pre', null, esc(r.spec)));
    }
  }
  return p;
}
function panePrompt() {
  const S = V.seed, p = el('div');
  if (!S.prompt && !S.brief) { p.appendChild(el('p', 'kv', 'No prompt: this castle had no agent. The layered builder compiled the castle card on its own.')); return p; }
  p.appendChild(el('h3', null, 'the seed prompt'));
  p.appendChild(el('pre', null, esc(S.prompt)));
  p.appendChild(el('h3', null, 'the brief this agent was given'));
  p.appendChild(el('pre', null, esc(S.brief)));
  p.appendChild(el('h3', null, 'the common brief (every agent got this too)'));
  p.appendChild(el('pre', null, esc(V.data.common)));
  return p;
}
function paneNotes() {
  const S = V.seed, p = el('div');
  p.appendChild(el('pre', null, esc(S.notes || 'No notes for this build.')));
  return p;
}
function fmt(n) { return (n == null ? '—' : n.toLocaleString()); }
function paneReasoning() {
  const S = V.seed, p = el('div');
  const T = V.traces && V.traces.seeds ? V.traces.seeds[S.id] : null;
  if (!T) { p.appendChild(el('p', 'kv', S.id === 'BASE'
    ? 'No agent, so no reasoning: the layered builder compiled the card by itself.'
    : 'No transcript was recorded for this build.')); return p; }
  const n = k => T.events.filter(e => e.k === k).length;
  p.appendChild(el('h3', null, T.events.length + ' recorded events — the agent\'s own transcript'));
  p.appendChild(el('p', 'kv', n('think') + ' thinking · ' + n('say') + ' said · ' + n('run') + ' commands · ' +
    n('back') + ' replies from the world (' + T.events.filter(e => e.err).length + ' errors). ' + esc(T.note)));
  const filt = el('div', null, '');
  for (const [k, lab] of [['all', 'everything'], ['think', 'thinking only'], ['run', 'commands only'], ['err', 'errors only']]) {
    const b = el('button', 'flt' + (V.filter === k ? ' on' : ''), lab);
    b.style.cssText = 'font-size:11px;margin:0 4px 8px 0';
    b.onclick = () => { V.filter = k; renderPane(); };
    filt.appendChild(b);
  }
  p.appendChild(filt);
  const keep = e => V.filter === 'all' || !V.filter ? true : V.filter === 'err' ? e.err : e.k === V.filter;
  for (const e of T.events) {
    if (!keep(e)) continue;
    if (e.k === 'think') p.appendChild(el('div', 'ev think', '<span class="lab">thinking</span><pre>' + esc(e.s) + '</pre>'));
    else if (e.k === 'say') p.appendChild(el('div', 'ev say', '<span class="lab">says</span><pre>' + esc(e.s) + '</pre>'));
    else if (e.k === 'run') p.appendChild(el('div', 'ev run', '<span class="lab">' + esc(e.tool) + '</span><pre>' + esc(e.s) + '</pre>'));
    else p.appendChild(el('div', 'ev back' + (e.err ? ' err' : ''), '<span class="lab">' + (e.err ? 'error' : 'the world') + '</span><pre>' + esc(e.s) + '</pre>'));
  }
  return p;
}
function paneCost() {
  const S = V.seed, p = el('div');
  const T = V.traces && V.traces.seeds ? V.traces.seeds[S.id] : null;
  if (!T) { p.appendChild(el('p', 'kv', S.id === 'BASE' ? 'No agent ran, so nothing was spent on tokens. The layered builder is ordinary code.' : 'No transcript was recorded for this build.')); return p; }
  const u = T.usage, all = V.traces.seeds;
  const tot = Object.values(all).reduce((a, s) => (a.output += s.usage.output, a.requests += s.usage.requests, a.cache_read += s.usage.cache_read, a.cache_write += s.usage.cache_write, a.input += s.usage.input, a), { output: 0, requests: 0, cache_read: 0, cache_write: 0, input: 0 });
  p.appendChild(el('h3', null, 'what this agent burned'));
  const t = el('table', 'axes');
  const row = (k, v, note) => t.appendChild(el('tr', null, '<td>' + k + '</td><td class="kv" style="text-align:right"><b>' + v + '</b></td><td class="kv">' + (note || '') + '</td>'));
  row('model requests', fmt(u.requests), '');
  row('output tokens', fmt(u.output), 'what it wrote: reasoning and commands');
  row('input tokens', fmt(u.input), 'fresh, uncached');
  row('cache written', fmt(u.cache_write), '');
  row('cache read', fmt(u.cache_read), 'the bulk of the burn: context re-read each turn');
  row('wall clock', T.seconds != null ? (Math.floor(T.seconds / 60) + 'm ' + (T.seconds % 60) + 's') : '—', '');
  row('tool calls', fmt(Object.values(T.tools).reduce((a, b) => a + b, 0)), Object.entries(T.tools).sort((a, b) => b[1] - a[1]).map(x => x[0] + '×' + x[1]).join(', '));
  if (S.pieces) row('output tokens per piece', Math.round(u.output / S.pieces).toLocaleString(), S.pieces + ' pieces placed');
  p.appendChild(t);
  p.appendChild(el('h3', null, 'all seven, side by side'));
  const t2 = el('table', 'axes');
  t2.appendChild(el('tr', null, '<td class="kv">seed</td><td class="kv" style="text-align:right">requests</td><td class="kv" style="text-align:right">output</td><td class="kv" style="text-align:right">cache read</td><td class="kv" style="text-align:right">pieces</td><td class="kv" style="text-align:right">W/L</td>'));
  for (const s of V.data.seeds) {
    const q = all[s.id]; if (!q) continue;
    t2.appendChild(el('tr', null, '<td' + (s.id === S.id ? ' style="color:var(--hot)"' : '') + '>' + s.id + '</td>' +
      '<td class="kv" style="text-align:right">' + fmt(q.usage.requests) + '</td>' +
      '<td class="kv" style="text-align:right">' + fmt(q.usage.output) + '</td>' +
      '<td class="kv" style="text-align:right">' + fmt(q.usage.cache_read) + '</td>' +
      '<td class="kv" style="text-align:right">' + s.pieces + '</td>' +
      '<td class="kv" style="text-align:right">' + s.wins + '/' + s.losses + '</td>'));
  }
  t2.appendChild(el('tr', null, '<td><b>all</b></td><td class="kv" style="text-align:right"><b>' + fmt(tot.requests) + '</b></td><td class="kv" style="text-align:right"><b>' + fmt(tot.output) + '</b></td><td class="kv" style="text-align:right"><b>' + fmt(tot.cache_read) + '</b></td><td></td><td></td>'));
  p.appendChild(t2);
  p.appendChild(el('p', 'kv', 'Cache reads dominate because every turn re-reads the whole conversation. Output tokens are the honest measure of how much each agent actually wrote.'));
  return p;
}
function paneWorld() {
  const p = el('div');
  p.appendChild(el('h3', null, 'the world every agent shared'));
  p.appendChild(el('pre', null, esc(V.data.world)));
  return p;
}
function renderPane() {
  const p = $('#pane'); p.innerHTML = '';
  p.appendChild({ trace: paneTrace, verdict: paneVerdict, reasoning: paneReasoning, cost: paneCost, prompt: panePrompt, notes: paneNotes, world: paneWorld }[V.tab]());
  if (V.tab === 'trace') { const on = p.querySelector('.row.on'); if (on) on.scrollIntoView({ block: 'center' }); }
  else p.scrollTop = 0;
}

// ── transport
function setStep(n, quiet) {
  const S = V.seed; if (!S) return;
  V.step = Math.max(0, Math.min(S.steps.length, n));
  $('#scrub').value = V.step;
  $('#tcount').innerHTML = 'step <b>' + V.step + '</b> / ' + S.steps.length;
  draw();
  if (!quiet && V.tab === 'trace') {
    const rows = $('#pane').querySelectorAll('.row');
    rows.forEach((r, i) => r.classList.toggle('on', i === V.step - 1));
    const on = $('#pane').querySelector('.row.on');
    if (on) { const box = $('#pane'), t = on.offsetTop - box.clientHeight / 2; box.scrollTop = Math.max(0, t); }
  }
}
function tick(ts) {
  if (!V.playing) return;
  if (!V.last) V.last = ts;
  const dt = Math.min(0.25, (ts - V.last) / 1000); V.last = ts;
  V.acc += dt * V.speed * 2.2;
  while (V.acc >= 1) { V.acc -= 1; if (V.step >= V.seed.steps.length) { stop(); break; } setStep(V.step + 1); }
  V.raf = requestAnimationFrame(tick);
}
function play() { if (V.step >= V.seed.steps.length) setStep(0); V.playing = true; V.last = 0; $('#play').textContent = '⏸'; $('#play').classList.add('on'); V.raf = requestAnimationFrame(tick); }
function stop() { V.playing = false; cancelAnimationFrame(V.raf); $('#play').textContent = '▶'; $('#play').classList.remove('on'); }

let spinRaf = 0, spinLast = 0;
function spin(ts) {
  if (!V.spin) { cancelAnimationFrame(spinRaf); return; }
  if (ts) { if (spinLast) V.yaw += Math.min(0.05, (ts - spinLast) / 1000) * 0.45; spinLast = ts; }
  draw(); spinRaf = requestAnimationFrame(spin);
}
function fadeHint() { const e = $('#hint'); if (e) setTimeout(() => e.classList.add('gone'), 6000); }

function pickSeed(id) {
  stop();
  V.seed = V.data.seeds.find(s => s.id === id) || V.data.seeds[0];
  document.querySelectorAll('.seed').forEach(b => b.classList.toggle('on', b.dataset.id === V.seed.id));
  $('#scrub').max = V.seed.steps.length;
  const S = V.seed;
  $('#hud').innerHTML = '<b>' + esc(S.id) + '</b> ' + esc(S.name) + '<span class="tag"><br>' + esc(S.tagline) + '</span>' +
    '<br>' + S.pieces + ' pieces · ' + S.blocks + ' block' + (S.blocks === 1 ? '' : 's') +
    ' · <span style="color:var(--win)">' + S.wins + 'W</span>/<span style="color:var(--loss)">' + S.losses + 'L</span>' +
    ' · open ' + S.share + (S.cutoff ? '<br><span style="color:var(--hot)">unfinished — ' + esc(S.cutoff) + '</span>' : '');
  setStep(0, true); renderPane();
  location.hash = S.id;
}

function boot(data) {
  V.data = data;
  $('#bar').textContent = data.bar;
  const box = $('#seeds');
  for (const s of data.seeds) {
    const b = el('button', 'seed', '<b>' + esc(s.id) + '</b> ' + esc(s.name) +
      ' <span class="wl"><i>' + s.wins + 'W</i>/<s>' + s.losses + 'L</s> · ' + s.pieces + 'p</span>');
    b.dataset.id = s.id; b.onclick = () => pickSeed(s.id); box.appendChild(b);
  }
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
    V.tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); renderPane();
  });
  document.querySelectorAll('.speed button').forEach(b => b.onclick = () => {
    V.speed = +b.dataset.sp; document.querySelectorAll('.speed button').forEach(x => x.classList.toggle('on', x === b));
  });
  document.querySelectorAll('#viewbtns button').forEach(b => b.onclick = () => {
    const v = b.dataset.view;
    if (v === 'iso') { V.yaw = -0.62; V.pitch = 0.58; V.zoom = 1; V.pan = { x: 0, y: 0 }; }
    if (v === 'front') { V.yaw = 0; V.pitch = 0.18; }
    if (v === 'back') { V.yaw = Math.PI; V.pitch = 0.18; }
    if (v === 'top') { V.yaw = -0.62; V.pitch = 1.35; }
    if (v === 'spin') { V.spin = V.spin ? 0 : 1; b.classList.toggle('on', !!V.spin); if (V.spin) spin(); }
    if (v === 'ghost') { V.ghost = !V.ghost; b.classList.toggle('on', V.ghost); }
    draw();
  });
  $('#ghostbtn').classList.add('on');
  $('#play').onclick = () => V.playing ? stop() : play();
  $('#next').onclick = () => { stop(); setStep(V.step + 1); };
  $('#prev').onclick = () => { stop(); setStep(V.step - 1); };
  $('#first').onclick = () => { stop(); setStep(0); };
  $('#last').onclick = () => { stop(); setStep(V.seed.steps.length); };
  $('#scrub').oninput = e => { stop(); setStep(+e.target.value); };
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' ') { e.preventDefault(); V.playing ? stop() : play(); }
    if (e.key === 'ArrowRight') { stop(); setStep(V.step + (e.shiftKey ? 10 : 1)); }
    if (e.key === 'ArrowLeft') { stop(); setStep(V.step - (e.shiftKey ? 10 : 1)); }
    if (e.key === 'g') { V.ghost = !V.ghost; $('#ghostbtn').classList.toggle('on', V.ghost); draw(); }
  });
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw: V.yaw, pitch: V.pitch, pan: { ...V.pan }, shift: e.shiftKey }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (drag.shift) { V.pan = { x: drag.pan.x + dx, y: drag.pan.y + dy }; }
    else { V.yaw = drag.yaw + dx * 0.008; V.pitch = Math.max(-0.2, Math.min(1.45, drag.pitch + dy * 0.006)); }
    draw();
  });
  addEventListener('pointerup', () => { drag = null; });
  cv.addEventListener('wheel', e => { e.preventDefault(); V.zoom = Math.max(0.3, Math.min(6, V.zoom * (e.deltaY < 0 ? 1.12 : 0.9))); draw(); }, { passive: false });
  addEventListener('resize', resize);
  const want = decodeURIComponent(location.hash.slice(1));
  pickSeed(data.seeds.some(s => s.id === want) ? want : 'S01');
  resize(); fadeHint();
}

Promise.all([
  fetch('./arena-data.json').then(r => { if (!r.ok) throw new Error('arena-data.json HTTP ' + r.status); return r.json(); }),
  fetch('./arena-traces.json').then(r => r.ok ? r.json() : null).catch(() => null)
]).then(([d, t]) => { V.traces = t; boot(d); })
  .catch(e => fail('arena-data.json did not load (' + e.message + '). This page reads it over HTTP — open it from a served copy, not from a file:// path.'));
})();
</script>
</body>
</html>

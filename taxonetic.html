<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taxonetic – Parts Taxonomy + 3D Preview</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --border: rgba(255,255,255,0.1);
      --accent-red: #d02c2f;
      --accent-green: #22c55e;
      --accent-blue: #3b82f6;
      --text: #e5e7eb;
      --text-muted: #888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body { display: flex; flex-direction: column; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, var(--accent-red) 0%, #1a1a1a 30%);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span { color: var(--accent-red); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;
      font-size: 11px;
      background: rgba(255,255,255,0.1);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover { background: rgba(255,255,255,0.2); }
    .btn-primary { background: var(--accent-green); }
    .btn-primary:hover { background: #16a34a; }

    .main {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--border);
      position: relative;
    }

    .panel:last-child { border-right: none; }

    .panel-header {
      padding: 8px 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-body {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .panel iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
      background: white;
    }

    #panel-taxonomy { flex: 0 0 420px; }
    #panel-viewer { flex: 1; }
    #panel-viewer iframe { background: #1a1a1a; }

    .collection-bar {
      padding: 8px 12px;
      background: #111;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .collection-count {
      background: var(--accent-green);
      color: white;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .collection-actions { margin-left: auto; display: flex; gap: 6px; }

    /* Mobile layout */
    @media (max-width: 800px) {
      .main { flex-direction: column; }
      #panel-taxonomy { flex: 0 0 50%; border-right: none; border-bottom: 1px solid var(--border); }
      #panel-viewer { flex: 1; }
    }

    /* Loading state */
    .panel-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="logo">Tax<span>onetic</span></div>
      <span style="font-size: 10px; color: var(--text-muted);">Parts Taxonomy + 3D Preview</span>
    </div>
    <div class="header-right">
      <span id="collection-indicator" style="font-size: 11px; color: var(--accent-green);">0 parts selected</span>
      <button class="btn" onclick="refreshViewer()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        Refresh 3D
      </button>
      <button class="btn btn-primary" onclick="load3DPreview()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Load in 3D
      </button>
    </div>
  </header>

  <main class="main">
    <section class="panel" id="panel-taxonomy">
      <div class="panel-header">
        <span>Parts Taxonomy</span>
        <span id="tax-status" style="color: var(--accent-green);">Ready</span>
      </div>
      <div class="panel-body">
        <iframe id="taxonomy-frame" src="taxonomizer.html?embed=1" title="Parts Taxonomy"></iframe>
      </div>
    </section>

    <section class="panel" id="panel-viewer">
      <div class="panel-header">
        <span>3D Preview</span>
        <span id="viewer-status" style="color: var(--text-muted);">Select parts to preview</span>
      </div>
      <div class="panel-body">
        <div id="viewer-loading" class="panel-loading">
          <span>Waiting for parts...</span>
        </div>
        <iframe id="viewer-frame" src="" title="3D Viewer" style="display: none;"></iframe>
      </div>
    </section>
  </main>

  <script>
    const taxonomyFrame = document.getElementById('taxonomy-frame');
    const viewerFrame = document.getElementById('viewer-frame');
    const viewerLoading = document.getElementById('viewer-loading');
    const collectionIndicator = document.getElementById('collection-indicator');
    const viewerStatus = document.getElementById('viewer-status');

    let currentCollection = [];

    // Listen for messages from taxonomizer
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;

      if (msg.type === 'taxonetic-collection-update') {
        currentCollection = msg.collection || [];
        collectionIndicator.textContent = `${currentCollection.length} parts selected`;
        
        if (currentCollection.length > 0) {
          viewerLoading.innerHTML = `<span>${currentCollection.length} parts ready – click "Load in 3D"</span>`;
        } else {
          viewerLoading.innerHTML = '<span>Waiting for parts...</span>';
        }
      }

      if (msg.type === 'taxonetic-load-3d') {
        load3DPreview();
      }
    });

    function load3DPreview() {
      if (currentCollection.length === 0) {
        alert('Add some parts to your collection first!');
        return;
      }

      // Generate MPD content
      let mpd = '0 FILE collection.ldr\n';
      mpd += '0 Name: Taxonetic Preview\n';
      mpd += '0 Author: Taxonetic Studio\n\n';

      currentCollection.slice(0, 50).forEach((part, i) => {
        const x = (i % 8) * 50;
        const z = Math.floor(i / 8) * 50;
        const colors = [1, 4, 14, 15, 2, 6, 3, 5, 7, 0, 71, 72, 73, 74, 75];
        const color = colors[i % colors.length];
        let path = part.path || part.filename || `${part.partNum}.dat`;
        if (!path.startsWith('parts/')) path = `parts/${path}`;
        mpd += `1 ${color} ${x} 0 ${z} 1 0 0 0 1 0 0 0 1 ${path}\n`;
      });

      // Base64 encode the MPD
      const mpdBase64 = btoa(mpd);
      
      // Load wag-courage with the MPD
      const wagUrl = 'wag-viewer-prime-integration-20251112-055341 copy/wag-courage.html';
      viewerFrame.src = `${wagUrl}?mpd=${encodeURIComponent(mpdBase64)}&embed=1`;
      viewerFrame.style.display = 'block';
      viewerLoading.style.display = 'none';
      viewerStatus.textContent = `Showing ${Math.min(currentCollection.length, 50)} parts`;
      viewerStatus.style.color = 'var(--accent-green)';
    }

    function refreshViewer() {
      if (viewerFrame.src) {
        viewerFrame.src = viewerFrame.src;
      }
    }

    // Periodically poll taxonomizer for collection updates
    setInterval(() => {
      if (taxonomyFrame.contentWindow) {
        try {
          taxonomyFrame.contentWindow.postMessage({ type: 'taxonetic-get-collection' }, '*');
        } catch (e) {}
      }
    }, 2000);
  </script>
</body>
</html>

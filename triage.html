<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Triage</title>
<link rel="icon" type="image/svg+xml" href="ball-jar-favicon.svg" />
<style>
:root{
  --bg:#f2efe6; --line:#ddd6c2; --hair:#e9e3d3;
  --ink:#1c1a15; --dim:#847e6d; --dimmer:#b3ac99;
  --accent:#9c3b34; --accentDim:#cdb0aa;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.5 var(--sans);min-height:100vh}
a{color:var(--ink)}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:13px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:999px;cursor:pointer;padding:6px 15px}
button:hover{border-color:var(--dim)}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h1,h2,h3{font-weight:600;margin:0}

header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 22px}
header h1{font-size:15px;letter-spacing:.01em}
#modes{display:flex;gap:6px;margin-left:10px}
header .right{margin-left:auto;display:flex;gap:14px;align-items:center;color:var(--dim);font-size:12.5px}
header .right a{text-decoration:none;color:var(--dim)}
header .right a:hover{color:var(--ink)}

main{max-width:1180px;margin:0 auto;padding:6px 22px 90px}

/* ---------- overview: card grid ---------- */
#overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{cursor:pointer}
.card .shot{position:relative;aspect-ratio:4/3;background:var(--bg);border:1px solid var(--hair);border-radius:2px;overflow:hidden}
.card .shot img{width:100%;height:100%;object-fit:cover}
.card .shot .tri{position:absolute;right:6px;bottom:5px;color:var(--dimmer);font-size:10px}
.card:hover .shot{border-color:var(--dim)}
.card .row{display:flex;align-items:baseline;gap:10px;padding:8px 1px 0;font-size:12.5px;color:var(--dim)}
.card .row b{color:var(--ink);font-weight:600;font-size:13.5px}
.card .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:2px}
.bar{height:3px;background:var(--hair);position:relative;margin-top:6px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}

/* ---------- ledger mode ---------- */
table.ledger{width:100%;border-collapse:collapse;font-size:12.5px}
table.ledger th{text-align:left;font-weight:600;color:var(--dim);font-size:11px;letter-spacing:.03em;
  padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
table.ledger th:hover{color:var(--ink)}
table.ledger th.sorted{color:var(--ink)}
table.ledger td{padding:7px 12px;border-bottom:1px solid var(--hair);white-space:nowrap}
table.ledger tr{cursor:pointer}
table.ledger tr:hover td{background:#eae5d8}
table.ledger td.name b{font-weight:600}
table.ledger td.name span{display:block;color:var(--dimmer);font-size:11px;font-weight:400}
td.num{text-align:right}
td.warn{color:var(--accent)}
.miniledger{display:inline-block;width:50px;height:7px;background:var(--hair);position:relative;vertical-align:middle}
.miniledger i{position:absolute;top:0;bottom:0;left:0;background:var(--ink)}

/* ---------- diagnosis mode ---------- */
.back{color:var(--dim);font-size:12.5px;cursor:pointer;display:inline-block;margin:14px 0 6px;text-decoration:none}
.back:hover{color:var(--ink)}
#diag .dtop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#diag .dtop h2{font-size:19px}
#diag .dtop .name{color:var(--dim);font-weight:400;font-size:14px}
#diag .dtop .cut{color:var(--accent);font-size:12px}

.vitals{display:flex;flex-wrap:wrap;gap:24px;margin:14px 0 4px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.vitals .v{display:flex;flex-direction:column;gap:1px}
.vitals .v span{font-size:10px;letter-spacing:.05em;color:var(--dimmer);text-transform:uppercase}
.vitals .v b{font-size:15px;font-weight:600}
.vitals .v b.warn{color:var(--accent)}

.dgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:30px;margin-top:6px}
@media(max-width:880px){.dgrid{grid-template-columns:1fr}}
.sec{border-top:1px solid var(--hair);padding-top:10px;margin-top:20px}
.sec:first-child{margin-top:0}
.sec>.lab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dimmer);margin-bottom:9px}

.proof{position:relative}
.proof img{width:100%;display:block;border:1px solid var(--hair)}
.proof .cap{position:absolute;right:8px;bottom:8px;color:#57544a;font-size:11px;background:rgba(242,239,230,.72);padding:1px 5px}

.axes-t{width:100%;border-collapse:collapse;font-size:12.5px}
.axes-t td{padding:3px 6px 3px 0;border-bottom:1px solid var(--hair);white-space:nowrap}
.axes-t td.g{width:12px;text-align:center;font-size:11px}
.axes-t .L td.g{color:var(--accent)}
.axes-t .W td.g{color:var(--dimmer)}
.axes-t td.bar{width:110px}
.axes-t td.val{color:var(--dim);width:96px}

.spark svg{width:100%;height:70px;display:block}
.spark .axis{display:flex;justify-content:space-between;color:var(--dimmer);font-size:10px;margin-top:3px}
#turndetail{min-height:38px;padding-top:8px;font-size:12px;color:var(--dim)}
#turndetail b{color:var(--ink);font-weight:600}
#turndetail .tool{display:inline-block;border:1px solid var(--hair);border-radius:3px;padding:0 5px;margin-right:4px;font-size:11px}

table.growth{width:100%;border-collapse:collapse;font-size:12px}
table.growth td{padding:4px 6px 4px 0;border-bottom:1px solid var(--hair);vertical-align:top}
table.growth td.chars{color:var(--accent);text-align:right;white-space:nowrap}
table.growth td.tool{color:var(--dim)}
table.growth td.tool b{color:var(--ink);font-weight:600}

.empty{color:var(--dimmer);font-size:12.5px}
details summary{cursor:pointer;color:var(--dim);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:hover{color:var(--ink)}
details pre{white-space:pre-wrap;word-break:break-word;font:12.5px/1.55 var(--sans);color:var(--dim);
  margin:9px 0 0;max-height:320px;overflow:auto}

.hidden{display:none!important}
#err{color:var(--accent);padding:20px}
</style>
</head>
<body>
<header>
  <h1>Triage</h1>
  <span id="modes">
    <button data-m="overview" class="on">Overview</button>
    <button data-m="ledger">Ledger</button>
  </span>
  <span class="right"><a href="arena.html">arena</a><a href="builds.html">builds</a></span>
</header>
<main>
  <div id="overview"></div>
  <div id="ledger" class="hidden"></div>
  <div id="diag" class="hidden"></div>
</main>
<script>
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const fmt = n => n == null ? '—' : n.toLocaleString('en-US');
const kilo = n => n == null ? '—' : (n >= 1000 ? Math.round(n / 1000) + 'k' : n);
const pct = n => n == null ? '—' : Math.round(n * 100) + '%';

let DATA = null, SORT = { k: 'share', dir: -1 };

fetch('./triage-data.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(d => { DATA = d; boot(); })
  .catch(e => { $('main').innerHTML = '<p id="err">triage-data.json did not load: ' + e.message + '</p>'; });

function boot() {
  renderOverview();
  renderLedger();
  $$('#modes button').forEach(b => b.onclick = () => setMode(b.dataset.m));
}

function setMode(m) {
  $$('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('#overview').classList.toggle('hidden', m !== 'overview');
  $('#ledger').classList.toggle('hidden', m !== 'ledger');
  $('#diag').classList.toggle('hidden', m !== 'diag');
}

function card(s) {
  const el = document.createElement('div');
  el.className = 'card';
  el.onclick = () => openDiag(s.id);
  el.innerHTML = `
    <div class="shot"><img loading="lazy" src="${s.image}" alt="${s.id}"><span class="tri">${kilo(s.triangles)}</span></div>
    <div class="row"><b>${s.id}</b>${s.cutoff ? '<span class="dot"></span>' : ''}<span class="n">${s.wins}–${s.losses}</span><span class="n">${pct(s.share)}</span></div>
    <div class="bar"><i style="width:${Math.round((s.share||0)*100)}%"></i></div>
  `;
  return el;
}

function renderOverview() {
  const host = $('#overview'); host.innerHTML = '';
  DATA.seeds.forEach(s => host.appendChild(card(s)));
}

const LEDGER_COLS = [
  { k: 'id', label: 'Build', num: false },
  { k: 'pieces', label: 'Pieces', num: true },
  { k: 'wins', label: 'Won', num: true },
  { k: 'losses', label: 'Lost', num: true },
  { k: 'share', label: 'Share', num: true, fmt: pct, bar: true },
  { k: 'requests', label: 'Req', num: true, get: s => s.cache ? s.cache.total.requests : null },
  { k: 'output', label: 'Output', num: true, get: s => s.cache ? s.cache.total.output : null },
  { k: 'cache_read', label: 'Cache read', num: true, get: s => s.cache ? s.cache.total.cache_read : null },
  { k: 'peak', label: 'Peak/turn', num: true, get: s => s.cache ? Math.max(...s.cache.turns.map(t => t.cache_read)) : null },
  { k: 'refusals', label: 'Refuse', num: true, get: s => (s.counts || {}).refusals, warn: true },
  { k: 'undos', label: 'Undo', num: true, get: s => (s.counts || {}).undos, warn: true },
];

function val(s, col) { return col.get ? col.get(s) : s[col.k]; }

function renderLedger() {
  const host = $('#ledger');
  const rows = DATA.seeds.slice();
  const col = LEDGER_COLS.find(c => c.k === SORT.k) || LEDGER_COLS[0];
  rows.sort((a, b) => {
    const av = val(a, col), bv = val(b, col);
    if (av == null) return 1; if (bv == null) return -1;
    if (typeof av === 'string') return SORT.dir * av.localeCompare(bv);
    return SORT.dir * (av - bv);
  });
  const maxShare = Math.max(...DATA.seeds.map(s => s.share || 0));
  let html = '<table class="ledger"><thead><tr>';
  LEDGER_COLS.forEach(c => html += `<th data-k="${c.k}" class="${c.k === SORT.k ? 'sorted' : ''}">${c.label}${c.k === SORT.k ? (SORT.dir < 0 ? ' ↓' : ' ↑') : ''}</th>`);
  html += '</tr></thead><tbody>';
  rows.forEach(s => {
    html += `<tr data-id="${s.id}">`;
    LEDGER_COLS.forEach(c => {
      let v = val(s, c);
      if (c.k === 'id') { html += `<td class="name"><b>${s.id}</b><span>${s.name}</span></td>`; return; }
      const cls = c.num ? 'num n' : '';
      const warnCls = c.warn && v ? ' warn' : '';
      let out = v == null ? '—' : (c.fmt ? c.fmt(v) : fmt(v));
      if (c.bar && v != null) {
        out = `<span class="miniledger"><i style="width:${maxShare ? Math.round(v / maxShare * 100) : 0}%"></i></span> ${out}`;
      }
      html += `<td class="${cls}${warnCls}">${out}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  host.innerHTML = html;
  $$('table.ledger th', host).forEach(th => th.onclick = () => {
    if (SORT.k === th.dataset.k) SORT.dir *= -1; else SORT = { k: th.dataset.k, dir: -1 };
    renderLedger();
  });
  $$('table.ledger tr[data-id]', host).forEach(tr => tr.onclick = () => openDiag(tr.dataset.id));
}

function axisRow(a) {
  const win = a.verdict === 'WIN';
  const ours = a.ours != null ? Math.round(a.ours * 100) : null;
  const bar = a.bar != null ? Math.round(a.bar * 100) : null;
  const w = ours == null ? 0 : Math.min(100, ours);
  return `<tr class="${win ? 'W' : 'L'}">
    <td class="g">${win ? '·' : '×'}</td>
    <td>${a.id.replace('AX-', '')}</td>
    <td class="bar"><div class="bar" style="margin:0"><i style="width:${w}%"></i></div></td>
    <td class="val n">${ours == null ? '—' : ours + '% / ' + bar + '%'}</td>
  </tr>`;
}

function sparkline(s) {
  if (!s.cache) return '<p class="empty">no transcript</p>';
  const turns = s.cache.turns;
  const max = Math.max(...turns.map(t => t.cache_read), 1);
  const w = 1000, h = 70, n = turns.length;
  const stepX = n > 1 ? w / (n - 1) : w;
  const growThresh = 4000;
  let bars = '';
  turns.forEach((t, i) => {
    const x = Math.round(i * stepX);
    const bh = Math.max(1, Math.round(t.cache_read / max * (h - 4)));
    const y = h - bh;
    const big = t.result_chars > growThresh;
    bars += `<rect data-i="${i}" x="${x}" y="${y}" width="${Math.max(1.4, stepX - .6)}" height="${bh}" fill="${big ? 'var(--accent)' : 'var(--ink)'}" opacity="${big ? '0.9' : '0.42'}"></rect>`;
  });
  return `<div class="spark">
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}</svg>
    <div class="axis"><span>0</span><span class="n">peak ${fmt(max)}</span><span>${n - 1}</span></div>
  </div>
  <div id="turndetail"></div>`;
}

function bindSpark(s) {
  if (!s.cache) return;
  $$('#diag svg rect').forEach(r => r.onclick = () => {
    const t = s.cache.turns[+r.dataset.i];
    const tools = t.tools.length ? t.tools.map(x => `<span class="tool">${x}</span>`).join('') : '<span class="tool">—</span>';
    $('#turndetail').innerHTML = `<b class="n">#${t.n}</b> · read <b class="n">${fmt(t.cache_read)}</b> · write <b class="n">${fmt(t.cache_write)}</b> · out <b class="n">${fmt(t.output)}</b><br>
      ${tools}${t.result_chars ? ` <span class="n">+${fmt(t.result_chars)}c</span>` : ''}`;
  });
}

function growthTable(s) {
  if (!s.cache || !s.cache.top_context_growth.length) return '<p class="empty">nothing over 500 characters</p>';
  let html = '<table class="growth">';
  s.cache.top_context_growth.forEach(g => {
    const name = g.names[0] || '(unnamed)';
    const [tool, ...rest] = name.split(':');
    html += `<tr><td class="chars n">${fmt(g.chars)}c</td><td class="tool"><b>${tool}</b> ${(rest.join(':') || '').replace(/</g, '&lt;')}</td></tr>`;
  });
  html += '</table>';
  return html;
}

function vitalsHtml(s) {
  const counts = s.counts || {};
  const joints = counts.joints || {};
  const axesLost = s.axes.filter(a => a.verdict !== 'WIN').length;
  const peak = s.cache ? Math.max(...s.cache.turns.map(t => t.cache_read)) : null;
  const v = (label, value, warn) => `<div class="v"><span>${label}</span><b class="n${warn ? ' warn' : ''}">${value}</b></div>`;
  let out = '';
  out += v('Pieces', fmt(s.pieces));
  out += v('W–L', s.wins + '–' + s.losses);
  out += v('Share', pct(s.share));
  out += v('Axes lost', axesLost + '/12', axesLost > 6);
  if (s.cache) {
    out += v('Req', fmt(s.cache.total.requests));
    out += v('Peak', kilo(peak));
  }
  if ('calls' in counts) {
    out += v('Refuse', fmt(counts.refusals), counts.refusals);
    out += v('Undo', fmt(counts.undos), counts.undos);
    if ((joints.right || 0) + (joints.wrong || 0) > 0) out += v('Joints', joints.right + '/' + (joints.right + joints.wrong), joints.wrong);
  }
  return out;
}

function openDiag(id) {
  const s = DATA.seeds.find(x => x.id === id);
  setMode('diag');
  const cutHtml = s.cutoff ? `<span class="cut">cut off — ${s.cutoff.replace(/^cut off by /, '')}</span>` : '';
  $('#diag').innerHTML = `
    <a class="back" id="backBtn">‹ all eight</a>
    <div class="dtop"><h2>${s.id}</h2><span class="name">${s.name}</span>${cutHtml}</div>
    <div class="vitals">${vitalsHtml(s)}</div>
    <div class="dgrid">
      <div>
        <div class="sec proof">
          <img src="${s.image}" alt="${s.id}">
          <div class="cap n">${fmt(s.triangles)} tri</div>
        </div>
        <div class="sec">
          <div class="lab">Axes</div>
          <table class="axes-t">${s.axes.map(axisRow).join('')}</table>
        </div>
      </div>
      <div>
        <div class="sec">
          <div class="lab">Cache</div>
          ${sparkline(s)}
        </div>
        <div class="sec">
          <div class="lab">Reread</div>
          ${growthTable(s)}
        </div>
        <div class="sec">
          <details><summary>Notes</summary><pre>${(s.notes || '—').replace(/</g, '&lt;')}</pre></details>
        </div>
      </div>
    </div>
  `;
  $('#backBtn').onclick = () => setMode('overview');
  bindSpark(s);
}
</script>
</body>
</html>

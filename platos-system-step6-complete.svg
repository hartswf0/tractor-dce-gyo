<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="background:#333; font-family:Arial, sans-serif;">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D67229"/>
      <stop offset="100%" stop-color="#A05F35"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="4" dy="4" stdDeviation="2" flood-opacity="0.5"/></filter>
  </defs>

  <!-- Header -->
  <g transform="translate(20, 20)">
    <rect width="320" height="60" rx="4" fill="#F4F4F4" filter="url(#shadow)"/>
    <text x="20" y="40" font-weight="bold" fill="#333" font-size="24">STEP 6: COMPLETE</text>
  </g>

  <!-- The Brick Urn -->
  <g transform="translate(400, 300) scale(5)">
    <rect x="-10" y="25" width="20" height="5" fill="url(#clay)" stroke="#5F3818" stroke-width="0.5"/>
    <rect x="-15" y="15" width="30" height="10" fill="url(#clay)" stroke="#5F3818" stroke-width="0.5"/>
    <rect x="-20" y="5" width="40" height="10" fill="url(#clay)" stroke="#5F3818" stroke-width="0.5"/>
    <rect x="-15" y="-5" width="30" height="10" fill="url(#clay)" stroke="#5F3818" stroke-width="0.5"/>
    <rect x="-10" y="-10" width="20" height="5" fill="url(#clay)" stroke="#5F3818" stroke-width="0.5"/>
    <rect x="-12" y="-15" width="24" height="5" fill="url(#clay)" stroke="#5F3818" stroke-width="0.5"/>
    <rect x="-15" y="0" width="30" height="5" fill="#F6D713" opacity="0.9"/>
    <rect x="-10" y="1" width="3" height="3" fill="#333"/>
    <rect x="-2" y="1" width="3" height="3" fill="#333"/>
    <rect x="6" y="1" width="3" height="3" fill="#333"/>
  </g>

  <!-- Text Output -->
  <text x="400" y="500" text-anchor="middle" fill="#fff" font-family="monospace" font-size="20">forest_skirmish.mpd</text>
  <rect x="300" y="520" width="200" height="40" rx="20" fill="#287F46"/>
  <text x="400" y="545" text-anchor="middle" fill="#fff" font-weight="bold">READY</text>
</svg>

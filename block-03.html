<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANCESTRAL_CORE // Ontological Reconstructor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0b1121; --panel: #0f172a; --surface: #1e293b; --border: #334155;
            --text-main: #e2e8f0; --text-muted: #64748b; --func: #fbbf24; --var: #60a5fa;
            --ctrl: #f87171; --hot: #ffffff; --link: #3b82f6; --font: 'JetBrains Mono', monospace;
            --ease: cubic-bezier(0.4, 0, 0.2, 1); --header-height: 64px; --console-height: 120px;
            --grid-color: #334155;
        }
        
        [data-theme="parchment"] {
            --bg: #fefce8; --panel: #fef9c3; --surface: #fde047; --border: #facc15;
            --text-muted: #eab308; --text-main: #713f12; --func: #dc2626; --var: #2563eb;
            --ctrl: #16a34a; --link: #facc15;
        }
        
        [data-theme="terminal"] {
            --bg: #171717; --panel: #262626; --surface: #404040; --border: #525252;
            --text-muted: #737373; --text-main: #86efac; --func: #fde047; --var: #93c5fd;
            --ctrl: #fca5a5; --link: #22c55e;
        }
        
        @keyframes fadeUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes flash-pulse { 0% { filter: brightness(1); } 50% { filter: brightness(3); } 100% { filter: brightness(1); } }
        @keyframes grid-fade { 0% { opacity: 0.05; } 100% { opacity: 0.15; } }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font); background: var(--bg); color: var(--text-main); overscroll-behavior: none; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--panel); } ::-webkit-scrollbar-thumb { background: var(--border); }
        
        .layout { display: grid; grid-template-rows: var(--header-height) 1fr var(--console-height); height: 100dvh; }
        #header { grid-row: 1; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; z-index: 100; }
        #main { grid-row: 2; position: relative; overflow: hidden; }
        #console { grid-row: 3; background: var(--panel); border-top: 1px solid var(--border); display: flex; flex-direction: column; transition: height 0.3s var(--ease); }
        .console-collapsed { height: 2.5rem !important; }
        
        .nav-tab { padding: 0.5rem 1rem; border-radius: 0.375rem; font-size: 0.875rem; cursor: pointer; transition: all 0.2s var(--ease); color: var(--text-muted); }
        .nav-tab.active { background: rgba(251, 191, 36, 0.2); color: var(--func); box-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }
        
        #grid-shell { position: absolute; inset: 0; margin: auto; aspect-ratio: 1 / 1; width: min(100%, calc(100dvh - var(--header-height) - var(--console-height))); max-height: 100%; }
        #grid-lock { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); gap: 2px; pointer-events: none; }
        .grid-cell { background: var(--panel); border: 1px solid var(--border); border-radius: 0.375rem; pointer-events: auto; transition: all 0.2s var(--ease); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
        .grid-cell:hover { border-color: var(--func); box-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }
        .grid-cell.active { background: rgba(251, 191, 36, 0.2); border-color: var(--func); box-shadow: 0 0 0 2px var(--func); }
        .grid-cell.executing { background: var(--hot); border-color: var(--hot); transform: scale(1.1); animation: flash-pulse 0.3s ease-out; }
        
        .cell-icon { font-size: 1.5rem; margin-bottom: 0.25rem; }
        .cell-label { font-size: 0.625rem; color: var(--text-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%; }
        
        #code-editor { display: none; position: absolute; inset: 0; padding: 1.5rem; overflow-y: auto; font-size: 0.875rem; }
        .line { padding: 0.125rem 0; border-left: 2px solid transparent; transition: all 0.2s var(--ease); white-space: pre; color: var(--text-muted); }
        .line.active { background: rgba(251, 191, 36, 0.1); border-left-color: var(--func); color: var(--text-main); }
        .line.executing { background: rgba(255, 255, 255, 0.2); color: var(--hot); animation: flash-pulse 0.2s ease-out; }
        
        .token-func { color: var(--func); } .token-var { color: var(--var); } .token-ctrl { color: var(--ctrl); } .token-comment { color: var(--text-muted); font-style: italic; }
        
        #preview-frame { display: none; position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: white; }
        
        path.wire { fill: none; stroke: var(--border); stroke-width: 1; opacity: 0.3; transition: all 0.3s var(--ease); }
        path.wire.active { stroke: var(--link); stroke-width: 2; opacity: 1; filter: drop-shadow(0 0 4px var(--link)); }
        path.wire.firing { stroke: var(--hot); stroke-width: 3; opacity: 1; animation: flash-pulse 0.5s ease-out; }
        
        .theme-btn { padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; cursor: pointer; color: var(--text-muted); transition: all 0.2s var(--ease); }
        .theme-btn.active { background: rgba(251, 191, 36, 0.2); color: var(--func); }
        
        .console-header { height: 2.5rem; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; cursor: pointer; border-bottom: 1px solid var(--border); }
        .console-content { flex: 1; overflow-y: auto; padding: 0.5rem; font-size: 0.75rem; }
        .log-entry { padding: 0.125rem 0; border-bottom: 1px solid var(--border); }
        .log-success { color: #22c55e; } .log-info { color: #60a5fa; } .log-warn { color: var(--ctrl); } .log-error { color: #f87171; }
        
        .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--func); padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-size: 0.875rem; z-index: 1000; animation: fadeUp 0.3s var(--ease); }
    </style>
<base target="_blank">
</head>
<body class="layout" data-theme="dark">

    <!-- Header -->
    <header id="header">
        <div style="display: flex; gap: 0.5rem;">
            <button class="nav-tab active" data-view="system" onclick="VIEW.switch('system')">SYSTEM</button>
            <button class="nav-tab" data-view="code" onclick="VIEW.switch('code')">CODE</button>
            <button class="nav-tab" data-view="preview" onclick="VIEW.switch('preview')">PREVIEW</button>
        </div>
        
        <div style="display: flex; gap: 1rem; align-items: center;">
            <button id="play-btn" onclick="AUTOPLAY.toggle()" title="Autoplay sequence" style="padding: 0.5rem; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--panel);">
                <i data-lucide="play" class="w-4 h-4"></i>
            </button>
            
            <div style="display: flex; gap: 0.25rem; background: var(--surface); padding: 0.25rem; border-radius: 0.375rem;">
                <button class="theme-btn active" data-theme="dark" onclick="THEME.set('dark')">DARK</button>
                <button class="theme-btn" data-theme="parchment" onclick="THEME.set('parchment')">PARCH</button>
                <button class="theme-btn" data-theme="terminal" onclick="THEME.set('terminal')">TERM</button>
            </div>
            
            <button onclick="INGESTION.show()" title="Ingest code" style="padding: 0.5rem; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--panel);">
                <i data-lucide="upload" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- Main Grid Area -->
    <main id="main">
        <!-- Ingestion Modal (absolutely centered, not layered) -->
        <div id="ingest-modal" style="display: none; position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);">
            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 600px; background: var(--panel); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.5rem;">
                <h3 style="color: var(--func); margin-bottom: 1rem;">INGEST CODE</h3>
                <textarea id="ingest-input" style="width: 100%; min-height: 200px; background: var(--bg); border: 1px solid var(--border); border-radius: 0.375rem; padding: 0.5rem; color: var(--text-main); font-family: var(--font); font-size: 0.875rem;"></textarea>
                <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                    <button onclick="INGESTION.load()" style="flex: 1; padding: 0.5rem; background: var(--panel); border: 1px solid var(--border); border-radius: 0.375rem; color: var(--text-main);">LOAD</button>
                    <button onclick="INGESTION.self()" style="flex: 1; padding: 0.5rem; background: var(--panel); border: 1px solid var(--border); border-radius: 0.375rem; color: var(--text-main);">SELF</button>
                    <button onclick="INGESTION.hide()" style="flex: 1; padding: 0.5rem; background: var(--panel); border: 1px solid var(--border); border-radius: 0.375rem; color: var(--text-main);">CLOSE</button>
                </div>
            </div>
        </div>

        <!-- System View -->
        <div id="system-view">
            <div id="grid-shell">
                <div id="grid-lock"></div>
                <svg id="connections-layer"></svg>
            </div>
        </div>

        <!-- Code View -->
        <div id="code-view">
            <div id="code-editor"></div>
        </div>

        <!-- Preview View -->
        <div id="preview-view">
            <iframe id="preview-frame"></iframe>
        </div>

        <!-- Coordinates HUD -->
        <div style="position: absolute; bottom: 0.5rem; left: 0.5rem; font-size: 0.625rem; color: var(--link); font-family: var(--font); opacity: 0.6;">
            XY: <span id="coords">000.0, 000.0</span>
        </div>
    </main>

    <!-- Console -->
    <div id="console">
        <div class="console-header" onclick="CONSOLE.toggle()">
            <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-muted); font-size: 0.875rem;">
                <i data-lucide="terminal" class="w-4 h-4"></i>
                <span>CONSOLE</span>
            </div>
            <i id="console-toggle" data-lucide="chevron-down" class="w-4 h-4"></i>
        </div>
        <div class="console-content" id="console-content"></div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script>
        // Ontological Log
        const OLOG = [
            ["THEME","defines","--bg,--panel","CSS",":root"],
            ["LAYOUT","grid","header/main/console","grid-template-rows"],
            ["GRID","9x9","center/snap","GRID Helpers"],
            ["PARSER","code→blocks","fn/var/ctrl","parseCode()"],
            ["RENDERER","render","blocks/lines/edges","renderBlocks()"],
            ["VIEW","switch","system/code/preview","VIEW.switch()"],
            ["AUTOPLAY","sequence","blocks","setInterval"],
            ["TRACER","flash","visual feedback","flash pulse"],
            ["STATE","persist","localStorage","PERSISTENCE"]
        ];

        // State
        const STATE = {
            version: 1, view: 'system', theme: 'dark', console: false,
            lines: [], blocks: Array(81).fill(null), edges: [], definitions: new Map(),
            autoplay: null, snap: true, activeIdx: null
        };

        // Grid
        const GRID = {
            center(c,r){const s=100/9;return{x:(c+0.5)*s,y:(r+0.5)*s,idx:r*9+c}},
            snap(x,y){const s=100/9;const c=Math.max(0,Math.min(8,Math.round(x/s-0.5)));const r=Math.max(0,Math.min(8,Math.round(y/s-0.5)));return this.center(c,r)}
        };

        // Theme
        const THEME = {
            set(t){document.body.setAttribute('data-theme',t);STATE.theme=t;LOG.toast(t)}
        };

        // Parser
        const PARSER = {
            parse(text){
                STATE.lines=text.split('\n').filter(l=>l.trim());
                STATE.blocks=Array(81).fill(null);STATE.edges=[];STATE.definitions.clear();
                const lpc=Math.ceil(STATE.lines.length/81);
                STATE.lines.forEach((line,i)=>{
                    const idx=Math.floor(i/lpc),trim=line.trim();
                    let type='other',name=null;
                    if(trim.match(/(?:function|class)\s+(\w+)/)||trim.match(/(\w+)\s*\(/)){type='func';name=RegExp.$1||RegExp.$2}
                    else if(trim.match(/(?:const|let|var)\s+(\w+)/)){type='var';name=RegExp.$1}
                    else if(trim.match(/^(if|else|for|while|return)/)){type='control';name=RegExp.$1}
                    if(!STATE.blocks[idx]){STATE.blocks[idx]={idx,data:{line:i,type},names:name?[name]:[],deps:[],callers:[]};}
                    if(name){STATE.definitions.set(name,idx);STATE.blocks[idx].names.push(name)}
                });
                STATE.blocks.forEach((b,idx)=>{if(b){const words=STATE.lines[b.data.line].match(/\w+/g)||[];words.forEach(w=>{if(STATE.definitions.has(w)&&!b.names.includes(w)){const t=STATE.definitions.get(w);if(t!==idx){b.deps.push(t);STATE.edges.push({from:idx,to:t})}})})}});
                RENDER.blocks();RENDER.edges();RENDER.code();
            }
        };

        // Renderer
        const RENDER = {
            blocks(){
                const g=document.getElementById('grid-lock');g.innerHTML='';
                for(let i=0;i<81;i++){const b=STATE.blocks[i];const c=document.createElement('div');c.className='grid-cell';c.dataset.index=i;
                    if(b){const sym={func:'ƒ',var:'◆',control:'◇',other:'·'}[b.data.type]||'·';c.innerHTML=`<div class="cell-icon" style="color:var(--${b.data.type==='func'?'func':b.data.type==='var'?'var':'ctrl'})">${sym}</div>${b.names[0]?`<div class="cell-label">${b.names[0]}</div>`:''}`;c.onclick=()=>{STATE.activeIdx=i;RENDER.highlight(i)};}
                    else{c.innerHTML='<div class="cell-icon" style="color:var(--text-muted);opacity:0.3">·</div>';c.onclick=()=>{STATE.activeIdx=i;RENDER.highlight(i)};}
                    g.appendChild(c);
                }
            },
            edges(){const s=document.getElementById('connections-layer');s.innerHTML='';STATE.edges.forEach(e=>{const x1=(e.from%9)*(100/9)+(100/18),y1=Math.floor(e.from/9)*(100/9)+(100/18),x2=(e.to%9)*(100/9)+(100/18),y2=Math.floor(e.to/9)*(100/9)+(100/18);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x1}% ${y1}% C${x1+10}% ${y1}%,${x2-10}% ${y2}%,${x2}% ${y2}%`);p.className='wire';p.id=`w-${e.from}-${e.to}`;s.appendChild(p);})},
            code(){const e=document.getElementById('code-editor');e.innerHTML=STATE.lines.map((l,i)=>{const a=STATE.activeIdx!==null&&Math.floor(i/Math.ceil(STATE.lines.length/81))===STATE.activeIdx;let h=l.replace(/(function|class|const|let|var|if|else|return)/g,'<span class="token-ctrl">$1</span>').replace(/(\w+)\s*\(/g,'<span class="token-func">$1</span>(').replace(/(\w+)\s*=/g,'<span class="token-var">$1</span> =').replace(/(\/\/.*$)/gm,'<span class="token-comment">$1</span>');return`<div class="line ${a?'active':''}" data-line="${i}">${h}</div>`}).join('');},
            highlight(i){document.querySelectorAll('.grid-cell.active').forEach(c=>c.classList.remove('active'));document.querySelectorAll('.line.active').forEach(l=>l.classList.remove('active'));document.querySelectorAll('.wire.active').forEach(w=>w.classList.remove('active'));document.querySelector(`[data-index="${i}"]`).classList.add('active');const b=STATE.blocks[i];if(b){const s=b.data.line,e=s+Math.ceil(STATE.lines.length/81);for(let j=s;j<e&&j<STATE.lines.length;j++){document.querySelector(`[data-line="${j}"]`).classList.add('active')}STATE.edges.forEach(ed=>{if(ed.from===i){document.getElementById(`w-${ed.from}-${ed.to}`).classList.add('active')}})}STATE.activeIdx=i;},
            preview(){const f=document.getElementById('preview-frame');f.srcdoc=STATE.lines.join('\n');}
        };

        // View Controller
        const VIEW = {
            switch(v){
                STATE.view=v;document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
                ['system-view','code-view','preview-view'].forEach(id=>document.getElementById(id).style.display='none');
                if(v==='system'){document.getElementById('system-view').style.display='block';RENDER.blocks();RENDER.edges()}
                if(v==='code'){document.getElementById('code-view').style.display='block';RENDER.code()}
                if(v==='preview'){document.getElementById('preview-view').style.display='block';RENDER.preview()}
                LOG.toast('View: '+v);
            }
        };

        // Autoplay
        const AUTOPLAY = {
            toggle(){
                if(STATE.autoplay){clearInterval(STATE.autoplay);STATE.autoplay=null;document.getElementById('play-btn').innerHTML='<i data-lucide="play" class="w-4 h-4"></i>';return}
                const bl=STATE.blocks.filter(b=>b);if(!bl.length)return;let i=0;STATE.autoplay=setInterval(()=>{const idx=bl[i%bl.length].idx;RENDER.highlight(idx);TRACER.flash(idx);i++},1000);document.getElementById('play-btn').innerHTML='<i data-lucide="pause" class="w-4 h-4"></i>';
            }
        };

        // Tracer
        const TRACER = {
            flash(i){
                const c=document.querySelector(`[data-index="${i}"]`);if(c){c.classList.add('executing');setTimeout(()=>c.classList.remove('executing'),300)}
                const b=STATE.blocks[i];if(b){const s=b.data.line,e=s+Math.ceil(STATE.lines.length/81);for(let j=s;j<e&&j<STATE.lines.length;j++){document.querySelector(`[data-line="${j}"]`).classList.add('executing');setTimeout(()=>document.querySelector(`[data-line="${j}"]`).classList.remove('executing'),200)}}
                STATE.edges.forEach(ed=>{if(ed.from===i){document.getElementById(`w-${ed.from}-${ed.to}`).classList.add('firing');setTimeout(()=>document.getElementById(`w-${ed.from}-${ed.to}`).classList.remove('firing'),500)}})
            }
        };

        // Ingestion
        const INGESTION = {
            show(){document.getElementById('ingest-modal').style.display='block'},
            hide(){document.getElementById('ingest-modal').style.display='none'},
            load(){PARSER.parse(document.getElementById('ingest-input').value);this.hide();VIEW.switch('code')},
            self(){document.getElementById('ingest-input').value=document.documentElement.outerHTML;LOG.toast('Self loaded')}
        };

        // Console
        const CONSOLE = {
            toggle(){STATE.console=!STATE.console;document.getElementById('console').classList.toggle('console-collapsed',!STATE.console);document.getElementById('console-toggle').setAttribute('data-lucide',STATE.console?'chevron-down':'chevron-up');lucide.createIcons()},
            log(t,m){const c=document.getElementById('console-content');const e=document.createElement('div');e.className=`log-entry log-${t}`;e.innerHTML=`<span style="color:${{success:'#22c55e',info:'#60a5fa',warn:'var(--ctrl)',error:'#f87171'}[t]}">${t}</span> ${m}`;c.appendChild(e);e.scrollIntoView()}
        };

        const LOG = {
            toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
        };

        // Init
        function INIT(){
            const e=`// Example Ontological System
const REALITY = { nodes:[], edges:[] };

function parse(input) {
    const lines = input.split('\n');
    return lines.map(l => ({ type: 'func', name: l.trim() }));
}

class Entity {
    constructor(id) {
        this.id = id;
        this.state = 'active';
    }
}`;
            PARSER.parse(e);VIEW.switch('system');lucide.createIcons();LOG.toast('System initialized');
        }
        
        INIT();
    </script>
</body>
</html>

<body>
  <div class="page">
    <div class="header">

    <div class="content">
      <div class="left-pane">
        <iframe
          id="grace-iframe"
          title="Courage Viewer"
          src="wag-viewer-prime-integration-20251112-055341 copy/wag-courage.html?momento=372"
        ></iframe>
      </div>
      <div class="right-pane">
        <div class="control-card card-camera">
          <div class="control-card-title">REC / SENSOR</div>
          <div id="preview-wrapper">
            <canvas id="preview-canvas" width="320" height="240"></canvas>
            <canvas id="capture-canvas" width="640" height="480" style="display:none;"></canvas>

          </div>
          <div class="controls-row">
            <label>Path
              <select id="momento-camera-path">

            <label>Quality
              <select id="momento-quality">
                <option value="720p" selected>720p</option>

              id="mento-shot-text"

              spellcheck="false"
              placeholder="MENTO shot MPD will appear here…"
            ></textarea>
          </div>
          <div class="controls-row btn-row">
            <button id="mento-parse-shot-text">Load From Text</button>
            <button id="mento-copy-shot-text">Copy MPD</button>
            <button id="mento-import-to-path" title="Send !MENTO SHOT entries into Camera Path keys">To Camera Path</button>
          </div>

        <div class="control-card card-gallery">
          <div class="control-card-title">Shots</div>

    <div class="status-bar">
      <span>MENTO-372 · Hybrid Momento over Courage</span>
      <span>Courage scene & colors → WebM</span>

  <script>
    (function() {
      const P = {
        keys: [],
        selected: -1,
        playing: false,
        startTime: 0,
        duration: 8
      };
      function el(id) { return document.getElementById(id); }
      function setStatus(text) {
        const s = el('status-line');
        if (s) s.textContent = text || '';
      }
      function resolveCourage() {
        const frame = document.getElementById('grace-iframe');
        if (!frame || !frame.contentWindow) return null;
        const win = frame.contentWindow;
        const iface = win.MomentoInterface || win.VideoCaptureInterface || {};
        const capture = win._captureData || {};
        const cam = iface.camera || capture.camera;
        const renderer = iface.renderer || capture.renderer;
        const scene = iface.scene || capture.scene;
        const THREE = win.THREE;
        if (!cam || !scene || !renderer || !THREE) return null;
        return { win, cam, scene, renderer, THREE };
      }
      function addKeyFromView() {
        const res = resolveCourage();
        if (!res) {
          setStatus('Courage scene not ready.');
          return;
        }
        const cam = res.cam;
        const THREE = res.THREE;
        const p = cam.position;
        const pos = { x: p.x, y: p.y, z: p.z };
        let dx = 0, dy = 0, dz = -1;
        if (typeof cam.getWorldDirection === 'function') {
          const v = new THREE.Vector3();
          cam.getWorldDirection(v);
          dx = v.x; dy = v.y; dz = v.z;
        }
        const lenSq = dx*dx + dy*dy + dz*dz;
        if (!lenSq) { dx = 0; dy = 0; dz = -1; }
        const len = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
        dx /= len; dy /= len; dz /= len;
        const dist = Math.sqrt(pos.x*pos.x + pos.y*pos.y + pos.z*pos.z) || 200;
        const tgt = {
          x: pos.x + dx*dist,
          y: pos.y + dy*dist,
          z: pos.z + dz*dist
        };
        const fov = typeof cam.fov === 'number' ? cam.fov : 50;
        P.keys.push({ pos, tgt, fov });
        P.selected = P.keys.length - 1;
        renderKeyList();
        updateKeyInputs();
        setStatus('Added key from Courage view.');
      }
      function clearKeys() {
        P.keys = [];
        P.selected = -1;
        renderKeyList();
        updateKeyInputs();
        setStatus('Cleared keys.');
      }
      function updateKeyInputs() {
        const k = (P.selected != null && P.selected >= 0 && P.selected < P.keys.length)
          ? P.keys[P.selected]
          : null;
        const px = el('cam-key-pos-x');
        const py = el('cam-key-pos-y');
        const pz = el('cam-key-pos-z');
        const tx = el('cam-key-tgt-x');
        const ty = el('cam-key-tgt-y');
        const tz = el('cam-key-tgt-z');
        const fv = el('cam-key-fov');
        if (!k) {
          if (px) px.value = '';
          if (py) py.value = '';
          if (pz) pz.value = '';
          if (tx) tx.value = '';
          if (ty) ty.value = '';
          if (tz) tz.value = '';
          if (fv) fv.value = '';
          return;
        }
        if (px) px.value = k.pos.x.toFixed(2);
        if (py) py.value = k.pos.y.toFixed(2);
        if (pz) pz.value = k.pos.z.toFixed(2);
        if (tx) tx.value = k.tgt.x.toFixed(2);
        if (ty) ty.value = k.tgt.y.toFixed(2);
        if (tz) tz.value = k.tgt.z.toFixed(2);
        if (fv) fv.value = (typeof k.fov === 'number' ? k.fov.toFixed(1) : '');
      }
      function renderKeyList() {
        const list = el('cam-kf-list');
        if (!list) return;
        if (!P.keys.length) {
          list.textContent = 'No keys yet.';
          return;
        }
        list.innerHTML = '';
        P.keys.forEach((k, idx) => {
          const row = document.createElement('div');
          row.className = 'cam-kf-row';
          row.dataset.index = String(idx);
          const name = k.label || ('KEY ' + (idx + 1));
          row.textContent = name + '  [' +
            k.pos.x.toFixed(0) + ', ' +
            k.pos.y.toFixed(0) + ', ' +
            k.pos.z.toFixed(0) + ']';
          row.addEventListener('click', function() {
            const i = parseInt(this.dataset.index, 10);
            if (!Number.isFinite(i) || !P.keys[i]) return;
            P.selected = i;
            updateKeyInputs();
            setCameraFromKey(P.keys[i]);
            setStatus('Jumped to key ' + (i + 1) + '.');
          });
          if (idx === P.selected) {
            row.classList.add('selected');
          }
          list.appendChild(row);
        });
      }
      function applyInputsToKey() {
        if (P.selected == null || P.selected < 0 || P.selected >= P.keys.length) return;
        const k = P.keys[P.selected];
        const px = el('cam-key-pos-x');
        const py = el('cam-key-pos-y');
        const pz = el('cam-key-pos-z');
        const tx = el('cam-key-tgt-x');
        const ty = el('cam-key-tgt-y');
        const tz = el('cam-key-tgt-z');
        const fv = el('cam-key-fov');
        function num(val, fallback) {
          const n = parseFloat(val);
          return Number.isFinite(n) ? n : fallback;
        }
        k.pos.x = num(px && px.value, k.pos.x);
        k.pos.y = num(py && py.value, k.pos.y);
        k.pos.z = num(pz && pz.value, k.pos.z);
        k.tgt.x = num(tx && tx.value, k.tgt.x);
        k.tgt.y = num(ty && ty.value, k.tgt.y);
        k.tgt.z = num(tz && tz.value, k.tgt.z);
        if (fv && fv.value !== '') {
          const f = parseFloat(fv.value);
          if (Number.isFinite(f)) k.fov = f;
        }
        setCameraFromKey(k);
        setStatus('Updated key ' + (P.selected + 1) + ' from fields.');
      }
      function importMentoShotsIntoPath() {
        const ta = el('mento-shot-text');
        if (!ta) {
          setStatus('MENTO text area not found.');
          return;
        }
        const text = ta.value || '';
        if (!text.trim()) {
          setStatus('No MENTO text to import.');
          return;
        }
        const lines = String(text).split(/\r?\n/);
        // Be forgiving about label quoting / spacing; focus on POS/TGT/LENS payload.
        const pattern = /^0\s+!MENTO\s+SHOT\b.*?POS\s+([\-\d.]+)\s+([\-\d.]+)\s+([\-\d.]+)\s+TGT\s+([\-\d.]+)\s+([\-\d.]+)\s+([\-\d.]+)\s+LENS\s+([\-\d.]+)/;
        const shots = [];
        lines.forEach(function(raw) {
          const line = raw.trim();
          if (!line.toUpperCase().includes('!MENTO SHOT')) return;
          const m = line.match(pattern);
          if (!m) return;
          const px = parseFloat(m[1]);
          const py = parseFloat(m[2]);
          const pz = parseFloat(m[3]);
          const tx = parseFloat(m[4]);
          const ty = parseFloat(m[5]);
          const tz = parseFloat(m[6]);
          const lens = parseFloat(m[7]);
          shots.push({
            pos: { x: px, y: py, z: pz },
            tgt: { x: tx, y: ty, z: tz },
            lens: lens
          });
        });
        if (!shots.length) {
          setStatus('No !MENTO SHOT lines found in MENTO text.');
          return;
        }

        // Map MENTO (LDraw) camera into Courage world coordinates.
        // Courage applies a 180° flip around X when loading bricks,
        // so we mirror Y/Z to match that stage: (x, y, z) → (x, -y, -z).
        P.keys = shots.map(function(s, idx) {
          const wp = { x: s.pos.x, y: -s.pos.y, z: -s.pos.z };
          const wt = { x: s.tgt.x, y: -s.tgt.y, z: -s.tgt.z };
          return {
            pos: wp,
            tgt: wt,
            fov: Number.isFinite(s.lens) ? s.lens : 50,
            label: 'SHOT ' + (idx + 1)
          };
        });
        P.selected = P.keys.length ? 0 : -1;
        renderKeyList();
        updateKeyInputs();
        if (P.selected >= 0) {
          setCameraFromKey(P.keys[P.selected]);
        }
        setStatus('Imported ' + shots.length + ' !MENTO SHOT entries into Camera Path.');
      }
      function flipPath(axis) {
        if (!P.keys.length) {
          setStatus('No keys to flip.');
          return;
        }
        P.keys.forEach(function(k) {
          if (!k || !k.pos || !k.tgt) return;
          if (axis === 'x') {
            k.pos.x *= -1; k.tgt.x *= -1;
          } else if (axis === 'y') {
            k.pos.y *= -1; k.tgt.y *= -1;
          } else if (axis === 'z') {
            k.pos.z *= -1; k.tgt.z *= -1;
          }
        });
        renderKeyList();
        updateKeyInputs();
        if (P.selected >= 0 && P.selected < P.keys.length) {
          setCameraFromKey(P.keys[P.selected]);
        }
        setStatus('Flipped path ' + String(axis).toUpperCase() + '.');
      }
      function copySelectedShotMpd() {
        if (P.selected == null || P.selected < 0 || P.selected >= P.keys.length) {
          setStatus('Select a key to copy as !MENTO SHOT.');
          return;
        }
        const k = P.keys[P.selected];
        const label = 'Key ' + (P.selected + 1);
        const line = '0 !MENTO SHOT "' + label + '" ' +
          'POS ' + k.pos.x.toFixed(2) + ' ' + k.pos.y.toFixed(2) + ' ' + k.pos.z.toFixed(2) + ' ' +
          'TGT ' + k.tgt.x.toFixed(2) + ' ' + k.tgt.y.toFixed(2) + ' ' + k.tgt.z.toFixed(2) + ' ' +
          'LENS ' + (typeof k.fov === 'number' ? k.fov.toFixed(1) : '50');

        const ta = el('mento-shot-text');
        if (ta) {
          const existing = ta.value || '';
          ta.value = existing ? (existing.replace(/\s+$/,'') + '\n' + line + '\n') : (line + '\n');
        }

        function doStatus(ok) {
          setStatus(ok ? 'Copied !MENTO SHOT for ' + label + '.' : 'Generated !MENTO SHOT for ' + label + '.');
        }

        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(line).then(function(){ doStatus(true); }).catch(function(){ doStatus(false); });
        } else {
          try {
            const tmp = document.createElement('textarea');
            tmp.style.position = 'fixed';
            tmp.style.opacity = '0';
            tmp.value = line;
            document.body.appendChild(tmp);
            tmp.focus();
            tmp.select();
            document.execCommand('copy');
            document.body.removeChild(tmp);
            doStatus(true);
          } catch (e) {
            doStatus(false);
          }
        }
      }
      function setCameraFromKey(k) {
        const res = resolveCourage();
        if (!res) return;
        const cam = res.cam;
        const THREE = res.THREE;
        const win = res.win;
        cam.position.set(k.pos.x, k.pos.y, k.pos.z);
        if (typeof cam.lookAt === 'function') {
          if (THREE) {
            const target = new THREE.Vector3(k.tgt.x, k.tgt.y, k.tgt.z);
            cam.lookAt(target);
          } else {
            cam.lookAt(k.tgt.x, k.tgt.y, k.tgt.z);
          }
        }
        if (typeof k.fov === 'number' && 'fov' in cam && typeof cam.updateProjectionMatrix === 'function') {
          cam.fov = k.fov;
          cam.updateProjectionMatrix();
        }
        try {
          const iface = win.MomentoInterface || win.VideoCaptureInterface;
          if (iface && typeof iface.renderCurrentView === 'function') {
            iface.renderCurrentView();
          }
        } catch (e) {}
      }
      function playPath() {
        if (P.keys.length < 2) {
          setStatus('Need at least 2 keys.');
          return;
        }
        const durInput = el('cam-path-dur');
        const v = durInput ? parseFloat(durInput.value) : NaN;
        const d = Number.isFinite(v) && v > 0 ? v : 8;
        P.duration = d;
        P.playing = true;
        P.startTime = performance.now();
        setStatus('Playing path over ' + d.toFixed(1) + 's.');
        requestAnimationFrame(stepPlay);
      }
      function stepPlay(now) {
        if (!P.playing) return;
        const t = (now - P.startTime) / 1000;
        const d = P.duration || 1;
        if (t >= d) {
          P.playing = false;
          if (P.keys.length) setCameraFromKey(P.keys[P.keys.length - 1]);
          setStatus('Path playback finished.');
          return;
        }
        const u = t / d;
        const segCount = P.keys.length - 1;
        const segPos = u * segCount;
        let segIndex = Math.floor(segPos);
        if (segIndex >= segCount) segIndex = segCount - 1;
        const localT = segPos - segIndex;
        const a = P.keys[segIndex];
        const b = P.keys[segIndex + 1];
        const pos = {
          x: a.pos.x + (b.pos.x - a.pos.x) * localT,
          y: a.pos.y + (b.pos.y - a.pos.y) * localT,
          z: a.pos.z + (b.pos.z - a.pos.z) * localT
        };
        const tgt = {
          x: a.tgt.x + (b.tgt.x - a.tgt.x) * localT,
          y: a.tgt.y + (b.tgt.y - a.tgt.y) * localT,
          z: a.tgt.z + (b.tgt.z - a.tgt.z) * localT
        };
        const fov = a.fov + (b.fov - a.fov) * localT;
        setCameraFromKey({ pos, tgt, fov });
        requestAnimationFrame(stepPlay);
      }
      window.addEventListener('DOMContentLoaded', function() {
        const addBtn = el('cam-add-key');
        const clearBtn = el('cam-clear-keys');
        const playBtn = el('cam-play');
        const flipX = el('cam-flip-x');
        const flipY = el('cam-flip-y');
        const flipZ = el('cam-flip-z');
        const copyShot = el('cam-copy-shot');
        const importToPath = el('mento-import-to-path');
        const parseTextBtn = el('mento-parse-shot-text');
        if (addBtn) addBtn.addEventListener('click', addKeyFromView);
        if (clearBtn) clearBtn.addEventListener('click', clearKeys);
        if (playBtn) playBtn.addEventListener('click', playPath);
        if (flipX) flipX.addEventListener('click', function(){ flipPath('x'); });
        if (flipY) flipY.addEventListener('click', function(){ flipPath('y'); });
        if (flipZ) flipZ.addEventListener('click', function(){ flipPath('z'); });
        if (copyShot) copyShot.addEventListener('click', copySelectedShotMpd);
        if (importToPath) importToPath.addEventListener('click', importMentoShotsIntoPath);
        if (parseTextBtn) parseTextBtn.addEventListener('click', function() {
          // Let the Momento capture app update its own state first, then
          // mirror the MPD shots into our Courage-bound camera path.
          setTimeout(importMentoShotsIntoPath, 0);
        });

        ['cam-key-pos-x','cam-key-pos-y','cam-key-pos-z',
         'cam-key-tgt-x','cam-key-tgt-y','cam-key-tgt-z',
         'cam-key-fov'].forEach(function(id) {
          const input = el(id);
          if (!input) return;
          input.addEventListener('change', applyInputsToKey);
          input.addEventListener('blur', applyInputsToKey);
        });

        renderKeyList();
        updateKeyInputs();
      });
    })();
  </script>
  <script>
    (function() {
      try {
        // Mark as homer-hosted so momento_capture_app can prefer parent Courage
        document.body.classList.add('host-homer');
      } catch (e) {}
    })();
  </script>
  <script src="Brickfilm_Studio_Kit/REALITY MEDIA_MOMENTO/momento_capture_app.js"></script>

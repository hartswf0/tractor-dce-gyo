<title>BRICK GRID</title>
<style>
  :root {
    --bg: #020617; --surface: #0b1120; --border: #1f2937; --text: #e5e7eb;
    --muted: #9ca3af; --accent: #38bdf8; --font: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at top left,#0f172a 0,#020617 45%,#000 100%);
    color: var(--text); font-family: var(--font); display: flex; flex-direction: column;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: rgba(15,23,42,0.96); backdrop-filter: blur(10px); z-index: 10;
  }
  .brand {
    font-size: 14px; font-weight: 900; letter-spacing: 0.12em; color: var(--muted);
  }
  .brand span { color: var(--accent); }
  main {
    flex: 1; padding: 16px; overflow-y: auto;
  }
  .family-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  @media (min-width: 640px) { .family-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1024px) { .family-grid { grid-template-columns: repeat(4, 1fr); } }
  .card {
    position: relative; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); overflow: hidden; cursor: pointer; transition: all 0.15s ease;
    text-decoration: none;
  }
  .card:hover { border-color: var(--accent); }
  .card:active { transform: scale(0.97); }
  .card-grid {
    position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr); gap: 3px; padding: 10px;
  }
  .grid-cell {
    border-radius: 3px; border: 1px solid #111827;
  }
  .grid-cell.g { background: #22d3ee; }
  .grid-cell.s { background: #38bdf8; }
  .grid-cell.sky { background: #a855f7; }
  .grid-cell.p { background: #facc15; }
  .grid-cell.focus {
    background: #f8fafc; box-shadow: 0 0 0 1px var(--accent);
  }
  .card-title {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 8px; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(4px);
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    text-align: center; color: var(--text);
  }
  .card-subtitle {
    display: none;
  }
</style>
<base target="_blank">
</head>

<script>
(function () {
  let collection = null;
  try {
    const raw = localStorage.getItem('onyx_scene_collection');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.scenes) && parsed.scenes.length) {
        collection = parsed;
      }
    }
  } catch (e) {
    console.warn('[BRICK-GRID] Failed to read onyx_scene_collection', e);
  }

  if (!collection) return;

  const header = document.querySelector('header');
  if (!header) return;

  const badge = document.createElement('div');
  const count = collection.scenes.length;
  badge.textContent = `ONYX · ${count} scene${count !== 1 ? 's' : ''}`;
  badge.style.float = 'right';
  badge.style.fontSize = '9px';
  badge.style.textTransform = 'uppercase';
  badge.style.letterSpacing = '0.12em';
  badge.style.color = 'var(--muted)';
  badge.style.border = '1px solid var(--border)';
  badge.style.borderRadius = '999px';
  badge.style.padding = '2px 8px';
  badge.style.display = 'inline-block';
  badge.style.marginTop = '2px';

  header.appendChild(badge);
})();
</script>

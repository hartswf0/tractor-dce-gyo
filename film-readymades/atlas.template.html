<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Film Butter / Donor Atlas</title><style>
:root{font:14px Arial,sans-serif;color:#20302c;background:#ede9df}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{height:64px;flex-shrink:0;display:flex;align-items:center;padding:0 24px;gap:20px;border-bottom:1px solid #c7c9b8;background:#f7f5ed}.brand{font-weight:900;letter-spacing:-1px;font-size:19px}.brand em{font-style:normal;color:#677f35}small{font-size:10px;letter-spacing:2px;color:#687668}select,button,input{font:inherit;border:1px solid #b5bbaa;color:inherit;border-radius:6px;padding:10px;background:#f7f5ee}button{cursor:pointer}button:hover{background:#dde5bf}select{max-width:380px}#case{margin-left:auto}main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}.stage{min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}.modelbar{display:flex;align-items:center;gap:10px;padding:16px 24px}.modelbar select{flex:1}.modelbar span{font-size:11px;color:#687668}.picture{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}.picture img{width:100%;height:100%;object-fit:contain}.picture .caption{position:absolute;top:0;left:24px;background:#f7f5eeeb;border-radius:6px;padding:9px 12px;font-size:11px;max-width:calc(100% - 48px)}.picture .missing{padding:40px;max-width:500px;font-size:18px;line-height:1.5}.bottom{padding:15px 24px 20px;border-top:1px solid #c7c9b8;background:#f7f5ed}.bottom p{margin:8px 0;line-height:1.55;max-width:850px;font-size:13px}.bottom b{font-size:12px}.row{display:flex;gap:8px;align-items:center}.row button{font-size:12px}.spacer{flex:1}aside{border-left:1px solid #c7c9b8;display:flex;flex-direction:column;min-height:0;background:#f7f5ed}aside .head{padding:22px 20px 12px}.eyebrow{font-size:10px;letter-spacing:2px;color:#758464;text-transform:uppercase}h1{font-size:24px;letter-spacing:-.7px;line-height:1.12;margin:10px 0}p{line-height:1.55}.stats{display:flex;gap:22px;margin:18px 0}.stats b{font-size:22px;display:block}.stats small{letter-spacing:0;font-size:11px}.search{width:100%;padding:11px}.list{overflow:auto;flex:1;min-height:0;padding:0 12px 15px}.module{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e2e3d8;border-radius:0;background:transparent;font-size:12px;padding:12px 8px;line-height:1.4}.module.active{background:#e3eacb;border-radius:6px}.module span{display:block;color:#77826b;font-size:10px;margin-top:4px}.info{padding:14px 20px;border-top:1px solid #c7c9b8;max-height:38%;overflow:auto;font-size:11px;line-height:1.65}.info a{color:#567131}.info code{font-size:10px;overflow-wrap:anywhere}footer{height:35px;flex-shrink:0;background:#20302c;color:#c9d3bc;display:flex;align-items:center;padding:0 24px;gap:20px;font-size:10px}footer button{background:none;border:none;color:inherit;padding:0;font-size:10px}.phone{display:none}dialog{border:1px solid #8b967c;border-radius:12px;padding:25px;max-width:750px;max-height:85vh;line-height:1.65;background:#f8f6ee;color:#20302c}dialog::backdrop{background:#152217aa}dialog pre{white-space:pre-wrap;font:12px Arial;line-height:1.6}dialog button{float:right}.children button{font-size:11px;display:block;margin:4px 0;text-align:left;width:100%}.hidden{display:none!important}@media(max-width:760px){header{height:56px;padding:0 12px;gap:8px}.brand{font-size:16px}header small{display:none}#case{max-width:200px;width:55%;font-size:11px}main{display:block;position:relative}.stage{height:100%}.modelbar{padding:10px 12px}.modelbar select{max-width:none;min-width:0;font-size:12px}.modelbar span{display:none}.picture .caption{top:2px;left:12px;max-width:calc(100% - 24px);font-size:10px}.bottom{padding:10px 12px 12px}.bottom p{font-size:11px;max-height:68px;overflow:auto}.bottom b{font-size:11px}.row button{font-size:11px;padding:8px}.phone{display:inline-block}aside{display:none;position:absolute;inset:0;background:#f7f5ed;z-index:5;border:0}aside.open{display:flex}aside .head{padding:15px 16px 10px}aside h1{font-size:20px}.stats{margin:10px 0}.info{max-height:32%}footer{height:30px;padding:0 12px;gap:10px;font-size:9px}footer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}footer button{font-size:9px}.picture .missing{font-size:14px;padding:24px}}
</style><header><div class="brand">FILM<em>/</em>BUTTER</div><small>DONOR ATLAS</small><select id="case" aria-label="Film case"></select></header><main><section class="stage"><div class="modelbar"><select id="kit" aria-label="Donor kit"></select><span>Authored geometry · original scale</span><button class="phone" id="openModules">Modules</button></div><div class="picture" id="picture"></div><div class="bottom"><b id="caseTitle"></b><p id="use"></p><div class="row"><button id="whole">Whole kit</button><button id="export">Export module MPD</button><button id="brief">Film brief</button><div class="spacer"></div><span id="status" style="font-size:10px"></span></div></div></section><aside id="aside"><div class="head"><div class="row"><span class="eyebrow">Authored module library</span><span class="spacer"></span><button class="phone" id="closeModules">Done</button></div><h1 id="kitTitle"></h1><div class="stats"><div><b id="moduleCount"></b><small>model definitions</small></div><div><b id="leafCount"></b><small>LDraw leaf placements*</small></div></div><input class="search" id="search" placeholder="Find roof, desk, door, tree…" aria-label="Search authored modules"></div><div class="list" id="list"></div><div class="info" id="info"></div></aside></main><footer><span id="totals"></span><button id="theory">Theory & limits</button><span class="spacer"></span><span>Swipe the image to change film</span></footer><dialog id="dialog"><button id="closeDialog">Close</button><div id="dialogBody"></div></dialog><script>
const DATA=/*DATA*/, CASES=/*CASES*/, DONORS=/*DONORS*/, IMAGES=/*IMAGES*/, THEORY=/*THEORY*/;
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let activeCase=0,kit,mod;
CASES.forEach((c,i)=>$('case').add(new Option(c.title,i)));$('totals').textContent=`${DATA.kits.length} kits · ${DATA.modules.length.toLocaleString()} model definitions · original MPDs included`;
function setCase(i){activeCase=(i+CASES.length)%CASES.length;$('case').value=activeCase;const c=CASES[activeCase];$('kit').innerHTML='';c.kits.filter(k=>DATA.kits.some(d=>d.id===k)).forEach(k=>{$('kit').add(new Option(k+' · '+DATA.kits.find(d=>d.id===k).name,k))});$('caseTitle').textContent=c.title;$('use').textContent=c.use;setKit($('kit').value)}
function setKit(id){kit=DATA.kits.find(k=>k.id===id);$('kit').value=id;$('kitTitle').textContent=kit.name;$('moduleCount').textContent=kit.modules;$('leafCount').textContent=kit.leafInstances.toLocaleString();$('search').value='';setModule(DATA.modules.find(m=>m.kit===id&&m.name===kit.root).id);list()}
function short(m){return m.name.replace(new RegExp('^'+m.kit+' - ','i'),'').replace(/\.ldr$/i,'')}
function list(){const q=$('search').value.toLowerCase();$('list').innerHTML=DATA.modules.filter(m=>m.kit===kit.id&&m.name.includes(q)).map(m=>`<button class="module ${mod?.id===m.id?'active':''}" data-id="${m.id}">${esc(short(m))}<span>${m.leafInstances} leaf placements · ${m.childModuleInstances} child-module instances</span></button>`).join('');$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>setModule(b.dataset.id))}
function setModule(id){mod=DATA.modules.find(m=>m.id===id);const photo=IMAGES[mod.id]||IMAGES[kit.id];const context=mod.name!==kit.root&&!IMAGES[mod.id];$('picture').innerHTML=photo?`<img src="${photo}" alt="Native LDraw rendering of ${esc(context?kit.name:short(mod))}"><div class="caption">${context?'KIT CONTEXT · isolated module preview not rendered':'NATIVE LDRAW PREVIEW'}<br><b>${esc(short(mod))}</b></div>`:`<div class="missing"><b>${esc(short(mod))}</b><p>MPD source and module graph are available. A resolved preview has not been rendered for this selection.</p></div>`;
const childRefs=[...new Set(mod.children.filter(c=>c.kind==='module').map(c=>c.ref))];$('info').innerHTML=`<b>${esc(short(mod))}</b><br>${mod.directPlacements} direct placements · ${mod.sourceSteps} source step groups<br>${mod.transformWarnings.length} local transform warnings<br>Detachable: unverified · strength: not calculated<br><a href="${esc(kit.source)}" target="_blank" rel="noopener">Source and provenance ↗</a><br><code>${esc(mod.name)}</code><div class="children">${childRefs.map(ref=>{let m=DATA.modules.find(m=>m.kit===kit.id&&m.name===ref);return m?`<button data-child="${m.id}">↳ ${esc(short(m))} × ${mod.children.filter(c=>c.ref===ref).length}</button>`:''}).join('')}</div><p>*Leaf placements are not retail piece counts. Flexible geometry and assemblies can change the counting unit. Source boundaries do not prove detachability.</p>`;$('info').querySelectorAll('[data-child]').forEach(b=>b.onclick=()=>setModule(b.dataset.child));$('status').textContent=mod.name===kit.root?'Whole source kit':'Rooted module extract';list()}
function parse(text,fallback){const out={};let key=null;for(const l of text.split(/\r?\n/)){if(/^0 FILE /i.test(l.trim())){key=l.trim().slice(7).trim().replace(/\\/g,'/').toLowerCase();out[key]=[]}if(key)out[key].push(l)}if(!Object.keys(out).length)out[fallback]=['0 FILE '+fallback,...text.split(/\r?\n/)];return out}
function extract(){const sec=parse(DONORS[kit.id],kit.id+'.ldr'),seen=[];function visit(k){if(seen.includes(k))return;seen.push(k);for(const l of sec[k]){const match=l.trim().match(/^1\s+\S+(?:\s+\S+){12}\s+(.+)$/);if(match){const ref=match[1].replace(/\\/g,'/').toLowerCase();if(sec[ref])visit(ref)}}}visit(mod.name);return seen.map(k=>sec[k].filter(l=>l.trim().toUpperCase()!=='0 NOFILE').join('\n')).join('\n\n')+'\n0 NOFILE\n'}
function download(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([extract()],{type:'text/plain'}));a.download=mod.id+'.mpd';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function dialog(html){$('dialogBody').innerHTML=html;$('dialog').showModal()}
$('case').onchange=e=>setCase(+e.target.value);$('kit').onchange=e=>setKit(e.target.value);$('search').oninput=list;$('whole').onclick=()=>setModule(DATA.modules.find(m=>m.kit===kit.id&&m.name===kit.root).id);$('export').onclick=download;$('openModules').onclick=()=>$('aside').classList.add('open');$('closeModules').onclick=()=>$('aside').classList.remove('open');$('closeDialog').onclick=()=>$('dialog').close();$('theory').onclick=()=>dialog('<h2>Theory & limits</h2><pre>'+esc(THEORY)+'</pre>');$('brief').onclick=()=>{const c=CASES[activeCase];dialog(`<h2>${esc(c.title)}</h2><p>${esc(c.use)}</p><h3>Adaptation</h3><p>${esc(c.adapt)}</p>${c.nextReferences.map(r=>'<p>'+esc(r)+'</p>').join('')}`)};let touchX=null;$('picture').ontouchstart=e=>touchX=e.touches[0].clientX;$('picture').ontouchend=e=>{if(touchX!==null){const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>60)setCase(activeCase+(dx<0?1:-1));touchX=null}};setCase(0);
</script></html>

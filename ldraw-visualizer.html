<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LDraw Visualizer & Live Manipulation Workbench</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  /*
  ===================================================================
  GLOBAL & BASE STYLES
  ===================================================================
  */
  :root {
      --bg-dark: #0a0a0a;
      --bg-medium: #141414;
      --text-main: #d0d0d0;
      --color-highlight: #00ffaa;
      --color-accent: #a0f;
      --color-editable: #007799;
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Courier New', monospace;
    line-height: 1.6; 
    overflow: hidden; 
  }
  
  #app-container {
    height: 100vh;
    display: flex;
    max-height: 100vh;
    overflow: hidden;
  }
  
  /* Mobile-first Layout Adaptation */
  @media (max-width: 768px) {
    #app-container {
        flex-direction: column;
    }
    #code-editor-panel {
        height: 50vh; 
        flex: none;
        padding-bottom: 0;
    }
    #visualizer-panel {
        width: 100%;
        height: 50vh; 
        border-left: none;
        border-top: 1px solid #222;
    }
  }

  /*
  ===================================================================
  CODE EDITOR PANEL STYLES
  ===================================================================
  */
  #code-editor-panel {
    flex: 1;
    overflow-y: scroll;
    height: 100vh;
    padding: 2.5rem 2.5rem 2.5rem 4.5rem; 
    background: var(--bg-medium);
  }

  .line-container {
    position: relative;
    display: flex; 
    align-items: flex-start;
    min-height: 1.6em;
    cursor: pointer;
    transition: background-color 150ms;
    white-space: pre-wrap; 
    border-left: 3px solid transparent; 
  }
  
  .line-number-wrapper {
    width: 20px; 
    flex-shrink: 0;
    text-align: right;
    padding-right: 5px;
    opacity: 0.5;
    color: #fff;
    font-weight: bold;
    position: relative;
  }
  
  /* Selection Feedback */
  .line-container.selected-line {
    background-color: rgba(0, 255, 170, 0.15); 
    border-left: 3px solid var(--color-highlight); 
  }
  
  /* Editable Value Styling */
  .editable-value {
    display: inline-block;
    padding: 1px 3px;
    margin: 0 1px;
    border-radius: 3px;
    background-color: rgba(0, 119, 153, 0.3); 
    color: var(--color-highlight);
    cursor: text;
    user-select: none; 
    min-width: 40px;
    text-align: center;
    transition: background-color 100ms, box-shadow 100ms;
  }
  .editable-value:focus {
    outline: none;
    background-color: rgba(0, 255, 170, 0.2); 
    box-shadow: 0 0 5px var(--color-highlight);
  }
  
  /* Minimap styles omitted for brevity but remain functional */

  /*
  ===================================================================
  3D VISUALIZER PANEL STYLES & CONTROLS
  ===================================================================
  */
  #visualizer-panel {
    width: 50%; 
    height: 100vh;
    background: #000;
    position: relative;
    border-left: 1px solid #222;
  }

  #canvas-container {
      width: 100%;
      height: 100%;
  }

  /* Transformation Console (Surfaces the Invisible Math) */
  #matrix-console {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0, 0, 0, 0.6);
    padding: 10px;
    border-radius: 8px;
    font-size: 10px;
    line-height: 1;
    z-index: 10;
    display: none; /* Only show when a piece is selected */
    max-width: 200px;
    pointer-events: none; /* Ignore mouse events */
  }
  #matrix-console table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
  }
  #matrix-console td {
    padding: 2px 4px;
    text-align: right;
    color: var(--color-highlight);
    border: 1px solid #333;
  }
  #matrix-console th {
    text-align: left;
    color: #999;
  }
  
  /* Direct Manipulation Info (Mobile Friendly HUD) */
  #direct-manipulation-info {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.8);
    padding: 8px 12px;
    border-radius: 8px;
    color: white;
    font-size: 14px;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  
  /* Gizmo for Dragging Visualization */
  .gizmo {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s, background-color 0.2s;
  }
  .gizmo.active {
    opacity: 0.8;
  }
  .gizmo.x { background: red; }
  .gizmo.z { background: blue; }


</style>
</head>
<body>

<div id="app-container">
    
    <!-- Code Editor Panel (Left side) -->
    <div id="code-editor-panel">
      <!-- Minimap Container (Minimap is functional but styling excluded for file size) -->
      <div id="minimap-container">
          <div id="minimap-content"></div>
          <div id="minimap-viewport">
              <span id="minimap-label"></span>
          </div>
      </div>
    </div>

    <!-- 3D Visualizer Panel (Right side) -->
    <div id="visualizer-panel">
        <div id="canvas-container">
            <!-- Three.js canvas will be inserted here -->
        </div>
        
        <!-- Transformation Console (Surfaces the Invisible) -->
        <div id="matrix-console">
            <h3 class="text-white text-xs mb-1">Matrix (Part: <span id="matrix-line-number"></span>)</h3>
            <table id="matrix-table">
                <tr><td>R11</td><td>R21</td><td>R31</td><td>Tx</td></tr>
                <tr><td>R12</td><td>R22</td><td>R32</td><td>Ty</td></tr>
                <tr><td>R13</td><td>R23</td><td>R33</td><td>Tz</td></tr>
                <tr><td>0</td><td>0</td><td>0</td><td>1</td></tr>
            </table>
        </div>

        <!-- Dragging Gizmo (Visual Feedback) -->
        <div id="gizmo-x" class="gizmo x"></div>
        <div id="gizmo-z" class="gizmo z"></div>

        <!-- Direct Manipulation Info (Mobile HUD) -->
        <div id="direct-manipulation-info">
            Drag the piece (X:<span id="drag-x">0</span>, Y:<span id="drag-y">0</span>, Z:<span id="drag-z">0</span>)
        </div>
    </div>

</div>

<script>
// The LDraw data simulates complex scene construction data
const ldrawData = `0 FILE garden_uprising_scene_02_arrival.mpd
0 Name: SCENE 02 - THE MUPPETS ARRIVE
0 Author: Garden-Uprising-Full-Build
0 !LDRAW_ORG Model
0 !LICENCE Redistributable under CCAL version 2.0
0 BFC CERTIFY CCW
0 //
===================================xa==============================
0 // LEGOS ANALYSIS - SCENE 02: THE MUPPETS ARRIVE
0 // =================================================================
0 // L (LOCATION): Corporate plaza entrance
0 //   - Grey concrete plaza
0 STEP
0 // ===== PLAZA FOUNDATION (Grey 7) =====
1 7 -360 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 -300 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 -240 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 -180 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 -120 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 -60 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 0 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 60 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 120 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 180 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 240 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 300 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 360 0 240 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 -360 0 180 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 -300 0 180 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 -240 0 180 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 -180 0 180 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 -120 0 180 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 -60 0 180 1 0 0 0 1 0 0 0 1 parts/3024.dat
1 7 0 0 180 1 0 0 0 1 0 0 0 1 parts/3024.dat
0 // ===== KERMIT THE FROG (Green 2) =====
// Torso (green)
1 2 120 -60 60 1 0 0 0 1 0 0 0 1 parts/973ps1.dat
// Kermit HEAD (Green 2)
1 2 120 -84 60 1 0 0 0 1 0 0 0 1 89515p01.dat
0 // ===== MISS PIGGY (Pink 13) =====
// Torso (pink/white)
1 13 60 -60 60 1 0 0 0 1 0 0 0 1 parts/973ps1.dat`;

// --- GLOBAL VARIABLES ---
let lines = ldrawData.split('\n'); 
let selectedLineIndex = null;
let selectedMesh = null; // The currently selected THREE.Mesh
let rangeSelection = null;

// 3D Scene Components
let scene, camera, renderer, controls, raycaster, pointer;
const PART_MESHES = []; 
let highlightedMesh = null;
let isDragging3D = false;
let dragPlane = new THREE.Plane();
let intersection = new THREE.Vector3();
let offset = new THREE.Vector3();

// LDraw Color Mapping (Simplified)
const LDrawColors = {
    0: 0x05131D, 1: 0xFFFFFF, 2: 0x008000, 4: 0xCC0000, 7: 0x808080, 
    8: 0x0033B2, 13: 0xFF69B4, 72: 0x3D3D3D, 999: 0xFFD700 
};

// DOM Elements
const body = document.getElementById('code-editor-panel');
const lineContainers = []; 
const canvasContainer = document.getElementById('canvas-container');
const matrixConsole = document.getElementById('matrix-console');
const dragInfo = document.getElementById('direct-manipulation-info');
const gizmoX = document.getElementById('gizmo-x');
const gizmoZ = document.getElementById('gizmo-z');

// --- INITIALIZATION ---

window.onload = function() {
    initThreeJs();
    renderCodeEditor();
    setupEventListeners();
    updateMinimapViewport(); 
    animate(); 
}

// --- CORE THREE.JS VISUALIZER ---

function initThreeJs() {
    const width = canvasContainer.clientWidth;
    const height = canvasContainer.clientHeight;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    camera = new THREE.PerspectiveCamera(75, width / height, 1, 5000);
    camera.position.set(500, 500, 500); 

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    canvasContainer.appendChild(renderer.domElement);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; 
    controls.dampingFactor = 0.05;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(500, 1000, 500);
    scene.add(directionalLight);

    // Grid for reference
    const gridHelper = new THREE.GridHelper(1000, 50, 0x444444, 0x444444);
    scene.add(gridHelper);

    // Raycasting setup for picking/dragging
    raycaster = new THREE.Raycaster();
    pointer = new THREE.Vector2();

    buildSceneFromLDraw();

    window.addEventListener('resize', onWindowResize);
}

function onWindowResize() {
    const width = canvasContainer.clientWidth;
    const height = canvasContainer.clientHeight;
    
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
    
    // updateMinimapViewport is handled in main event loop
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

/**
 * Parses LDraw lines and adds corresponding 3D meshes to the scene.
 */
function buildSceneFromLDraw() {
    PART_MESHES.forEach(mesh => scene.remove(mesh));
    PART_MESHES.length = lines.length; 

    const geometry = new THREE.BoxGeometry(20, 20, 20); 

    lines.forEach((line, index) => {
        if (line.startsWith('1')) {
            const tokens = line.split(/\s+/).filter(t => t.length > 0);
            
            if (tokens.length >= 14) {
                const colorCode = parseInt(tokens[1], 10);
                const colorHex = LDrawColors[colorCode] || 0xFFFFFF;
                const material = new THREE.MeshLambertMaterial({ color: colorHex });

                const mesh = new THREE.Mesh(geometry, material);
                
                // Update transformation and store original color
                updateMeshFromLine(index, mesh);
                mesh.userData = { originalColor: colorHex, lineIndex: index, isDraggable: true };

                scene.add(mesh);
                PART_MESHES[index] = mesh;
            }
        }
    });
}

/**
 * Updates a single mesh's position/rotation based on its corresponding LDraw line.
 */
function updateMeshFromLine(index, mesh = PART_MESHES[index]) {
    if (!mesh || !lines[index] || !lines[index].startsWith('1')) return;

    const line = lines[index];
    const tokens = line.split(/\s+/).filter(t => t.length > 0);

    const x = parseFloat(tokens[2]);
    const y = parseFloat(tokens[3]);
    const z = parseFloat(tokens[4]);
    const matrixValues = tokens.slice(5, 14).map(parseFloat);
    
    if (isNaN(x) || matrixValues.some(isNaN)) {
        console.error(`Invalid numeric values found in line ${index + 1}. Update skipped.`);
        return;
    }

    const matrix = new THREE.Matrix4();
    matrix.set(
        matrixValues[0], matrixValues[3], matrixValues[6], x,
        matrixValues[1], matrixValues[4], matrixValues[7], y, 
        matrixValues[2], matrixValues[5], matrixValues[8], z, 
        0, 0, 0, 1
    );
    
    mesh.matrix.identity();
    mesh.applyMatrix4(matrix);
    mesh.matrixWorldNeedsUpdate = true;
    
    // Update the matrix console (Surfaces the Invisible)
    if (index === selectedLineIndex) {
        updateMatrixConsole(mesh.matrix, index);
    }
}

/**
 * Updates the dedicated Transformation Console UI. (Surfaces the Invisible)
 */
function updateMatrixConsole(matrix, lineIndex) {
    const els = document.querySelectorAll('#matrix-table td');
    const elements = matrix.elements;
    
    document.getElementById('matrix-line-number').textContent = lineIndex + 1;

    // elements array is column-major: [ R11, R21, R31, T1(Tx), R12, R22, R32, T2(Ty), ... ]
    
    // Row 1 (R11, R21, R31, Tx) - Indices 0, 1, 2, 3
    // Row 2 (R12, R22, R32, Ty) - Indices 4, 5, 6, 7 (LDraw: m12, m22, m32, Ty)
    // Row 3 (R13, R23, R33, Tz) - Indices 8, 9, 10, 11 (LDraw: m13, m23, m33, Tz)
    
    const displayOrder = [0, 4, 8, 3, 1, 5, 9, 7, 2, 6, 10, 11];

    displayOrder.forEach((matrixIndex, tdIndex) => {
        if (els[tdIndex]) {
            els[tdIndex].textContent = elements[matrixIndex].toFixed(2);
        }
    });

    matrixConsole.style.display = 'block';
}

/**
 * Highlights a mesh in the 3D scene based on the selected line index.
 */
function highlightMesh(index) {
    if (highlightedMesh) {
        highlightedMesh.material.emissive.set(0x000000); 
        highlightedMesh = null;
    }

    if (index !== null && PART_MESHES[index]) {
        highlightedMesh = PART_MESHES[index];
        highlightedMesh.material.emissive.set(0x00ffaa); 
        highlightedMesh.material.emissiveIntensity = 0.5;
        selectedMesh = highlightedMesh;
        updateMatrixConsole(selectedMesh.matrix, index);
    } else {
        selectedMesh = null;
        matrixConsole.style.display = 'none';
    }
}

// --- INTERACTIVE DRAGGING (Overcoming Cognitive Limits & Rapid What-If) ---

const tempPointer = new THREE.Vector2();

function getPointer(event) {
    // Handle touch and mouse events
    const clientX = event.touches ? event.touches[0].clientX : event.clientX;
    const clientY = event.touches ? event.touches[0].clientY : event.clientY;
    
    const rect = renderer.domElement.getBoundingClientRect();
    tempPointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    tempPointer.y = - ((clientY - rect.top) / rect.height) * 2 + 1;
    return tempPointer;
}

function onPointerDown(event) {
    if (selectedMesh) {
        // Only allow dragging if a mesh is selected
        const pointerPos = getPointer(event);
        raycaster.setFromCamera(pointerPos, camera);
        
        const intersects = raycaster.intersectObject(selectedMesh);

        if (intersects.length > 0) {
            controls.enabled = false; // Disable orbit controls during drag
            isDragging3D = true;
            
            // Define the drag plane as the XZ plane passing through the mesh's current position
            dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), selectedMesh.position);
            
            // Calculate the offset from the intersection point to the mesh center
            if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
                offset.copy(intersection).sub(selectedMesh.position);
            }

            // Show Gizmo and HUD feedback
            dragInfo.style.opacity = 1;
            gizmoX.classList.add('active');
            gizmoZ.classList.add('active');
            updateGizmoPosition(selectedMesh.position);

            event.preventDefault(); // Prevent text selection on desktop
        }
    }
}

function onPointerMove(event) {
    if (isDragging3D && selectedMesh) {
        const pointerPos = getPointer(event);
        raycaster.setFromCamera(pointerPos, camera);

        if (raycaster.ray.intersectPlane(dragPlane, intersection)) {
            const newPos = intersection.sub(offset);
            
            // Snap to the LDraw unit grid (20 LDU in Three.js terms, or 60 in LDraw coordinates)
            const snapSize = 60;
            const snappedX = Math.round(newPos.x / snapSize) * snapSize;
            const snappedZ = Math.round(newPos.z / snapSize) * snapSize;
            
            // Only update X and Z for floor dragging
            selectedMesh.position.x = snappedX;
            selectedMesh.position.z = snappedZ;
            
            selectedMesh.updateMatrixWorld(true);

            // Update LDraw Line and Editor UI (Links Perspectives)
            updateLDrawLineFromMesh(selectedMesh);

            // Update HUD feedback
            document.getElementById('drag-x').textContent = snappedX.toFixed(0);
            document.getElementById('drag-z').textContent = snappedZ.toFixed(0);
            updateGizmoPosition(selectedMesh.position);
        }
    }
}

function onPointerUp() {
    if (isDragging3D) {
        controls.enabled = true;
        isDragging3D = false;
        dragInfo.style.opacity = 0;
        gizmoX.classList.remove('active');
        gizmoZ.classList.remove('active');
    }
}

function updateGizmoPosition(position) {
    const vector = position.clone();
    // Project 3D position to 2D screen coordinates
    vector.project(camera); 

    const rect = renderer.domElement.getBoundingClientRect();
    const x = (vector.x * 0.5 + 0.5) * rect.width + rect.left;
    const y = (-vector.y * 0.5 + 0.5) * rect.height + rect.top;

    gizmoX.style.left = `${x}px`;
    gizmoX.style.top = `${y}px`;
    gizmoZ.style.left = `${x}px`;
    gizmoZ.style.top = `${y}px`;
}

/**
 * Updates the LDraw line string and the code editor UI based on a mesh's new position.
 * This is the crucial synchronization step.
 */
function updateLDrawLineFromMesh(mesh) {
    const lineIndex = mesh.userData.lineIndex;
    if (lineIndex === undefined) return;

    // Get current line tokens
    let tokens = lines[lineIndex].split(/\s+/).filter(t => t.length > 0);
    
    // New Position (LDraw coordinates)
    const newX = mesh.position.x.toFixed(0);
    const newY = mesh.position.y.toFixed(0);
    const newZ = mesh.position.z.toFixed(0);

    // Update tokens: X (2), Y (3), Z (4)
    tokens[2] = newX;
    tokens[3] = newY; 
    tokens[4] = newZ;

    // Reconstruct and update the line in memory
    lines[lineIndex] = tokens.slice(0, 2).join(' ') + ' ' + tokens.slice(2).join(' ');

    // Update the corresponding editable spans in the editor
    const container = lineContainers[lineIndex].querySelector('.line-content');
    const editableSpans = container.querySelectorAll('.editable-value');
    
    if (editableSpans.length >= 3) {
        editableSpans[0].textContent = newX; // X
        editableSpans[1].textContent = newY; // Y
        editableSpans[2].textContent = newZ; // Z
    }
    
    // Update the matrix console
    updateMatrixConsole(mesh.matrix, lineIndex);
}

// --- CODE EDITOR LOGIC (Numeric Value Input) ---

/**
 * Handles input on an editable value, updates the LDraw line string, and refreshes the 3D mesh.
 */
function handleValueInput(e, lineIndex, tokenIndex) {
    let newValue = e.target.textContent.trim();
    let numericValue = parseFloat(newValue);

    if (isNaN(numericValue)) {
        e.target.textContent = lines[lineIndex].split(/\s+/).filter(t => t.length > 0)[tokenIndex];
        return;
    }

    let formattedValue = numericValue.toFixed(4).replace(/\.?0+$/, "");
    if (formattedValue === '-0') formattedValue = '0';
    e.target.textContent = formattedValue;
    
    // 1. Update the LDraw line string in memory
    let tokens = lines[lineIndex].split(/\s+/).filter(t => t.length > 0);
    tokens[tokenIndex] = formattedValue;
    lines[lineIndex] = tokens.slice(0, 2).join(' ') + ' ' + tokens.slice(2).join(' ');
    
    // 2. Update the 3D mesh (immediate feedback)
    updateMeshFromLine(lineIndex);

    // 3. Ensure the selection highlights the line being edited
    if (selectedLineIndex !== lineIndex) {
        handleLineClick(lineIndex);
    }
}

// --- SELECTION & UTILITY FUNCTIONS (Minimap, Selection) ---

function findCodeBlock(index) {
  const lineCount = lines.length;
  if (lines[index].startsWith('1')) {
      let blockStart = index;
      let blockEnd = index;
      for (let i = index; i >= 0; i--) {
          if (lines[i].startsWith('0 //') || lines[i].startsWith('0 STEP') || lines[i].startsWith('0 FILE')) {
              blockStart = i + 1;
              break;
          }
      }
      for (let i = index; i < lineCount; i++) {
          if (lines[i].startsWith('0 //') || lines[i].startsWith('0 STEP')) {
              blockEnd = i - 1;
              break;
          }
      }
      return { start: blockStart, end: Math.max(blockStart, blockEnd) };
  } else if (lines[index].startsWith('0 //') || lines[index].startsWith('0 STEP')) {
      return { start: index, end: index };
  }
  return { start: index, end: index };
}

function updateSelection(start, end = start, className = 'selected-line') {
  document.querySelectorAll('.selected-line, .selected-range').forEach(el => {
    el.classList.remove('selected-line', 'selected-range');
  });

  if (start !== null) {
    for (let i = start; i <= end; i++) {
      if (lineContainers[i]) {
        lineContainers[i].classList.add(className);
      }
    }
    rangeSelection = { start, end };
    highlightMesh(className === 'selected-line' ? start : null); 
  } else {
    rangeSelection = null;
    highlightMesh(null);
  }
  
  updateMinimapViewport();
}


function handleLineClick(lineIndex) {
    const isCurrentlySelected = selectedLineIndex === lineIndex;

    if (!isCurrentlySelected || rangeSelection) {
        updateSelection(null); 
        selectedLineIndex = null;
    }

    if (lines[lineIndex].startsWith('1')) { // Only part lines can be single-selected or block-selected
        if (isCurrentlySelected && !rangeSelection) {
            const range = findCodeBlock(lineIndex);
            updateSelection(range.start, range.end, 'selected-range');
            lineContainers[range.start].scrollIntoView({ behavior: 'smooth', block: 'start' });
            selectedLineIndex = lineIndex; 
        } else if (!isCurrentlySelected) {
            updateSelection(lineIndex, lineIndex, 'selected-line');
            selectedLineIndex = lineIndex;
            lineContainers[lineIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            updateSelection(null);
            selectedLineIndex = null;
        }
    } else {
        // Handle non-part lines (metadata, comments)
        updateSelection(lineIndex, lineIndex, 'selected-line');
        selectedLineIndex = lineIndex;
    }
}

// Minimal Minimap logic (for function completeness)
let minimapRafId = null; 
const minimapContainer = document.getElementById('minimap-container');
const minimapContent = document.getElementById('minimap-content');
const minimapViewport = document.getElementById('minimap-viewport');
const minimapLabel = document.getElementById('minimap-label');
function _updateMinimapViewportLogic() {
  minimapRafId = null; 
  const totalHeight = body.scrollHeight;
  const minimapHeight = minimapContainer.offsetHeight;
  const linesCount = lines.length;
  const scrollTop = body.scrollTop;
  if (rangeSelection) { minimapViewport.classList.add('snapped'); } else { minimapViewport.classList.remove('snapped'); }
  
  const viewportHeight = body.offsetHeight;
  const minimapTop = (scrollTop / totalHeight) * minimapHeight;
  const minimapSize = (viewportHeight / totalHeight) * minimapHeight;
  
  minimapViewport.style.top = `${minimapTop}px`;
  minimapViewport.style.height = `${Math.max(minimapSize, 10)}px`;
  
  const currentLineIndex = Math.floor((scrollTop / totalHeight) * linesCount);
  minimapLabel.textContent = `${rangeSelection ? rangeSelection.start + 1 : currentLineIndex + 1}`;
  minimapLabel.style.opacity = rangeSelection ? 1 : 0.5;
}
function updateMinimapViewport() {
    if (minimapRafId === null) {
        minimapRafId = window.requestAnimationFrame(_updateMinimapViewportLogic);
    }
}

/**
 * Renders the LDraw code content into the editor panel, inserting editable spans.
 */
function renderCodeEditor() {
    lines.forEach((line, lineIndex) => {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'line-container';
        lineDiv.dataset.line = lineIndex;
        lineDiv.addEventListener('click', () => handleLineClick(lineIndex));
        
        const commandCode = line.charAt(0) || ' ';
        const contentBody = line.substring(1).trimStart();
        
        const lineNumberWrapper = document.createElement('div');
        lineNumberWrapper.className = 'line-number-wrapper';
        lineNumberWrapper.textContent = commandCode;
        
        const luminousBolt = document.createElement('div');
        luminousBolt.className = 'luminous-bolt';
        lineNumberWrapper.appendChild(luminousBolt);
        
        const lineContentDiv = document.createElement('div');
        lineContentDiv.className = 'line-content';

        if (commandCode === '1') {
            const tokens = line.split(/\s+/).filter(t => t.length > 0);
            
            lineContentDiv.appendChild(document.createTextNode(tokens[0] + ' ' + tokens[1] + ' '));

            // X, Y, Z coordinates (Tokens 2, 3, 4) - Primary Editable Values
            for (let i = 2; i <= 4; i++) {
                const span = document.createElement('span');
                span.className = 'editable-value';
                span.setAttribute('contenteditable', 'true');
                span.dataset.tokenIndex = i;
                span.textContent = tokens[i];
                span.addEventListener('input', (e) => handleValueInput(e, lineIndex, i));
                lineContentDiv.appendChild(span);
                lineContentDiv.appendChild(document.createTextNode(' '));
            }

            // 3x3 Rotation Matrix (Tokens 5 through 13) - Secondary Editable Values
            for (let i = 5; i <= 13; i++) {
                const span = document.createElement('span');
                span.className = 'editable-value text-xs';
                span.setAttribute('contenteditable', 'true');
                span.dataset.tokenIndex = i;
                span.textContent = parseFloat(tokens[i]).toFixed(2).replace(/\.?0+$/, "");
                span.addEventListener('input', (e) => handleValueInput(e, lineIndex, i));
                lineContentDiv.appendChild(span);
                lineContentDiv.appendChild(document.createTextNode(' '));
            }

            // Part Name (Last token, read-only)
            if (tokens.length > 14) {
                lineContentDiv.appendChild(document.createTextNode(tokens[14]));
            }

        } else {
            const textNode = document.createTextNode(contentBody);
            lineContentDiv.appendChild(textNode);
        }
        
        lineDiv.appendChild(lineNumberWrapper);
        lineDiv.appendChild(lineContentDiv);

        body.appendChild(lineDiv);
        lineContainers.push(lineDiv); 

        // Minimap Line Setup (Minimal for function completeness)
        const minimapLineDiv = document.createElement('div');
        minimapLineDiv.className = 'minimap-line';
        if (commandCode === '1') minimapLineDiv.classList.add('part');
        else if (contentBody.trim().startsWith('//')) minimapLineDiv.classList.add('comment');
        else minimapLineDiv.classList.add('meta'); 
        minimapLineDiv.addEventListener('click', (e) => { e.stopPropagation(); handleLineClick(lineIndex); });
        minimapContent.appendChild(minimapLineDiv);
    });
}

/**
 * Sets up all general event listeners for the editor and 3D manipulation.
 */
function setupEventListeners() {
    // 3D Manipulation Events (Supports touch and mouse for mobile friendliness)
    renderer.domElement.addEventListener('mousedown', onPointerDown, false);
    renderer.domElement.addEventListener('mousemove', onPointerMove, false);
    renderer.domElement.addEventListener('mouseup', onPointerUp, false);
    renderer.domElement.addEventListener('touchstart', onPointerDown, false);
    renderer.domElement.addEventListener('touchmove', onPointerMove, false);
    renderer.domElement.addEventListener('touchend', onPointerUp, false);

    // Code Editor Events
    // (Minimap drag logic omitted for brevity but should be here)
    body.addEventListener('scroll', updateMinimapViewport);
}

</script>

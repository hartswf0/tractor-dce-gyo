<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="background:#333; font-family:Arial, sans-serif;">
  <defs>
    <!-- LEGO Stud Pattern -->
    <pattern id="studs" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="6" fill="#000" opacity="0.15"/>
      <circle cx="10" cy="10" r="6" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <!-- Drop Shadow for Bricks -->
    <filter id="brickShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Plate -->
  <g transform="translate(20, 20)">
    <rect width="300" height="60" rx="4" fill="#F4F4F4" filter="url(#brickShadow)"/>
    <rect x="5" y="5" width="290" height="50" fill="none" stroke="#333" stroke-width="2"/>
    <text x="20" y="40" font-weight="bold" fill="#333" font-size="24">STEP 1: THE TRAY</text>
  </g>

  <!-- The 9x9 Baseplate -->
  <g transform="translate(140, 100)">
    <!-- Base -->
    <rect width="520" height="520" fill="#287F46" filter="url(#brickShadow)"/>
    <rect width="520" height="520" fill="url(#studs)"/>

    <!-- ZONE 3: Forest Rim (Blue Tiles) -->
    <rect x="20" y="20" width="480" height="480" fill="none" stroke="#0055BF" stroke-width="8" stroke-dasharray="20,10"/>
    <rect x="230" y="10" width="60" height="20" fill="#0055BF"/>
    <text x="260" y="25" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">ZONE 3</text>

    <!-- ZONE 2: Actors Ring (Yellow Tiles) -->
    <rect x="120" y="120" width="280" height="280" fill="none" stroke="#F6D713" stroke-width="8"/>
    <rect x="230" y="110" width="60" height="20" fill="#F6D713"/>
    <text x="260" y="125" text-anchor="middle" fill="#000" font-size="12" font-weight="bold">ZONE 2</text>

    <!-- ZONE 1: The Fight (Red Center) -->
    <rect x="220" y="220" width="80" height="80" fill="#C91A09" opacity="0.8"/>
    <text x="260" y="265" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">VOID</text>
  </g>
</svg>

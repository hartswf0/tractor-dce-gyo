<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="background:#333; font-family:Arial, sans-serif;">
  <defs>
    <filter id="shadow"><feDropShadow dx="4" dy="4" stdDeviation="3" flood-opacity="0.4"/></filter>
  </defs>

  <!-- Header -->
  <g transform="translate(20, 20)">
    <rect width="320" height="60" rx="4" fill="#F4F4F4" filter="url(#shadow)"/>
    <text x="20" y="40" font-weight="bold" fill="#333" font-size="24">STEP 4: ESCALATION</text>
  </g>

  <!-- Baseplate (Dimmed) -->
  <g transform="translate(200, 100)" opacity="0.4">
    <rect width="400" height="400" fill="#287F46"/>
  </g>

  <!-- Vector 1: Train (Intrusion) -->
  <g transform="translate(580, 250)">
    <rect x="0" y="0" width="160" height="60" rx="4" fill="#C91A09" filter="url(#shadow)"/>
    <circle cx="30" cy="60" r="10" fill="#000"/>
    <circle cx="70" cy="60" r="10" fill="#000"/>
    <rect x="10" y="10" width="40" height="20" fill="#0055BF" opacity="0.5"/>
    <path d="M 0 30 L -100 30" stroke="#F6D713" stroke-width="15" stroke-linecap="round"/>
    <circle cx="-20" cy="30" r="4" fill="#333"/>
    <circle cx="-50" cy="30" r="4" fill="#333"/>
    <text x="-90" y="-10" fill="#F6D713" font-weight="bold">INTRUSION</text>
  </g>

  <!-- Vector 2: Plane (Surveillance) -->
  <g transform="translate(400, 50)">
    <path d="M 0 0 L -60 40 L 60 40 Z" fill="#0055BF" filter="url(#shadow)"/>
    <rect x="-20" y="20" width="40" height="80" fill="#0055BF"/>
    <ellipse cx="0" cy="250" rx="60" ry="20" fill="#000" opacity="0.3"/>
    <line x1="0" y1="40" x2="0" y2="250" stroke="#fff" stroke-width="2" stroke-dasharray="10,5"/>
    <text x="10" y="150" fill="#fff" font-weight="bold">SURVEILLANCE</text>
  </g>
</svg>

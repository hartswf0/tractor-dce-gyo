<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>INCEPTION // HYPER_MONITOR</title>
    <style>
        :root {
            /* THEME: DEEP SPACE */
            --bg: #09090b;
            --panel: #121214;
            --border: #27272a;
            --text: #e4e4e7;
            --dim: #52525b;
            
            /* SEMANTIC SYSTEM */
            --func: #f43f5e;   /* Rose: Action/Logic */
            --var: #2dd4bf;    /* Teal: State/Data */
            --ctrl: #fbbf24;   /* Amber: Flow/Decisions */
            --comment: #3f3f46;
            
            /* RUNTIME STATES */
            --hot: #ffffff;    /* Execution Flash */
            --link: #3b82f6;   /* Dependency Wire */
            
            --font: 'JetBrains Mono', 'Menlo', monospace;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: grid;
            grid-template-rows: 48px 1fr; /* Header | Main */
            overflow: hidden;
        }

        /* --- HEADER --- */
        header {
            background: #000;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
            font-size: 10px;
            z-index: 50;
        }

        .brand { font-weight: 900; letter-spacing: 0.1em; color: var(--text); }
        .brand span { color: var(--func); }

        .live-pulse {
            width: 8px; height: 8px; background: var(--func); border-radius: 50%;
            box-shadow: 0 0 10px var(--func);
            animation: pulse-red 2s infinite;
        }
        
        @keyframes pulse-red { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* --- MAIN LAYOUT --- */
        main {
            display: grid;
            grid-template-rows: 45vh 1fr; /* Grid Top | Code Bottom */
        }

        /* --- TOP: FUNCTIONAL GRID --- */
        .grid-section {
            background: #050505;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 1000px;
        }

        .grid-container {
            width: min(40vh, 80vw);
            height: min(40vh, 80vw);
            position: relative;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 2px;
            width: 100%;
            height: 100%;
        }

        .block {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background 0.1s, transform 0.1s;
            overflow: hidden;
        }

        /* Runtime Execution Flash */
        .block.executing {
            background: var(--hot) !important;
            border-color: var(--hot) !important;
            box-shadow: 0 0 20px var(--hot);
            z-index: 200;
            transform: scale(1.3);
        }

        /* Semantic Styling */
        .block[data-type="function"] { border-top: 2px solid var(--func); background: rgba(244, 63, 94, 0.05); }
        .block[data-type="variable"] { border-top: 2px solid var(--var); background: rgba(45, 212, 191, 0.05); }
        .block[data-type="control"]  { border-top: 2px solid var(--ctrl); background: rgba(251, 191, 36, 0.05); }

        .block-icon { font-size: 10px; margin-bottom: 2px; opacity: 0.8; }
        .block-label { font-size: 6px; opacity: 0.6; max-width: 100%; overflow: hidden; white-space: nowrap; }

        .block:hover {
            z-index: 100;
            transform: scale(1.2) translateZ(10px);
            border-color: #fff;
        }

        .block.active { box-shadow: 0 0 0 2px #fff; z-index: 50; }

        /* Wires */
        .wire-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }
        path.wire {
            fill: none;
            stroke: var(--dim);
            stroke-width: 1;
            opacity: 0.2;
            transition: stroke 0.1s;
        }
        path.wire.active {
            stroke: var(--link);
            stroke-width: 2;
            opacity: 1;
            filter: drop-shadow(0 0 4px var(--link));
        }
        path.wire.firing {
            stroke: var(--hot);
            stroke-width: 3;
            opacity: 1;
            filter: drop-shadow(0 0 8px var(--hot));
        }

        /* --- BOTTOM: EDITOR & MINIMAP --- */
        .editor-wrapper {
            display: flex;
            position: relative;
            overflow: hidden;
            background: var(--bg);
        }

        /* Code Stream */
        .code-scroller {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            scroll-behavior: smooth;
        }

        .line {
            display: flex;
            font-size: 11px;
            line-height: 18px;
            padding: 0 10px;
            cursor: pointer;
            border-left: 3px solid transparent;
            white-space: pre;
            color: var(--dim);
            transition: color 0.1s;
        }

        .line:hover { background: #111; color: var(--text); }
        
        /* Active Line Sync */
        .line.active {
            background: rgba(255,255,255,0.05);
            border-left-color: #fff;
            color: #fff;
        }
        
        /* Runtime Line Flash */
        .line.executing {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* Semantic Syntax Highlighting */
        .kwd { color: var(--func); } 
        .def { color: #fff; font-weight: bold; } 
        .var { color: var(--var); } 
        .ctl { color: var(--ctrl); } 
        .str { color: #fcd34d; }
        .com { color: #3f3f46; font-style: italic; }

        .ln { width: 40px; text-align: right; margin-right: 15px; opacity: 0.3; user-select: none; }

        /* Minimap Rail */
        .minimap-rail {
            width: 60px;
            border-left: 1px solid var(--border);
            background: #0c0c0c;
            position: relative;
            z-index: 20;
        }

        canvas { width: 100%; height: 100%; cursor: crosshair; display: block; }

        .minimap-viewport {
            position: absolute;
            left: 0; right: 0; top: 0; height: 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none;
            transition: top 0.05s;
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">INCEPTION <span>//</span> HYPER_MONITOR</div>
        <div style="display: flex; gap: 10px; align-items: center; color: #555;">
            <span>RUNTIME TRACE</span>
            <div class="live-pulse"></div>
        </div>
    </header>

    <main>
        <!-- TOP: SEMANTIC GRID -->
        <div class="grid-section">
            <div class="grid-container">
                <div class="grid" id="grid"></div>
                <svg class="wire-layer" id="wires"></svg>
            </div>
        </div>

        <!-- BOTTOM: CODE + MINIMAP -->
        <div class="editor-wrapper">
            <div class="code-scroller" id="scroller">
                <div id="code-content"></div>
            </div>
            <div class="minimap-rail">
                <canvas id="minimap"></canvas>
                <div class="minimap-viewport" id="mm-view"></div>
            </div>
        </div>
    </main>

<script>
    // ----------------------------------------------------
    // 1. SOURCE INGESTION (Reads Itself)
    // ----------------------------------------------------
    
    // Fallback code if local file access is blocked
    const FALLBACK_CODE = `
// CORE SYSTEM LOOP
const TICKS_PER_SEC = 60;
let memory = new Array(1024);

function boot() {
    console.log("Booting...");
    initMemory();
    startScheduler();
}

function initMemory() {
    memory.fill(0);
    validate();
}

function validate() {
    if(memory.length > 0) return true;
    return false;
}

function startScheduler() {
    setInterval(() => {
        tick();
    }, 1000 / TICKS_PER_SEC);
}

function tick() {
    updatePhysics();
    renderFrame();
}

function updatePhysics() {
    // Physics logic
    return true;
}

function renderFrame() {
    clearScreen();
    drawObjects();
}

function clearScreen() {
    // GPU Op
}

function drawObjects() {
    // GPU Op
}

boot();
    `;

    let rawSource = document.documentElement.outerHTML;
    if(rawSource.length < 500) rawSource = FALLBACK_CODE;

    const lines = rawSource.split('\n');
    
    // DOM Elements
    const gridEl = document.getElementById('grid');
    const wiresEl = document.getElementById('wires');
    const codeEl = document.getElementById('code-content');
    const scroller = document.getElementById('scroller');
    const canvas = document.getElementById('minimap');
    const viewportBox = document.getElementById('mm-view');

    // Data Structures
    let lineData = [];
    let mapData = new Array(81).fill(null);
    let definitions = {}; // name -> cellIndex
    let connections = []; // {from, to}
    let functionMap = {}; // name -> {startLine, endLine, cellIndex}

    // ----------------------------------------------------
    // 2. PARSING & ANALYSIS
    // ----------------------------------------------------

    function parse() {
        const linesPerCell = Math.ceil(lines.length / 81);

        lines.forEach((line, i) => {
            const trim = line.trim();
            let type = null;
            let name = null;

            // --- CLASSIFICATION ---
            const fnMatch = trim.match(/(?:function|class)\s+(\w+)|(\w+)\s*\(/);
            if (fnMatch && !trim.includes('new ') && !trim.includes('=')) {
                type = 'function';
                name = fnMatch[1] || fnMatch[2];
                if(['if','for','while','switch'].includes(name)) {
                    type = 'control';
                    name = name.toUpperCase();
                }
            }

            const varMatch = trim.match(/(?:const|let|var)\s+(\w+)/);
            if (varMatch && !type) {
                type = 'variable';
                name = varMatch[1];
            }

            if (!type && trim.match(/^(if|else|for|while|return|switch)/)) {
                type = 'control';
                name = trim.split(/[ (]/)[0];
            }

            // --- MAPPING ---
            if (type) {
                const cellIdx = Math.floor(i / linesPerCell);
                const priority = type === 'function' ? 3 : type === 'control' ? 2 : 1;
                
                if (!mapData[cellIdx] || mapData[cellIdx].priority < priority) {
                    mapData[cellIdx] = { 
                        type, name, lineIndex: i,
                        icon: type === 'function' ? 'ƒ' : type === 'variable' ? '📦' : '◇',
                        priority 
                    };
                }

                if (type === 'function' && name) {
                    definitions[name] = cellIdx;
                    functionMap[name] = { cellIdx, line: i };
                }
            }

            lineData.push({ text: line, type, index: i });
        });

        // Wiring
        lines.forEach((line, i) => {
            const trim = line.trim();
            const matches = trim.matchAll(/(\w+)\s*\(/g);
            const fromCell = Math.floor(i / linesPerCell);

            for (const m of matches) {
                const target = m[1];
                if (definitions[target] !== undefined && definitions[target] !== fromCell) {
                    connections.push({ from: fromCell, to: definitions[target] });
                }
            }
        });
    }

    // ----------------------------------------------------
    // 3. RUNTIME TRACER (The "Instrumenter")
    // ----------------------------------------------------
    
    // This wraps specific functions to visually flash the UI when they run.
    // Since we are parsing THIS file, we can hook into our own functions!
    
    function traceExecution(fnName) {
        const meta = functionMap[fnName];
        if (!meta) return;

        // 1. Flash Grid Cell
        const cell = gridEl.children[meta.cellIdx];
        if (cell) {
            cell.classList.remove('executing');
            void cell.offsetWidth; // Trigger reflow
            cell.classList.add('executing');
            setTimeout(() => cell.classList.remove('executing'), 200);
        }

        // 2. Flash Code Line
        const line = document.getElementById(`L${meta.line}`);
        if (line) {
            line.classList.add('executing');
            setTimeout(() => line.classList.remove('executing'), 200);
        }

        // 3. Flash Wires (Outgoing)
        connections.forEach(conn => {
            if(conn.from === meta.cellIdx) {
                const wire = document.getElementById(`w-${conn.from}-${conn.to}`);
                if(wire) {
                    wire.classList.add('firing');
                    setTimeout(() => wire.classList.remove('firing'), 300);
                }
            }
        });
    }

    // We create a Proxy to wrap our logic functions
    const Logic = {
        highlightBlock: function(idx) {
            // Original logic...
            visualHighlightBlock(idx);
        },
        scrollToLine: function(idx) {
            visualScrollToLine(idx);
        },
        resetUI: function() {
            visualResetUI();
        }
    };

    // The Proxy intercepts calls and triggers the tracer
    const Tracer = new Proxy(Logic, {
        get(target, prop) {
            const original = target[prop];
            return function(...args) {
                traceExecution(prop); // TRIGGER VISUAL
                return original.apply(this, args); // RUN CODE
            }
        }
    });

    // ----------------------------------------------------
    // 4. RENDERERS
    // ----------------------------------------------------

    function render() {
        renderGrid();
        renderCode();
        renderWires();
        renderMinimap();
    }

    function renderGrid() {
        gridEl.innerHTML = '';
        const linesPerCell = Math.ceil(lines.length / 81);

        for(let i=0; i<81; i++) {
            const cell = document.createElement('div');
            cell.className = 'block';
            cell.dataset.index = i;

            const data = mapData[i];
            if (data) {
                cell.setAttribute('data-type', data.type);
                cell.innerHTML = `<div class="block-icon">${data.icon}</div><div class="block-label">${data.name}</div>`;
            } else {
                cell.style.opacity = '0.1';
                cell.innerHTML = '·';
            }

            // Hooking up interaction to Tracer
            cell.onmouseenter = () => Tracer.highlightBlock(i); 
            cell.onclick = () => Tracer.scrollToLine(i * linesPerCell);

            gridEl.appendChild(cell);
        }
    }

    function renderCode() {
        codeEl.innerHTML = '';
        lineData.forEach(l => {
            const div = document.createElement('div');
            div.className = 'line';
            div.id = `L${l.index}`;
            
            let html = l.text
                .replace(/</g, '&lt;')
                .replace(/(class|function|import|const|let|var|if|else|return)/g, '<span class="kwd">$1</span>')
                .replace(/(\/\/.*)/g, '<span class="com">$1</span>');

            const mapItem = mapData.find(m => m && m.lineIndex === l.index);
            if(mapItem) html = html.replace(mapItem.name, `<span class="def">${mapItem.name}</span>`);

            div.innerHTML = `<div class="ln">${l.index}</div>${html}`;
            div.onmouseenter = () => {
                const cellIdx = Math.floor(l.index / Math.ceil(lines.length / 81));
                Tracer.highlightBlock(cellIdx);
            };
            
            codeEl.appendChild(div);
        });
    }

    function renderWires() {
        wiresEl.innerHTML = '';
        const rect = gridEl.getBoundingClientRect();
        const cellW = rect.width / 9;
        const cellH = rect.height / 9;
        const unique = [...new Set(connections.map(JSON.stringify))].map(JSON.parse);

        unique.forEach(conn => {
            const x1 = (conn.from % 9) * cellW + (cellW/2);
            const y1 = Math.floor(conn.from / 9) * cellH + (cellH/2);
            const x2 = (conn.to % 9) * cellW + (cellW/2);
            const y2 = Math.floor(conn.to / 9) * cellH + (cellH/2);

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            const cx = (x1 + x2) / 2;
            const cy = Math.min(y1, y2) - 40; 
            const d = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
            
            path.setAttribute("d", d);
            path.setAttribute("class", "wire");
            path.id = `w-${conn.from}-${conn.to}`;
            path.dataset.from = conn.from;
            path.dataset.to = conn.to;

            wiresEl.appendChild(path);
        });
    }

    function renderMinimap() {
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const lh = rect.height / lines.length;

        lines.forEach((line, i) => {
            if(!line.trim()) return;
            const indent = line.search(/\S|$/);
            const len = Math.min(rect.width - (indent*2), line.trim().length * 3);
            
            let color = '#3f3f46';
            const meta = lineData[i];
            if (meta.type === 'function') color = '#f43f5e';
            else if (meta.type === 'variable') color = '#2dd4bf';
            else if (meta.type === 'control') color = '#fbbf24';

            ctx.fillStyle = color;
            ctx.fillRect(indent * 4, i * lh, len, Math.max(1, lh));
        });

        canvas.onclick = (e) => {
            const pct = e.offsetY / rect.height;
            Tracer.scrollToLine(Math.floor(pct * lines.length));
        };
    }

    // ----------------------------------------------------
    // 5. VISUAL LOGIC (Called by Tracer)
    // ----------------------------------------------------

    function visualHighlightBlock(cellIdx) {
        const linesPerCell = Math.ceil(lines.length / 81);
        const start = cellIdx * linesPerCell;
        const end = start + linesPerCell;

        visualResetUI();

        if(gridEl.children[cellIdx]) gridEl.children[cellIdx].classList.add('active');

        for(let i=start; i<end && i<lines.length; i++) {
            const el = document.getElementById(`L${i}`);
            if(el) el.classList.add('active');
        }

        document.querySelectorAll('.wire').forEach(w => {
            if(w.dataset.from == cellIdx || w.dataset.to == cellIdx) {
                w.classList.add('active');
                const target = w.dataset.from == cellIdx ? w.dataset.to : w.dataset.from;
                gridEl.children[target]?.classList.add('active');
            }
        });
    }

    function visualScrollToLine(lineIdx) {
        const el = document.getElementById(`L${lineIdx}`);
        if(el) {
            el.scrollIntoView({behavior: 'auto', block: 'center'});
            const cellIdx = Math.floor(lineIdx / Math.ceil(lines.length / 81));
            visualHighlightBlock(cellIdx);
        }
    }

    function visualResetUI() {
        document.querySelectorAll('.block.active').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.line.active').forEach(l => l.classList.remove('active'));
        document.querySelectorAll('.wire.active').forEach(w => w.classList.remove('active'));
    }

    // 6. SCROLL SYNC
    scroller.addEventListener('scroll', () => {
        const pct = scroller.scrollTop / (scroller.scrollHeight - scroller.clientHeight);
        const mmHeight = canvas.getBoundingClientRect().height;
        const viewHeight = (scroller.clientHeight / scroller.scrollHeight) * mmHeight;
        viewportBox.style.height = `${viewHeight}px`;
        viewportBox.style.top = `${pct * (mmHeight - viewHeight)}px`;
    });

    // BOOT
    parse();
    render();
    scroller.dispatchEvent(new Event('scroll'));

</script>
</body>
</html>

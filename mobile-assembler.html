<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAG – Assembly Belt</title>
    <style>
        :root {
            --bg-void: #0e0e12;
            --bg-rail: #16161d;
            --bg-card: #1e1e26;
            --accent: #60a5fa; /* Soft Blue */
            --accent-glow: rgba(96, 165, 250, 0.15);
            --success: #34d399;
            --text-main: #e2e8f0;
            --text-dim: #64748b;
            --border: #2d2d3a;
            --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; font-family: 'JetBrains Mono', monospace; }

        body {
            background: var(--bg-void);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Top Control Bar --- */
        header {
            height: 50px;
            background: var(--bg-rail);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .brand { font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--accent); display:flex; align-items:center; gap:10px;}
        .brand span { color: var(--text-dim); font-weight:400; }

        .controls { display: flex; gap: 12px; }
        
        .btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        /* --- The Assembly Belt (Main View) --- */
        .belt-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            background: repeating-linear-gradient(
                0deg,
                var(--bg-void),
                var(--bg-void) 39px,
                var(--bg-rail) 40px /* Subtle scanlines */
            );
        }

        /* The Row: Left -> Center -> Right */
        .station-row {
            display: grid;
            grid-template-columns: 40px 1fr 80px 140px; /* Index | Input | Process | Output */
            height: 80px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            transition: background 0.3s var(--ease);
            padding: 0 16px;
            position: relative;
        }

        .station-row:hover { background: var(--bg-card); }
        
        /* Active State (Processing) */
        .station-row.processing {
            background: var(--accent-glow);
            border-bottom: 1px solid var(--accent);
        }

        /* 1. Index */
        .idx { color: var(--text-dim); font-size: 10px; }

        /* 2. Input Stage (Source Code) */
        .input-stage {
            padding-right: 16px;
        }

        .code-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: monospace;
            font-size: 12px;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .code-input:focus {
            background: var(--bg-card);
            border-color: var(--accent);
        }

        /* 3. The Processor (The Box) */
        .process-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            height: 100%;
            background: rgba(0,0,0,0.2);
        }

        .status-light {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #333;
            margin-bottom: 4px;
            transition: 0.3s;
        }

        .station-row.processing .status-light {
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .stud-badge {
            font-size: 9px;
            color: var(--text-dim);
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* 4. Output Stage (Wireframe) */
        .output-stage {
            height: 100%;
            position: relative;
            opacity: 0.3;
            transition: opacity 0.5s var(--ease);
        }

        .station-row.processing .output-stage, 
        .station-row:hover .output-stage {
            opacity: 1;
        }

        canvas { width: 100%; height: 100%; display: block; }

        /* Tooltip for Studs */
        .stud-info {
            position: absolute;
            bottom: 4px; right: 4px;
            background: rgba(0,0,0,0.8);
            color: var(--accent);
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 2px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        /* --- Bottom Stats --- */
        footer {
            height: 30px;
            background: var(--bg-rail);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 10px;
            color: var(--text-dim);
            justify-content: space-between;
        }

        /* Mobile Tweaks */
        @media (max-width: 768px) {
            .station-row {
                grid-template-columns: 1fr 80px; /* Stacked layout */
                grid-template-rows: 1fr 1fr;
                height: auto;
                padding: 10px;
            }
            .idx { grid-column: 1 / span 2; margin-bottom: 4px; }
            .input-stage { grid-column: 1; grid-row: 2; }
            .process-stage { grid-column: 2; grid-row: 1 / span 2; height: 100%; border: none; border-left: 1px solid var(--border); }
            .output-stage { display: none; /* Hide visual on tiny screens if needed, or adjust grid */ }
        }

        /* Load/Save Drawer */
        .drawer {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--accent);
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s var(--ease);
            z-index: 50;
        }
        .drawer.open { transform: translateY(0); }
        textarea { width: 100%; height: 100px; background: #111; border: 1px solid var(--border); color: #fff; padding: 8px; font-size: 11px; }
        .drawer-actions { margin-top: 10px; display: flex; gap: 10px; }

    </style>
</head>
<body>

<header>
    <div class="brand">
        KINETIC<span>BELT</span>
    </div>
    <div class="controls">
        <button class="btn" onclick="toggleDrawer()">DATA I/O</button>
        <button class="btn" onclick="exportGold()">GOLD</button>
        <button class="btn" onclick="exportStudMapMpd()">MAP</button>
        <button class="btn" id="simBtn" onclick="toggleSim()">RUN LINE ▶</button>
    </div>
</header>

<div class="belt-container" id="belt">
    <!-- Stations generated here -->
</div>

<footer>
    <span id="statusText">System Ready</span>
    <span>WAG CORE v2.4</span>
</footer>

<div class="drawer" id="ioDrawer">
    <textarea id="ioText" placeholder="Paste MPD or GOLD JSON here..."></textarea>
    <div class="drawer-actions">
        <button class="btn active" onclick="ingest()">LOAD DATA</button>
        <button class="btn" onclick="toggleDrawer()">CLOSE</button>
    </div>
</div>

<script>
    // --- CONFIG ---
    const CONFIG = {
        speed: 200, // ms per station
        colors: {
            '1': '#0055BF', '2': '#25803E', '4': '#C91A09', 
            '14': '#585858', '71': '#A0A0A0', '72': '#E6E6E6'
        }
    };

    // --- STATE ---
    const state = {
        lines: [],          // per-line belt stations
        activeIdx: -1,
        running: false,
        timer: null,
        animationFrame: null,
        lastGold: null,     // latest GOLD scene, if loaded
        redBullEvents: []   // temporal sampling events from Courage
    };

    // --- MOCK STUD LOGIC ---
    function generateStuds(partName) {
        let w=2, h=4; // Default
        if (partName.includes('3005')) { w=1; h=1; }
        else if (partName.includes('3003')) { w=2; h=2; }
        else if (partName.includes('3001')) { w=2; h=4; }
        else if (partName.includes('3020')) { w=2; h=4; }
        else if (partName.includes('3009')) { w=1; h=6; }

        const studs = [];
        const spacing = 20;
        const offX = ((w-1)*spacing)/2;
        const offZ = ((h-1)*spacing)/2;

        for(let x=0; x<w; x++) {
            for(let z=0; z<h; z++) {
                studs.push({ x: (x*spacing)-offX, y: 0, z: (z*spacing)-offZ });
            }
        }
        return studs;
    }

    // --- PARSER ---
    function parseLine(text, id, studsForLine) {
        const trimmed = text.trim();
        const parts = trimmed.split(/\s+/);
        if (parts[0] !== '1') return null;

        const partId = parts[14] || 'Unknown';

        let studs;
        if (Array.isArray(studsForLine) && studsForLine.length) {
            // Use real studs from skeleton-v2 if provided
            studs = studsForLine.map(n => ({
                x: typeof n.x === 'number' ? n.x : 0,
                y: typeof n.y === 'number' ? n.y : 0,
                z: typeof n.z === 'number' ? n.z : 0
            }));
        } else {
            // Fallback: synthetic studs from part name
            studs = generateStuds(partId || '');
        }

        return {
            id,
            raw: trimmed,
            color: parts[1],
            x: parseFloat(parts[2]),
            y: parseFloat(parts[3]),
            z: parseFloat(parts[4]),
            name: partId,
            studs
        };
    }

    function renderBeltFromLines(lines, studsByLine) {
        const container = document.getElementById('belt');
        container.innerHTML = '';
        state.lines = [];

        lines.forEach((str, i) => {
            const studsForLine = studsByLine ? studsByLine.get(i) : null;
            const data = parseLine(str, i, studsForLine);
            if (!data) return;

            state.lines.push(data);

            const row = document.createElement('div');
            row.className = 'station-row';
            row.id = `st-${i}`;

            row.innerHTML = `
                <div class="idx">${i.toString().padStart(3,'0')}</div>
                <div class="input-stage">
                    <input type="text" class="code-input" value="${data.raw}" onchange="updateLine(${i}, this.value)">
                </div>
                <div class="process-stage">
                    <div class="status-light"></div>
                    <div class="stud-badge">${data.studs.length} STUDS</div>
                </div>
                <div class="output-stage">
                    <canvas id="cvs-${i}"></canvas>
                    <div class="stud-info" id="inf-${i}"></div>
                </div>
            `;

            container.appendChild(row);

            setTimeout(() => drawCanvas(i, data, 0), 50);
        });
    }

    function renderBeltFromMpdText(text) {
        const lines = text.split(/\r?\n/);
        renderBeltFromLines(lines, null);
    }

    function loadFromGoldJson(json) {
        if (!json || typeof json !== 'object') return;

        const mpdContent = json.mpd_content || json.mpd || '';
        const lines = mpdContent.split(/\r?\n/);

        // Build per-line stud groups from stud_skeleton_v2 or stud_skeleton
        let studsNodes = [];
        if (json.stud_skeleton_v2 && Array.isArray(json.stud_skeleton_v2.nodes)) {
            studsNodes = json.stud_skeleton_v2.nodes;
        } else if (Array.isArray(json.stud_skeleton)) {
            studsNodes = json.stud_skeleton;
        }

        const studsByLine = new Map();
        if (Array.isArray(studsNodes)) {
            studsNodes.forEach(n => {
                const line = (n.lineNum != null ? n.lineNum : n.lineIndex);
                if (line == null) return;
                if (!studsByLine.has(line)) studsByLine.set(line, []);
                studsByLine.get(line).push(n);
            });
        }

        state.redBullEvents = Array.isArray(json.redbull_events) ? json.redbull_events : [];

        state.lastGold = json;
        renderBeltFromLines(lines, studsByLine);
        document.getElementById('statusText').textContent = `Loaded GOLD: ${lines.length} lines, ${studsNodes.length} studs, ${state.redBullEvents.length} events`;
    }

    // --- LIVE EDITING ---
    window.updateLine = function(idx, newText) {
        // Find array index
        const arrIdx = state.lines.findIndex(l => l.id === idx);
        if (arrIdx === -1) return;

        // Re-parse (fallback uses synthetic studs)
        const newData = parseLine(newText, idx, null);
        if (newData) {
            state.lines[arrIdx] = newData;
            // Re-render canvas
            drawCanvas(idx, newData, 0);
            // Flash feedback
            const row = document.getElementById(`st-${idx}`);
            row.style.backgroundColor = '#223';
            setTimeout(() => row.style.backgroundColor = '', 300);
            document.getElementById('statusText').textContent = `Line ${idx} Updated`;
        }
    };

    // --- VISUALIZATION (Canvas) ---
    function drawCanvas(id, data, rotationOffset) {
        const cvs = document.getElementById(`cvs-${id}`);
        if (!cvs) return;
        
        const rect = cvs.getBoundingClientRect();
        if (cvs.width !== rect.width) {
            cvs.width = rect.width;
            cvs.height = rect.height;
        }
        
        const ctx = cvs.getContext('2d');
        const w = cvs.width;
        const h = cvs.height;
        const cx = w/2;
        const cy = h/2;

        ctx.clearRect(0, 0, w, h);

        const color = CONFIG.colors[data.color] || '#888';
        const angle = Math.PI/4 + rotationOffset;

        // Projection
        const points = data.studs.map(s => {
            const cos = Math.cos(angle), sin = Math.sin(angle);
            const rx = s.x * cos - s.z * sin;
            const rz = s.x * sin + s.z * cos;
            return {
                x: (rx - rz) * 0.866,
                y: s.y + (rx + rz) * 0.5,
                z: rz // depth
            };
        });

        // Wireframe (Neighbors)
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=0; i<points.length; i++) {
            for(let j=i+1; j<points.length; j++) {
                // Check roughly logical distance for connection
                const d = Math.abs(data.studs[i].x - data.studs[j].x) + Math.abs(data.studs[i].z - data.studs[j].z);
                if (d <= 20) { // 20 LDU neighbor
                    ctx.moveTo(cx + points[i].x, cy + points[i].y);
                    ctx.lineTo(cx + points[j].x, cy + points[j].y);
                }
            }
        }
        ctx.stroke();

        // Studs
        points.forEach(p => {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(cx + p.x, cy + p.y, 2, 0, Math.PI*2);
            ctx.fill();
        });
    }

    // --- SIMULATION LOOP ---
    function toggleSim() {
        state.running = !state.running;
        const btn = document.getElementById('simBtn');
        
        if (state.running) {
            btn.classList.add('active');
            btn.textContent = 'PAUSE ■';
            loop();
            animateViz();
        } else {
            btn.classList.remove('active');
            btn.textContent = 'RUN LINE ▶';
            clearTimeout(state.timer);
            cancelAnimationFrame(state.animationFrame);
            // Clear active visual
            if(state.activeIdx >= 0) {
                const line = state.lines[state.activeIdx];
                if(line) drawCanvas(line.id, line, 0); // Reset rotation
            }
        }
    }

    function loop() {
        if (!state.running) return;

        // Deactivate old
        const prevLine = state.lines[state.activeIdx];
        if (prevLine) {
            const row = document.getElementById(`st-${prevLine.id}`);
            if (row) row.classList.remove('processing');
            // Snap back to static rotation
            drawCanvas(prevLine.id, prevLine, 0);
        }

        // Move Index
        let indices = [];
        if (Array.isArray(state.redBullEvents) && state.redBullEvents.length) {
            const seen = new Set();
            state.redBullEvents.forEach(ev => {
                const ln = (typeof ev.lineIndex === 'number' ? ev.lineIndex : ev.lineNum);
                if (ln == null) return;
                if (!seen.has(ln) && ln >= 0 && ln < state.lines.length) {
                    seen.add(ln);
                    indices.push(ln);
                }
            });
        }

        if (!indices.length) {
            indices = state.lines
                .map((line, idx) => ({ line, idx }))
                .map(({ idx }) => idx);
        }

        state.activeIdx = (state.activeIdx + 1) % indices.length;

        // Activate new
        const currLine = state.lines[indices[state.activeIdx]];
        const row = document.getElementById(`st-${currLine.id}`);
        
        if (row) {
            row.classList.add('processing');
            
            // Smooth Scroll / Teleprompter logic
            const belt = document.getElementById('belt');
            const rowRect = row.getBoundingClientRect();
            const beltRect = belt.getBoundingClientRect();
            
            // Only scroll if near edges
            if (rowRect.bottom > beltRect.bottom - 40 || rowRect.top < beltRect.top + 40) {
                row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            document.getElementById('statusText').textContent = `Processing: ${currLine.name} [${currLine.studs.length} Studs]`;
        }

        state.timer = setTimeout(loop, CONFIG.speed);
    }

    function animateViz() {
        if (!state.running) return;
        
        if (state.activeIdx >= 0) {
            const line = state.lines[state.activeIdx];
            if (line) {
                // Rotate based on time
                const rot = Date.now() / 500;
                drawCanvas(line.id, line, rot);
            }
        }
        state.animationFrame = requestAnimationFrame(animateViz);
    }

    // --- IO ---
    function toggleDrawer() {
        document.getElementById('ioDrawer').classList.toggle('open');
    }
    
    function ingest() {
        const val = document.getElementById('ioText').value;
        if (!val.trim()) return;

        try {
            const json = JSON.parse(val);
            loadFromGoldJson(json);
        } catch (e) {
            renderBeltFromMpdText(val);
            document.getElementById('statusText').textContent = 'Loaded MPD text into belt';
        }
        toggleDrawer();
    }

    function exportGold() {
        if (!state.lines.length && !state.lastGold) {
            document.getElementById('statusText').textContent = 'No data to export as GOLD';
            return;
        }

        const mpdText = state.lines.map(l => l.raw).join('\n');
        const nodes = [];
        state.lines.forEach((line, idx) => {
            if (!Array.isArray(line.studs)) return;
            line.studs.forEach(s => {
                nodes.push({
                    lineNum: idx,
                    x: typeof s.x === 'number' ? s.x : 0,
                    y: typeof s.y === 'number' ? s.y : 0,
                    z: typeof s.z === 'number' ? s.z : 0
                });
            });
        });

        const base = state.lastGold && typeof state.lastGold === 'object' ? state.lastGold : {};
        const gold = Object.assign({}, base, {
            mpd_content: mpdText,
            stud_skeleton_v2: { nodes }
        });

        const blob = new Blob([JSON.stringify(gold, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'kinetic-belt-gold.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        document.getElementById('statusText').textContent = `Exported GOLD with ${nodes.length} studs`;
    }

    function exportStudMapMpd() {
        if (!state.lines.length) {
            document.getElementById('statusText').textContent = 'No lines to export as StudMap MPD';
            return;
        }

        const lines = [];
        let totalStuds = 0;
        const lineIndices = [];

        state.lines.forEach((line, idx) => {
            const studs = Array.isArray(line.studs) ? line.studs : [];
            if (!studs.length) return;
            lineIndices.push(idx);
            totalStuds += studs.length;
        });

        lines.push('0 FILE studmap_from_kinetic_belt.mpd');
        lines.push('0 Name: Stud Map (KINETIC BELT)');
        lines.push('0 !LDRAW_ORG Unofficial_Model');
        lines.push('0 BFC CERTIFY CCW');
        lines.push(`0 !STUDMAP META version=1 generator="KINETIC BELT" lineCount=${lineIndices.length} studCount=${totalStuds}`);

        lineIndices.forEach(idx => {
            const line = state.lines[idx];
            const studs = Array.isArray(line.studs) ? line.studs : [];
            const partId = line && line.name ? line.name : 'UNKNOWN';
            const safePart = String(partId).replace(/"/g, '');

            lines.push(`0 !STUDMAP LINE ${idx} PART "${safePart}" STUDS ${studs.length}`);
            studs.forEach((s, studIdx) => {
                const x = typeof s.x === 'number' ? s.x.toFixed(3) : '0.000';
                const y = typeof s.y === 'number' ? s.y.toFixed(3) : '0.000';
                const z = typeof s.z === 'number' ? s.z.toFixed(3) : '0.000';
                lines.push(`0 !STUDMAP STUD ${studIdx} GRID 0 0 LAYER 0 WORLD ${x} ${y} ${z} LOCAL 0 0 0`);
            });
        });

        const mpdText = lines.join('\n');
        const blob = new Blob([mpdText], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'kinetic-belt-studmap.mpd';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        document.getElementById('statusText').textContent = `Exported StudMap MPD for ${lineIndices.length} lines`;
    }

    // --- BOOT ---
    (function bootstrap() {
        // Try to bootstrap from Courage's GOLD snapshot if present
        try {
            if (typeof localStorage !== 'undefined') {
                const raw = localStorage.getItem('wag_redbull_gold');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    const gold = parsed && parsed.gold ? parsed.gold : parsed;
                    if (gold && typeof gold === 'object') {
                        loadFromGoldJson(gold);
                        return;
                    }
                }
            }
        } catch (e) {
            // ignore and fall back to demo data
        }

        const demoData = `
1 4 0 0 0 1 0 0 0 1 0 0 0 1 3001.dat
1 1 20 0 0 1 0 0 0 1 0 0 0 1 3001.dat
1 2 40 0 0 1 0 0 0 1 0 0 0 1 3003.dat
1 4 60 0 0 1 0 0 0 1 0 0 0 1 3003.dat
1 14 0 -24 0 1 0 0 0 1 0 0 0 1 3009.dat
1 71 0 -48 0 1 0 0 0 1 0 0 0 1 3020.dat
`.trim();

        renderBeltFromMpdText(demoData);
    })();

    // Listen on wag-frank for Red Bull GOLD fragments (live updates from Courage)
    (function setupFrankListener() {
        try {
            if (typeof BroadcastChannel === 'undefined') return;
            const bus = new BroadcastChannel('wag-frank');
            bus.addEventListener('message', (event) => {
                const msg = event.data;
                if (!msg || typeof msg !== 'object') return;
                if (msg.kind === 'redbull-gold' && msg.gold) {
                    loadFromGoldJson(msg.gold);
                }
            });
        } catch (e) {
            // ignore BroadcastChannel issues
        }
    })();

</script>
</body>
</html>

<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="background:#333; font-family:Arial, sans-serif;">
  <defs>
    <pattern id="studs" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="6" fill="#000" opacity="0.1"/>
    </pattern>
    <filter id="shadow"><feDropShadow dx="4" dy="4" stdDeviation="3" flood-opacity="0.4"/></filter>
    <g id="tree">
      <circle cx="0" cy="0" r="25" fill="#287F46" stroke="#1E5A32" stroke-width="2"/>
      <circle cx="0" cy="0" r="15" fill="#4B9F4A"/>
    </g>
  </defs>

  <!-- Header -->
  <g transform="translate(20, 20)">
    <rect width="320" height="60" rx="4" fill="#F4F4F4" filter="url(#shadow)"/>
    <text x="20" y="40" font-weight="bold" fill="#333" font-size="24">STEP 3: CONSTRUCTION</text>
  </g>

  <!-- The Build Area -->
  <g transform="translate(200, 100)">
    <rect width="400" height="400" fill="#287F46" filter="url(#shadow)"/>
    <rect width="400" height="400" fill="url(#studs)"/>

    <!-- The Log (Brown Plate) -->
    <rect x="-50" y="200" width="500" height="40" fill="#5F3818" transform="rotate(-30 200 200)" filter="url(#shadow)"/>

    <!-- Trees (Cardinal Anchors) -->
    <use href="#tree" x="200" y="40" filter="url(#shadow)"/>
    <use href="#tree" x="200" y="360" filter="url(#shadow)"/>
    <use href="#tree" x="40" y="200" filter="url(#shadow)"/>
    <use href="#tree" x="360" y="200" filter="url(#shadow)"/>

    <!-- Crates (Robots) -->
    <rect x="250" y="150" width="40" height="40" fill="#9BA19D" stroke="#635F61" stroke-width="2"/>
    <rect x="280" y="180" width="40" height="40" fill="#9BA19D" stroke="#635F61" stroke-width="2"/>

    <!-- Minifig Dots -->
    <circle cx="120" cy="220" r="10" fill="#A05F35" stroke="#fff" stroke-width="2"/>
    <circle cx="100" cy="240" r="10" fill="#A05F35" stroke="#fff" stroke-width="2"/>
    <circle cx="300" cy="220" r="10" fill="#000" stroke="#fff" stroke-width="2"/>
    <circle cx="300" cy="250" r="10" fill="#000" stroke="#fff" stroke-width="2"/>
  </g>
</svg>

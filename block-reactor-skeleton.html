<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hyperclay Reactor // Flat Skeleton</title>
  <style>
    :root {
      --bg: #050505;
      --panel: #0a0a0a;
      --border: #222;
      --text: #e5e5e5;
      --text-dim: #666;
      --accent: #fafafa;
      --core: #facc15;
      --entity: #60a5fa;
      --goal: #fde68a;
      --obstacle: #f97373;
      --morphism: #22d3ee;
      --location: #a3e635;
      --timepoint: #e879f9;
      --scene: #38bdf8;
      --story: #4ade80;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    /* STACK CONTAINER */
    .reactor {
      width: 100%;
      max-width: 460px;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      background: var(--panel);
    }

    /* HEADER / SCENE LABEL */
    .scene-header {
      flex: 0 0 auto;
      padding: 0.6rem 0.9rem;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: var(--text-dim);
    }

    .scene-header-left span:first-child { color: var(--scene); }
    .scene-header-left span:last-child { margin-left: 0.5rem; }

    .scene-header-roles {
      display: flex;
      gap: 0.5rem;
      font-size: 10px;
    }

    .scene-header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .scene-tools {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .scene-addr {
      font-size: 9px;
      color: #444;
    }

    .scene-tool-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 8px;
      padding: 1px 4px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .scene-tool-btn:hover {
      border-color: var(--scene);
      color: var(--scene);
    }

    .role-pill {
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    /* RETINA: 9x9 GRID */
    .retina {
      flex: 0 0 auto;
      padding: 0.75rem 0.9rem 0.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      gap: 1px;
      width: 100%;
      aspect-ratio: 1;
    }

    .cell {
      background: #050505;
      border: 1px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--text-dim);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .cell-icon-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .cell-kind-Core { color: var(--core); }
    .cell-kind-Entity { color: var(--entity); }
    .cell-kind-Goal { color: var(--goal); }
    .cell-kind-Obstacle { color: var(--obstacle); }
    .cell-kind-Morphism { color: var(--morphism); }
    .cell-kind-Location { color: var(--location); }
    .cell-kind-Timepoint { color: var(--timepoint); }

    .cell.active {
      background: #111827;
      border-color: var(--accent);
      color: var(--accent);
    }

    .cell.linked {
      border-color: var(--scene);
    }

    /* CHAT / TIMELINE */
    .timeline {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 0.6rem 0.9rem 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      scroll-behavior: smooth;
    }

    .beat {
      font-size: 11px;
      line-height: 1.5;
      padding: 0.4rem 0.45rem;
      border-left: 1px solid var(--border);
      cursor: pointer;
      color: var(--text-dim);
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .beat-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-bottom: 2px;
      color: #444;
    }

    .beat-icon {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 4px;
      vertical-align: middle;
    }

    .beat-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .beat-addr {
      margin-left: 4px;
      opacity: 0.6;
    }

    .beat-text { color: var(--text); }

    .beat:hover {
      background: rgba(255,255,255,0.02);
      border-color: var(--accent);
      color: var(--text);
    }

    .beat.active {
      background: #020617;
      border-color: var(--accent);
    }

    .beat.linked {
      border-color: var(--scene);
    }

    /* ACTUATOR */
    .actuator {
      flex: 0 0 auto;
      padding: 0.55rem 0.9rem 0.7rem;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      position: relative;
    }

    .prompt-glyph {
      font-size: 11px;
      color: var(--text-dim);
      padding-top: 2px;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      resize: none;
      min-height: 20px;
      max-height: 96px;
      line-height: 1.5;
      padding: 0;
    }

    textarea::placeholder { color: #333; }

    .status-light {
      position: absolute;
      right: 0.9rem;
      bottom: 0.7rem;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #222;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .status-light.processing {
      background: var(--scene);
      box-shadow: 0 0 10px rgba(56,189,248,0.8);
    }
  </style>
</head>
<body>
<div class="reactor" id="reactor-root">
  <div class="scene-header" id="scene-header">
    <div class="scene-header-left">
      <span>SCENE 01</span>
      <span>// Temporal Stack: Before Fork</span>
    </div>
    <div class="scene-header-right">
      <div class="scene-header-roles" id="scene-roles"></div>
      <div class="scene-addr" id="scene-addr">CELL -- · --</div>
      <div class="scene-tools">
        <button type="button" class="scene-tool-btn" onclick="handleFork()">fork</button>
        <button type="button" class="scene-tool-btn" onclick="handleExport()">exp</button>
        <button type="button" class="scene-tool-btn" onclick="handleImport()">imp</button>
      </div>
    </div>
  </div>

  <div class="retina">
    <div class="grid" id="grid"></div>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="actuator">
    <div class="prompt-glyph">&gt;&gt;&gt;</div>
    <textarea id="input" rows="1" placeholder="Add a beat to this scene..."></textarea>
    <div class="status-light" id="status"></div>
  </div>
</div>

<script>
  // --- Minimal ONYX Role Glyphs (flat, text-only) ---
  const ROLE_GLYPHS = {
    Core: '',
    Entity: '',
    Goal: '',
    Obstacle: '',
    Morphism: '',
    Shift: '',
    Location: '',
    Timepoint: '',
    Scene: '',
    Story: ''
  };

  function getIsoCube(color = 'blue') {
    const colors = {
      blue:   { top: '#60a5fa', left: '#3b82f6', right: '#2563eb' },
      yellow: { top: '#fcd34d', left: '#f59e0b', right: '#d97706' },
      cyan:   { top: '#22d3ee', left: '#06b6d4', right: '#0891b2' },
      purple: { top: '#e879f9', left: '#c026d3', right: '#a21caf' },
      green:  { top: '#4ade80', left: '#16a34a', right: '#15803d' },
      red:    { top: '#f97373', left: '#ef4444', right: '#dc2626' }
    };
    const c = colors[color] || colors.blue;
    return `
      <svg viewBox="0 0 40 40" class="cell-icon-svg">
        <path d="M20 4 L36 12 L20 20 L4 12 Z" fill="${c.top}" stroke="#020617" stroke-width="1"/>
        <path d="M4 12 L20 20 L20 38 L4 30 Z" fill="${c.left}" stroke="#020617" stroke-width="1"/>
        <path d="M36 12 L20 20 L20 38 L36 30 Z" fill="${c.right}" stroke="#020617" stroke-width="1"/>
      </svg>
    `;
  }

  const ICONS = {
    Entity: () => getIsoCube('blue'),

    Core: () => getIsoCube('yellow'),

    Goal: () => `
      <div style="position:relative;width:100%;height:100%;">
        <div style="position:absolute;top:2px;left:50%;transform:translateX(-50%);width:12px;height:12px;color:#facc15;">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
          </svg>
        </div>
        ${getIsoCube('blue')}
      </div>
    `,

    Obstacle: () => `
      <div style="position:relative;width:100%;height:100%;">
        <div style="position:absolute;inset:4px;">
          ${getIsoCube('blue')}
        </div>
        <div style="position:absolute;right:4px;top:4px;bottom:4px;width:3px;background:rgba(148,163,184,0.9);"></div>
        <div style="position:absolute;right:4px;top:50%;width:10px;height:2px;background:#facc15;transform:translateY(-50%);"></div>
      </div>
    `,

    Morphism: () => `
      <div style="position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:space-between;padding:4px;">
        <div style="width:14px;height:14px;">${getIsoCube('blue')}</div>
        <div style="flex:1;height:2px;background:#facc15;margin:0 4px;"></div>
        <div style="width:14px;height:14px;">${getIsoCube('blue')}</div>
      </div>
    `,

    Location: () => `
      <div style="position:relative;width:100%;height:100%;">
        <div style="position:absolute;top:4px;right:4px;width:14px;height:14px;">
          ${getIsoCube('cyan')}
        </div>
        <div style="position:absolute;bottom:4px;left:4px;width:14px;height:14px;">
          ${getIsoCube('cyan')}
        </div>
      </div>
    `,

    Timepoint: () => `
      <div style="position:relative;width:100%;height:100%;">
        <div style="position:absolute;inset:6px;">
          ${getIsoCube('cyan')}
        </div>
        <div style="position:absolute;right:2px;bottom:2px;width:16px;height:16px;border-radius:999px;background:#050505;border:1px solid #22d3ee;display:flex;align-items:center;justify-content:center;">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/>
            <path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    `
  };

  const initialScene = {
    id: 'scene-01',
    label: 'SCENE 01',
    title: 'Temporal Stack: Before Fork',
    grid: Array(81).fill(null),
    beats: []
  };

  // Seed a simple Temporal Stack layout
  // Core in center, Entity/Goal/Obstacle band, Morphism bridge, Location + Timepoint anchors
  (function seedScene(scene) {
    const g = scene.grid;
    const set = (row, col, kind, label) => {
      const idx = row * 9 + col;
      g[idx] = { kind, label };
    };

    set(4, 4, 'Core', 'CORE / Origin constraint');
    set(4, 3, 'Entity', 'ENTITY / Observer thread');
    set(4, 5, 'Goal', 'GOAL / Reach stable fork');
    set(3, 4, 'Obstacle', 'OBSTACLE / Conflicting branch');
    set(5, 4, 'Morphism', 'MORPHISM / Merge operator');
    set(6, 2, 'Location', 'LOCATION / Sandbox lane');
    set(2, 6, 'Timepoint', 'TIMEPOINT / t+1 probe');

    scene.beats = [
      { id: 'b0', kind: 'Core', cellIndex: 4 * 9 + 4, label: 'CORE',
        text: 'The core constraint sits in the center cell, defining what cannot change across forks.' },
      { id: 'b1', kind: 'Entity', cellIndex: 4 * 9 + 3, label: 'ENTITY',
        text: 'The observer thread hugs the core on the left, tracking how the story experiences each fork.' },
      { id: 'b2', kind: 'Goal', cellIndex: 4 * 9 + 5, label: 'GOAL',
        text: 'A goal cell on the right pulls the thread toward a clean, readable fork stack.' },
      { id: 'b3', kind: 'Obstacle', cellIndex: 3 * 9 + 4, label: 'OBSTACLE',
        text: 'Above the core, an obstacle records where two candidate futures collide.' },
      { id: 'b4', kind: 'Morphism', cellIndex: 5 * 9 + 4, label: 'MORPHISM',
        text: 'Below, a morphism cell holds the merge operation that can reconcile those futures.' },
      { id: 'b5', kind: 'Location', cellIndex: 6 * 9 + 2, label: 'LOCATION',
        text: 'A location anchor in the lower left marks the sandbox where changes are allowed to go wild.' },
      { id: 'b6', kind: 'Timepoint', cellIndex: 2 * 9 + 6, label: 'TIMEPOINT',
        text: 'A timepoint cell in the upper right pins this snapshot as t+1 in the fork sequence.' }
    ];
  })(initialScene);

  const STATE = {
    scene: initialScene,
    activeBeatId: null,
    activeCellIndex: null
  };

  const gridEl = document.getElementById('grid');
  const timelineEl = document.getElementById('timeline');
  const rolesEl = document.getElementById('scene-roles');
  const addrEl = document.getElementById('scene-addr');
  const inputEl = document.getElementById('input');
  const statusEl = document.getElementById('status');

  function renderSceneHeader() {
    const counts = {};
    STATE.scene.grid.forEach(cell => {
      if (!cell) return;
      counts[cell.kind] = (counts[cell.kind] || 0) + 1;
    });

    rolesEl.innerHTML = '';
    Object.keys(counts).sort().forEach(kind => {
      const pill = document.createElement('div');
      pill.className = 'role-pill';
      pill.textContent = `${kind.substring(0, 3).toUpperCase()}: ${counts[kind]}`;
      rolesEl.appendChild(pill);
    });

    // keep address label in sync when nothing is selected
    if (STATE.activeCellIndex == null && !STATE.activeBeatId) {
      addrEl.textContent = 'CELL -- · --';
    }
  }

  function renderGrid() {
    gridEl.innerHTML = '';
    const { grid } = STATE.scene;

    grid.forEach((cell, idx) => {
      const el = document.createElement('div');
      el.className = 'cell';
      el.dataset.idx = idx;

      if (cell) {
        if (ICONS && ICONS[cell.kind]) {
          el.innerHTML = ICONS[cell.kind]();
        } else {
          el.textContent = ROLE_GLYPHS[cell.kind] || '';
        }
        el.classList.add('cell-kind-' + cell.kind);
      }

      if (idx === STATE.activeCellIndex) {
        el.classList.add('active');
      }

      if (STATE.scene.beats.some(b => b.cellIndex === idx)) {
        el.classList.add('linked');
      }

      el.addEventListener('click', () => {
        const beat = STATE.scene.beats.find(b => b.cellIndex === idx);
        if (beat) {
          setActiveBeat(beat.id, true);
        } else {
          STATE.activeBeatId = null;
          STATE.activeCellIndex = idx;
          updateAddrFromIndex(idx);
          syncHighlights();
        }
      });

      gridEl.appendChild(el);
    });
  }

  function renderTimeline() {
    timelineEl.innerHTML = '';
    STATE.scene.beats.forEach(beat => {
      const el = document.createElement('div');
      el.className = 'beat';
      el.dataset.id = beat.id;

      const label = document.createElement('div');
      label.className = 'beat-label';
      if (ICONS && ICONS[beat.kind]) {
        const iconWrap = document.createElement('span');
        iconWrap.className = 'beat-icon';
        iconWrap.innerHTML = ICONS[beat.kind]();
        label.appendChild(iconWrap);
      }

      const labelText = document.createElement('span');
      labelText.textContent = beat.label;
      label.appendChild(labelText);

      const addrSpan = document.createElement('span');
      addrSpan.className = 'beat-addr';
      addrSpan.textContent = formatCellAddress(beat.cellIndex);
      label.appendChild(addrSpan);

      const text = document.createElement('div');
      text.className = 'beat-text';
      text.textContent = beat.text;

      el.appendChild(label);
      el.appendChild(text);

      el.addEventListener('click', () => {
        setActiveBeat(beat.id, true);
      });

      timelineEl.appendChild(el);
    });
  }

  function syncHighlights() {
    const cells = gridEl.querySelectorAll('.cell');
    cells.forEach(c => c.classList.remove('active'));

    const beats = timelineEl.querySelectorAll('.beat');
    beats.forEach(b => b.classList.remove('active'));

    if (STATE.activeBeatId) {
      const beat = STATE.scene.beats.find(b => b.id === STATE.activeBeatId);
      if (!beat) return;

      STATE.activeCellIndex = beat.cellIndex;
      updateAddrFromIndex(beat.cellIndex);

      const cellEl = gridEl.querySelector(`.cell[data-idx="${beat.cellIndex}"]`);
      if (cellEl) cellEl.classList.add('active');

      const beatEl = timelineEl.querySelector(`.beat[data-id="${beat.id}"]`);
      if (beatEl) beatEl.classList.add('active');

      beatEl?.scrollIntoView({ block: 'nearest' });
    } else if (STATE.activeCellIndex != null) {
      const cellEl = gridEl.querySelector(`.cell[data-idx="${STATE.activeCellIndex}"]`);
      if (cellEl) cellEl.classList.add('active');
      updateAddrFromIndex(STATE.activeCellIndex);
    }
  }

  function setActiveBeat(beatId, fromInteraction) {
    STATE.activeBeatId = beatId;
    syncHighlights();
    if (fromInteraction) {
      statusEl.classList.add('processing');
      setTimeout(() => statusEl.classList.remove('processing'), 180);
    }
  }

  function attachInput() {
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = inputEl.value.trim();
        if (!text) return;
        commitBeat(text);
        inputEl.value = '';
        inputEl.style.height = '20px';
      }
    });

    inputEl.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
    });
  }

  function commitBeat(text) {
    statusEl.classList.add('processing');

    const kind = inferKindFromText(text);
    const cellIndex = findOrCreateCellForKind(kind, text);

    const beat = {
      id: 'b' + (STATE.scene.beats.length + 10),
      kind,
      cellIndex,
      label: kind.toUpperCase(),
      text
    };
    STATE.scene.beats.push(beat);

    renderSceneHeader();
    renderGrid();
    renderTimeline();
    setActiveBeat(beat.id, false);

    setTimeout(() => statusEl.classList.remove('processing'), 220);
  }

  function formatCellAddress(idx) {
    if (idx == null || idx < 0) return '-- · --';
    const row = Math.floor(idx / 9);
    const col = idx % 9;
    const rowLabel = `R${row}`;
    const colLabel = `C${col}`;
    return `${rowLabel} · ${colLabel}`;
  }

  function updateAddrFromIndex(idx) {
    addrEl.textContent = `CELL ${idx} · ${formatCellAddress(idx)}`;
  }

  function handleFork() {
    if (STATE.activeBeatId || STATE.activeCellIndex != null) {
      statusEl.classList.add('processing');
      setTimeout(() => statusEl.classList.remove('processing'), 160);
      // In this flat skeleton, FORK is a semantic marker only.
      // A real implementation would clone STATE.scene into a new scene/story.
    }
  }

  function handleExport() {
    const payload = {
      id: STATE.scene.id,
      label: STATE.scene.label,
      title: STATE.scene.title,
      grid: STATE.scene.grid,
      beats: STATE.scene.beats
    };
    const json = JSON.stringify(payload, null, 2);
    console.log('REACTOR_SKELETON_EXPORT', json);
    statusEl.classList.add('processing');
    setTimeout(() => statusEl.classList.remove('processing'), 200);
  }

  function handleImport() {
    const raw = window.prompt('Paste scene JSON (id, label, title, grid, beats)...');
    if (!raw) return;
    try {
      const spec = JSON.parse(raw);
      if (!spec || !Array.isArray(spec.grid) || !Array.isArray(spec.beats)) return;
      STATE.scene.id = spec.id || STATE.scene.id;
      STATE.scene.label = spec.label || STATE.scene.label;
      STATE.scene.title = spec.title || STATE.scene.title;
      STATE.scene.grid = spec.grid.slice(0, 81).concat(Array(81 - spec.grid.length).fill(null)).slice(0, 81);
      STATE.scene.beats = spec.beats.map(b => ({
        id: b.id,
        kind: b.kind,
        cellIndex: b.cellIndex,
        label: b.label,
        text: b.text
      }));
      STATE.activeBeatId = null;
      STATE.activeCellIndex = null;
      renderSceneHeader();
      renderGrid();
      renderTimeline();
    } catch (e) {
      // ignore parse errors in the skeleton
    }
  }

  function inferKindFromText(text) {
    const t = text.toLowerCase();
    if (t.match(/core|non[- ]negotiable|constraint/)) return 'Core';
    if (t.match(/entity|character|agent|observer/)) return 'Entity';
    if (t.match(/goal|target|aim|reach/)) return 'Goal';
    if (t.match(/obstacle|conflict|block|risk|failure/)) return 'Obstacle';
    if (t.match(/morphism|transform|merge|bridge|map/)) return 'Morphism';
    if (t.match(/location|space|zone|room|world/)) return 'Location';
    if (t.match(/time|t\+|moment|beat/)) return 'Timepoint';
    return 'Entity';
  }

  function findOrCreateCellForKind(kind, seedText) {
    const { grid } = STATE.scene;
    const existing = grid.findIndex(c => c && c.kind === kind && !STATE.scene.beats.some(b => b.cellIndex === grid.indexOf(c)));
    if (existing !== -1) return existing;

    const emptyIndices = grid
      .map((c, idx) => (c ? null : idx))
      .filter(idx => idx != null);

    if (!emptyIndices.length) return 4 * 9 + 4;

    let hash = 0;
    for (let i = 0; i < seedText.length; i++) {
      hash = (hash * 31 + seedText.charCodeAt(i)) >>> 0;
    }
    const idx = emptyIndices[hash % emptyIndices.length];

    grid[idx] = { kind, label: kind.toUpperCase() };
    return idx;
  }

  function init() {
    renderSceneHeader();
    renderGrid();
    renderTimeline();
    attachInput();
    inputEl.focus();
  }

  init();
</script>
</body>
</html>

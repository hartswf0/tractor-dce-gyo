    :root {

      --onyx: #a855f7;
      --tutorial: #f59e0b;
      --editor: #3b82f6;
      --research: #10b981;
      --block: #ef4444;
      --mento: #ec4899;
      --homer: #8b5cf6;
      --wag: #f97316;
      --brick: #eab308;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'SF Mono', 'Menlo', monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
      max-width: 1600px;
      margin: 0 auto;
    }
    
    header {
      text-align: center;
      padding: 30px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
    }
    
    h1 {
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    
    .title {
      font-size: 28px;
      font-weight: 200;
      letter-spacing: 0.1em;
    }
    
    .stats {
      font-size: 10px;
      color: var(--muted);
      margin-top: 12px;
    }
    
    /* Search */
    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      align-items: center;
    }
    
    .search-bar input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
    }
    
    .search-bar input:focus {
      outline: none;
      border-color: var(--studio);
    }
    
    .filter-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    .pill {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      transition: all 0.15s;
    }
    
    .pill:hover, .pill.active {
      border-color: currentColor;
      color: var(--text);
    }
    
    .pill[data-cat="studio"] { --accent: var(--studio); }
    .pill[data-cat="onyx"] { --accent: var(--onyx); }
    .pill[data-cat="tutorial"] { --accent: var(--tutorial); }
    .pill[data-cat="editor"] { --accent: var(--editor); }
    .pill[data-cat="research"] { --accent: var(--research); }
    .pill[data-cat="block"] { --accent: var(--block); }
    .pill[data-cat="mento"] { --accent: var(--mento); }
    .pill[data-cat="homer"] { --accent: var(--homer); }
    .pill[data-cat="wag"] { --accent: var(--wag); }
    .pill[data-cat="brick"] { --accent: var(--brick); }
    
    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }
    
    /* Grid */
    .section {
      margin-bottom: 32px;
    }
    
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    
    .section-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
    }
    
    .section-count {
      font-size: 9px;
      color: var(--muted);
      margin-left: auto;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }
    
    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      text-decoration: none;
      color: var(--text);
      font-size: 9px;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .item:hover {
      border-color: #fff;
      transform: translateY(-1px);
    }
    
    .item.hidden { display: none; }
    
    .item-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    
    .item-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .item-ext {
      color: var(--muted);
      font-size: 8px;
    }
    
    /* Comparison view */
    .compare-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--studio);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      z-index: 100;
    }
    
    .compare-toggle:hover {
      transform: scale(1.05);
    }
    
    footer {
      text-align: center;
      padding: 30px 20px;
      border-top: 1px solid var(--border);
      margin-top: 40px;
      font-size: 9px;
      color: var(--muted);
    }
  </style>

// Render
function render(filter = 'all', search = '') {
  const content = document.getElementById('content');
  const searchLower = search.toLowerCase();
  let totalItems = 0;
  let visibleItems = 0;
  
  content.innerHTML = Object.entries(FILES).map(([cat, section]) => {
    const items = section.items.filter(item => {
      totalItems++;
      const matchesFilter = filter === 'all' || cat === filter;
      const matchesSearch = !search || item.name.toLowerCase().includes(searchLower);
      if (matchesFilter && matchesSearch) visibleItems++;
      return matchesFilter && matchesSearch;
    });
    
    if (items.length === 0) return '';
    
    return `
      <div class="section" data-cat="${cat}">
        <div class="section-header">
          <span class="section-dot" style="background:${section.color}"></span>
          <span class="section-title">${section.title}</span>
          <span class="section-count">${items.length}</span>
        </div>
        <div class="grid">
          ${items.map(item => `
            <a href="${item.href}" class="item">
              <span class="item-dot" style="background:${section.color}"></span>
              <span class="item-name">${item.name}</span>
              ${item.ext ? `<span class="item-ext">.${item.ext}</span>` : ''}
            </a>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
  
  document.getElementById('stats').textContent = 
    `${visibleItems} of ${totalItems} files • ${Object.keys(FILES).length} categories`;
}

// Events
document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    render(pill.dataset.cat, document.getElementById('search').value);
  });
});

document.getElementById('search').addEventListener('input', (e) => {
  const activePill = document.querySelector('.pill.active');
  render(activePill?.dataset.cat || 'all', e.target.value);
});

// Init
render();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cactus Finch</title>
<link rel="icon" type="image/svg+xml" href="ball-jar-favicon.svg" />
<link rel="stylesheet" href="./nabugo.css" />
<link rel="stylesheet" href="./finch-shared.css" />
<style>
  :root{ --finch: #4ade80; }
  .chip.finch{ color: var(--finch); border-color: #1d4a2c; }
  .beakstrip{ background: #08150d; color: var(--finch); }
  .gen{ border-left-color: #1d4a2c; }
  .axis i{ color: var(--finch); }
  .meter i.finch{ background: linear-gradient(90deg, #1d4a2c, var(--finch)); }
  .tray .cell.on.z1,.tray .cell.on.z2,.tray .cell.on.z3,.tray .cell.on.z4{ background: var(--finch); }
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <span class="brand">Cactus Finch</span>
    <span class="creed" id="latin"></span>
    <span class="spacer"></span>
    <span class="chip" id="chipRound">Round 0/16</span>
    <span class="chip finch" id="chipParts">0 parts</span>
    <span class="chip" id="chipViable">0 viable</span>
    <span class="chip" id="chipCat">catalogue —</span>
    <span class="chip" id="chipBus">Bus —</span>
  </header>
  <div class="beakstrip">Beak: <span id="beak"></span> &nbsp;·&nbsp; <i id="strategy"></i></div>

  <main class="finch">
    <!-- LEFT: the void ledger and what the material said back -->
    <div class="col">
      <div class="sec-head">Brief</div>
      <div class="sec-body">
        <select id="briefSel"></select>
        <div id="briefDesc" class="muted" style="margin-top:6px;line-height:1.5"></div>
      </div>
      <div class="sec-head">Void ledger <span class="n">not a percentage</span></div>
      <div class="sec-body" id="voids"></div>
      <div class="sec-head">Emergent <span class="n">the brief, contradicted</span></div>
      <div class="scrolly" style="padding:6px 9px" id="emergent"></div>
      <div class="sec-head">Run</div>
      <div class="sec-body">
        <div style="display:flex;gap:4px">
          <button id="btnStep" class="go" style="flex:1">Step</button>
          <button id="btnRun" class="go" style="flex:1">Run 16</button>
          <button id="btnReset" style="flex:1">Reset</button>
        </div>
        <div style="display:flex;gap:4px;margin-top:4px">
          <button id="btnDl" style="flex:1">Download MPD</button>
          <button id="btnBroadcast" style="flex:1">Broadcast</button>
        </div>
      </div>
    </div>

    <!-- CENTRE -->
    <div class="col">
      <div class="viewport">
        <div class="canvas" id="canvas"></div>
        <div class="tools">
          <button id="btnFit">Fit</button><button id="btnEdges">Edges</button>
          <button id="btnGrid">Grid</button><button id="btnSpin">Spin</button>
        </div>
        <div class="status" id="status">booting…</div>
      </div>
      <div style="flex:0 0 auto;border-top:1px solid var(--line)">
        <div class="sec-head">The tray</div>
        <div class="sec-body"><div class="tray" id="tray"></div></div>
        <div class="sec-head">Standing build</div>
        <div class="sec-body" id="metrics"></div>
      </div>
    </div>

    <!-- RIGHT: generations -->
    <div class="col">
      <div class="sec-head">Archives <span class="n">losers are kept</span></div>
      <div class="sec-body" id="archive"></div>
      <div class="sec-head">Generations <span class="n" id="nGen">0</span></div>
      <div class="scrolly" style="padding:6px 8px" id="generations"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./examples/js/loaders/LDrawLoader.js"></script>
<script src="./beta-prime-engine.js"></script>
<script src="./nabugo.js"></script>
<script src="./nabugo-evo.js"></script>
<script src="./nabugo-ui.js"></script>
<script src="./finch-page.js"></script>
<script>
  FinchBoot({ finch: 'cactus', brief: 'atlantis', cls: 'finch', background: 0x08150d });
</script>
</body>
</html>

<style>:root{--i:#090909;--p:#faf9f4;--w:#f2f0e9;--m:#707070;--y:#ffdf2b;--g:#18be74;--r:#ef3b32}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--p);color:var(--i);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,select{font:inherit;color:inherit;background:var(--p);border:1.5px solid #111;border-radius:0;min-height:36px;padding:5px 8px;font-weight:800}#app{height:100dvh;display:grid;grid-template-rows:40px 40px minmax(0,1fr) 43%}header,#sel{display:flex;align-items:center;gap:6px;padding:4px 7px;border-bottom:2px solid #111;overflow-x:auto;white-space:nowrap}header strong{font-size:9px;margin-right:auto}.chip{border:1px solid #111;padding:4px 6px;font-size:7px;flex:none}.ok{background:var(--g)}.bad{background:var(--r);color:#fff}.pending{background:var(--y)}#sel b{font-size:8px}#sel select{font-size:8px;min-height:31px;max-width:43%}#view{position:relative;min-height:0;background:var(--w);border-bottom:2px solid #111}#host{position:absolute;inset:0}canvas{width:100%!important;height:100%!important;display:block;touch-action:none}#id{position:absolute;left:8px;top:8px;max-width:70%;padding:6px 8px;background:#fff;border:2px solid #111;z-index:3;pointer-events:none}#id small{display:block;font-size:7px;letter-spacing:.12em}#id strong{display:block;font-size:13px;line-height:1.05;margin:2px 0}#id span{display:block;font-size:8px;color:var(--m)}#badge{position:absolute;right:8px;top:8px;border:1px solid #111;background:#fff;padding:5px 7px;font-size:8px;z-index:3}#dock{min-height:0;display:grid;grid-template-rows:46px minmax(0,1fr)}#ctrl{display:flex;gap:4px;padding:4px 5px;overflow-x:auto;border-bottom:2px solid #111}#ctrl button{font-size:7px;white-space:nowrap}#next{background:var(--y)}#lower{display:grid;grid-template-columns:1fr 1fr;min-height:0}.pane{overflow:auto;min-height:0;border-right:1px solid #111}.pane:last-child{border-right:0}.title{position:sticky;top:0;z-index:2;background:var(-- <body><div id="app"><header><strong>MOVIEATOR / SNIFF CANDIDATE</strong><span id="ready" class="chip pending">CHECKING</span><span id="count" class="chip">-- FIGS</span></header><div id="sel"><b>WORLD</b><select id="world"></select><b>FIGURE</b><select id="figure"></select></div><section id="view"><div id="host"></div><div id="id"><small>FIGURE</small><strong id="name">loading…</strong><span id="note"></span></div><div id="badge">LDRAW</div></section><section id="dock"><div id="ctrl"><button id="prev">PREV</button><button id="next">NEXT</button><button id="spin">SPIN</button></div><div id="lower"><div class="pane"><div class="title">FIGURES</div><div id="figs"></div></div><div class="pane"><div class="title">RENDERED PIECES</div><div class="legend">Only mounted canonical pieces. No search-result dumping.</div><div id="pieces"></div></div></div></section></div>

{id:'lisa',world:'simpsons',name:'Lisa Simpson',note:'exact head + beads upper',parts:[P('HEAD','15524p02.dat','Lisa Simpson head',{color:14,y:-64,profile:'sculpt20'}),P('UPPER','76382pd14.dat','Lisa beads upper'),P('LOWER','3815c01.dat','plain red lower',{exact:false,color:4})]},

{id:'shaggy',world:'scooby-doo',name:'Shaggy Rogers',note:'exact Shaggy Rogers hair; adjective matches excluded',parts:[P('HEAD','3626b.dat','head context',{exact:false,color:78}),P('HEADGEAR','21787.dat','Shaggy Rogers hair',{color:84}),P('UPPER','973c01.dat','lime upper context',{exact:false,color:27}),P('LOWER','3815c01.dat','dark-red lower context',{exact:false,color:320})]},
{id:'fred',world:'scooby-doo',name:'Fred Jones',note:'exact Fred hair + ascot torso',parts:[P('HEAD','3626b.dat','head context',{exact:false,color:78}),P('HEADGEAR','21788.dat','Fred Jones hair',{color:14}),P('TORSO','973px3.dat','Fred sweater + orange ascot',{color:15}),P('LOWER','3815c01.dat','blue lower context',{exact:false,color:1})]},
{id:'gremlin',world:'gremlins',name:'Gremlin',note:'exact sculpted Gremlin head',parts:[P('HEAD','26056.dat','Gremlin sculpted head',{y:-64,profile:'sculpt20'}),P('UPPER','973c01.dat','neutral upper context',{exact:false,color:0}),P('LOWER','3815c01.dat','neutral lower context',{exact:false,color:0})]}
];
const S={world:'simpsons',fig:null,root:null,spin:false,error:null,last:null};
function preflight(f){const problems=[],one=new Set();for(const p of f.parts){if(one.has(p.slot)&&p.slot!=='HEADGEAR')problems.push('duplicate '+p.slot);one.add(p.slot);if(/^~/.test(p.description))problems.push('subpart');if(/obsolete/i.test(p.description))problems.push('obsolete');if(p.profile==='sculpt20'&&p.y!==-64)problems.push('bad sculpt mount')}return problems}
const host=$('host'),renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(1);renderer.setClearColor(0xf2f0e9);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,10000),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.4));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(180,240,170);scene.add(light);const grid=new THREE.GridHelper(300,15,0x8c8c8c,0xd4d1c8);scene.add(grid);const loader=new LDrawLoader();loader.setConditionalLineMaterial(LDrawConditionalLineMaterial);loader.setPartsLibraryPath('./ldraw/');let ready=false;
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}function tick(){requestAnimationFrame(tick);resize();controls.update();if(S.spin&&S.root)S.root.rotation.y+=.008;renderer.render(scene,camera)}requestAnimationFrame(tick);function clear(){if(S.root){scene.remove(S.root);S.root=null}}function line(c,x,y,z,f,m='1 0 0 0 1 0 0 0 1'){return`1 ${c??16} ${x} ${y} ${z} ${m} parts/${f}`}function torso(p){const c=p.color??16;return[line(c,0,-60,0,p.file),line(c,-15.552,-51,0,'3818.dat','0.985 -0.17 0 0.17 0.985 0 0 0 1'),line(c,15.552,-51,0,'3819.dat','0.985 0.17 0 -0.17 0.985 0 0 0 1'),line(14,-23.6904,-33.226,-9.8982,'3820.dat','0.985 -0.1202 0.1202 0.17 0.6964 -0.6964 0 0.707 0.707'),line(14,23.6904,-33.226,-9.8982,'3820.dat','0.985 0.1202 -0.1202 -0.17 0.6964 -0.6964 0 0.707 0.707')]}
function mpd(f){const a=[`0 FILE movieator_${f.id}.mpd`,`0 Name: ${f.name}`,'0 !LDRAW_ORG Model','0 BFC CERTIFY CCW',''];for(const p of f.parts){const c=p.color??16;switch(p.slot){case'HEAD':a.push(line(c,0,p.y??-84,0,p.file));break;case'HEADGEAR':a.push(line(c,0,p.y??-84,0,p.file));break;case'UPPER':a.push(line(c,0,-60,0,p.file));break;case'TORSO':a.push(...torso(p));break;case'LOWER':a.push(line(c,0,-28,0,p.file));break;case'HIPWEAR':a.push(line(c,0,-28,0,p.file));break}a.push('')}return a.join('\n')}
function fit(r){const b=new THREE.Box3().setFromObject(r);if(b.isEmpty())return null;const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z,55);controls.target.copy(c);camera.position.set(c.x+d*1.25,c.y+d*.65,c.z+d*1.7);camera.near=.1;camera.far=d*50;camera.updateProjectionMatrix();grid.position.y=b.min.y-.8;return{s,c,b}}
function sniff(f,fd){const problems=preflight(f);if(S.error)problems.push('loader '+S.error);if(!fd)problems.push('empty');else{const s=fd.s;if(s.x>145||s.y>180||s.z>145)problems.push('oversize');if(s.x<20||s.y<35)problems.push('undersize');if(s.x/s.y>1.75)problems.push('too-wide')}const r={id:f.id,name:f.name,pass:!problems.length,problems,size:fd?{x:+fd.s.x.toFixed(1),y:+fd.s.y.toFixed(1),z:+fd.s.z.toFixed(1)}:null};S.last=r;window.__MOVIEATOR_SNIFF=r;$('badge').textContent=r.pass?'SNIFF PASS':'SNIFF FAIL';$('badge').className=r.pass?'ok':'bad';return r}
function render(){return new Promise(resolve=>{window.__MOVIEATOR_READY=false;S.error=null;loader.parse(mpd(S.fig),g=>{clear();S.root=new THREE.Group();S.root.rotation.x=Math.PI;S.root.add(g);scene.add(S.root);const r=sniff(S.fig,fit(S.root));renderer.render(scene,camera);window.__MOVIEATOR_READY=true;resolve(r)},e=>{S.error=String(e?.message||e);clear();const r=sniff(S.fig,null);window.__MOVIEATOR_READY=true;resolve(r)})})}
function fs(){return F.filter(f=>f.world===S.world)}function ui(){const used=W.filter(([id])=>F.some(f=>f.world===id));$('world').innerHTML=used.map(([id,n])=>`<option value="${id}">${n}</option>`).join('');$('world').value=S.world;$('figure').innerHTML=fs().map(f=>`<option value="${f.id}">${f.name}</option>`).join('');$('figure').value=S.fig.id;$('count').textContent=fs().length+' FIGS';$('figs').innerHTML=fs().map(f=>`<button class="fig ${f.id===S.fig.id?'active':''}" data-f="${f.id}"><b>${f.name}</b><small>${f.note}</small></button>`).join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>select(F.find(f=>f.id===b.dataset.f)));$('pieces').innerHTML=S.fig.parts.map((p,i)=>`<div class="piece"><b>${String(i+1).padStart(2,'0')} · ${p.file}</b><small>${p.description}</small><small class="${p.exact?'exact':'context'}">${p.exact?'EXACT':'CONTEXT'} · ${p.slot}</small></div>`).join('')}
async function select(f){S.fig=f;S.world=f.world;$('name').textContent=f.name;$('note').textContent=f.note;ui();await render()}function shift(n){const a=fs(),i=a.findIndex(f=>f.id===S.fig.id);select(a[(i+n+a.length)%a.length])}$('world').onchange=e=>{S.world=e.target.value;select(fs()[0])};$('figure').onchange=e=>select(F.find(f=>f.id===e.target.value));$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('spin').onclick=()=>S.spin=!S.spin;window.__MOVIEATOR_FIGURES=F;
try{await loader.preloadMaterials('./ldraw/LDConfig.ldr');ready=true;$('ready').textContent='LDRAW READY';$('ready').className='chip ok'}catch(e){S.error=String(e);$('ready').textContent='LDRAW ERROR';$('ready').className='chip bad'}const wanted=new URLSearchParams(location.search).get('figure'),start=F.find(f=>f.id===wanted)||F[0];await select(start);

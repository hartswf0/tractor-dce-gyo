                                    return `
                                        <button onclick="INSPECTOR.createLink(${node.id}, ${o.id}, 'morphism')"
                                            class="px-2 py-1 rounded border border-[var(--theme-border)] text-[10px] hover:border-[var(--theme-core)]">
                                            · ${o.label}
                                        </button>
                                    `;
                                }).join('')}
                            </div>` : ''}

                            ${(!hasLocationLink && locations.length) ? `
                            <div class="mt-2 text-[10px] text-[var(--theme-text-muted)]">Location assumptions</div>
                            <div class="mt-1 flex flex-wrap gap-1">
                                ${locations.map(loc => `
                                    <button onclick="INSPECTOR.attachToLocation(${node.id}, ${loc.id})"
                                        class="px-2 py-1 rounded border border-[var(--theme-border)] text-[10px] hover:border-[var(--theme-core)]">
                                        Place in ${loc.label}
                                    </button>
                                `).join('')}
                            </div>` : ''}

                            ${(!hasDesire && goals.length && node.icon === 'Entity') ? `
                            <div class="mt-2 text-[10px] text-[var(--theme-text-muted)]">Goal assumptions</div>
                            <div class="mt-1 flex flex-wrap gap-1">
                                ${goals.map(g => `
                                    <button onclick="INSPECTOR.giveGoal(${node.id}, ${g.id})"
                                        class="px-2 py-1 rounded border border-[var(--theme-border)] text-[10px] hover:border-[var(--theme-core)]">
                                        Give goal ${g.label}
                                    </button>
                                `).join('')}
                            </div>` : ''}
                        </div>
                    </div>
                `;
            },

            updateLabel(id, value) {
                const node = STATE.nodes.find(n => n.id === id);
                if (node) {
                    node.label = value;
                    RENDERER.nodes();
                    PERSISTENCE.save();
                    LOG.toast('Label updated');
                }
            },

            updateTime(id, value) {
                const node = STATE.nodes.find(n => n.id === id);
                if (!node) return;
                node.time = value.trim();
                PERSISTENCE.save();
                LOG.toast('Time updated');
            },

            updateLocation(id, field, value) {
                const node = STATE.nodes.find(n => n.id === id);
                if (!node) return;
                const trimmed = value.trim();
                if (!trimmed) {
                    node[field] = null;
                } else {
                    const num = Number(trimmed);
                    node[field] = Number.isFinite(num) ? num : trimmed;
                }
                PERSISTENCE.save();
                LOG.toast('Location updated');
            },

            cycleLinkType(index) {
                const link = STATE.links[index];
                if (!link) return;
                const order = ['morphism', 'shift', 'desire', 'conflict', 'inside'];
                const current = link.type || 'morphism';
                const idx = order.indexOf(current);
                const next = order[(idx + 1 + order.length) % order.length];
                link.type = next;
                RENDERER.connections();
                PERSISTENCE.save();
                if (STATE.selectedNodeId) {
                    this.select(STATE.selectedNodeId);
                }
                LOG.toast(`Link type: ${next}`);
            },

            toggleLinkNames() {
                STATE.showLinkNames = !STATE.showLinkNames;
                RENDERER.connections();
                if (STATE.selectedNodeId) {
                    this.select(STATE.selectedNodeId);
                }
            },

            updateLinkLabel(index, value) {
                const link = STATE.links[index];
                if (!link) return;
                const trimmed = value.trim();
                link.label = trimmed || undefined;
                PERSISTENCE.save();
                LOG.toast('Link name updated');
            },

            deleteLink(index) {
                const link = STATE.links[index];
                if (!link) return;
                STATE.links.splice(index, 1);
                RENDERER.connections();
                PERSISTENCE.save();
                if (STATE.selectedNodeId) {
                    this.select(STATE.selectedNodeId);
                }
                LOG.toast('Link removed');
            },

            delete() {
                if (!STATE.selectedNodeId) return;

                STATE.nodes = STATE.nodes.filter(n => n.id !== STATE.selectedNodeId);
                STATE.links = STATE.links.filter(l => l.from !== STATE.selectedNodeId && l.to !== STATE.selectedNodeId);
                STATE.selectedNodeId = null;

                RENDERER.nodes();
                RENDERER.connections();
                this.close();
                PERSISTENCE.save();
                LOG.toast('Entity deleted');
            },

            close() {
                STATE.selectedNodeId = null;
                document.getElementById('inspector-content').innerHTML = `
                    <div class="text-sm text-[var(--theme-text-muted)] text-center py-8">
                        Select a node to inspect
                    </div>`;
                RENDERER.nodes();
                GRID.highlightNeighborhood(null);
            },

            exportJson() {
                if (!STATE.selectedNodeId) return;
                const node = STATE.nodes.find(n => n.id === STATE.selectedNodeId);
                if (!node) return;

                const links = STATE.links
                    .map((link, index) => ({ link, index }))
                    .filter(({ link }) => link.from === node.id || link.to === node.id)
                    .map(({ link, index }) => {
                        const isOut = link.from === node.id;
                        const otherId = isOut ? link.to : link.from;
                        const other = STATE.nodes.find(n => n.id === otherId);
                        return {
                            index,
                            direction: isOut ? 'out' : 'in',
                            type: link.type,
                            label: link.label || null,
                            from: link.from,
                            to: link.to,
                            otherId,
                            otherLabel: other ? other.label : null
                        };
                    });

                const nodePayload = {
                    id: node.id,
                    label: node.label,
                    type: node.type,
                    icon: node.icon,
                    x: node.x,
                    y: node.y
                };

                if (node.time) {
                    nodePayload.time = node.time;
                }
                if (typeof node.lat === 'number') {
                    nodePayload.lat = node.lat;
                }
                if (typeof node.lng === 'number') {
                    nodePayload.lng = node.lng;
                }

                const payload = {
                    node: nodePayload,
                    links
                };

                const json = JSON.stringify(payload, null, 2);

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(json).then(() => {
                        LOG.toast('Inspector JSON copied to clipboard');
                    }).catch(() => {
                        console.log('INSPECTOR JSON', json);
                        LOG.info('Inspector JSON logged to console');
                    });
                } else {
                    console.log('INSPECTOR JSON', json);
                    LOG.info('Inspector JSON logged to console');
                }
            },

            updateType(id, typeLabel) {
                const node = STATE.nodes.find(n => n.id === id);
                if (!node) return;

                const canonical = typeLabel.charAt(0).toUpperCase() + typeLabel.slice(1).toLowerCase();
                node.type = canonical.toLowerCase();
                node.icon = canonical;

                if (canonical === 'Timepoint' && typeof node.time === 'undefined') {
                    node.time = '';
                }
                if (canonical === 'Location') {
                    if (typeof node.lat === 'undefined') node.lat = null;
                    if (typeof node.lng === 'undefined') node.lng = null;
                }

                RENDERER.nodes();
                PERSISTENCE.save();
                LOG.toast(`Type set to ${canonical}`);
            },

            forkScene() {
                if (!STATE.selectedNodeId) return;
                const node = STATE.nodes.find(n => n.id === STATE.selectedNodeId);
                if (!node) return;

                if (!SCENE_IO.collection || !Array.isArray(SCENE_IO.collection.scenes)) {
                    LOG.warn('No SceneCollection loaded; cannot fork scene');
                    LOG.toast('Load scenes via Merge before forking');
                    return;
                }

                const base = SCENE_IO.collection.scenes[SCENE_IO.currentIndex];
                if (!base) return;

                const clone = JSON.parse(JSON.stringify(base));
                const baseTitle = base.title || base.label || base.id || 'Scene';
                const nodeLabel = node.label || node.icon || 'node';

                clone.id = (base.id ? `${base.id}_fork_${Date.now()}` : `scene_fork_${Date.now()}`);
                clone.title = `${baseTitle} · Fork of ${nodeLabel}`;
                clone.meta = clone.meta || {};
                clone.meta.isFork = true;
                clone.meta.forkOf = base.id || baseTitle;
                clone.meta.forkSourceLabel = nodeLabel;

                SCENE_IO.collection.scenes.push(clone);
                SCENE_IO.currentIndex = SCENE_IO.collection.scenes.length - 1;
                SCENE_IO.saveToLocalStorage();
                SCENE_IO.populatePicker();
                SCENE_IO.loadScene(SCENE_IO.currentIndex);

                LOG.success(`Forked new scene from "${nodeLabel}"`);
            },

            toggleContainer(id) {
                const node = STATE.nodes.find(n => n.id === id);
                if (!node || (node.icon !== 'Scene' && node.icon !== 'Story')) {
                    LOG.warn('toggleContainer is only valid for Scene/Story');
                    return;
                }

                if (!Array.isArray(STATE.collapsedContainers)) STATE.collapsedContainers = [];
                const idx = STATE.collapsedContainers.indexOf(id);
                const collapsing = idx === -1;
                if (collapsing) STATE.collapsedContainers.push(id);
                else STATE.collapsedContainers.splice(idx, 1);

                RENDERER.nodes();
                RENDERER.connections();
                PERSISTENCE.save();
                LOG.toast(`${collapsing ? 'Collapsed' : 'Expanded'} ${node.icon}`);
            },

            makeSceneFromSelection() {
                const ids = (STATE.multiSelectedIds || []).slice();
                if (!ids.length) return;

                const label = `Scene · ${ids.length} parts`;
                const sceneId = COMPILER.spawnNode('Scene', label);

                ids.forEach(id => {
                    if (!STATE.links.some(l => l.from === id && l.to === sceneId && l.type === 'inside')) {
                        STATE.links.push({ from: id, to: sceneId, type: 'inside' });
                    }
                });

                STATE.selectedNodeId = sceneId;
                STATE.multiSelectedIds = [];
                RENDERER.nodes();
                RENDERER.connections();
                PERSISTENCE.save();
                LOG.toast(`Created Scene from ${ids.length} nodes`);
            },

            attachSelectionToStory() {
                if (!STATE.selectedNodeId) return;
                const story = STATE.nodes.find(n => n.id === STATE.selectedNodeId && n.icon === 'Story');
                if (!story) {
                    LOG.warn('Select a Story node first');
                    LOG.toast('Select a Story to attach selection');
                    return;
                }

                const ids = (STATE.multiSelectedIds || []).filter(id => id !== story.id);
                if (!ids.length) return;

                ids.forEach(id => {
                    if (!STATE.links.some(l => l.from === id && l.to === story.id && l.type === 'inside')) {
                        STATE.links.push({ from: id, to: story.id, type: 'inside' });
                    }
                });

                STATE.multiSelectedIds = [];
                RENDERER.nodes();
                RENDERER.connections();
                PERSISTENCE.save();
                LOG.toast(`Attached ${ids.length} nodes to Story`);
            },

            selectAndFocus(id) {
                this.select(id);
                LOG.toast('Inspector ready: adjust type or fork scene');
            },

            onContextMenu(e, id) {
                e.preventDefault();
                this.select(id);
                LOG.toast('Inspector options available for this entity');
            },

            createLink(fromId, toId, typeLabel) {
                const type = typeLabel || 'morphism';
                if (STATE.links.find(l => l.from === fromId && l.to === toId && l.type === type)) return;

                STATE.links.push({ from: fromId, to: toId, type });
                RENDERER.connections();
                PERSISTENCE.save();
                const fromNode = STATE.nodes.find(n => n.id === fromId);
                const toNode = STATE.nodes.find(n => n.id === toId);
                const fromLabel = fromNode ? fromNode.label : `#${fromId}`;
                const toLabel = toNode ? toNode.label : `#${toId}`;
                LOG.info(`${fromLabel} → ${type} → ${toLabel}`);

                if (STATE.selectedNodeId === fromId) this.select(fromId);
            },

            attachToLocation(nodeId, locId) {
                const node = STATE.nodes.find(n => n.id === nodeId);
                const loc = STATE.nodes.find(n => n.id === locId);
                if (!node || !loc) return;

                if (!STATE.links.some(l => l.from === nodeId && l.to === locId && l.type === 'inside')) {
                    STATE.links.push({ from: nodeId, to: locId, type: 'inside' });
                }

                RENDERER.connections();
                PERSISTENCE.save();
                LOG.toast(`Placed ${node.label} in ${loc.label}`);

                if (STATE.selectedNodeId === nodeId) this.select(nodeId);
            },

            giveGoal(nodeId, goalId) {
                const node = STATE.nodes.find(n => n.id === nodeId);
                const goal = STATE.nodes.find(n => n.id === goalId);
                if (!node || !goal) return;

                if (!STATE.links.some(l => l.from === nodeId && l.to === goalId && l.type === 'desire')) {
                    STATE.links.push({ from: nodeId, to: goalId, type: 'desire' });
                }

                RENDERER.connections();
                PERSISTENCE.save();
                LOG.toast(`Gave ${node.label} goal ${goal.label}`);

                if (STATE.selectedNodeId === nodeId) this.select(nodeId);
            }
        };

        // =========================================
        // STRUCTURE HELPERS
        // =========================================
        const STRUCTURE = {
            autoAttach(node) {
                if (!node) return;

                const step = 100 / 9;
                const cellX = Math.round(node.x / step);
                const cellY = Math.round(node.y / step);

                const host = STATE.nodes.find(n =>
                    (n.icon === 'Scene' || n.icon === 'Story') &&
                    n.id !== node.id &&
                    Math.round(n.x / step) === cellX &&
                    Math.round(n.y / step) === cellY
                );

                if (!host) return;

                if (STATE.links.some(l => l.from === node.id && l.to === host.id && l.type === 'inside')) return;

                STATE.links.push({ from: node.id, to: host.id, type: 'inside' });

                if (typeof FEEDBACK !== 'undefined') {
                    const freq = host.icon === 'Story' ? 540 : 420;
                    FEEDBACK.playTone(freq, 0.08);
                }

                LOG.toast(`Attached ${node.label} to ${host.icon.toLowerCase()} ${host.label}`);
            }
        };

        // =========================================
        // EVENTS
        // =========================================
        const EVENTS = {
            startDrag(e, id) {
                e.stopPropagation();
                STATE.draggedNodeId = id;
                STATE.dragMoved = false; // Track if actual drag occurred

                const evt = e.touches ? e.touches[0] : e;
                STATE.lastX = evt.clientX;
                STATE.lastY = evt.clientY;
                STATE.dragStartX = evt.clientX;
                STATE.dragStartY = evt.clientY;

                document.body.style.cursor = 'grabbing';
            },

            handleClick(e, id) {
                // Cmd/Ctrl-click toggles multi-selection; plain click selects single
                const multiKey = e.metaKey || e.ctrlKey;
                if (!multiKey) {
                    console.log('[EVENTS.handleClick] single select', { id });
                    STATE.multiSelectedIds = [];
                    INSPECTOR.select(id);
                    return;
                }

                e.stopPropagation();
                console.log('[EVENTS.handleClick] multi-select toggle', { id, before: STATE.multiSelectedIds });
                const list = STATE.multiSelectedIds || [];
                const idx = list.indexOf(id);
                if (idx === -1) {
                    list.push(id);
                } else {
                    list.splice(idx, 1);
                }
                STATE.multiSelectedIds = list;
                console.log('[EVENTS.handleClick] multi-selected now', { after: STATE.multiSelectedIds });
                INSPECTOR.select(id);
            },

            handleDragMove(e) {
                if (!STATE.draggedNodeId) return;
                e.preventDefault();

                const evt = e.touches ? e.touches[0] : e;
                const deltaX = evt.clientX - STATE.lastX;
                const deltaY = evt.clientY - STATE.lastY;

                // Mark as actual drag if moved more than 5px threshold
                const totalDist = Math.abs(evt.clientX - STATE.dragStartX) + Math.abs(evt.clientY - STATE.dragStartY);
                if (totalDist > 5) STATE.dragMoved = true;

                STATE.lastX = evt.clientX;
                STATE.lastY = evt.clientY;

                const canvasRect = document.getElementById('grid-shell').getBoundingClientRect();
                const percentX = (deltaX / canvasRect.width) * 100;
                const percentY = (deltaY / canvasRect.height) * 100;

                const node = STATE.nodes.find(n => n.id === STATE.draggedNodeId);
                if (node) {
                    node.x = Math.max(0, Math.min(100, node.x + percentX));
                    node.y = Math.max(0, Math.min(100, node.y + percentY));

                    const el = document.querySelector(`[data-node-id="${node.id}"]`);
                    if (el) {
                        el.style.left = `${node.x}%`;
                        el.style.top = `${node.y}%`;
                    }

                    RENDERER.connections();
                }
            },

            handleDragEnd(e) {
                if (!STATE.draggedNodeId) return;

                const nodeId = STATE.draggedNodeId;
                const node = STATE.nodes.find(n => n.id === nodeId);
                
                // If no actual drag movement, treat as tap/click for selection
                if (!STATE.dragMoved && node) {
                    STATE.draggedNodeId = null;
                    document.body.style.cursor = 'default';
                    INSPECTOR.select(nodeId);
                    return;
                }
                if (node) {
                    const snapped = GRID.snap(node.x, node.y);
                    node.x = snapped.x;
                    node.y = snapped.y;

                    const el = document.querySelector(`[data-node-id="${node.id}"]`);
                    if (el) {
                        el.style.left = `${node.x}%`;
                        el.style.top = `${node.y}%`;
                    }

                    STRUCTURE.autoAttach(node);
                }

                STATE.draggedNodeId = null;
                document.body.style.cursor = 'default';
                RENDERER.nodes();
                RENDERER.connections();
                GRID.highlightNeighborhood(node || null);
                PERSISTENCE.save();
            }
        };

        // =========================================
        // THEME
        // =========================================
        const THEME = {
            set(mode) {
                document.body.className = document.body.className.replace(/theme-\w+/, '') + ` theme-${mode} grid grid-cols-[288px_1fr_320px] grid-rows-[64px_1fr_200px] h-screen w-screen overflow-hidden`;
                STATE.theme = mode;
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === mode);
                    btn.classList.toggle('text-[var(--theme-text-muted)]', btn.dataset.theme !== mode);
                });
                PERSISTENCE.save();
            }
        };

        // =========================================
        // CONSOLE
        // =========================================
        const CONSOLE = {
            toggle() {
                LAYOUT.toggleConsole();
            },

            log(type, msg) {
                const container = document.getElementById('console-content');
                const entry = document.createElement('div');
                entry.className = `log-entry log-${type.toLowerCase()}`;
                entry.innerHTML = `<span class="font-bold">${type}</span> ${msg}`;
                container.prepend(entry);
            }
        };

        // =========================================
        // PERSISTENCE
        // =========================================
        const PERSISTENCE = {
            save() {
                const data = {
                    nodes: STATE.nodes,
                    links: STATE.links,
                    viewMode: STATE.viewMode,
                    theme: STATE.theme,
                    sidebarCollapsed: STATE.sidebarCollapsed,
                    inspectorCollapsed: STATE.inspectorCollapsed,
                    consoleCollapsed: STATE.consoleCollapsed
                };
                try {
                    localStorage.setItem('onyx_storytelling_state', JSON.stringify(data));
                } catch (e) {
                    // Quota exceeded - clear old data and retry with minimal state
                    console.warn('[PERSISTENCE] Quota exceeded, clearing old state');
                    try {
                        localStorage.removeItem('onyx_storytelling_state');
                        // Save only essential data (limit nodes to last 50)
                        const minimalData = {
                            nodes: data.nodes.slice(-50),
                            links: data.links.slice(-100),
                            viewMode: data.viewMode,
                            theme: data.theme
                        };
                        localStorage.setItem('onyx_storytelling_state', JSON.stringify(minimalData));
                    } catch (e2) {
                        console.error('[PERSISTENCE] Cannot save even minimal state');
                    }
                }
            },

            load() {
                const raw = localStorage.getItem('onyx_storytelling_state');
                if (!raw) {
                    // Default setup
                    const corePos = GRID.center(4, 4);
                    STATE.nodes = [{
                        id: Date.now(),
                        type: 'core',
                        icon: 'Core',
                        label: 'Story Core',
                        x: corePos.x,
                        y: corePos.y
                    }];
                    return;
                }

                try {
                    const data = JSON.parse(raw);
                    Object.assign(STATE, data);
                } catch (e) {
                    LOG.error('Failed to load state');
                }
            },
            
            // Load scenario seeds from scenario-seeds.json
            loadScenarioSeeds() {
                const url = 'scenario-seeds.json';
                console.log('[ONYX-TAIL] Loading scenario seeds from', url);
                fetch(url)
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        const STAGE_COLORS = {
                            GROUND: '#3b82f6',
                            SITE: '#10b981',
                            SKY: '#f97316',
                            PERSPECTIVE: '#ef4444'
                        };
                        
                        // Clear existing and create from seeds
                        STATE.nodes = [];
                        STATE.links = [];
                        
                        let col = 0;
                        Object.entries(data.categories).forEach(([catId, cat]) => {
                            // Category node
                            const catPos = GRID.center(col, 0);
                            const catNode = {
                                id: Date.now() + Math.random() * 1000,
                                type: 'place',
                                icon: 'Place',
                                label: catId,
                                stage: cat.stage,
                                x: catPos.x,
                                y: catPos.y
                            };
                            STATE.nodes.push(catNode);
                            
                            // Scenario nodes under category
                            let row = 1;
                            cat.ids.forEach(id => {
                                const s = data.scenarios[id];
                                if (!s) return;
                                
                                const pos = GRID.center(col, row);
                                const node = {
                                    id: Date.now() + Math.random() * 1000,
                                    type: 'entity',
                                    icon: 'Entity',
                                    label: s.name,
                                    symbol: s.symbol,
                                    role: s.role,
                                    goal: s.goal,
                                    obstacle: s.obstacle,
                                    stage: s.stage,
                                    category: s.category,
                                    scenarioId: s.id,
                                    x: pos.x,
                                    y: pos.y
                                };
                                STATE.nodes.push(node);
                                
                                // Link to category
                                STATE.links.push({
                                    from: catNode.id,
                                    to: node.id,
                                    type: 'contains'
                                });
                                
                                row++;
                            });
                            col++;
                        });
                        
                        RENDERER.nodes();
                        RENDERER.connections();
                        this.save();
                        LOG.toast('Loaded ' + STATE.nodes.length + ' scenario seeds');
                    })
                    .catch(err => {
                        console.error('[ONYX-TAIL] Failed to load scenario seeds:', err);
                        LOG.error('Failed to load scenario-seeds.json. Use local server.');
                    });
            }
        };

        // =========================================
        // FEEDBACK (HAPTIC / SONIC)
        // =========================================
        const FEEDBACK = {
            audioCtx: null,

            ensureAudio() {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                if (!this.audioCtx) {
                    try {
                        this.audioCtx = new AC();
                    } catch (e) {
                        this.audioCtx = null;
                    }
                }
                return this.audioCtx;
            },

            playTone(freq, durationSec) {
                const ctx = this.ensureAudio();
                if (!ctx) return;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;
                gain.gain.setValueAtTime(0.0, now);
                gain.gain.linearRampToValueAtTime(0.18, now + 0.01);
                gain.gain.linearRampToValueAtTime(0.0, now + durationSec);

                osc.start(now);
                osc.stop(now + durationSec + 0.05);
            },

            pulse(pattern) {
                if (navigator.vibrate) {
                    navigator.vibrate(pattern || 10);
                }
            },

            soft() {
                this.pulse(12);
                this.playTone(420, 0.08);
            },

            success() {
                this.pulse([8, 30, 12]);
                this.playTone(660, 0.12);
            }
        };

        // =========================================
        // LOG
        // =========================================
        const LOG = {
            info(msg) { CONSOLE.log('INFO', msg); },
            success(msg) { CONSOLE.log('SUCCESS', msg); },
            warn(msg) { CONSOLE.log('WARN', msg); },
            error(msg) { CONSOLE.log('ERROR', msg); },
            toast(msg) {
                FEEDBACK.soft();
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<i class="fas fa-check-circle w-4 h-4 text-cyan-400 mr-2"></i> ${msg}`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        };

        // =========================================
        // SCENE COLLECTION BRIDGE (LEGOS ↔ ONYX)
        // =========================================
        const SCENE_IO = {
            collection: null,
            currentIndex: 0,

            loadFromLocalStorage() {
                try {
                    const raw = localStorage.getItem('onyx_scene_collection');
                    if (!raw) return;
                    const col = JSON.parse(raw);
                    if (!col || !Array.isArray(col.scenes)) return;
                    this.collection = col;
                    this.currentIndex = 0;
                    this.populatePicker();
                } catch (e) {
                    LOG.error('Failed to read onyx_scene_collection');
                }
            },

            populatePicker() {
                const picker = document.getElementById('scene-picker');
                if (!picker || !this.collection) return;
                picker.innerHTML = '';
                this.collection.scenes.forEach((scene, idx) => {
                    const opt = document.createElement('option');
                    const title = scene.title || scene.label || scene.id || `Scene ${idx + 1}`;
                    const isFork = scene.meta && scene.meta.isFork;
                    opt.value = String(idx);
                    opt.textContent = `${String(idx + 1).padStart(2, '0')} · ${isFork ? '↳ ' : ''}${title}`;
                    picker.appendChild(opt);
                });
                picker.value = String(this.currentIndex);
            },

            loadScene(index) {
                if (!this.collection || !Array.isArray(this.collection.scenes)) return;
                const scene = this.collection.scenes[index];
                if (!scene) return;

                this.currentIndex = index;

                // Reset ONYX Tail state
                STATE.nodes = [];
                STATE.links = [];

                const rawGrid = Array.isArray(scene.grid) ? scene.grid : [];
                let grid = [];
                if (rawGrid.length === 81) {
                    grid = rawGrid.slice();
                } else if (rawGrid.length === 9 && Array.isArray(rawGrid[0])) {
                    const flat = new Array(81).fill(null);
                    for (let r = 0; r < 9; r++) {
                        const row = rawGrid[r] || [];
                        for (let c = 0; c < 9; c++) {
                            flat[r * 9 + c] = row[c] || null;
                        }
                    }
                    grid = flat;
                } else {
                    grid = new Array(81).fill(null);
                    rawGrid.forEach(cell => {
                        if (!cell || typeof cell.row !== 'number' || typeof cell.col !== 'number') return;
                        const r = Math.max(0, Math.min(8, cell.row));
                        const c = Math.max(0, Math.min(8, cell.col));
                        grid[r * 9 + c] = cell;
                    });
                }

                const cellToNode = new Array(81).fill(null);
                grid.forEach((cell, idx) => {
                    if (!cell) return;
                    const kind = cell.kind || 'Entity';
                    const icon = ICONS[kind] ? kind : 'Entity';
                    const row = Math.floor(idx / 9);
                    const col = idx % 9;
                    const pos = GRID.center(col, row);

                    const node = {
                        id: Date.now() + Math.random(),
                        type: (kind || 'Entity').toLowerCase(),
                        icon,
                        label: cell.label || cell.symbol || cell.id || kind,
                        x: pos.x,
                        y: pos.y
                    };
                    STATE.nodes.push(node);
                    cellToNode[idx] = node.id;
                });

                // Auto-generate morphism links from grid topology + explicit relations
                const idToIndex = new Map();
                grid.forEach((cell, idx) => {
                    if (!cell) return;
                    const keys = [];
                    if (cell.entityId) keys.push(cell.entityId);
                    if (cell.id) keys.push(cell.id);
                    if (cell.label) keys.push(cell.label);
                    keys.forEach(k => {
                        if (k && !idToIndex.has(k)) idToIndex.set(k, idx);
                    });
                });

                const autoLinks = [];
                grid.forEach((cell, idx) => {
                    if (!cell) return;
                    const fromNodeId = cellToNode[idx];
                    if (!fromNodeId) return;
                    const r = Math.floor(idx / 9);
                    const c = idx % 9;

                    const rels = (cell.meta && Array.isArray(cell.meta.relations))
                        ? cell.meta.relations
                        : (Array.isArray(cell.relations) ? cell.relations : []);

                    rels.forEach(rel => {
                        if (!rel) return;
                        const key = rel.targetId || rel.entityId || rel.id || rel.label || rel.target;
                        if (!key) return;
                        const tIdx = idToIndex.get(key);
                        if (tIdx == null || tIdx === idx) return;
                        const toNodeId = cellToNode[tIdx];
                        if (!toNodeId) return;
                        autoLinks.push({ from: fromNodeId, to: toNodeId, type: 'morphism', auto: true });
                    });

                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = r + dr;
                            const nc = c + dc;
                            if (nr < 0 || nr > 8 || nc < 0 || nc > 8) continue;
                            const nIdx = nr * 9 + nc;
                            if (!grid[nIdx]) continue;
                            const toNodeId = cellToNode[nIdx];
                            if (!toNodeId) continue;
                            autoLinks.push({ from: fromNodeId, to: toNodeId, type: 'morphism', auto: true });
                        }
                    }
                });

                const seen = new Set();
                STATE.links = [];
                autoLinks.forEach(l => {
                    const key = `${l.from}->${l.to}-${l.type}-${l.auto ? 'a' : 'm'}`;
                    if (seen.has(key)) return;
                    seen.add(key);
                    STATE.links.push(l);
                });

                // Track scene metadata for UI
                STATE.sceneMeta = {
                    id: scene.id || null,
                    title: scene.title || scene.label || null,
                    isFork: !!(scene.meta && scene.meta.isFork),
                    forkOf: scene.meta && scene.meta.forkOf ? scene.meta.forkOf : null,
                    forkSourceLabel: scene.meta && scene.meta.forkSourceLabel ? scene.meta.forkSourceLabel : null
                };

                const badge = document.getElementById('scene-fork-indicator');
                if (badge) {
                    if (STATE.sceneMeta.isFork && (STATE.sceneMeta.forkSourceLabel || STATE.sceneMeta.forkOf)) {
                        const src = STATE.sceneMeta.forkSourceLabel || STATE.sceneMeta.forkOf;
                        badge.textContent = `FORK · from ${src}`;
                        badge.classList.remove('hidden');
                    } else {
                        badge.textContent = '';
                        badge.classList.add('hidden');
                    }
                }

                RENDERER.nodes();
                RENDERER.connections();
                PERSISTENCE.save();
                LOG.toast(`Loaded scene ${index + 1} into ONYX Tail`);
            },

            saveToLocalStorage() {
                if (!this.collection) return;
                try {
                    localStorage.setItem('onyx_scene_collection', JSON.stringify(this.collection));
                } catch (e) {
                    LOG.error('Failed to save onyx_scene_collection');
                }
            },

            syncFromPicker() {
                if (!this.collection) this.loadFromLocalStorage();
                const picker = document.getElementById('scene-picker');
                if (!picker || !this.collection) return;
                const idx = parseInt(picker.value, 10);
                const safeIdx = Number.isNaN(idx) ? 0 : idx;
                this.loadScene(safeIdx);
            }
        };

        function fitGridShellSquare() {
            const mainEl = document.getElementById('onyx-main');
            const shell = document.getElementById('grid-shell');
            if (!mainEl || !shell) return;
            const rect = mainEl.getBoundingClientRect();
            const size = Math.min(rect.width, rect.height);
            const offsetX = (rect.width - size) / 2;
            const offsetY = (rect.height - size) / 2;
            shell.style.width = `${size}px`;
            shell.style.height = `${size}px`;
            shell.style.left = `${offsetX}px`;
            shell.style.top = `${offsetY}px`;
        }

        // =========================================
        // LAYOUT (PANEL COLLAPSE)
        // =========================================
        const LAYOUT = {
            apply() {
                const body = document.body;
                body.classList.toggle('sidebar-collapsed', !!STATE.sidebarCollapsed);
                body.classList.toggle('inspector-collapsed', !!STATE.inspectorCollapsed);
                body.classList.toggle('console-collapsed', !!STATE.consoleCollapsed);
                fitGridShellSquare();
            },

            toggleSidebar() {
                STATE.sidebarCollapsed = !STATE.sidebarCollapsed;
                this.apply();
                PERSISTENCE.save();
                FEEDBACK.soft();
            },

            toggleInspector() {
                STATE.inspectorCollapsed = !STATE.inspectorCollapsed;
                this.apply();
                PERSISTENCE.save();
                FEEDBACK.soft();
            },

            toggleConsole() {
                STATE.consoleCollapsed = !STATE.consoleCollapsed;
                this.apply();
                PERSISTENCE.save();
                FEEDBACK.soft();
            }
        };

        // =========================================
        // INIT
        // =========================================
        function init() {
            PERSISTENCE.load();
            THEME.set(STATE.theme);
            SIDEBAR.renderTools();
            RENDERER.grid();
            RENDERER.nodes();
            RENDERER.connections();
            LAYOUT.apply();
            fitGridShellSquare();

            window.addEventListener('resize', fitGridShellSquare);

            // Event listeners
            document.addEventListener('mousemove', EVENTS.handleDragMove);
            document.addEventListener('mouseup', EVENTS.handleDragEnd);
            document.addEventListener('touchmove', EVENTS.handleDragMove, { passive: false });
            document.addEventListener('touchend', EVENTS.handleDragEnd);

            // Navigation buttons
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => VIEW_MODE.switch(tab.dataset.view));
            });

            // Theme buttons
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => THEME.set(btn.dataset.theme));
            });

            // Enter key handler
            document.getElementById('narrative-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') COMPILER.commit();
            });

            // Scene picker / Sync wiring
            const picker = document.getElementById('scene-picker');
            const syncBtn = document.getElementById('scene-export');
            if (syncBtn) {
                syncBtn.addEventListener('click', () => SCENE_IO.syncFromPicker());
            }
            if (picker) {
                picker.addEventListener('change', () => {
                    if (SCENE_IO.collection) {
                        const idx = parseInt(picker.value, 10);
                        const safeIdx = Number.isNaN(idx) ? 0 : idx;
                        SCENE_IO.loadScene(safeIdx);
                    }
                });
            }

            // Try to hydrate from Merge SceneCollection
            SCENE_IO.loadFromLocalStorage();

            LOG.success('ONYX Storytelling System initialized');
            LOG.info('Ready for narrative construction');
        }

        // Start
        init();
    </script>
</body>

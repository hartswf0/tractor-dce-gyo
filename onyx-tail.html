<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ONYX Storytelling System</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='8' width='84' height='84' rx='18' fill='%230b1121'/%3E%3Ctext x='50' y='62' font-size='60' text-anchor='middle' fill='%2322d3ee'%3ET%3C/text%3E%3C/svg%3E" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --theme-bg: #0b1121;
            --theme-panel: #0f172a;
            --theme-surface: #1e293b;
            --theme-border: #334155;
            --theme-text-main: #e2e8f0;
            --theme-text-muted: #64748b;
            --theme-entity: #60a5fa;
            --theme-core: #fbbf24;
            --theme-goal: #4ade80;
            --theme-obstacle: #f87171;
            --theme-morphism: #22d3ee;
            --theme-scene: #c084fc;
            --theme-story: #e879f9;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --grid-focus-bg: rgba(59, 130, 246, 0.1);
            --grid-focus-border: rgba(59, 130, 246, 0.3);
            --grid-neighbor-bg: rgba(96, 165, 250, 0.06);
            --grid-neighbor-border: rgba(96, 165, 250, 0.35);
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--theme-bg);
            color: var(--theme-text-main);
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        body.sidebar-collapsed {
            grid-template-columns: 0px 1fr 320px;
        }

        body.inspector-collapsed {
            grid-template-columns: 288px 1fr 0px;
        }

        body.sidebar-collapsed.inspector-collapsed {
            grid-template-columns: 0px 1fr 0px;
        }

        body.console-collapsed {
            grid-template-rows: 64px 1fr 0px;
        }

        body.sidebar-collapsed aside[data-panel="sidebar"],
        body.inspector-collapsed aside[data-panel="inspector"],
        body.console-collapsed [data-panel="console"] {
            display: none;
        }

        .theme-dark {
            --theme-bg: #0b1121;
            --theme-panel: #0f172a;
            --theme-surface: #1e293b;
            --theme-border: #334155;
            --theme-text-main: #e2e8f0;
            --theme-text-muted: #64748b;
        }

        .theme-parchment {
            --theme-bg: #fdf7e3;
            --theme-panel: #f7edd7;
            --theme-surface: #f1e2c4;
            --theme-border: #e5c48f;
            --theme-text-main: #2b2a26;
            --theme-text-muted: #7a6a4a;
        }

        .theme-parchment .grid-overlay {
            opacity: 0.22;
        }

        .theme-parchment .grid-cell {
            border-color: rgba(0, 0, 0, 0.12);
        }

        .theme-parchment .node-label {
            color: #0e7490;
            background: rgba(15, 23, 42, 0.06);
            border-color: rgba(14, 116, 144, 0.45);
        }

        .theme-terminal {
            --theme-bg: #0a0a0a;
            --theme-panel: #171717;
            --theme-surface: #262626;
            --theme-border: #404040;
            --theme-text-main: #86efac;
            --theme-text-muted: #525252;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes grid-fade {
            0% {
                opacity: 0.05;
            }

            100% {
                opacity: 0.15;
            }
        }

        .animate-slide-in-right {
            animation: slideInRight 0.3s var(--ease) forwards;
        }

        .animate-fade-up {
            animation: fadeUp 0.3s var(--ease) forwards;
        }

        .animate-grid-fade {
            animation: grid-fade 2s ease-in-out infinite alternate;
        }

        .grid-overlay {
            background-image: linear-gradient(var(--theme-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--theme-border) 1px, transparent 1px);
            background-size: 11.11% 11.11%;
        }

        #connections-layer path.link-path {
            stroke-linecap: round;
            transition: stroke-opacity 0.3s var(--ease), stroke-width 0.3s var(--ease);
        }

        #connections-layer path.link-auto {
            stroke-dasharray: 4 8;
            animation: link-flow 8s linear infinite;
        }

        #connections-layer .link-arrow {
            pointer-events: none;
        }

        #connections-layer text.link-label {
            font-family: 'JetBrains Mono', monospace;
            paint-order: stroke;
            stroke: #0b1121;
            stroke-width: 0.6;
        }

        #connections-layer .link-morphism-icon {
            stroke: #0f172a;
            stroke-width: 0.4;
        }

        @keyframes link-flow {
            to {
                stroke-dashoffset: -40;
            }
        }

        .node-instance {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: grab;
            z-index: 20;
            transition: all 0.2s var(--ease);
        }

        .node-instance:active {
            cursor: grabbing;
        }

        .node-instance.selected {
            filter: drop-shadow(0 0 20px var(--theme-core));
        }

        .node-instance.struct-inactive {
            opacity: 0.6;
            filter: grayscale(0.3);
        }

        .node-instance.struct-inactive .node-label {
            opacity: 0.8;
        }

        .node-instance.story-incomplete {
            opacity: 0.4;
            filter: grayscale(0.5) blur(0.2px);
        }

        .node-instance.multi-selected::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 999px;
            border: 1px dashed rgba(56, 189, 248, 0.9);
            pointer-events: none;
        }

        .node-halo {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--theme-core) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s var(--ease);
            pointer-events: none;
        }

        .node-instance:hover .node-halo {
            opacity: 0.3;
        }

        .node-instance.selected .node-halo {
            opacity: 0.6;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.3;
            }
        }

        .tool-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border: 1px solid var(--theme-border);
            border-radius: 0.5rem;
            background: var(--theme-surface);
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }

        .tool-item:hover {
            background: var(--theme-panel);
            border-color: var(--theme-core);
            transform: translateX(4px);
        }

        .nav-tab {
            transition: all 0.2s var(--ease);
        }

        .nav-tab.active {
            background: var(--theme-core);
            color: var(--theme-bg);
        }

        .theme-btn.active {
            background: var(--theme-core);
            color: var(--theme-bg);
        }

        .toast {
            background: var(--theme-surface);
            border: 1px solid var(--theme-border);
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: opacity 0.3s var(--ease);
        }

        .grid-cell {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }

        .grid-cell:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .grid-cell.focus {
            background: var(--grid-focus-bg, rgba(59, 130, 246, 0.1));
            border-color: var(--grid-focus-border, rgba(59, 130, 246, 0.3));
        }

        .grid-cell.neighbor {
            background: var(--grid-neighbor-bg, rgba(96, 165, 250, 0.06));
            border-color: var(--grid-neighbor-border, rgba(96, 165, 250, 0.35));
        }

        .log-entry {
            font-size: 0.75rem;
            padding: 0.5rem;
            border-bottom: 1px solid var(--theme-border);
            font-family: 'JetBrains Mono', monospace;
        }

        .log-success {
            color: #22c55e;
        }

        .log-info {
            color: #60a5fa;
        }

        .log-warn {
            color: #fbbf24;
        }

        .log-error {
            color: #f87171;
        }

        @media (max-width: 768px) {
            body,
            body.sidebar-collapsed,
            body.inspector-collapsed,
            body.sidebar-collapsed.inspector-collapsed,
            body.console-collapsed {
                grid-template-columns: 1fr;
                grid-template-rows: 64px auto auto auto auto;
                height: 100vh;
                height: 100dvh;
            }

            header {
                grid-column: 1 / -1;
                grid-row: 1;
            }

            main {
                grid-column: 1 / -1;
                grid-row: 2;
            }

            aside[data-panel="sidebar"] {
                grid-column: 1 / -1;
                grid-row: 3;
                max-height: 260px;
            }

            aside[data-panel="inspector"] {
                grid-column: 1 / -1;
                grid-row: 4;
                max-height: 260px;
            }

            [data-panel="console"] {
                grid-column: 1 / -1;
                grid-row: 5;
                max-height: 200px;
            }
        }
    </style>
</head>

<body class="theme-dark grid grid-cols-[288px_1fr_320px] grid-rows-[64px_1fr_200px] h-screen w-screen overflow-hidden">

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-80">
    </div>

    <!-- Header -->
    <header
        class="col-span-3 bg-[var(--theme-panel)] border-b border-[var(--theme-border)] flex items-center justify-between px-4">
        <div class="flex gap-2 bg-[var(--theme-surface)] p-1 rounded-lg">
            <button class="nav-tab active px-3 py-2 rounded-md text-xs font-medium transition-all"
                data-view="system">SYSTEM</button>
            <button
                class="nav-tab px-3 py-2 rounded-md text-xs font-medium text-[var(--theme-text-muted)] transition-all"
                data-view="story">STORY</button>
            <button
                class="nav-tab px-3 py-2 rounded-md text-xs font-medium text-[var(--theme-text-muted)] transition-all"
                data-view="preview">PREVIEW</button>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 text-[10px] text-[var(--theme-text-muted)]">
                <span class="uppercase tracking-wide">Scene</span>
                <select id="scene-picker"
                    class="bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded px-2 py-1 text-[10px] text-[var(--theme-text-main)] min-w-[140px]"></select>
                <button id="scene-export"
                    class="px-2 py-1 border border-[var(--theme-border)] rounded text-[10px] text-[var(--theme-text-muted)] hover:border-[var(--theme-core)]">
                    Sync
                </button>
            </div>
            <div class="flex items-center gap-2">
                <div class="flex gap-1 p-1 bg-[var(--theme-surface)] rounded-md">
                    <button class="theme-btn active px-2 py-1 rounded text-xs font-medium" data-theme="dark">DARK</button>
                    <button class="theme-btn px-2 py-1 rounded text-xs font-medium text-[var(--theme-text-muted)]"
                        data-theme="parchment">PARCH</button>
                    <button class="theme-btn px-2 py-1 rounded text-xs font-medium text-[var(--theme-text-muted)]"
                        data-theme="terminal">TERM</button>
                </div>
                <div class="flex gap-1 text-[10px] text-[var(--theme-text-muted)]">
                    <button title="Toggle Sidebar" onclick="LAYOUT.toggleSidebar()"
                        class="px-2 py-1 border border-[var(--theme-border)] rounded hover:border-[var(--theme-core)]">
                        <i class="fas fa-bars w-3 h-3"></i>
                    </button>
                    <button title="Toggle Inspector" onclick="LAYOUT.toggleInspector()"
                        class="px-2 py-1 border border-[var(--theme-border)] rounded hover:border-[var(--theme-core)]">
                        <i class="fas fa-eye w-3 h-3"></i>
                    </button>
                    <button title="Toggle Console" onclick="LAYOUT.toggleConsole()"
                        class="px-2 py-1 border border-[var(--theme-border)] rounded hover:border-[var(--theme-core)]">
                        <i class="fas fa-terminal w-3 h-3"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside data-panel="sidebar"
        class="bg-[var(--theme-panel)] border-r border-[var(--theme-border)] flex flex-col transition-all duration-300 overflow-y-auto">
        <div class="h-16 border-b border-[var(--theme-border)] flex items-center justify-between px-4">
            <div class="flex flex-col">
                <span class="font-bold text-lg text-[var(--theme-text-main)]">ONYX</span>
                <span class="text-[10px] text-[var(--theme-core)] uppercase tracking-wider">Storytelling System</span>
            </div>
            <button id="sidebar-toggle" onclick="LAYOUT.toggleSidebar()"
                class="text-[var(--theme-text-muted)] hover:text-[var(--theme-text-main)] text-xs border border-[var(--theme-border)] rounded px-1 py-0.5">
                <i class="fas fa-chevron-left w-3 h-3"></i>
            </button>
        </div>

        <div class="p-4 border-b border-[var(--theme-border)]">
            <div class="text-xs text-[var(--theme-text-muted)] uppercase tracking-wide mb-2">Natural Language</div>
            <input id="narrative-input" type="text"
                class="w-full bg-[var(--theme-bg)] border border-[var(--theme-border)] rounded-md p-2 text-xs text-[var(--theme-text-main)] font-mono"
                placeholder="Alice wants Wonderland">
            <div class="mt-2 flex gap-2">
                <button onclick="COMPILER.commit()"
                    class="flex-1 px-2 py-1 bg-[var(--theme-surface)] border border-[var(--theme-border)] rounded text-xs hover:border-[var(--theme-core)]">
                    <i class="fas fa-play w-3 h-3 mr-1"></i>Compile
                </button>
            </div>
        </div>

        <div class="p-2">
            <div class="text-xs text-[var(--theme-text-muted)] uppercase tracking-wide mb-2 px-2">Entity Palette</div>
            <div id="tools-list" class="flex flex-col gap-2"></div>
        </div>

        <div class="mt-auto p-4 border-t border-[var(--theme-border)]">
            <div class="text-xs text-[var(--theme-text-muted)] uppercase tracking-wide mb-2">Scenarios</div>
            <button onclick="COMPILER.loadScenario('heist')" class="tool-item w-full justify-center mb-2">
                <i class="fas fa-gem w-4 h-4"></i>
                <span>Heist</span>
            </button>
            <button onclick="COMPILER.loadScenario('romance')" class="tool-item w-full justify-center mb-2">
                <i class="fas fa-heart w-4 h-4"></i>
                <span>Romance</span>
            </button>
            <button onclick="PERSISTENCE.loadScenarioSeeds()" class="tool-item w-full justify-center" style="border-color: var(--theme-scene);">
                <i class="fas fa-database w-4 h-4" style="color: var(--theme-scene);"></i>
                <span style="color: var(--theme-scene);">Load 57 Seeds</span>
            </button>
        </div>
    </aside>

    <!-- Canvas -->
    <main id="onyx-main" class="relative bg-[var(--theme-bg)] overflow-hidden">
        <div id="grid-shell" class="absolute">
            <div class="absolute inset-0 animate-grid-fade opacity-10 pointer-events-none grid-overlay"></div>
            <div id="grid-lock" class="absolute inset-0 grid grid-cols-9 grid-rows-9 gap-0 p-0 z-10"></div>
            <div id="nodes-layer" class="absolute inset-0 z-20 pointer-events-none"></div>
            <svg id="connections-layer" class="absolute inset-0 pointer-events-none z-5"></svg>
            <div id="preview-content" class="absolute inset-0 hidden p-8 overflow-y-auto"></div>
            <div class="absolute bottom-4 left-4 text-[10px] text-cyan-500/60 font-mono">
                NODES: <span id="node-count">0</span> | LINKS: <span id="link-count">0</span>
            </div>
        </div>
        <div id="scene-fork-indicator"
            class="absolute top-3 right-4 px-2 py-1 rounded border border-[var(--theme-core)] bg-[var(--theme-surface)] text-[10px] uppercase tracking-wide text-[var(--theme-core)] shadow-lg hidden animate-pulse">
        </div>
    </main>

    <!-- Inspector -->
    <aside data-panel="inspector"
        class="bg-[var(--theme-panel)] border-l border-[var(--theme-border)] flex flex-col transition-all duration-300 overflow-y-auto">
        <div class="h-12 border-b border-[var(--theme-border)] flex items-center justify-between px-4">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div>
                <span class="font-bold text-sm text-[var(--theme-text-main)]">Inspector</span>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="LAYOUT.toggleInspector()"
                    class="text-[var(--theme-text-muted)] hover:text-white text-xs border border-[var(--theme-border)] rounded px-1 py-0.5">
                    <i class="fas fa-chevron-right w-3 h-3"></i>
                </button>
                <button onclick="INSPECTOR.close()" class="text-[var(--theme-text-muted)] hover:text-white">
                    <i class="fas fa-times w-4 h-4"></i>
                </button>
            </div>
        </div>
        <div id="inspector-content" class="flex-1 p-4">
            <div class="text-sm text-[var(--theme-text-muted)] text-center py-8">
                Select a node to inspect
            </div>
        </div>
        <div class="p-4 border-t border-[var(--theme-border)]">
            <button onclick="INSPECTOR.delete()"
                class="w-full py-3 bg-red-500/20 text-red-500 border border-red-500 rounded-md text-xs font-bold uppercase">
                DELETE ENTITY
            </button>
        </div>
    </aside>

    <!-- Console -->
    <div data-panel="console"
        class="col-span-3 bg-[var(--theme-panel)] border-t border-[var(--theme-border)] transition-all duration-300">
        <div id="console-header"
            class="h-8 bg-[var(--theme-surface)] flex items-center justify-between px-4 cursor-pointer"
            onclick="CONSOLE.toggle()">
            <div class="flex items-center gap-2 text-xs text-[var(--theme-text-muted)] font-bold">
                <i class="fas fa-terminal w-3 h-3"></i>
                <span>SYSTEM CONSOLE</span>
            </div>
            <i id="console-toggle-icon" class="fas fa-chevron-down w-3 h-3 text-slate-400"></i>
        </div>
        <div id="console-content" class="h-[calc(100%-2rem)] overflow-y-auto p-2"></div>
    </div>

    <script>
        console.log('[ONYX] main script loaded');
        // =========================================
        // STATE MANAGEMENT
        // =========================================
        const STATE = {
            nodes: [],
            links: [],
            selectedNodeId: null,
            multiSelectedIds: [],
            collapsedContainers: [],
            viewMode: 'system',
            theme: 'dark',
            draggedNodeId: null,
            lastX: 0,
            lastY: 0,
            sceneMeta: null,
            sidebarCollapsed: false,
            inspectorCollapsed: false,
            consoleCollapsed: false,
            showLinkNames: true
        };

        // =========================================
        // GRID HELPERS
        // =========================================
        const GRID = {
            center(col, row) {
                const step = 100 / 9;
                const x = (col + 0.5) * step;
                const y = (row + 0.5) * step;
                return { x, y, row, col, cellIndex: row * 9 + col };
            },
            snap(x, y) {
                const step = 100 / 9;
                const col = Math.max(0, Math.min(8, Math.round(x / step - 0.5)));
                const row = Math.max(0, Math.min(8, Math.round(y / step - 0.5)));
                return this.center(col, row);
            },

            highlightNeighborhood(node) {
                const gridEl = document.getElementById('grid-lock');
                if (!gridEl) return;

                const cells = gridEl.querySelectorAll('.grid-cell');
                cells.forEach(c => {
                    c.classList.remove('focus');
                    c.classList.remove('neighbor');
                });

                if (!node) return;

                const root = document.documentElement;
                let focusBg = 'rgba(59, 130, 246, 0.1)';
                let focusBorder = 'rgba(59, 130, 246, 0.3)';
                let neighBg = 'rgba(96, 165, 250, 0.06)';
                let neighBorder = 'rgba(96, 165, 250, 0.35)';

                if (node.icon === 'Scene') {
                    focusBg = 'rgba(192, 132, 252, 0.12)';
                    focusBorder = 'rgba(192, 132, 252, 0.5)';
                    neighBg = 'rgba(192, 132, 252, 0.06)';
                    neighBorder = 'rgba(192, 132, 252, 0.35)';
                } else if (node.icon === 'Timepoint') {
                    focusBg = 'rgba(56, 189, 248, 0.12)';
                    focusBorder = 'rgba(56, 189, 248, 0.5)';
                    neighBg = 'rgba(56, 189, 248, 0.06)';
                    neighBorder = 'rgba(56, 189, 248, 0.35)';
                } else if (node.icon === 'Location') {
                    focusBg = 'rgba(168, 85, 247, 0.12)';
                    focusBorder = 'rgba(168, 85, 247, 0.5)';
                    neighBg = 'rgba(168, 85, 247, 0.06)';
                    neighBorder = 'rgba(168, 85, 247, 0.35)';
                } else if (node.icon === 'Story') {
                    focusBg = 'rgba(244, 114, 182, 0.12)';
                    focusBorder = 'rgba(244, 114, 182, 0.5)';
                    neighBg = 'rgba(244, 114, 182, 0.06)';
                    neighBorder = 'rgba(244, 114, 182, 0.35)';
                } else if (node.icon === 'Core') {
                    focusBg = 'rgba(250, 204, 21, 0.16)';
                    focusBorder = 'rgba(250, 204, 21, 0.6)';
                    neighBg = 'rgba(250, 204, 21, 0.08)';
                    neighBorder = 'rgba(250, 204, 21, 0.4)';
                } else if (node.icon === 'Goal') {
                    focusBg = 'rgba(74, 222, 128, 0.16)';
                    focusBorder = 'rgba(74, 222, 128, 0.6)';
                    neighBg = 'rgba(74, 222, 128, 0.08)';
                    neighBorder = 'rgba(74, 222, 128, 0.4)';
                } else if (node.icon === 'Obstacle') {
                    focusBg = 'rgba(248, 113, 113, 0.16)';
                    focusBorder = 'rgba(248, 113, 113, 0.6)';
                    neighBg = 'rgba(248, 113, 113, 0.08)';
                    neighBorder = 'rgba(248, 113, 113, 0.4)';
                }

                root.style.setProperty('--grid-focus-bg', focusBg);
                root.style.setProperty('--grid-focus-border', focusBorder);
                root.style.setProperty('--grid-neighbor-bg', neighBg);
                root.style.setProperty('--grid-neighbor-border', neighBorder);

                const pos = this.snap(node.x, node.y);
                const baseRow = pos.row;
                const baseCol = pos.col;
                const baseIdx = pos.cellIndex;

                if (cells[baseIdx]) {
                    cells[baseIdx].classList.add('focus');
                }

                for (let r = baseRow - 1; r <= baseRow + 1; r++) {
                    for (let c = baseCol - 1; c <= baseCol + 1; c++) {
                        if (r < 0 || r > 8 || c < 0 || c > 8) continue;
                        if (r === baseRow && c === baseCol) continue;
                        const idx = r * 9 + c;
                        if (cells[idx]) {
                            cells[idx].classList.add('neighbor');
                        }
                    }
                }
            }
        };

        // =========================================
        // ICONS
        // =========================================
        const ICONS = {
            getIsoCube(color = "blue", opacity = 1) {
                const colors = {
                    blue: { top: '#60a5fa', left: '#3b82f6', right: '#2563eb' },
                    yellow: { top: '#fcd34d', left: '#f59e0b', right: '#d97706' },
                    cyan: { top: '#22d3ee', left: '#06b6d4', right: '#0891b2' },
                    purple: { top: '#e879f9', left: '#c026d3', right: '#a21caf' },
                    green: { top: '#4ade80', left: '#16a34a', right: '#15803d' },
                    red: { top: '#f87171', left: '#ef4444', right: '#dc2626' }
                };
                const c = colors[color] || colors.blue;
                return `
                <svg viewBox="0 0 40 40" class="w-full h-full drop-shadow-lg" style="opacity: ${opacity}">
                    <path d="M20 4 L36 12 L20 20 L4 12 Z" fill="${c.top}" stroke="#1e293b" stroke-width="1" />
                    <path d="M4 12 L20 20 L20 38 L4 30 Z" fill="${c.left}" stroke="#1e293b" stroke-width="1" />
                    <path d="M36 12 L20 20 L20 38 L36 30 Z" fill="${c.right}" stroke="#1e293b" stroke-width="1" />
                </svg>`;
            },

            Entity: () => ICONS.getIsoCube('blue'),
            Core: () => ICONS.getIsoCube('yellow'),
            Goal: () => `<div class="relative w-full h-full">${ICONS.getIsoCube('green')}<div class="absolute -top-2 left-1/2 transform -translate-x-1/2 text-yellow-400 animate-pulse"><i class="fas fa-bullseye"></i></div></div>`,
            Obstacle: () => `<div class="relative w-full h-full">${ICONS.getIsoCube('red')}<div class="absolute right-0 top-1/2 transform -translate-y-1/2 w-0.5 h-full bg-red-400"></div></div>`,
            Morphism: () => `<div class="relative w-full h-full flex items-center justify-between px-1"><div class="w-4 h-4">${ICONS.getIsoCube('cyan')}</div><div class="flex-1 h-0.5 bg-cyan-400 mx-1 relative"><div class="absolute right-0 -top-1 w-0 h-0 border-l-4 border-l-cyan-400 border-t-2 border-t-transparent border-b-2 border-b-transparent"></div></div><div class="w-4 h-4">${ICONS.getIsoCube('cyan')}</div></div>`,
            Shift: () => `<div class="relative w-full h-full flex items-center justify-center"><div class="w-5 h-5 opacity-50">${ICONS.getIsoCube('cyan')}</div><div class="absolute z-10 text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.8)]"><i class="fas fa-bolt w-5 h-5 fill-current"></i></div><div class="w-5 h-5 opacity-50">${ICONS.getIsoCube('cyan')}</div></div>`,
            Location: () => `<div class="relative w-full h-full flex items-center justify-center"><div class="absolute top-0 right-0 w-4 h-4">${ICONS.getIsoCube('purple')}</div><div class="absolute bottom-0 left-0 w-4 h-4">${ICONS.getIsoCube('purple')}</div><svg class="absolute inset-0 w-full h-full pointer-events-none"><path d="M14 26 C 14 26, 20 20, 26 14" stroke="#c084fc" stroke-width="2" fill="none" stroke-linecap="round" /><polygon points="26 14, 22 15, 25 18" fill="#c084fc" /></svg></div>`,
            Timepoint: () => `<div class="relative w-full h-full flex items-center justify-center"><div class="w-3/4 h-3/4">${ICONS.getIsoCube('cyan')}</div><div class="absolute -right-1 -bottom-1 w-5 h-5 bg-[#0f172a] rounded-full border border-cyan-500 flex items-center justify-center"><i class="fas fa-clock w-3 h-3 text-cyan-400"></i></div></div>`,
            Scene: () => `<div class="relative w-full h-full flex items-center justify-center p-1"><div class="absolute top-0 left-0 w-2 h-2 border-l-2 border-t-2 border-purple-400"></div><div class="absolute top-0 right-0 w-2 h-2 border-r-2 border-t-2 border-purple-400"></div><div class="absolute bottom-0 left-0 w-2 h-2 border-l-2 border-b-2 border-purple-400"></div><div class="absolute bottom-0 right-0 w-2 h-2 border-r-2 border-b-2 border-purple-400"></div><div class="flex gap-0.5"><div class="w-3 h-3">${ICONS.getIsoCube('purple', 0.7)}</div><div class="w-3 h-3">${ICONS.getIsoCube('purple', 0.7)}</div></div></div>`,
            Story: () => `<div class="relative w-full h-full flex flex-col items-center justify-start pt-1"><div class="w-4 h-4 z-10">${ICONS.getIsoCube('purple')}</div><div class="w-0.5 h-2 bg-purple-500/50"></div><div class="w-full h-0.5 bg-purple-500/50 relative"><div class="absolute left-0 bottom-0 w-0.5 h-2 bg-purple-500/50 transform translate-y-full"></div><div class="absolute right-0 bottom-0 w-0.5 h-2 bg-purple-500/50 transform translate-y-full"></div><div class="absolute left-1/2 bottom-0 w-0.5 h-2 bg-purple-500/50 transform translate-y-full -translate-x-1/2"></div></div><div class="flex gap-1 mt-2"><div class="w-2.5 h-2.5">${ICONS.getIsoCube('cyan', 0.6)}</div><div class="w-2.5 h-2.5">${ICONS.getIsoCube('cyan', 0.6)}</div><div class="w-2.5 h-2.5">${ICONS.getIsoCube('cyan', 0.6)}</div></div></div>`
        };

        // =========================================
        // COMPILER
        // =========================================
        const COMPILER = {
            commit() {
                const input = document.getElementById('narrative-input');
                const cmd = input.value.trim();
                if (!cmd) return;

                // Commands: "make Alice Goal", "set Castle as Location"
                const typeCmd = cmd.match(/^(make|set)\s+(.+?)\s+(as\s+)?(Entity|Core|Goal|Obstacle|Morphism|Shift|Location|Timepoint|Scene|Story)$/i);
                if (typeCmd) {
                    const name = typeCmd[2].trim();
                    const typeLabel = typeCmd[4];
                    this.setTypeByName(name, typeLabel);
                    input.value = '';
                    return;
                }

                // Commands: "Alice has goal Escape", "give Alice goal Escape"
                const goalCmd = cmd.match(/^(.+?)\s+has\s+goal\s+(.+)/i) || cmd.match(/^(give|set)\s+(.+?)\s+goal\s+(.+)/i);
                if (goalCmd) {
                    let subject, object;
                    if (goalCmd.length === 3) {
                        subject = goalCmd[1].trim();
                        object = goalCmd[2].trim();
                    } else {
                        subject = goalCmd[2].trim();
                        object = goalCmd[3].trim();
                    }
                    this.decompose(subject, 'wants', object);
                    input.value = '';
                    return;
                }

                // Commands: "attach Alice to location Castle", "place Alice in Castle"
                const locCmd = cmd.match(/^attach\s+(.+?)\s+to\s+location\s+(.+)/i) || cmd.match(/^place\s+(.+?)\s+in\s+(.+)/i);
                if (locCmd) {
                    const subject = locCmd[1].trim();
                    const place = locCmd[2].trim();
                    const subId = this.findOrSpawn(subject, 'Entity');
                    const locId = this.findOrSpawn(place, 'Location');

                    if (!STATE.links.find(l => l.from === subId && l.to === locId && l.type === 'inside')) {
                        STATE.links.push({ from: subId, to: locId, type: 'inside' });
                    }

                    RENDERER.connections();
                    PERSISTENCE.save();
                    LOG.toast(`Placed ${subject} in ${place}`);
                    input.value = '';
                    return;
                }

                // Composite scene pattern: "X wants Y but Z"
                const scenePattern = /(.+?)\s+wants\s+(.+?)\s+but\s+(.+)/i;
                const sceneMatch = cmd.match(scenePattern);
                if (sceneMatch) {
                    const [, who, goalLabel, obstacleLabel] = sceneMatch;
                    const entityId = this.findOrSpawn(who.trim(), 'Entity');
                    const goalId = this.findOrSpawn(goalLabel.trim(), 'Goal');
                    const obstacleId = this.findOrSpawn(obstacleLabel.trim(), 'Obstacle');

                    // Desire and conflict links
                    if (!STATE.links.find(l => l.from === entityId && l.to === goalId && l.type === 'desire')) {
                        STATE.links.push({ from: entityId, to: goalId, type: 'desire' });
                    }
                    if (!STATE.links.find(l => l.from === obstacleId && l.to === entityId && l.type === 'conflict')) {
                        STATE.links.push({ from: obstacleId, to: entityId, type: 'conflict' });
                    }

                    // Structural Scene beat containing E/G/O
                    const sceneLabel = `Scene · ${who.trim()} vs ${obstacleLabel.trim()}`;
                    const sceneId = this.spawnNode('Scene', sceneLabel);

                    [entityId, goalId, obstacleId].forEach(id => {
                        if (!STATE.links.find(l => l.from === id && l.to === sceneId && l.type === 'inside')) {
                            STATE.links.push({ from: id, to: sceneId, type: 'inside' });
                        }
                    });

                    RENDERER.nodes();
                    RENDERER.connections();
                    PERSISTENCE.save();
                    LOG.toast('Scene created with Entity/Goal/Obstacle');
                    input.value = '';
                    return;
                }

                // Parse natural language: "A wants B" / "A opposes B" / "A becomes B"
                const regex = /(.+?)\s+(wants|opposes|becomes|is inside)\s+(.+)/i;
                const match = cmd.match(regex);

                if (match) {
                    const [_, subject, relation, object] = match;
                    this.decompose(subject, relation, object);
                } else {
                    // Fallback: spawn entity
                    this.spawnNode('Entity', cmd);
                }

                input.value = '';
            },

            setTypeByName(name, typeLabel) {
                const canonical = typeLabel.charAt(0).toUpperCase() + typeLabel.slice(1).toLowerCase();
                const node = STATE.nodes.find(n => n.label.toLowerCase() === name.toLowerCase());

                if (node) {
                    node.type = canonical.toLowerCase();
                    node.icon = canonical;
                    RENDERER.nodes();
                    PERSISTENCE.save();
                    LOG.toast(`Set ${node.label} as ${canonical}`);
                } else {
                    this.spawnNode(canonical, name);
                    LOG.toast(`Created ${canonical} "${name}"`);
                }
            },

            decompose(subName, rel, objName) {
                const subId = this.findOrSpawn(subName, 'Entity');

                let objType = 'Entity';
                if (rel === 'wants') objType = 'Goal';
                if (rel === 'opposes') objType = 'Obstacle';
                if (rel === 'is inside') objType = 'Location';

                const objId = this.findOrSpawn(objName, objType);

                // Create link
                let type = 'morphism';
                if (rel === 'wants') type = 'desire';
                if (rel === 'opposes') type = 'conflict';
                if (rel === 'is inside') type = 'inside';
                if (rel === 'becomes') type = 'shift';

                if (!STATE.links.find(l => l.from === subId && l.to === objId)) {
                    STATE.links.push({ from: subId, to: objId, type });
                }

                RENDERER.connections();
                PERSISTENCE.save();
                LOG.info(`Linked: ${subName} → ${objName}`);
            },

            findOrSpawn(name, type) {
                const existing = STATE.nodes.find(n => n.label.toLowerCase() === name.toLowerCase());
                if (existing) return existing.id;
                return this.spawnNode(type, name);
            },

            spawnNode(type, label) {
                const id = Date.now() + Math.random();

                // Smart placement: find non-overlapping position
                let attempts = 0;
                let snapped;
                do {
                    const jitterX = 50 + (Math.random() * 40 - 20);
                    const jitterY = 50 + (Math.random() * 40 - 20);
                    snapped = GRID.snap(jitterX, jitterY);
                    attempts++;
                } while (this.hasCollision(snapped) && attempts < 50);

                const newNode = {
                    id,
                    type: type.toLowerCase(),
                    icon: type,
                    label: label || type,
                    x: snapped.x,
                    y: snapped.y
                };

                if (type === 'Timepoint') {
                    newNode.time = '';
                }

                if (type === 'Location') {
                    newNode.lat = null;
                    newNode.lng = null;
                }

                STATE.nodes.push(newNode);

                // Auto-Core: every new Scene gets a Core child that carries its name
                if (type === 'Scene') {
                    const coreLabel = newNode.label || 'Scene';
                    const coreId = Date.now() + Math.random();
                    const snapped = GRID.snap(newNode.x, newNode.y);
                    const step = 100 / 9;
                    const coreNode = {
                        id: coreId,
                        type: 'core',
                        icon: 'Core',
                        label: coreLabel,
                        x: snapped.x - step * 0.25,
                        y: snapped.y - step * 0.25
                    };
                    STATE.nodes.push(coreNode);
                    if (!STATE.links.some(l => l.from === coreId && l.to === id && l.type === 'inside')) {
                        STATE.links.push({ from: coreId, to: id, type: 'inside' });
                    }
                }

                RENDERER.nodes();
                RENDERER.connections();
                PERSISTENCE.save();

                return id;
            },

            hasCollision(pos) {
                // Check if position is occupied (within same grid cell)
                return STATE.nodes.some(node => {
                    const nodeCellX = Math.round(node.x / (100 / 9));
                    const nodeCellY = Math.round(node.y / (100 / 9));
                    const posCellX = Math.round(pos.x / (100 / 9));
                    const posCellY = Math.round(pos.y / (100 / 9));
                    return nodeCellX === posCellX && nodeCellY === posCellY;
                });
            },

            loadScenario(type) {
                STATE.nodes = [];
                STATE.links = [];

                if (type === 'heist') {
                    this.decompose('The Crew', 'wants', 'The Diamond');
                    this.decompose('The Guards', 'opposes', 'The Crew');
                    this.decompose('The Vault', 'is inside', 'The Bank');
                } else if (type === 'romance') {
                    this.decompose('Romeo', 'wants', 'Juliet');
                    this.decompose('Tybalt', 'opposes', 'Romeo');
                    this.decompose('Fate', 'opposes', 'Romeo');
                }

                if (STATE.viewMode === 'story') {
                    VIEW_MODE.arrangeAsTree();
                }

                LOG.success(`Loaded ${type} scenario`);
            }
        };

        // =========================================
        // RENDERER
        // =========================================
        const RENDERER = {
            slotStatus(node) {
                const slots = { E: false, C: false, G: false, O: false };
                if (node.icon !== 'Scene' && node.icon !== 'Story') return slots;

                const relatedIds = new Set();

                STATE.links.forEach(link => {
                    if (link.from === node.id) relatedIds.add(link.to);
                    if (link.to === node.id) relatedIds.add(link.from);
                });

                if (node.icon === 'Story') {
                    const sceneIds = new Set();
                    STATE.links.forEach(link => {
                        if (link.from === node.id || link.to === node.id) {
                            const otherId = link.from === node.id ? link.to : link.from;
                            const other = STATE.nodes.find(n => n.id === otherId);
                            if (other && other.icon === 'Scene') {
                                sceneIds.add(otherId);
                            }
                        }
                    });

                    if (sceneIds.size) {
                        STATE.links.forEach(link => {
                            if (sceneIds.has(link.from)) relatedIds.add(link.to);
                            if (sceneIds.has(link.to)) relatedIds.add(link.from);
                        });
                    }
                }

                relatedIds.forEach(id => {
                    const n = STATE.nodes.find(x => x.id === id);
                    if (!n) return;
                    if (n.icon === 'Entity') slots.E = true;
                    else if (n.icon === 'Core') slots.C = true;
                    else if (n.icon === 'Goal') slots.G = true;
                    else if (n.icon === 'Obstacle') slots.O = true;
                });

                return slots;
            },

            nodes() {
                const container = document.getElementById('nodes-layer');

                // Compute nodes hidden by collapsed containers (Scenes/Stories)
                const collapsedSet = new Set(STATE.collapsedContainers || []);
                const childrenByParent = {};
                STATE.links.forEach(link => {
                    if (link.type === 'inside') {
                        if (!childrenByParent[link.to]) childrenByParent[link.to] = [];
                        childrenByParent[link.to].push(link.from);
                    }
                });
                const hidden = new Set();
                const isContainerId = (id) => {
                    const n = STATE.nodes.find(x => x.id === id);
                    return n && (n.icon === 'Scene' || n.icon === 'Story');
                };
                const markHiddenFrom = (cid) => {
                    const kids = childrenByParent[cid];
                    if (!kids) return;
                    kids.forEach(childId => {
                        if (hidden.has(childId)) return;
                        hidden.add(childId);
                        if (isContainerId(childId)) markHiddenFrom(childId);
                    });
                };
                collapsedSet.forEach(id => markHiddenFrom(id));

                container.innerHTML = STATE.nodes.map(node => {
                    if (hidden.has(node.id)) return '';
                    const isSelected = STATE.selectedNodeId === node.id;
                    const isMulti = STATE.multiSelectedIds && STATE.multiSelectedIds.includes(node.id);
                    const iconFn = ICONS[node.icon] || ICONS.Entity;
                    const slots = this.slotStatus(node);
                    const showSlots = node.icon === 'Scene' || node.icon === 'Story';
                    const slotCount = (slots.E ? 1 : 0) + (slots.C ? 1 : 0) + (slots.G ? 1 : 0) + (slots.O ? 1 : 0);
                    const isScene = node.icon === 'Scene';
                    const isStory = node.icon === 'Story';
                    let displayLabel = node.label;
                    if (isScene || isStory) {
                        for (const link of STATE.links) {
                            if (link.type === 'inside' && link.to === node.id) {
                                const child = STATE.nodes.find(x => x.id === link.from);
                                if (child && child.icon === 'Core' && child.label) {
                                    displayLabel = child.label;
                                    break;
                                }
                            }
                        }
                    }
                    const inactiveScene = isScene && slotCount < 2;
                    const inactiveStory = isStory && slotCount < 4;
                    const isStoryMode = STATE.viewMode === 'story';
                    const incompleteClass = (isStoryMode && (inactiveScene || inactiveStory)) ? ' story-incomplete' : '';
                    const extraClass = (inactiveScene || inactiveStory) ? ' struct-inactive' + incompleteClass : '';
                    const slotBadge = showSlots ? `
                        <div class="absolute -top-5 left-1/2 transform -translate-x-1/2 flex gap-1">
                            <span class="w-2 h-2 rounded-full border border-sky-400" style="background-color: rgba(56,189,248,${slots.E ? 1 : 0.15});"></span>
                            <span class="w-2 h-2 rounded-full border border-amber-300" style="background-color: rgba(252,211,77,${slots.C ? 1 : 0.15});"></span>
                            <span class="w-2 h-2 rounded-full border border-emerald-300" style="background-color: rgba(52,211,153,${slots.G ? 1 : 0.15});"></span>
                            <span class="w-2 h-2 rounded-full border border-rose-300" style="background-color: rgba(248,113,113,${slots.O ? 1 : 0.15});"></span>
                        </div>
                    ` : '';
                    return `
                    <div class="node-instance ${isSelected ? 'selected' : ''}${extraClass}${isMulti ? ' multi-selected' : ''}" 
                         style="left: ${node.x}%; top: ${node.y}%; pointer-events: auto;"
                         data-node-id="${node.id}"
                         onmousedown="EVENTS.startDrag(event, ${node.id})"
                         ontouchstart="EVENTS.startDrag(event, ${node.id})"
                         onclick="EVENTS.handleClick(event, ${node.id})"
                         ondblclick="INSPECTOR.selectAndFocus(${node.id})"
                         oncontextmenu="INSPECTOR.onContextMenu(event, ${node.id})">
                        <div class="node-halo"></div>
                        <div class="w-16 h-16 drop-shadow-2xl">
                            ${iconFn()}
                        </div>
                        ${slotBadge}
                        <div class="node-label absolute -bottom-6 left-1/2 transform -translate-x-1/2 whitespace-nowrap px-2 py-0.5 bg-[var(--theme-panel)]/90 border border-cyan-500/30 rounded text-[10px] text-cyan-400 pointer-events-none">
                            ${displayLabel}
                        </div>
                    </div>`;
                }).join('');

                document.getElementById('node-count').textContent = STATE.nodes.length;
                document.getElementById('link-count').textContent = STATE.links.length;
            },

            connections() {
                const svg = document.getElementById('connections-layer');
                if (!svg) return;

                svg.setAttribute('viewBox', '0 0 100 100');
                svg.setAttribute('preserveAspectRatio', 'none');
                svg.innerHTML = '';

                // Compute nodes hidden by collapsed containers to avoid drawing links to them
                const collapsedSet = new Set(STATE.collapsedContainers || []);
                const childrenByParent = {};
                STATE.links.forEach(link => {
                    if (link.type === 'inside') {
                        if (!childrenByParent[link.to]) childrenByParent[link.to] = [];
                        childrenByParent[link.to].push(link.from);
                    }
                });
                const hidden = new Set();
                const isContainerId = (id) => {
                    const n = STATE.nodes.find(x => x.id === id);
                    return n && (n.icon === 'Scene' || n.icon === 'Story');
                };
                const markHiddenFrom = (cid) => {
                    const kids = childrenByParent[cid];
                    if (!kids) return;
                    kids.forEach(childId => {
                        if (hidden.has(childId)) return;
                        hidden.add(childId);
                        if (isContainerId(childId)) markHiddenFrom(childId);
                    });
                };
                collapsedSet.forEach(id => markHiddenFrom(id));

                STATE.links.forEach(link => {
                    if (hidden.has(link.from) || hidden.has(link.to)) return;
                    const n1 = STATE.nodes.find(n => n.id === link.from);
                    const n2 = STATE.nodes.find(n => n.id === link.to);
                    if (!n1 || !n2) return;

                    const p1 = GRID.snap(n1.x, n1.y);
                    const p2 = GRID.snap(n2.x, n2.y);

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');

                    const midX = (p1.x + p2.x) / 2;
                    let midY = (p1.y + p2.y) / 2 - 10;
                    const isSceneLike = (n1.icon === 'Scene' || n2.icon === 'Scene' || n1.icon === 'Story' || n2.icon === 'Story' || n1.icon === 'Location' || n2.icon === 'Location' || n1.icon === 'Timepoint' || n2.icon === 'Timepoint');
                    if (link.type === 'inside' && isSceneLike) {
                        midY = (p1.y + p2.y) / 2 - 3;
                    }

                    const cx = midX;
                    const cy = midY;
                    const d = `M ${p1.x} ${p1.y} Q ${cx} ${cy} ${p2.x} ${p2.y}`;

                    path.setAttribute('d', d);

                    const isAuto = !!link.auto;
                    let color = '#64748b';
                    let width = isAuto ? 0.8 : 1.3;
                    let opacity = isAuto ? 0.25 : 0.45;
                    let className = 'link-path';

                    if (link.type === 'desire') {
                        color = '#fcd34d';
                        width = 1.6;
                        opacity = 0.85;
                    } else if (link.type === 'conflict') {
                        color = '#f87171';
                        width = 1.6;
                        opacity = 0.85;
                    } else if (link.type === 'inside') {
                        color = '#a855f7';
                        width = 1.4;
                        opacity = 0.7;
                    } else if (link.type === 'shift') {
                        color = '#22c55e';
                        width = 1.5;
                        opacity = 0.8;
                    } else if (link.type === 'morphism') {
                        let base = '#38bdf8';
                        if (n1.icon === 'Entity') base = '#38bdf8';
                        else if (n1.icon === 'Core') base = '#fbbf24';
                        else if (n1.icon === 'Goal') base = '#22c55e';
                        else if (n1.icon === 'Obstacle') base = '#f97373';
                        else if (n1.icon === 'Scene') base = '#c084fc';
                        else if (n1.icon === 'Story') base = '#e879f9';
                        else if (n1.icon === 'Location' || n1.icon === 'Timepoint') base = '#a855f7';

                        color = base;
                        width = isAuto ? 1.0 : 1.4;
                        opacity = isAuto ? 0.35 : 0.7;
                        if (isAuto) className += ' link-auto';
                    }

                    path.setAttribute('stroke', color);
                    path.setAttribute('stroke-width', String(width));
                    path.setAttribute('stroke-opacity', String(opacity));
                    path.setAttribute('fill', 'none');
                    path.setAttribute('class', className);

                    if (link.type === 'morphism') {
                        path.setAttribute('stroke-dasharray', isAuto ? '4 8' : '4 2');
                    }

                    svg.appendChild(path);

                    const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const angle = Math.atan2(p2.y - cy, p2.x - cx);
                    const size = 2.5;
                    const ax = p2.x;
                    const ay = p2.y;
                    const x1 = ax - size * Math.cos(angle - Math.PI / 6);
                    const y1 = ay - size * Math.sin(angle - Math.PI / 6);
                    const x2 = ax - size * Math.cos(angle + Math.PI / 6);
                    const y2 = ay - size * Math.sin(angle + Math.PI / 6);
                    const ad = `M ${ax} ${ay} L ${x1} ${y1} L ${x2} ${y2} Z`;
                    arrow.setAttribute('d', ad);
                    arrow.setAttribute('fill', color);
                    arrow.setAttribute('fill-opacity', opacity);
                    arrow.setAttribute('class', 'link-arrow');
                    svg.appendChild(arrow);
                });

            preview() {

        // =========================================

        const VIEW_MODE = {

                document.getElementById('preview-content').style.display = mode === 'preview' ? 'block' : 'none';

                if (mode === 'story') {
                    this.arrangeAsTree();

                    RENDERER.preview();
                }

                RENDERER.connections();
                LOG.toast(`Switched to ${mode.toUpperCase()} view`);

            arrangeAsTree() {
                // Simple tree layout, with STORY-mode bias toward scenes/time/space
                const scenes = STATE.nodes.filter(n => n.icon === 'Scene');

                // If there are no scenes yet, fall back to legacy core-centric layout
                if (!scenes.length) {
                    const core = STATE.nodes.find(n => n.type === 'core');
                    if (core) {
                        const pos = GRID.center(4, 1);
                        core.x = pos.x;
                        core.y = pos.y;
                    }

                    const others = STATE.nodes.filter(n => n.type !== 'core');
                    const cols = [1, 3, 5, 7];
                    others.forEach((n, i) => {
                        const pos = GRID.center(cols[i % cols.length], 3 + Math.floor(i / cols.length) * 2);
                        n.x = pos.x;
                        n.y = pos.y;
                    });

                    RENDERER.nodes();
                    RENDERER.connections();
                    return;
                }

                const stories = STATE.nodes.filter(n => n.icon === 'Story');
                const timepoints = STATE.nodes.filter(n => n.icon === 'Timepoint');
                const locations = STATE.nodes.filter(n => n.icon === 'Location');

                // Sort scenes in story order: left-to-right by current grid column, then by row
                scenes.sort((a, b) => {
                    const sa = GRID.snap(a.x, a.y);
                    const sb = GRID.snap(b.x, b.y);
                    if (sa.col !== sb.col) return sa.col - sb.col;
                    return sa.row - sb.row;
                });

                const beatCols = [1, 3, 5, 7];

                // Place scenes as beats across rows 4, 6, 8
                scenes.forEach((scene, i) => {
                    const col = beatCols[i % beatCols.length];
                    const row = 4 + 2 * Math.floor(i / beatCols.length); // 4, 6, 8
                    const safeRow = Math.min(row, 8);
                    const pos = GRID.center(col, safeRow);
                    scene.x = pos.x;
                    scene.y = pos.y;
                });

                // Helper to get average column from a set of node ids
                const avgColForIds = (ids) => {
                    let sum = 0;
                    let count = 0;
                    ids.forEach(id => {
                        const n = STATE.nodes.find(x => x.id === id);
                        if (!n) return;
                        const snap = GRID.snap(n.x, n.y);
                        sum += snap.col;
                        count += 1;
                    });
                    if (!count) return 4; // center
                    return Math.round(sum / count);
                };

                // Place stories above their attached scenes (row 1)
                stories.forEach(story => {
                    const sceneIds = new Set();
                    STATE.links.forEach(link => {
                        if (link.from === story.id || link.to === story.id) {
                            const otherId = link.from === story.id ? link.to : link.from;
                            const other = STATE.nodes.find(n => n.id === otherId);
                            if (other && other.icon === 'Scene') {
                                sceneIds.add(otherId);
                            }
                        }
                    });

                    const colIdx = avgColForIds(sceneIds);
                    const pos = GRID.center(colIdx, 1);
                    story.x = pos.x;
                    story.y = pos.y;
                });

                // Timepoints: align to lanes above nearest/linked scene (row 2)
                timepoints.forEach(tp => {
                    let hostScene = null;
                    let linkedSceneIds = new Set();

                    STATE.links.forEach(link => {
                        if (link.from === tp.id || link.to === tp.id) {
                            const otherId = link.from === tp.id ? link.to : link.from;
                            const other = STATE.nodes.find(n => n.id === otherId);
                            if (other && other.icon === 'Scene') {
                                linkedSceneIds.add(otherId);
                            }
                        }
                    });

                    if (linkedSceneIds.size) {
                        const colIdx = avgColForIds(linkedSceneIds);
                        const pos = GRID.center(colIdx, 2);
                        tp.x = pos.x;
                        tp.y = pos.y;
                    } else if (scenes.length) {
                        // Fallback: attach to closest scene by column
                        let best = scenes[0];
                        let bestDist = Infinity;
                        const tpSnap = GRID.snap(tp.x, tp.y);
                        scenes.forEach(scene => {
                            const sSnap = GRID.snap(scene.x, scene.y);
                            const dist = Math.abs(sSnap.col - tpSnap.col);
                            if (dist < bestDist) {
                                bestDist = dist;
                                best = scene;
                            }
                        });
                        const sSnap = GRID.snap(best.x, best.y);
                        const pos = GRID.center(sSnap.col, 2);
                        tp.x = pos.x;
                        tp.y = pos.y;
                    }
                });

                // Locations: align just below timepoints / above scenes (row 3)
                locations.forEach(loc => {
                    let hostSceneIds = new Set();

                    STATE.links.forEach(link => {
                        if (link.from === loc.id || link.to === loc.id) {
                            const otherId = link.from === loc.id ? link.to : link.from;
                            const other = STATE.nodes.find(n => n.id === otherId);
                            if (other && other.icon === 'Scene') {
                                hostSceneIds.add(otherId);
                            }
                        }
                    });

                    const colIdx = hostSceneIds.size ? avgColForIds(hostSceneIds) : GRID.snap(loc.x, loc.y).col;
                    const pos = GRID.center(colIdx, 3);
                    loc.x = pos.x;
                    loc.y = pos.y;
                });

                RENDERER.nodes();
                RENDERER.connections();
            }

<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded base -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#020617"/>

  <!-- Laurel crown -->
  <path d="M16 28 Q32 16 48 28" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/>

  <!-- Yellow bust / head (master craftsman Homer) -->
  <circle cx="32" cy="30" r="9" fill="#facc15" stroke="#78350f" stroke-width="2"/>
  <path d="M24 44 Q32 38 40 44" fill="#facc15" stroke="#78350f" stroke-width="2" stroke-linejoin="round"/>

  <!-- Chisel + stylus (MPD editing) -->
  <line x1="22" y1="46" x2="30" y2="54" stroke="#e5e7eb" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="46" x2="44" y2="54" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle stud grid at bottom -->
  <g fill="#22c55e">
    <circle cx="22" cy="56" r="1.5"/>
    <circle cx="32" cy="56" r="1.5"/>
    <circle cx="42" cy="56" r="1.5"/>
  </g>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cascade player</title>
<style>
:root { --paper: #f4f4f0; --ink: #141414; --muted: #5d5a52; --card: #fbfbf8; --rule: #d8d6ce; --blue: #0033cc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #0f0f0e; --ink: #ecebe6; --muted: #a09d94; --card: #181816; --rule: #2c2b28; --blue: #6f8cff; } }
:root[data-theme="dark"] { --paper: #0f0f0e; --ink: #ecebe6; --muted: #a09d94; --card: #181816; --rule: #2c2b28; --blue: #6f8cff; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.4 Inter, system-ui, sans-serif; }
#stage { width: 100%; aspect-ratio: 3 / 2; background: #111; position: relative; }
#stage.tall { aspect-ratio: 6 / 5; }
#status { position: absolute; inset: auto 8px 8px auto; font-size: 12px; color: #ddd; background: rgba(0,0,0,.55); padding: 2px 8px; }
.bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
.bar button { font: 600 13px Inter, system-ui, sans-serif; padding: 5px 12px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; min-width: 64px; }
.bar input[type=range] { flex: 1; min-width: 0; }
.bar output { font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; color: var(--muted); font-size: 12px; }
#params { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 16px; padding: 10px; }
#params label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 12px; color: var(--muted); align-items: center; }
#params label input[type=range], #params label select { grid-column: 1 / -1; width: 100%; min-width: 0; }
#params select { font: 13px Inter, system-ui, sans-serif; background: var(--card); color: var(--ink); border: 1px solid var(--rule); padding: 3px; }
#params output { color: var(--ink); font-variant-numeric: tabular-nums; }
#err { color: #b3261e; padding: 8px 10px; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<div id="stage"><div id="status">loading</div></div>
<div class="bar"><button id="play" type="button">Play</button><input id="scrub" type="range" min="1" max="2" value="1" aria-label="Frame"><output id="fr">1</output></div>
<div id="params"></div>
<div id="err"></div>
<script type="module">
/* The Cascade static player (cascade build) of one graph, mounted with its own embed.js, with the graph's parameters as controls
   (from ../graphs.json) and a scrub bar over its frame range. Everything here goes through the player's public controller:
   seek(frame) and setProp(node, prop, value), each awaiting the cook. */
const q = new URLSearchParams(location.search), name = q.get('g') || 'kit';
const $ = s => document.querySelector(s), status = $('#status');
const spec = (await (await fetch('../graphs.json')).json()).graphs.find(g => g.name === name);
if (['attention', 'facing'].includes(name)) $('#stage').classList.add('tall');
const [f0, f1] = spec.frames, scrub = $('#scrub');
scrub.min = f0; scrub.max = f1; scrub.value = q.get('frame') || f1;
let player;
try {
  const { mount } = await import(`./${name}/embed.js`);
  player = await mount($('#stage'), { frame: +scrub.value, fps: spec.fps, autoplay: false, output: { nodeId: spec.output[0], port: spec.output[1] } });
  window.__player = player;
  /* the player's own play button and frame box would drive a second clock: this page's scrub bar is the one clock */
  const doc = $('#stage iframe') && $('#stage iframe').contentDocument, bar = doc && doc.querySelector('[data-cascade-controls]');
  if (bar) bar.style.display = 'none';
} catch (e) { $('#err').style.display = 'block'; $('#err').textContent = 'The player could not start: ' + (e && e.message || e); throw e; }
let busy = false, want = null;
async function go(frame) {                 /* coalesce: only the latest requested frame is cooked */
  want = frame; if (busy) return; busy = true;
  while (want != null) { const f = want; want = null; const t = performance.now(); await player.seek(f); $('#fr').textContent = f; status.textContent = `frame ${f} · ${Math.round(performance.now() - t)} ms`; }
  busy = false;
}
scrub.addEventListener('input', () => go(+scrub.value));
let playing = false;
$('#play').addEventListener('click', async () => {
  playing = !playing; $('#play').textContent = playing ? 'Pause' : 'Play';
  while (playing) { let f = +scrub.value + 1; if (f > f1) f = f0; scrub.value = f; const t = performance.now(); await go(f); await new Promise(r => setTimeout(r, Math.max(0, 1000 / spec.fps - (performance.now() - t)))); }
});
for (const p of spec.params) {
  const L = document.createElement('label'), span = document.createElement('span'), out = document.createElement('output');
  span.textContent = p.label; L.append(span, out);
  let input;
  if (p.type === 'select') { input = document.createElement('select'); for (const [v, t] of p.options) { const o = document.createElement('option'); o.value = String(v); o.textContent = t; input.append(o); } input.value = String(p.value); }
  else if (p.type === 'bool') { input = document.createElement('input'); input.type = 'checkbox'; input.checked = !!p.value; L.style.gridTemplateColumns = 'auto 1fr'; L.prepend(input); out.remove(); }
  else { input = document.createElement('input'); input.type = 'range'; input.min = p.min; input.max = p.max; input.step = p.step; input.value = p.value; out.textContent = p.value; }
  if (p.type !== 'bool') L.append(input);
  input.setAttribute('aria-label', p.label);
  input.addEventListener(p.type === 'range' ? 'change' : 'change', async () => {
    const v = p.type === 'bool' ? input.checked : p.type === 'select' ? (typeof p.value === 'number' ? Number(input.value) : input.value) : Number(input.value);
    if (p.type === 'range') out.textContent = v;
    const t = performance.now(); status.textContent = 'cooking';
    try { await player.setProp(p.node, p.prop, v); status.textContent = `${p.node}.${p.prop} = ${v} · ${Math.round(performance.now() - t)} ms`; }
    catch (e) { status.textContent = 'error: ' + (e && e.message || e); }
  });
  if (p.type === 'range') input.addEventListener('input', () => { out.textContent = input.value; });
  $('#params').append(L);
}
status.textContent = `frame ${scrub.value}`; $('#fr').textContent = scrub.value;
</script>
</body>
</html>

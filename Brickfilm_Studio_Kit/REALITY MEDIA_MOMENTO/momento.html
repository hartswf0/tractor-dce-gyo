<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Momento – Grace Brickfilm Capture</title>
  <link rel="icon" type="image/svg+xml" href="mento-favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Courier New", monospace;
      background: #000;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 6px 12px;
      border-bottom: 1px solid #333;
      background: #050505;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid #333;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }
    .camera-mark {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .camera-name {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .camera-state {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid #333;
      letter-spacing: 0.16em;
      color: #9ca3af;
    }
    .camera-state.recording {
      border-color: #ef4444;
      color: #ef4444;
    }
    .badge.camera-stock {
      font-size: 9px;
      padding: 2px 8px;
    }
    .content {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .left-pane {
      flex: 3;
      border-right: 1px solid #333;
      background: #050505;
      display: flex;
      flex-direction: column;
    }
    .right-pane {
      flex: 2;
      display: flex;
      flex-direction: column;
      padding: 8px 10px;
      gap: 6px;
      background: #050505;
    }
    #grace-iframe {
      border: none;
      width: 100%;
      height: 100%;
      background: #000;
    }
    .section-title {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 10px;
    }
    .controls-row label {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    input[type="number"] {
      width: 64px;
      padding: 2px 4px;
      background: #000;
      border: 1px solid #333;
      color: #ddd;
      font-size: 11px;
    }
    select {
      padding: 2px 4px;
      background: #000;
      border: 1px solid #333;
      color: #ddd;
      font-size: 11px;
    }
    button {
      padding: 3px 9px;
      border-radius: 3px;
      border: 1px solid #444;
      background: #0b0b0b;
      color: #e5e7eb;
      font-size: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    button.primary {
      background: #0f7bff;
      border-color: #0f7bff;
      color: #fff;
    }
    button[disabled] {
      opacity: 0.4;
      cursor: default;
    }
    #status-line {
      font-size: 11px;
      color: #aaa;
      min-height: 1.4em;
    }
    #preview-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #preview-canvas {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      border: 2px solid #facc15;
      background: #000;
      image-rendering: pixelated;
      /* Lock visual aspect to 4:3 so the capture frame matches the encoded video */
      aspect-ratio: 4 / 3;
      height: auto;
    }
    .shot-meta {
      font-size: 10px;
      color: #9ca3af;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: space-between;
    }
    .shot-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 4px;
    }
    .shot-thumb {
      position: relative;
      height: 54px;
      border: 1px solid #333;
      background: #000 center/cover no-repeat;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #e5e7eb;
      padding: 2px 3px;
    }
    .shot-thumb-label {
      background: rgba(0,0,0,0.7);
      padding: 1px 3px;
      border-radius: 2px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mento-shot-text {
      width: 100%;
      min-height: 96px;
      padding: 6px 8px;
      background: #000;
      color: #ddd;
      border: 1px solid #333;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      resize: vertical;
      white-space: pre;
      line-height: 1.4;
    }
    #log {
      flex: 1;
      border: 1px solid #222;
      background: #020202;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      padding: 6px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .status-bar {
      padding: 6px 10px;
      border-top: 1px solid #333;
      font-size: 10px;
      color: #666;
      display: flex;
      justify-content: space-between;
    }
    .control-card {
      border: 1px solid #222;
      border-radius: 4px;
      padding: 6px 8px;
      background: #050505;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-card-title {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #9ca3af;
    }
    @media (max-width: 900px) {
      .content {
        flex-direction: column;
        min-height: 0;
      }
      /* On small screens, show capture controls above the Grace viewport */
      .right-pane {
        order: 1;
        flex: 0 0 auto;
        max-height: 45%;
        overflow-y: auto;
      }
      .left-pane {
        order: 2;
        flex: 0 0 auto;
        height: 55%;
      }
      .controls-row {
        flex-direction: column;
        align-items: stretch;
      }
      #log {
        max-height: 120px;
      }
      button {
        width: 100%;
      }
    }

    /* HOMER host mode: act as a compact control panel bound to an external Courage viewer */
    body.host-homer .content {
      flex-direction: column;
      min-height: 0;
    }
    body.host-homer .left-pane {
      display: none;
    }
    body.host-homer .right-pane {
      flex: 1;
      max-width: 100%;
      max-height: none;
      overflow-y: auto;
    }
    body.host-homer #preview-canvas {
      max-width: 100%;
    }
    body.host-homer #log {
      max-height: 160px;
    }
    body.host-homer .header {
      padding: 6px 10px;
      font-size: 10px;
    }

    /* Host Homer: order cards as CAMERA → SHOT SETUP → GALLERY → LOG */
    body.host-homer .card-camera { order: 1; }
    body.host-homer .card-shot-setup { order: 2; }
    body.host-homer .card-gallery { order: 3; }
    body.host-homer .card-log { order: 4; }

    /* Host Homer on mobile: make camera card very compact */
    @media (max-width: 900px) {
      body.host-homer .right-pane {
        padding: 6px;
      }
      body.host-homer .control-card {
        padding: 6px;
        gap: 4px;
      }
      body.host-homer #preview-canvas {
        max-height: 180px;
      }
      body.host-homer .controls-row {
        gap: 4px;
      }
      body.host-homer .card-shot-setup .controls-row {
        flex-direction: row;
        flex-wrap: wrap;
      }
      body.host-homer .card-shot-setup label {
        flex: 1 1 120px;
      }
    }
    body.host-homer .card-camera .control-card-title,
    body.host-homer .card-shot-setup .control-card-title {
      display: none;
    }
    body.host-homer #preview-wrapper {
      gap: 2px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="camera-mark">
        <span class="camera-name">MOMENTO</span>
        <span class="camera-state" id="cameraState">STBY</span>
      </div>
      <div class="badge camera-stock" id="cameraStock">4:3 · WEBM</div>
    </div>
    <div class="content">
      <div class="left-pane">
        <iframe
          id="grace-iframe"
          title="Courage Viewer"
          src="../../wag-viewer-prime-integration-20251112-055341 copy/wag-courage.html?momento=true"
        ></iframe>
      </div>
      <div class="right-pane">
        <div class="control-card card-camera">
          <div class="control-card-title">Camera & Preview</div>
          <div id="preview-wrapper">
            <canvas id="preview-canvas" width="320" height="240"></canvas>
            <canvas id="capture-canvas" width="640" height="480" style="display:none;"></canvas>
            <div class="shot-meta" id="shot-meta"></div>
          </div>
          <div class="controls-row">
            <label>Path
              <select id="momento-camera-path">
                <option value="manual">Manual (use Grace)</option>
                <option value="orbit">Orbit ring</option>
                <option value="push">Push through center</option>
              </select>
            </label>
          </div>
          <div class="controls-row">
            <button id="start-capture" class="primary" title="Start recording">REC</button>
            <button id="stop-capture" disabled title="Stop recording">STOP</button>
            <button id="download-last" disabled title="Download last shot">SAVE</button>
          </div>
        </div>

        <div class="control-card card-shot-setup">
          <div class="control-card-title">Shot Setup</div>
          <div id="status-line">Booting Momento…</div>
          <div class="controls-row">
            <label>FPS
              <input id="momento-fps" type="number" min="1" max="60" step="1" value="30" />
            </label>
            <label>Max seconds
              <input id="momento-duration" type="number" min="1" max="120" step="1" value="10" />
            </label>
          </div>
          <div class="controls-row">
            <label>Aspect
              <select id="momento-aspect">
                <option value="native">Native (Grace)</option>
                <option value="4_3" selected>4:3 Letterboxed</option>
              </select>
            </label>
            <label>Quality
              <select id="momento-quality">
                <option value="480p">480p (640×480)</option>
                <option value="720p" selected>720p (960×720)</option>
                <option value="960p">960p (1280×960)</option>
              </select>
            </label>
          </div>
        </div>

        <div class="control-card card-mento-shots">
          <div class="control-card-title">Mento Shots (MPD)</div>
          <div class="controls-row">
            <label>
              Source
              <input id="mento-shot-file" type="file" accept=".mpd,.ldr,.txt" />
            </label>
          </div>
          <div class="controls-row">
            <label>
              Shot
              <select id="mento-shot-select">
                <option value="">-- none loaded --</option>
              </select>
            </label>
            <button id="mento-apply-shot">Apply</button>
          </div>
          <div class="controls-row">
            <textarea
              id="mento-shot-text"
              class="mento-shot-text"
              spellcheck="false"
              placeholder="MENTO shot MPD will appear here…"
            ></textarea>
          </div>
          <div class="controls-row">
            <button id="mento-parse-shot-text">Load From Text</button>
            <button id="mento-copy-shot-text">Copy MPD</button>
          </div>
        </div>

        <div class="control-card card-gallery">
          <div class="control-card-title">Shots</div>
          <div id="shot-gallery" class="shot-gallery"></div>
        </div>

        <div class="control-card card-log" style="flex:1; min-height:0;">
          <div class="control-card-title">Log</div>
          <pre id="log"></pre>
        </div>
      </div>
    </div>
    <div class="status-bar">
      <span>Momento v0 · MediaRecorder-based capture</span>
      <span>Courage + LDraw scenes → WebM</span>
    </div>
  </div>

  <script>
    (function() {
      try {
        const params = new URLSearchParams(window.location.search || '');
        if (params.get('host') === 'homer') {
          document.body.classList.add('host-homer');
        }
      } catch (e) {
        // Non-fatal; layout will fall back to default two-pane mode.
      }
    })();
  </script>
  <script src="momento_capture_app.js"></script>
</body>
</html>

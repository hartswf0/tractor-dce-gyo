<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7f4eb"><title>FROM HOMER TO HOMER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f7f4eb'/%3E%3Cpath d='M10 16h44M10 32h44M10 48h44' stroke='%23111' stroke-width='5'/%3E%3Ccircle cx='18' cy='16' r='5' fill='%23ffdf2b'/%3E%3Ccircle cx='46' cy='48' r='5' fill='%23ffdf2b'/%3E%3C/svg%3E">
<style>
:root{--paper:#f9f7ef;--field:#f0ede3;--ink:#111;--muted:#777269;--rule:#aaa59a;--yellow:#ffdf2b;--green:#1db978;--blue:#b9ddff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,select{font:inherit;border:1.5px solid var(--ink);background:var(--paper);border-radius:0;color:var(--ink);font-weight:850}button{min-height:40px;padding:6px 8px}button.on{background:var(--yellow)}#app{height:100dvh;display:grid;grid-template-rows:44px 44px minmax(0,1fr) 58px min(31dvh,300px)}header,.switch,.dock{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:2px solid var(--ink)}header strong{font-size:10px;margin-right:auto}header span{font-size:7px;border:1px solid var(--ink);padding:5px 6px}.switch button{flex:1;font-size:8px}.stage{position:relative;min-height:0;background:var(--field);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.source,.lego{position:relative;min-width:0;min-height:0;overflow:hidden}.source{border-right:1px solid var(--ink);display:grid;place-items:center}.source canvas{width:min(94%,430px);height:auto;image-rendering:pixelated}.label{position:absolute;left:8px;top:8px;background:#fffdf5e8;border:1.5px solid var(--ink);padding:6px 8px;z-index:5}.label small{display:block;font-size:6px;color:var(--muted);letter-spacing:.12em}.label b{display:block;font-size:14px}.label span{display:block;font-size:7px;color:var(--muted);margin-top:2px}.source .tag,.lego .tag{position:absolute;right:8px;top:8px;z-index:5;border:1px solid var(--ink);background:var(--paper);padding:5px 6px;font-size:6px}.legoHost{position:absolute;inset:0}.dock{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}.dock button{flex:1;font-size:8px}.tray{min-height:0;overflow:auto}.list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.card{border:0;border-right:1px solid #bbb;border-bottom:1px solid #bbb;min-height:54px;text-align:left;padding:7px;background:var(--paper)}.card b{display:block;font-size:8px}.card small{font-size:6px;color:var(--muted)}.card.on{background:var(--yellow)}.card.todo{opacity:.45}.perf{display:flex;flex-wrap:wrap;gap:5px;padding:7px}.perf button{font-size:7px;min-height:34px}.compare{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:6px}.compare button{padding:4px;min-height:0}.compare canvas{width:100%;height:auto;display:block;image-rendering:pixelated}.compare b{display:block;font-size:6px;margin-top:2px}.compare small{display:block;font-size:5px;color:var(--muted)}.foot{font-size:7px;color:var(--muted);padding:7px;border-top:1px solid var(--rule)}#status{background:var(--green)}#send{background:var(--yellow)}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><div id="app">
<header><strong>WORD-TO-THEATRE / FROM HOMER TO HOMER</strong><span id="status">CHARACTER × PERFORMANCE</span><span id="count">23 FACES / 24 CAST</span></header>
<div class="switch"><button id="odyssey" class="on">HOMER I · ODYSSEY</button><button id="springfield">HOMER II · SPRINGFIELD</button></div>
<main class="stage"><section class="source"><div class="label"><small>SOURCE DRAWING</small><b id="sourceName">ODYSSEUS</b><span id="sourcePerf">recognition</span></div><span class="tag" id="sourceOrigin">ODYSSEY SOURCE</span><div id="sourceHost"></div></section><section class="lego"><div class="label"><small>LEGO ACTOR</small><b id="legoName">ODYSSEUS</b><span>same face → decal → brick</span></div><span class="tag">ACTUAL LDRAW HEAD</span><div id="legoHost" class="legoHost"></div></section></main>
<nav class="dock"><button data-mode="cast" class="on">CAST</button><button data-mode="performance">PERFORMANCE</button><button data-mode="compare">COMPARE</button><button id="send">WORD-TO-THEATRE</button></nav>
<section class="tray" id="tray"></section></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {LDrawLoader} from 'three/addons/loaders/LDrawLoader.js';import {LDrawConditionalLineMaterial} from 'three/addons/materials/LDrawConditionalLineMaterial.js';
import {SOURCE_CAST,LIVE_FACE_CAST,CAST24,PERFORMANCE_NAMES,SIGNATURES,faceOrigin,hasSourceFace,renderSourceFace,makeDecalMesh,selection,titleCase} from './odyssey-decal.js';
const $=s=>document.querySelector(s);let character='odysseus',performance='recognition',mode='cast',repertory='odyssey';
const spring=['homer','marge','bart','lisa','maggie','ned'];
const srcHost=$('#sourceHost'),tray=$('#tray');
const costume={odysseus:[4,70],penelope:[15,15],telemachus:[272,70],athena:[15,272],eurycleia:[70,19],nestor:[19,70],eumaeus:[19,70],circe:[4,70],nausicaa:[15,272],helen:[15,4],alcinous:[272,15],polyphemus:[70,70],poseidon:[272,19],calypso:[15,272],tiresias:[71,72],laertes:[19,70],antinous:[4,70],menelaus:[4,70],arete:[272,19],hermes:[71,70],zeus:[15,272],phemius:[19,70],melanthius:[70,70]};
const hair={penelope:['12890.dat',70],eurycleia:['12890.dat',71],circe:['12890.dat',70],nausicaa:['12890.dat',70],helen:['12890.dat',70],athena:['12890.dat',19],odysseus:['21787.dat',70],telemachus:['21787.dat',70],nestor:['21787.dat',71],eumaeus:['21787.dat',70],alcinous:['21787.dat',71],poseidon:['21787.dat',15],calypso:['12890.dat',70],tiresias:['21787.dat',71],laertes:['21787.dat',71],antinous:['21787.dat',70],menelaus:['21787.dat',70],arete:['12890.dat',70],hermes:['21787.dat',70],zeus:['21787.dat',15],phemius:['21787.dat',70],melanthius:['21787.dat',70]};
function ref(c,x,y,z,f,m='1 0 0 0 1 0 0 0 1'){return`1 ${c} ${x} ${y} ${z} ${m} parts/${f}`}
function actorDat(c){const [top,bottom]=costume[c]||[15,70],h=hair[c];const lines=['0 FILE actor.ldr',ref(78,0,-84,0,'3626b.dat'),ref(top,0,-60,0,'973.dat'),ref(top,-15.552,-51,0,'3818.dat','0.985 -0.17 0 0.17 0.985 0 0 0 1'),ref(top,15.552,-51,0,'3819.dat','0.985 0.17 0 -0.17 0.985 0 0 0 1'),ref(78,-23.6904,-33.226,-9.8982,'3820.dat','0.985 -0.1202 0.1202 0.17 0.6964 -0.6964 0 0.707 0.707'),ref(78,23.6904,-33.226,-9.8982,'3820.dat','0.985 0.1202 -0.1202 -0.17 0.6964 -0.6964 0 0.707 0.707'),ref(bottom,0,-28,0,'3815c01.dat')];if(h)lines.push(ref(h[1],0,-84,0,h[0]));return lines.join('\n')}
const host=$('#legoHost'),scene=new THREE.Scene();scene.background=new THREE.Color(0xf0ede3);const camera=new THREE.PerspectiveCamera(28,1,.1,5000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.2));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(100,160,150);scene.add(key);const grid=new THREE.GridHelper(220,11,0x999999,0xd6d0c5);scene.add(grid);const loader=new LDrawLoader();loader.setConditionalLineMaterial(LDrawConditionalLineMaterial);loader.setPartsLibraryPath('./ldraw/');let root=null;
function fit(){if(!root)return;const box=new THREE.Box3().setFromObject(root),s=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3()),e=Math.max(s.x,s.y,s.z,60);controls.target.copy(c);camera.position.set(c.x+e*.8,c.y+e*.42,c.z+e*1.8);grid.position.y=box.min.y-.8}
function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(()=>{resize();fit()}).observe(host);(function tick(){requestAnimationFrame(tick);resize();controls.update();renderer.render(scene,camera)})();
function dispose(o){o?.traverse(x=>{x.geometry?.dispose?.();(Array.isArray(x.material)?x.material:[x.material]).filter(Boolean).forEach(m=>m.dispose?.())})}
function clearActor(){if(root){scene.remove(root);dispose(root);root=null}}
function renderActor(){if(repertory!=='odyssey'||!hasSourceFace(character)){clearActor();return}loader.parse(actorDat(character),group=>{clearActor();root=new THREE.Group();root.rotation.x=Math.PI;root.add(group);const decal=makeDecalMesh(THREE,character,performance);if(decal)root.add(decal);scene.add(root);fit();},e=>console.error(e))}
function renderSource(){srcHost.innerHTML='';if(repertory!=='odyssey'||!hasSourceFace(character)){srcHost.innerHTML='<div style="font-size:8px;padding:20px"><b>ARGOS</b><br>DOG RIG · face stays canine</div>';return}const c=renderSourceFace(character,performance,512);c.style.width='100%';c.style.height='auto';srcHost.appendChild(c)}
function updateLabels(){$('#sourceName').textContent=titleCase(character);$('#legoName').textContent=titleCase(character);$('#sourcePerf').textContent=performance;$('#sourceOrigin').textContent=faceOrigin(character);}
function chooseChar(c){character=c;if(!hasSourceFace(c))performance='neutral';update();}
function choosePerf(p){performance=p;update();}
function update(){updateLabels();renderSource();renderActor();renderTray();}
function renderTray(){tray.innerHTML='';if(repertory==='springfield'){tray.innerHTML='<div class="foot"><b>SPRINGFIELD TRANSFER TEST</b><br>The second Homer uses sculpted/printed heads. Same PERFORMANCE vocabulary, different representation. This side stays read-only until each sculpt exposes a face channel or print swap.</div>'+spring.map(n=>`<button class="card"><b>${n.toUpperCase()}</b><small>TRANSFER</small></button>`).join('');return}
 if(mode==='cast'){const wrap=document.createElement('div');wrap.className='list';for(const c of CAST24){const b=document.createElement('button');b.className='card '+(c===character?'on ':'')+(hasSourceFace(c)?'':'todo');b.innerHTML=`<b>${titleCase(c)}</b><small>${faceOrigin(c)}</small>`;b.onclick=()=>chooseChar(c);wrap.appendChild(b)}tray.appendChild(wrap);return}
 if(mode==='performance'){const sig=SIGNATURES[character]||[];const d=document.createElement('div');d.className='perf';const names=[...new Set([...sig,...PERFORMANCE_NAMES])];for(const p of names){const b=document.createElement('button');b.textContent=p.toUpperCase();if(p===performance)b.className='on';b.onclick=()=>choosePerf(p);d.appendChild(b)}tray.appendChild(d);return}
 if(mode==='compare'){const d=document.createElement('div');d.className='compare';for(const c of LIVE_FACE_CAST){const b=document.createElement('button');const cv=renderSourceFace(c,performance,220);b.appendChild(cv);const lab=document.createElement('b');lab.textContent=titleCase(c);b.appendChild(lab);const sm=document.createElement('small');sm.textContent=faceOrigin(c);b.appendChild(sm);b.onclick=()=>chooseChar(c);d.appendChild(b)}tray.appendChild(d);const f=document.createElement('div');f.className='foot';f.textContent=`COMPARE · ${performance.toUpperCase()} · 23 human faces · Argos keeps a separate dog rig`;tray.appendChild(f)} }
for(const b of document.querySelectorAll('.dock [data-mode]'))b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.dock [data-mode]').forEach(x=>x.classList.toggle('on',x===b));renderTray()};
$('#odyssey').onclick=()=>{repertory='odyssey';$('#odyssey').classList.add('on');$('#springfield').classList.remove('on');update()};$('#springfield').onclick=()=>{repertory='springfield';clearActor();$('#springfield').classList.add('on');$('#odyssey').classList.remove('on');renderTray()};
$('#send').onclick=()=>{if(repertory!=='odyssey'||!hasSourceFace(character))return;const s=selection(character,performance);localStorage.setItem('word-to-theatre.odysseyFace',JSON.stringify(s));location.href=`./word-to-theatre.html?odyssey=${encodeURIComponent(character)}&performance=${encodeURIComponent(performance)}`};
await loader.preloadMaterials('./ldraw/LDConfig.ldr');
window.__HOMER_TO_HOMER={get selection(){return selection(character,performance)},SOURCE_CAST,LIVE_FACE_CAST,CAST24,PERFORMANCE_NAMES};update();
</script></body></html>

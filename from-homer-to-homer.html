<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f7f4eb'/%3E%3Cpath d='M9 15h46M9 32h46M9 49h46' stroke='%23111' stroke-width='5'/%3E%3Ccircle cx='18' cy='15' r='5' fill='%23ffdf2b'/%3E%3Ccircle cx='46' cy='49' r='5' fill='%23ffdf2b'/%3E%3C/svg%3E">
<style>
:root{--paper:#faf8f0;--field:#efebe0;--ink:#111;--muted:#746f65;--rule:#aaa398;--yellow:#ffdf2b;--green:#18b777;--blue:#b9ddff;--cream:#fffdf7}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button{font:inherit;color:inherit;background:var(--paper);border:1.5px solid var(--ink);border-radius:0;font-weight:900;min-height:38px;padding:6px 8px}button.on{background:var(--yellow)}#app{height:100dvh;display:grid;grid-template-rows:42px 42px minmax(0,1fr) 54px min(31dvh,310px);overflow:hidden}header,.repertory,.dock{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:2px solid var(--ink)}header strong{font-size:10px;margin-right:auto}.chip{font-size:7px;border:1px solid var(--ink);padding:5px 6px;white-space:nowrap}.chip.green{background:var(--green)}.repertory button{flex:1;font-size:8px}.stage{position:relative;min-height:0;display:grid;grid-template-columns:minmax(280px,.78fr) minmax(430px,1.22fr);background:var(--field);overflow:hidden}.source,.actor{position:relative;min-width:0;min-height:0;overflow:hidden}.source{border-right:2px solid var(--ink);display:grid;place-items:center;background:#f4f1e8}.source canvas{width:min(86%,620px);height:auto;image-rendering:pixelated}.actorHost{position:absolute;inset:0}.badge{position:absolute;z-index:8;background:#fffdf4e8;border:1.5px solid var(--ink);padding:6px 8px;pointer-events:none}.badge.left{left:8px;top:8px}.badge.right{right:8px;top:8px;text-align:right}.badge small{display:block;font-size:6px;color:var(--muted);letter-spacing:.12em}.badge b{display:block;font-size:15px;line-height:1.05;margin-top:2px}.badge span{display:block;font-size:7px;color:var(--muted);margin-top:3px;max-width:250px}.sourceTag{position:absolute;right:8px;bottom:8px;border:1px solid var(--ink);background:var(--paper);padding:4px 6px;font-size:6px}.actorTag{position:absolute;right:8px;bottom:8px;border:1px solid var(--ink);background:var(--green);padding:4px 6px;font-size:6px;font-weight:900}.dock{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}.dock button{flex:1;font-size:7px;min-width:0}.dock #send{background:var(--yellow)}.tray{min-height:0;overflow:auto;background:var(--paper)}.list{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}.card{border:0;border-right:1px solid #bbb;border-bottom:1px solid #bbb;text-align:left;padding:7px;min-height:53px;background:var(--paper)}.card b{display:block;font-size:8px}.card small{display:block;font-size:6px;color:var(--muted);margin-top:3px}.card.on{background:var(--yellow)}.card.todo{opacity:.48}.perf{display:flex;gap:5px;flex-wrap:wrap;padding:7px}.perf button{font-size:7px;min-height:32px}.compare{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:5px}.compare button{padding:3px;min-height:0}.compare canvas{width:100%;height:auto;display:block;image-rendering:pixelated}.compare b{display:block;font-size:6px;margin-top:2px}.compare small{display:block;font-size:5px;color:var(--muted)}.assembly{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px}.assembly .unit{border:1.5px solid var(--ink);padding:8px;min-height:72px;background:var(--cream)}.assembly .unit small{display:block;font-size:6px;color:var(--muted);letter-spacing:.1em}.assembly .unit b{display:block;font-size:9px;margin-top:5px}.frame{display:flex;gap:5px;padding:0 8px 8px}.frame button{font-size:7px;min-width:90px}.foot{padding:7px 9px;font-size:7px;color:var(--muted);border-top:1px solid var(--rule)}
@media(max-width:720px){#app{grid-template-rows:40px 42px minmax(0,1fr) 54px min(36dvh,330px)}.stage{display:block}.actor{position:absolute;inset:0}.source{position:absolute;left:7px;bottom:7px;width:35%;height:29%;z-index:12;border:1.5px solid var(--ink);background:var(--paper)}.source .badge{display:none}.sourceTag{right:3px;bottom:3px}.actor .badge.left{max-width:62%}.actor .badge.right{display:none}.list{grid-template-columns:repeat(3,minmax(0,1fr))}.compare{grid-template-columns:repeat(3,minmax(0,1fr))}.assembly{grid-template-columns:1fr 1fr}.dock button{font-size:6px;padding:4px 2px}.actorTag{font-size:5px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body><div id="app">
<header><strong>WORD-TO-THEATRE / FROM HOMER TO HOMER</strong><span class="chip green">CHARACTER × PERFORMANCE × ASSEMBLY</span><span class="chip">23 HUMAN · 1 DOG</span></header>
<div class="repertory"><button id="odyssey" class="on">HOMER I · ODYSSEY</button><button id="springfield">HOMER II · SPRINGFIELD</button></div>
<main class="stage">
<section class="source"><div class="badge left"><small>SOURCE PERFORMANCE</small><b id="sourceName">ODYSSEUS</b><span id="sourcePerf">recognition</span></div><div id="sourceHost"></div><span id="sourceOrigin" class="sourceTag">ODYSSEY SOURCE</span></section>
<section class="actor"><div id="actorHost" class="actorHost"></div><div class="badge left"><small>ASSEMBLED LEGO ACTOR</small><b id="actorName">ODYSSEUS</b><span id="actorMeta">face print · beard rig · costume print</span></div><div class="badge right"><small>PRINT STACK</small><b>WHITE EYES</b><span>Odyssey ink over explicit sclera</span></div><span class="actorTag">LDRAW BODY · CUSTOM THEATRE PRINT</span></section>
</main>
<nav class="dock"><button data-mode="cast" class="on">CAST</button><button data-mode="performance">PERFORMANCE</button><button data-mode="assembly">ASSEMBLY</button><button data-mode="compare">COMPARE</button><button id="send">WORD-TO-THEATRE</button></nav>
<section class="tray" id="tray"></section>
</div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {LDrawLoader} from 'three/addons/loaders/LDrawLoader.js';import {LDrawConditionalLineMaterial} from 'three/addons/materials/LDrawConditionalLineMaterial.js';
import {LIVE_FACE_CAST,CAST24,PERFORMANCE_NAMES,SIGNATURES,faceOrigin,hasSourceFace,renderSourceFace,makeDecalMesh,selection,titleCase} from './odyssey-decal-v2.js';
import {actorKit,makeCostumeMeshes,makeBeardMesh,assemblyLabel} from './odyssey-actor-kit.js';
const $=s=>document.querySelector(s);let character='odysseus',performance='recognition',mode='cast',repertory='odyssey',frameMode='full';
const spring=['homer','marge','bart','lisa','maggie','ned'];const sourceHost=$('#sourceHost'),tray=$('#tray');
function ref(c,x,y,z,f,m='1 0 0 0 1 0 0 0 1'){return`1 ${c} ${x} ${y} ${z} ${m} parts/${f}`}
function actorDat(c){const kit=actorKit(c),top=kit.costume.top,bottom=kit.costume.bottom,h=kit.hair;const lines=['0 FILE actor.ldr',ref(78,0,-84,0,'3626b.dat'),ref(top,0,-60,0,'973.dat'),ref(top,-15.552,-51,0,'3818.dat','0.985 -0.17 0 0.17 0.985 0 0 0 1'),ref(top,15.552,-51,0,'3819.dat','0.985 0.17 0 -0.17 0.985 0 0 0 1'),ref(78,-23.6904,-33.226,-9.8982,'3820.dat','0.985 -0.1202 0.1202 0.17 0.6964 -0.6964 0 0 0.707 0.707'),ref(78,23.6904,-33.226,-9.8982,'3820.dat','0.985 0.1202 -0.1202 -0.17 0.6964 -0.6964 0 0 0.707 0.707'),ref(bottom,0,-28,0,'3815c01.dat')];if(h)lines.push(ref(kit.hairColor,0,-84,0,h));return lines.join('\n')}
const host=$('#actorHost'),scene=new THREE.Scene();scene.background=new THREE.Color(0xefebe0);const camera=new THREE.PerspectiveCamera(28,1,.1,5000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.3));const key=new THREE.DirectionalLight(0xffffff,2.1);key.position.set(100,170,150);scene.add(key);const grid=new THREE.GridHelper(220,11,0x999999,0xd6d0c5);scene.add(grid);const loader=new LDrawLoader();loader.setConditionalLineMaterial(LDrawConditionalLineMaterial);loader.setPartsLibraryPath('./ldraw/');let root=null;
function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}function fit(){if(!root)return;const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());if(frameMode==='head'){const e=46;const target=new THREE.Vector3(center.x,box.max.y-17,center.z);controls.target.copy(target);camera.position.set(target.x+e*.55,target.y+e*.22,target.z+e*1.45)}else{const e=Math.max(size.x,size.y,size.z,70);controls.target.copy(center);camera.position.set(center.x+e*.78,center.y+e*.38,center.z+e*1.72)}grid.position.y=box.min.y-.8}new ResizeObserver(()=>{resize();fit()}).observe(host);(function tick(){requestAnimationFrame(tick);resize();controls.update();renderer.render(scene,camera)})();
function dispose(o){o?.traverse(x=>{x.geometry?.dispose?.();(Array.isArray(x.material)?x.material:[x.material]).filter(Boolean).forEach(m=>{m.map?.dispose?.();m.dispose?.()})})}function clearActor(){if(root){scene.remove(root);dispose(root);root=null}}
function renderActor(){if(repertory!=='odyssey'||!hasSourceFace(character)){clearActor();return}loader.parse(actorDat(character),group=>{clearActor();root=new THREE.Group();root.rotation.x=Math.PI;root.add(group);const costume=makeCostumeMeshes(character);if(costume)root.add(costume);const decal=makeDecalMesh(THREE,character,performance);if(decal)root.add(decal);const beard=makeBeardMesh(character);if(beard)root.add(beard);scene.add(root);fit();},e=>console.error(e))}
function renderSource(){sourceHost.innerHTML='';if(!hasSourceFace(character)){sourceHost.innerHTML='<div style="font-size:9px;padding:20px"><b>ARGOS</b><br>DOG RIG · not a human head print</div>';return}const c=renderSourceFace(character,performance,620);c.style.width='100%';c.style.height='auto';sourceHost.appendChild(c)}
function updateLabels(){$('#sourceName').textContent=titleCase(character);$('#actorName').textContent=titleCase(character);$('#sourcePerf').textContent=performance;$('#sourceOrigin').textContent=faceOrigin(character);$('#actorMeta').textContent=assemblyLabel(character)}
function chooseChar(c){character=c;if(!hasSourceFace(c))performance='neutral';update()}function choosePerf(p){performance=p;update()}function update(){updateLabels();renderSource();renderActor();renderTray()}
function renderTray(){tray.innerHTML='';if(repertory==='springfield'){tray.innerHTML='<div class="foot"><b>HOMER II · SPRINGFIELD</b><br>Same PERFORMANCE vocabulary, but sculpted character heads require a different print/geometry adapter. Odyssey is the live assembly corpus.</div>'+spring.map(n=>`<button class="card"><b>${n.toUpperCase()}</b><small>TRANSFER TEST</small></button>`).join('');return}
 if(mode==='cast'){const wrap=document.createElement('div');wrap.className='list';for(const c of CAST24){const b=document.createElement('button');b.className='card '+(c===character?'on ':'')+(hasSourceFace(c)?'':'todo');b.innerHTML=`<b>${titleCase(c)}</b><small>${hasSourceFace(c)?assemblyLabel(c):'DOG RIG'}</small>`;b.onclick=()=>chooseChar(c);wrap.appendChild(b)}tray.appendChild(wrap);return}
 if(mode==='performance'){const sig=SIGNATURES[character]||[],d=document.createElement('div');d.className='perf';for(const p of [...new Set([...sig,...PERFORMANCE_NAMES])]){const b=document.createElement('button');b.textContent=p.toUpperCase();if(p===performance)b.className='on';b.onclick=()=>choosePerf(p);d.appendChild(b)}tray.appendChild(d);return}
 if(mode==='assembly'){const k=actorKit(character),d=document.createElement('div');d.className='assembly';const units=[['HEAD CLASS',k.head.replaceAll('_',' ')],['BEARD',k.beard||'none'],['HAIR',k.hair||'special / none'],['COSTUME',k.costume.pattern]];for(const [a,b] of units){const u=document.createElement('div');u.className='unit';u.innerHTML=`<small>${a}</small><b>${String(b).toUpperCase()}</b>`;d.appendChild(u)}tray.appendChild(d);const f=document.createElement('div');f.className='frame';for(const [id,label] of [['full','FULL BODY'],['head','HEAD / MAKEUP']]){const b=document.createElement('button');b.textContent=label;if(frameMode===id)b.className='on';b.onclick=()=>{frameMode=id;fit();renderTray()};f.appendChild(b)}tray.appendChild(f);const note=document.createElement('div');note.className='foot';note.textContent='ACTUAL LDRAW BODY · white sclera print · Odyssey ink · beard silhouette · character costume print';tray.appendChild(note);return}
 if(mode==='compare'){const d=document.createElement('div');d.className='compare';for(const c of LIVE_FACE_CAST){const b=document.createElement('button'),cv=renderSourceFace(c,performance,220);b.appendChild(cv);const lab=document.createElement('b');lab.textContent=titleCase(c);b.appendChild(lab);const sm=document.createElement('small');sm.textContent=actorKit(c).beard||'clean';b.appendChild(sm);b.onclick=()=>chooseChar(c);d.appendChild(b)}tray.appendChild(d);const f=document.createElement('div');f.className='foot';f.textContent=`${performance.toUpperCase()} · SAME DRAMATIC OPERATION · 23 CHARACTER-SPECIFIC REALIZATIONS`;tray.appendChild(f)} }
for(const b of document.querySelectorAll('.dock [data-mode]'))b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.dock [data-mode]').forEach(x=>x.classList.toggle('on',x===b));renderTray()};
$('#odyssey').onclick=()=>{repertory='odyssey';$('#odyssey').classList.add('on');$('#springfield').classList.remove('on');update()};$('#springfield').onclick=()=>{repertory='springfield';clearActor();$('#springfield').classList.add('on');$('#odyssey').classList.remove('on');renderTray()};$('#send').onclick=()=>{if(!hasSourceFace(character))return;const s=selection(character,performance);localStorage.setItem('word-to-theatre.odysseyFace',JSON.stringify(s));location.href=`./word-to-theatre.html?odyssey=${encodeURIComponent(character)}&performance=${encodeURIComponent(performance)}`};
await loader.preloadMaterials('./ldraw/LDConfig.ldr');window.__HOMER_TO_HOMER={get selection(){return selection(character,performance)},LIVE_FACE_CAST,CAST24,PERFORMANCE_NAMES,get frame(){return frameMode}};update();
</script></body></html>

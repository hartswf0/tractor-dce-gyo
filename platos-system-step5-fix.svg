<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="background:#333; font-family:Arial, sans-serif;">
  <defs>
    <pattern id="brickWall" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
      <rect width="20" height="10" fill="none" stroke="#fff" stroke-opacity="0.2"/>
    </pattern>
    <filter id="shadow"><feDropShadow dx="4" dy="4" stdDeviation="2" flood-opacity="0.5"/></filter>
  </defs>

  <!-- Header -->
  <g transform="translate(20, 20)">
    <rect width="320" height="60" rx="4" fill="#F6D713" filter="url(#shadow)"/>
    <text x="20" y="40" font-weight="bold" fill="#333" font-size="24">STEP 5: THE FIX</text>
  </g>

  <!-- The Ground Line -->
  <g transform="translate(100, 350)">
    <text x="-80" y="10" fill="#fff" font-weight="bold">Y = 0</text>
    <rect width="600" height="20" fill="#287F46"/>
    <rect x="0" y="20" width="600" height="100" fill="#5F3818" fill-opacity="0.3"/>
  </g>

  <!-- The Mistake (Underground) -->
  <g transform="translate(400, 420)" opacity="0.6">
    <rect x="-40" y="-10" width="80" height="20" fill="#C91A09" opacity="0.5"/>
    <text x="50" y="5" fill="#C91A09" font-size="12">BUG: Y+ (Down)</text>
  </g>

  <!-- The Solution (Lift) -->
  <g transform="translate(400, 150)">
    <rect x="-40" y="-10" width="80" height="20" fill="#0055BF"/>
    <text x="50" y="5" fill="#0055BF" font-weight="bold">FIX: Y- (Up)</text>
  </g>

  <!-- Technic Liftarm Arrow -->
  <path d="M 400 400 L 400 180" stroke="#F6D713" stroke-width="20" stroke-linecap="round"/>
  <circle cx="400" cy="380" r="6" fill="#333"/>
  <circle cx="400" cy="340" r="6" fill="#333"/>
  <circle cx="400" cy="300" r="6" fill="#333"/>
  <circle cx="400" cy="260" r="6" fill="#333"/>
  <circle cx="400" cy="220" r="6" fill="#333"/>
  <text x="430" y="300" fill="#F6D713" font-size="14" font-weight="bold">LIFT TO SKY</text>
</svg>

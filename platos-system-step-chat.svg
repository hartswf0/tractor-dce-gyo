<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" style="background:#222; font-family:Arial, sans-serif;">
  <defs>
    <filter id="shadowChat" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#facc15" />
    </marker>
  </defs>

  <g transform="translate(20,20)">
    <rect width="320" height="40" rx="4" fill="#333" stroke="#555" stroke-width="2"/>
    <text x="160" y="26" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">CHAT AS BRICKS</text>
  </g>

  <!-- Prompt brick -->
  <g transform="translate(170,150)" filter="url(#shadowChat)">
    <rect x="-180" y="-50" width="260" height="80" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
    <text x="-160" y="-26" fill="#38bdf8" font-size="11" font-weight="bold">PROMPT / BUCKET</text>
    <text x="-160" y="-8" fill="#e5e7eb" font-size="11">MPD bucket, rule, or request</text>
  </g>

  <!-- Response brick -->
  <g transform="translate(560,140)" filter="url(#shadowChat)">
    <rect x="-80" y="-40" width="260" height="90" rx="10" fill="#020617" stroke="#22c55e" stroke-width="2"/>
    <text x="-60" y="-18" fill="#22c55e" font-size="11" font-weight="bold">RESPONSE / THINKING</text>
    <text x="-60" y="2" fill="#e5e7eb" font-size="11">voids · grid · ledger · MPD</text>
    <text x="-60" y="20" fill="#e5e7eb" font-size="11">plus the "Thought for 22s" line</text>
  </g>

  <!-- Arrow from prompt to response -->
  <g transform="translate(400,140)">
    <line x1="-40" y1="10" x2="40" y2="10" stroke="#facc15" stroke-width="4" marker-end="url(#arrowHead)"/>
    <text x="0" y="28" text-anchor="middle" fill="#facc15" font-size="11" font-weight="bold">EACH ROUND</text>
  </g>

  <text x="400" y="230" text-anchor="middle" fill="#e5e7eb" font-size="12">
    JSON export just stacks these bricks: prompt, response, thinking, and MPD text.
  </text>
</svg>

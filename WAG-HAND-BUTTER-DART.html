<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hand Butter DART</title>
<meta name="theme-color" content="#111315">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: the Director model DART was built on. Stage and Cast on top, Score below,
   Inspector at the side. Phones: stage on top, one panel at a time below it. */
:root{
  color-scheme:dark;
  --bg:#0e1012; --panel:#16191c; --panel2:#1c2024; --line:#2a2f35; --line2:#3a4048;
  --ink:#dde1e4; --dim:#848d95; --faint:#5a6168;
  --sel:#ffd23f; --head:#19e6c8; --x:#3b82f6; --o:#ff2e2e; --key:#c8402f;
  --paper:#ffffff; --surround:#2a2d31;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 var(--sans);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;padding:0}
:focus-visible{outline:1px solid var(--sel);outline-offset:1px}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

#app{position:fixed;inset:0;display:grid;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:40px minmax(0,1fr) 36px minmax(0,38%);
  grid-template-areas:"bar bar" "stage cast" "trans insp" "score insp";gap:1px;background:var(--line)}
#app.mobile{grid-template-columns:minmax(0,1fr);grid-template-rows:40px minmax(0,44%) 36px 32px minmax(0,1fr);grid-template-areas:"bar" "stage" "trans" "tabs" "dock"}
#app.mobile #score,#app.mobile #cast,#app.mobile #insp{grid-area:dock}
#bar{grid-area:bar}#stageWrap{grid-area:stage}#trans{grid-area:trans}#score{grid-area:score}#cast{grid-area:cast}#insp{grid-area:insp}#tabs{grid-area:tabs}
#app:not(.mobile) #tabs{display:none}

/* toolbar */
#bar{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
.brand{flex:none;font:600 11px var(--mono);letter-spacing:.14em;color:var(--sel);margin-right:8px;white-space:nowrap}
.tb{flex:none;height:30px;min-width:30px;padding:0 7px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--dim);border:1px solid transparent;font-size:12px;white-space:nowrap}
.tb:hover{color:var(--ink);background:var(--panel2)}
.tb.on{color:var(--ink);border-color:var(--line2);background:var(--panel2)}
.tb:disabled{opacity:.35;cursor:default}
.tsep{flex:none;width:1px;height:20px;background:var(--line);margin:0 5px}
.sw{width:14px;height:14px;border:1px solid var(--line2)}
.tb.on .sw{outline:1px solid var(--sel);outline-offset:1px}
#statusTxt{flex:1;min-width:120px;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
#statusTxt b{color:var(--ink);font-weight:500}
#fileMenu{position:fixed;z-index:80;min-width:220px;background:var(--panel2);border:1px solid var(--line2);display:flex;flex-direction:column;padding:4px 0;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#fileMenu button{height:32px;padding:0 14px;text-align:left;font-size:12.5px;display:flex;justify-content:space-between;gap:20px}
#fileMenu button:hover{background:#2a3036}
#fileMenu button kbd{font:11px var(--mono);color:var(--dim)}
#fileMenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* stage */
#stageWrap{position:relative;background:var(--surround);overflow:hidden;touch-action:none}
#stageCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#stageTag{position:absolute;left:8px;top:6px;font:11px var(--mono);color:#b9c0c6;pointer-events:none}
#stageHint{position:absolute;left:8px;bottom:6px;right:8px;font-size:12px;color:#c9cfd4;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* transport */
#trans{display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--panel);overflow-x:auto;scrollbar-width:none}
#trans::-webkit-scrollbar{display:none}
#frameNo{flex:none;width:64px;height:26px;background:var(--bg);border:1px solid var(--line);text-align:center;font:12px var(--mono)}
.tlab{flex:none;font:11px var(--mono);color:var(--dim);white-space:nowrap;padding:0 4px}
#fpsSel{flex:none;height:26px;background:var(--bg);border:1px solid var(--line);font:12px var(--mono);padding:0 4px}
#secLab{flex:1;min-width:0;text-align:right;font:11px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}

/* panels */
.panel{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.ph{flex:none;height:30px;display:flex;align-items:center;gap:2px;padding:0 6px 0 10px;border-bottom:1px solid var(--line)}
.ph b{flex:1;font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .tb{height:24px;font-size:11.5px}
#tabs{display:flex;background:var(--panel)}
#tabs button{flex:1;font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent}
#tabs button.on{color:var(--ink);border-bottom-color:var(--sel)}

/* score */
#scoreBox{flex:1;min-height:0;position:relative;touch-action:none}
#scoreCv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* cast */
#castGrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:4px;padding:6px;align-content:start;overscroll-behavior:contain}
.cm{position:relative;border:1px solid var(--line);background:var(--panel2);text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;touch-action:pan-y}
.cm.sel{border-color:var(--sel)}
.cm .th{aspect-ratio:4/3;background:#0b0d0f center/cover no-repeat;position:relative;display:grid;place-items:center;color:var(--faint)}
.cm .th em{position:absolute;left:2px;top:2px;font:9.5px var(--mono);font-style:normal;color:var(--ink);background:rgba(0,0,0,.7);padding:0 3px}
.cm .nm{display:block;font-size:10.5px;padding:2px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm .ty{display:block;font:9px var(--mono);color:var(--dim);padding:0 4px 3px;text-transform:uppercase;letter-spacing:.06em}
.cm .ty i{display:inline-block;width:7px;height:7px;margin-right:4px;vertical-align:0}
.cm.used::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;background:var(--head)}

/* inspector */
#inspBody{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px;overscroll-behavior:contain}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.f input[type=text],.f input[type=number],.f select,.f textarea{background:var(--bg);border:1px solid var(--line);padding:5px 7px;font-size:13px;width:100%;min-width:0}
.f textarea{min-height:58px;resize:vertical;font-size:12.5px;line-height:1.45}
.f input[type=range]{width:100%;accent-color:var(--sel)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ih{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--sel)}
.isub{font-size:12px;color:var(--dim)}
.isub a{color:var(--head)}
.row{display:flex;flex-wrap:wrap;gap:5px}
.btn{height:28px;padding:0 10px;border:1px solid var(--line2);font-size:12px;background:var(--panel2);white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.pri{border-color:var(--sel);color:var(--sel)}
.btn.warn{color:#ff7b6b;border-color:#5a2a26}
.chk{display:flex;align-items:center;gap:6px;font-size:12px}
.chk input{accent-color:var(--sel)}
hr.s{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}

/* sheet */
#veil{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
#sheet{width:min(860px,100%);max-height:min(720px,100%);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);box-shadow:0 16px 48px rgba(0,0,0,.6)}
#sheet .ph{height:38px}
#sheetBody{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.card{border:1px solid var(--line);background:var(--panel2);text-align:left;display:flex;flex-direction:column}
.card:hover{border-color:var(--sel)}
.card .th{aspect-ratio:4/3;background:#0b0d0f center/cover no-repeat;position:relative}
.card .th span{position:absolute;right:2px;bottom:2px;font:9.5px var(--mono);background:rgba(0,0,0,.75);padding:0 3px;color:var(--dim)}
.card .tt{font-size:11.5px;padding:4px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ts{font-size:10px;padding:0 6px 5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#search{background:var(--bg);border:1px solid var(--line);padding:7px 9px;font-size:15px;width:100%}
pre.txt{margin:0;white-space:pre-wrap;font:12px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);padding:10px;user-select:text;max-height:56vh;overflow:auto}
#capV{width:100%;max-height:46vh;background:#000;object-fit:contain;transform:scaleX(-1)}

#ghost{position:fixed;z-index:95;width:72px;height:54px;border:1px solid var(--sel);background:#000 center/cover no-repeat;pointer-events:none;transform:translate(-50%,-50%);opacity:.9;font:10px var(--mono);color:var(--sel);display:grid;place-items:center}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:var(--panel2);border:1px solid var(--line2);padding:7px 12px;font-size:12.5px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 24px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast button{color:var(--sel);font-weight:500}
#handCv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}
#cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
#now{position:absolute;right:8px;top:26px;bottom:26px;width:216px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;scrollbar-width:none;z-index:2}
#now::-webkit-scrollbar{display:none}
#now .nh{font:10px var(--mono);letter-spacing:.1em;color:#c9cfd4;text-transform:uppercase;padding:3px 6px;background:rgba(14,16,18,.86)}
.nw{display:grid;grid-template-columns:44px minmax(0,1fr) 22px;gap:7px;align-items:center;padding:3px 4px;background:rgba(22,25,28,.9);border:1px solid transparent;cursor:ew-resize;touch-action:none;user-select:none;-webkit-user-select:none}
.nw.sel{border-color:var(--sel)}
.nw.off{opacity:.45}
.nw canvas{width:44px;height:33px;background:#fff;display:block}
.nw .nm{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw .op{display:block;height:3px;background:#2a2f35;margin-top:5px}
.nw .op b{display:block;height:100%;background:var(--head)}
.nw .eye{width:22px;height:22px;display:grid;place-items:center;color:var(--dim);cursor:pointer}
.nw .eye:hover{color:var(--ink)}
#readout{position:fixed;z-index:96;pointer-events:none;background:#000;color:var(--sel);font:11px var(--mono);padding:2px 6px;border:1px solid var(--sel);transform:translate(14px,-160%);white-space:nowrap}
#histPop{position:fixed;z-index:85;width:min(428px,calc(100% - 16px));background:var(--panel2);border:1px solid var(--line2);padding:10px;display:flex;flex-direction:column;gap:9px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#histPop input{width:100%;accent-color:var(--sel)}
#previewBar{position:absolute;left:8px;right:8px;top:26px;display:flex;gap:8px;align-items:center;background:#000;border:1px solid var(--sel);padding:5px 8px;font-size:12px;z-index:3}
#previewBar b{flex:1;color:var(--sel);font-weight:500}
.nt{border-left:3px solid var(--line);padding:2px 0 2px 8px;display:flex;flex-direction:column;gap:4px}
.nt.on{border-left-color:var(--sel)}
.nt .nh2{text-align:left;font:11px var(--mono);color:var(--dim)}
.nt.on .nh2{color:var(--ink)}
.nt textarea{background:var(--bg);border:1px solid var(--line);padding:5px 7px;font-size:12.5px;min-height:40px;resize:vertical;width:100%}
.ph .seg{display:flex;border:1px solid var(--line2);flex:none}
.ph .seg button{height:22px;padding:0 9px;font:10.5px var(--mono);letter-spacing:.06em;color:var(--dim)}
.ph .seg button.on{background:var(--line2);color:var(--ink)}
#lvLab{flex:none;font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-right:4px}
#inspBody.locked,#castGrid.locked{pointer-events:none;opacity:.45}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <span class="brand">DART · HAND BUTTER</span>
    <button class="tb" id="bFile">File</button>
    <button class="tb" id="bUndo" title="Undo (Ctrl+Z)"><svg class="i" viewBox="0 0 16 16"><path d="M5 4 2 7l3 3"/><path d="M2.5 7H10a4 4 0 0 1 0 8H7"/></svg></button>
    <button class="tb" id="bRedo" title="Redo (Ctrl+Shift+Z)"><svg class="i" viewBox="0 0 16 16"><path d="m11 4 3 3-3 3"/><path d="M13.5 7H6a4 4 0 0 0 0 8h3"/></svg></button>
    <button class="tb" id="bHist" title="Scrub back through every change in this session">History</button>
    <span class="tsep"></span>
    <button class="tb on" data-tool="select" title="Select and move sprites (V)"><svg class="i" viewBox="0 0 16 16"><path d="M3 2v11l3-3 2.5 5 2-1-2.5-5H12z"/></svg></button>
    <button class="tb" data-tool="pen" title="Draw on the selected sprite (P)"><svg class="i" viewBox="0 0 16 16"><path d="M11 2.5l2.5 2.5L6 12.5 2.5 13.5 3.5 10z"/><path d="M9.5 4l2.5 2.5"/></svg></button>
    <button class="tb" data-tool="erase" title="Erase marks on the selected sprite (E)"><svg class="i" viewBox="0 0 16 16"><path d="M6 14h8"/><path d="M2.5 10.5 9 4l4 4-5.5 5.5H5z"/></svg></button>
    <button class="tb" data-tool="use" title="Use: play the games on the stage (U)"><svg class="i" viewBox="0 0 16 16"><path d="M6 8V3.2a1.2 1.2 0 0 1 2.4 0V8"/><path d="M8.4 7.4V6a1.2 1.2 0 0 1 2.4 0v1.6"/><path d="M10.8 7.6a1.2 1.2 0 0 1 2.4 0V10a5 5 0 0 1-5 5H8a4 4 0 0 1-3.4-1.9L2.6 9.8a1.2 1.2 0 0 1 2-1.3L6 10"/></svg></button>
    <span class="tsep"></span>
    <span id="penOpts" style="display:flex;gap:2px"></span>
    <div id="statusTxt"></div>
    <button class="tb" id="bHands" title="Camera hands. Right hand: pinch acts like the mouse; thumbs-up plays and stops. Left hand: pinch and move sideways to scrub time, or to turn the depth view.">Hands</button>
  </div>

  <div id="stageWrap"><canvas id="stageCv"></canvas><div id="stageTag"></div><div id="stageHint"></div><div id="now" hidden></div><div id="previewBar" hidden></div></div>

  <div id="trans">
    <button class="tb" id="tStart" title="Rewind (Home)"><svg class="i" viewBox="0 0 16 16"><path d="M3 3v10"/><path d="M13 3 6 8l7 5z"/></svg></button>
    <button class="tb" id="tBack" title="Back one frame (Left)"><svg class="i" viewBox="0 0 16 16"><path d="M11 3 5 8l6 5z"/></svg></button>
    <button class="tb" id="tPlay" title="Play / stop (Space)"><svg class="i" viewBox="0 0 16 16"><path d="M4 2.5v11L13 8z"/></svg></button>
    <button class="tb" id="tFwd" title="Forward one frame (Right)"><svg class="i" viewBox="0 0 16 16"><path d="m5 3 6 5-6 5z"/></svg></button>
    <input id="frameNo" type="text" inputmode="numeric" aria-label="Frame">
    <span class="tlab" id="lenLab"></span>
    <select id="fpsSel" aria-label="Frames per second"><option>4</option><option>6</option><option>8</option><option>12</option><option>15</option><option>24</option><option>30</option></select>
    <span class="tlab">fps</span>
    <button class="tb" id="tLoop" title="Loop the movie">Loop</button>
    <span class="tsep"></span>
    <button class="tb" id="tView" title="Spread the channels in depth (D)">Depth</button>
    <button class="tb" id="tLayers" title="List the layers on this frame, front first; drag one sideways to change its opacity">Layers</button>
    <button class="tb" id="tPin" title="Pin this version as A, then keep working and compare">Pin A</button>
    <button class="tb" id="tWipe" title="Wipe between pinned A and now" disabled>Wipe A|now</button>
    <span id="secLab"></span>
  </div>

  <div id="tabs"><button data-tab="score" class="on">Score</button><button data-tab="cast">Cast</button><button data-tab="insp">Inspector</button></div>

  <section class="panel" id="score">
    <div class="ph"><b>Score</b><span id="lvLab"></span>
      <button class="tb" id="zOut" title="Narrower frames"><svg class="i" viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
      <button class="tb" id="zIn" title="Wider frames"><svg class="i" viewBox="0 0 16 16"><path d="M3 8h10M8 3v10"/></svg></button>
      <button class="tb" id="bScoreText" title="Every channel, sprite, note and prompt as text">Score text</button>
    </div>
    <div id="scoreBox"><canvas id="scoreCv"></canvas></div>
  </section>

  <section class="panel" id="cast">
    <div class="ph"><b>Cast</b>
      <button class="tb" id="bImport" title="Import a Secondhand Motion shot">Shot</button>
      <button class="tb" id="bClip" title="Add a WarGames clip">Clip</button>
      <button class="tb" id="bNew" title="New drawing, text or game">New</button>
      <button class="tb" id="bCapture" title="Capture footage from the camera">Capture</button>
    </div>
    <div id="castGrid"></div>
  </section>

  <section class="panel" id="insp">
    <div class="ph"><b id="inspTitle">Inspector</b><span class="seg"><button data-im="sel" class="on">Selection</button><button data-im="notes">Notes</button></span></div>
    <div id="inspBody"></div>
  </section>
</div>
<div id="fileMenu" hidden></div>
<div id="veil" hidden><div id="sheet"><div class="ph"><b id="sheetTitle"></b><button class="btn" id="sheetClose">Close</button></div><div id="sheetBody"></div></div></div>
<div id="ghost" hidden></div>
<div id="toast" hidden></div>
<div id="readout" hidden></div>
<div id="histPop" hidden></div>
<canvas id="handCv"></canvas>
<video id="cam" playsinline muted></video>

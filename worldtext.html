<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Shield of Achilles (Iliad XVIII.478–608) — 3D Worldtext Cinema</title>
<style>
  :root {
    --bg: #070605;
    --ink: #f4eee1;
    --ink-dim: #b5a892;
    --gold: #e8b856;
    --gold-bright: #ffe294;
    --green: #4ade80;
    --rule: rgba(232, 184, 86, 0.22);
    --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --greek: "New Athena Unicode", "Gentium Plus", "Palatino Linotype", "Iowan Old Style", Georgia, serif;
    --mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* ==========================================================================
     FULLSCREEN 3D STAGE (100% OF VIEWPORT)
     ========================================================================== */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 45%, #1c1711 0%, #060504 85%);
    overflow: hidden;
  }

  #anvilCanvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }
  #anvilCanvas:active { cursor: grabbing; }

  /* ==========================================================================
     SLIM 38PX TOP CONTROL BAR (MINIMAL, NON-INTRUSIVE)
     ========================================================================== */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: linear-gradient(180deg, rgba(8, 7, 5, 0.86) 0%, rgba(8, 7, 5, 0.45) 80%, transparent 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    gap: 10px;
    z-index: 30;
  }

  .top-left {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .btn-play {
    background: var(--gold);
    color: #090806;
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .btn-play:hover { background: var(--gold-bright); }

  .btn-audio-unlock {
    background: rgba(232, 184, 86, 0.16);
    color: var(--gold-bright);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 3px 8px;
    font-family: var(--mono);
    font-size: 9.5px;
    cursor: pointer;
    white-space: nowrap;
    display: none;
  }
  .btn-audio-unlock.visible { display: inline-flex; align-items: center; gap: 4px; }

  .scene-select {
    background: rgba(18, 15, 11, 0.85);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 3px 7px;
    font-family: var(--serif);
    font-size: 12px;
    cursor: pointer;
    max-width: 270px;
  }

  /* Center Scrubber */
  .top-center {
    flex: 1;
    max-width: 440px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .time-lbl {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--ink-dim);
    white-space: nowrap;
  }

  .scrub-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .scrub-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--gold-bright);
    cursor: pointer;
  }

  .top-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pill-btn {
    background: rgba(18, 15, 11, 0.78);
    color: var(--ink-dim);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 3px 8px;
    font-family: var(--mono);
    font-size: 9.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .pill-btn:hover, .pill-btn.active {
    color: var(--gold-bright);
    border-color: var(--gold);
    background: rgba(232, 184, 86, 0.16);
  }
  .pill-btn.critic-pill {
    color: var(--green);
    border-color: rgba(74, 222, 128, 0.35);
  }

  /* Minimal corner watermark for ?render=1 MP4 mode */
  .render-watermark {
    display: none;
    position: absolute;
    top: 18px;
    left: 26px;
    font-family: var(--serif);
    font-size: 15px;
    color: rgba(244, 238, 225, 0.72);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    z-index: 20;
    pointer-events: none;
  }

  /* ==========================================================================
     CLEAN CINEMA SUBTITLE AT BOTTOM (1 GREEK PHRASE + 1 SPOKEN SENTENCE)
     ========================================================================== */
  .subtitle-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 12px 32px 16px;
    background: linear-gradient(0deg, rgba(5, 4, 3, 0.82) 0%, rgba(5, 4, 3, 0.38) 68%, transparent 100%);
    text-align: center;
    z-index: 25;
    pointer-events: none;
  }

  .sub-greek {
    font-family: var(--greek);
    font-size: 13px;
    color: rgba(232, 184, 86, 0.85);
    margin-bottom: 3px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sub-english {
    font-size: 18.5px;
    line-height: 1.35;
    color: var(--ink);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.98), 0 0 2px rgba(0, 0, 0, 0.95);
    max-width: 980px;
    margin: 0 auto;
    pointer-events: auto;
  }

  .sub-w {
    display: inline-block;
    padding: 0 2px;
    border-radius: 3px;
    cursor: pointer;
    transition: color 0.08s ease;
  }
  .sub-w.forged { color: rgba(244, 238, 225, 0.92); }
  .sub-w.unforged { color: rgba(181, 168, 146, 0.48); }
  .sub-w.active {
    color: var(--gold-bright);
    font-weight: 700;
    text-shadow: 0 0 12px rgba(255, 226, 148, 0.55), 0 1px 3px #000;
  }

  /* ==========================================================================
     OPTIONAL SLIDE-OVER DRAWER (HIDDEN BY DEFAULT SO SCREEN IS NOT COVERED!)
     ========================================================================== */
  .drawer {
    position: absolute;
    top: 40px;
    right: 0;
    bottom: 0;
    width: 420px;
    max-width: 92vw;
    background: rgba(14, 12, 9, 0.95);
    border-left: 1px solid var(--rule);
    backdrop-filter: blur(10px);
    transform: translateX(100%);
    transition: transform 0.22s ease;
    z-index: 40;
    display: flex;
    flex-direction: column;
    user-select: text;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-tabs {
    display: flex;
    border-bottom: 1px solid var(--rule);
    padding: 0 10px;
    background: rgba(8, 7, 5, 0.9);
  }
  .drawer-tab {
    background: transparent;
    color: var(--ink-dim);
    border: none;
    border-bottom: 2px solid transparent;
    padding: 9px 10px;
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .drawer-tab.active {
    color: var(--gold-bright);
    border-bottom-color: var(--gold-bright);
    font-weight: 700;
  }
  .drawer-close {
    margin-left: auto;
    background: transparent;
    border: none;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 14px;
    padding: 0 8px;
    cursor: pointer;
  }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 40px;
  }
  .d-panel { display: none; }
  .d-panel.active { display: block; }

  .d-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .d-card.active {
    border-color: var(--gold-bright);
    background: rgba(232, 184, 86, 0.07);
  }
  .d-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
    gap: 8px;
  }
  .d-card-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .d-badge {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--green);
    border: 1px solid rgba(74, 222, 128, 0.35);
    padding: 1px 6px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .d-text {
    font-size: 12.5px;
    line-height: 1.48;
    color: var(--ink-dim);
  }
  .d-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .d-chip {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 2px 5px;
  }

  /* ==========================================================================
     RENDER MODE (?render=1) — ULTRA-CLEAN 1080P FILM FRAME
     ========================================================================== */
  body.render-mode .top-bar,
  body.render-mode .drawer {
    display: none !important;
  }
  body.render-mode .render-watermark {
    display: block;
  }
  body.render-mode .subtitle-bar {
    padding: 14px 48px 22px;
  }
  body.render-mode .sub-greek { font-size: 14.5px; }
  body.render-mode .sub-english { font-size: 21px; }
</style>
</head>
<body>

<audio id="rhapsodeAudio" preload="auto" src="achilles/audio/ACH-WORLD-SHIELD.mp3"></audio>

<main class="stage" id="anvilStage">
  <canvas id="anvilCanvas"></canvas>

  <!-- Minimal Corner Label for 1080p MP4 Render -->
  <div id="renderWatermark" class="render-watermark">Iliad XVIII.478–482 · I. The Crucible &amp; Fivefold Rim</div>

  <!-- Slim 40px Top Control Bar -->
  <header class="top-bar">
    <div class="top-left">
      <button id="btnPlay" class="btn-play" title="Play / Pause (Space)">
        <span id="playIcon">⏸</span> <span id="playLabel">PLAYING</span>
      </button>
      <button id="btnAudioUnlock" class="btn-audio-unlock" title="Unmute Homeric Rhapsode Voice">
        🔊 Enable Voice
      </button>
      <select id="sceneSelect" class="scene-select" title="Jump to Homeric Scene"></select>
    </div>

    <div class="top-center">
      <span id="timeDisplay" class="time-lbl">0:00 / 4:06</span>
      <input id="scrubSlider" class="scrub-slider" type="range" min="0" max="1000" value="0" step="1">
    </div>

    <div class="top-right">
      <button id="btnCamDiorama" class="pill-btn active" onclick="setCameraSubjectMode('diorama')">Scene View</button>
      <button id="btnCamMaster" class="pill-btn" onclick="setCameraSubjectMode('master')">Full Shield</button>
      <button id="btnCriticDrawer" class="pill-btn critic-pill" onclick="toggleDrawer('critic')">✓ Sight=Speech (11/11)</button>
      <button id="btnTextDrawer" class="pill-btn" onclick="toggleDrawer('text')">📖 Poem</button>
    </div>
  </header>

  <!-- Clean Movie Subtitle Bar (Bottom) -->
  <footer class="subtitle-bar">
    <div id="subGreek" class="sub-greek">«Ποίει δὲ πρώτιστα σάκος μέγα τε στιβαρόν τε» · Iliad 18.478–482</div>
    <div id="subEnglish" class="sub-english"></div>
  </footer>

  <!-- Collapsible Drawer (Closed by Default so 3D View is 100% Unobstructed) -->
  <aside id="sideDrawer" class="drawer">
    <div class="drawer-tabs">
      <button id="dTabCritic" class="drawer-tab active" onclick="switchDrawerTab('critic')">✓ Sight=Speech Critic</button>
      <button id="dTabText" class="drawer-tab" onclick="switchDrawerTab('text')">Homeric Text (§I–§XI)</button>
      <button class="drawer-close" onclick="closeDrawer()" title="Close">✕</button>
    </div>
    <div class="drawer-body">
      <div id="dPanelCritic" class="d-panel active"></div>
      <div id="dPanelText" class="d-panel"></div>
    </div>
  </aside>
</main>

<script src="achilles/kits/shield-dioramas-bundle.js"></script>
<script src="films/shield-of-achilles/shared/lego3d.js"></script>
<script src="achilles/wordtext-timeline.js"></script>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const IS_RENDER_MODE = params.get('render') === '1';
  const IS_CAPTURE_MODE = params.get('capture') === '1';
  if (IS_RENDER_MODE) {
    document.body.classList.add('render-mode');
  }

  const TIMELINE = window.HOMERIC_WORDTEXT_TIMELINE;
  if (!TIMELINE) return;

  // ---------------------------------------------------------------------------
  // VERIFIED SIGHT <-> SPEECH ENARGEIA SCENE MAP (11 HOMERIC MOVEMENTS)
  // ---------------------------------------------------------------------------
  const ENARGEIA_SCENE_MAP = {
    0: {
      slug: 'shield-diorama-forge',
      altSlug: 'shield-frame',
      altSplitFrac: 0.52,
      dioramaPieces: 1748,
      eye0: [-235, 315, 650], eye1: [215, 245, 585],
      target0: [-15, 95, -10], target1: [15, 90, -10],
      altEye0: [-260, 560, 880], altEye1: [260, 480, 780],
      altTarget0: [0, 45, 0], altTarget1: [0, 40, 0],
      fov: 30,
      torchCol: [1.0, 0.55, 0.16],
      sightDetail: 'Hephaestus hammers at the bronze anvil before the 20 bellows and Silver-Footed Thetis (shield-diorama-forge), then laminates the 5 concentric metallic rings (shield-frame).',
      verifiedParts: ['Hephaestus & Anvil Sparks', 'Silver-Footed Thetis', '20 Crucible Bellows', '5 Concentric Metallic Folds']
    },
    1: {
      slug: 'shield-m0',
      dioramaPieces: 376,
      eye0: [-175, 345, 430], eye1: [175, 295, 400],
      target0: [-10, 122, -20], target1: [10, 124, -20],
      fov: 29,
      torchCol: [1.0, 0.84, 0.38],
      sightDetail: 'Central Omphalos Boss (shield-m0): Earth, Sky, Sea, Golden Sun (Helios), Silver Full Moon (Selene), Pleiades, Hyades, Orion, and the Great Bear revolving on the central turntable.',
      verifiedParts: ['Golden Sun (Helios)', 'Silver Moon (Selene)', 'Earth & Sea Boss', 'Pleiades, Orion & Bear']
    },
    2: {
      slug: 'shield-diorama-wedding',
      dioramaPieces: 3475,
      eye0: [-250, 335, 705], eye1: [230, 255, 625],
      target0: [-25, 110, -15], target1: [25, 98, -10],
      fov: 30,
      torchCol: [1.0, 0.62, 0.18],
      sightDetail: 'City at Peace Bridal Procession (shield-diorama-wedding): brides led beneath blazing pine-torches, whirling youths on turntables, flute & lyre players, and women marveling in doorways.',
      verifiedParts: ['3 Classical Townhouses', 'Bridal Torch Procession', 'Whirling Dancers', 'Doorway Women']
    },
    3: {
      slug: 'shield-diorama-agora',
      dioramaPieces: 2119,
      eye0: [245, 345, 695], eye1: [-215, 245, 595],
      target0: [20, 100, -15], target1: [-20, 92, -10],
      fov: 29,
      torchCol: [1.0, 0.85, 0.35],
      sightDetail: 'The Agora Law-Court (shield-diorama-agora): Claimant and Defendant debating inside the Sacred Circle of polished white stones, seated Elders with staves, and Two Talents of Gold in the center.',
      verifiedParts: ['Two Talents of Gold (δύω τάλαντα)', 'Claimant & Defendant', 'Seated Elders on White Stones', 'Heralds w/ Sceptres']
    },
    4: {
      slug: 'shield-diorama-ambush',
      dioramaPieces: 1957,
      eye0: [-245, 335, 695], eye1: [230, 240, 605],
      target0: [-25, 105, -15], target1: [25, 95, -10],
      fov: 30,
      torchCol: [1.0, 0.42, 0.18],
      sightDetail: 'City at War & River Ambush (shield-diorama-ambush): besieged wall, 1.6× tall golden Ares and Pallas Athena, two piping herdsmen at the river ford, and ambushers loosing 3D arrows.',
      verifiedParts: ['Golden Ares & Athena', 'Besieged Wall', 'River Ford & 2 Herdsmen', 'Ambushers & 3D Arrows']
    },
    5: {
      slug: 'shield-m3',
      dioramaPieces: 437,
      eye0: [-760, 410, 310], eye1: [-140, 360, 260],
      target0: [-385, 96, -245], target1: [-355, 96, -265],
      fov: 32,
      torchCol: [1.0, 0.80, 0.30],
      sightDetail: 'The Thrice-Ploughed Field (shield-m3): dark-earth furrows cut into golden studs (μελαίνετο δὲ χρυσός), yoked oxen teams, and the headland steward offering a golden wine-cup.',
      verifiedParts: ['Darkening Furrows in Gold', 'Yoked Oxen & Ploughs', 'Turning Ploughmen', 'Headland Wine-Goblet']
    },
    6: {
      slug: 'shield-diorama-harvest',
      dioramaPieces: 1673,
      eye0: [240, 340, 700], eye1: [-220, 250, 620],
      target0: [20, 102, -15], target1: [-20, 92, -10],
      fov: 30,
      torchCol: [1.0, 0.82, 0.32],
      sightDetail: 'The King’s Harvest (shield-diorama-harvest): sickle reapers cutting golden wheat, three sheaf-binders, boys gathering grain, heralds preparing the ox-feast, and the Silent King with his sceptre.',
      verifiedParts: ['Silent King w/ Sceptre', 'Sickle Reapers', '3 Sheaf-Binders & Boys', 'Ox Feast Beneath Oak']
    },
    7: {
      slug: 'shield-diorama-vineyard',
      dioramaPieces: 1809,
      eye0: [-190, 235, 500], eye1: [170, 250, 510],
      target0: [-25, 82, -45], target1: [25, 84, -40],
      fov: 29,
      torchCol: [0.95, 0.72, 0.95],
      sightDetail: 'The Golden Vineyard (shield-diorama-vineyard): golden vines with black grapes on silver poles, blue kyanos trench, tin fence, and the boy in the midst singing the Linus-song on his phorminx.',
      verifiedParts: ['Boy w/ Clear-Toned Phorminx', 'Golden Vines & Black Grapes', 'Silver Poles', 'Blue Kyanos Trench & Tin Fence']
    },
    8: {
      slug: 'shield-diorama-cattle',
      dioramaPieces: 2168,
      eye0: [-240, 335, 705], eye1: [225, 245, 615],
      target0: [-25, 100, -15], target1: [25, 92, -10],
      fov: 30,
      torchCol: [1.0, 0.76, 0.28],
      sightDetail: 'Cattle & Two Lions (shield-diorama-cattle): straight-horned cattle of gold and tin by the sounding river, four golden herdsmen, nine barking hounds, and two lions seizing the bellowing bull.',
      verifiedParts: ['2 Lions Seizing Bull', 'Gold & Tin Cattle', '4 Golden Herdsmen & 9 Dogs', 'River & Swaying Reeds']
    },
    9: {
      slug: 'shield-diorama-sheepfold',
      altSlug: 'shield-diorama-choros',
      altSplitFrac: 0.40,
      dioramaPieces: 1998,
      eye0: [-235, 335, 695], eye1: [185, 255, 625],
      target0: [-20, 100, -15], target1: [20, 92, -10],
      altEye0: [-250, 340, 680], altEye1: [240, 260, 590],
      altTarget0: [-20, 98, 10], altTarget1: [20, 92, 10],
      fov: 29,
      torchCol: [1.0, 0.80, 0.32],
      sightDetail: 'Mountain Sheepfold (shield-diorama-sheepfold) transitioning to Daedalus’s Choros in Knossos (shield-diorama-choros), where youths and maidens spin like a potter’s wheel around two tumblers.',
      verifiedParts: ['White Sheep Glen', 'Knossos Choros Wheel', 'Youths & Maidens', '2 Whirling Tumblers']
    },
    10: {
      slug: 'shield-of-achilles',
      dioramaPieces: 7522,
      eye0: [-220, 520, 820], eye1: [240, 760, 1040],
      target0: [0, 68, 0], target1: [0, 48, 0],
      fov: 32,
      torchCol: [0.65, 0.88, 1.0],
      sightDetail: 'River Oceanus (shield-of-achilles, 7,538 bricks): pulls back to the complete 5-ring circular Shield as the stream of Oceanus locks around the uttermost rim.',
      verifiedParts: ['River Oceanus Rim', 'All 5 Concentric Folds', 'Central Boss + 9 Rings', 'Complete 7,538-Brick Shield']
    }
  };

  const TOTAL_BRICKS = TIMELINE.totalBricks || 7538;
  const TOTAL_DUR = TIMELINE.totalDuration || 246.39;
  const SECTIONS = (TIMELINE.movements || TIMELINE.sections || []).map((m) => {
    const fMatch = String(m.formula || '').match(/^([^(«]+)\s*(.*)$/);
    const em = ENARGEIA_SCENE_MAP[m.secId] || ENARGEIA_SCENE_MAP[10];
    return {
      ...m,
      numeral: m.numeral || `§${m.roman || (m.secId + 1)}`,
      locus: m.locus || `Il. ${m.lines || ''}`,
      verbGreek: m.verbGreek || (fMatch ? fMatch[1].trim() : m.formula),
      enargeia: em
    };
  });

  const WORDS = [];
  let gWordIdx = 0;
  SECTIONS.forEach((sec) => {
    (sec.clauses || []).forEach((cl, cIdx) => {
      (cl.words || []).forEach((wObj) => {
        WORDS.push({
          wordIndex: gWordIdx++,
          word: wObj.w || wObj.word,
          t0: wObj.t0,
          t1: wObj.t1,
          u0: wObj.u0,
          u1: wObj.u1,
          b0: wObj.b0,
          b1: wObj.b1,
          secId: sec.secId,
          clauseIdx: cIdx
        });
      });
    });
  });

  // ---------------------------------------------------------------------------
  // POPULATE SCENE SELECTOR & OPTIONAL DRAWER
  // ---------------------------------------------------------------------------
  const sceneSelect = document.getElementById('sceneSelect');
  const dPanelCritic = document.getElementById('dPanelCritic');
  const dPanelText = document.getElementById('dPanelText');
  const wordSpanMap = new Map();
  const textCardMap = new Map();

  SECTIONS.forEach((sec) => {
    const opt = document.createElement('option');
    opt.value = sec.secId;
    opt.textContent = `${sec.numeral} · ${sec.title} (${sec.locus})`;
    sceneSelect.appendChild(opt);

    const em = sec.enargeia;
    const cCard = document.createElement('div');
    cCard.className = 'd-card';
    cCard.innerHTML = `
      <div class="d-card-head">
        <span class="d-card-title">${sec.numeral} · ${sec.title}</span>
        <span class="d-badge">✓ SIGHT = SPEECH</span>
      </div>
      <div class="d-text">${em.sightDetail}</div>
      <div class="d-chips">
        ${em.verifiedParts.map(p => `<span class="d-chip">✓ ${p}</span>`).join('')}
      </div>
    `;
    cCard.style.cursor = 'pointer';
    cCard.onclick = () => seekToTime(sec.t0 + 0.05, true);
    dPanelCritic.appendChild(cCard);

    const tCard = document.createElement('div');
    tCard.className = 'd-card';
    tCard.innerHTML = `
      <div class="d-card-head">
        <span class="d-card-title">${sec.numeral} · ${sec.locus}</span>
        <span class="d-badge">«${sec.verbGreek}»</span>
      </div>
      <div class="d-text" style="font-family:var(--greek);color:var(--gold);margin-bottom:6px;">${sec.greek}</div>
      <div class="d-text" id="d-prose-${sec.secId}" style="color:var(--ink);"></div>
    `;
    dPanelText.appendChild(tCard);
    textCardMap.set(sec.secId, tCard);

    const proseEl = tCard.querySelector(`#d-prose-${sec.secId}`);
    WORDS.filter(w => w.secId === sec.secId).forEach((w) => {
      const sp = document.createElement('span');
      sp.className = 'sub-w unforged';
      sp.textContent = w.word;
      sp.onclick = () => seekToTime(w.t0 + 0.02, true);
      proseEl.appendChild(sp);
      proseEl.appendChild(document.createTextNode(' '));
      wordSpanMap.set(w.wordIndex, sp);
    });
  });

  sceneSelect.addEventListener('change', () => {
    const sId = parseInt(sceneSelect.value, 10);
    const sec = SECTIONS.find(s => s.secId === sId);
    if (sec) seekToTime(sec.t0 + 0.05, true);
  });

  window.toggleDrawer = function(tab) {
    const dr = document.getElementById('sideDrawer');
    const isCurrentlyOpen = dr.classList.contains('open');
    const activeTab = document.getElementById('dPanelCritic').classList.contains('active') ? 'critic' : 'text';
    if (isCurrentlyOpen && activeTab === tab) {
      dr.classList.remove('open');
    } else {
      dr.classList.add('open');
      switchDrawerTab(tab);
    }
  };
  window.closeDrawer = function() {
    document.getElementById('sideDrawer').classList.remove('open');
  };
  window.switchDrawerTab = function(tab) {
    document.getElementById('dTabCritic').classList.toggle('active', tab === 'critic');
    document.getElementById('dTabText').classList.toggle('active', tab === 'text');
    document.getElementById('dPanelCritic').classList.toggle('active', tab === 'critic');
    document.getElementById('dPanelText').classList.toggle('active', tab === 'text');
  };

  // ---------------------------------------------------------------------------
  // INITIALIZE 3D WEBGL CINEMA ENGINE
  // ---------------------------------------------------------------------------
  const canvas = document.getElementById('anvilCanvas');
  const stageEl = document.getElementById('anvilStage');

  function resizeCanvas() {
    const dpr = IS_RENDER_MODE ? 1 : Math.min(window.devicePixelRatio || 1, 2);
    const w = IS_RENDER_MODE ? 1920 : stageEl.clientWidth;
    const h = IS_RENDER_MODE ? 1080 : stageEl.clientHeight;
    if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
    }
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const EngineClass = window.LegoCinemaEngine || (window.LegoCinema && window.LegoCinema.Engine);
  const engine = new EngineClass(canvas);

  let cameraSubjectMode = 'diorama';
  let userOrbitOverride = false;
  let orbitAz = 0.0, orbitEl = 0.48, orbitDist = 680;
  let orbitTarget = [0, 95, -10];
  let isDragging = false, dragMoved = false, lastMouseX = 0, lastMouseY = 0;

  canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    dragMoved = false;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
      dragMoved = true;
      userOrbitOverride = true;
    }
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    if (userOrbitOverride) {
      orbitAz += dx * 0.0065;
      orbitEl = Math.max(0.12, Math.min(1.38, orbitEl + dy * 0.0055));
    }
  });
  window.addEventListener('mouseup', () => { isDragging = false; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    userOrbitOverride = true;
    orbitDist = Math.max(220, Math.min(2200, orbitDist + e.deltaY * 0.75));
  }, { passive: false });

  window.setCameraSubjectMode = function(mode) {
    cameraSubjectMode = mode;
    userOrbitOverride = false;
    document.getElementById('btnCamDiorama').classList.toggle('active', mode === 'diorama');
    document.getElementById('btnCamMaster').classList.toggle('active', mode === 'master');
    stepAndRender(currentSec);
  };

  // ---------------------------------------------------------------------------
  // EVALUATE WORD-BY-WORD STATE & RENDER 3D SCENE
  // ---------------------------------------------------------------------------
  let currentSec = (IS_RENDER_MODE || IS_CAPTURE_MODE) ? 0.0 : 0.6;
  let lastActiveSecId = -1;
  let lastActiveWordIdx = -1;

  function findStateAtTime(t) {
    let activeSec = SECTIONS[0];
    for (let i = 0; i < SECTIONS.length; i++) {
      if (t >= SECTIONS[i].t0 && t <= SECTIONS[i].t1) {
        activeSec = SECTIONS[i];
        break;
      } else if (t > SECTIONS[i].t1) {
        activeSec = SECTIONS[i];
      }
    }

    let activeWord = WORDS[0] || null;
    for (let i = 0; i < WORDS.length; i++) {
      const w = WORDS[i];
      if (t >= w.t0 && t <= w.t1) {
        activeWord = w;
        break;
      } else if (t > w.t1) {
        activeWord = w;
      } else {
        break;
      }
    }

    let uBuildMaster = 0.0;
    let bricksBuilt = 0;
    if (activeWord) {
      const wDur = Math.max(0.01, activeWord.t1 - activeWord.t0);
      const wFrac = Math.max(0.0, Math.min(1.0, (t - activeWord.t0) / wDur));
      uBuildMaster = activeWord.u0 + (activeWord.u1 - activeWord.u0) * wFrac;
      bricksBuilt = Math.round(activeWord.b0 + (activeWord.b1 - activeWord.b0) * wFrac);
    }

    const sDur = Math.max(0.01, activeSec.t1 - activeSec.t0);
    const secFrac = Math.max(0.0, Math.min(1.0, (t - activeSec.t0) / sDur));

    return {
      sec: activeSec,
      word: activeWord,
      uBuildMaster: Math.max(0.0, Math.min(1.0, uBuildMaster)),
      bricksBuilt: Math.max(0, Math.min(TOTAL_BRICKS, bricksBuilt)),
      secFrac
    };
  }

  function updateUI(state, t) {
    const { sec, word } = state;

    const fmtTime = (s) => {
      const m = Math.floor(s / 60);
      const rem = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${rem}`;
    };
    document.getElementById('timeDisplay').textContent = `${fmtTime(t)} / ${fmtTime(TOTAL_DUR)}`;

    const slider = document.getElementById('scrubSlider');
    if (!slider.matches(':active')) {
      slider.value = Math.round((t / TOTAL_DUR) * 1000);
    }

    if (sec.secId !== lastActiveSecId) {
      lastActiveSecId = sec.secId;
      sceneSelect.value = String(sec.secId);
      document.getElementById('renderWatermark').textContent =
        `Iliad ${sec.lines || 'XVIII'} · ${sec.numeral} ${sec.title}`;
      document.getElementById('subGreek').textContent =
        `«${sec.verbGreek}» · Iliad ${sec.lines || '18.478–608'}`;

      textCardMap.forEach((c, id) => c.classList.toggle('active', id === sec.secId));
    }

    const activeWIdx = word ? word.wordIndex : 0;
    if (activeWIdx !== lastActiveWordIdx) {
      lastActiveWordIdx = activeWIdx;

      wordSpanMap.forEach((span, idx) => {
        if (idx === activeWIdx) span.className = 'sub-w active';
        else if (idx < activeWIdx) span.className = 'sub-w forged';
        else span.className = 'sub-w unforged';
      });

      const subEng = document.getElementById('subEnglish');
      const cIdx = word ? word.clauseIdx : 0;
      const clauseWords = WORDS.filter(w => w.secId === sec.secId && w.clauseIdx === cIdx);
      subEng.innerHTML = '';
      clauseWords.forEach((cw) => {
        const s = document.createElement('span');
        if (cw.wordIndex === activeWIdx) s.className = 'sub-w active';
        else if (cw.wordIndex < activeWIdx) s.className = 'sub-w forged';
        else s.className = 'sub-w unforged';
        s.textContent = cw.word;
        s.onclick = () => seekToTime(cw.t0 + 0.02, true);
        subEng.appendChild(s);
        subEng.appendChild(document.createTextNode(' '));
      });
    }
  }

  function lerp(a, b, u) { return a + (b - a) * u; }
  function lerp3(a, b, u) { return [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)]; }
  function easeInOut(u) { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); }

  function stepAndRender(t) {
    resizeCanvas();
    const state = findStateAtTime(t);
    const { sec, uBuildMaster, secFrac } = state;
    const em = sec.enargeia;

    let slug = em.slug;
    let eye0 = em.eye0, eye1 = em.eye1;
    let target0 = em.target0, target1 = em.target1;
    let subFrac = secFrac;

    if (cameraSubjectMode === 'master') {
      slug = 'shield-of-achilles';
    } else if (em.altSlug && secFrac >= (em.altSplitFrac || 0.5)) {
      const split = em.altSplitFrac || 0.5;
      slug = em.altSlug;
      eye0 = em.altEye0 || em.eye0;
      eye1 = em.altEye1 || em.eye1;
      target0 = em.altTarget0 || em.target0;
      target1 = em.altTarget1 || em.target1;
      subFrac = (secFrac - split) / Math.max(0.01, 1.0 - split);
    } else if (em.altSlug) {
      const split = em.altSplitFrac || 0.5;
      subFrac = secFrac / Math.max(0.01, split);
    }

    updateUI(state, t);

    let eye, target, fov, buildVal;

    // Start each scene at 0.78 (all architecture, furnace, 20 bellows & baseplate already present)
    // so the central characters & figures (0.78 -> 1.00) click down onto their studs at full 1:1 scale!
    const sceneBuildProgress = Math.min(1.0, 0.78 + easeInOut(Math.min(1.0, subFrac / 0.28)) * 0.22);

    const wObj = state.word;
    const wDur = wObj ? Math.max(0.05, wObj.t1 - wObj.t0) : 0.4;
    const wFrac = wObj ? Math.max(0.0, Math.min(1.0, (t - wObj.t0) / wDur)) : 0.0;
    const pulseR = wFrac * 380.0;
    const pulseAmp = Math.sin(wFrac * Math.PI) * 0.85;

    if (cameraSubjectMode === 'master') {
      const camDef = sec.cam || { target: [0, 48, 0], r: 1180, el: 0.62, az0: -0.25, az1: 0.25 };
      const az = lerp(camDef.az0, camDef.az1, easeInOut(secFrac));
      const dist = Math.max(820, camDef.r);
      const el = Math.max(0.52, camDef.el);
      target = camDef.target;
      eye = [
        target[0] + dist * Math.cos(el) * Math.sin(az),
        target[1] + dist * Math.sin(el),
        target[2] + dist * Math.cos(el) * Math.cos(az)
      ];
      fov = 32;
      buildVal = Math.max(0.15, uBuildMaster);
    } else if (userOrbitOverride && !IS_RENDER_MODE) {
      target = orbitTarget;
      eye = [
        target[0] + orbitDist * Math.cos(orbitEl) * Math.sin(orbitAz),
        target[1] + orbitDist * Math.sin(orbitEl),
        target[2] + orbitDist * Math.cos(orbitEl) * Math.cos(orbitAz)
      ];
      fov = em.fov || 30;
      buildVal = sceneBuildProgress;
    } else {
      const e = easeInOut(subFrac);
      const baseEye = lerp3(eye0, eye1, e);
      target = lerp3(target0, target1, e);

      const isFullRing = (slug === 'shield-of-achilles' || slug === 'shield-frame');
      const orbitArc = isFullRing ? Math.PI * 0.42 : 0.18;
      const orbitAngle = Math.sin((subFrac - 0.5) * Math.PI) * (orbitArc * 0.5);
      const dx = baseEye[0] - target[0];
      const dz = baseEye[2] - target[2];
      const ca = Math.cos(orbitAngle), sa = Math.sin(orbitAngle);
      eye = [
        target[0] + dx * ca - dz * sa,
        baseEye[1],
        target[2] + dx * sa + dz * ca
      ];
      fov = em.fov || 30;

      if (slug === 'shield-of-achilles' && sec.secId === 10) {
        buildVal = 0.90 + easeInOut(Math.min(1.0, subFrac / 0.80)) * 0.10;
      } else {
        buildVal = sceneBuildProgress;
      }
    }

    engine.render({
      slug,
      time: t * 1.15,
      build: buildVal,
      explode: 0.0,
      turnAngle: t * 0.42,
      pulseR,
      pulseAmp,
      fov,
      eye,
      target,
      torchCol: em.torchCol || [1.0, 0.75, 0.30],
      torchStr: 1.45,
      noHud: true
    });
  }

  window.renderFrame = function(sec) {
    isPlaying = false;
    currentSec = Math.max(0, Math.min(TOTAL_DUR, sec));
    stepAndRender(currentSec);
    return true;
  };

  // ---------------------------------------------------------------------------
  // ALWAYS-LIVE PLAYBACK ENGINE (AUTO-PLAYS IMMEDIATELY ON LOAD!)
  // ---------------------------------------------------------------------------
  const audioEl = document.getElementById('rhapsodeAudio');
  const btnPlay = document.getElementById('btnPlay');
  const playIcon = document.getElementById('playIcon');
  const playLabel = document.getElementById('playLabel');
  const btnAudioUnlock = document.getElementById('btnAudioUnlock');
  const scrubSlider = document.getElementById('scrubSlider');

  let isPlaying = !(IS_RENDER_MODE || IS_CAPTURE_MODE);
  let lastWallTime = performance.now();

  function updateTransportUI() {
    if (isPlaying) {
      playIcon.textContent = '⏸';
      playLabel.textContent = 'PAUSE';
    } else {
      playIcon.textContent = '▶';
      playLabel.textContent = 'PLAY';
    }
    if (isPlaying && audioEl.paused && !IS_RENDER_MODE && !IS_CAPTURE_MODE) {
      btnAudioUnlock.classList.add('visible');
    } else {
      btnAudioUnlock.classList.remove('visible');
    }
  }

  function tryStartAudio() {
    if (IS_RENDER_MODE || IS_CAPTURE_MODE || !isPlaying) return;
    if (Math.abs(audioEl.currentTime - currentSec) > 0.35) {
      try { audioEl.currentTime = currentSec; } catch (e) {}
    }
    audioEl.play().then(() => {
      updateTransportUI();
    }).catch(() => {
      updateTransportUI();
    });
  }

  function togglePlayPause() {
    isPlaying = !isPlaying;
    lastWallTime = performance.now();
    if (isPlaying) {
      if (currentSec >= TOTAL_DUR - 0.2) currentSec = 0.6;
      tryStartAudio();
    } else {
      audioEl.pause();
    }
    updateTransportUI();
  }

  btnPlay.addEventListener('click', togglePlayPause);
  btnAudioUnlock.addEventListener('click', () => {
    isPlaying = true;
    tryStartAudio();
  });

  // Unlock voice automatically on first click/keydown anywhere if browser deferred autoplay
  const unlockOnGesture = () => {
    if (isPlaying && audioEl.paused) {
      tryStartAudio();
    }
  };
  window.addEventListener('pointerdown', unlockOnGesture, { passive: true });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      togglePlayPause();
    } else {
      unlockOnGesture();
    }
  });

  scrubSlider.addEventListener('input', () => {
    const targetSec = (parseFloat(scrubSlider.value) / 1000) * TOTAL_DUR;
    currentSec = targetSec;
    try { audioEl.currentTime = targetSec; } catch (e) {}
    userOrbitOverride = false;
    lastWallTime = performance.now();
    stepAndRender(currentSec);
  });

  window.seekToTime = function(sec, autoPlay) {
    const clamped = Math.max(0, Math.min(TOTAL_DUR, sec));
    currentSec = clamped;
    try { audioEl.currentTime = clamped; } catch (e) {}
    userOrbitOverride = false;
    lastWallTime = performance.now();
    if (autoPlay) {
      isPlaying = true;
      tryStartAudio();
    }
    updateTransportUI();
    stepAndRender(currentSec);
  };

  if (!IS_RENDER_MODE) {
    tryStartAudio();
    updateTransportUI();
    function animate(now) {
      const dt = Math.min(0.1, Math.max(0, (now - lastWallTime) / 1000));
      lastWallTime = now;

      if (isPlaying) {
        if (!audioEl.paused) {
          currentSec = audioEl.currentTime;
        } else {
          currentSec += dt;
          if (currentSec >= TOTAL_DUR) currentSec = 0.6;
        }
      }
      stepAndRender(currentSec);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  } else {
    stepAndRender(0.0);
  }
})();
</script>
</body>
</html>

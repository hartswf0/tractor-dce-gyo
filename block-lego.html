<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forensic Reconstruction: Ontological Ancestor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* =========================================
           ◻ E1.11: Styling-System (THEME)
           → Components: CSS_Variable_Registry, Style_Attachment_Points
           → Features: Variable_Composition, Dynamic_Theming
           → Morphisms: setTheme(), style-injection
           ========================================= */
        :root {
            /* THEME variables from OLOG 2 */
            --bg: #0b1121;
            --panel: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --font-ui: 'JetBrains Mono', monospace;
            --font-code: 'JetBrains Mono', monospace;
            --func: #fbbf24; /* yellow-300 */
            --var: #60a5fa; /* blue-300 */
            --tag: #c084fc; /* purple-300 */
            --ctrl: #f87171; /* red-400 */
            --focus: rgba(245, 158, 11, 0.2); /* amber-500/20 */
            --up: rgba(34, 197, 94, 0.3); /* green-500/30 */
            --down: rgba(239, 68, 68, 0.3); /* red-500/30 */
            --wire-base: #475569; /* slate-600 */
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            
            /* E1.2.1 Background-Grid-Effect variables from OLOG 1 */
            --grid-color: #334155;
            
            /* Layout dimensions */
            --header-height: 64px;
            --console-height: 256px;
            --sidebar-width: 288px;
            --inspector-width: 320px;
        }
        
        /* THEME modes from OLOG 2 */
        [data-theme="parchment"] {
            --bg: #fefce8; /* yellow-50 */
            --panel: #fef9c3; /* yellow-100 */
            --surface: #fde047; /* yellow-300 */
            --border: #facc15; /* yellow-400 */
            --text-muted: #eab308; /* yellow-500 */
            --text-main: #713f12; /* yellow-900 */
            --wire-base: #facc15;
            --func: #dc2626; /* red-600 */
            --var: #2563eb; /* blue-600 */
            --tag: #7c3aed; /* purple-600 */
            --ctrl: #16a34a; /* green-600 */
            --focus: rgba(245, 158, 11, 0.4);
        }
        
        [data-theme="terminal"] {
            --bg: #171717; /* neutral-900 */
            --panel: #262626; /* neutral-800 */
            --surface: #404040; /* neutral-700 */
            --border: #525252; /* neutral-600 */
            --text-muted: #737373; /* neutral-500 */
            --text-main: #86efac; /* green-200 */
            --wire-base: #22c55e; /* green-500 */
            --func: #fde047; /* yellow-300 */
            --var: #93c5fd; /* blue-300 */
            --tag: #d8b4fe; /* purple-300 */
            --ctrl: #fca5a5; /* red-300 */
            --focus: rgba(34, 197, 94, 0.3);
        }
        
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 0px;
                --inspector-width: 100%;
                --header-height: 56px;
            }
        }

        /* =========================================
           E1.11.2: Keyframe Animations
           → Features: Visual_Feedback, Transition_Coordination
           ========================================= */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        @keyframes grid-fade {
            0% { opacity: 0.05; }
            100% { opacity: 0.15; }
        }
        
        .animate-slide-in-right { animation: slideInRight 0.3s var(--ease) forwards; }
        .animate-fade-up { animation: fadeUp 0.3s var(--ease) forwards; }
        .animate-grid-fade { animation: grid-fade 2s ease-in-out infinite alternate; }

        /* =========================================
           Global Styles
           ========================================= */
        body {
            font-family: var(--font-ui);
            background-color: var(--bg);
            color: var(--text-main);
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        
        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--panel); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--surface); }
        
        /* =========================================
           Layout Containers (E1: LAYOUT)
           → Components: Header_Bar, Grid_Viewport, Sidebar, Inspector
           → Features: Spatial_Composition, Z-Index_Layering
           ========================================= */
        .layout-root {
            display: grid;
            grid-template-areas: 
                "sidebar header header"
                "sidebar canvas inspector"
                "console console console";
            grid-template-columns: var(--sidebar-width) 1fr var(--inspector-width);
            grid-template-rows: var(--header-height) 1fr var(--console-height);
            width: 100vw;
            height: 100dvh;
        }
        
        @media (max-width: 768px) {
            .layout-root {
                grid-template-areas: 
                    "header header header"
                    "canvas canvas canvas"
                    "console console console";
                grid-template-columns: 0px 1fr 0px;
            }
            .sidebar-expanded { width: 100vw !important; z-index: 1000; }
            .inspector-expanded { transform: translateY(0) !important; }
        }
        
        #header-bar { grid-area: header; }
        #canvas-area { grid-area: canvas; }
        #sidebar { grid-area: sidebar; }
        #inspector { grid-area: inspector; }
        #console-panel { grid-area: console; }
        
        /* =========================================
           Header Bar (LAYOUT.Header_Bar)
           → Components: menu-trigger, nav-deck, play-btn, theme-switch
           → Features: Interactive_Boundaries, Responsive_Adaptation
           ========================================= */
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            z-index: 900;
        }
        
        .nav-deck {
            display: flex;
            gap: 0.5rem;
            background: var(--surface);
            padding: 0.25rem;
            border-radius: 0.5rem;
        }
        
        .nav-tab {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }
        
        .nav-tab.active {
            background: var(--focus);
            color: var(--func);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }
        
        /* =========================================
           Sidebar (E1.1: UI-Sidebar)
           → Components: Tools-Repository, Ingest-Box
           → Features: Collapsibility, Mobile_Priority
           ========================================= */
        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: width 0.3s var(--ease);
            overflow: hidden;
            z-index: 500;
        }
        
        .sidebar-collapsed {
            width: 0px !important;
            padding: 0 !important;
        }
        
        .tool-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            margin: 0.25rem;
            border-radius: 0.5rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s var(--ease);
            position: relative;
            overflow: hidden;
        }
        
        .tool-item:hover {
            background: var(--surface);
            transform: translateX(4px);
        }
        
        .tool-item .icon {
            width: 2rem;
            height: 2rem;
            flex-shrink: 0;
        }
        
        /* =========================================
           Canvas Workspace (E1.2: Canvas-Workspace + LAYOUT.Grid_Viewport)
           → Components: nodes-layer, connections-layer, grid-cells, preview-frame
           → Features: Spatial_Addressing, Grid_Snapping, View_Mode_Transformation
           ========================================= */
        #canvas-area {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
        }
        
        #grid-shell {
            position: absolute;
            inset: 0;
            margin: auto;
            aspect-ratio: 1 / 1;
            width: min(100%, calc(100dvh - var(--header-height) - var(--console-height)));
            max-height: 100%;
        }
        
        #grid-lock {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 1px;
            padding: 0;
            pointer-events: none;
        }
        
        .grid-cell {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            position: relative;
            pointer-events: auto;
            transition: all 0.2s var(--ease);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            min-width: 0;
        }
        
        .grid-cell:hover {
            border-color: var(--func);
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
        }
        
        .grid-cell.focus {
            background: var(--focus);
            border-color: var(--func);
        }
        
        /* Nodes Layer (E1.2.4: Node-Collection) */
        #nodes-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }
        
        .node-instance {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: grab;
            pointer-events: auto;
            transition: transform 0.2s var(--ease);
            z-index: 10;
        }
        
        .node-instance:hover {
            transform: translate(-50%, -50%) scale(1.1);
            z-index: 50;
        }
        
        .node-instance.selected {
            transform: translate(-50%, -50%) scale(1.15);
            z-index: 50;
        }
        
        .node-halo {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--func) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s var(--ease);
        }
        
        .node-instance:hover .node-halo {
            opacity: 0.3;
        }
        
        .node-instance.selected .node-halo {
            opacity: 0.6;
        }
        
        /* Connections Layer (E1.2.5 + RENDERER.Wire_Geometry) */
        #connections-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
        
        /* Preview Frame (PREVIEW) */
        #preview-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: none;
        }
        
        .preview-active #preview-frame {
            display: block;
        }
        
        /* =========================================
           Inspector (E1.3: Inspector-Panel)
           → Components: Header-Identity, Property-Editor, Data-Structure-Viewer
           → Features: Contextual_Editing, Mobile_Modal_Transformation
           ========================================= */
        #inspector {
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s var(--ease);
            z-index: 999;
            overflow: hidden;
        }
        
        .inspector-collapsed {
            transform: translateX(100%);
        }
        
        @media (max-width: 768px) {
            #inspector {
                position: fixed;
                top: var(--header-height);
                left: 0;
                right: 0;
                height: 50vh;
                transform: translateY(100%);
                border-left: none;
                border-top: 1px solid var(--border);
            }
            .inspector-expanded {
                transform: translateY(0) !important;
            }
        }
        
        /* =========================================
           Console (E1.4: Console-System)
           → Components: Header-Toggle-Bar, Log-Message-Stream
           → Features: Temporal_History, Collapsibility
           ========================================= */
        #console-panel {
            background: var(--panel);
            border-top: 1px solid var(--border);
            transition: height 0.3s var(--ease);
            z-index: 200;
        }
        
        .console-collapsed {
            height: 2rem !important;
        }
        
        .log-entry {
            font-family: var(--font-code);
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        
        .log-success { color: #22c55e; }
        .log-info { color: #60a5fa; }
        .log-warn { color: #fbbf24; }
        .log-error { color: #f87171; }
        
        /* =========================================
           Toast (E1.5: Toast-Notification-Layer)
           → Components: Toast-Container, Toast-Messages
           → Features: Temporal_Auto_Destruct, Centered_Positioning
           ========================================= */
        #toast-container {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }
        
        .toast {
            background: var(--panel);
            border: 1px solid var(--func);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            pointer-events: auto;
            animation: fadeUp 0.3s var(--ease);
        }
        
        /* =========================================
           Ingestion Box (INGEST.Ingest_Field)
           → Components: Textarea, Load_Button
           → Features: Code_Import, State_Reset
           ========================================= */
        .ingest-box {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 1rem;
            border-top: 1px solid var(--border);
        }
        
        #paste-input {
            width: 100%;
            min-height: 100px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            padding: 0.5rem;
            color: var(--text-main);
            font-family: var(--font-code);
            font-size: 0.75rem;
            resize: vertical;
        }
        
        /* =========================================
           Code Editor (RENDERER.Code_Styler)
           → Components: Code-Scroll, Line-Elements
           → Features: Syntax_Highlighting, Active_Line_Marking
           ========================================= */
        #code-editor {
            display: none;
            position: absolute;
            inset: 0;
            background: var(--bg);
            padding: 1rem;
            overflow-y: auto;
            font-family: var(--font-code);
            font-size: 0.875rem;
            line-height: 1.5;
        }
        
        .editor-active #code-editor {
            display: block;
        }
        
        .line {
            padding: 0.125rem 0.5rem;
            border-left: 2px solid transparent;
            transition: all 0.2s var(--ease);
            white-space: pre-wrap;
        }
        
        .line:hover {
            background: var(--surface);
        }
        
        .line.active {
            background: var(--focus);
            border-left-color: var(--func);
        }
        
        .token-func { color: var(--func); }
        .token-var { color: var(--var); }
        .token-tag { color: var(--tag); }
        .token-ctrl { color: var(--ctrl); }
        .token-comment { color: var(--text-muted); font-style: italic; }
        
        /* =========================================
           Minimap (RENDERER.Minimap_Compressor)
           → Components: Canvas_Element
           → Features: Visual_Compression, Scroll_Correlation
           ========================================= */
        #minimap {
            position: absolute;
            right: 1rem;
            top: 1rem;
            width: 150px;
            height: 100px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            cursor: pointer;
            z-index: 100;
        }
        
        /* =========================================
           Theme Switcher
           → Features: Dynamic_Theming
           ========================================= */
        .theme-switcher {
            display: flex;
            gap: 0.25rem;
            padding: 0.25rem;
            background: var(--surface);
            border-radius: 0.375rem;
        }
        
        .theme-btn {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s var(--ease);
        }
        
        .theme-btn.active {
            background: var(--focus);
            color: var(--func);
        }
        
        /* =========================================
           Branch Bar (LAYOUT.Branch_Bar)
           → Components: Breadcrumb container, crumbs
           → Features: Hierarchical_Context
           ========================================= */
        #branch-bar {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }
        
        .crumb {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.25rem;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }
        
        .crumb:hover {
            background: var(--focus);
            border-color: var(--func);
        }
        
        /* =========================================
           Mobile Toggle Button
           ========================================= */
        #mobile-menu-btn {
            display: none;
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 1000;
            padding: 0.5rem;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            #mobile-menu-btn {
                display: block;
            }
        }
        
        /* =========================================
           Sideblade (INGEST.Modal_Configuration)
           → Features: Code_Ingestion, Self-Reload
           ========================================= */
        #sideblade-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .sideblade-active #sideblade-overlay {
            display: flex;
        }
        
        #sideblade {
            width: 90%;
            max-width: 600px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
    </style>
<base target="_blank">
</head>
<body class="layout-root" data-theme="dark">

    <!-- =========================================
         E1.5: Toast-Notification-Layer
         → DOM: #toast-container
         → Morphism: showToast()
    ========================================= -->
    <div id="toast-container"></div>

    <!-- =========================================
         INGEST.Sideblade_System
         → DOM: #sideblade-overlay, #sideblade
         → Morphism: toggleBlade(), ingest()
    ========================================= -->
    <div id="sideblade-overlay">
        <div id="sideblade">
            <h3 style="color: var(--func); font-weight: bold;">INGEST CODE</h3>
            <textarea id="paste-input" placeholder="Paste code here..."></textarea>
            <div style="display: flex; gap: 0.5rem;">
                <button onclick="INGEST.load()" class="tool-item" style="flex: 1; justify-content: center;">
                    <span>LOAD</span>
                </button>
                <button onclick="INGEST.ingestSelf()" class="tool-item" style="flex: 1; justify-content: center;">
                    <span>INGEST SELF</span>
                </button>
                <button onclick="INGEST.toggleBlade()" class="tool-item" style="flex: 1; justify-content: center;">
                    <span>CANCEL</span>
                </button>
            </div>
        </div>
    </div>

    <!-- =========================================
         LAYOUT.Header_Bar
         → DOM: #header-bar
         → Components: menu-trigger, nav-deck, theme-switch, play-btn
    ========================================= -->
    <button id="mobile-menu-btn" onclick="SIDEBAR.toggle()">
        <i data-lucide="menu" style="color: var(--text-main);"></i>
    </button>
    
    <header id="header-bar">
        <div class="nav-deck">
            <button class="nav-tab active" data-view="system" onclick="VIEW_MODE.switch('system')">SYSTEM</button>
            <button class="nav-tab" data-view="story" onclick="VIEW_MODE.switch('story')">STORY</button>
            <button class="nav-tab" data-view="code" onclick="VIEW_MODE.switch('code')">CODE</button>
            <button class="nav-tab" data-view="preview" onclick="VIEW_MODE.switch('preview')">PREVIEW</button>
        </div>
        
        <div style="display: flex; align-items: center; gap: 1rem;">
            <!-- PREVIEW.play_btn -->
            <button id="btn-play" onclick="AUTOPLAY.toggle()" title="Toggle Autoplay" style="padding: 0.5rem; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--panel);">
                <i data-lucide="play" style="color: var(--text-muted);"></i>
            </button>
            
            <!-- THEME.Theme_Switcher -->
            <div class="theme-switcher">
                <button class="theme-btn active" data-theme="dark" onclick="THEME.set('dark')">DARK</button>
                <button class="theme-btn" data-theme="parchment" onclick="THEME.set('parchment')">PARCH</button>
                <button class="theme-btn" data-theme="terminal" onclick="THEME.set('terminal')">TERM</button>
            </div>
            
            <!-- INGEST.Trigger -->
            <button onclick="INGEST.toggleBlade()" title="Ingest Code" style="padding: 0.5rem; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--panel);">
                <i data-lucide="upload" style="color: var(--text-muted);"></i>
            </button>
        </div>
    </header>

    <!-- =========================================
         E1.1: UI-Sidebar
         → DOM: #sidebar
         → Components: Header-Identity, Tools-Repository, Helper-Text, System-Status
    ========================================= -->
    <aside id="sidebar" class="sidebar sidebar-expanded">
        <div style="height: var(--header-height); display: flex; align-items: center; padding: 0 1rem; border-bottom: 1px solid var(--border);">
            <div id="header-icon" style="width: 2rem; height: 2rem; margin-right: 0.75rem;"></div>
            <div style="display: flex; flex-direction: column; transition: opacity 0.3s var(--ease);">
                <span style="font-weight: bold; color: var(--text-main);">ONTO-ANCESTOR</span>
                <span style="font-size: 0.625rem; color: var(--func); text-transform: uppercase; letter-spacing: 0.1em;">Unified Reality</span>
            </div>
        </div>
        
        <div id="tools-list" style="flex: 1; overflow-y: auto; padding: 0.5rem;"></div>
        
        <!-- INGEST.Ingest_Box -->
        <div class="ingest-box">
            <textarea id="paste-input" placeholder="Paste code or node definitions..."></textarea>
            <button onclick="INGEST.load()" class="tool-item" style="justify-content: center;">
                <i data-lucide="upload" class="w-4 h-4"></i>
                <span>LOAD CODE</span>
            </button>
        </div>
        
        <div style="padding: 0.5rem; text-align: center; font-size: 0.625rem; color: var(--text-muted);">
            Tap to add • Drag to move • Click to inspect
        </div>
        
        <div style="padding: 1rem; border-top: 1px solid var(--border);">
            <div style="display: flex; justify-between; margin-bottom: 0.5rem;">
                <span style="font-size: 0.75rem; color: var(--text-muted);">Storage</span>
                <span id="storage-status" style="font-size: 0.75rem; color: #22c55e;">Synced</span>
            </div>

    <!-- =========================================
         E1.4: Console-System
         → DOM: #console-panel
         → Components: Header-Toggle-Bar, Log-Message-Stream
    ========================================= -->
    <div id="console-panel" style="height: var(--console-height);">
        <div id="console-header" style="height: 2rem; background: var(--surface); display: flex; align-items: center; justify-between; padding: 0 1rem; cursor: pointer; border-bottom: 1px solid var(--border);" onclick="CONSOLE.toggle()">
            <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-muted); font-size: 0.75rem; font-weight: bold;">

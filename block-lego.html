    </div>

    <script>
        // =========================================
        // ONTOLOGICAL LOG TABLE (Olog)
        // =========================================
        // This table maps all entities, components, features, and morphisms
        // from both OLOG 1 (LEGOS-GPT) and OLOG 2 (Inception)
        // to their implementations in this code.
        //
        // Format: [Subject, Predicate, Object, Morphism, Olog_Source]
        // =========================================
        const OLOG_TABLE = [
            // THEME_SYSTEM
            ["THEME", "definesVariable", "--bg, --panel, --surface", "CSS :root", "OLOG 2"],
            ["THEME", "definesVariable", "--func, --var, --tag, --ctrl", "CSS :root", "OLOG 2"],
            ["THEME", "appliesMode", "dark|parchment|terminal", "THEME.set()", "OLOG 2"],
            
            // UI_LAYOUT
            ["LAYOUT", "contains", "Header_Bar", "#header-bar", "OLOG 2"],
            ["LAYOUT", "contains", "Grid_Viewport", "#canvas-area", "OLOG 2"],
            ["LAYOUT", "contains", "Sidebar", "#sidebar", "OLOG 1"],
            ["LAYOUT", "contains", "Inspector", "#inspector", "OLOG 1"],
            ["LAYOUT", "contains", "Console", "#console-panel", "OLOG 1"],
            ["LAYOUT", "layering", "z-index: 500, 900, 999, 200", "CSS z-index", "OLOG 1"],
            
            // STATE_MANAGEMENT
            ["STATE", "stores", "systemNodes", "Array", "OLOG 1"],
            ["STATE", "stores", "blocks", "Array(81)", "OLOG 2"],
            ["STATE", "stores", "edges", "Edge[]", "OLOG 2"],
            ["STATE", "stores", "definitions", "Map", "OLOG 2"],
            ["STATE", "stores", "activeIdx", "Number|null", "OLOG 2"],
            ["STATE", "stores", "previewMode", "Boolean", "OLOG 2"],
            ["STATE", "stores", "viewMode", "'system'|'story'|'code'|'preview'", "OLOG 1+2"],
            
            // PARSER_ENGINE
            ["PARSER", "pattern", "fnRegex, vrRegex, tagRegex", "RegExp literals", "OLOG 2"],
            ["PARSER", "transforms", "lines → blocks", "parse()", "OLOG 2"],
            ["PARSER", "transforms", "lines → nodes", "parseNodeDefs()", "OLOG 1"],
            
            // VISUAL_RENDERER
            ["RENDERER", "renders", "nodes → DOM", "renderNodes()", "OLOG 1"],
            ["RENDERER", "renders", "blocks → grid", "renderBlocks()", "OLOG 2"],
            ["RENDERER", "renders", "edges → SVG", "drawWires()", "OLOG 2"],
            ["RENDERER", "renders", "connections → SVG", "renderConnections()", "OLOG 1"],
            ["RENDERER", "creates", "minimap", "xray()", "OLOG 2"],
            
            // NAVIGATION_CONTROLLER
            ["NAV", "manages", "focus", "activeIdx", "OLOG 2"],
            ["NAV", "controls", "xray state", "xray()", "OLOG 2"],
            ["NAV", "controls", "breadcrumb", "updateBranch()", "OLOG 2"],
            ["NAV", "controls", "node selection", "selectNode()", "OLOG 1"],
            
            // SIDEBAR
            ["E1.1", "collapsibility", "width: 0 ↔ 288px", "toggleSidebar()", "OLOG 1"],
            ["E1.1", "tools", "Tools-Repository", "renderTools()", "OLOG 1"],
            
            // INSPECTOR
            ["E1.3", "edits", "node properties", "updateLabel()", "OLOG 1"],
            ["E1.3", "deletes", "nodes", "deleteNode()", "OLOG 1"],
            ["E1.3", "mobile", "modal transform", "CSS media query", "OLOG 1"],
            
            // CONSOLE
            ["E1.4", "logs", "messages", "logToConsole()", "OLOG 1"],
            ["E1.4", "collapsibility", "height: 32px ↔ 256px", "toggleConsole()", "OLOG 1"],
            
            // TOAST
            ["E1.5", "notifies", "user", "showToast()", "OLOG 1"],
            ["E1.5", "lifecycle", "3000ms auto-destruct", "setTimeout()", "OLOG 1"],
            
            // PERSISTENCE
            ["E1.7", "stores", "state", "localStorage.setItem()", "OLOG 1+2"],
            ["E1.7", "loads", "state", "localStorage.getItem()", "OLOG 1+2"],
            
            // EVENT_DISPATCHER
            ["E1.8", "handles", "mouse/touch", "startDrag(), handleDragMove()", "OLOG 1"],
            ["E1.8", "handles", "resize", "ResizeObserver", "OLOG 2"],
            ["E1.8", "prevents", "default scroll", "e.preventDefault()", "OLOG 1"],
            
            // VIEW_MODE
            ["E1.9", "switches", "view modes", "switchView()", "OLOG 1"],
            ["E1.9", "arranges", "tree layout", "arrangeAsTree()", "OLOG 1"],
            ["E1.9", "arranges", "grid layout", "renderBlocks()", "OLOG 2"],
            
            // ICONS
            ["E1.10", "generates", "isometric icons", "Icons[iconKey]()", "OLOG 1"],
            ["E1.10", "generates", "code symbols", "symbolFromBlock()", "OLOG 2"],
            
            // INGEST
            ["INGEST", "loads", "external code", "ingestCode()", "OLOG 2"],
            ["INGEST", "reloads", "self", "ingestSelf()", "OLOG 2"],
            
            // PREVIEW
            ["PREVIEW", "renders", "iframe", "setMode('run')", "OLOG 2"],
            ["PREVIEW", "highlights", "DOM elements", "highlightPreviewElement()", "OLOG 2"],
            
            // AUTOPLAY
            ["AUTOPLAY", "sequences", "activeIdx", "setInterval()", "OLOG 2"],
            ["AUTOPLAY", "toggles", "play state", "toggleAutoplay()", "OLOG 2"],
            
            // LIVE_RELOAD
            ["LIVERELOAD", "listens", "WebSocket", "new WebSocket()", "OLOG 2"],
            ["LIVERELOAD", "triggers", "reload", "window.location.reload()", "OLOG 2"],
        ];

        // =========================================
        // STATE_MANAGEMENT (E1.6 + STATE)
        // Unified state combining both ologs
        // =========================================
        const STATE_VERSION = 1;

        const STATE = {
            // OLOG 1: LEGOS-GPT state
            systemNodes: [],
            selectedNodeId: null,
            viewMode: 'system',
            snapToGrid: false,
            sidebarOpen: window.innerWidth > 768,
            consoleOpen: typeof window !== 'undefined' && window.innerWidth > 768,
            
            // OLOG 2: Inception state
            lines: [],
            blocks: Array(81).fill(null),
            edges: [],
            definitions: new Map(),
            lineData: [],
            scopes: [],
            activeIdx: null,
            autoplayInterval: null,
            previewMode: false,
            
            // Combined theme state
            theme: 'dark',
            
            // Derived state
            get isDragging() { return !!this.draggedNodeId; },
            draggedNodeId: null,
            lastX: 0,
            lastY: 0
        };

        // =========================================
        // GRID HELPERS
        // Map between 9×9 grid coordinates and percentage positions
        // =========================================
        const GRID = {
            center(col, row) {
                const step = 100 / 9;
                const x = (col + 0.5) * step;
                const y = (row + 0.5) * step;
                return { x, y, row, col, cellIndex: row * 9 + col };
            },
            snap(x, y) {
                const step = 100 / 9;
                const col = Math.max(0, Math.min(8, Math.round(x / step - 0.5)));
                const row = Math.max(0, Math.min(8, Math.round(y / step - 0.5)));
                return this.center(col, row);
            }
        };

        // =========================================
        // THEME (THEME_SYSTEM)
        // =========================================
        const THEME = {
            set(mode) {
                document.body.setAttribute('data-theme', mode);
                STATE.theme = mode;
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === mode);
                });
                LOG.toast(`Theme: ${mode}`);
            }
        };

        // =========================================
        // ICONS (E1.10: Icon-Rendering-Engine)
        // =========================================
        const ICONS = {
            // Isometric icons from OLOG 1
            getIsoCube(color = "blue", opacity = 1) {
                const colors = {
                    blue: { top: '#60a5fa', left: '#3b82f6', right: '#2563eb' },
                    yellow: { top: '#fcd34d', left: '#f59e0b', right: '#d97706' },
                    cyan: { top: '#22d3ee', left: '#06b6d4', right: '#0891b2' },
                    purple: { top: '#e879f9', left: '#c026d3', right: '#a21caf' },
                    green: { top: '#4ade80', left: '#16a34a', right: '#15803d' }
                };
                const c = colors[color] || colors.blue;
                return `
                <svg viewBox="0 0 40 40" class="w-full h-full drop-shadow-lg" style="opacity: ${opacity}">
                    <path d="M20 4 L36 12 L20 20 L4 12 Z" fill="${c.top}" stroke="#1e293b" stroke-width="1" />
                    <path d="M4 12 L20 20 L20 38 L4 30 Z" fill="${c.left}" stroke="#1e293b" stroke-width="1" />
                    <path d="M36 12 L20 20 L20 38 L36 30 Z" fill="${c.right}" stroke="#1e293b" stroke-width="1" />
                </svg>`;
            },
            
            Entity: () => ICONS.getIsoCube('blue'),
            Core: () => ICONS.getIsoCube('yellow'),
            Goal: () => `<div class="relative w-full h-full"><div class="absolute -top-2 left-0 right-0 mx-auto w-4 h-4 flex justify-center items-center text-yellow-400 animate-pulse"><i data-lucide="target" class="w-4 h-4"></i></div>${ICONS.getIsoCube('blue')}<div class="absolute top-0 left-0 right-0 mx-auto w-0.5 h-4 bg-yellow-400/50 -z-10 transform -translate-y-2"></div></div>`,
            Obstacle: () => `<div class="relative w-full h-full flex items-center justify-center"><div class="w-3/4 h-3/4 relative">${ICONS.getIsoCube('blue')}</div><div class="absolute right-0 h-full w-1 bg-slate-400/80 shadow-[0_0_10px_rgba(148,163,184,0.5)]"></div><div class="absolute right-1 top-1/2 w-3 h-0.5 bg-yellow-400"></div></div>`,
            Morphism: () => `<div class="relative w-full h-full flex items-center justify-between"><div class="w-5 h-5">${ICONS.getIsoCube('blue')}</div><div class="flex-1 h-0.5 bg-yellow-400 mx-1 relative"><div class="absolute right-0 -top-1 w-0 h-0 border-t-4 border-t-transparent border-b-4 border-b-transparent border-l-4 border-l-yellow-400"></div></div><div class="w-5 h-5">${ICONS.getIsoCube('blue')}</div></div>`,
            Shift: () => `<div class="relative w-full h-full flex items-center justify-center"><div class="w-5 h-5 opacity-50">${ICONS.getIsoCube('blue')}</div><div class="absolute z-10 text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.8)]"><i data-lucide="zap" class="w-5 h-5 fill-current"></i></div><div class="w-5 h-5 opacity-50">${ICONS.getIsoCube('blue')}</div></div>`,
            Location: () => `<div class="relative w-full h-full flex items-center justify-center"><div class="absolute top-0 right-0 w-4 h-4">${ICONS.getIsoCube('cyan')}</div><div class="absolute bottom-0 left-0 w-4 h-4">${ICONS.getIsoCube('cyan')}</div><svg class="absolute inset-0 w-full h-full pointer-events-none"><path d="M14 26 C 14 26, 20 20, 26 14" stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round" /><polygon points="26 14, 22 15, 25 18" fill="#22d3ee" /></svg></div>`,
            Timepoint: () => `<div class="relative w-full h-full flex items-center justify-center"><div class="w-3/4 h-3/4">${ICONS.getIsoCube('cyan')}</div><div class="absolute -right-1 -bottom-1 w-5 h-5 bg-[#0f172a] rounded-full border border-cyan-500 flex items-center justify-center"><i data-lucide="clock" class="w-3 h-3 text-cyan-400"></i></div></div>`,
            Scene: () => `<div class="relative w-full h-full flex items-center justify-center p-1"><div class="absolute top-0 left-0 w-2 h-2 border-l-2 border-t-2 border-cyan-400"></div><div class="absolute top-0 right-0 w-2 h-2 border-r-2 border-t-2 border-cyan-400"></div><div class="absolute bottom-0 left-0 w-2 h-2 border-l-2 border-b-2 border-cyan-400"></div><div class="absolute bottom-0 right-0 w-2 h-2 border-r-2 border-b-2 border-cyan-400"></div><div class="flex gap-0.5"><div class="w-3 h-3">${ICONS.getIsoCube('cyan')}</div><div class="w-3 h-3">${ICONS.getIsoCube('cyan')}</div></div></div>`,
            Story: () => `<div class="relative w-full h-full flex flex-col items-center justify-start pt-1"><div class="w-4 h-4 z-10">${ICONS.getIsoCube('cyan')}</div><div class="w-0.5 h-2 bg-cyan-500/50"></div><div class="w-full h-0.5 bg-cyan-500/50 relative"><div class="absolute left-0 bottom-0 w-0.5 h-2 bg-cyan-500/50 transform translate-y-full"></div><div class="absolute right-0 bottom-0 w-0.5 h-2 bg-cyan-500/50 transform translate-y-full"></div><div class="absolute left-1/2 bottom-0 w-0.5 h-2 bg-cyan-500/50 transform translate-y-full -translate-x-1/2"></div></div><div class="flex gap-1 mt-2"><div class="w-2.5 h-2.5">${ICONS.getIsoCube('cyan')}</div><div class="w-2.5 h-2.5">${ICONS.getIsoCube('cyan')}</div><div class="w-2.5 h-2.5">${ICONS.getIsoCube('cyan')}</div></div></div>`
        };

        // =========================================
        // PARSER (PARSER_ENGINE + E1.1.2)
        // =========================================
        const PARSER = {
            patterns: {
                fn: /(?:function|class)\s+(\w+)|(\w+)\s*\(/,
                vr: /(?:const|let|var)\s+(\w+)/,
                tag: /^<(\w+)/,
                comment: /\/\/(.*)$/,
                scopeStart: /[{([]/,
                scopeEnd: /[}\])]/
            },
            
            parseCode(text) {
                const lines = text.split('\n').filter(l => l.trim());
                STATE.lines = lines;
                STATE.lineData = [];
                STATE.scopes = [];
                STATE.definitions.clear();
                STATE.blocks = Array(81).fill(null);
                STATE.edges = [];
                
                const scopeStack = [];
                let scopeId = 0;
                const lpc = Math.ceil(lines.length / 81);
                
                lines.forEach((line, i) => {
                    const cellIdx = Math.floor(i / lpc);
                    const trimmed = line.trim();
                    
                    // Determine type
                    let type = 'other';
                    let name = null;
                    let match;
                    
                    if ((match = trimmed.match(this.patterns.tag))) {
                        type = 'tag';
                        name = match[1];
                    } else if ((match = trimmed.match(this.patterns.fn))) {
                        type = 'func';
                        name = match[1] || match[2];
                    } else if ((match = trimmed.match(this.patterns.vr))) {
                        type = 'var';
                        name = match[1];
                    } else if ((match = trimmed.match(this.patterns.comment))) {
                        type = 'comment';
                    }
                    
                    STATE.lineData.push({ type, index: i });
                    
                    // Create block if cell is empty
                    if (!STATE.blocks[cellIdx]) {
                        STATE.blocks[cellIdx] = {
                            idx: cellIdx,
                            data: { line: i, type, length: 1 },
                            calls: [],
                            deps: [],
                            names: name ? [name] : []
                        };
                        if (name) STATE.definitions.set(name, cellIdx);
                    }
                    
                    // Track scopes
                    const chars = trimmed.split('');
                    chars.forEach(ch => {
                        if (this.patterns.scopeStart.test(ch)) {
                            scopeStack.push({
                                id: scopeId++,
                                start: { line: i, ch: 0 },
                                end: null,
                                lines: []
                            });
                        } else if (this.patterns.scopeEnd.test(ch) && scopeStack.length) {
                            const scope = scopeStack.pop();
                            scope.end = { line: i, ch: 0 };
                            scope.lines = lines.slice(scope.start.line, scope.end.line + 1);
                            STATE.scopes.push(scope);
                        }
                    });
                });
                
                // Scan for dependencies
                STATE.blocks.forEach(block => {
                    if (!block) return;
                    const lineContent = lines[block.data.line] || '';
                    const words = lineContent.match(/\w+/g) || [];
                    words.forEach(word => {
                        if (STATE.definitions.has(word) && !block.names.includes(word)) {
                            const targetIdx = STATE.definitions.get(word);
                            if (targetIdx !== block.idx) {
                                block.deps.push(targetIdx);
                                if (!STATE.blocks[targetIdx].callers) {
                                    STATE.blocks[targetIdx].callers = [];
                                }
                                STATE.blocks[targetIdx].callers.push(block.idx);
                            }
                        }
                    });
                });
                
                LOG.info("Parsed code into blocks and scopes");
            },
            
            parseNodeDefs(text) {
                try {
                    const defs = JSON.parse(text);
                    if (Array.isArray(defs)) {
                        STATE.systemNodes = defs.map(node => ({
                            ...node,
                            icon: node.icon || 'Entity'
                        }));
                        LOG.info("Loaded node definitions");
                    }
                } catch(e) {
                    LOG.warn("Not valid node JSON, parsing as code");
                    this.parseCode(text);
                }
            }
        };

        // =========================================
        // RENDERER (VISUAL_RENDERER + E1.2 + E1.10)
        // =========================================
        const RENDERER = {
            nodes() {
                const container = document.getElementById('nodes-layer');
                container.innerHTML = STATE.systemNodes.map(node => {
                    const isSelected = STATE.selectedNodeId === node.id;
                    const iconFn = ICONS[node.icon] || ICONS.Entity;
                    return `
                    <div class="node-instance ${isSelected ? 'selected' : ''}" 
                         style="left: ${node.x}%; top: ${node.y}%;"
                         data-node-id="${node.id}"
                         onmousedown="EVENTS.startDrag(event, ${node.id})"
                         ontouchstart="EVENTS.startDrag(event, ${node.id})"
                         onclick="INSPECTOR.select(${node.id})">
                        <div class="node-halo"></div>
                        <div class="w-16 h-16 drop-shadow-2xl">
                            ${iconFn()}
                        </div>
                        <div class="absolute -bottom-6 left-1/2 transform -translate-x-1/2 whitespace-nowrap px-2 py-0.5 bg-[var(--panel)]/90 border border-cyan-500/30 rounded text-[10px] text-cyan-400 opacity-0 group-hover:opacity-100 transition-opacity">
                            &lt;${node.label}&gt;
                        </div>
                    </div>`;
                }).join('');
                lucide.createIcons();
            },
            
            blocks() {
                const container = document.getElementById('grid-lock');
                container.innerHTML = '';
                
                for (let i = 0; i < 81; i++) {
                    const block = STATE.blocks[i];
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.dataset.index = i;
                    
                    if (block) {
                        cell.classList.add('focus');
                        const symbol = this.symbolFromBlock(block);
                        cell.innerHTML = `<div style="font-size: 1.5rem;">${symbol}</div>`;
                        cell.onclick = () => {
                            STATE.activeIdx = i;
                            NAV.xray(i);
                        };
                        
                        if (STATE.activeIdx === i) {
                            cell.classList.add('ring-2', 'ring-cyan-400');
                        }
                    }
                    
                    container.appendChild(cell);
                }
            },
            
            symbolFromBlock(block) {
                const type = block.data?.type || 'other';
                const symbols = {
                    func: '⚡',
                    var: '◆',
                    tag: '◻',
                    comment: '//',
                    other: '○'
                };
                return symbols[type] || '○';
            },
            
            connections() {
                const svg = document.getElementById('connections-layer');
                if (!svg) return;
                
                svg.innerHTML = '';
                
                // Render node connections (OLOG 1)
                if (STATE.viewMode === 'system' || STATE.viewMode === 'story') {
                    this.renderNodeConnections(svg);
                }
                
                // Render code edges (OLOG 2)
                if (STATE.viewMode === 'code' && STATE.edges.length) {
                    this.renderCodeEdges(svg);
                }
            },
            
            renderNodeConnections(svg) {
                const core = STATE.systemNodes.find(n => n.id === 1);
                if (!core) return;
                
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                marker.setAttribute('id', 'arrowhead');
                marker.setAttribute('markerWidth', '10');
                marker.setAttribute('markerHeight', '7');
                marker.setAttribute('refX', '28');
                marker.setAttribute('refY', '3.5');
                marker.setAttribute('orient', 'auto');
                marker.innerHTML = '<polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9" opacity="0.5" />';
                defs.appendChild(marker);
                svg.appendChild(defs);
                
                STATE.systemNodes.forEach(node => {
                    if (node.id === 1) return;
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', `${core.x}%`);
                    line.setAttribute('y1', `${core.y}%`);
                    line.setAttribute('x2', `${node.x}%`);
                    line.setAttribute('y2', `${node.y}%`);
                    line.setAttribute('stroke', '#0ea5e9');
                    line.setAttribute('stroke-width', '1');
                    line.setAttribute('stroke-opacity', '0.3');
                    line.setAttribute('marker-end', 'url(#arrowhead)');
                    svg.appendChild(line);
                });
            },
            
            renderCodeEdges(svg) {
                STATE.edges.forEach(edge => {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const x1 = (edge.from % 9) * (100 / 9) + (100 / 18);
                    const y1 = Math.floor(edge.from / 9) * (100 / 9) + (100 / 18);
                    const x2 = (edge.to % 9) * (100 / 9) + (100 / 18);
                    const y2 = Math.floor(edge.to / 9) * (100 / 9) + (100 / 18);
                    
                    const d = `M ${x1}% ${y1}% C ${x1 + 10}% ${y1}%, ${x2 - 10}% ${y2}%, ${x2}% ${y2}%`;
                    path.setAttribute('d', d);
                    path.setAttribute('stroke', 'var(--wire-base)');
                    path.setAttribute('stroke-width', '2');
                    path.setAttribute('fill', 'none');
                    path.setAttribute('opacity', '0.6');
                    svg.appendChild(path);
                });
            },
            
            code() {
                const editor = document.getElementById('code-editor');
                editor.innerHTML = STATE.lines.map((line, i) => {
                    const isActive = STATE.activeIdx !== null && 
                        Math.floor(i / Math.ceil(STATE.lines.length / 81)) === STATE.activeIdx;
                    
                    // Syntax highlighting
                    let highlighted = line
                        .replace(/(function|class|const|let|var)/g, '<span class="token-ctrl">$1</span>')
                        .replace(/(\w+)\s*\(/g, '<span class="token-func">$1</span>(')
                        .replace(/(\w+)\s*=/g, '<span class="token-var">$1</span> =')
                        .replace(/<(\w+)/g, '&lt;<span class="token-tag">$1</span>')
                        .replace(/(\/\/.*$)/gm, '<span class="token-comment">$1</span>');
                    
                    return `<div class="line ${isActive ? 'active' : ''}" data-line="${i}">${highlighted}</div>`;
                }).join('');
            },
            
            preview() {
                const frame = document.getElementById('preview-frame');
                if (!STATE.previewMode || !STATE.lines.length) return;
                
                const blob = new Blob([STATE.lines.join('\n')], { type: 'text/html' });
                frame.src = URL.createObjectURL(blob);
                LOG.info("Preview rendered");
            }
        };

        // =========================================
        // NAV (NAVIGATION_CONTROLLER + E1.3)
        // =========================================
        const NAV = {
            xray(idx) {
                STATE.activeIdx = idx;
                
                // Clear previous states
                document.querySelectorAll('.grid-cell').forEach(cell => {
                    cell.classList.remove('ring-2', 'ring-cyan-400');
                });
                document.querySelectorAll('.line').forEach(line => {
                    line.classList.remove('active');
                });
                
                // Apply new focus
                const block = STATE.blocks[idx];
                if (block) {
                    const cell = document.querySelector(`[data-index="${idx}"]`);
                    if (cell) cell.classList.add('ring-2', 'ring-cyan-400');
                    
                    const lineEl = document.querySelector(`[data-line="${block.data.line}"]`);
                    if (lineEl) lineEl.classList.add('active');
                    
                    // Scroll to line
                    lineEl?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                
                RENDERER.connections();
                RENDERER.blocks();
            },
            
            scrollToLine(idx) {
                if (idx === null || idx === undefined) return;
                const lineEl = document.querySelector(`[data-line="${idx}"]`);
                lineEl?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            },
            
            updateBranch() {
                const branch = document.getElementById('branch-bar');
                if (!branch || !STATE.scopes.length) return;
                
                const currentScope = STATE.scopes.find(s => 
                    s.start.line <= (STATE.activeIdx !== null ? Math.floor(STATE.activeIdx * (STATE.lines.length / 81)) : 0) && 
                    s.end.line >= (STATE.activeIdx !== null ? Math.floor(STATE.activeIdx * (STATE.lines.length / 81)) : 0)
                );
                
                if (!currentScope) return;
                
                branch.innerHTML = currentScope.lines.map((line, i) => `
                    <div class="crumb" onclick="NAV.scrollToLine(${currentScope.start.line + i})">
                        <i data-lucide="code" class="w-3 h-3"></i>
                        <span>${line.trim().substring(0, 20)}...</span>
                    </div>
                `).join('');
                lucide.createIcons();
            }
        };

        // =========================================
        // SIDEBAR (E1.1)
        // =========================================
        const SIDEBAR = {
            toggle() {
                STATE.sidebarOpen = !STATE.sidebarOpen;
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('sidebar-collapsed', !STATE.sidebarOpen);
                sidebar.classList.toggle('sidebar-expanded', STATE.sidebarOpen);
                
                const btn = document.getElementById('mobile-menu-btn');
                if (STATE.sidebarOpen) btn.classList.add('hidden');
                else btn.classList.remove('hidden');
                
                LOG.toast(STATE.sidebarOpen ? 'Sidebar opened' : 'Sidebar collapsed');
            },
            
            renderTools() {
                const tools = [
                    { label: 'Entity', icon: 'Entity' },
                    { label: 'Core', icon: 'Core' },
                    { label: 'Goal', icon: 'Goal' },
                    { label: 'Obstacle', icon: 'Obstacle' },
                    { label: 'Morphism', icon: 'Morphism' },
                    { label: 'Shift', icon: 'Shift' },
                    { label: 'Location', icon: 'Location' },
                    { label: 'Timepoint', icon: 'Timepoint' },
                    { label: 'Scene', icon: 'Scene' },
                    { label: 'Story', icon: 'Story' }
                ];
                
                const container = document.getElementById('tools-list');
                container.innerHTML = tools.map(tool => `
                    <div class="tool-item" onclick="SIDEBAR.addNode('${tool.label}', '${tool.icon}')">
                        <div class="icon">${ICONS[tool.icon]()}</div>
                        <div style="display: flex; flex-direction: column;">
                            <span style="font-size: 0.875rem; color: var(--text-main);">${tool.label}</span>
                            <span style="font-size: 0.625rem; color: var(--text-muted);">&lt;${tool.icon}&gt;</span>
                        </div>
                        <div style="margin-left: auto; color: var(--text-muted);">
                            <i data-lucide="plus" class="w-3 h-3"></i>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            },
            
            addNode(type, iconKey) {
                const id = Date.now();
                // Start near center, then snap to nearest grid cell
                const jitterX = 50 + (Math.random() * 10 - 5);
                const jitterY = 50 + (Math.random() * 10 - 5);
                const snapped = GRID.snap(jitterX, jitterY);
                const newNode = {
                    id,
                    type: type.toLowerCase(),
                    icon: iconKey,
                    label: `${type}<${type}>`,
                    x: snapped.x,
                    y: snapped.y
                };
                
                STATE.systemNodes.push(newNode);
                RENDERER.nodes();
                RENDERER.connections();
                PERSISTENCE.save();
                
                INSPECTOR.select(id);
                LOG.toast(`Added ${type}`);
                
                if (window.innerWidth <= 768) this.toggle();
            }
        };

        // =========================================
        // INSPECTOR (E1.3)
        // =========================================
        const INSPECTOR = {
            select(id) {
                STATE.selectedNodeId = id;
                RENDERER.nodes();
                
                const node = STATE.systemNodes.find(n => n.id === id);
                if (!node) return;
                
                const content = document.getElementById('inspector-content');
                content.innerHTML = `
                    <div class="space-y-4 animate-fade-up">
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Identity</label>
                            <div class="p-3 rounded bg-slate-800/50 border border-slate-700/50 space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-slate-400">ID</span>
                                    <span class="text-xs font-mono text-cyan-500">#${node.id.toString().slice(-4)}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-slate-400">Type</span>
                                    <span class="text-xs font-mono text-yellow-500 uppercase">${node.type}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-slate-400">Label</span>
                                    <input type="text" value="${node.label}" 
                                           onchange="INSPECTOR.updateLabel(${node.id}, this.value)"
                                           class="text-right text-sm bg-transparent border-b border-slate-600 focus:border-cyan-500 outline-none text-white w-32" />
                                </div>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Data Structure</label>
                            <pre class="bg-[#0b1121] p-4 rounded border border-slate-700/50 font-mono text-xs text-slate-300 overflow-x-auto">
node:
  id: "${node.label}"
  class: ${node.type}
  coordinates: [${Math.round(node.x)}, ${Math.round(node.y)}]
  meta:
    status: active
    icon_key: "${node.icon}"</pre>
                        </div>
                    </div>
                `;
                
                const inspector = document.getElementById('inspector');
                inspector.classList.remove('inspector-collapsed');
                inspector.classList.add('inspector-expanded', 'animate-slide-in-right');
            },
            
            updateLabel(id, value) {
                const node = STATE.systemNodes.find(n => n.id === id);
                if (node) {
                    node.label = value;
                    RENDERER.nodes();
                    LOG.toast(`Label updated`);
                    PERSISTENCE.save();
                }
            },
            
            delete() {
                if (!STATE.selectedNodeId) return;
                if (STATE.selectedNodeId === 1) {
                    LOG.toast("Cannot delete core system");
                    return;
                }
                
                STATE.systemNodes = STATE.systemNodes.filter(n => n.id !== STATE.selectedNodeId);
                STATE.selectedNodeId = null;
                
                RENDERER.nodes();
                RENDERER.connections();
                this.close();
                LOG.toast("Entity deleted");
                PERSISTENCE.save();
            },
            
            close() {
                STATE.selectedNodeId = null;
                const inspector = document.getElementById('inspector');
                inspector.classList.add('inspector-collapsed');
                inspector.classList.remove('inspector-expanded');
                RENDERER.nodes();
            }
        };

        // =========================================
        // CONSOLE (E1.4)
        // =========================================
        const CONSOLE = {
            toggle() {
                STATE.consoleOpen = !STATE.consoleOpen;
                const panel = document.getElementById('console-panel');
                panel.classList.toggle('console-collapsed', !STATE.consoleOpen);
                
                const icon = document.getElementById('console-toggle-icon');
                icon.setAttribute('data-lucide', STATE.consoleOpen ? 'chevron-down' : 'chevron-up');
                lucide.createIcons();
            },
            
            log(type, msg) {
                const container = document.getElementById('console-content');
                const entry = document.createElement('div');
                entry.className = `log-entry log-${type.toLowerCase()}`;
                entry.innerHTML = `<span class="font-bold">${type}</span> <span>${msg}</span>`;
                container.prepend(entry);
            }
        };

        // =========================================
        // EVENTS (EVENT_DISPATCHER + E1.8)
        // =========================================
        const EVENTS = {
            startDrag(e, id) {
                STATE.isDragging = true;
                STATE.draggedNodeId = id;
                
                const evt = e.touches ? e.touches[0] : e;
                STATE.lastX = evt.clientX;
                STATE.lastY = evt.clientY;
                
                document.body.style.cursor = 'grabbing';
                e.preventDefault();
            },
            
            handleDragMove(e) {
                if (!STATE.isDragging || !STATE.draggedNodeId) return;
                e.preventDefault();
                
                const evt = e.touches ? e.touches[0] : e;
                const deltaX = evt.clientX - STATE.lastX;
                const deltaY = evt.clientY - STATE.lastY;
                
                STATE.lastX = evt.clientX;
                STATE.lastY = evt.clientY;
                
                const canvasRect = document.getElementById('canvas-area').getBoundingClientRect();
                const percentX = (deltaX / canvasRect.width) * 100;
                const percentY = (deltaY / canvasRect.height) * 100;
                
                const node = STATE.systemNodes.find(n => n.id === STATE.draggedNodeId);
                if (node) {
                    let newX = Math.max(0, Math.min(100, node.x + percentX));
                    let newY = Math.max(0, Math.min(100, node.y + percentY));
                    
                    if (STATE.snapToGrid) {
                        newX = Math.round(newX / 5) * 5;
                        newY = Math.round(newY / 5) * 5;
                    }
                    
                    node.x = newX;
                    node.y = newY;
                    
                    const el = document.querySelector(`[data-node-id="${node.id}"]`);
                    if (el) {
                        el.style.left = `${node.x}%`;
                        el.style.top = `${node.y}%`;
                    }
                    
                    document.getElementById('coords').innerText = `${node.x.toFixed(1)}, ${node.y.toFixed(1)}`;
                    RENDERER.connections();
                }
            },
            
            handleDragEnd() {
                if (!STATE.isDragging) return;
                const node = STATE.systemNodes.find(n => n.id === STATE.draggedNodeId);
                if (node) {
                    // Hard snap to nearest 9×9 cell when drag finishes
                    const snapped = GRID.snap(node.x, node.y);
                    node.x = snapped.x;
                    node.y = snapped.y;
                    const el = document.querySelector(`[data-node-id="${node.id}"]`);
                    if (el) {
                        el.style.left = `${node.x}%`;
                        el.style.top = `${node.y}%`;
                    }
                }
                STATE.isDragging = false;
                STATE.draggedNodeId = null;
                document.body.style.cursor = 'default';
                PERSISTENCE.save();
            }
        };

        // =========================================
        // VIEW_MODE (E1.9)
        // =========================================
        const VIEW_MODE = {
            switch(mode) {
                STATE.viewMode = mode;
                
                // Update tab states
                document.querySelectorAll('.nav-tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.view === mode);
                });
                
                // Hide/show appropriate views
                document.querySelectorAll('#nodes-layer, #grid-lock, #code-editor, #preview-frame').forEach(el => {
                    el.style.display = 'none';
                });
                
                switch(mode) {
                    case 'system':
                    case 'story':
                        document.getElementById('nodes-layer').style.display = 'block';
                        document.getElementById('grid-lock').style.display = 'grid';
                        if (mode === 'story') this.arrangeAsTree();
                        else RENDERER.nodes();
                        break;
                    case 'code':
                        document.getElementById('code-editor').style.display = 'block';
                        document.getElementById('grid-lock').style.display = 'grid';
                        RENDERER.blocks();
                        RENDERER.code();
                        break;
                    case 'preview':
                        document.getElementById('preview-frame').style.display = 'block';
                        RENDERER.preview();
                        break;
                }
                
                RENDERER.connections();
                LOG.toast(`Switched to ${mode} view`);
            },
            
            arrangeAsTree() {
                // Place core + others onto specific 9×9 cells for a simple tree
                const core = STATE.systemNodes.find(n => n.id === 1);
                if (core) {
                    const pos = GRID.center(4, 1); // near top center
                    core.x = pos.x;
                    core.y = pos.y;
                }

                const others = STATE.systemNodes.filter(n => n.id !== 1);
                const row2 = others.slice(0, 3);
                const row3 = others.slice(3);

                const row2Cols = [2, 4, 6];
                row2.forEach((n, i) => {
                    const pos = GRID.center(row2Cols[i] ?? 4, 3);
                    n.x = pos.x;
                    n.y = pos.y;
                });

                const row3Cols = [1, 3, 5, 7];
                row3.forEach((n, i) => {
                    const pos = GRID.center(row3Cols[i] ?? 4, 5);
                    n.x = pos.x;
                    n.y = pos.y;
                });

                RENDERER.nodes();
                RENDERER.connections();
            }
        };

        // =========================================
        // INGEST (INGESTION_SYSTEM)
        // =========================================
        const INGEST = {
            toggleBlade() {
                document.body.classList.toggle('sideblade-active');
            },
            
            load() {
                const text = document.getElementById('paste-input').value;
                if (!text.trim()) {
                    LOG.toast("No content to load");
                    return;
                }
                
                // Try parsing as code first
                if (text.includes('function') || text.includes('const') || text.includes('<')) {
                    PARSER.parseCode(text);
                    VIEW_MODE.switch('code');
                } else {
                    PARSER.parseNodeDefs(text);
                    VIEW_MODE.switch('system');
                }
                
                this.toggleBlade();
                RENDERER.nodes();
                RENDERER.blocks();
                RENDERER.connections();
                PERSISTENCE.save();
                LOG.toast("Content loaded successfully");
            },
            
            ingestSelf() {
                const self = document.documentElement.outerHTML;
                document.getElementById('paste-input').value = self;
                LOG.toast("Self ingested");
            }
        };

        // =========================================
        // AUTOPLAY (AUTOPLAY_SYSTEM)
        // =========================================
        const AUTOPLAY = {
            toggle() {
                if (STATE.autoplayInterval) {
                    clearInterval(STATE.autoplayInterval);
                    STATE.autoplayInterval = null;
                    document.getElementById('btn-play').innerHTML = '<i data-lucide="play" style="color: var(--text-muted);"></i>';
                } else {
                    const blocks = STATE.blocks.filter(b => b !== null);
                    if (!blocks.length) return;
                    
                    let i = 0;
                    STATE.autoplayInterval = setInterval(() => {
                        const idx = blocks[i % blocks.length].idx;
                        STATE.activeIdx = idx;
                        NAV.xray(idx);
                        i++;
                    }, 1000);
                    
                    document.getElementById('btn-play').innerHTML = '<i data-lucide="pause" style="color: var(--func);"></i>';
                }
                lucide.createIcons();
            }
        };

        // =========================================
        // PERSISTENCE (E1.7)
        // =========================================
        const PERSISTENCE = {
            save() {
                const data = {
                    _version: STATE_VERSION,
                    systemNodes: STATE.systemNodes,
                    viewMode: STATE.viewMode,
                    snapToGrid: STATE.snapToGrid,
                    sidebarOpen: STATE.sidebarOpen,
                    consoleOpen: STATE.consoleOpen,
                    theme: STATE.theme,
                    lines: STATE.lines,
                    blocks: STATE.blocks,
                    activeIdx: STATE.activeIdx
                };
                localStorage.setItem('ontological_ancestor_state', JSON.stringify(data));
                
                const status = document.getElementById('storage-status');
                status.textContent = 'Synced';
                status.style.color = '#22c55e';
            },
            
            load() {
                const raw = localStorage.getItem('ontological_ancestor_state');
                if (!raw) {
                    // Default ontology nodes snapped to specific 9×9 grid cells
                    const defaults = [
                        { id: 1,  type: 'core',     icon: 'Core',     label: 'Core<Core>',         grid: [4, 4] },
                        { id: 2,  type: 'entity',   icon: 'Entity',   label: 'Entity<Entity>',     grid: [4, 6] },
                        { id: 3,  type: 'goal',     icon: 'Goal',     label: 'Goal<Goal>',         grid: [4, 2] },
                        { id: 4,  type: 'obstacle', icon: 'Obstacle', label: 'Obstacle<Obstacle>', grid: [2, 2] },
                        { id: 5,  type: 'morphism', icon: 'Morphism', label: 'Morphism<Morphism>', grid: [6, 2] },
                        { id: 6,  type: 'shift',    icon: 'Shift',    label: 'Shift<Shift>',       grid: [6, 4] },
                        { id: 7,  type: 'location', icon: 'Location', label: 'Location<Location>', grid: [2, 4] },
                        { id: 8,  type: 'timepoint',icon: 'Timepoint',label: 'Timepoint<Timepoint>',grid:[2, 6] },
                        { id: 9,  type: 'scene',    icon: 'Scene',    label: 'Scene<Scene>',       grid: [6, 6] },
                        { id: 10, type: 'story',    icon: 'Story',    label: 'Story<Story>',       grid: [4, 0] }
                    ];

                    STATE.systemNodes = defaults.map(def => {
                        const pos = GRID.center(def.grid[0], def.grid[1]);
                        return {
                            id: def.id,
                            type: def.type,
                            icon: def.icon,
                            label: def.label,
                            x: pos.x,
                            y: pos.y
                        };
                    });
                    STATE.theme = 'dark';
                    return;
                }
                
                try {
                    const data = JSON.parse(raw);
                    if (!data._version || data._version !== STATE_VERSION) {
                        // Incompatible / old layout: fall back to fresh defaults
                        localStorage.removeItem('ontological_ancestor_state');
                        this.load();
                        return;
                    }
                    Object.assign(STATE, data);
                    THEME.set(STATE.theme);
                    SIDEBAR.renderTools();
                    VIEW_MODE.switch(STATE.viewMode);
                    RENDERER.nodes();
                    RENDERER.blocks();
                    RENDERER.connections();
                    LOG.info("State loaded from storage");
                } catch(e) {
                    LOG.error("Failed to load state");
                }
            }
        };

        // =========================================
        // LOG (Console and Toast wrapper)
        // =========================================
        const LOG = {
            info(msg) { CONSOLE.log('INFO', msg); },
            success(msg) { CONSOLE.log('SUCCESS', msg); },
            warn(msg) { CONSOLE.log('WARN', msg); },
            error(msg) { CONSOLE.log('ERROR', msg); },
            toast(msg) {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 text-cyan-400"></i> ${msg}`;
                container.appendChild(toast);
                lucide.createIcons();
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        };

        // =========================================
        // LIVE_RELOAD (LIVERELOAD)
        // =========================================
        const LIVERELOAD = {
            init() {
                if (!('WebSocket' in window)) return;
                
                const protocol = window.location.protocol === 'http:' ? 'ws://' : 'wss://';
                const address = protocol + window.location.host + window.location.pathname + '/ws';
                const socket = new WebSocket(address);
                
                socket.onmessage = (msg) => {
                    if (msg.data === 'reload') {
                        window.location.reload();
                    } else if (msg.data === 'refreshcss') {
                        this.refreshCSS();
                    }
                };
            },
            
            refreshCSS() {
                const sheets = Array.from(document.getElementsByTagName("link"));
                sheets.forEach(sheet => {
                    const url = sheet.href.replace(/(&|\?)_cacheOverride=\d+/, '');
                    sheet.href = url + (url.includes('?') ? '&' : '?') + '_cacheOverride=' + Date.now();
                });
            }
        };

        // =========================================
        // INITIALIZATION
        // =========================================
        function init() {
            // Initialize from persistence
            PERSISTENCE.load();
            
            // Set initial theme
            THEME.set(STATE.theme);
            
            // Render initial UI
            SIDEBAR.renderTools();
            RENDERER.nodes();
            RENDERER.blocks();
            RENDERER.connections();
            
            // Set up event listeners
            document.addEventListener('mousemove', EVENTS.handleDragMove);
            document.addEventListener('mouseup', EVENTS.handleDragEnd);
            document.addEventListener('touchmove', EVENTS.handleDragMove, { passive: false });
            document.addEventListener('touchend', EVENTS.handleDragEnd);
            window.addEventListener('resize', () => RENDERER.connections());
            
            // Initialize live reload
            LIVERELOAD.init();
            
            // Initial console log
            LOG.success("Forensic reconstruction initialized");
            LOG.info("OLOG entities: " + OLOG_TABLE.length);
            
            // Load default code example
            if (!STATE.lines.length) {
                const exampleCode = `// Example code structure
function parseNode() {
    const nodes = [];
    return nodes;
}
class Entity {
    constructor() {
        this.id = Math.random();
    }
}`;
                document.getElementById('paste-input').value = exampleCode;
                INGEST.load();
            }
        }

        // =========================================
        // BRICK RECORD EXPORT / IMPORT
        // Bridge between ontology grid and FORENSIC 9×9 brick grid
        // =========================================
        const ONTOLOGY_TO_BRICK = {
            core: 'layout',
            entity: 'layout',
            goal: 'button',
            obstacle: 'layout',
            morphism: 'function',
            shift: 'variable',
            location: 'layout',
            timepoint: 'text',
            scene: 'layout',
            story: 'layout'
        };

        function ontologyIconFor(type) {
            switch (type) {
                case 'core': return 'Core';
                case 'goal': return 'Goal';
                case 'obstacle': return 'Obstacle';
                case 'morphism': return 'Morphism';
                case 'shift': return 'Shift';
                case 'location': return 'Location';
                case 'timepoint': return 'Timepoint';
                case 'scene': return 'Scene';
                case 'story': return 'Story';
                case 'entity':
                default: return 'Entity';
            }
        }

        function exportOntologyBricks() {
            return STATE.systemNodes.map((node, idx) => {
                const snapped = GRID.snap(node.x, node.y);
                const brickType = ONTOLOGY_TO_BRICK[node.type] || 'layout';
                return {
                    id: String(node.id ?? idx),
                    cellIndex: snapped.cellIndex,
                    row: snapped.row,
                    col: snapped.col,
                    brickType,
                    ontologyType: node.type,
                    label: node.label,
                    props: {}
                };
            });
        }

        function importBricksFromForensic(records) {
            if (!Array.isArray(records)) return;
            STATE.systemNodes = records.map((r, idx) => {
                const col = typeof r.col === 'number' ? r.col : Math.floor((r.cellIndex ?? idx) % 9);
                const row = typeof r.row === 'number' ? r.row : Math.floor((r.cellIndex ?? idx) / 9);
                const pos = GRID.center(col, row);
                const ontologyType = r.ontologyType || 'entity';
                return {
                    id: r.id || Date.now() + idx,
                    type: ontologyType,
                    icon: ontologyIconFor(ontologyType),
                    label: r.label || `${ontologyType}<${r.brickType || 'layout'}>`,
                    x: pos.x,
                    y: pos.y
                };
            });
            RENDERER.nodes();
            RENDERER.connections();
            PERSISTENCE.save();
            LOG.toast(`Imported ${STATE.systemNodes.length} bricks from FORENSIC`);
        }

        // Expose API for parent/other tools
        window.BLOCK_LEGO_EXPORT_BRICKS = exportOntologyBricks;
        window.BLOCK_LEGO_IMPORT_BRICKS = importBricksFromForensic;

        // Message bridge (optional): respond to FORENSIC messages
        window.addEventListener('message', (event) => {
            const msg = event.data;
            if (!msg || typeof msg !== 'object') return;
            switch (msg.kind) {
                case 'FORENSIC_EXPORT_BRICKS':
                    importBricksFromForensic(msg.bricks || []);
                    break;
                case 'REQUEST_ONTOLOGY_BRICKS':
                    event.source?.postMessage({
                        kind: 'ONTOLOGY_EXPORT_BRICKS',
                        bricks: exportOntologyBricks()
                    }, '*');
                    break;
            }
        });

        // =========================================
        // GLOBAL MORPHISMS (for onclick handlers)
        // =========================================
        window.toggleSidebar = SIDEBAR.toggle;
        window.toggleConsole = CONSOLE.toggle;
        window.toggleGrid = () => { STATE.snapToGrid = !STATE.snapToGrid; LOG.toast(`Grid snap: ${STATE.snapToGrid}`); };
        window.clearCanvas = () => {
            if (confirm("Clear all nodes?")) {
                STATE.systemNodes = STATE.systemNodes.filter(n => n.id === 1);
                RENDERER.nodes();
                RENDERER.connections();
                PERSISTENCE.save();
            }
        };

        // Start the system
        init();
    </script>
</body>

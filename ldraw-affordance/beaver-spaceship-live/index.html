<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>BEAVER STARSHIP / LIVE</title>
<style>
:root{--ink:#080808;--paper:#faf9f4;--red:#ff382c;--green:#18be74;--yellow:#ffdf2b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button{font:inherit;border:1.5px solid #111;background:#fff;min-height:44px;padding:8px 12px;font-weight:900}button:active{background:var(--yellow)}button:disabled{opacity:.35}
#app{height:100dvh;display:grid;grid-template-rows:44px 42px minmax(0,1fr) 54px 88px}header,#status,#controls,#trace{display:flex;align-items:center;gap:6px;padding:5px 7px;border-bottom:2px solid #111;overflow-x:auto;white-space:nowrap}header strong{margin-right:auto;font-size:11px}.chip{border:1px solid #111;padding:5px 7px;font-size:9px;flex:none}.good{background:var(--green)}.bad{background:var(--red);color:#fff}.warn{background:var(--yellow)}#status{font-size:10px;background:#fff}#status b{margin-right:6px}#views{min-height:0;display:grid;grid-template-rows:1fr 34%;background:#efede6}figure{position:relative;margin:0;min-height:0;border-bottom:1px solid #111;overflow:hidden}figcaption{position:absolute;left:6px;top:6px;z-index:3;background:#fff;border:1px solid #111;padding:4px 6px;font-size:8px;font-weight:900}svg{width:100%;height:100%;display:block;background:#efede6}.grid{stroke:#d0cdc4;stroke-width:1}.piece{stroke:#111;stroke-width:1.6;vector-effect:non-scaling-stroke}.last{stroke:var(--green);stroke-width:5;vector-effect:non-scaling-stroke}.target{fill:none;stroke:var(--red);stroke-width:5;stroke-dasharray:10 7;vector-effect:non-scaling-stroke}.base{fill:#d7d4ca;stroke:#111;stroke-width:2;vector-effect:non-scaling-stroke}#controls{border-top:2px solid #111;border-bottom:2px solid #111}#build{background:var(--yellow)}#trace{display:block;overflow:auto;border-bottom:0;white-space:normal;font-size:9px;line-height:1.3}#trace b{display:block;font-size:10px;margin-bottom:3px}#error{color:#a40000;font-weight:900;white-space:pre-wrap}@media(min-width:800px){#views{grid-template-columns:1fr 1fr;grid-template-rows:1fr}figure{border-right:1px solid #111;border-bottom:0}}
</style>
</head>
<body>
<div id="app">
<header><strong>BEAVER / STARSHIP LIVE</strong><span id="boot" class="chip warn">HTML BOOTED</span><span id="count" class="chip">0 / ?</span><span id="contacts" class="chip">CONTACTS 0</span><span id="gaps" class="chip bad">GAPS ?</span></header>
<div id="status"><b id="phase">BOOT</b><span id="message">HTML is alive. Loading Beaver model…</span></div>
<section id="views"><figure><figcaption>PLAN · X/Z</figcaption><svg id="plan" viewBox="-720 -360 1440 720" preserveAspectRatio="xMidYMid meet"></svg></figure><figure><figcaption>SIDE · X/Y</figcaption><svg id="side" viewBox="-720 -360 1440 720" preserveAspectRatio="xMidYMid meet"></svg></figure></section>
<div id="controls"><button id="build" disabled>BUILD STARSHIP</button><button id="step" disabled>ONE BEAVER ACT</button><button id="reset" disabled>RESET</button></div>
<div id="trace"><b>BOOT TRACE</b><span id="detail">1 · HTML parsed. 2 · waiting for live.js…</span><div id="error"></div></div>
</div>
<script src="./live.js?v=4ae22ee2"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>LDraw Affordance Bench</title>
<style>
:root{--ink:#0b0b0b;--paper:#f7f7f2;--line:#0b0b0b;--muted:#666;--hot:#ffdf2b;--ok:#22d3a6;--warn:#ff704d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;background:var(--paper);border:2px solid var(--line);border-radius:0;min-height:44px;padding:8px 10px;font-weight:700;touch-action:manipulation}button:active,.active{background:var(--hot)}
#app{height:100dvh;display:grid;grid-template-rows:52px minmax(0,1fr) 46%}
header{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:2px solid var(--line);overflow-x:auto;white-space:nowrap}header strong{font-size:14px;margin-right:auto}.stat{font-size:11px;border:1px solid var(--line);padding:5px 7px}
#view{position:relative;min-height:0;border-bottom:2px solid var(--line);background:#e8e8e3}#threeHost{position:absolute;inset:0}#threeHost canvas{width:100%!important;height:100%!important;display:block;touch-action:none}#viewnote{position:absolute;left:8px;top:8px;font-size:11px;background:#fff;border:1px solid #111;padding:5px;max-width:80%;z-index:3}#geomStatus{position:absolute;right:8px;top:8px;font-size:10px;background:#fff;border:1px solid #111;padding:5px;z-index:3}
#dock{min-height:0;display:grid;grid-template-rows:50px minmax(0,1fr)}#tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:0}#tabs button{border-width:0 2px 2px 0}#tabs button:last-child{border-right:0}
.panel{display:none;min-height:0;height:100%}.panel.activePanel{display:grid}.scrollY{overflow:auto;overscroll-behavior:contain}.rail{display:flex;gap:6px;overflow-x:auto;padding:6px;min-height:58px;border-bottom:1px solid var(--line);align-items:stretch}.rail button{min-width:112px;text-align:left}
#buildPanel{grid-template-rows:auto auto minmax(0,1fr)}#buildActions{display:flex;gap:6px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto}#buildActions button{white-space:nowrap}.partCard small,.portBtn small{display:block;font-weight:400;color:var(--muted);margin-top:4px}.partCard b{display:block;font-size:12px}.portBtn.used{opacity:.35;text-decoration:line-through}.portBtn.selected{background:var(--hot)}
#assemblyList{padding:6px;overflow:auto}.instance{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;border-bottom:1px solid #bbb;padding:7px 2px;font-size:12px}.instance button{min-height:36px}.tax{font-variant-numeric:tabular-nums}
#testPanel{grid-template-rows:auto minmax(0,1fr)}#testSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;border-bottom:1px solid var(--line)}.metric{border:2px solid var(--line);padding:8px}.metric b{display:block;font-size:20px}.testrow,.librow{display:grid;grid-template-columns:64px 1fr auto;gap:8px;border-bottom:1px solid #bbb;padding:8px;font-size:12px}.pass{background:var(--ok)}.fail{background:var(--warn)}
#libraryPanel{grid-template-rows:auto minmax(0,1fr)}#filter{margin:6px;border:2px solid #111;padding:10px;font:inherit;background:white;min-height:44px}.ops{color:var(--muted);font-size:10px;line-height:1.4;margin-top:3px}.badge{border:1px solid #111;padding:2px 4px;font-size:10px;white-space:nowrap}
@media(min-width:900px){#app{grid-template-rows:52px minmax(0,1fr) 38%}.partCard{min-width:150px}}
</style>
</head>
<body>
<div id="app">
<header><strong>AFFORDANCE LDRAW / REAL GEOMETRY BENCH</strong><span class="stat" id="partCount">-- parts</span><span class="stat" id="attention">tax 0.00</span></header>
<section id="view"><div id="threeHost"></div><div id="viewnote">Same LDraw stack as the working Tractor viewer. Tap RUN BENCH.</div><div id="geomStatus">LOADING LDRAW…</div></section>
<section id="dock">
<nav id="tabs"><button data-tab="build" class="active">BUILD</button><button data-tab="test">TEST</button><button data-tab="library">LIBRARY</button></nav>
<div id="buildPanel" class="panel activePanel">
<div id="buildActions"><button id="benchBtn">RUN BENCH</button><button id="undoBtn">UNDO</button><button id="resetBtn">RESET</button><button id="exportBtn">EXPORT MPD</button></div>
<div class="rail" id="ports"></div>
<div><div class="rail" id="parts"></div><div id="assemblyList"></div></div>
</div>
<div id="testPanel" class="panel"><div id="testSummary"></div><div class="scrollY" id="tests"></div></div>
<div id="libraryPanel" class="panel"><input id="filter" placeholder="Filter part, operator, port..."><div class="scrollY" id="library"></div></div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../../examples/js/loaders/LDrawLoader.js?v=11"></script>
<script src="../../beta-prime-engine.js?v=1"></script>
<script type="module" src="./app.js?v=e03d2bf"></script>
</body>
</html>

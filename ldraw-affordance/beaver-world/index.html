:1fr 1fr 1fr}.pane{min-height:0;overflow:auto;border-right:1px solid #111}.pane:last-child{border-right:0}.title{position:sticky;top:0;background:var(--paper);padding:5px 7px;border-bottom:1px solid #111;font-size:8px;font-weight:950;z-index:2}.sig,.cand,.used{display:grid;grid-template-columns:55px 1fr;gap:6px;padding:6px 7px;border-bottom:1px solid #bbb;font-size:9px}.sig b,.cand b,.used b{font-size:8px}.sig span,.cand span,.used span{font-weight:850}.sig small,.cand small,.used small{grid-column:2;color:var(--muted);font-size:7px;line-height:1.3}.sig.hot,.cand.best{background:#e5f2ff}.sig.done{opacity:.45}.cand.blocked{background:var(--red);color:#fff}.cand.blocked small{color:#fff}.used b{color:var(--blue)}@media(max-width:760px){#app{grid-template-rows:40px minmax(0,1fr) 54%}#atlas{display:none}#hear{width:70%}#hearT{font-size:11px}#dock{grid-template-rows:46px 34px minmax(0,1fr)}#lower{grid-template-columns:1fr 1fr}.pane:last-child{display:none}#controls>*{font-size:7px;padding:5px 7px}}
</style>

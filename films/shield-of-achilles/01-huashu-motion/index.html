<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Film 01 · The Forge of Hephaestus (Real 3D LDraw LEGO Cinema · huashu-motion)</title>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/om.js"></script>
<script src="vendor/forage-bundle.js"></script>
<script src="vendor/shield-dioramas-bundle.js"></script>
<script src="vendor/lego3d.js"></script>
<style>
  @font-face {
    font-family: 'Noto Sans SC';
    src: url('assets/fonts/NotoSansSC-500.woff') format('woff');
    font-weight: 500;
  }
  @font-face {
    font-family: 'Noto Sans SC';
    src: url('assets/fonts/NotoSansSC-900.woff') format('woff');
    font-weight: 900;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #070a12; color: #f7f2e7;
    font-family: 'Noto Sans SC', sans-serif;
  }
  #film {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(circle at 50% 35%, #2a1810 0%, #0d1322 58%, #05070d 100%);
  }
  canvas#gl {
    position: absolute; inset: 0; width: 1920px; height: 1080px; display: block;
  }
  .letterbox-top, .letterbox-bot {
    position: absolute; left: 0; right: 0; height: 68px;
    background: rgba(4, 6, 11, 0.88); z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 56px;
  }
  .letterbox-top { top: 0; border-bottom: 1px solid rgba(229, 189, 67, 0.35); }
  .letterbox-bot { bottom: 0; height: 86px; border-top: 1px solid rgba(229, 189, 67, 0.35); }
  .brand-wrap { display: flex; align-items: center; gap: 14px; }
  .brand-thumb {
    width: 42px; height: 42px; border-radius: 6px;
    border: 1.5px solid #e5bd43; object-fit: cover;
  }
  .brand {
    font-family: 'Noto Sans SC', sans-serif; font-size: 15px; font-weight: 900;
    letter-spacing: 0.12em; color: #e5bd43; text-transform: uppercase;
  }
  .kit-counter {
    font-family: 'Noto Sans SC', sans-serif; font-size: 14px; color: #cbd5e1;
    display: flex; gap: 24px; align-items: center;
  }
  .kit-counter strong { color: #facc15; font-size: 16px; font-weight: 900; }
  .sub-verse {
    font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 500;
    color: #fef08a; text-shadow: 0 2px 12px rgba(0,0,0,0.9);
  }
  .sub-meta {
    font-family: 'Noto Sans SC', sans-serif; font-size: 13px; color: #94a3b8;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="film" data-composition-id="film" data-width="1920" data-height="1080" data-om-signature="off" data-audio="assets/sound.wav">
  <canvas id="gl" width="1920" height="1080"></canvas>

  <div class="letterbox-top">
    <div class="brand-wrap">
      <img class="brand-thumb" src="assets/set.shield-of-achilles.jpg" alt="Shield">
      <div class="brand" id="actTitle">ACT I · THE FORGE OF HEPHAESTUS &amp; REVOLVING BEAR</div>
    </div>
    <div class="kit-counter">
      <span>MODEL: <strong id="modelSlug">set.achilles-forge.mpd</strong></span>
      <span>LIVE 3D BRICKS: <strong id="brickCount">936 / 936</strong></span>
      <span>CHECKER: <strong style="color:#4ade80;">0 LOOSE · 0 CLASHES</strong></span>
    </div>
  </div>

  <div class="letterbox-bot">
    <div class="sub-verse" id="homericLine">“He cast on the fire tough bronze and tin and precious gold and silver…” — Iliad XVIII.474–475</div>
    <div class="sub-meta" id="shotTelemetry">CAMERA: ANVIL TRACKING DOLLY · 120 BPM FORGE PULSE</div>
  </div>
</div>

<script>
const canvas = document.getElementById('gl');
const engine = new LegoCinema.Engine(canvas);

// Lazy-loaded per shot by engine.render()

const SHOTS = [
  {
    t0: 0.0, t1: 4.0,
    slug: 'shield-diorama-forge',
    pieces: 1748,
    act: 'ILIAD XVIII.468–478 · THE FORGE OF HEPHAESTUS, TWENTY BELLOWS & SILVER-FOOTED THETIS',
    verse: '«Ποίει δὲ πρώτιστα σάκος μέγα τε στιβαρόν τε…» — “He cast on the fire tough bronze, tin, precious gold, and silver, and forged a great shield!”',
    cam: 'HOMER · ILIAD BOOK XVIII.474–478 · HEPHAESTUS AT THE ANVIL & KOURAI KHRYSEIAI',
    bg: 'radial-gradient(circle at 50% 40%, #3d1b0e 0%, #121524 62%, #05070d 100%)',
    eye0: [-240, 340, 680], eye1: [230, 250, 600],
    target0: [-20, 95, -10], target1: [20, 90, -10],
    fov0: 32, fov1: 29,
    buildFn: (u) => Math.min(1.0, 0.35 + u * 1.15),
    explode0: 0.0, explode1: 0.0,
    turnSpeed: 0.55,
    torchCol: [1.0, 0.52, 0.14], torchStr: 1.65
  },
  {
    t0: 4.0, t1: 8.0,
    slug: 'shield-of-achilles',
    pieces: 7522,
    act: 'ILIAD XVIII.479–489 · THE FIVE-FOLD SHIELD — EARTH, SKY, SEA, SUN, MOON & THE BEAR',
    verse: '«Πέντε δ’ ἄρ’ αὐτοῦ ἔσαν σάκεος πτύχες…» — “Five folds were there of the shield itself; and therein he wrought the Earth, the Sky, and the Sea…”',
    cam: 'HOMER · ILIAD BOOK XVIII.481–489 · FIVE CONCENTRIC RINGS OF THE COSMOS',
    bg: 'radial-gradient(circle at 50% 38%, #1e2942 0%, #0b111e 65%, #04060b 100%)',
    eye0: [420, 780, 1080], eye1: [160, 420, 680],
    target0: [0, 95, 0], target1: [0, 65, 0],
    fov0: 34, fov1: 30,
    build0: 1.0, build1: 1.0,
    explodeFn: (u) => Math.max(0.0, 1.0 - LegoCinema.easeInOutCubic(Math.min(1.0, u * 1.25))),
    turnSpeed: 0.35,
    torchCol: [1.0, 0.78, 0.32], torchStr: 1.25
  },
  {
    t0: 8.0, t1: 12.0,
    slug: 'shield-diorama-wedding',
    pieces: 3475,
    act: 'ILIAD XVIII.490–496 · THE CITY AT PEACE — BRIDAL TORCH-PROCESSION, FLUTES & LYRES',
    verse: '«Νύμφας δ’ ἐκ θαλάμων δαΐδων ὕπο λαμπομενάων ἠγίνεον ἀνὰ ἄστυ…» — “Brides from their chambers under blazing torches they led through the city…”',
    cam: 'HOMER · ILIAD BOOK XVIII.491–496 · HYMENAEAL SONG, WHIRLING DANCERS & DOORWAY WOMEN',
    bg: 'radial-gradient(circle at 48% 35%, #2c1e38 0%, #101628 62%, #05070c 100%)',
    eye0: [-240, 360, 740], eye1: [220, 260, 640],
    target0: [-30, 115, -20], target1: [30, 95, -10],
    fov0: 32, fov1: 29,
    build0: 1.0, build1: 1.0,
    explode0: 0.0, explode1: 0.0,
    turnSpeed: 0.4,
    torchCol: [1.0, 0.62, 0.18], torchStr: 1.55
  },
  {
    t0: 12.0, t1: 16.0,
    slug: 'achilles-rotunda',
    pieces: 8891,
    act: 'ILIAD XVIII.607–608 · THE UTTERMOST RIM — THE MIGHTY STRENGTH OF RIVER OCEANUS',
    verse: '«Ἐν δ’ ἐτίθει ποταμοῖο μέγα σθένος Ὠκεανοῖο…» — “And around the uttermost rim of the strongly-built shield he set the mighty strength of River Oceanus.”',
    cam: 'HOMER · ILIAD BOOK XVIII.607–608 · RIVER OCEANUS SEALING THE SHIELD OF ACHILLES',
    bg: 'radial-gradient(circle at 50% 32%, #1d304d 0%, #0b1322 64%, #04070d 100%)',
    eye0: [-60, 460, 620], eye1: [240, 1180, 1280],
    target0: [0, 55, -30], target1: [0, 45, 0],
    fov0: 32, fov1: 35,
    build0: 1.0, build1: 1.0,
    explode0: 0.0, explode1: 0.0,
    turnSpeed: 0.30,
    torchCol: [0.95, 0.82, 0.42], torchStr: 1.30
  }
];

function renderFrame(sec) {
  const t = Math.max(0, Math.min(16.0, sec));
  const st = LegoCinema.evalShotList(SHOTS, t);
  const s = st.shot;

  const beatPhase = (t * 2.0) % 1.0;
  const pulseR = beatPhase * 760.0;
  const pulseAmp = Math.exp(-beatPhase * 3.8) * 0.65;

  document.getElementById('film').style.background = s.bg;
  document.getElementById('actTitle').textContent = s.act;
  document.getElementById('modelSlug').textContent = 'set.' + s.slug + '.mpd';
  const builtCount = Math.round(s.pieces * st.build);
  document.getElementById('brickCount').textContent = `${builtCount.toLocaleString()} / ${s.pieces.toLocaleString()}`;
  document.getElementById('homericLine').textContent = s.verse;
  document.getElementById('shotTelemetry').textContent = `${s.cam} · t=${t.toFixed(2)}s`;

  engine.render({
    slug: st.slug,
    time: t,
    eye: st.eye,
    target: st.target,
    fov: st.fov,
    build: st.build,
    explode: st.explode,
    turnAngle: st.turnAngle,
    pulseR,
    pulseAmp,
    torchPos: st.torchPos,
    torchCol: st.torchCol,
    torchStr: st.torchStr,
    sunCol: st.sunCol
  });
}

window.renderFrame = renderFrame;
if (window.gsap && window.OM) {
  const tl = gsap.timeline({ paused: true });
  tl.addLabel('act:forge', 0.0);
  tl.addLabel('act:shield', 4.0);
  tl.addLabel('act:wedding', 8.0);
  tl.addLabel('act:rotunda', 12.0);
  OM.clock(tl, (sec) => renderFrame(sec), 16.0, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines['film'] = tl;
}
renderFrame(0);
</script>
</body>
</html>

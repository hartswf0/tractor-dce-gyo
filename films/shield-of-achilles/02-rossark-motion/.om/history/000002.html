function cubicBezier(x1, y1, x2, y2) {
  return function(x) {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 5; i++) {
      const cx = 3 * x1 * t * (1 - t) * (1 - t) + 3 * x2 * t * t * (1 - t) + t * t * t - x;
      const dx = 3 * x1 * (1 - t) * (1 - 3 * t) + 3 * x2 * t * (2 - 3 * t) + 3 * t * t;
      if (Math.abs(dx) < 1e-6) break;
      t -= cx / dx;
    }
    return 3 * y1 * t * (1 - t) * (1 - t) + 3 * y2 * t * t * (1 - t) + t * t * t;
  };
}

const EASE_IN_OUT = cubicBezier(0.77, 0, 0.175, 1);
const EASE_OUT    = cubicBezier(0.23, 1, 0.32, 1);
const EASE_IN     = cubicBezier(0.55, 0, 1, 0.45);

function track(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const k1 = keys[i];
    if (t <= k1[0]) {
      const k0 = keys[i - 1];
      const span = k1[0] - k0[0];
      const p = span > 0 ? (t - k0[0]) / span : 1;
      const e = k1[2] === 'out' ? EASE_OUT(p) : EASE_IN_OUT(p);
      return k0[1] + (k1[1] - k0[1]) * e;
    }
  }
  return keys[keys.length - 1][1];
}

function flow(t, k) {
  const n = k.length;
  if (t <= k[0][0]) return k[0][1];
  if (t >= k[n - 1][0]) return k[n - 1][1];
  let i = 0;
  while (k[i + 1][0] < t) i++;
  function slope(j) { return (k[j + 1][1] - k[j][1]) / (k[j + 1][0] - k[j][0]); }
  function tangent(j) {
    if (j === 0 || j === n - 1) return 0;
    const a = slope(j - 1), b = slope(j);
    if (a * b <= 0) return 0;
    const h0 = k[j][0] - k[j - 1][0], h1 = k[j + 1][0] - k[j][0];
    const w0 = 2 * h1 + h0, w1 = h1 + 2 * h0;
    return (w0 + w1) / (w0 / a + w1 / b);
  }
  const h = k[i + 1][0] - k[i][0];
  const s = (t - k[i][0]) / h, s2 = s * s, s3 = s2 * s;
  return (
    (2 * s3 - 3 * s2 + 1) * k[i][1] +
    (s3 - 2 * s2 + s) * h * tangent(i) +
    (-2 * s3 + 3 * s2) * k[i + 1][1] +
    (s3 - s2) * h * tangent(i + 1)
  );
}

function seg(t, a, b, curve = 'out') {
  if (t <= a) return 0;
  if (t >= b) return 1;
  const p = (t - a) / (b - a);
  return curve === 'out' ? EASE_OUT(p) : EASE_IN_OUT(p);
}

function wave(t, period, phase = 0) {
  return Math.sin((t / period + phase) * Math.PI * 2);
}

function loop(t, period, phase = 0) {
  const p = (t / period + phase) % 1;
  return p < 0 ? p + 1 : p;
}

function bell(p) {
  return Math.sin(Math.PI * Math.min(1, Math.max(0, p)));
}

function seeded(i, salt = 0) {
  const x = Math.sin(i * 12.9898 + salt * 78.233) * 43758.5453;
  return x - Math.floor(x);
}

// Hephaestus Smithing Shoulder Flow (3 rhythmic hammer strikes per 12s cycle: at 2000, 6000, 10000ms)

// Precompute static curves for Card 4 Telemetry Graph
function buildStaticGraph() {
  let dFlow = '', dWave = '', dBlink = '';
  for (let x = 0; x <= 344; x += 2) {
    const t = (x / 344) * 12000;
    const fVal = flow(t, HAMMER_SHOULDER_FLOW); // -95..-15
    const fy = 45 - ((fVal + 55) / 50) * 26;
    const wy = 135 + wave(t, 4000, 0) * 26;
    const by = 238 - track(t, BLINK_KEYS) * 38;
    dFlow += (x === 0 ? 'M' : 'L') + `${x.toFixed(1)},${fy.toFixed(1)} `;
    dWave += (x === 0 ? 'M' : 'L') + `${x.toFixed(1)},${wy.toFixed(1)} `;
    dBlink += (x === 0 ? 'M' : 'L') + `${x.toFixed(1)},${by.toFixed(1)} `;
  }
  document.getElementById('curve-flow').setAttribute('d', dFlow);
  document.getElementById('curve-wave').setAttribute('d', dWave);
  document.getElementById('curve-blink').setAttribute('d', dBlink);
}
buildStaticGraph();

// ============================================================================
// MASTER SINGLE-CLOCK RENDER FUNCTION: renderAt(t_ms)
// ============================================================================
function renderAt(rawT) {
  const t = ((rawT % 12000) + 12000) % 12000;

  // 1. COSMOS BOSS: Revolving Bear (Ursa Major) + Sun + Moon + Stars + Oceanus
  const bearDeg = loop(t, 12000, 0) * 360;
  document.getElementById('bear-orbit').setAttribute('transform', `rotate(${bearDeg.toFixed(2)})`);
  // Counter-rotate bear body slightly + leg gait + gaze toward Orion
  const bearBob = wave(t, 1500, 0) * 2.5;
  document.getElementById('bear-rig').setAttribute('transform', `translate(0, ${(-88 + bearBob).toFixed(2)})`);
  document.getElementById('bear-leg-fl').setAttribute('transform', `translate(16, 18) rotate(${(wave(t, 1500, 0) * 18).toFixed(1)})`);
  document.getElementById('bear-leg-bl').setAttribute('transform', `translate(-10, 18) rotate(${(wave(t, 1500, 0.5) * 18).toFixed(1)})`);
  document.getElementById('bear-pupil').setAttribute('cx', (3 + wave(t, 4000, 0.2) * 1.6).toFixed(2));

  // Sun rays linear rotation (1 turn per 12s) + subtle glow scale
  const sunDeg = loop(t, 12000, 0) * 360;
  const sunScale = 1 + wave(t, 3000, 0) * 0.04;
  document.getElementById('sun-rays').setAttribute('transform', `rotate(${sunDeg.toFixed(1)}) scale(${sunScale.toFixed(3)})`);
  // Moon waxing/waning phase
  document.getElementById('moon-shadow').setAttribute('cx', (7 + wave(t, 6000, 0) * 6).toFixed(2));

  // Stars twinkling at seeded phases
  for (const s of bossStars) {
    const tw = 1 + wave(t, 3000, s.phase) * 0.28;
    s.node.setAttribute('r', (s.baseR * tw).toFixed(2));
    s.node.setAttribute('opacity', (0.65 + 0.35 * wave(t, 2000, s.phase)).toFixed(2));
  }

  // Oceanus travelling surface wave (24 nodes)
  for (let i = 0; i < 24; i++) {
    const baseAng = (i / 24) * Math.PI * 2 + loop(t, 12000, 0) * Math.PI * 2 * 0.25;
    const r = 410 + wave(t, 2000, i * 0.08) * 5;
    oceanusArcs[i].setAttribute('transform', `translate(${(Math.cos(baseAng)*r).toFixed(1)}, ${(Math.sin(baseAng)*r).toFixed(1)})`);
  }

  // Ring 2 torches flicker, Ring 3 plough teams travel, Ring 4 dancers revolve
  for (const ct of cityTorches) {
    ct.flame.setAttribute('r', (3.2 + wave(t, 1000, ct.i * 0.13) * 0.9).toFixed(2));
  }
  for (const pt of ploughTeams) {
    const a = (pt.i / 12) * Math.PI * 2 + wave(t, 6000, pt.i * 0.1) * 0.12;
    const r = 248;
    pt.node.setAttribute('transform', `translate(${(Math.cos(a)*r).toFixed(1)}, ${(Math.sin(a)*r).toFixed(1)}) rotate(${(a*180/Math.PI + 90).toFixed(1)})`);
  }
  const outerWheelDeg = flow(t, WHEEL_FLOW);
  for (const od of outerDancers) {
    const a = (od.i / 20) * Math.PI * 2 + (outerWheelDeg * Math.PI / 180);
    const r = 322 + wave(t, 1500, od.i * 0.2) * 4;
    od.node.setAttribute('transform', `translate(${(Math.cos(a)*r).toFixed(1)}, ${(Math.sin(a)*r).toFixed(1)})`);
  }

  // 2. RIG CARD 1: HEPHAESTUS LIVE FACE CHOREO + FOLLOW-THROUGH SMITHING ARM
  const hephBreath = wave(t, 3000, 0) * 2.0;
  const hephTilt   = wave(t, 4000, 0.15) * 3.5;
  document.getElementById('heph-body').setAttribute('transform', `translate(115, ${(290 + hephBreath).toFixed(2)})`);
  document.getElementById('heph-head').setAttribute('transform', `translate(0, -82) rotate(${hephTilt.toFixed(2)})`);

  const lx = track(t, LOOK_X_KEYS), ly = track(t, LOOK_Y_KEYS);
  document.getElementById('heph-pupil-l').setAttribute('cx', (-18 + lx).toFixed(2));
  document.getElementById('heph-pupil-l').setAttribute('cy', (-8 + ly).toFixed(2));
  document.getElementById('heph-pupil-r').setAttribute('cx', (18 + lx).toFixed(2));
  document.getElementById('heph-pupil-r').setAttribute('cy', (-8 + ly).toFixed(2));

  const lid = track(t, BLINK_KEYS);
  // Upper lid drops 85%, lower lid rises 15% per Rossark §4
  const topY = -20 + lid * 12.5;
  const botY = 1 - lid * 2.8;
  document.getElementById('heph-lid-top-l').setAttribute('y', topY.toFixed(2));
  document.getElementById('heph-lid-top-r').setAttribute('y', topY.toFixed(2));
  document.getElementById('heph-lid-bot-l').setAttribute('y', botY.toFixed(2));
  document.getElementById('heph-lid-bot-r').setAttribute('y', botY.toFixed(2));
  document.getElementById('heph-mouth').setAttribute('ry', (2.5 + Math.max(0, wave(t, 2000, 0.2)) * 2.5).toFixed(2));

  // Two-joint arm with Rossark §5.4 trailing follow-through (parent read 90ms earlier)
  const shoulderNow = flow(t, HAMMER_SHOULDER_FLOW) + wave(t, 3000, 0.3) * 3;
  const tPrev = ((t - 90) % 12000 + 12000) % 12000;
  const shoulderPrev = flow(tPrev, HAMMER_SHOULDER_FLOW) + wave(tPrev, 3000, 0.3) * 3;
  const elbowBend = -45 + 0.55 * (shoulderPrev - shoulderNow);
  const wristLag  = 0.45 * (shoulderPrev - shoulderNow);
  document.getElementById('heph-shoulder').setAttribute('transform', `translate(26, -36) rotate(${shoulderNow.toFixed(2)})`);
  document.getElementById('heph-elbow').setAttribute('transform', `translate(0, 38) rotate(${elbowBend.toFixed(2)})`);
  document.getElementById('heph-wrist').setAttribute('transform', `translate(0, 40) rotate(${wristLag.toFixed(2)})`);

  // Dual-wave furnace flame (periods 1000ms and 1500ms) + rising bell(p) smoke wisps
  const flameLean1 = wave(t, 1000, 0) * 3.5;
  const flameStretch1 = 1 + wave(t, 1500, 0.2) * 0.05;
  const flameLean2 = wave(t, 750, 0.4) * 4.0;
  document.getElementById('furnace-flame-outer').setAttribute('transform', `rotate(${flameLean1.toFixed(2)}) scale(1, ${flameStretch1.toFixed(3)})`);
  document.getElementById('furnace-flame-inner').setAttribute('transform', `rotate(${flameLean2.toFixed(2)}) scale(1, ${(1 + wave(t, 1200, 0.5)*0.06).toFixed(3)})`);
  for (let i = 0; i < 3; i++) {
    const p = loop(t, 3000, i * 0.33);
    smokeWisps[i].setAttribute('cx', (wave(t, 2000, i * 0.4) * 8).toFixed(1));
    smokeWisps[i].setAttribute('cy', (-95 - p * 42).toFixed(1));
    smokeWisps[i].setAttribute('opacity', (bell(p) * 0.45).toFixed(2));
  }

  // Anvil sparks on the 3 hammer strikes (around 1950ms, 5950ms, 9950ms)
  const strikePhase = ((t - 1950) % 4000 + 4000) % 4000;
  for (let i = 0; i < 5; i++) {
    if (strikePhase < 650) {
      const sp = strikePhase / 650;
      const ang = -Math.PI * (0.15 + 0.7 * (i / 4));
      const dist = sp * (35 + i * 8);
      sparks[i].setAttribute('cx', (Math.cos(ang) * dist).toFixed(1));
      sparks[i].setAttribute('cy', (-42 + Math.sin(ang) * dist + sp * sp * 28).toFixed(1));
      sparks[i].setAttribute('opacity', bell(sp).toFixed(2));
    } else {
      sparks[i].setAttribute('opacity', '0');

  }

  // 3. RIG CARD 2: 1.6x GOLDEN ATHENA & ARES LEVITATION + LIMP FEET + 2.5D HEAD YAW
  const athenaFloat = wave(t, 4000, 0) * 11;
  const aresFloat   = wave(t, 4000, 0.42) * 11;
  document.getElementById('athena-float').setAttribute('transform', `translate(135, ${(225 + athenaFloat).toFixed(2)})`);
  document.getElementById('ares-float').setAttribute('transform', `translate(275, ${(225 + aresFloat).toFixed(2)})`);
  // Shadows scale inversely with height
  document.getElementById('athena-shadow').setAttribute('rx', (42 + athenaFloat * 0.7).toFixed(1));
  document.getElementById('ares-shadow').setAttribute('rx', (42 + aresFloat * 0.7).toFixed(1));
  // Limp hanging legs trading slowly
  document.getElementById('athena-leg-l').setAttribute('transform', `translate(-10, 44) rotate(${(4 + wave(t, 3000, 0) * 5).toFixed(2)})`);
  document.getElementById('athena-leg-r').setAttribute('transform', `translate(10, 44) rotate(${(-3 + wave(t, 3000, 0.5) * 5).toFixed(2)})`);
  document.getElementById('ares-leg-l').setAttribute('transform', `translate(-10, 44) rotate(${(3 + wave(t, 3000, 0.25) * 5).toFixed(2)})`);
  document.getElementById('ares-leg-r').setAttribute('transform', `translate(10, 44) rotate(${(-4 + wave(t, 3000, 0.75) * 5).toFixed(2)})`);
  // 2.5D head yaw on Athena (eyes slide 10%)
  const yaw = wave(t, 6000, 0) * 3.2;
  document.getElementById('athena-eye-l').setAttribute('cx', (-7 + yaw).toFixed(2));
  document.getElementById('athena-eye-r').setAttribute('cx', (7 + yaw).toFixed(2));

  // 4. RIG CARD 3: CHOROS POTTER'S WHEEL + TUMBLER PARABOLA & VOLUME SQUASH
  document.getElementById('choros-wheel-ring').setAttribute('transform', `rotate(${outerWheelDeg.toFixed(2)})`);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const r = 92;
    wheelDancers[i].setAttribute('transform', `translate(${(Math.cos(a)*r).toFixed(1)}, ${(Math.sin(a)*r).toFixed(1)}) rotate(${(-outerWheelDeg).toFixed(2)})`);
  }

  // Tumblers hopping on out-of-phase 2000ms cycles with Rossark §5.8 & §5.9 volume-preserving squash
  function updateTumbler(id, shadowId, phaseOffset, baseX) {
    const p = loop(t, 2000, phaseOffset); // 0..1
    let lift = 0, sy = 1;
    if (p < 0.65) {
      // Air parabola: k in [-1, 1]
      const k = (p / 0.65) * 2 - 1;
      lift = -38 * (1 - k * k);
      sy = 1.0 + 0.08 * (1 - k * k);
    } else if (p < 0.82) {
      // Contact squash (16% squash, volume preserved: sx = 1 / sy^0.6)
      const sp = (p - 0.65) / 0.17;
      sy = 1.0 - 0.18 * bell(sp);
    }
    const sx = 1 / Math.pow(sy, 0.6);
    document.getElementById(id).setAttribute('transform', `translate(${baseX}, ${lift.toFixed(2)}) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`);
    document.getElementById(shadowId).setAttribute('rx', (16 + lift * 0.18).toFixed(1));
  }
  updateTumbler('tumbler-1', 'tumbler1-shadow', 0.0, -26);
  updateTumbler('tumbler-2', 'tumbler2-shadow', 0.5, 26);

  // 5. RIG CARD 4: TELEMETRY GRAPH PLAYHEAD
  const gx = (t / 12000) * 344;
  const fVal = flow(t, HAMMER_SHOULDER_FLOW);
  const fy = 45 - ((fVal + 55) / 50) * 26;
  const wy = 135 + wave(t, 4000, 0) * 26;
  const by = 238 - lid * 38;

  document.getElementById('dot-flow').setAttribute('cy', fy.toFixed(1));
  document.getElementById('dot-wave').setAttribute('cx', gx.toFixed(1));
  document.getElementById('dot-wave').setAttribute('cy', wy.toFixed(1));
  document.getElementById('dot-blink').setAttribute('cx', gx.toFixed(1));
  document.getElementById('dot-blink').setAttribute('cy', by.toFixed(1));

  // Update HUD readouts
  document.getElementById('m-clock').textContent = `${Math.round(t).toString().padStart(4, '0')} ms`;
  document.getElementById('m-frame').textContent = `${Math.floor((t / 12000) * 720).toString().padStart(3, '0')} / 720`;

  document.getElementById('m-choros').textContent = `${outerWheelDeg.toFixed(1)}°`;
  document.getElementById('scrub').value = t;
  document.getElementById('lbl-ms').textContent = `${Math.round(t)} ms`;
}

document.getElementById('btn-play').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('btn-play').textContent = playing ? 'PAUSE' : 'PLAY';
  if (playing) startWall = performance.now() - manualT;
});
document.getElementById('scrub').addEventListener('input', (e) => {
  playing = false;
  document.getElementById('btn-play').textContent = 'PLAY';
  manualT = parseFloat(e.target.value);
  renderAt(manualT);
});

function tick(now) {
  if (playing && !window.__headlessCapture) {
    manualT = (now - startWall) % 12000;
    renderAt(manualT);
  }
  requestAnimationFrame(tick);
}
renderAt(0);
requestAnimationFrame(tick);
</script>
</body>
</html>

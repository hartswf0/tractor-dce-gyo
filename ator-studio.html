<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ATOR Studio – Minifig / Location / Vehicle / Scene / Movie / World</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000000'/%3E%3Crect x='0' y='0' width='50' height='50' fill='%23FFCC00'/%3E%3Crect x='50' y='0' width='50' height='50' fill='%234ECDC4'/%3E%3Crect x='0' y='50' width='50' height='50' fill='%2300FF88'/%3E%3Crect x='50' y='50' width='50' height='50' fill='%23FF4500'/%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --border: #333333;
      --accent: #FFCC00;
      --accent-soft: rgba(255, 204, 0, 0.16);
      --text: #e5e7eb;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: "Courier New", monospace;
      background: #000;
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .chrome {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #000;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      background: #050505;
      font-size: 9px;
      white-space: nowrap;
    }

    .studio-left {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .studio-label {
      font-size: 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #888;
    }

    .studio-title {
      font-size: 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
    }

    .studio-center {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .studio-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tab-btn {
      position: relative;
      border-radius: 4px 4px 0 0;
      border: 1px solid #333;
      border-bottom: none;
      background: #000;
      color: #777;
      font-size: 8px;
      padding: 2px 8px 3px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: #fff;
      border-color: #eee;
      background: linear-gradient(to bottom, #000, #050505);
    }

    .layout-toggle {
      display: inline-flex;
      gap: 2px;
      border-radius: 999px;
      border: 1px solid #333;
      padding: 1px;
      background: #000;
    }

    .layout-btn {
      border: none;
      margin: 0;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: transparent;
      color: #777;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .layout-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .studio-metrics {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 8px;
      color: var(--text-muted);
    }

    .metric-pill {
      border-radius: 999px;
      border: 1px solid #333;
      padding: 2px 6px;
    }

    .metric-pill.metric-flash {
      border-color: var(--accent);
      color: var(--accent);
      animation: metricPulse 0.6s ease-out;
    }

    .metric-label {
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-right: 3px;
    }

    .metric-value {
      color: #fff;
    }

    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 4px 6px 6px;
      background: #000;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: 1fr;
      grid-auto-rows: minmax(0, 1fr);
      gap: 4px;
      width: 100%;
      height: 100%;
    }

    .panel {
      display: none;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-radius: 3px;
      border: 1px solid #333;
      background: #000;
      overflow: hidden;
    }

    .panel.active {
      display: flex;
    }

    .panel-header {
      padding: 3px 6px;
      border-bottom: 1px solid #333;
      font-size: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #050505;
    }

    .panel-title {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #ddd;
    }

    .panel-body {
      flex: 1;
      min-height: 0;
      position: relative;
      background: #000;
    }

    .panel iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    .mpd-viewer {
      width: 100%;
      height: 100%;
      padding: 8px;
      background: #000;
      color: #ddd;
      font-family: monospace;
      font-size: 10px;
      border: none;
      resize: none;
      outline: none;
      box-sizing: border-box;
    }

    .panel-grid[data-layout="triple"] {
      grid-template-columns: repeat(3, minmax(260px, 1fr));
    }

    .panel-grid[data-layout="triple"] .panel {
      display: none;
    }

    .panel-grid[data-layout="triple"] .panel.triple-active {
      display: flex;
    }

    .toast {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: #050505;
      color: var(--accent);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #333;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes metricPulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.5); }
      100% { box-shadow: 0 0 0 8px rgba(255, 204, 0, 0); }
    }

    @media (max-width: 900px) {
      html, body {
        overflow: auto;
      }

      .chrome {
        height: auto;
        min-height: 100vh;
      }

      .main {
        padding: 0;
      }

      .panel-grid {
        grid-template-columns: 1fr;
      }

      .panel {
        border-radius: 0;
        border-left: none;
        border-right: none;
      }
    }
  </style>
</head>
<body>
  <div class="chrome">
    <header class="header">
      <div class="studio-left">
        <span class="studio-label">STUDIO</span>
        <span class="studio-title">ATOR · MINIFIG / LOCATION / VEHICLE / SCENE / MOVIE / WORLD</span>
      </div>
      <div class="studio-center" id="atorTabs">
        <button class="tab-btn active" data-panel="minifig">MINIFIG</button>
        <button class="tab-btn" data-panel="location">LOCATION</button>
        <button class="tab-btn" data-panel="vehicle">VEHICLE</button>
        <button class="tab-btn" data-panel="scene">SCENE</button>
        <button class="tab-btn" data-panel="movie">MOVIE</button>
        <button class="tab-btn" data-panel="world">WORLD</button>
        <button class="tab-btn" data-panel="mpd">MPD</button>
      </div>
      <div class="studio-right">
        <div class="studio-metrics">
          <div class="metric-pill"><span class="metric-label">movie bags</span><span class="metric-value" id="movieBagCount">0</span></div>
          <div class="metric-pill"><span class="metric-label">world bags</span><span class="metric-value" id="worldBagCount">0</span></div>
        </div>
        <div class="layout-toggle" id="layoutToggle">
          <button class="layout-btn active" data-layout="single"><span>▣</span><span>TABS</span></button>
          <button class="layout-btn" data-layout="triple"><span>☷</span><span>3-UP</span></button>
        </div>
        <button class="layout-btn" id="randomBagBtn" style="border-radius:999px;border:1px solid #333;padding:2px 6px;background:#000;color:#aaa;">
          🎲 BAG
        </button>
      </div>
    </header>

    <main class="main">
      <div class="panel-grid" id="panelGrid" data-layout="single">
        <section class="panel active" data-panel="minifig">
          <div class="panel-header">
            <div class="panel-title">MINIFIGURATOR</div>
          </div>
          <div class="panel-body">
            <iframe src="minifigurator-02.html" title="Minifigurator"></iframe>
          </div>
        </section>

        <section class="panel" data-panel="location">
          <div class="panel-header">
            <div class="panel-title">LOCATIONATOR</div>
          </div>
          <div class="panel-body">
            <iframe src="locationator.html" title="Locationator"></iframe>
          </div>
        </section>

        <section class="panel" data-panel="vehicle">
          <div class="panel-header">
            <div class="panel-title">VEHICULATOR</div>
          </div>
          <div class="panel-body">
            <iframe src="vehiculator.html" title="Vehiculator"></iframe>
          </div>
        </section>

        <section class="panel" data-panel="scene">
          <div class="panel-header">
            <div class="panel-title">SCENEERATOR</div>
          </div>
          <div class="panel-body">
            <iframe src="sceneerator-02.html" title="Sceneerator"></iframe>
          </div>
        </section>

        <section class="panel" data-panel="movie">
          <div class="panel-header">
            <div class="panel-title">MOVIEATOR</div>
          </div>
          <div class="panel-body">
            <iframe src="movieator-02.html" title="Movieator"></iframe>
          </div>
        </section>

        <section class="panel" data-panel="world">
          <div class="panel-header">
            <div class="panel-title">WORLDINATOR</div>
          </div>
          <div class="panel-body">
            <iframe src="worldinator.html" title="Worldinator"></iframe>
          </div>
        </section>

        <section class="panel" data-panel="mpd">
          <div class="panel-header">
            <div class="panel-title">MPD INSPECTOR</div>
          </div>
          <div class="panel-body">
            <textarea id="mpdInspector" class="mpd-viewer" readonly spellcheck="false" placeholder="Last scene-mpd payload will appear here…"></textarea>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="toast" id="studioToast"></div>

  <script>
    (function() {
      const grid = document.getElementById('panelGrid');
      const layoutButtons = Array.from(document.querySelectorAll('#layoutToggle .layout-btn'));
      const tabs = Array.from(document.querySelectorAll('#atorTabs .tab-btn'));
      const panels = Array.from(document.querySelectorAll('.panel-grid .panel'));
      const randomBagBtn = document.getElementById('randomBagBtn');
      const movieBagCountEl = document.getElementById('movieBagCount');
      const worldBagCountEl = document.getElementById('worldBagCount');
      const toastEl = document.getElementById('studioToast');
      const mpdInspectorEl = document.getElementById('mpdInspector');

      let layout = 'single';
      let activePanel = 'minifig';

      const studioState = {
        movieBags: [],
        worldBags: []
      };

      const showToast = (msg) => {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2200);
      };

      const updateMetrics = () => {
        if (movieBagCountEl) movieBagCountEl.textContent = String(studioState.movieBags.length);
        if (worldBagCountEl) worldBagCountEl.textContent = String(studioState.worldBags.length);
      };

      const flashMetric = (kind) => {
        let pill = null;
        if (kind === 'movie' && movieBagCountEl && movieBagCountEl.parentElement) {
          pill = movieBagCountEl.parentElement;
        } else if (kind === 'world' && worldBagCountEl && worldBagCountEl.parentElement) {
          pill = worldBagCountEl.parentElement;
        }
        if (!pill) return;
        pill.classList.remove('metric-flash');
        // force reflow so animation can restart
        void pill.offsetWidth;
        pill.classList.add('metric-flash');
        setTimeout(() => {
          pill.classList.remove('metric-flash');
        }, 700);
      };

      const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

      function applyLayout(nextLayout) {
        if (isMobile()) {
          layout = 'single';
          grid.setAttribute('data-layout', layout);
          panels.forEach(panel => {
            panel.classList.remove('triple-active');
            panel.classList.toggle('active', panel.dataset.panel === activePanel);
          });
          layoutButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.layout === 'single'));
          return;
        }
        layout = nextLayout;
        grid.setAttribute('data-layout', layout);
        layoutButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.layout === layout));

        if (layout === 'single') {
          panels.forEach(panel => {
            panel.classList.remove('triple-active');
            panel.classList.toggle('active', panel.dataset.panel === activePanel);
          });
        } else {
          panels.forEach(panel => {
            const id = panel.dataset.panel;
            const showTriple = id === 'scene' || id === 'movie' || id === 'world';
            panel.classList.remove('active');
            panel.classList.toggle('triple-active', showTriple);
          });
        }
      }

      function setActivePanel(panelId) {
        activePanel = panelId;
        tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.panel === activePanel));
        if (layout === 'single') {
          panels.forEach(panel => {
            panel.classList.remove('triple-active');
            panel.classList.toggle('active', panel.dataset.panel === activePanel);
          });
        }
      }

      layoutButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          if (isMobile()) return;
          const next = btn.dataset.layout;
          if (!next || next === layout) return;
          applyLayout(next);
        });
      });

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const panelId = tab.dataset.panel;
          if (!panelId || panelId === activePanel) return;
          setActivePanel(panelId);
        });
      });

      if (randomBagBtn) {
        randomBagBtn.addEventListener('click', () => {
          const pools = [];
          if (studioState.movieBags.length) pools.push('movie');
          if (studioState.worldBags.length) pools.push('world');
          if (!pools.length) {
            showToast('NO BAGS YET – CLICK BAG BUTTONS INSIDE ATORS');
            return;
          }
          const which = pools[Math.floor(Math.random() * pools.length)];
          if (which === 'movie') {
            const bag = studioState.movieBags[Math.floor(Math.random() * studioState.movieBags.length)];
            const count = (bag && bag.payload && bag.payload.scenes) ? bag.payload.scenes.length : 0;
            setActivePanel('movie');
            applyLayout('single');
            showToast(`⭐ MOVIE BAG · ${count} SCENES`);
          } else {
            const bag = studioState.worldBags[Math.floor(Math.random() * studioState.worldBags.length)];
            const count = (bag && bag.payload && bag.payload.worlds) ? bag.payload.worlds.length : 0;
            setActivePanel('world');
            applyLayout('single');
            showToast(`⭐ WORLD BAG · ${count} WORLDS`);
          }
        });
      }

      // Listen on wag-frank to collect bags from embedded ATORs
      const bus = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('wag-frank') : null;
      if (bus) {
        bus.onmessage = (event) => {
          const msg = event.data;
          if (!msg || typeof msg !== 'object') return;
          if (msg.kind === 'scene-mpd') {
            const payload = msg.payload || {};
            const lines = payload.mpdLines || [];
            if (mpdInspectorEl && lines.length) {
              mpdInspectorEl.value = lines.join('\n');
              showToast('STUDIO: MPD UPDATED');
            }
          } else if (msg.kind === 'movie-bag') {
            studioState.movieBags.push(msg);
            updateMetrics();
            flashMetric('movie');
            showToast('STUDIO: MOVIE BAG +1');
          } else if (msg.kind === 'world-bag') {
            studioState.worldBags.push(msg);
            updateMetrics();
            flashMetric('world');
            showToast('STUDIO: WORLD BAG +1');
          }
        };
      }

      // initial
      applyLayout(layout);
      setActivePanel(activePanel);
      updateMetrics();
    })();
  </script>
</body>
</html>

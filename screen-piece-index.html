<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Screen Piece Index</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#e8e8e8;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}.top{display:grid;grid-template-columns:auto minmax(160px,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #292929;background:#090909}.title{font-weight:800;letter-spacing:.08em}.sub{color:#777;font-size:10px}.search{width:100%;background:#111;border:1px solid #333;color:#fff;padding:8px 10px;border-radius:5px;outline:none}.count{color:#aaa;font-size:10px;white-space:nowrap}.main{min-height:0;display:grid;grid-template-columns:190px minmax(280px,1fr) minmax(340px,42vw)}.pane{min-width:0;min-height:0;border-right:1px solid #222;display:flex;flex-direction:column}.pane:last-child{border-right:0}.panehead{padding:8px 10px;border-bottom:1px solid #222;color:#777;font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:#080808}.scroll{overflow:auto;min-height:0;flex:1}.world{width:100%;border:0;border-bottom:1px solid #151515;background:#050505;color:#ddd;text-align:left;padding:9px 10px;cursor:pointer}.world.active{background:#141414;border-left:3px solid #ffd400;padding-left:7px}.world small{display:block;color:#666;margin-top:2px}.row{display:grid;grid-template-columns:86px minmax(120px,1fr) 110px;gap:8px;padding:8px 10px;border-bottom:1px solid #151515;cursor:pointer}.row:hover,.row.active{background:#111}.file{color:#ffd400}.desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{color:#777;text-align:right}.detail{display:grid;grid-template-rows:minmax(220px,46%) 1fr;min-height:0}.view{position:relative;min-height:0;background:#000}.view canvas{display:block;width:100%;height:100%}.viewmsg{position:absolute;inset:0;display:grid;place-items:center;color:#666;pointer-events:none;text-align:center;padding:20px}.meta{overflow:auto;padding:12px}.meta h2{font-size:15px;margin:0 0 4px;color:#ffd400}.meta .descfull{color:#ccc;margin:0 0 12px}.kv{display:grid;grid-template-columns:90px 1fr;gap:5px 10px;margin-bottom:12px}.k{color:#666}.v{word-break:break-word}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}.chip{border:1px solid #333;border-radius:999px;padding:3px 7px;color:#aaa;font-size:9px}.raw{white-space:pre-wrap;background:#0b0b0b;border:1px solid #222;padding:9px;border-radius:5px;color:#aaa;font-size:10px}.actions{display:flex;gap:6px;margin-bottom:10px}.btn{border:1px solid #333;background:#111;color:#ddd;padding:7px 9px;border-radius:4px;cursor:pointer}.btn.primary{background:#ffd400;border-color:#ffd400;color:#000}.empty{padding:14px;color:#666}.status{color:#8bbf8b}
@media(max-width:800px){.top{grid-template-columns:1fr auto}.titlewrap{grid-column:1/-1}.main{grid-template-columns:1fr;grid-template-rows:auto minmax(180px,30%) 1fr}.pane.worldpane{display:none}.piecepane{border-right:0;border-bottom:1px solid #222}.detailpane{border-right:0}.detail{grid-template-rows:minmax(190px,48%) 1fr}.row{grid-template-columns:82px 1fr 84px}.top{padding:8px}.search{min-width:0}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="titlewrap"><div class="title">SCREEN PIECE INDEX</div><div class="sub">film / television → exact LDraw part → geometry</div></div>
    <input id="search" class="search" placeholder="search character, object, filename, description">
    <div id="count" class="count">LOADING</div>
  </header>
  <main class="main">
    <section class="pane worldpane"><div class="panehead">Work</div><div id="worlds" class="scroll"></div></section>
    <section class="pane piecepane"><div id="pieceHead" class="panehead">Pieces</div><div id="pieces" class="scroll"></div></section>
    <section class="pane detailpane"><div class="detail"><div id="viewer" class="view"><div id="viewmsg" class="viewmsg">Select a piece</div></div><div id="meta" class="meta"><div class="empty">The index is built from the repository's full LDraw descriptor corpus. Select any matched .dat to inspect it.</div></div></div></section>
  </main>
</div>
<script src="./ldraw/build/three.js"></script>
<script src="./ldraw/examples/js/controls/OrbitControls.js"></script>
<script src="./ldraw/examples/js/loaders/LDrawLoader.js"></script>
<script>
const SOURCE='./wag-viewer-prime-integration-20251112-055341%20copy/all-parts-descriptors.json';
const WORLDS=[
{id:'simpsons',label:'The Simpsons',terms:['simpsons','simpson','springfield'],people:[['Homer Simpson',['homer simpson','homer']],['Marge Simpson',['marge simpson','marge']],['Bart Simpson',['bart simpson','bart']],['Lisa Simpson',['lisa simpson','lisa']],['Maggie Simpson',['maggie simpson','maggie']],['Ned Flanders',['ned flanders','flanders']],['Krusty',['krusty']] ]},
{id:'star-wars',label:'Star Wars',terms:['star wars','x-wing','tie fighter','tie interceptor','death star','millennium falcon','at-at','at-st','jedi','sith'],people:[['Darth Vader',['darth vader','vader']],['Yoda',['yoda']],['Stormtrooper',['stormtrooper']],['R2-D2',['r2-d2','r2d2']],['C-3PO',['c-3po','c3po']],['Wookiee',['wookiee']],['Ewok',['ewok']]]},
{id:'gremlins',label:'Gremlins',terms:['gremlin','gremlins','mogwai'],people:[['Gizmo',['gizmo','mogwai']]]},
{id:'powerpuff',label:'The Powerpuff Girls',terms:['powerpuff girls','powerpuff'],people:[['Blossom',['blossom']],['Bubbles',['bubbles']],['Buttercup',['buttercup']],['Mojo Jojo',['mojo jojo']]]},
{id:'back-to-future',label:'Back to the Future',terms:['back to the future','delorean'],people:[['Marty McFly',['marty mcfly']],['Doc Brown',['doc brown']]]},
{id:'ghostbusters',label:'Ghostbusters',terms:['ghostbusters','ecto-1','stay puft','slimer'],people:[]},
{id:'scooby-doo',label:'Scooby-Doo',terms:['scooby-doo','scooby doo'],people:[['Scooby-Doo',['scooby']],['Shaggy',['shaggy']],['Velma',['velma']],['Daphne',['daphne']],['Fred',['fred']]]},
{id:'stranger-things',label:'Stranger Things',terms:['stranger things','demogorgon'],people:[['Lucas Sinclair',['lucas sinclair']]]},
{id:'disney',label:'Disney / Mickey',terms:['disney','mickey','minnie','donald duck','goofy'],people:[]}
];
const state={records:[],indexed:[],world:'simpsons',query:'',selected:null,renderer:null,scene:null,camera:null,controls:null,model:null};
const $=id=>document.getElementById(id);
const norm=s=>(s||'').toString().toLowerCase();
function collect(node,out,seen){if(!node||typeof node!=='object')return;if(seen.has(node))return;seen.add(node);if(!Array.isArray(node)){const filename=node.filename||node.name;const description=node.description||node.desc||'';const path=node.path||'';if(filename&&/\.dat$/i.test(filename)&&(/(^|\/)parts\//i.test(path)||!path)){out.push({filename:String(filename),description:String(description),path:path?String(path):'parts/'+String(filename),category:node.category||'',source:node});}}for(const v of Array.isArray(node)?node:Object.values(node))collect(v,out,seen)}
function roleOf(d){const s=norm(d);if(s.includes('headgear')||s.includes('helmet')||s.includes(' hat ')||s.includes('hair')||s.includes('crown')||s.includes('headdress'))return'HEADGEAR';if(s.includes('minifig head'))return'HEAD';if(s.includes('torso'))return'TORSO';if(s.includes('hips and legs'))return'HIPS+LEGS';if(s.includes('hip'))return'HIPS';if(s.includes(' leg'))return'LEG';if(s.includes(' arm'))return'ARM';if(s.includes('hand'))return'HAND';if(s.includes('skirt')||s.includes('cape')||s.includes('cloth'))return'COSTUME';if(s.includes('wheel')||s.includes('hubcap')||s.includes('windscreen')||s.includes('vehicle'))return'VEHICLE';if(s.includes('tile')||s.includes('weapon')||s.includes('accessory')||s.includes('slingshot')||s.includes('book')||s.includes('shield'))return'PROP';return'PIECE'}
function matchesWorld(rec,w){const t=norm(rec.filename+' '+rec.description+' '+rec.path);const hit=[...w.terms,...w.people.flatMap(p=>p[1])].find(x=>t.includes(norm(x)));if(!hit)return null;let character='';for(const [name,terms] of w.people){if(terms.some(x=>t.includes(norm(x)))){character=name;break}}return{...rec,worldId:w.id,worldLabel:w.label,character,matched:hit,role:roleOf(rec.description),status:(norm(rec.description).startsWith('~')?'SUBPART':norm(rec.description).includes('obsolete')?'OBSOLETE':'PRIMARY')};}
function buildIndex(){const dedup=new Map();for(const r of state.records){for(const w of WORLDS){const m=matchesWorld(r,w);if(m)dedup.set(w.id+'|'+r.path,m)}}state.indexed=[...dedup.values()].sort((a,b)=>a.worldLabel.localeCompare(b.worldLabel)||a.character.localeCompare(b.character)||a.filename.localeCompare(b.filename));renderWorlds();renderPieces();}
function visible(){const q=norm(state.query);return state.indexed.filter(r=>(state.world==='all'||r.worldId===state.world)&&(!q||norm([r.worldLabel,r.character,r.filename,r.description,r.role,r.matched].join(' ')).includes(q)))}
function renderWorlds(){const counts={all:state.indexed.length};for(const w of WORLDS)counts[w.id]=state.indexed.filter(r=>r.worldId===w.id).length;$('worlds').innerHTML=[{id:'all',label:'All screen works'},...WORLDS].map(w=>`<button class="world ${state.world===w.id?'active':''}" data-world="${w.id}">${w.label}<small>${counts[w.id]||0} pieces</small></button>`).join('');document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{state.world=b.dataset.world;state.selected=null;renderWorlds();renderPieces();});}
function renderPieces(){const rows=visible();$('count').textContent=rows.length+' PIECES';$('pieceHead').textContent=(state.world==='all'?'ALL WORKS':(WORLDS.find(w=>w.id===state.world)?.label||'Pieces'))+' · '+rows.length;$('pieces').innerHTML=rows.length?rows.map((r,i)=>`<div class="row ${state.selected&&state.selected.path===r.path&&state.selected.worldId===r.worldId?'active':''}" data-row="${i}"><div class="file">${esc(r.filename)}</div><div><div class="desc">${esc(r.description||'(no description)')}</div><div class="sub">${esc(r.character||r.worldLabel)} · ${esc(r.status)}</div></div><div class="role">${esc(r.role)}</div></div>`).join(''):'<div class="empty">No matching pieces.</div>';document.querySelectorAll('[data-row]').forEach(el=>el.onclick=()=>select(rows[+el.dataset.row]));}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function init3d(){if(!window.THREE)return;const host=$('viewer');state.scene=new THREE.Scene();state.camera=new THREE.PerspectiveCamera(38,1,.1,10000);state.camera.position.set(90,70,120);state.renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});state.renderer.setPixelRatio(Math.min(devicePixelRatio,2));state.renderer.setClearColor(0x000000);host.prepend(state.renderer.domElement);state.controls=new THREE.OrbitControls(state.camera,state.renderer.domElement);state.controls.enableDamping=true;state.scene.add(new THREE.HemisphereLight(0xffffff,0x333333,1.5));const d=new THREE.DirectionalLight(0xffffff,1.2);d.position.set(80,120,90);state.scene.add(d);resize();addEventListener('resize',resize);(function loop(){requestAnimationFrame(loop);state.controls&&state.controls.update();state.renderer.render(state.scene,state.camera)})();}
function resize(){if(!state.renderer)return;const r=$('viewer').getBoundingClientRect();state.renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);state.camera.aspect=Math.max(1,r.width)/Math.max(1,r.height);state.camera.updateProjectionMatrix();}
function clearModel(){if(state.model&&state.scene){state.scene.remove(state.model);state.model.traverse?.(o=>{o.geometry?.dispose?.();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose?.())}});state.model=null}}
function frame(obj){const box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),max=Math.max(size.x,size.y,size.z)||40;obj.position.sub(center);state.camera.position.set(max*1.6,max*1.2,max*2);state.camera.near=Math.max(.1,max/100);state.camera.far=max*50;state.camera.updateProjectionMatrix();state.controls.target.set(0,0,0);state.controls.update()}
function load3d(rec){clearModel();$('viewmsg').textContent='Loading '+rec.filename+'…';if(!window.THREE||!THREE.LDrawLoader){$('viewmsg').textContent='3D loader unavailable';return}try{const loader=new THREE.LDrawLoader();loader.setPath('./ldraw/');if(loader.setPartsLibraryPath)loader.setPartsLibraryPath('./ldraw/');loader.load(rec.path,obj=>{state.model=obj;state.scene.add(obj);frame(obj);$('viewmsg').textContent='';},undefined,err=>{$('viewmsg').textContent='3D load failed · source still inspectable';console.warn(err)});}catch(err){$('viewmsg').textContent='3D load failed · source still inspectable';console.warn(err)}}
async function loadHeader(rec){try{const res=await fetch('./ldraw/'+rec.path);if(!res.ok)throw new Error(res.status);const text=await res.text();return text.split(/\r?\n/).slice(0,36).join('\n')}catch(e){return'Header unavailable: '+e.message}}
async function select(rec){state.selected=rec;renderPieces();load3d(rec);$('meta').innerHTML=`<h2>${esc(rec.filename)}</h2><p class="descfull">${esc(rec.description||'')}</p><div class="actions"><button id="sourceBtn" class="btn primary">OPEN .DAT</button><button id="copyBtn" class="btn">COPY PATH</button></div><div class="kv"><div class="k">WORK</div><div class="v">${esc(rec.worldLabel)}</div><div class="k">CHARACTER</div><div class="v">${esc(rec.character||'—')}</div><div class="k">ROLE</div><div class="v">${esc(rec.role)}</div><div class="k">LDRAW</div><div class="v">${esc(rec.path)}</div><div class="k">MATCH</div><div class="v">${esc(rec.matched)}</div><div class="k">STATUS</div><div class="v">${esc(rec.status)}</div></div><div class="chips"><span class="chip">EXACT .DAT</span><span class="chip">LIVE GEOMETRY</span><span class="chip">REPO SOURCE</span></div><div id="raw" class="raw">Loading LDraw header…</div>`;$('sourceBtn').onclick=()=>open('./ldraw/'+rec.path,'_blank');$('copyBtn').onclick=()=>navigator.clipboard?.writeText(rec.path);$('raw').textContent=await loadHeader(rec);}
$('search').addEventListener('input',e=>{state.query=e.target.value;renderPieces()});
async function boot(){try{const res=await fetch(SOURCE);if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();const raw=[];collect(data,raw,new WeakSet());const byPath=new Map();raw.forEach(r=>byPath.set(r.path,r));state.records=[...byPath.values()];buildIndex();$('count').classList.add('status');}catch(err){$('count').textContent='INDEX LOAD FAILED';$('pieces').innerHTML='<div class="empty">Could not load '+esc(SOURCE)+'<br><br>'+esc(err.message)+'</div>';console.error(err)}}
init3d();boot();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>MOVIEATOR — Sniff-Passed Minifigs</title>
<style>
:root{--ink:#090909;--paper:#faf9f4;--world:#f2f0e9;--muted:#707070;--yellow:#ffdf2b;--green:#18be74;--red:#ef3b32}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,select{font:inherit;color:inherit;background:var(--paper);border:1.5px solid #111;border-radius:0;min-height:36px;padding:5px 8px;font-weight:800}#app{height:100dvh;display:grid;grid-template-rows:42px 42px minmax(0,1fr) 43%}header,#selectors{display:flex;align-items:center;gap:6px;padding:4px 7px;border-bottom:2px solid #111;overflow-x:auto;white-space:nowrap}header strong{font-size:10px;margin-right:auto}.chip{border:1px solid #111;padding:4px 6px;font-size:8px;flex:none}.ok{background:var(--green)}.bad{background:var(--red);color:white}.pending{background:var(--yellow)}#selectors b{font-size:8px}#selectors select{font-size:8px;min-height:31px;max-width:43%}#view{position:relative;min-height:0;background:var(--world);border-bottom:2px solid #111}#threeHost{position:absolute;inset:0}canvas{width:100%!important;height:100%!important;display:block;touch-action:none}#identity{position:absolute;left:8px;top:8px;max-width:70%;padding:6px 8px;background:#fff;border:2px solid #111;z-index:3;pointer-events:none}#identity small{display:block;font-size:7px;letter-spacing:.12em}#identity strong{display:block;font-size:15px;line-height:1.05;margin:2px 0}#identity span{display:block;font-size:8px;color:var(--muted)}#badge{position:absolute;right:8px;top:8px;border:1px solid #111;background:#fff;padding:5px 7px;font-size:8px;z-index:3}#dock{min-height:0;display:grid;grid-template-rows:46px minmax(0,1fr)}#controls{display:flex;gap:4px;padding:4px 5px;overflow-x:auto;border-bottom:2px solid #111}#controls button{font-size:8px;white-space:nowrap}#nextBtn{background:var(--yellow)}#lower{display:grid;grid-template-columns:1fr 1fr 1fr;min-height:0}.pane{overflow:auto;min-height:0;border-right:1px solid #111}.pane:last-child{border-right:0}.title{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid #111;padding:6px 7px;font-size:8px;font-weight:900}.fig,.piece{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #bbb;background:var(--paper);padding:7px;min-height:0}.fig.active,.piece.active{background:var(--yellow)}.fig b,.piece b{display:block;font-size:9px}.fig small,.piece small{display:block;font-size:7px;color:var(--muted);margin-top:2px;line-height:1.2}.exact{color:#00844f!important}.context{color:#777!important}#raw{padding:8px;font-size:8px;white-space:pre-wrap;word-break:break-word;line-height:1.25}.legend{padding:6px 7px;border-bottom:1px solid #bbb;font-size:7px;color:var(--muted)}
@media(max-width:720px){#app{grid-template-rows:39px 39px minmax(0,1fr) 49%}header strong{font-size:8px}#selectors{padding:3px 5px}.chip{font-size:7px}.hideMobile{display:none}#identity{max-width:72%}#identity strong{font-size:12px}#lower{grid-template-columns:1fr 1fr}.pane:nth-child(3){display:none}#controls button{font-size:7px;padding:5px 7px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body><div id="app">
<header><strong>MOVIEATOR / SNIFF-PASSED MINIFIGS</strong><span class="chip pending" id="ready">CHECKING</span><span class="chip" id="figCount">-- FIGS</span><span class="chip hideMobile" id="testCount">0 / 0 PASS</span></header>
<div id="selectors"><b>WORLD</b><select id="worldSelect"></select><b>FIGURE</b><select id="figSelect"></select></div>
<section id="view"><div id="threeHost"></div><div id="identity"><small>FIGURE</small><strong id="figName">loading…</strong><span id="figNote">only curated assemblies</span></div><div id="badge">LDRAW</div></section>
<section id="dock"><div id="controls"><button id="prevBtn">PREV</button><button id="nextBtn">NEXT</button><button id="spinBtn">SPIN</button><button id="openBtn">OPEN PART</button></div><div id="lower"><div class="pane"><div class="title">FIGURES</div><div id="figList"></div></div><div class="pane"><div class="title">RENDERED PIECES</div><div class="legend">One canonical anatomical choice per slot. Related-but-unmounted records are not rendered.</div><div id="pieceList"></div></div><div class="pane"><div class="title">SELECTED .DAT HEADER</div><div id="raw">select a piece</div></div></div></section>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {LDrawLoader} from 'three/addons/loaders/LDrawLoader.js';
import {LDrawConditionalLineMaterial} from 'three/addons/materials/LDrawConditionalLineMaterial.js';
const $=id=>document.getElementById(id);
const P=(slot,file,description,extra={})=>({slot,file,description,exact:true,...extra});
const WORLDS=[['simpsons','The Simpsons'],['star-wars','Star Wars'],['powerpuff','The Powerpuff Girls'],['scooby-doo','Scooby-Doo'],['gremlins','Gremlins']];
const FIGURES=[
{id:'homer',world:'simpsons',name:'Homer Simpson',note:'exact Homer head + exact printed upper',parts:[P('HEAD','15527p02.dat','Homer Simpson head',{color:14}),P('UPPER','16360p87.dat','Homer Simpson office upper'),P('LOWER','3815c01.dat','plain blue hips + legs',{exact:false,color:1})]},
{id:'marge',world:'simpsons',name:'Marge Simpson',note:'formed skirt only; flat fabric source is never mounted',parts:[P('HEAD','15522p02.dat','Marge Simpson head',{color:14}),P('UPPER','76382pd13.dat','Marge dress upper'),P('HIPWEAR','u9209c01.dat','Marge formed skirt',{color:2,dy:0})]},
{id:'bart',world:'simpsons',name:'Bart Simpson',note:'exact head + slingshot torso + short printed legs',parts:[P('HEAD','15523p02.dat','Bart Simpson head',{color:14}),P('TORSO','973pd12.dat','Bart slingshot torso',{color:4}),P('LOWER','16709p02.dat','Bart short hips + legs')]},
{id:'lisa',world:'simpsons',name:'Lisa Simpson',note:'exact Lisa head + beads upper',parts:[P('HEAD','15524p02.dat','Lisa Simpson head',{color:14}),P('UPPER','76382pd14.dat','Lisa beads upper'),P('LOWER','3815c01.dat','plain red hips + legs',{exact:false,color:4})]},
{id:'ned',world:'simpsons',name:'Ned Flanders',note:'exact head + apron upper + apron lower',parts:[P('HEAD','15529p01.dat','Ned Flanders head',{color:14}),P('UPPER','76382p89.dat','Ned apron upper'),P('LOWER','73200p89.dat','Ned apron hips + legs')]},
{id:'vader',world:'star-wars',name:'Darth Vader',note:'one helmet choice; unrelated Vader-branded objects excluded',parts:[P('HEAD','3626b.dat','black head context',{exact:false,color:0}),P('HEADGEAR','30368.dat','Darth Vader minifig helmet',{color:0}),P('UPPER','76382ps7.dat','Darth Vader printed upper',{color:0}),P('LOWER','3815c01.dat','black hips + legs context',{exact:false,color:0})]},
{id:'yoda',world:'star-wars',name:'Yoda',note:'one patterned Yoda head; alternates and subparts excluded',parts:[P('HEAD','13195p01.dat','Yoda head with eyes and grey hair',{color:16}),P('UPPER','973c01.dat','tan upper context',{exact:false,color:19}),P('LOWER','3815c01.dat','tan lower context',{exact:false,color:19})]},
{id:'blossom',world:'powerpuff',name:'Blossom',note:'single official head shortcut; apple blossom and internal subparts excluded',parts:[P('HEAD','28946.dat','Blossom complete head shortcut'),P('UPPER','973c01.dat','red upper context',{exact:false,color:4}),P('LOWER','3815c01.dat','blue lower context',{exact:false,color:1})]},
{id:'bubbles',world:'powerpuff',name:'Bubbles',note:'single official head shortcut; internal subparts excluded',parts:[P('HEAD','28948.dat','Bubbles complete head shortcut'),P('UPPER','973c01.dat','light-blue upper context',{exact:false,color:9}),P('LOWER','3815c01.dat','blue lower context',{exact:false,color:1})]},
{id:'buttercup',world:'powerpuff',name:'Buttercup',note:'single official head shortcut; internal subparts excluded',parts:[P('HEAD','28949.dat','Buttercup complete head shortcut'),P('UPPER','973c01.dat','green upper context',{exact:false,color:2}),P('LOWER','3815c01.dat','black lower context',{exact:false,color:0})]},
{id:'shaggy',world:'scooby-doo',name:'Shaggy Rogers',note:'exact Shaggy Rogers hair; adjective matches excluded',parts:[P('HEAD','3626b.dat','light-nougat head context',{exact:false,color:78}),P('HEADGEAR','21787.dat','Shaggy Rogers hair',{color:84}),P('UPPER','973c01.dat','lime upper context',{exact:false,color:27}),P('LOWER','3815c01.dat','dark-red lower context',{exact:false,color:320})]},
{id:'fred',world:'scooby-doo',name:'Fred Jones',note:'exact Fred hair + exact ascot torso',parts:[P('HEAD','3626b.dat','light-nougat head context',{exact:false,color:78}),P('HEADGEAR','21788.dat','Fred Jones hair',{color:14}),P('TORSO','973px3.dat','Fred sweater + orange ascot',{color:15}),P('LOWER','3815c01.dat','blue lower context',{exact:false,color:1})]},
{id:'gremlin',world:'gremlins',name:'Gremlin',note:'exact Gremlin sculpted head on neutral body context',parts:[P('HEAD','26056.dat','Gremlin sculpted head',{color:16}),P('UPPER','973c01.dat','neutral upper context',{exact:false,color:0}),P('LOWER','3815c01.dat','neutral lower context',{exact:false,color:0})]}
];
const state={world:'simpsons',fig:null,selected:0,root:null,spin:false,error:null,lastSniff:null};
const structuralSlots=new Set(['HEAD','HEADGEAR','UPPER','TORSO','LOWER','HIPWEAR']);
function preflight(fig){const seen=new Set(),problems=[];for(const p of fig.parts){if(structuralSlots.has(p.slot)&&seen.has(p.slot))problems.push('duplicate '+p.slot);seen.add(p.slot);if(/^~/.test(p.description))problems.push('subpart '+p.file);if(/obsolete/i.test(p.description))problems.push('obsolete '+p.file)}return{pass:problems.length===0,problems}}
const host=$('threeHost'),mobile=matchMedia('(max-width:720px)').matches;
const renderer=new THREE.WebGLRenderer({antialias:!mobile,powerPreference:'high-performance',preserveDrawingBuffer:true});renderer.setPixelRatio(mobile?1:Math.min(devicePixelRatio||1,1.5));renderer.setClearColor(0xf2f0e9);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,10000),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.4));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(180,240,170);scene.add(key);const grid=new THREE.GridHelper(300,15,0x8c8c8c,0xd4d1c8);scene.add(grid);
const loader=new LDrawLoader();loader.setConditionalLineMaterial(LDrawConditionalLineMaterial);loader.setPartsLibraryPath('./ldraw/');let ldrawReady=false;
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function loop(){requestAnimationFrame(loop);resize();controls.update();if(state.spin&&state.root)state.root.rotation.y+=.008;renderer.render(scene,camera)}requestAnimationFrame(loop);
function dispose(o){o?.traverse(x=>{x.geometry?.dispose?.();(Array.isArray(x.material)?x.material:[x.material]).filter(Boolean).forEach(m=>m.dispose?.())})}
function clear(){if(state.root){scene.remove(state.root);dispose(state.root)}state.root=null}
function line(color,x,y,z,file,m='1 0 0 0 1 0 0 0 1'){return`1 ${color??16} ${x} ${y} ${z} ${m} parts/${file}`}
function torsoLines(p){const c=p.color??16;return[line(c,0,-60,0,p.file),line(c,-15.552,-51,0,'3818.dat','0.985 -0.17 0 0.17 0.985 0 0 0 1'),line(c,15.552,-51,0,'3819.dat','0.985 0.17 0 -0.17 0.985 0 0 0 1'),line(14,-23.6904,-33.226,-9.8982,'3820.dat','0.985 -0.1202 0.1202 0.17 0.6964 -0.6964 0 0.707 0.707'),line(14,23.6904,-33.226,-9.8982,'3820.dat','0.985 0.1202 -0.1202 -0.17 0.6964 -0.6964 0 0.707 0.707')]}
function assembly(fig){const L=[`0 FILE movieator_${fig.id}.mpd`,`0 Name: ${fig.name}`,'0 Author: MOVIEATOR','0 !LDRAW_ORG Model','0 BFC CERTIFY CCW',''];for(const p of fig.parts){const c=p.color??16,dy=p.dy||0;switch(p.slot){case'HEAD':L.push(line(c,0,-84+dy,0,p.file));break;case'HEADGEAR':L.push(line(c,0,-84+dy,0,p.file));break;case'UPPER':L.push(line(c,0,-60+dy,0,p.file));break;case'TORSO':L.push(...torsoLines(p));break;case'LOWER':L.push(line(c,0,-28+dy,0,p.file));break;case'HIPWEAR':L.push(line(c,0,-28+dy,0,p.file));break;}L.push('')}return L.join('\n')}
function fit(root){const b=new THREE.Box3().setFromObject(root);if(b.isEmpty())return null;const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z,55);controls.target.copy(c);camera.position.set(c.x+d*1.25,c.y+d*.65,c.z+d*1.7);camera.near=.1;camera.far=d*50;camera.updateProjectionMatrix();grid.position.y=b.min.y-.8;return{s,b,c,d}}
function sniff(fig,fitData){const pre=preflight(fig),problems=[...pre.problems];if(state.error)problems.push('loader error: '+state.error);if(!fitData)problems.push('empty geometry');else{const s=fitData.s;if(s.x>145||s.y>180||s.z>145)problems.push(`oversize ${s.x.toFixed(1)}×${s.y.toFixed(1)}×${s.z.toFixed(1)}`);if(s.x<20||s.y<35)problems.push('undersize');if(s.x/s.y>1.75)problems.push('too wide for figure');}const result={id:fig.id,name:fig.name,pass:problems.length===0,problems,size:fitData?{x:+fitData.s.x.toFixed(1),y:+fitData.s.y.toFixed(1),z:+fitData.s.z.toFixed(1)}:null};state.lastSniff=result;window.__MOVIEATOR_SNIFF=result;$('badge').textContent=result.pass?'SNIFF PASS':'SNIFF FAIL';$('badge').className=result.pass?'ok':'bad';return result}
function renderFig(){return new Promise(resolve=>{if(!ldrawReady||!state.fig){resolve(null);return}state.error=null;$('badge').textContent='LOADING';loader.parse(assembly(state.fig),g=>{clear();state.root=new THREE.Group();state.root.rotation.x=Math.PI;state.root.add(g);scene.add(state.root);const fd=fit(state.root);const r=sniff(state.fig,fd);renderer.render(scene,camera);window.__MOVIEATOR_READY=true;resolve(r)},e=>{state.error=String(e?.message||e);clear();sniff(state.fig,null);window.__MOVIEATOR_READY=true;resolve(state.lastSniff)})})}
function worldFigures(){return FIGURES.filter(f=>f.world===state.world)}
function selectors(){const used=WORLDS.filter(([id])=>FIGURES.some(f=>f.world===id));$('worldSelect').innerHTML=used.map(([id,n])=>`<option value="${id}">${n}</option>`).join('');$('worldSelect').value=state.world;const fs=worldFigures();$('figSelect').innerHTML=fs.map(f=>`<option value="${f.id}">${f.name}</option>`).join('');if(state.fig)$('figSelect').value=state.fig.id;$('figCount').textContent=fs.length+' FIGS'}
function lists(){selectors();const fs=worldFigures();$('figList').innerHTML=fs.map(f=>`<button class="fig ${state.fig?.id===f.id?'active':''}" data-f="${f.id}"><b>${f.name}</b><small>${f.note}</small></button>`).join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>selectFig(FIGURES.find(f=>f.id===b.dataset.f)));const ps=state.fig?.parts||[];$('pieceList').innerHTML=ps.map((p,i)=>`<button class="piece ${state.selected===i?'active':''}" data-p="${i}"><b>${String(i+1).padStart(2,'0')} · ${p.file}</b><small>${p.description}</small><small class="${p.exact?'exact':'context'}">${p.exact?'EXACT':'CONTEXT'} · ${p.slot}</small></button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{state.selected=+b.dataset.p;lists();header(state.selected)})}
async function header(i){const p=state.fig?.parts?.[i];if(!p){$('raw').textContent='';return}try{const r=await fetch('./ldraw/parts/'+p.file,{cache:'no-store'});$('raw').textContent=(await r.text()).split(/\r?\n/).slice(0,28).join('\n')}catch{$('raw').textContent='header unavailable'}}
async function selectFig(fig){state.fig=fig;state.world=fig.world;state.selected=0;window.__MOVIEATOR_READY=false;$('figName').textContent=fig.name;$('figNote').textContent=fig.note;lists();header(0);await renderFig()}
function shift(n){const fs=worldFigures(),i=Math.max(0,fs.findIndex(f=>f.id===state.fig?.id));selectFig(fs[(i+n+fs.length)%fs.length])}
$('worldSelect').onchange=e=>{state.world=e.target.value;selectFig(worldFigures()[0])};$('figSelect').onchange=e=>selectFig(FIGURES.find(f=>f.id===e.target.value));$('prevBtn').onclick=()=>shift(-1);$('nextBtn').onclick=()=>shift(1);$('spinBtn').onclick=()=>{state.spin=!state.spin;$('spinBtn').textContent=state.spin?'STOP':'SPIN'};$('openBtn').onclick=()=>{const p=state.fig?.parts?.[state.selected];if(p)open('./ldraw/parts/'+p.file,'_blank')};
async function runAll(){const results=[];for(const f of FIGURES){await selectFig(f);results.push(state.lastSniff);await new Promise(r=>setTimeout(r,100))}window.__MOVIEATOR_ALL_RESULTS=results;const n=results.filter(r=>r?.pass).length;$('testCount').textContent=`${n} / ${results.length} PASS`;return results}
window.__MOVIEATOR_FIGURES=FIGURES;window.__MOVIEATOR_RUN_ALL=runAll;
try{await loader.preloadMaterials('./ldraw/LDConfig.ldr');ldrawReady=true;$('ready').textContent='LDRAW READY';$('ready').className='chip ok'}catch(e){state.error=String(e);$('ready').textContent='LDRAW ERROR';$('ready').className='chip bad'}
const q=new URLSearchParams(location.search),wanted=q.get('figure');const start=FIGURES.find(f=>f.id===wanted)||FIGURES[0];await selectFig(start);
</script></body></html>

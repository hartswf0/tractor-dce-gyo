function effectiveParts(){const base=state.fig?.parts||[];const out=[];for(const p of base){if(state.look.top&&(p.role==='TORSO'||p.role==='UPPER'))continue;if(state.look.bottom&&p.role==='LOWER')continue;if(state.look.headwear&&p.role==='HEADGEAR')continue;out.push({...p})}if(state.look.top)out.push(P('TORSO',state.look.top.filename,state.look.top.description,{exact:false,color:state.look.topColor,wardrobe:true}));if(state.look.bottom)out.push(P('LOWER',state.look.bottom.filename,state.look.bottom.description,{exact:false,color:state.look.bottomColor,wardrobe:true}));if(state.look.headwear)out.push(P('HEADGEAR',state.look.headwear.filename,state.look.headwear.description,{exact:false,color:state.look.headwearColor,wardrobe:true}));return out}
async function assembly(){const fig=state.fig,parts=effectiveParts(),lines=[`0 FILE wardrobe_${fig.id}.mpd`,`0 Name: ${fig.name}`,'0 Author: MOVIEATOR','0 !LDRAW_ORG Model','0 BFC CERTIFY CCW',''];for(const p of parts){const c=p.color??16;switch(p.role){case'HEAD':lines.push(refLine(state.look.skin,0,p.mountY??(p.characterHead?-64:-84),0,p.file));break;case'HEADGEAR':lines.push(refLine(c,0,p.mountY??-84,0,p.file));break;case'UPPER':lines.push(...await expandUpper(p));break;case'TORSO':lines.push(...torsoLines(p));break;case'LOWER':lines.push(refLine(c,0,-28,0,p.file));break;case'OVERLAY':lines.push(refLine(c,0,-28,0,p.file));break;case'BABY':lines.push(refLine(c,0,-42,0,p.file));break;case'BABY_HEAD':lines.push(refLine(state.look.skin,0,p.mountY??-58,0,p.file));break;case'PROP':lines.push(refLine(c,42,-28,-12,p.file));break}lines.push('')}return lines.join('\n')}
async function renderFig(refit=true){if(!ready||!state.fig)return;$('badge').textContent='BUILDING LOOK';const text=await assembly();loader.parse(text,g=>{clear();state.root=new THREE.Group();state.root.rotation.x=Math.PI;state.angle=0;state.root.add(g);scene.add(state.root);$('badge').textContent='REAL LDRAW';if(refit)fit(state.root)},e=>{$('badge').textContent='LDRAW ERROR';console.error(e)})}
function worldFigures(){return state.figures.filter(f=>f.world===state.world)}
function resetLook(render=true){const f=state.fig;if(!f)return;state.look={skin:f.skin??14,top:null,bottom:null,headwear:null,topColor:4,bottomColor:1,headwearColor:0};const baseTop=f.parts.find(p=>p.role==='TORSO'||p.role==='UPPER');const baseBottom=f.parts.find(p=>p.role==='LOWER');if(baseTop?.color!=null)state.look.topColor=baseTop.color;if(baseBottom?.color!=null)state.look.bottomColor=baseBottom.color;renderLookBar();if(render)renderFig(true)}
function selectFig(fig){state.fig=fig;state.selectedPart=0;$('figName').textContent=fig.name;$('figNote').textContent=fig.note;resetLook(false);renderLists();renderFig(true);showHeader(0)}
function renderSelectors(){const worlds=WORLDS.filter(w=>state.figures.some(f=>f.world===w.id));$('worldSelect').innerHTML=worlds.map(w=>`<option value="${w.id}">${w.label}</option>`).join('');$('worldSelect').value=state.world;const figs=worldFigures();$('figSelect').innerHTML=figs.map(f=>`<option value="${f.id}">${f.name}</option>`).join('');if(state.fig)$('figSelect').value=state.fig.id}
function renderLookBar(){$('skins').innerHTML=SKINS.map(s=>`<button class="skin ${state.look.skin===s.code?'active':''}" data-skin="${s.code}" title="${s.name}" aria-label="${s.name}" style="background:${s.hex}"></button>`).join('');document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{state.look.skin=+b.dataset.skin;renderLookBar();renderFig(false)});$('topName').textContent=state.look.top?.description||'original';$('bottomName').textContent=state.look.bottom?.description||'original';$('headwearName').textContent=state.look.headwear?.description||'none'}
function renderLists(){renderSelectors();renderLookBar();const figs=worldFigures();$('figList').innerHTML=figs.map(f=>`<button class="fig ${state.fig?.id===f.id?'active':''}" data-fig="${f.id}"><b>${f.name}</b><small>${f.note}</small></button>`).join('');document.querySelectorAll('[data-fig]').forEach(b=>b.onclick=()=>selectFig(figs.find(f=>f.id===b.dataset.fig)));const parts=effectiveParts();$('pieceList').innerHTML=parts.map((p,i)=>`<button class="piece ${i===state.selectedPart?'active':''}" data-part="${i}"><b>${String(i+1).padStart(2,'0')} · ${p.file}</b>${p.description}<small class="${p.exact?'exact':'context'}">${p.exact?'EXACT':'WARDROBE / CONTEXT'} · ${p.role}</small></button>`).join('');document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{state.selectedPart=+b.dataset.part;renderLists();showHeader(state.selectedPart)})}
async function showHeader(i){const p=effectiveParts()[i];if(!p){$('raw').textContent='select a piece';return}try{const r=await fetch('./ldraw/parts/'+p.file,{cache:'no-store'}),t=await r.text();$('raw').textContent=t.split(/\r?\n/).slice(0,34).join('\n')}catch{$('raw').textContent=p.file+'\nheader unavailable'}}
function openDrawer(slot){state.slot=slot;$('drawerTitle').textContent=slot.toUpperCase();$('wardrobeSearch').value='';renderPaints();renderChoices();$('drawer').classList.add('open');setTimeout(()=>$('wardrobeSearch').focus(),50)}
function renderPaints(){if(state.slot==='headwear'||state.slot==='top'||state.slot==='bottom'){const key=state.slot==='headwear'?'headwearColor':state.slot==='top'?'topColor':'bottomColor';$('paintPalette').innerHTML=PAINTS.map(p=>`<button class="paint ${state.look[key]===p.code?'active':''}" data-paint="${p.code}" title="${p.name}" style="background:${p.hex}"></button>`).join('');document.querySelectorAll('[data-paint]').forEach(b=>b.onclick=()=>{state.look[key]=+b.dataset.paint;renderPaints();renderFig(false)})}else $('paintPalette').innerHTML=''}
function renderChoices(){const slot=state.slot,q=norm($('wardrobeSearch').value);let list=state.catalog[slot]||[];if(q)list=list.filter(r=>norm(r.description+' '+r.filename).includes(q));list=list.slice(0,260);const none=slot==='headwear'?`<button class="choice none" data-none="1"><b>NONE</b><span>remove headwear</span></button>`:'';$('results').innerHTML=none+list.map(r=>`<button class="choice" data-file="${r.filename}"><b>${r.filename}</b><span>${r.description}</span><small>ACTUAL LDRAW PART</small></button>`).join('')+(list.length? '':'<div style="padding:12px;font-size:9px;color:#666">No matching primary parts.</div>');document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{const r=state.catalog[slot].find(x=>x.filename===b.dataset.file);state.look[slot]=r;renderLookBar();renderLists();renderFig(true);$('drawer').classList.remove('open')});document.querySelector('[data-none]')?.addEventListener('click',()=>{state.look.headwear=null;renderLookBar();renderLists();renderFig(true);$('drawer').classList.remove('open')})}
document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>openDrawer(b.dataset.slot));$('wardrobeSearch').oninput=renderChoices;$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');$('resetBtn').onclick=()=>resetLook(true);$('indexBtn').onclick=()=>location.href='./screen-piece-index.html';$('worldSelect').onchange=e=>{state.world=e.target.value;selectFig(worldFigures()[0])};$('figSelect').onchange=e=>selectFig(state.figures.find(f=>f.id===e.target.value));
try{await loader.preloadMaterials('./ldraw/LDConfig.ldr');ready=true;$('ready').textContent='REAL LDRAW READY';$('badge').textContent='REAL LDRAW READY'}catch(e){console.error(e);$('ready').textContent='LDRAW ERROR';$('badge').textContent='LDRAW INIT ERROR'}
try{const r=await fetch(DESCRIPTORS);if(r.ok){const data=await r.json(),records=[];collect(data,records,new WeakSet());state.records=records;classify(records);discover(records)}}catch(e){console.warn('catalog unavailable',e);$('catalogCount').textContent='CATALOG ERROR'}
renderSelectors();selectFig(worldFigures()[0]||state.figures[0]);
</script>
</body>

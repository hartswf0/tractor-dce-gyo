async function expandUpper(p){try{const r=await fetch('./ldraw/parts/'+p.file,{cache:'force-cache'});if(!r.ok)throw new Error();const t=await r.text(),out=[];for(const raw of t.split(/\r?\n/)){const a=raw.trim().split(/\s+/);if(a[0]!=='1'||a.length<15)continue;let color=+a[1],x=+a[2],y=+a[3]-60,z=+a[4],m=a.slice(5,14).join(' '),file=a.slice(14).join(' ').replace(/^parts\//,'');const f=file.toLowerCase();if(f.endsWith('3820.dat'))color=state.look.skin;else if((f.endsWith('3818.dat')||f.endsWith('3819.dat'))&&color===14)color=state.look.skin;else if(color===16)color=p.color??state.look.topColor;out.push(ref(color,x,y,z,file,m))}return out.length?out:[ref(p.color??state.look.topColor,0,-60,0,p.file)]}catch{return[ref(p.color??state.look.topColor,0,-60,0,p.file)]}}
function effectiveParts(){const out=[];for(const p of state.fig.parts){if(state.look.head!==undefined&&(p.role==='HEAD'||p.role==='BABY_HEAD'))continue;if(state.look.top&&(p.role==='TORSO'||p.role==='UPPER'))continue;if(state.look.bottom&&p.role==='LOWER')continue;if(state.look.headwear!==undefined&&p.role==='HEADGEAR')continue;if(state.look.prop!==undefined&&p.role==='PROP')continue;out.push({...p})}if(state.look.head)out.push(P(state.fig.parts.some(p=>p.role==='BABY_HEAD')?'BABY_HEAD':'HEAD',state.look.head.filename,state.look.head.description,{exact:false,wardrobe:true}));if(state.look.top)out.push(P('TORSO',state.look.top.filename,state.look.top.description,{exact:false,color:state.look.topColor,wardrobe:true}));if(state.look.bottom)out.push(P('LOWER',state.look.bottom.filename,state.look.bottom.description,{exact:false,color:state.look.bottomColor,wardrobe:true}));if(state.look.headwear)out.push(P('HEADGEAR',state.look.headwear.filename,state.look.headwear.description,{exact:false,color:state.look.headwearColor,wardrobe:true}));if(state.look.prop)out.push(P('PROP',state.look.prop.filename,state.look.prop.description,{exact:false,color:state.look.propColor,wardrobe:true}));return out}
async function assembly(){const lines=[`0 FILE movieator_${state.fig.id}.mpd`,`0 Name: ${state.fig.name}`,'0 !LDRAW_ORG Model','0 BFC CERTIFY CCW',''];for(const p of effectiveParts()){const c=p.color??16;switch(p.role){case'HEAD':lines.push(ref(state.look.skin,0,p.characterHead?-64:-84,0,p.file));break;case'HEADGEAR':lines.push(ref(c,0,-84,0,p.file));break;case'UPPER':lines.push(...await expandUpper(p));break;case'TORSO':lines.push(...torsoLines(p));break;case'LOWER':lines.push(ref(c,0,-28,0,p.file));break;case'OVERLAY':lines.push(ref(c,0,-28,0,p.file));break;case'BABY':lines.push(ref(c,0,-42,0,p.file));break;case'BABY_HEAD':lines.push(ref(state.look.skin,0,-58,0,p.file));break;case'PROP':lines.push(ref(c,38,-28,-10,p.file));break}lines.push('')}return lines.join('\n')}
async function renderFig(){if(!ldrawReady||!state.fig)return;$('renderBadge').textContent='BUILDING';const text=await assembly();loader.parse(text,g=>{clear();state.root=new THREE.Group();state.root.rotation.x=Math.PI;state.root.add(g);scene.add(state.root);fit(state.root);$('renderBadge').textContent='REAL LDRAW'},e=>{$('renderBadge').textContent='LOAD ERROR';console.error(e)})}

function worldFigures(){return FIGURES.filter(f=>f.world===state.world)}
function resetLook(render=true){const f=state.fig;state.look={skin:f.skin??14,head:undefined,top:null,bottom:null,headwear:undefined,prop:undefined,topColor:f.parts.find(p=>p.role==='TORSO'||p.role==='UPPER')?.color??4,bottomColor:f.parts.find(p=>p.role==='LOWER')?.color??1,headwearColor:f.parts.find(p=>p.role==='HEADGEAR')?.color??0,propColor:f.parts.find(p=>p.role==='PROP')?.color??14};if(render)renderFig();if(state.mode)renderTray()}
function selectFig(fig){state.fig=fig;$('figName').textContent=fig.name;$('figNote').textContent=fig.note;$('figure').value=fig.id;resetLook(false);renderFig();if(state.mode)renderTray()}
function renderSelectors(){const worlds=WORLDS.filter(w=>FIGURES.some(f=>f.world===w.id));$('world').innerHTML=worlds.map(w=>`<option value="${w.id}">${w.label}</option>`).join('');$('world').value=state.world;$('figure').innerHTML=worldFigures().map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}
function openMode(mode){state.mode=mode;state.submode=mode==='head'?'face':mode==='outfit'?'top':mode;$('app').classList.add('trayOpen');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));renderTray();setTimeout(()=>state.root&&fit(state.root),80)}
function closeTray(){state.mode=null;state.submode=null;$('app').classList.remove('trayOpen');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('active'));setTimeout(()=>state.root&&fit(state.root),80)}
function renderTray(){if(!state.mode)return;$('trayTitle').textContent=state.mode.toUpperCase();const tabs=state.mode==='head'?[['face','FACE / HEAD'],['hair','HAIR / HAT'],['skin','SKIN']]:state.mode==='outfit'?[['top','TOP'],['bottom','BOTTOM']]:[];$('subtabs').innerHTML=tabs.map(([id,label])=>`<button class="${state.submode===id?'active':''}" data-sub="${id}">${label}</button>`).join('');document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{state.submode=b.dataset.sub;renderTray()});if(state.mode==='pieces')renderPieces();else if(state.mode==='prop')renderCatalog('prop');else if(state.submode==='skin')renderSkin();else renderCatalog(state.submode==='face'?'head':state.submode==='hair'?'headwear':state.submode)}
function renderSkin(){$('trayBody').innerHTML=`<div class="section"><div class="sectionTitle">SKIN / HEAD BASE</div><div class="skins">${SKINS.map(s=>`<button class="swatch ${state.look.skin===s.code?'active':''}" data-skin="${s.code}" title="${s.name}" style="background:${s.hex}"></button>`).join('')}</div></div><div class="hint">Skin changes the head base and rebuildable exposed hands/arms. Printed geometry remains the selected LDraw part.</div>`;document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{state.look.skin=+b.dataset.skin;renderSkin();renderFig()})}
function renderCatalog(slot){const title=slot==='head'?'FACE / HEAD':slot==='headwear'?'HAIR / HAT':slot.toUpperCase();const colorKey=slot==='top'?'topColor':slot==='bottom'?'bottomColor':slot==='headwear'?'headwearColor':slot==='prop'?'propColor':null;const current=state.look[slot];const canNone=slot==='headwear'||slot==='prop';$('trayBody').innerHTML=`${colorKey?`<div class="section"><div class="sectionTitle">${title} COLOR</div><div class="paints">${PAINTS.map(p=>`<button class="swatch ${state.look[colorKey]===p.code?'active':''}" data-paint="${p.code}" title="${p.name}" style="background:${p.hex}"></button>`).join('')}</div></div>`:''}<div class="search"><input id="catalogSearch" autocomplete="off" placeholder="search ${title.toLowerCase()} parts"></div><div id="catalogRows"></div>`;if(colorKey)document.querySelectorAll('[data-paint]').forEach(b=>b.onclick=()=>{state.look[colorKey]=+b.dataset.paint;renderCatalog(slot);renderFig()});const input=$('catalogSearch');const draw=()=>{const q=norm(input.value);let rows=state.catalog[slot]||[];if(q)rows=rows.filter(r=>norm(r.description+' '+r.filename).includes(q));rows=rows.slice(0,100);$('catalogRows').innerHTML=`<button class="choice original" data-original><b>ORIGINAL</b><span>restore indexed ${title.toLowerCase()}</span></button>${canNone?`<button class="choice none" data-none><b>NONE</b><span>remove ${title.toLowerCase()}</span></button>`:''}${rows.map(r=>`<button class="choice" data-file="${r.filename}"><b>${r.filename}</b><span>${r.description}</span><small>ACTUAL LDRAW PART</small></button>`).join('')}`;document.querySelector('[data-original]').onclick=()=>{state.look[slot]=undefined;renderFig();renderTray()};document.querySelector('[data-none]')?.addEventListener('click',()=>{state.look[slot]=null;renderFig();renderTray()});document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{state.look[slot]=state.catalog[slot].find(r=>r.filename===b.dataset.file);renderFig();renderTray()})};input.oninput=draw;draw()}
function renderPieces(){const parts=effectiveParts();$('trayBody').innerHTML=`<div class="hint">Current assembly. Tap any row for the raw .dat header.</div><div id="pieceRows">${parts.map((p,i)=>`<button class="piece" data-piece="${i}"><b>${String(i+1).padStart(2,'0')} · ${p.file}</b><span>${p.description}</span><small>${p.exact?'EXACT / INDEXED':'WARDROBE / CONTEXT'} · ${p.role}</small></button>`).join('')}</div><pre id="partHeader" class="headerText">Tap a piece.</pre>`;document.querySelectorAll('[data-piece]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-piece]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const p=parts[+b.dataset.piece];try{const r=await fetch('./ldraw/parts/'+p.file,{cache:'no-store'});$('partHeader').textContent=(await r.text()).split(/\r?\n/).slice(0,32).join('\n')}catch{$('partHeader').textContent=p.file+'\nheader unavailable'}})}

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>state.mode===b.dataset.mode?closeTray():openMode(b.dataset.mode));$('closeTray').onclick=closeTray;$('world').onchange=e=>{state.world=e.target.value;renderSelectors();selectFig(worldFigures()[0])};$('figure').onchange=e=>selectFig(FIGURES.find(f=>f.id===e.target.value));
try{await loader.preloadMaterials('./ldraw/LDConfig.ldr');ldrawReady=true;$('ready').textContent='LDRAW READY';$('ready').classList.add('ok');$('renderBadge').textContent='READY'}catch(e){console.error(e);$('ready').textContent='LDRAW ERROR';$('ready').classList.add('bad');$('renderBadge').textContent='INIT ERROR'}
try{const r=await fetch(DESCRIPTORS);if(r.ok){const data=await r.json(),records=[];collect(data,records,new WeakSet());state.records=records;classify(records)}}catch(e){console.warn('catalog unavailable',e)}
renderSelectors();selectFig(worldFigures()[0]);
</script>
</body>

function torsoLines(p){const c=p.color??state.look.topColor,s=state.look.skin;return[ref(c,0,-60,0,p.file),ref(c,-15.552,-51,0,'3818.dat','0.985 -0.17 0 0.17 0.985 0 0 0 1'),ref(c,15.552,-51,0,'3819.dat','0.985 0.17 0 -0.17 0.985 0 0 0 1'),ref(s,-23.6904,-33.226,-9.8982,'3820.dat','0.985 -0.1202 0.1202 0.17 0.6964 -0.6964 0 0.707 0.707'),ref(s,23.6904,-33.226,-9.8982,'3820.dat','0.985 0.1202 -0.1202 -0.17 0.6964 -0.6964 0 0.707 0.707')]}
async function expandUpper(p){try{const r=await fetch('./ldraw/parts/'+p.file,{cache:'force-cache'});if(!r.ok)throw new Error();const t=await r.text(),out=[];for(const raw of t.split(/\r?\n/)){const a=raw.trim().split(/\s+/);if(a[0]!=='1'||a.length<15)continue;let color=+a[1],x=+a[2],y=+a[3]-60,z=+a[4],m=a.slice(5,14).join(' '),file=a.slice(14).join(' ').replace(/^parts\//,'');const f=file.toLowerCase();if(f.endsWith('3820.dat'))color=state.look.skin;else if((f.endsWith('3818.dat')||f.endsWith('3819.dat'))&&color===14)color=state.look.skin;else if(color===16)color=p.color??state.look.topColor;out.push(ref(color,x,y,z,file,m))}return out.length?out:[ref(p.color??state.look.topColor,0,-60,0,p.file)]}catch{return[ref(p.color??state.look.topColor,0,-60,0,p.file)]}}
function effectiveParts(){const out=[];for(const p of state.fig.parts){if(state.look.top&&(p.role==='TORSO'||p.role==='UPPER'))continue;if(state.look.bottom&&p.role==='LOWER')continue;if(state.look.headwear!==undefined&&p.role==='HEADGEAR')continue;out.push({...p})}if(state.look.top)out.push(P('TORSO',state.look.top.filename,state.look.top.description,{exact:false,color:state.look.topColor,wardrobe:true}));if(state.look.bottom)out.push(P('LOWER',state.look.bottom.filename,state.look.bottom.description,{exact:false,color:state.look.bottomColor,wardrobe:true}));if(state.look.headwear)out.push(P('HEADGEAR',state.look.headwear.filename,state.look.headwear.description,{exact:false,color:state.look.headwearColor,wardrobe:true}));return out}
async function assembly(){const lines=[`0 FILE movieator_${state.fig.id}.mpd`,`0 Name: ${state.fig.name}`,'0 !LDRAW_ORG Model','0 BFC CERTIFY CCW',''];for(const p of effectiveParts()){const c=p.color??16;switch(p.role){case'HEAD':lines.push(ref(p.color??state.look.skin,0,p.characterHead?-64:-84,0,p.file));break;case'HEADGEAR':lines.push(ref(c,0,-84,0,p.file));break;case'UPPER':lines.push(...await expandUpper(p));break;case'TORSO':lines.push(...torsoLines(p));break;case'LOWER':lines.push(ref(c,0,-28,0,p.file));break;case'OVERLAY':lines.push(ref(c,0,-28,0,p.file));break;case'BABY':lines.push(ref(c,0,-42,0,p.file));break;case'BABY_HEAD':lines.push(ref(state.look.skin,0,-58,0,p.file));break;case'PROP':lines.push(ref(c,38,-28,-10,p.file));break}lines.push('')}return lines.join('\n')}
async function renderFig(){if(!ldrawReady||!state.fig)return;$('renderBadge').textContent='BUILDING';const text=await assembly();loader.parse(text,g=>{clear();state.root=new THREE.Group();state.root.rotation.x=Math.PI;state.angle=0;state.root.add(g);scene.add(state.root);fit(state.root);$('renderBadge').textContent='REAL LDRAW'},e=>{$('renderBadge').textContent='LOAD ERROR';console.error(e)})}

function worldFigures(){return F.filter(f=>f.world===state.world)}
function resetLook(doRender=true){const f=state.fig;state.look={skin:f.skin??14,top:null,bottom:null,headwear:undefined,topColor:f.parts.find(p=>p.role==='TORSO'||p.role==='UPPER')?.color??4,bottomColor:f.parts.find(p=>p.role==='LOWER')?.color??1,headwearColor:f.parts.find(p=>p.role==='HEADGEAR')?.color??0};renderLook();if(doRender)renderFig();renderPieces()}
function selectFig(fig){state.fig=fig;$('figName').textContent=fig.name;$('figNote').innerHTML=fig.note+(fig.film?' <span class="filmTag">FILM CAST</span>':'');$('figSelect').value=fig.id;resetLook(false);renderCast();renderPieces();renderFig()}
function selectors(){const worlds=WORLDS.filter(w=>F.some(f=>f.world===w.id));$('worldSelect').innerHTML=worlds.map(w=>`<option value="${w.id}">${w.label}</option>`).join('');$('worldSelect').value=state.world;$('figSelect').innerHTML=worldFigures().map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}
function renderLook(){$('skins').innerHTML=SKINS.map(s=>`<button class="swatch ${state.look.skin===s.code?'active':''}" data-skin="${s.code}" aria-label="${s.name}" title="${s.name}" style="background:${s.hex}"></button>`).join('');document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{state.look.skin=+b.dataset.skin;renderLook();renderFig();renderPieces()});$('topName').textContent=state.look.top?.description||'ORIGINAL';$('bottomName').textContent=state.look.bottom?.description||'ORIGINAL';$('headwearName').textContent=state.look.headwear===undefined?'ORIGINAL':state.look.headwear?.description||'NONE'}
function renderPieces(){if(!state.fig)return;const parts=effectiveParts();$('pieceList').innerHTML=parts.map((p,i)=>`<button class="piece" data-piece="${i}"><b>${String(i+1).padStart(2,'0')} · ${p.file}</b><span>${p.description}</span><small>${p.exact?'EXACT / INDEXED':'CONTEXT / WARDROBE'} · ${p.role}</small></button>`).join('');document.querySelectorAll('[data-piece]').forEach(b=>b.onclick=()=>inspectPart(parts[+b.dataset.piece]))}
async function inspectPart(p){document.querySelectorAll('[data-piece]').forEach(b=>b.classList.toggle('active',effectiveParts()[+b.dataset.piece]?.file===p.file));try{const r=await fetch('./ldraw/parts/'+p.file,{cache:'no-store'}),t=await r.text();$('partHeader').textContent=t.split(/\r?\n/).slice(0,34).join('\n')}catch{$('partHeader').textContent=p.file+'\nheader unavailable'}}
function renderCast(){$('castList').innerHTML=worldFigures().map(f=>`<button class="cast ${state.fig?.id===f.id?'active':''}" data-cast="${f.id}"><b>${f.name}${f.film?' <span class="filmTag">FILM</span>':''}</b><small>${f.note}</small></button>`).join('');document.querySelectorAll('[data-cast]').forEach(b=>b.onclick=()=>{selectFig(F.find(f=>f.id===b.dataset.cast));closeSheets()})}
function openSheet(name){closeSheets();$(name+'Sheet').classList.add('open');document.querySelector(`[data-sheet="${name}"]`)?.classList.add('active')}
function closeSheets(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));document.querySelectorAll('[data-sheet]').forEach(b=>b.classList.remove('active'))}
function openCatalog(slot){state.slot=slot;$('catalogTitle').textContent=slot==='headwear'?'HAIR / HATS':slot.toUpperCase();renderPaints();$('search').value='';renderChoices();closeSheets();$('catalogSheet').classList.add('open')}
function renderPaints(){const key=state.slot==='top'?'topColor':state.slot==='bottom'?'bottomColor':'headwearColor';$('paints').innerHTML=PAINTS.map(p=>`<button class="swatch ${state.look[key]===p.code?'active':''}" data-paint="${p.code}" title="${p.name}" style="background:${p.hex}"></button>`).join('');document.querySelectorAll('[data-paint]').forEach(b=>b.onclick=()=>{state.look[key]=+b.dataset.paint;renderPaints();renderFig();renderPieces()})}
function renderChoices(){const q=norm($('search').value),slot=state.slot;let a=state.catalog[slot]||[];if(q)a=a.filter(r=>norm(r.description+' '+r.filename).includes(q));a=a.slice(0,180);const none=slot==='headwear'?`<button class="choice none" data-none><b>NONE</b><span>remove hair / hat / helmet</span></button>`:'';$('choices').innerHTML=none+a.map(r=>`<button class="choice" data-choice="${r.filename}"><b>${r.filename}</b><span>${r.description}</span><small>ACTUAL LDRAW PART</small></button>`).join('');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const r=state.catalog[slot].find(x=>x.filename===b.dataset.choice);state.look[slot]=r;renderLook();renderFig();renderPieces();openSheet('look')});document.querySelector('[data-none]')?.addEventListener('click',()=>{state.look.headwear=null;renderLook();renderFig();renderPieces();openSheet('look')})}

document.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet));document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>openCatalog(b.dataset.slot));$('backLook').onclick=()=>openSheet('look');$('search').oninput=renderChoices;$('resetBtn').onclick=()=>resetLook(true);$('worldSelect').onchange=e=>{state.world=e.target.value;selectors();selectFig(worldFigures()[0])};$('figSelect').onchange=e=>selectFig(F.find(f=>f.id===e.target.value));

try{await loader.preloadMaterials('./ldraw/LDConfig.ldr');ldrawReady=true;$('ready').textContent='LDRAW READY';$('ready').classList.add('ok');$('renderBadge').textContent='READY'}catch(e){console.error(e);$('ready').textContent='LDRAW ERROR';$('ready').classList.add('bad');$('renderBadge').textContent='INIT ERROR'}
try{const r=await fetch(D);if(r.ok){const data=await r.json(),records=[];collect(data,records,new WeakSet());state.records=records;classify(records)}else throw new Error()}catch(e){console.warn(e);$('catalogCount').textContent='CATALOG ERROR'}
selectors();selectFig(worldFigures()[0]);
</script>
</body>
</html>

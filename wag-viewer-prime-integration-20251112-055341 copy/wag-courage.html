                <button class="grace-error-copy" onclick="copyGraceErrors()">📋 COPY</button>
                <button class="grace-error-copy" onclick="closeGracePanel()">✕ CLOSE</button>
            </div>
        </div>
        <div id="grace-error-list"></div>
    </div>
    
    <!-- Paste Zone (overlay) -->
    <div id="paste-zone">
        <h3 style="color:var(--accent);margin-bottom:12px;">Paste MPD Content</h3>
        <textarea id="paste-textarea" placeholder="Paste entire MPD file here..."></textarea>
        <div class="paste-buttons">
            <button class="panel-btn" id="paste-load-btn" style="padding: 8px 20px;">Load</button>
            <button class="panel-btn" id="paste-cancel-btn" style="padding: 8px 20px;">Cancel</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script src="./examples/js/loaders/LDrawLoader.js?v=11"></script>
    <script src="./beta-prime-engine.js"></script>
    <script>
    const wagFrankBus = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('wag-frank') : null;
    const wagFrankPost = (message) => {
        if (!wagFrankBus) return;
        wagFrankBus.postMessage(message);
    };

    const AI_FILE_PATTERN = /^ai[\s_\-\(\.]?/i;
    const LIBRARY_BASE = './ldraw/';
    const ROOT_PREFIX_FROM_LIBRARY = '../';

    // Global error log (Bronze-style)
    const ERROR_LOG = [];
    
    // Grace Editor: Track missing parts for graceful rendering
    const MISSING_PARTS = new Map(); // partName -> { lineNumbers: [], count: number }
    const PLACEHOLDER_CACHE = new Map(); // Store created placeholder geometries
    let graceSystemReady = false;
    
    function logError(context, error) {
        const entry = {
            time: new Date().toISOString(),
            context: context,
            message: error.message || String(error),
            stack: error.stack || '',
            line: error.lineNumber || null
        };
        ERROR_LOG.push(entry);
        console.error(`[${context}]`, error);
        
        // Force update of error warning button
        setTimeout(() => updateErrorWarning(), 100);
    }
    
    function updateErrorWarning() {
        let errorBtn = document.getElementById('error-warning-btn');
        if (!errorBtn) {
            errorBtn = document.createElement('button');
            errorBtn.id = 'error-warning-btn';
            errorBtn.className = 'corner-btn';
            errorBtn.style.cssText = 'background: var(--error); color: #000; font-weight: 700; margin-left: 4px;';
            errorBtn.title = 'Console Errors - Click to copy';
            errorBtn.textContent = `⚠ ${ERROR_LOG.length}`;
            
            errorBtn.addEventListener('click', () => {
                const logText = ERROR_LOG.map(e => 
                    `[${e.time}] ${e.context}: ${e.message}\n${e.stack}`
                ).join('\n\n');
                
                navigator.clipboard.writeText(logText).then(() => {
                    const statusText = document.getElementById('status-text');
                    if (statusText) {
                        statusText.textContent = `📋 Copied ${ERROR_LOG.length} errors!`;
                        statusText.style.color = 'var(--error)';
                        statusText.style.fontWeight = '700';
                        setTimeout(() => {
                            statusText.textContent = 'Ready';
                            statusText.style.color = '';
                            statusText.style.fontWeight = '';
                        }, 2000);
                    }
                });
            });
            
            const themeBtn = document.getElementById('theme-btn');
            if (themeBtn && themeBtn.parentNode) {
                themeBtn.parentNode.insertBefore(errorBtn, themeBtn.nextSibling);
            }
        } else {
            errorBtn.textContent = `⚠ ${ERROR_LOG.length}`;
            errorBtn.style.display = ERROR_LOG.length > 0 ? 'block' : 'none';
        }
    }

    const STATE = {
        scenes: [],
        activeSceneIdx: 0,
        viewer: null,
        autoSpin: false,
        diagnostics: {
            grid: true,
            axes: true,
            flipY: false,
            wireframe: false,
            showEdges: true,
            backfaceCull: false,
            skeletonOnly: false,
            studNormal: true,
            studProblem: true,
            studGhost: true,
            partControlOverlay: false
        },
        libraryFileMap: null,  // Still need this for LDraw parts
        groundOriginalLines: null,
        groundActive: false
    };
    
    let editorContainer = null;  // Will be set on init
    let editorLines = [];  // Current lines array
    let selectedLines = new Set();  // Multi-selection set for editor line indices
    let selectionBoundingBox = null; // 3D group holding current selection bounding boxes / axes
    
    // ═══════════════════════════════════════════════════════════════
    // GRACE EDITOR: Graceful Error Handling System
    // ═══════════════════════════════════════════════════════════════
    
    function createPlaceholder(partName, position = {x: 0, y: 0, z: 0}) {
        // Safety check: THREE must be loaded
        if (typeof THREE === 'undefined') {
            console.warn('💚 THREE.js not loaded yet, deferring placeholder creation');
            return null;
        }
        
        // Check cache first
        if (PLACEHOLDER_CACHE.has(partName)) {
            return PLACEHOLDER_CACHE.get(partName).clone();
        }
        
        // Create a loving pink cube with label
        const geometry = new THREE.BoxGeometry(20, 20, 20);
        const material = new THREE.MeshBasicMaterial({
            color: 0xff69b4,  // Hot pink
            transparent: true,
            opacity: 0.6,
            wireframe: false
        });
        const cube = new THREE.Mesh(geometry, material);
        
        // Add wireframe edges
        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(edges, 
            new THREE.LineBasicMaterial({ color: 0xff1493, linewidth: 2 })
        );
        cube.add(line);
        
        // Store in cache
        PLACEHOLDER_CACHE.set(partName, cube);
        
        console.log(`💚 Created placeholder for missing part: ${partName}`);
        return cube.clone();
    }
    
    function trackMissingPart(partName, lineNumber) {
        if (!MISSING_PARTS.has(partName)) {
            MISSING_PARTS.set(partName, {
                lineNumbers: [],
                count: 0
            });
        }
        
        const entry = MISSING_PARTS.get(partName);
        if (!entry.lineNumbers.includes(lineNumber)) {
            entry.lineNumbers.push(lineNumber);
        }
        entry.count++;
        
        console.warn(`⚠️ Line ${lineNumber}: Missing part "${partName}" (${entry.count} total occurrences)`);
    }
    
    function showGraceReport() {
        if (MISSING_PARTS.size === 0) {
            console.log('💚 Perfect! No missing parts.');
            closeGracePanel();
            return;
        }
        
        console.log('\n═══════════════════════════════════════════════════');
        console.log('💚 MACHINE OF LOVING GRACE - Missing Parts Report');
        console.log('═══════════════════════════════════════════════════');
        console.log(`Scene rendered with ${MISSING_PARTS.size} missing components:\n`);
        
        MISSING_PARTS.forEach((data, partName) => {
            console.log(`  📦 ${partName}`);
            console.log(`     Occurrences: ${data.count}`);
            console.log(`     Lines: ${data.lineNumbers.join(', ')}`);
            console.log(`     💡 Tip: Check if this should be "parts/${partName}"\n`);
        });
        
        console.log('═══════════════════════════════════════════════════');
        console.log(`✅ Scene loaded successfully with ${MISSING_PARTS.size} placeholders`);
        console.log('═══════════════════════════════════════════════════\n');
        
        // Show visual error panel with clickable lines
        const panel = document.getElementById('grace-error-panel');
        const list = document.getElementById('grace-error-list');
        
        list.innerHTML = '';
        
        MISSING_PARTS.forEach((data, partName) => {
            data.lineNumbers.forEach(lineNum => {
                const item = document.createElement('div');
                item.className = 'grace-error-item';
                item.innerHTML = `<span class="grace-error-line">Line ${lineNum}:</span> Missing "${partName}" <span style="opacity:0.7">(${data.count}x total)</span>`;
                
                // Click to highlight line in editor
                item.addEventListener('click', () => {
                    highlightErrorLine(lineNum);
                    scrollToLine(lineNum);
                });
                
                list.appendChild(item);
            });
        });
        
        panel.classList.add('visible');
        
        // Highlight all error lines in editor
        highlightAllErrorLines();
    }
    
    function highlightAllErrorLines() {
        // Clear previous error highlights
        document.querySelectorAll('.editor-line.missing-part').forEach(el => {
            el.classList.remove('missing-part');
        });
        
        // Highlight all lines with missing parts
        MISSING_PARTS.forEach((data, partName) => {
            data.lineNumbers.forEach(lineNum => {
                const lineIndex = lineNum - 1; // Convert to 0-based index
                const lineEl = editorContainer.children[lineIndex];
                if (lineEl) {
                    lineEl.classList.add('missing-part');
                }
            });
        });
    }
    
    function highlightErrorLine(lineNum) {
        // Clear previous highlights
        document.querySelectorAll('.editor-line.highlighted').forEach(el => {
            el.classList.remove('highlighted');
        });
        
        const lineIndex = lineNum - 1;
        const lineEl = editorContainer.children[lineIndex];
        if (lineEl) {
            lineEl.classList.add('highlighted');
            lineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
    
    function scrollToLine(lineNum) {
        const lineIndex = lineNum - 1;
        const lineEl = editorContainer.children[lineIndex];
        if (lineEl) {
            lineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
    
    function copyGraceErrors() {
        let text = '💚 GRACE REPORT - Missing Parts\n';
        text += '═══════════════════════════════════════\n\n';
        
        MISSING_PARTS.forEach((data, partName) => {
            text += `📦 ${partName}\n`;
            text += `   Occurrences: ${data.count}\n`;
            text += `   Lines: ${data.lineNumbers.join(', ')}\n`;
            text += `   💡 Tip: Check if this should be "parts/${partName}"\n\n`;
        });
        
        text += `\n✅ Scene loaded with ${MISSING_PARTS.size} placeholders\n`;
        
        navigator.clipboard.writeText(text).then(() => {
            const btn = event.target;
            const orig = btn.textContent;
            btn.textContent = '✓ COPIED!';
            setTimeout(() => btn.textContent = orig, 2000);
        });
    }
    
    function closeGracePanel() {
        const panel = document.getElementById('grace-error-panel');
        panel.classList.remove('visible');
    }
    
    // COMPILE ERROR TRACKING - parse LDrawLoader errors and highlight offending lines
    const COMPILE_ERRORS = [];
    
    function trackCompileError(errorMsg) {
        // Parse error messages like 'at line 16' or 'line 16:'
        const lineMatch = errorMsg.match(/line\s+(\d+)/i);
        const colorMatch = errorMsg.match(/colour code ["']?(-?\d+)["']?/i);
        
        const errorInfo = {
            message: errorMsg,
            lineNum: lineMatch ? parseInt(lineMatch[1]) : null,
            colorCode: colorMatch ? colorMatch[1] : null,
            timestamp: Date.now()
        };
        
        COMPILE_ERRORS.push(errorInfo);
        console.log('[DEBUG] Tracked compile error:', errorInfo);
        
        // If we found a line number, highlight it
        if (errorInfo.lineNum && editorContainer) {
            highlightCompileErrorLine(errorInfo.lineNum, errorInfo.message);
        }
        
        return errorInfo;
    }
    
    function highlightCompileErrorLine(lineNum, errorMsg) {
        const lineIndex = lineNum - 1;
        const lineEl = editorContainer.children[lineIndex];
        if (lineEl) {
            lineEl.classList.add('compile-error');
            lineEl.setAttribute('title', `⚠️ Error: ${errorMsg}`);
            lineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // Add visual error indicator
            if (!lineEl.querySelector('.error-indicator')) {
                const indicator = document.createElement('span');
                indicator.className = 'error-indicator';
                indicator.textContent = '⚠️';
                indicator.style.cssText = 'position: absolute; right: 4px; font-size: 12px;';
                indicator.setAttribute('title', errorMsg);
                lineEl.style.position = 'relative';
                lineEl.appendChild(indicator);
            }
        }
    }
    
    function clearCompileErrors() {
        COMPILE_ERRORS.length = 0;
        document.querySelectorAll('.editor-line.compile-error').forEach(el => {
            el.classList.remove('compile-error');
            el.removeAttribute('title');
            const indicator = el.querySelector('.error-indicator');
            if (indicator) indicator.remove();
        });
    }
    
    // Intercept console.error to catch LDrawLoader warnings
    const originalConsoleError = console.error;
    const originalConsoleWarn = console.warn;
    
    console.error = function(...args) {
        const msg = args.join(' ');
        if (msg.includes('LDrawLoader') || msg.includes('colour code')) {
            trackCompileError(msg);
        }
        originalConsoleError.apply(console, args);
    };
    
    console.warn = function(...args) {
        const msg = args.join(' ');
        if (msg.includes('LDrawLoader') || msg.includes('colour code')) {
            trackCompileError(msg);
        }
        originalConsoleWarn.apply(console, args);
    };
    
    // Intercept fetch to catch 404s gracefully and CREATE PLACEHOLDERS!
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        return originalFetch.apply(this, args).then(response => {
            if (!response.ok && response.status === 404) {
                const url = args[0];
                const partName = url.split('/').pop();
                console.warn(`💚 Grace: 404 for ${partName}, creating placeholder`);
                
                // Track this missing part (we don't have line number here, will add later)
                if (!MISSING_PARTS.has(partName)) {
                    MISSING_PARTS.set(partName, {
                        lineNumbers: [],
                        count: 0
                    });
                }
                const entry = MISSING_PARTS.get(partName);
                entry.count++;
                
                // 💚 GRACE: Return fake pink cube geometry so it actually renders!
                // Must be a properly-formatted LDraw subfile with NOFILE terminator
                const fakeData = `0 FILE ${partName}
0 Placeholder - Part not found
0 Name: ${partName}
0 Author: Grace Placeholder
0 !LDRAW_ORG Unofficial_Part
0 BFC CERTIFY CCW

0 // Pink cube geometry (20x20x20 LDU)
4 494 -10 -10 -10  10 -10 -10  10 -10  10 -10 -10  10
4 494 -10  10 -10 -10  10  10  10  10  10  10  10 -10
4 494 -10 -10 -10 -10 -10  10 -10  10  10 -10  10 -10
4 494  10 -10 -10  10  10 -10  10  10  10  10 -10  10
4 494 -10 -10  10  10 -10  10  10  10  10 -10  10  10
4 494 -10 -10 -10 -10  10 -10  10  10 -10  10 -10 -10

0 NOFILE
`;
                return new Response(fakeData, {
                    status: 200,
                    statusText: 'OK (Grace Placeholder)',
                    headers: { 'Content-Type': 'text/plain' }
                });
            }
            return response;
        });
    };
    
    // ═══════════════════════════════════════════════════════════════
    
    function createScene(name, initialLines = []) {
        return {
            name: name || `Scene ${STATE.scenes.length + 1}`,
            lines: initialLines.length ? initialLines : [
                `0 FILE wag_scene_${Date.now()}.mpd`,
                `0 Name: WAG Scene ${STATE.scenes.length + 1}`,
                '0 Author: WAG Courage Builder',
                '0 !LDRAW_ORG Model',
                '0 !LICENSE Redistributable under CCAL version 2.0',
                '0 BFC CERTIFY CCW',
                '0 ',
                '0 // Default starter brick - add more parts below!',
                '1 4 0 0 0 1 0 0 0 1 0 0 0 1 3001.dat',
                '0 ',
                '0 STEP',
                '0 NOFILE'
            ],
            lockedLines: new Set(),
            timestamp: Date.now()
        };
    }
    
    function renderEditor(lines) {
        if (!editorContainer) editorContainer = document.getElementById('mpd-editor');
        if (!editorContainer) return;
        
        editorContainer.innerHTML = '';
        
        lines.forEach((line, idx) => {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'editor-line';
            lineDiv.dataset.lineNum = idx + 1;
            
            const trimmed = line.trim();
            const isComment = trimmed.startsWith('0 ');
            const isPart = trimmed.startsWith('1 ');
            const isFile = trimmed.startsWith('0 FILE');
            const isStep = trimmed.startsWith('0 STEP');
            const scene = STATE.scenes[STATE.activeSceneIdx];
            const isLocked = scene && scene.lockedLines.has(idx);
            
            if (isLocked) lineDiv.classList.add('locked');
            if (isFile) lineDiv.classList.add('file-line');
            if (isStep) lineDiv.classList.add('step-line');
            
            // Checkbox
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'line-checkbox';
            checkbox.checked = true;
            checkbox.addEventListener('change', () => {
                content.classList.toggle('disabled', !checkbox.checked);
                // Don't auto-compile on checkbox change - use Render button
            });
            lineDiv.appendChild(checkbox);
            
            // Line number
            const lineNum = document.createElement('span');
            lineNum.className = 'line-number';
            lineNum.textContent = idx + 1;
            lineDiv.appendChild(lineNum);
            
            // Right-click context menu
            lineDiv.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                showLineContextMenu(e, idx);
            });
                
            // Click line → highlight on 2D grid / select section
            lineDiv.addEventListener('click', (e) => {
                if (e.target.classList.contains('line-checkbox')) return;

                const trimmed = line.trim();
                const isComment = trimmed.startsWith('0 ');
                const isFile = trimmed.startsWith('0 FILE');
                const isStep = trimmed.startsWith('0 STEP');
                const isMeta = trimmed.startsWith('0 !');
                const isHeader = isComment && !isFile && !isStep && !isMeta && !trimmed.startsWith('0 Name:') && !trimmed.startsWith('0 Author:');

                // Cmd/Ctrl+click for multi-selection
                if (e.metaKey || e.ctrlKey) {
                    toggleLineSelection(idx);
                    return;
                }

                // Header comments act as section markers
                if (isHeader) {
                    selectSection(idx);
                } else {
                    highlightLineOn2DGrid(idx);
                }
            });
            
            // Double-click line → select section
            lineDiv.addEventListener('dblclick', (e) => {
                if (e.target.classList.contains('line-checkbox')) return;
                selectSection(idx);
            });
            
            // Content (contentEditable!)
            const content = document.createElement('span');
            content.className = `line-content ${isPart ? 'part' : isComment ? 'comment' : ''}`;
            content.textContent = line || ' ';
            content.contentEditable = !isLocked; // Lock mode prevents editing
            content.spellcheck = false;
            
            // Save on blur
            content.addEventListener('blur', () => {
                editorLines[idx] = content.textContent;
            });
            
            // Paste handler - SIMPLE & ELEGANT!
            content.addEventListener('paste', (e) => {
                e.preventDefault();
                const text = e.clipboardData.getData('text/plain');
                const lines = text.split('\n');
                
                // If pasting many lines (10+), start fresh with new file
                if (lines.length >= 10) {
                    console.log(`💚 Grace: Pasting ${lines.length} lines - creating new file from scratch`);
                    
                    // Replace entire editor with pasted content
                    editorLines.length = 0;
                    editorLines.push(...lines);
                    
                    renderEditor(editorLines);
                    
                    document.getElementById('status-text').textContent = `💚 Pasted ${lines.length} lines - new file created`;
                    
                    // Auto-compile if it looks like MPD
                    if (text.includes('0 FILE') || text.includes('parts/')) {
                        setTimeout(() => compile(), 500);
                    }
                }
                // Few lines (1-9) - insert at current position
                else if (lines.length > 1) {
                    editorLines[idx] = lines[0];
                    editorLines.splice(idx + 1, 0, ...lines.slice(1));
                    renderEditor(editorLines);
                    setTimeout(() => {
                        const newLine = editorContainer.children[idx + lines.length - 1];
                        if (newLine) newLine.querySelector('.line-content').focus();
                    }, 0);
                }
                // Single line - insert at cursor
                else {
                    document.execCommand('insertText', false, text);
                }
            });
            
            // Keyboard shortcuts
            content.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    editorLines.splice(idx + 1, 0, '');
                    renderEditor(editorLines);
                    setTimeout(() => {
                        const nextLine = editorContainer.children[idx + 1];
                        if (nextLine) nextLine.querySelector('.line-content').focus();
                    }, 0);
                }
                // Delete/Backspace on empty line = delete line
                else if ((e.key === 'Delete' || e.key === 'Backspace') && !content.textContent.trim()) {
                    e.preventDefault();
                    if (editorLines.length > 1) {
                        deleteLine(idx);
                    }
                }
                // Arrow keys = navigate lines
                else if (e.key === 'ArrowUp' && !e.shiftKey) {
                    const sel = window.getSelection();
                    if (sel.anchorOffset === 0 && idx > 0) {
                        e.preventDefault();
                        const prevLine = editorContainer.children[idx - 1];
                        if (prevLine) prevLine.querySelector('.line-content').focus();
                    }
                }
                else if (e.key === 'ArrowDown' && !e.shiftKey) {
                    const sel = window.getSelection();
                    const atEnd = sel.anchorOffset === content.textContent.length;
                    if (atEnd && idx < editorLines.length - 1) {
                        e.preventDefault();
                        const nextLine = editorContainer.children[idx + 1];
                        if (nextLine) nextLine.querySelector('.line-content').focus();
                    }
                }
                // Ctrl+D = duplicate line
                else if (e.ctrlKey && e.key === 'd') {
                    e.preventDefault();
                    editorLines.splice(idx + 1, 0, editorLines[idx]);
                    renderEditor(editorLines);
                    setTimeout(() => {
                        const newLine = editorContainer.children[idx + 1];
                        if (newLine) newLine.querySelector('.line-content').focus();
                    }, 0);
                }
                // Ctrl+Up/Down = move line
                else if (e.ctrlKey && e.key === 'ArrowUp') {
                    e.preventDefault();
                    moveLine(idx, -1);
                }
                else if (e.ctrlKey && e.key === 'ArrowDown') {
                    e.preventDefault();
                    moveLine(idx, 1);
                }
                // Cmd/Ctrl+S or Cmd/Ctrl+Enter → Compile
                if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) {
                    e.preventDefault();
                    compileCurrentMPD();
                }
                if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                    e.preventDefault();
                    compileCurrentMPD();
                }
                // Cmd/Ctrl+C → Copy selection
                if ((e.metaKey || e.ctrlKey) && e.key === 'c' && selectedLines.size > 0) {
                    e.preventDefault();
                    copySelection();
                }
            });
            
            lineDiv.appendChild(content);
            editorContainer.appendChild(lineDiv);
        });
        
        renderMinimap(lines);
    }
    
    function renderMinimap(lines) {
        const minimap = document.getElementById('mpd-minimap');
        if (!minimap) return;
        
        minimap.innerHTML = '';
        const stripHeight = Math.max(2, Math.floor(minimap.clientHeight / lines.length));
        
        lines.forEach((line, idx) => {
            const strip = document.createElement('div');
            strip.className = 'mpd-minimap-strip';
            strip.style.height = stripHeight + 'px';
            
            const trimmed = line.trim();
            if (trimmed.startsWith('1 ')) {
                strip.classList.add('part');
            } else if (trimmed.startsWith('0 ')) {
                strip.classList.add('comment');
            } else {
                strip.classList.add('empty');
            }
            
            const scene = STATE.scenes[STATE.activeSceneIdx];
            if (scene && scene.lockedLines.has(idx)) {
                strip.classList.add('locked');
            }
            
            strip.addEventListener('click', () => {
                const lineEl = editorContainer.children[idx];
                if (lineEl) {
                    lineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    lineEl.querySelector('.line-content').focus();
                }
            });
            
            minimap.appendChild(strip);
        });
    }
    
    // Line manipulation functions (Bronze parity)
    async function compileCurrentMPD() {
        const scene = STATE.scenes[STATE.activeSceneIdx];
        if (!scene || !scene.lines.length) {
            console.warn('⚠️ No MPD lines to compile');
            return;
        }
        await compile();
    }
    
    function deleteLine(idx) {
        const scene = STATE.scenes[STATE.activeSceneIdx];
        if (scene.lockedLines.has(idx)) {
            document.getElementById('status-text').textContent = 'Line is locked';
            return;
        }
        if (editorLines.length === 1) {
            editorLines[0] = '';
            renderEditor(editorLines);
            return;
        }
        editorLines.splice(idx, 1);
        // Update locked lines indices
        const newLocked = new Set();
        scene.lockedLines.forEach(i => {
            if (i < idx) newLocked.add(i);
            else if (i > idx) newLocked.add(i - 1);
        });
        scene.lockedLines = newLocked;
        renderEditor(editorLines);
        document.getElementById('status-text').textContent = 'Line deleted';
    }
    
    function moveLine(idx, direction) {
        const scene = STATE.scenes[STATE.activeSceneIdx];
        if (scene.lockedLines.has(idx)) {
            document.getElementById('status-text').textContent = 'Line is locked';
            return;
        }
        const newIdx = idx + direction;
        if (newIdx < 0 || newIdx >= editorLines.length) return;
        
        // Swap lines
        [editorLines[idx], editorLines[newIdx]] = [editorLines[newIdx], editorLines[idx]];
        
        // Update locked lines
        const wasLocked = scene.lockedLines.has(idx);
        const targetWasLocked = scene.lockedLines.has(newIdx);
        if (wasLocked) {
            scene.lockedLines.delete(idx);
            scene.lockedLines.add(newIdx);
        }
        if (targetWasLocked) {
            scene.lockedLines.delete(newIdx);
            scene.lockedLines.add(idx);
        }
        
        renderEditor(editorLines);
        
        // Scroll to moved line
        setTimeout(() => {
            const movedLine = editorContainer.children[newIdx];
            if (movedLine) {
                movedLine.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                movedLine.querySelector('.line-content').focus();
            }
        }, 50);
        
        document.getElementById('status-text').textContent = direction > 0 ? 'Moved down' : 'Moved up';
    }
    
    function toggleLock(idx) {
        const scene = STATE.scenes[STATE.activeSceneIdx];
        if (scene.lockedLines.has(idx)) {
            scene.lockedLines.delete(idx);
            document.getElementById('status-text').textContent = 'Unlocked';
        } else {
            scene.lockedLines.add(idx);
            document.getElementById('status-text').textContent = 'Locked';
        }
        renderEditor(editorLines);
    }

                action: () => useSelection ? cutSelection() : cutLine(idx)
            },
            { label: '📝 Duplicate', action: () => duplicateLine(idx) },
            { label: '➕ Insert Above', action: () => insertLine(idx, 'above') },
            { label: '➕ Insert Below', action: () => insertLine(idx, 'below') },
            { label: '---', action: null },
            { label: '↑ Move Up', action: () => moveLine(idx, -1) },
            { label: '↓ Move Down', action: () => moveLine(idx, 1) },
            {
                label: useSelection ? '🗑 Delete Selection' : '🗑 Delete Line',
                action: () => useSelection ? deleteSelection() : deleteLine(idx)
            },

    function simulateProgress() {

            'Loading 3D geometry...',

    let compileInProgress = false;
    
    async function compile() {
        // Guard against overlapping compiles
        if (compileInProgress) {
            console.log('[COMPILE] Skipping - compile already in progress');
            return;
        }
        compileInProgress = true;
        
        showLoadingOverlay('Compiling MPD...', 'Parsing lines and preparing 3D model...');
        
        // 💚 GRACE: Always hide loading after 12 seconds max (compile + render timeout)
        const compileTimeout = setTimeout(() => {
            console.warn('💚 Grace: Compile timeout - forcing display');
            hideLoadingOverlay();
            compileInProgress = false;
            document.getElementById('status-text').textContent = '💚 Compile completed (check for errors)';
        }, 12000);
        
        // Safety check: Don't compile if viewer or file map not ready
        if (!STATE.viewer) {
            console.warn('⚠️ Viewer not initialized yet');
            clearTimeout(compileTimeout);
            hideLoadingOverlay();
            compileInProgress = false;
            return;
        }
        if (!STATE.libraryFileMap || Object.keys(STATE.libraryFileMap).length === 0) {
            console.warn('⚠️ Library catalog not loaded yet - waiting...');
            clearTimeout(compileTimeout);
            hideLoadingOverlay();
            compileInProgress = false;
            const statusText = document.getElementById('status-text');
            if (statusText) statusText.textContent = 'Library loading...';
            return;
        }
        
        // Parse MPD to track line numbers (Bronze method!)
        const lineMap = [];
        editorLines.forEach((line, idx) => {
            const trimmed = line.trim();
            if (trimmed && trimmed.startsWith('1 ')) {
                lineMap.push({ originalLineIdx: idx, lineContent: line });
            }
        });
        STATE.currentLineMap = lineMap;
        console.log('[COMPILE] Tracked', lineMap.length, 'part lines for click-to-highlight');
        
        // Get enabled lines only
        const enabledLines = [];
        editorLines.forEach((line, idx) => {
            const lineEl = editorContainer.children[idx];
            if (lineEl) {
                const checkbox = lineEl.querySelector('.line-checkbox');
                if (checkbox && checkbox.checked) {
                    enabledLines.push(line);
                }
            }
        });
        
        // Render with Prime engine
        const text = enabledLines.join('\n');
        if (text.trim()) {
            console.log('📝 Compiling', enabledLines.length, 'enabled lines...');
            
            // Clear previous error tracking
            MISSING_PARTS.clear();
            clearCompileErrors();
            
            try {
                await loadManualText(text, {
                    filename: STATE.scenes[STATE.activeSceneIdx].name + '.mpd',
                    origin: 'Grace Editor'
                });
                
                // 💚 GRACE: Scan editor lines to find which ones reference missing parts
                if (MISSING_PARTS.size > 0) {
                    console.log(`💚 Grace: Scanning ${editorLines.length} lines for missing part references...`);
                    
                    editorLines.forEach((line, idx) => {
                        const trimmed = line.trim();
                        // Check if this is a part line (Type 1)
                        if (trimmed.startsWith('1 ')) {
                            // Extract part name from end of line
                            const parts = trimmed.split(/\s+/);
                            const partRef = parts[parts.length - 1]; // Last token is the part file
                            const partName = partRef.split('/').pop(); // Get filename only
                            
                            // Check if this part is in our missing parts list
                            MISSING_PARTS.forEach((data, missingPart) => {
                                if (partName === missingPart || partRef.includes(missingPart)) {
                                    // This line references a missing part!
                                    if (!data.lineNumbers.includes(idx + 1)) {
                                        data.lineNumbers.push(idx + 1); // 1-indexed for display
                                    }
                                    console.warn(`💚 Grace: Line ${idx + 1} references missing part: ${missingPart}`);
                                }
                            });
                        }
                    });
                }
                
                // Show grace report after load
                setTimeout(() => showGraceReport(), 500);
                
                clearTimeout(compileTimeout); // Success!
                hideLoadingOverlay();
                compileInProgress = false;
            } catch (err) {
                console.error('💚 Grace: Compile error caught', err);
                clearTimeout(compileTimeout);
                hideLoadingOverlay();
                compileInProgress = false;
                document.getElementById('status-text').textContent = '💚 Compile failed - check console';
            }
        } else {
            console.warn('⚠️ No enabled lines to compile');
            clearTimeout(compileTimeout);
            hideLoadingOverlay();
            compileInProgress = false;
        }
    }

                });

            console.log('[CLICK] Found', meshes.length, 'meshes to check');
            
            const intersects = raycaster.intersectObjects(meshes, false);
            console.log('[CLICK] Raycaster intersects:', intersects.length);
            
            if (intersects.length > 0) {
                const clickedObj = intersects[0].object;

                    console.warn('[CLICK] ❌ No lineNum found in userData');

                // Flash the clicked part, guarding against multi-materials
                const materials = Array.isArray(clickedObj.material)
                    ? clickedObj.material
                    : [clickedObj.material];
                const originalColors = [];

                materials.forEach((mat, idx) => {
                    if (!mat || !mat.color) return;
                    originalColors[idx] = mat.color.getHex();

                });

                if (originalColors.length > 0) {
                    setTimeout(() => {

    function buildTemplateStudSkeletonFromLibrary() {
        if (!Array.isArray(editorLines) || !editorLines.length) {
            return null;
        }
        if (!STATE || !STATE.partSkeletonLibrary || typeof STATE.partSkeletonLibrary !== 'object') {
            return null;
        }
        const lib = STATE.partSkeletonLibrary;
        const studs = [];
        const plateHeight = 8;
        for (let idx = 0; idx < editorLines.length; idx++) {
            const line = editorLines[idx];
            const trimmed = line && line.trim();
            if (!trimmed || !trimmed.startsWith('1 ')) continue;
            const parsed = parseType1Line(line);
            if (!parsed || !parsed.partId) continue;
            const key = parsed.partId.toLowerCase();
            const entry = lib[key];
            if (!entry || !Array.isArray(entry.studs) || !entry.studs.length) continue;
            const a = parsed.a, b = parsed.b, c = parsed.c;
            const d = parsed.d, e = parsed.e, f = parsed.f;
            const g = parsed.g, h = parsed.h, i = parsed.i;
            const tx = parsed.x, ty = parsed.y, tz = parsed.z;
            entry.studs.forEach((s, studIndex) => {
                const lx = typeof s.x === 'number' ? s.x : 0;
                const ly = typeof s.y === 'number' ? s.y : 0;
                const lz = typeof s.z === 'number' ? s.z : 0;
                const wx = a * lx + b * ly + c * lz + tx;
                const wy = d * lx + e * ly + f * lz + ty;
                const wz = g * lx + h * ly + i * lz + tz;
                const gridX = Math.round(wx / 20);
                const gridZ = Math.round(wz / 20);
                const layer = Math.round(wy / plateHeight);
                studs.push({
                    kind: 'stud',
                    gridX,
                    gridZ,
                    layer,
                    worldPos: { x: wx, y: wy, z: wz },
                    lineNum: idx,
                    partId: parsed.partId,
                    studIndex,
                    local: { x: lx, y: ly, z: lz },
                    source: 'template',
                    studVersion: 1
                });
            });
        }
        return studs.length ? studs : null;
    }
    
    function computeStudSkeletonAndPlanes() {
        if (!STATE || !STATE.viewer || !window.THREE) {
            console.warn('[STUD] Viewer or THREE missing; cannot compute stud skeleton');
            return;
        }

        const modelRoot = (STATE.viewer?.getModel && STATE.viewer.getModel()) ||
                         STATE.viewer?.modelRoot ||
                         STATE.viewer?.modelWrapper ||
                         (STATE.viewer?.engine && (STATE.viewer.engine.modelWrapper || STATE.viewer.engine.model)) ||
                         STATE.viewer?.scene;

        if (!modelRoot) {
            console.warn('[STUD] No model found for stud skeleton');
            return;
        }

        try {
            const box = new THREE.Box3().setFromObject(modelRoot);
            const size = new THREE.Vector3();
            box.getSize(size);
            STATE.modelPlanes = {
                minY: box.min.y,
                maxY: box.max.y,
                bounds: {
                    min: box.min.clone(),
                    max: box.max.clone(),
                    size: size.clone()
                }
            };
            console.log('[STUD] Model Y range:', box.min.y, 'to', box.max.y);
        } catch (e) {
            console.warn('[STUD] Failed to compute model bounds:', e);
        }

        // Build a map of meshes keyed by their originating MPD line number so we can
        // sample studs one MPD line at a time. This avoids the global
        // "min(contributing lineNum)" heuristic and gives each stud a single,
        // unambiguous owner line.
        const plateHeight = 8;
        const pos = new THREE.Vector3();
        const meshesByLine = new Map();
        modelRoot.traverse(obj => {
            if (!obj.isMesh || !obj.geometry || !obj.geometry.attributes || !obj.geometry.attributes.position) {
                return;
            }
            const lineNum = obj.userData && typeof obj.userData.lineNum === 'number' ? obj.userData.lineNum : null;
            if (lineNum === null) return;
            let list = meshesByLine.get(lineNum);
            if (!list) {
                list = [];
                meshesByLine.set(lineNum, list);
            }
            list.push(obj);
        });

        let studs = [];
        const minVotes = 6;
        const layerTotals = new Map();
        let baseGridYSum = 0;
        let baseGridYCount = 0;

        // For each MPD type-1 line, sample only the meshes that belong to that line
        // into a local grid, then convert occupied cells into stud nodes tagged
        // with that line index.
        if (Array.isArray(editorLines)) {
            for (let lineIndex = 0; lineIndex < editorLines.length; lineIndex++) {
                const lineText = editorLines[lineIndex];
                if (!lineText || !lineText.trim().startsWith('1 ')) continue;
                const meshList = meshesByLine.get(lineIndex);
                if (!meshList || !meshList.length) continue;

                const parsedLine = parseType1Line(lineText);
                const gridMap = new Map(); // key "gx,gz" -> { gx, gz, layers: Map(layerIndex -> accum) }

                meshList.forEach(obj => {
                    if (!obj.isMesh || !obj.geometry || !obj.geometry.attributes || !obj.geometry.attributes.position) {
                        return;
                    }
                    obj.updateWorldMatrix(true, false);
                    const position = obj.geometry.attributes.position;
                    for (let i = 0; i < position.count; i++) {
                        pos.fromBufferAttribute(position, i);
                        pos.applyMatrix4(obj.matrixWorld);
                        const gx = Math.round(pos.x / 20);
                        const gz = Math.round(pos.z / 20);
                        const gridKey = gx + ',' + gz;
                        let col = gridMap.get(gridKey);
                        if (!col) {
                            col = { gx, gz, layers: new Map() };
                            gridMap.set(gridKey, col);
                        }
                        const layerIndex = Math.round(pos.y / plateHeight);
                        let layer = col.layers.get(layerIndex);
                        if (!layer) {
                            layer = { sumX: 0, sumY: 0, sumZ: 0, count: 0 };
                            col.layers.set(layerIndex, layer);
                        }
                        layer.sumX += pos.x;
                        layer.sumY += pos.y;
                        layer.sumZ += pos.z;
                        layer.count++;

                        const prevTotal = layerTotals.get(layerIndex) || 0;
                        layerTotals.set(layerIndex, prevTotal + 1);
                    }
                });

                gridMap.forEach(col => {
                    col.layers.forEach((layer, layerIndex) => {
                        if (layer.count < minVotes) return;
                        const cx = layer.sumX / layer.count;
                        const cy = layer.sumY / layer.count;
                        const cz = layer.sumZ / layer.count;

                        // Derive partId and local (part-space) coordinates from the
                        // associated MPD type-1 line. Because we are sampling per-line,
                        // the owning lineNum is always lineIndex.
                        let partId = null;
                        let local = null;
                        if (parsedLine && parsedLine.partId) {
                            partId = parsedLine.partId;
                            const a = parsedLine.a, b = parsedLine.b, c = parsedLine.c;
                            const d = parsedLine.d, e = parsedLine.e, f = parsedLine.f;
                            const g = parsedLine.g, h = parsedLine.h, i = parsedLine.i;
                            const tx = parsedLine.x, ty = parsedLine.y, tz = parsedLine.z;
                            const dx = cx - tx;
                            const dy = cy - ty;
                            const dz = cz - tz;
                            // Invert the LDraw transform: local = R^T * (world - t)
                            local = {
                                x: a * dx + d * dy + g * dz,
                                y: b * dx + e * dy + h * dz,
                                z: c * dx + f * dy + i * dz
                            };
                        }

                        studs.push({
                            kind: 'stud',
                            gridX: col.gx,
                            gridZ: col.gz,
                            layer: layerIndex,
                            worldPos: { x: cx, y: cy, z: cz },
                            lineNum: lineIndex,
                            partId,
                            local,
                            source: 'sampled',
                            studVersion: 1
                        });
                    });
                });
            }
        }

        // Estimate the dominant grid layer and base Y using aggregate layerTotals
        // across all per-line sampling passes.
        let baseGridLayer = null;
        let baseGridLayerCount = 0;
        layerTotals.forEach((count, layerIndex) => {
            if (count > baseGridLayerCount) {
                baseGridLayerCount = count;
                baseGridLayer = layerIndex;
            }
        });
        STATE.baseGridLayer = baseGridLayer;
        if (baseGridLayer !== null) {
            console.log('[STUD] Base grid layer estimated as', baseGridLayer, 'with', baseGridLayerCount, 'samples');
        }

        if (baseGridLayer !== null && studs.length) {
            studs.forEach(node => {
                if (!node || typeof node.layer !== 'number' || !node.worldPos) return;
                if (node.layer !== baseGridLayer) return;
                baseGridYSum += node.worldPos.y;
                baseGridYCount++;
            });
        }

        if (baseGridYCount > 0) {
            STATE.baseGridY = baseGridYSum / baseGridYCount;
            console.log('[STUD] Base grid Y estimated as', STATE.baseGridY);
        }

        // Prefer template-driven studs derived from per-part skeletons when available,
        // falling back to sampled studs from the assembled model.
        if (typeof buildTemplateStudSkeletonFromLibrary === 'function') {
            try {
                const templateStuds = buildTemplateStudSkeletonFromLibrary();
                if (Array.isArray(templateStuds) && templateStuds.length) {
                    console.log('[STUD] Using template-based stud skeleton from partSkeletonLibrary:', templateStuds.length);
                    studs = templateStuds;
                }
            } catch (e) {
                console.warn('[STUD] Template-based stud skeleton build failed, falling back to sampled studs:', e);
            }
        }

        STATE.studSkeleton = studs;
        console.log('[STUD] Computed stud skeleton nodes:', studs.length);

        const groundViolations = [];
        const baseLayer = typeof STATE.baseGridLayer === 'number' ? STATE.baseGridLayer : null;
        const baseY = typeof STATE.baseGridY === 'number' ? STATE.baseGridY : null;

        if (baseLayer !== null && baseY !== null) {
            studs.forEach(node => {
                if (!node || typeof node.layer !== 'number') return;
                if (node.layer >= baseLayer) return;
                if (!node.worldPos) return;
                const fromY = node.worldPos.y;
                const toY = baseY;
                const deltaY = toY - fromY;
                const violation = {
                    gridX: node.gridX,
                    gridZ: node.gridZ,
                    layer: node.layer,
                    baseGridLayer: baseLayer,
                    from: { x: node.worldPos.x, y: fromY, z: node.worldPos.z },
                    to: { x: node.worldPos.x, y: toY, z: node.worldPos.z },
                    deltaY,
                    meshLineNum: typeof node.lineNum === 'number' ? node.lineNum : null,
                    lineNum: null
                };
                groundViolations.push(violation);
            });

            if (typeof assignViolationOwnersFromMPD === 'function') {
                assignViolationOwnersFromMPD(groundViolations);
            }

            const summaryByLine = new Map();
            groundViolations.forEach(v => {
                if (!v || typeof v.lineNum !== 'number') return;
                const key = v.lineNum;
                const fromY = v.from && typeof v.from.y === 'number' ? v.from.y : null;
                const deltaY = typeof v.deltaY === 'number' ? v.deltaY : null;
                if (fromY === null || deltaY === null) return;
                let entry = summaryByLine.get(key);
                if (!entry) {
                    entry = {
                        lineNum: key,
                        count: 0,
                        minY: fromY,
                        maxY: fromY,
                        maxDeltaY: deltaY
                    };
                    summaryByLine.set(key, entry);
                }
                entry.count++;
                if (fromY < entry.minY) entry.minY = fromY;
                if (fromY > entry.maxY) entry.maxY = fromY;
                if (deltaY > entry.maxDeltaY) entry.maxDeltaY = deltaY;
            });

            STATE.groundViolations = groundViolations;
            const summaryArray = Array.from(summaryByLine.values()).sort((a, b) => b.maxDeltaY - a.maxDeltaY);
            STATE.groundViolationSummary = summaryArray;

            if (groundViolations.length > 0) {
                console.log('[STUD] Ground violations:', groundViolations.length);
                if (typeof printGroundViolationTable === 'function') {
                    printGroundViolationTable(32);
                }
            } else {
                console.log('[STUD] No ground violations detected');
            }
        } else {
            STATE.groundViolations = [];
            STATE.groundViolationSummary = [];
            console.log('[STUD] Ground violation analysis skipped: base grid not available');
        }

        drawStudSkeletonOverlay();
        // Only build part control skeleton if the overlay is enabled (performance optimization)
        if (STATE.diagnostics && STATE.diagnostics.partControlOverlay !== false) {
            if (typeof buildPartControlSkeleton === 'function' && typeof drawPartControlOverlay === 'function') {
                buildPartControlSkeleton();
                drawPartControlOverlay();
            }
        }
    }
    
    async function debugExtractPartSkeleton(partId) {
        if (!STATE || !STATE.viewer || !window.THREE) {
            console.warn('[STUD-DEBUG] Viewer or THREE missing; cannot extract part skeleton');
            return null;
        }
        const id = (partId || '').trim();
        if (!id) {
            console.warn('[STUD-DEBUG] Provide a partId like "3001.dat"');
            return null;
        }

        const header = [
            '0 FILE debug_' + id,
            '0 Name: Debug single-part skeleton',
            '0 !LDRAW_ORG Model',
            '0 BFC CERTIFY CCW'
        ].join('\n');
        const body = '1 1 0 0 0  1 0 0  0 1 0  0 0 1  ' + id;
        const text = header + '\n' + body + '\n';

        const prevFilter = STATE.partControlFilterPartId;
        STATE.partControlFilterPartId = id;

        let targetPath = null;
        try {
            let loaded = false;

            if (STATE.libraryFileMap && Object.keys(STATE.libraryFileMap).length) {
                const mapped = lookupLibraryPath(id, id);
                if (mapped) {
                    let rel = normalizeRelativePath(mapped);
                    const lowerRel = rel.toLowerCase();
                    if (lowerRel.startsWith('ldraw/')) {
                        rel = rel.substring('ldraw/'.length);
                    }
                    targetPath = rel;
                }
            }

            if (targetPath && typeof STATE.viewer.loadPath === 'function') {
                console.log('[STUD-DEBUG] Loading part for skeleton via path', id, '→', targetPath);
                await STATE.viewer.loadPath(targetPath, {
                    filename: id,
                    name: 'debug-part-' + id,
                    origin: 'DebugSkeleton(part)'
                });
                loaded = true;
            } else if (STATE.viewer && typeof STATE.viewer.loadText === 'function') {
                console.log('[STUD-DEBUG] Loading part for skeleton via tiny MPD text', id);
                await STATE.viewer.loadText(text, {
                    filename: id,
                    name: 'debug-' + id,
                    origin: 'DebugSkeleton(text)'
                });
                loaded = true;
            }

            if (!loaded) {
                console.warn('[STUD-DEBUG] Could not load part for skeleton extraction:', id);
                return null;
            }

            computeStudSkeletonAndPlanes();
            const studs = Array.isArray(STATE.studSkeleton) ? STATE.studSkeleton : [];
            const payload = {
                partId: id,
                studs: studs.filter(node => node && node.worldPos).map(node => ({
                    x: node.worldPos.x,
                    y: node.worldPos.y,
                    z: node.worldPos.z,
                    role: node.kind || 'stud'
                }))
            };

            console.log('[STUD-DEBUG] Part skeleton', payload);

            if (typeof window !== 'undefined') {
                if (!window.partSkeletonDebug || typeof window.partSkeletonDebug !== 'object') {
                    window.partSkeletonDebug = {};
                }
                window.partSkeletonDebug[id.toLowerCase()] = payload;
            }

            if (!STATE.partSkeletonLibrary || typeof STATE.partSkeletonLibrary !== 'object') {
                STATE.partSkeletonLibrary = {};
            }
            STATE.partSkeletonLibrary[id.toLowerCase()] = {
                partId: id,
                studs: payload.studs.map(s => ({
                    x: s.x,
                    y: s.y,
                    z: s.z,
                    role: s.role || 'stud'
                }))
            };

            return payload;
        } catch (err) {
            console.error('[STUD-DEBUG] Failed to extract skeleton for', id, 'targetPath:', targetPath || '(text)', err);
            return null;
        } finally {
            STATE.partControlFilterPartId = prevFilter;
        }
    }

    async function debugRedBullLineSampler(options) {
        if (!STATE || !STATE.viewer || !Array.isArray(editorLines) || !editorLines.length || !window.THREE) {
            console.warn('[RED-BULL] Missing STATE, viewer, or editorLines; cannot run line-by-line sampler');
            return null;
        }

        const plateHeight = 8;
        const maxLines = options && typeof options.maxLines === 'number' ? options.maxLines : null;
        const header = [
            '0 FILE redbull_line_sampler.mpd',
            '0 Name: Red Bull single-line skeleton',
            '0 !LDRAW_ORG Model',
            '0 BFC CERTIFY CCW'
        ].join('\n');

        console.log('[RED-BULL] Starting line-by-line sampler. Total editorLines:', editorLines.length, 'Options:', options || null);

        const runStart = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
        let logicalTick = 0;

        const allNodes = [];
        let processedLines = 0;
        let linesWithStuds = 0;
        let totalStuds = 0;

        for (let idx = 0; idx < editorLines.length; idx++) {
            const line = editorLines[idx];
            const trimmed = line && line.trim();
            if (!trimmed || !trimmed.startsWith('1 ')) continue;
            if (maxLines != null && idx >= maxLines) break;

            const hasParser = (typeof parseType1Line === 'function');
            let parsed = hasParser ? parseType1Line(trimmed) : null;
            let partId = parsed && parsed.partId;

            if (!partId) {
                const tokens = trimmed.split(/\s+/);
                const candidate = tokens.length ? tokens[tokens.length - 1] : null;
                if (candidate) {
                    partId = candidate;
                    if (parsed) {
                        parsed.partId = partId;
                    } else {
                        parsed = { partId };
                    }
                    console.log('[RED-BULL] Derived partId from tokens for line', idx, '→', partId);
                }
            }

            if (!parsed || !partId) {
                console.warn('[RED-BULL] Unable to parse type-1 line for sampling', {
                    idx,
                    trimmed,
                    hasParser,
                    parsed
                });
                continue;
            }

            processedLines++;

            const body = trimmed;
            const text = header + '\n' + body + '\n';

            try {
                if (typeof STATE.viewer.loadText === 'function') {
                    console.log('[RED-BULL] Sampling line', idx, 'part', parsed.partId);
                    const loadStart = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
                    console.log('[RED-BULL] [line', idx, '] Loading micro-MPD. Text length:', text.length);
                    await STATE.viewer.loadText(text, {
                        filename: 'redbull_line_' + idx + '.mpd',
                        name: 'redbull-line-' + idx,
                        origin: 'RedBull(line ' + idx + ')'
                    });
                    const loadEnd = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
                    console.log('[RED-BULL] [line', idx, '] micro-MPD loaded in', (loadEnd - loadStart).toFixed(1), 'ms');
                } else {
                    console.warn('[RED-BULL] viewer.loadText missing; cannot load micro-MPD for line', idx);
                    continue;
                }

                if (typeof computeStudSkeletonAndPlanes !== 'function') {
                    console.warn('[RED-BULL] computeStudSkeletonAndPlanes missing; cannot sample line', idx);
                    continue;
                }

                computeStudSkeletonAndPlanes();
                let studs = Array.isArray(STATE.studSkeleton) ? STATE.studSkeleton : [];
                console.log('[RED-BULL] After primary sampler for line', idx, 'STATE.studSkeleton length:', Array.isArray(STATE.studSkeleton) ? STATE.studSkeleton.length : 'none', 'local studs length:', studs.length);

                // Fallback: if no studs were generated (e.g., meshes have no
                // userData.lineNum in this micro-MPD), run a local global
                // sampler over the current modelRoot to approximate the
                // original global stud grid behavior for this single line.
                if (!studs.length) {
                    const modelRoot = (STATE.viewer?.getModel && STATE.viewer.getModel()) ||
                                      STATE.viewer?.modelRoot ||
                                      STATE.viewer?.modelWrapper ||
                                      (STATE.viewer?.engine && (STATE.viewer.engine.modelWrapper || STATE.viewer.engine.model)) ||
                                      STATE.viewer?.scene;
                    if (modelRoot && window.THREE) {
                        console.warn('[RED-BULL] No studs from primary sampler for line', idx, '- entering fallback sampler');
                        const tmpPos = new THREE.Vector3();
                        const gridMap = new Map();
                        const minVotes = 6;

                        modelRoot.traverse(obj => {
                            if (!obj.isMesh || !obj.geometry || !obj.geometry.attributes || !obj.geometry.attributes.position) return;
                            obj.updateWorldMatrix(true, false);
                            const position = obj.geometry.attributes.position;
                            for (let i = 0; i < position.count; i++) {
                                tmpPos.fromBufferAttribute(position, i);
                                tmpPos.applyMatrix4(obj.matrixWorld);
                                const gx = Math.round(tmpPos.x / 20);
                                const gz = Math.round(tmpPos.z / 20);
                                const gridKey = gx + ',' + gz;
                                let col = gridMap.get(gridKey);
                                if (!col) {
                                    col = { gx, gz, layers: new Map() };
                                    gridMap.set(gridKey, col);
                                }
                                const layerIndex = Math.round(tmpPos.y / plateHeight);
                                let layer = col.layers.get(layerIndex);
                                if (!layer) {
                                    layer = { sumX: 0, sumY: 0, sumZ: 0, count: 0 };
                                    col.layers.set(layerIndex, layer);
                                }
                                layer.sumX += tmpPos.x;
                                layer.sumY += tmpPos.y;
                                layer.sumZ += tmpPos.z;
                                layer.count++;
                            }
                        });

                        const fallbackStuds = [];
                        gridMap.forEach(col => {
                            col.layers.forEach((layer, layerIndex) => {
                                if (layer.count < minVotes) return;
                                const cx = layer.sumX / layer.count;
                                const cy = layer.sumY / layer.count;
                                const cz = layer.sumZ / layer.count;
                                fallbackStuds.push({
                                    worldPos: { x: cx, y: cy, z: cz },
                                    gridX: col.gx,
                                    gridZ: col.gz,
                                    layer: layerIndex,
                                    kind: 'stud'
                                });
                            });
                        });

                        studs = fallbackStuds;
                        console.log('[RED-BULL] Fallback studs for line', idx, ':', studs.length, 'grid columns:', gridMap.size);
                    }
                }

                if (!studs.length) {
                    console.warn('[RED-BULL] No studs after fallback for line', idx, '- skipping');
                    continue;
                }

                linesWithStuds++;
                totalStuds += studs.length;
                console.log('[RED-BULL] Line', idx, 'final stud count before local transform:', studs.length);

                const a = parsed.a, b = parsed.b, c = parsed.c;
                const d = parsed.d, e = parsed.e, f = parsed.f;
                const g = parsed.g, h = parsed.h, i = parsed.i;
                const tx = parsed.x, ty = parsed.y, tz = parsed.z;

                const nodesForThisLine = [];
                studs.forEach((node, studIndex) => {
                    if (!node || !node.worldPos) return;
                    const wx = node.worldPos.x;
                    const wy = node.worldPos.y;
                    const wz = node.worldPos.z;

                    const dx = wx - tx;
                    const dy = wy - ty;
                    const dz = wz - tz;
                    const lx = a * dx + d * dy + g * dz;
                    const ly = b * dx + e * dy + h * dz;
                    const lz = c * dx + f * dy + i * dz;

                    const gridX = typeof node.gridX === 'number' ? node.gridX : Math.round(wx / 20);
                    const gridZ = typeof node.gridZ === 'number' ? node.gridZ : Math.round(wz / 20);
                    const layer = typeof node.layer === 'number' ? node.layer : Math.round(wy / plateHeight);

                    const studNode = {
                        x: wx,
                        y: wy,
                        z: wz,
                        layer: layer,
                        kind: node.kind || 'stud',
                        lineNum: idx,
                        gridX: gridX,
                        gridZ: gridZ,
                        partId: parsed.partId,
                        studIndex: studIndex,
                        local: { x: lx, y: ly, z: lz },
                        source: 'sampled-red-bull',
                        studVersion: 1
                    };
                    allNodes.push(studNode);
                    nodesForThisLine.push(studNode);
                });

                console.log('[RED-BULL] Line', idx, 'emitted nodesForThisLine:', nodesForThisLine.length);

                // Wolf bus + local event log for temporal inspection
                const tAbs = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
                const tRel = tAbs - runStart;
                logicalTick++;
                if (typeof window !== 'undefined') {
                    if (!window.redBullEvents || !Array.isArray(window.redBullEvents)) {
                        window.redBullEvents = [];
                    }
                    window.redBullEvents.push({
                        tAbs,
                        tRel,
                        tick: logicalTick,
                        lineIndex: idx,
                        partId: parsed.partId,
                        studCount: nodesForThisLine.length
                    });
                }
                if (typeof wagFrankPost === 'function') {
                    wagFrankPost({
                        type: 'redbull-line',
                        tAbs,
                        tRel,
                        tick: logicalTick,
                        lineIndex: idx,
                        partId: parsed.partId,
                        source: 'sampled-red-bull',
                        nodes: nodesForThisLine
                    });
                }
            } catch (err) {
                console.error('[RED-BULL] Failed to sample line', idx, err);
            }
        }

        const result = allNodes.length ? {
            version: 1,
            source: 'sampled-red-bull',
            nodes: allNodes
        } : null;

        if (result) {
            STATE.redBullSkeleton = result;
            if (typeof window !== 'undefined') {
                window.redBullSkeleton = result;
            }
            console.log('[RED-BULL] Completed line-by-line sampling.', {
                studs: allNodes.length,
                editorLines: Array.isArray(editorLines) ? editorLines.length : null,
                processedLines: processedLines,
                linesWithStuds: linesWithStuds,
                totalStuds: totalStuds
            });
        } else {
            console.warn('[RED-BULL] No studs generated from Red Bull sampler', {
                editorLines: Array.isArray(editorLines) ? editorLines.length : null,
                processedLines: processedLines,
                options: options || null
            });
        }

        // Option A: restore the original full scene in the main viewer after
        // Red Bull finishes, so we do not leave the last micro-MPD visible.
        try {
            if (Array.isArray(editorLines) && editorLines.length && typeof loadManualText === 'function') {
                const fullText = editorLines.join('\n');
                const activeScene = STATE.scenes && STATE.scenes[STATE.activeSceneIdx];
                const filename = activeScene && activeScene.name ? (activeScene.name + '.mpd') : 'redbull-restore.mpd';
                console.log('[RED-BULL] Restoring original scene after sampling...');
                await loadManualText(fullText, {
                    filename,
                    origin: 'RedBull Restore'
                });
            }
        } catch (err) {
            console.warn('[RED-BULL] Failed to restore original scene after sampling:', err);
        }

        return result;
    }

    async function loadPartGeometryForLineCompiler(partId) {
        if (!STATE || !STATE.viewer || !STATE.viewer.loader || !window.THREE) {
            console.warn('[LINE-COMPILE] Viewer/loader missing; cannot load part geometry for', partId);
            return null;
        }
        if (!STATE._partGeometryCache || typeof STATE._partGeometryCache !== 'object') {
            STATE._partGeometryCache = {};
        }
        const key = String(partId || '').trim().toLowerCase();
        if (!key) return null;
        if (STATE._partGeometryCache[key]) {
            return STATE._partGeometryCache[key];
        }

        const loader = STATE.viewer.loader;
        const fileMap = STATE.libraryFileMap || {};
        let rel = partId;
        const mapped = fileMap[rel] || fileMap[rel && rel.toLowerCase()];
        if (mapped) {
            rel = mapped;
        }

        STATE._partGeometryCache[key] = new Promise((resolve) => {
            loader.load(rel, group => {
                if (!group) {
                    console.warn('[LINE-COMPILE] Empty part group for', partId, 'path:', rel);
                    resolve(null);
                    return;
                }
                resolve(group);
            }, undefined, err => {
                console.warn('[LINE-COMPILE] Failed to load part geometry for', partId, 'path:', rel, err);
                resolve(null);
            });
        });

        return STATE._partGeometryCache[key];
    }

    async function buildMeshPerLineRoot() {
        if (!STATE || !STATE.viewer || !window.THREE) {
            console.warn('[LINE-COMPILE] STATE/viewer missing; cannot build mesh-per-line root');
            return null;
        }
        if (!Array.isArray(editorLines) || !editorLines.length) {
            console.warn('[LINE-COMPILE] No editorLines to compile');
            return null;
        }
        if (typeof parseType1Line !== 'function') {
            console.warn('[LINE-COMPILE] parseType1Line missing; cannot build mesh-per-line root');
            return null;
        }

        const root = new THREE.Group();
        root.name = 'MeshPerLineRoot';

        for (let idx = 0; idx < editorLines.length; idx++) {
            const line = editorLines[idx];
            const trimmed = line && line.trim();
            if (!trimmed || !trimmed.startsWith('1 ')) continue;

            const parsed = parseType1Line(trimmed);
            if (!parsed || !parsed.partId) continue;

            const partGroup = await loadPartGeometryForLineCompiler(parsed.partId);
            if (!partGroup) continue;

            const instance = partGroup.clone(true);
            const lineGroup = new THREE.Group();
            lineGroup.name = 'Line_' + idx + '_' + parsed.partId;
            lineGroup.userData.lineNum = idx;
            lineGroup.userData.partId = parsed.partId;
            lineGroup.userData.lineText = line;
            lineGroup.userData.colorCode = parsed.color;

            const a = parsed.a, b = parsed.b, c = parsed.c;
            const d = parsed.d, e = parsed.e, f = parsed.f;
            const g = parsed.g, h = parsed.h, i = parsed.i;
            const tx = parsed.x, ty = parsed.y, tz = parsed.z;

            const m = new THREE.Matrix4().set(
                a, b, c, tx,
                d, e, f, ty,
                g, h, i, tz,
                0, 0, 0, 1
            );
            lineGroup.applyMatrix4(m);

            lineGroup.add(instance);
            root.add(lineGroup);
        }

        console.log('[LINE-COMPILE] Built mesh-per-line root with', root.children.length, 'line groups');
        return root;
    }

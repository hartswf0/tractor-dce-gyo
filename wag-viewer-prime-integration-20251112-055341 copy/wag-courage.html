<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAG Courage Editor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🧡</text></svg>">
    <style>
        :root {
            --bg-main: #0a0a0a;
            --bg-secondary: #151515;
            --bg-tertiary: #1f1f1f;
            --text-primary: #e8e8e8;
            --text-secondary: #b8b8b8;
            --border-primary: #2a2a2a;
            --accent: #ffd700;
            --success: #0f0;
            --error: #f33;
        }
        :root[data-theme="light"] {
            --bg-main: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #eaeef2;
            --text-primary: #24292f;
            --text-secondary: #57606a;
            --border-primary: #d0d7de;
            --accent: #0969da;
            --success: #0a0;
            --error: #d1242f;
        }
        :root[data-theme="green"] {
            --bg-main: #0d1117;
            --bg-secondary: #0a1f1a;
            --bg-tertiary: #0f2920;
            --text-primary: #aff5b4;
            --text-secondary: #7ee787;
            --border-primary: #1f6feb;
            --accent: #3fb950;
            --success: #0f0;
            --error: #f85149;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: grid;
            grid-template-rows: 1fr;
            grid-template-columns: 1fr 1fr;  /* Equal 50/50 split */
            overflow: hidden;
            padding-top: 44px;
            padding-bottom: 44px;
        }
        
        /* Mobile/Tablet: Stack vertically */
        @media (max-width: 900px) {
            body {
                grid-template-columns: 1fr !important;
                grid-template-rows: minmax(300px, 1fr) minmax(300px, 1fr) !important;
            }
            #editor-panel {
                grid-row: 2 !important;
                grid-column: 1 !important;
                width: 100% !important;
                max-width: 100% !important;
                display: flex !important;
                visibility: visible !important;
                border-right: none !important;
                border-top: 2px solid var(--accent) !important;
            }
            #viewer-panel {
                grid-row: 1 !important;
                grid-column: 1 !important;
                width: 100% !important;
                max-width: 100% !important;
                display: flex !important;
                visibility: visible !important;
            }
        }
        /* Header - FIXED position like Bronze */
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: linear-gradient(180deg, var(--bg-tertiary) 0%, var(--bg-secondary) 100%);
            border-bottom: 1px solid var(--border-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            box-shadow: 0 1px 0 rgba(255,255,255,0.05);
            z-index: 1000;
        }
        #header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #file-name {
            font-size: 13px;
            color: var(--accent);
            font-weight: 600;
        }
        #header-center {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .mode-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .mode-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
            transform: translateY(-1px);
        }
        .mode-btn.active {
            background: var(--accent);
            color: var(--bg-main);
            border-color: var(--accent);
        }
        .corner-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .corner-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
            transform: translateY(-1px);
        }
        /* Footer - FIXED position like Bronze */
        #footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 44px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            z-index: 1000;
        }
        @media (max-width: 900px) {
            #footer {
                font-size: 9px;
                padding: 0 6px;
                gap: 4px;
            }
            #status-text {
                flex: 1;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                min-width: 0;
            }
        }
        #scene-selector {
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 11px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.2s;
        }
        .footer-corner-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .footer-corner-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
            transform: translateY(-1px);
        }
        #scene-selector:hover {
            border-color: var(--accent);
        }
        #status-text {
            color: var(--accent);
            flex: 1;
        }
        #model-stats {
            color: var(--text-secondary);
        }
        /* Editor Panel - left column (50% width, equal to viewer) */
        #editor-panel {
            grid-row: 1;
            grid-column: 1;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;  /* Allow flex shrink */
        }
        #editor-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            overflow: hidden;
        }
        .section-title {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-top: 8px;
        }
        #editor-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }
        /* Panel Header - Above Editor */
        .panel-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-primary);
            padding: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 36px;
        }
        .panel-header-left, .panel-header-right {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .panel-btn {
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
        }
        .panel-btn:hover {
            background: var(--bg-main);
            color: var(--text-primary);
            border-color: var(--accent);
        }
        
        /* Editor Scroll Container */
        #editor-scroll-container {
            display: flex;
            width: 100%;
            height: calc(100% - 36px);
            overflow: hidden;
        }
        
        /* Line-based Editor */
        #mpd-editor {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            background: var(--bg-main);
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
        }
        
        .editor-line {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border-left: 3px solid transparent;
            transition: all 0.15s;
            min-height: 28px;
        }
        .editor-line:hover {
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }
        .editor-line.locked {
            background: rgba(255, 215, 0, 0.15);
            border-left: 3px solid var(--accent);
        }
        .editor-line.selected {
            background: rgba(44, 194, 255, 0.2) !important;
            border-left: 3px solid var(--accent) !important;
            box-shadow: inset 0 0 0 1px var(--accent);
        }
        .editor-line.compiling {
            background: rgba(255, 215, 0, 0.15);
            border-left-color: var(--accent);
            animation: compileWave 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes compileWave {
            0% { background: rgba(255, 215, 0, 0.15); transform: translateX(-10px); }
            100% { background: rgba(255, 215, 0, 0); transform: translateX(0); }
        }
        .editor-line.highlighted {
            background: rgba(255, 215, 0, 0.2);
            border-left-color: #ffd700;
            animation: pulse 1s ease-in-out 2;
        }
        @keyframes pulse {
            0%, 100% { background: rgba(255, 215, 0, 0.2); }
            50% { background: rgba(255, 215, 0, 0.35); }
        }
        .editor-line.locked .line-content {
            color: #fa0;
            font-weight: 600;
        }
        .editor-line.missing-part {
            background: rgba(255, 105, 180, 0.15) !important;
            border-left: 3px solid #ff69b4 !important;
            position: relative;
            animation: errorPulse 2s ease-in-out infinite;
        }
        .editor-line.missing-part::after {
            content: '💔 MISSING';
            position: absolute;
            right: 8px;
        }
        .editor-line.compile-error {
            background: rgba(255, 60, 60, 0.2) !important;
            border-left: 3px solid #ff3c3c !important;
            position: relative;
            animation: errorPulse 2s ease-in-out infinite;
        }
        .editor-line.compile-error::after {
            content: '⚠️ ERROR';
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 9px;
            color: #ff3c3c;
            font-weight: 700;
            background: rgba(0,0,0,0.7);
            padding: 2px 8px;
            border-radius: 4px;
        }
        @keyframes errorPulse {
            0%, 100% { background: rgba(255, 105, 180, 0.15); }
            50% { background: rgba(255, 105, 180, 0.25); }
        }
        
        /* Toast notification system */
        .toast-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            background: linear-gradient(135deg, #1a3a1a 0%, #0a200a 100%);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 10px 16px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0,255,136,0.3);
            animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 1.7s forwards;
            pointer-events: auto;
        }
        .toast-icon { font-size: 16px; }
        .toast-text { flex: 1; }
        .toast-undo {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .toast-undo:hover { background: var(--accent); color: #000; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100px); }
        }
        
        /* Staging queue (recently added parts) */
        .staging-queue {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            padding: 8px;
            z-index: 9999;
            max-width: 280px;
            display: none;
        }
        .staging-queue.has-items { display: block; }
        .staging-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-primary);
        }
        .staging-title { font-size: 10px; color: var(--accent); font-weight: 700; }
        .staging-clear { background: none; border: none; color: #888; font-size: 9px; cursor: pointer; }
        .staging-clear:hover { color: #f66; }
        .staging-items {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 80px;
            overflow-y: auto;
        }
        .staging-item {
            background: var(--bg-main);
            border: 1px solid var(--border-primary);
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 8px;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .staging-item-remove {
            background: none;
            border: none;
            color: #666;
            font-size: 10px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .staging-item-remove:hover { color: #f66; }
        
        /* Part image lightbox */
        .part-lightbox {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 20000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            touch-action: pan-y;
        }
        .part-lightbox-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            max-width: 800px;
        }
        .part-lightbox-nav {
            background: rgba(0,255,136,0.2);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 28px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .part-lightbox-nav:hover {
            background: var(--accent);
            color: #000;
        }
        .part-lightbox-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        @media (max-width: 600px) {
            .part-lightbox-nav {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
        }
        .part-lightbox-image-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }
        .part-lightbox img {
            max-width: 80vw;
            max-height: 50vh;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0,255,136,0.3);
        }
        @media (max-width: 600px) {
            .part-lightbox img {
                max-width: 90vw;
                max-height: 40vh;
            }
        }
        .part-lightbox-info {
            margin-top: 16px;
            text-align: center;
            color: var(--accent);
            width: 100%;
            max-width: 400px;
        }
        .part-lightbox-info h3 {
            font-size: 18px;
            margin: 0 0 8px 0;
        }
        .part-lightbox-info p {
            font-size: 12px;
            color: #888;
            margin: 4px 0;
        }
        .part-lightbox-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 16px;
        }
        .part-lightbox-actions button {
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .part-lightbox-add {
            background: var(--accent);
            border: none;
            color: #000;
        }
        .part-lightbox-add:hover {
            transform: scale(1.05);
        }
        .part-lightbox-copy {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
        }
        .part-lightbox-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.5);
            border: 2px solid var(--accent);
            color: var(--accent);
            font-size: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
        }
        .part-lightbox-counter {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #666;
            font-size: 12px;
        }
        .swipe-hint {
            position: absolute;
            bottom: 16px;
            color: #444;
            font-size: 11px;
        }
        
        .line-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: var(--accent);
            opacity: 1 !important;
            appearance: auto !important;
            -webkit-appearance: checkbox !important;
        }
        .editor-line.locked .line-checkbox {
            accent-color: #fa0;
        }
        
        .line-number {
            min-width: 32px;
            text-align: right;
            color: var(--text-tertiary);
            font-size: 10px;
            flex-shrink: 0;
            user-select: none;
        }
        
        .line-content {
            flex: 1;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            outline: none;
            white-space: pre;
            font-weight: 500;
        }
        .line-content:focus {
            background: rgba(255, 215, 0, 0.08);
            border-radius: 2px;
        }
        .line-content.comment {
            color: var(--text-tertiary);
            font-style: italic;
            font-weight: 400;
        }
        .line-content.part {
            color: var(--text-primary);
            font-weight: 600;
        }
        .line-content.disabled {
            color: var(--text-tertiary);
            text-decoration: line-through;
            opacity: 0.4;
        }
        .editor-line.file-line {
            background: rgba(255, 215, 0, 0.05);
        }
        .editor-line.file-line .line-content {
            color: var(--accent);
            font-weight: 700;
            text-decoration: underline;
        }
        .editor-line.step-line .line-content {
            color: #0ff;
            font-weight: 600;
        }
        
        /* Grace Error Panel */
        #grace-error-panel {
            position: fixed;
            bottom: 44px;
            left: 0;
            right: 50%;
            max-height: 200px;
            background: linear-gradient(180deg, rgba(255, 105, 180, 0.95) 0%, rgba(220, 20, 60, 0.95) 100%);
            border-top: 2px solid #ff1493;
            overflow-y: auto;
            z-index: 900;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            display: none;
        }
        #grace-error-panel.visible {
            display: block;
            transform: translateY(0);
        }
        .grace-error-header {
            padding: 8px 12px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: #fff;
        }
        .grace-error-item {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            color: #fff;
            transition: background 0.2s;
        }
        .grace-error-item:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .grace-error-line {
            font-weight: 700;
            color: #ffff00;
        }
        .grace-error-copy {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .grace-error-copy:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        @media (max-width: 900px) {
            #grace-error-panel {
                right: 0;
                bottom: 0;
            }
        }
        
        /* Minimap */
        #mpd-minimap {
            width: 20px;
            height: 100%;
            background: var(--bg-tertiary);
            border-left: 1px solid var(--border-primary);
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        .mpd-minimap-strip {
            width: 100%;
            cursor: pointer;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        .mpd-minimap-strip:hover {
            background: rgba(255,255,255,0.2) !important;
        }
        .mpd-minimap-strip.part { background: #4a9eff; }
        .mpd-minimap-strip.comment { background: #555; }
        .mpd-minimap-strip.empty { background: #1a1a1a; }
        .mpd-minimap-strip.locked { background: #fa0; }
        
        /* 2D Grid View */
        #grid-2d {
            width: 100%;
            height: 100%;
            background: var(--bg-main);
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 2px;
            padding: 20px;
        }
        .grid-cell {
            background: var(--bg-main);
            border: 1px solid var(--border-primary);
            transition: all 0.2s;
            position: relative;
        }
        .grid-cell::after {
            content: attr(data-label);
            position: absolute;
            bottom: 3px;
            right: 4px;
            font-size: 9px;
            color: rgba(255,255,255,0.65);
            pointer-events: none;
        }
        .grid-cell.corner-marker::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 8px;
            height: 8px;
            border-top: 2px solid var(--accent);
            border-left: 2px solid var(--accent);
            opacity: 0.9;
        }
        .grid-cell.occupied {
            background: var(--accent);
            border-color: rgba(255, 215, 0, 0.5);
        }
        .grid-cell.selected {
            box-shadow: inset 0 0 0 2px #00ff00, 0 0 8px #00ff00;
            animation: pulse-grid 1s ease-in-out infinite;
        }
        @keyframes pulse-grid {
            0%, 100% { box-shadow: inset 0 0 0 2px #00ff00, 0 0 8px #00ff00; }
            50% { box-shadow: inset 0 0 0 3px #00ff00, 0 0 12px #00ff00; }
        }
        .grid-cell:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: var(--accent);
        }
        
        /* Minimap grid cells */
        .minimap-cell {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }
        .minimap-cell.corner-marker::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 5px;
            height: 5px;
            border-top: 2px solid var(--accent);
            border-left: 2px solid var(--accent);
            opacity: 0.9;
        }
        .minimap-cell.occupied {
            background: var(--accent);
            box-shadow: 0 0 2px rgba(255, 215, 0, 0.8);
        }
        
        /* Scene dots */
        #scene-dots {
            z-index: 10;
        }
        
        /* Paste Zone Modal */
        #paste-zone {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 600px;
            height: 60%;
            background: var(--bg-secondary);
            border: 2px dashed var(--accent);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5000;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }
        #paste-zone.active {
            display: flex;
        }
        #paste-zone textarea {
            width: 100%;
            height: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border-primary);
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 12px;
            resize: none;
            margin-bottom: 16px;
        }
        .paste-buttons {
            display: flex;
            gap: 12px;
        }
        
        #render-btn {
            padding: 10px;
            background: var(--accent);
            color: var(--bg-main);
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        #render-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 215, 0, 0.3);
        }
        #render-btn:active { transform: translateY(0); }
        .char-count {
            font-size: 10px;
            color: var(--text-secondary);
            text-align: right;
        }
        #search {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid var(--border-primary);
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 11px;
        }
        #search:focus {
            outline: 1px solid var(--accent);
            border-color: var(--accent);
        }
        #stats {
            font-size: 10px;
            color: var(--text-secondary);
            padding: 4px 0;
        }
        #model-list { display: flex; flex-direction: column; gap: 8px; }
        .model-item {
            padding: 8px;
            border-radius: 4px;
            background: var(--bg-tertiary);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
        }
        .model-item:hover {
            border-color: var(--accent);
            transform: translateX(2px);
        }
        .model-item.active {
            border-color: var(--accent);
            background: rgba(255, 215, 0, 0.1);
        }
        .model-title { font-weight: 600; font-size: 14px; }
        .model-meta { font-size: 12px; color: #aaa; margin-top: 4px; }
        .scene-item:hover {
            border-color: var(--accent);
            transform: translateX(2px);
        }
        .scene-item.active {
            border-color: var(--accent) !important;
            background: rgba(255, 215, 0, 0.1) !important;
        }
        #new-scene-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            color: var(--text-primary);
        }
        /* Viewer Panel - right column (50% width, equal to editor) */
        #viewer-panel {
            grid-row: 1;
            grid-column: 2;
            background: var(--bg-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;  /* Allow flex shrink */
        }

        /* Viewer toolbar (first child div inside viewer panel) */
        #viewer-panel > div:first-of-type {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* On mobile, add top border instead of left border */
        @media (max-width: 900px) {
            #editor-panel {
                border-right: none !important;
                border-top: 2px solid var(--accent) !important;
            }
            /* Hide scene name on mobile to save space */
            #scene-name {
                display: none !important;
            }
            /* Make buttons smaller on mobile */
            .panel-btn, .corner-btn, .mode-btn {
                font-size: 11px !important;
                padding: 4px 8px !important;
            }
        }
        #viewer-content {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        
        /* Mobile: Fix control bar positioning and visibility */
        @media (max-width: 900px) {
            #viewer-panel > div:first-of-type {
                position: sticky !important;
                top: 0 !important;
                z-index: 200 !important;
                flex-wrap: wrap !important;
                padding-right: 4px !important;
            }
            #viewer-panel > div:first-of-type > div:last-of-type {
                flex-wrap: wrap !important;
                row-gap: 2px;
            }
            
            #scene-dots-vertical {
                right: 5px !important;
                top: 60px !important;
                padding: 4px !important;
            }
            #minimap {
                right: 5px !important;
                top: 100px !important;
                width: 90px !important;
                height: 90px !important;
            }
        }
        #viewer { width: 100%; height: 100%; }
        #loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.15s ease-out;
        }
        #loading.active {
            display: flex !important;
            opacity: 1;
            animation: breathe 2s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { backdrop-filter: blur(8px); }
            50% { backdrop-filter: blur(12px); }
        }
        .loading-content {
            background: linear-gradient(135deg, rgba(10, 35, 50, 0.95), rgba(5, 20, 30, 0.95));
            padding: 40px 60px;
            border-radius: 16px;
            border: 2px solid var(--accent);
            box-shadow: 0 0 40px rgba(42, 193, 255, 0.3), 
                        0 8px 32px rgba(0,0,0,0.8),
                        inset 0 1px 0 rgba(255,255,255,0.1);
            text-align: center;
            animation: float 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }
        .loading-content::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent 30%, 
                rgba(42, 193, 255, 0.05) 50%, 
                transparent 70%);
            animation: shimmer 3s linear infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes shimmer {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 5px solid transparent;
            border-top: 5px solid var(--accent);
            border-right: 5px solid rgba(42, 193, 255, 0.3);
            border-radius: 50%;
            animation: spin 0.8s linear infinite, pulse 1.5s ease-in-out infinite;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(42, 193, 255, 0.4),
                        inset 0 0 20px rgba(42, 193, 255, 0.2);
            position: relative;
        }
        .loading-spinner::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 3px solid transparent;
            border-bottom: 3px solid rgba(42, 193, 255, 0.6);
            border-left: 3px solid rgba(42, 193, 255, 0.3);
            border-radius: 50%;
            animation: spin 1.2s linear infinite reverse;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 18px;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(42, 193, 255, 0.5),
                         0 0 20px rgba(42, 193, 255, 0.3);
            animation: textPulse 2s ease-in-out infinite;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .loading-subtext {
            font-size: 13px;
            color: rgba(42, 193, 255, 0.7);
            animation: textPulse 2s ease-in-out infinite 0.3s;
            position: relative;
            z-index: 1;
        }
        @keyframes textPulse {
            0%, 100% { 
                opacity: 0.8;
                transform: translateY(0);
            }
            50% { 
                opacity: 1;
                transform: translateY(-2px);
            }
        }
        .loading-progress {
            margin-top: 20px;
            width: 100%;
            height: 4px;
            background: rgba(42, 193, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
        }
        .loading-progress::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%,
                var(--accent) 50%,
                transparent 100%);
            animation: scanProgress 2s ease-in-out infinite;
            width: 50%;
        }
        @keyframes scanProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }
        #info-panel {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 280px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #1e90c2;
            backdrop-filter: blur(8px);
        }
        #info-panel h2 { font-size: 16px; margin-bottom: 10px; color: #8ae4ff; }
        .info-row { font-size: 12px; margin-bottom: 6px; }
        .label { color: #999; display: inline-block; width: 70px; }
        #controls {
            position: absolute;
            left: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #1e90c2;
            border-radius: 8px;
            padding: 12px;
        }
        .control-row { display: flex; gap: 6px; flex-wrap: wrap; }
        #controls button {
            background: #1e90c2;
            color: #03131b;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        #controls button:hover { background: #28b3f5; }
        .toggle-button.active { background: #2cc2ff; color: #03131b; }
        .empty-state { font-size: 13px; color: #777; margin-top: 10px; }
        #manual-loader {
            background: #101010;
            border: 1px solid #2b2b2b;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #manual-loader h2 { font-size: 14px; color: #8ae4ff; }
        #manual-text {
            width: 100%;
            min-height: 80px;
            background: #050505;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e8e8e8;
            padding: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: vertical;
        }
        .manual-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        #manual-loader button,
        #manual-loader label.file-label {
            background: #1e90c2;
            color: #03131b;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
        }
        #manual-loader button:hover,
        #manual-loader label.file-label:hover { background: #28b3f5; }
        #manual-file { display: none; }
        #manual-path {
            width: 100%;
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #0e0e0e;
            color: #fefefe;
            font-size: 12px;
        }
        #info-panel .value { color: #e8e8e8; }
        #info-panel .info-highlight { color: #8ae4ff; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Header: 4 corners + center -->
    <header id="header">
        <div id="header-left">
            <button class="corner-btn" id="help-btn" title="Help">?</button>
            <span id="file-name" style="font-size: 14px; font-weight: 600; margin-left: 12px;">Scene 1</span>
        </div>
        <div id="header-center">
            <div style="display: flex; gap: 4px; align-items: center; padding: 0 8px; border-right: 1px solid var(--border-primary); margin-right: 8px;">
                <button class="mode-btn" id="undo-btn" title="Undo">↶</button>
                <button class="mode-btn" id="redo-btn" title="Redo">↷</button>
            </div>
            <button class="mode-btn" id="clear-btn" title="Clear">∅</button>
            <button class="mode-btn active" id="select-mode" title="Select">⌖</button>
            <button class="mode-btn" id="lock-mode" title="Lock">⊗</button>
        </div>
        <button class="corner-btn" id="theme-btn" title="Theme: Dark">🌙</button>
    </header>
    
    <!-- Editor Panel (left) -->
    <section id="editor-panel">
        <div class="panel-header">
            <div class="panel-header-left">
                <button class="panel-btn" id="mpd-undo-btn" title="Undo">↶</button>
                <button class="panel-btn" id="mpd-redo-btn" title="Redo">↷</button>
                <button class="panel-btn" id="new-mpd-btn" title="New MPD">New</button>
                <button class="panel-btn" id="clear-mpd-btn" title="Discard">Discard</button>
            </div>
            <div class="panel-header-right">
                <button class="panel-btn" id="select-all-btn" title="Select all lines (Cmd+A)">SELECT ALL</button>
                <button class="panel-btn" id="deselect-all-btn" title="Clear selection (Esc)" style="display: none;">CLEAR</button>
                <button class="panel-btn" id="invert-selection-btn" title="Invert selection" style="display: none;">INVERT</button>
                <div style="width: 1px; height: 20px; background: var(--border-primary); margin: 0 4px;"></div>
                <button class="panel-btn" id="copy-all-btn" title="Copy entire MPD to clipboard" style="background: var(--accent); color: var(--bg-main); font-weight: 600;">📋 COPY ALL</button>
                <button class="panel-btn" id="paste-zone-btn" title="Paste MPD text into a new file">📥 PASTE</button>
                <button class="panel-btn" id="render-btn" title="Force Render">⟳</button>
            </div>
        </div>
        <div id="editor-scroll-container">
            <div id="mpd-editor"></div>
            <div id="mpd-minimap"></div>
        </div>
    </section>    
    <!-- Viewer Panel (right) -->
    <section id="viewer-panel">
        <!-- Viewer Mode Tabs + Controls (thin bar above grid) -->
        <div style="background: var(--bg-secondary); border-bottom: 1px solid var(--border-primary); padding: 6px; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; gap: 6px; align-items: center;">
                <button class="panel-btn active" id="mode-3d-tab">3D</button>
                <button class="panel-btn" id="mode-2d-tab">2D</button>
                <div style="width: 1px; height: 16px; background: var(--border-primary); margin: 0 4px;"></div>
                <button class="panel-btn" id="spin-quick" title="Auto Spin">S</button>
                <button class="panel-btn" id="reset-quick" title="Reset View">⌖</button>
                <div style="width: 1px; height: 16px; background: var(--border-primary); margin: 0 4px;"></div>
                <button class="panel-btn cam-preset" id="cam-front" title="Front View (stable)">F</button>
                <button class="panel-btn cam-preset" id="cam-top" title="Top View (stable)">T</button>
                <button class="panel-btn cam-preset" id="cam-right" title="Right View (stable)">R</button>
                <button class="panel-btn cam-preset" id="cam-iso" title="Isometric (45°)">I</button>
                <div style="width: 1px; height: 16px; background: var(--border-primary); margin: 0 4px;"></div>
                <button class="panel-btn" id="skeleton-quick" title="Skeleton-only view">💀</button>
                <button class="panel-btn" id="ground-toggle-btn" title="Toggle ground corrections">🪨</button>
                <button class="panel-btn" id="magnet-snap-btn" title="Snap all parts to nearest stud grid">🧲</button>
                <button class="panel-btn" id="stud-normal-quick" title="Toggle normal (cyan) studs" style="color:#00ffff;">●</button>
                <button class="panel-btn" id="stud-problem-quick" title="Toggle problem (red) studs" style="color:#ff4444;">●</button>
                <button class="panel-btn" id="stud-ghost-quick" title="Toggle ghost (green) studs" style="color:#00ff00;">●</button>
                <button class="panel-btn" id="part-control-quick" title="Toggle part centers (yellow)" style="color:#ffff00;">●</button>
            </div>
            <div style="flex: 1;"></div>
            <div style="display: flex; gap: 4px; align-items: center;">
                <button class="panel-btn" id="wire-quick" title="Wireframe">W</button>
                <button class="panel-btn active" id="axes-quick" title="Axes">A</button>
                <button class="panel-btn active" id="grid-quick" title="Grid">G</button>
                <button class="panel-btn" id="flipy-quick" title="Flip Y">Y</button>
                <div style="width: 1px; height: 16px; background: var(--border-primary); margin: 0 4px;"></div>
                <button class="panel-btn active" id="minimap-toggle" title="Toggle Minimap">▣</button>
                <button class="panel-btn" id="screenshot-btn" title="Screenshot (4:3 + JSON)">IMG</button>
                <button class="panel-btn" id="gold-import-btn" title="Load GOLD JSON & restore MPD">GOLD</button>
                <button class="panel-btn" id="glb-export-btn" title="Export current scene as GLB">GLB</button>
                <button
                  class="panel-btn"
                  id="redbull-btn"
                  title="Run Red Bull line-by-line sampler and copy GOLD fragment"
                  style="background: var(--accent); color: #b91c1c; font-weight: 700; border-color: #b91c1c;"
                >RB</button>
            </div>
        </div>

        <div id="viewer-content">
            <div id="viewer" style="display: block;"></div>
            <!-- 2D Grid View -->
            <div id="grid-2d" style="display: none;"></div>
            <!-- Loading Indicator (full-screen overlay) -->
            <div id="loading">
                <div class="loading-content">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Loading...</div>
                    <div class="loading-subtext">Please wait...</div>
                    <div class="loading-progress"></div>
                </div>
            </div>
            
            <!-- Scene dots (vertical strip on right edge) -->
            <div id="scene-dots-vertical" style="position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 6px; background: rgba(0,0,0,0.7); border: 1px solid var(--border-primary); border-radius: 4px; z-index: 100;">
                <!-- Dots populated dynamically -->
            </div>
            
            <!-- Minimap (below scene dots on right edge) -->
            <div id="minimap" style="position: absolute; top: 140px; right: 10px; width: 120px; height: 120px; background: rgba(0,0,0,0.8); border: 2px solid var(--accent); border-radius: 4px; display: block; padding: 4px; z-index: 100;">
                <div style="font-size: 9px; color: var(--accent); text-align: center; margin-bottom: 2px; font-weight: 700;">MAP</div>
                <div id="minimap-grid" style="display: grid; grid-template-columns: repeat(9, 1fr); gap: 1px; height: calc(100% - 14px);"></div>
            </div>
            <!-- Frank corner tab (orientation helper matching 2D/minimap corner marker) -->
            <div id="frank-corner-tab" style="position: absolute; bottom: 10px; left: 10px; padding: 4px 6px; font-size: 9px; background: rgba(0,0,0,0.8); border: 1px solid var(--accent); border-radius: 3px; color: var(--accent); z-index: 100;">
                ↖ A1
            </div>
        </div>
    </section>
    
    <!-- Footer: 4 corners -->
    <footer id="footer">
        <button class="footer-corner-btn" id="import-export-btn" title="Import/Export">⇄</button>
        
        <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px;">
            <button id="catalog-browser-btn" class="corner-btn" style="font-size: 18px; padding: 4px 10px;" title="Open Part Catalog Browser">⭐</button>
            <select id="scene-selector" style="min-width: 250px; font-size: 13px; padding: 6px;">
                <option value="">💚 Current Scene</option>
                <optgroup label="📦 Available MPD Files">
                    <option value="catalogs/Axle_01.mpd">Axle 1/2 (30 parts)</option>
                    <option value="catalogs/Axle_02.mpd">Axle 2/2 (1 parts)</option>
                    <option value="catalogs/Door_01.mpd">Door 1/1 (4 parts)</option>
                    <option value="catalogs/Hinge_01.mpd">Hinge 1/1 (3 parts)</option>
                    <option value="catalogs/Other_01.mpd">Other 1/1126 (30 parts)</option>
                    <option value="catalogs/Other_02.mpd">Other 2/1126 (30 parts)</option>
                    <option value="catalogs/Other_03.mpd">Other 3/1126 (30 parts)</option>
                    <option value="catalogs/Other_04.mpd">Other 4/1126 (30 parts)</option>
                    <option value="catalogs/Other_05.mpd">Other 5/1126 (30 parts)</option>
                    <option value="catalogs/Other_06.mpd">Other 6/1126 (30 parts)</option>
                    <option value="catalogs/Other_07.mpd">Other 7/1126 (30 parts)</option>
                    <option value="catalogs/Other_08.mpd">Other 8/1126 (30 parts)</option>
                    <option value="catalogs/Other_09.mpd">Other 9/1126 (30 parts)</option>
                    <option value="catalogs/Other_10.mpd">Other 10/1126 (30 parts)</option>
                    <option value="catalogs/Other_11.mpd">Other 11/1126 (30 parts)</option>
                    <option value="catalogs/Other_12.mpd">Other 12/1126 (30 parts)</option>

    // Magnet snap - snaps all parts to nearest stud grid positions
    function magnetSnapAllParts() {
        const statusText = document.getElementById('status-text');
        const magnetBtn = document.getElementById('magnet-snap-btn');
        
        if (!Array.isArray(editorLines) || !editorLines.length) {
            if (statusText) statusText.textContent = 'No parts to snap';
            return;
        }
        
        // Show loading state
        if (magnetBtn) {
            magnetBtn.disabled = true;
            magnetBtn.textContent = '⏳';
        }
        if (statusText) statusText.textContent = 'Snapping to stud grid...';
        
        setTimeout(() => {
            const studSpacing = 20; // LDU between studs (X/Z)
            const plateHeight = 8;  // LDU per plate height (Y)
            let snappedCount = 0;
            
            const newLines = editorLines.map((line, idx) => {
                const parsed = parseType1Line(line);
                if (!parsed) return line;
                
                // Snap X and Z to stud grid (multiples of 20)
                const snappedX = Math.round(parsed.x / studSpacing) * studSpacing;
                const snappedZ = Math.round(parsed.z / studSpacing) * studSpacing;
                // Snap Y to plate height (multiples of 8)
                const snappedY = Math.round(parsed.y / plateHeight) * plateHeight;
                
                // Check if anything changed
                if (snappedX !== parsed.x || snappedY !== parsed.y || snappedZ !== parsed.z) {
                    snappedCount++;
                    // Rebuild the line with snapped coordinates
                    const parts = line.trim().split(/\s+/);
                    if (parts.length >= 14) {
                        parts[2] = snappedX.toString();
                        parts[3] = snappedY.toString();
                        parts[4] = snappedZ.toString();
                        // Preserve leading whitespace
                        const leading = line.match(/^(\s*)/)[1] || '';
                        return leading + parts.join(' ');
                    }
                }
                return line;
            });
            
            if (snappedCount > 0) {
                // Play satisfying click sound
                playMagnetClickSound();
                
                editorLines = newLines;
                if (STATE.scenes[STATE.activeSceneIdx]) {
                    STATE.scenes[STATE.activeSceneIdx].lines = [...editorLines];
                }
                renderEditor(editorLines);
                if (statusText) statusText.textContent = `🧲 Snapped ${snappedCount} parts to grid`;
                
                // Recompile after a short delay
                setTimeout(() => compile(), 200);
            } else {
                if (statusText) statusText.textContent = '🧲 All parts already on grid';
            }
            
            // Restore button state
            if (magnetBtn) {
                magnetBtn.disabled = false;
                magnetBtn.textContent = '🧲';
            }
        }, 50);
    }
    
    // Play a satisfying magnetic click sound
    function playMagnetClickSound() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Create a short "click" sound
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            // Quick attack, quick decay for a "snap" feel
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.15);
            
            // Clean up
            setTimeout(() => audioCtx.close(), 200);
        } catch (e) {
            console.log('[MAGNET] Audio not available:', e.message);
        }
    }

    // ═══════════════════════════════════════════════════════════════
    // VOID MANAGEMENT SYSTEM - Auto-Assembly via Negative Space
    // ═══════════════════════════════════════════════════════════════
    
    // Get bounding box for a part based on known dimensions or estimation
    function estimatePartBounds(parsed) {
        // Common part dimension patterns (in LDU)
        // Format: partId pattern -> { width, height, depth } in studs/plates
        const studSize = 20;
        const plateHeight = 8;
        const brickHeight = 24;
        
        const partId = (parsed.partId || '').toLowerCase();
        let w = 1, h = 1, d = 1; // Default 1x1x1 plate
        
        // Try to extract dimensions from part name
        // Pattern: NxM in filename (e.g., 3001 = 2x4 brick, 3003 = 2x2 brick)
        const knownParts = {
            '3001': { w: 4, h: 3, d: 2 },  // 2x4 brick
            '3002': { w: 3, h: 3, d: 2 },  // 2x3 brick
            '3003': { w: 2, h: 3, d: 2 },  // 2x2 brick
            '3004': { w: 2, h: 3, d: 1 },  // 1x2 brick
            '3005': { w: 1, h: 3, d: 1 },  // 1x1 brick
            '3006': { w: 10, h: 3, d: 2 }, // 2x10 brick
            '3007': { w: 8, h: 3, d: 2 },  // 2x8 brick
            '3008': { w: 8, h: 3, d: 1 },  // 1x8 brick
            '3009': { w: 6, h: 3, d: 1 },  // 1x6 brick
            '3010': { w: 4, h: 3, d: 1 },  // 1x4 brick
            '3020': { w: 4, h: 1, d: 2 },  // 2x4 plate
            '3021': { w: 3, h: 1, d: 2 },  // 2x3 plate
            '3022': { w: 2, h: 1, d: 2 },  // 2x2 plate
            '3023': { w: 2, h: 1, d: 1 },  // 1x2 plate
            '3024': { w: 1, h: 1, d: 1 },  // 1x1 plate
            '3031': { w: 4, h: 1, d: 4 },  // 4x4 plate
            '3032': { w: 6, h: 1, d: 4 },  // 4x6 plate
            '3033': { w: 10, h: 1, d: 6 }, // 6x10 plate
            '3034': { w: 8, h: 1, d: 2 },  // 2x8 plate
            '3035': { w: 8, h: 1, d: 4 },  // 4x8 plate
            '3036': { w: 8, h: 1, d: 6 },  // 6x8 plate
            '3039': { w: 2, h: 2, d: 2 },  // 2x2 slope 45
            '3040': { w: 2, h: 2, d: 1 },  // 1x2 slope 45
            '3041': { w: 4, h: 4, d: 2 },  // 2x4 slope 45 double
            '3660': { w: 2, h: 2, d: 2 },  // 2x2 slope inverted
            '3665': { w: 2, h: 2, d: 1 },  // 1x2 slope inverted
            '3068': { w: 2, h: 1, d: 2 },  // 2x2 tile
            '3069': { w: 2, h: 1, d: 1 },  // 1x2 tile
            '3070': { w: 1, h: 1, d: 1 },  // 1x1 tile
            '3795': { w: 2, h: 1, d: 2 },  // 2x2 plate with hole
            '3623': { w: 3, h: 1, d: 1 },  // 1x3 plate
            '3710': { w: 4, h: 1, d: 1 },  // 1x4 plate
            '3666': { w: 6, h: 1, d: 1 },  // 1x6 plate
            '3460': { w: 8, h: 1, d: 1 },  // 1x8 plate
            '4477': { w: 10, h: 1, d: 1 }, // 1x10 plate
        };
        
        // Extract base part number
        const baseNum = partId.match(/(\d{4,5})/);
        if (baseNum && knownParts[baseNum[1]]) {
            const dims = knownParts[baseNum[1]];
            w = dims.w;
            h = dims.h;
            d = dims.d;
        } else {
            // Heuristic: try to guess from filename patterns
            const sizeMatch = partId.match(/(\d+)\s*x\s*(\d+)/i);
            if (sizeMatch) {
                w = parseInt(sizeMatch[1]) || 1;
                d = parseInt(sizeMatch[2]) || 1;
            }
            // Check for "baseplate" - large
            if (partId.includes('baseplate') || partId.includes('32 x 32')) {
                w = 32; d = 32; h = 1;
            }
            // Check for track pieces
            if (partId.includes('track') || partId.includes('30401') || partId.includes('30402')) {
                w = 16; d = 16; h = 1;
            }
        }
        
        // Apply rotation matrix to dimensions
        const a = Math.abs(parsed.a), b = Math.abs(parsed.b), c = Math.abs(parsed.c);
        const d1 = Math.abs(parsed.d), e = Math.abs(parsed.e), f = Math.abs(parsed.f);
        const g = Math.abs(parsed.g), h1 = Math.abs(parsed.h), i = Math.abs(parsed.i);
        
        // Calculate world-space extents
        const worldW = (w * studSize * Math.max(a, b, c)) || (w * studSize);
        const worldH = (h * plateHeight * Math.max(d1, e, f)) || (h * plateHeight);
        const worldD = (d * studSize * Math.max(g, h1, i)) || (d * studSize);
        
        return {
            minX: parsed.x - worldW / 2,
            maxX: parsed.x + worldW / 2,
            minY: parsed.y - worldH,
            maxY: parsed.y,
            minZ: parsed.z - worldD / 2,
            maxZ: parsed.z + worldD / 2,
            studW: w,
            studD: d,
            studH: h
        };
    }
    
    // Check if two bounding boxes overlap
    function boundsOverlap(a, b, margin = 2) {
        return !(a.maxX + margin < b.minX || a.minX - margin > b.maxX ||
                 a.maxY + margin < b.minY || a.minY - margin > b.maxY ||
                 a.maxZ + margin < b.minZ || a.minZ - margin > b.maxZ);
    }
    
    // Build a void map - grid of occupied and empty stud positions
    function buildVoidMap() {
        const studSpacing = 20;
        const plateHeight = 8;
        const occupied = new Map(); // "x,y,z" -> lineNum
        const voidPositions = [];
        
        // First pass: mark all occupied positions
        editorLines.forEach((line, idx) => {
            const parsed = parseType1Line(line);
            if (!parsed) return;
            
            const bounds = estimatePartBounds(parsed);
            const studW = bounds.studW || 1;
            const studD = bounds.studD || 1;
            const studH = bounds.studH || 1;
            
            // Mark grid cells this part occupies
            for (let sx = 0; sx < studW; sx++) {
                for (let sz = 0; sz < studD; sz++) {
                    for (let sy = 0; sy < studH; sy++) {
                        const wx = Math.round((parsed.x - (studW - 1) * 10 + sx * studSpacing) / studSpacing) * studSpacing;
                        const wy = Math.round((parsed.y - sy * plateHeight) / plateHeight) * plateHeight;
                        const wz = Math.round((parsed.z - (studD - 1) * 10 + sz * studSpacing) / studSpacing) * studSpacing;
                        const key = `${wx},${wy},${wz}`;
                        occupied.set(key, idx);
                    }
                }
            }
        });
        
        // Find bounding box of scene
        let minX = Infinity, maxX = -Infinity;
        let minZ = Infinity, maxZ = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        
        occupied.forEach((_, key) => {
            const [x, y, z] = key.split(',').map(Number);
            minX = Math.min(minX, x); maxX = Math.max(maxX, x);
            minY = Math.min(minY, y); maxY = Math.max(maxY, y);
            minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z);
        });
        
        // Expand bounds slightly
        minX -= studSpacing * 2; maxX += studSpacing * 2;
        minZ -= studSpacing * 2; maxZ += studSpacing * 2;
        
        // Second pass: find void positions (empty grid cells within bounds)
        for (let x = minX; x <= maxX; x += studSpacing) {
            for (let z = minZ; z <= maxZ; z += studSpacing) {
                const groundKey = `${x},0,${z}`;
                if (!occupied.has(groundKey)) {
                    voidPositions.push({ x, y: 0, z, layer: 0 });
                }
            }
        }
        
        return { occupied, voidPositions, bounds: { minX, maxX, minY, maxY, minZ, maxZ } };
    }
    
    // Advanced magnet: detect overlaps and spread parts
    function magnetSpreadParts() {
        const statusText = document.getElementById('status-text');
        const magnetBtn = document.getElementById('magnet-snap-btn');
        
        if (!Array.isArray(editorLines) || !editorLines.length) {
            if (statusText) statusText.textContent = 'No parts to spread';
            return;
        }
        
        if (magnetBtn) {
            magnetBtn.disabled = true;
            magnetBtn.textContent = '⏳';
        }
        if (statusText) statusText.textContent = 'Analyzing overlaps...';
        
        setTimeout(() => {
            const studSpacing = 20;
            const plateHeight = 8;
            
            // Parse all parts and their bounds
            const parts = [];
            editorLines.forEach((line, idx) => {
                const parsed = parseType1Line(line);
                if (parsed) {
                    const bounds = estimatePartBounds(parsed);
                    parts.push({ idx, parsed, bounds, line });
                }
            });
            
            if (parts.length < 2) {
                if (statusText) statusText.textContent = 'Need 2+ parts to spread';
                if (magnetBtn) { magnetBtn.disabled = false; magnetBtn.textContent = '🧲'; }
                return;
            }
            
            // Find overlapping pairs
            const overlaps = [];
            for (let i = 0; i < parts.length; i++) {
                for (let j = i + 1; j < parts.length; j++) {
                    if (boundsOverlap(parts[i].bounds, parts[j].bounds)) {
                        overlaps.push([i, j]);
                    }
                }
            }
            
            console.log('[VOID] Found', overlaps.length, 'overlapping pairs');
            
            if (overlaps.length === 0) {
                // No overlaps - try stacking instead
                magnetStackParts(parts);
                return;
            }
            
            // Resolve overlaps by spreading parts
            let movedCount = 0;
            const occupied = new Set();
            
            // Mark first part's position as occupied
            parts.forEach((p, i) => {
                const key = `${Math.round(p.parsed.x / studSpacing)},${Math.round(p.parsed.z / studSpacing)}`;
                if (i === 0) occupied.add(key);
            });
            
            // Move overlapping parts to nearest free position
            const newLines = [...editorLines];
            
            overlaps.forEach(([i, j]) => {
                const partB = parts[j];
                let bestX = partB.parsed.x;
                let bestZ = partB.parsed.z;
                let found = false;
                
                // Spiral outward to find free position
                for (let radius = 1; radius <= 20 && !found; radius++) {
                    for (let dx = -radius; dx <= radius && !found; dx++) {
                        for (let dz = -radius; dz <= radius && !found; dz++) {
                            if (Math.abs(dx) !== radius && Math.abs(dz) !== radius) continue;
                            
                            const testX = Math.round((partB.parsed.x + dx * studSpacing) / studSpacing) * studSpacing;
                            const testZ = Math.round((partB.parsed.z + dz * studSpacing) / studSpacing) * studSpacing;
                            const key = `${Math.round(testX / studSpacing)},${Math.round(testZ / studSpacing)}`;
                            
                            if (!occupied.has(key)) {
                                bestX = testX;
                                bestZ = testZ;
                                occupied.add(key);
                                found = true;
                            }
                        }
                    }
                }
                
                if (bestX !== partB.parsed.x || bestZ !== partB.parsed.z) {
                    // Rebuild line with new position
                    const lineParts = partB.line.trim().split(/\s+/);
                    if (lineParts.length >= 14) {
                        lineParts[2] = bestX.toString();
                        lineParts[4] = bestZ.toString();
                        const leading = partB.line.match(/^(\s*)/)[1] || '';
                        newLines[partB.idx] = leading + lineParts.join(' ');
                        movedCount++;
                    }
                }
            });
            
            if (movedCount > 0) {
                playMagnetClickSound();
                editorLines = newLines;
                if (STATE.scenes[STATE.activeSceneIdx]) {
                    STATE.scenes[STATE.activeSceneIdx].lines = [...editorLines];
                }
                renderEditor(editorLines);
                if (statusText) statusText.textContent = `🧲 Spread ${movedCount} overlapping parts`;
                setTimeout(() => compile(), 200);
            } else {
                if (statusText) statusText.textContent = '🧲 No overlaps to resolve';
            }
            
            if (magnetBtn) { magnetBtn.disabled = false; magnetBtn.textContent = '🧲'; }
        }, 50);
    }
    
    // Stack compatible parts - connect via studs
    function magnetStackParts(parts) {
        const statusText = document.getElementById('status-text');
        const magnetBtn = document.getElementById('magnet-snap-btn');
        const studSpacing = 20;
        const plateHeight = 8;
        
        if (!parts || parts.length < 2) {
            if (statusText) statusText.textContent = '🧲 No parts to stack';
            if (magnetBtn) { magnetBtn.disabled = false; magnetBtn.textContent = '🧲'; }
            return;
        }
        
        // Sort by Y (lowest first - these become the base)
        const sortedParts = [...parts].sort((a, b) => b.parsed.y - a.parsed.y);
        
        // Try to stack higher parts onto lower parts
        let stackedCount = 0;
        const newLines = [...editorLines];
        const usedPositions = new Set();
        
        // First, mark base layer positions
        sortedParts.slice(0, Math.ceil(sortedParts.length / 3)).forEach(p => {
            const gx = Math.round(p.parsed.x / studSpacing);
            const gz = Math.round(p.parsed.z / studSpacing);
            for (let dx = 0; dx < (p.bounds.studW || 1); dx++) {
                for (let dz = 0; dz < (p.bounds.studD || 1); dz++) {
                    usedPositions.add(`${gx + dx},0,${gz + dz}`);
                }
            }
        });
        
        // Stack remaining parts
        sortedParts.slice(Math.ceil(sortedParts.length / 3)).forEach((part, i) => {
            const stackHeight = (i % 3 + 1) * plateHeight * 3; // Vary heights
            const gx = Math.round(part.parsed.x / studSpacing);
            const gz = Math.round(part.parsed.z / studSpacing);
            
            // Find a position on top of existing parts
            let foundX = part.parsed.x;
            let foundY = -stackHeight;
            let foundZ = part.parsed.z;
            let found = false;
            
            // Look for a base position with space above
            for (const key of usedPositions) {
                const [bx, by, bz] = key.split(',').map(Number);
                if (by === 0) { // Ground level
                    const testKey = `${bx},${stackHeight / plateHeight},${bz}`;
                    if (!usedPositions.has(testKey)) {
                        foundX = bx * studSpacing;
                        foundY = -stackHeight;
                        foundZ = bz * studSpacing;
                        usedPositions.add(testKey);
                        found = true;
                        break;
                    }
                }
            }
            
            if (found && (foundX !== part.parsed.x || foundY !== part.parsed.y || foundZ !== part.parsed.z)) {
                const lineParts = part.line.trim().split(/\s+/);
                if (lineParts.length >= 14) {
                    lineParts[2] = foundX.toString();
                    lineParts[3] = foundY.toString();
                    lineParts[4] = foundZ.toString();
                    const leading = part.line.match(/^(\s*)/)[1] || '';
                    newLines[part.idx] = leading + lineParts.join(' ');
                    stackedCount++;
                }
            }
        });
        
        if (stackedCount > 0) {
            playMagnetClickSound();
            playMagnetClickSound(); // Double click for stacking
            editorLines = newLines;
            if (STATE.scenes[STATE.activeSceneIdx]) {
                STATE.scenes[STATE.activeSceneIdx].lines = [...editorLines];
            }
            renderEditor(editorLines);
            if (statusText) statusText.textContent = `🧲 Stacked ${stackedCount} parts`;
            setTimeout(() => compile(), 200);
        } else {
            if (statusText) statusText.textContent = '🧲 Parts already arranged';
        }
        
        if (magnetBtn) { magnetBtn.disabled = false; magnetBtn.textContent = '🧲'; }
    }

    // Auto-assemble: the big one - try to connect all parts intelligently
    function autoAssembleScene() {
        const statusText = document.getElementById('status-text');
        const magnetBtn = document.getElementById('magnet-snap-btn');
        
        if (!Array.isArray(editorLines) || !editorLines.length) {
            if (statusText) statusText.textContent = 'No parts to assemble';
            return;
        }
        
        if (magnetBtn) {
            magnetBtn.disabled = true;
            magnetBtn.textContent = '⏳';
        }
        if (statusText) statusText.textContent = '🤖 Auto-assembling scene...';
        
        setTimeout(() => {
            const studSpacing = 20;
            const plateHeight = 8;
            
            // Parse all parts
            const parts = [];
            editorLines.forEach((line, idx) => {
                const parsed = parseType1Line(line);
                if (parsed) {
                    const bounds = estimatePartBounds(parsed);
                    parts.push({ 
                        idx, 
                        parsed, 
                        bounds, 
                        line,
                        placed: false,
                        gridX: 0,
                        gridY: 0,
                        gridZ: 0
                    });
                }
            });
            
            if (parts.length === 0) {
                if (statusText) statusText.textContent = 'No valid parts found';
                if (magnetBtn) { magnetBtn.disabled = false; magnetBtn.textContent = '🧲'; }
                return;
            }
            
            // Sort by size (largest first)
            parts.sort((a, b) => {
                const sizeA = (a.bounds.studW || 1) * (a.bounds.studD || 1);
                const sizeB = (b.bounds.studW || 1) * (b.bounds.studD || 1);
                return sizeB - sizeA;
            });
            
            // Grid for tracking occupied positions
            const grid = new Map(); // "gx,gy,gz" -> partIdx
            
            // Place largest part at origin
            const firstPart = parts[0];
            firstPart.gridX = 0;
            firstPart.gridY = 0;
            firstPart.gridZ = 0;
            firstPart.placed = true;
            
            // Mark its cells as occupied
            for (let dx = 0; dx < (firstPart.bounds.studW || 1); dx++) {
                for (let dz = 0; dz < (firstPart.bounds.studD || 1); dz++) {
                    grid.set(`${dx},0,${dz}`, 0);
                }
            }
            
            // Place remaining parts using spiral placement
            let placedCount = 1;
            let spiralRadius = 1;
            let currentLayer = 0;
            
            for (let i = 1; i < parts.length; i++) {
                const part = parts[i];
                const w = part.bounds.studW || 1;
                const d = part.bounds.studD || 1;
                let placed = false;
                
                // Try to find a valid position
                for (let layer = 0; layer <= 3 && !placed; layer++) {
                    for (let radius = 0; radius <= 15 && !placed; radius++) {
                        // Spiral pattern
                        for (let angle = 0; angle < 8 && !placed; angle++) {
                            const gx = Math.round(Math.cos(angle * Math.PI / 4) * radius);
                            const gz = Math.round(Math.sin(angle * Math.PI / 4) * radius);
                            
                            // Check if position is free
                            let canPlace = true;
                            for (let dx = 0; dx < w && canPlace; dx++) {
                                for (let dz = 0; dz < d && canPlace; dz++) {
                                    if (grid.has(`${gx + dx},${layer},${gz + dz}`)) {
                                        canPlace = false;
                                    }
                                }
                            }
                            
                            if (canPlace) {
                                part.gridX = gx;
                                part.gridY = layer;
                                part.gridZ = gz;
                                part.placed = true;
                                placed = true;
                                placedCount++;
                                
                                // Mark cells
                                for (let dx = 0; dx < w; dx++) {
                                    for (let dz = 0; dz < d; dz++) {
                                        grid.set(`${gx + dx},${layer},${gz + dz}`, i);
                                    }
                                }
                            }
                        }
                    }
                }
            }
            
            // Convert grid positions back to world coordinates
            const newLines = [...editorLines];
            let movedCount = 0;
            
            parts.forEach(part => {
                if (part.placed) {
                    const worldX = part.gridX * studSpacing;
                    const worldY = -part.gridY * plateHeight * 3; // Stack height
                    const worldZ = part.gridZ * studSpacing;
                    
                    if (worldX !== part.parsed.x || worldY !== part.parsed.y || worldZ !== part.parsed.z) {
                        const lineParts = part.line.trim().split(/\s+/);
                        if (lineParts.length >= 14) {
                            lineParts[2] = worldX.toString();
                            lineParts[3] = worldY.toString();
                            lineParts[4] = worldZ.toString();
                            const leading = part.line.match(/^(\s*)/)[1] || '';
                            newLines[part.idx] = leading + lineParts.join(' ');
                            movedCount++;
                        }
                    }
                }
            });
            
            if (movedCount > 0) {
                // Play multiple clicks for dramatic effect
                playMagnetClickSound();
                setTimeout(() => playMagnetClickSound(), 100);
                setTimeout(() => playMagnetClickSound(), 200);
                
                editorLines = newLines;
                if (STATE.scenes[STATE.activeSceneIdx]) {
                    STATE.scenes[STATE.activeSceneIdx].lines = [...editorLines];
                }
                renderEditor(editorLines);
                if (statusText) statusText.textContent = `🤖 Assembled ${placedCount}/${parts.length} parts`;
                setTimeout(() => compile(), 200);
            } else {
                if (statusText) statusText.textContent = '🤖 Scene already assembled';
            }
            
            if (magnetBtn) { magnetBtn.disabled = false; magnetBtn.textContent = '🧲'; }
        }, 50);
    }

    function buildStudSkeletonMPD() {
        const studs = STATE.studSkeleton || [];
        if (!studs.length) {
            console.log('[STUD] No stud skeleton available for export');
            return '';
        }
        const lines = [];
        lines.push('0 FILE wag_courage_stud_skeleton.mpd');
        lines.push('0 Name: WAG-Courage Stud Skeleton Export');
        lines.push('0 Author: Courage Tooling');
        lines.push('0 !LDRAW_ORG Model');
        lines.push('0 BFC CERTIFY CCW');
        lines.push('');

        const baseLayer = typeof STATE.baseGridLayer === 'number' ? STATE.baseGridLayer : null;
        const plateHeight = 8;

        studs.forEach((node, idx) => {
            if (!node || !node.worldPos) return;
            const x = formatLDrawNumber(node.worldPos.x);
            const y = formatLDrawNumber(node.worldPos.y);
            const z = formatLDrawNumber(node.worldPos.z);
            const gx = typeof node.gridX === 'number' ? node.gridX : null;
            const gz = typeof node.gridZ === 'number' ? node.gridZ : null;
            const layer = typeof node.layer === 'number' ? node.layer : null;
            const isBelow = baseLayer !== null && layer !== null && layer < baseLayer;
            const color = isBelow ? 4 : 1;
            const lineNum = typeof node.lineNum === 'number' ? node.lineNum : null;
            const studIndex = idx;
            const layerY = layer !== null ? formatLDrawNumber(layer * plateHeight) : null;

            if (lineNum !== null || gx !== null || gz !== null || layerY !== null) {
                const parts = [];
                if (lineNum !== null) parts.push('line ' + lineNum);
                if (gx !== null && gz !== null) parts.push('grid ' + gx + ',' + gz);
                if (layerY !== null) parts.push('layerY ' + layerY);
                parts.push('stud ' + studIndex);
                lines.push('0 ' + parts.join(' '));
            }

            lines.push(
                '1 ' + color + ' ' + x + ' ' + y + ' ' + z +
                '  1 0 0  0 1 0  0 0 1  3003.dat'
            );
        });

        return lines.join('\n');
    }

    function printGroundViolationTable(limit = 50) {
        const violations = STATE.groundViolations || [];
        if (!violations.length) {
            console.log('[STUD] No ground violations to print');
            return [];
        }

        if (typeof computeGroundLineOffsets === 'function') {
            computeGroundLineOffsets();
        }

        const transformsArray = STATE.groundTransforms || [];
        const transformsByLine = new Map();
        transformsArray.forEach(t => {
            if (t && typeof t.lineNum === 'number') {
                transformsByLine.set(t.lineNum, t);
            }
        });

        const rows = [];
        const partCache = new Map();
        const max = Math.min(limit, violations.length);
        for (let idx = 0; idx < max; idx++) {
            const v = violations[idx];
            const lineNum = typeof v.lineNum === 'number' ? v.lineNum : null;
            const transform = lineNum !== null ? transformsByLine.get(lineNum) : null;

            let partId = transform && transform.partId ? transform.partId : null;
            let lineText = null;
            if (lineNum !== null && lineNum >= 0 && lineNum < editorLines.length) {
                lineText = editorLines[lineNum];
                if (!partId) {
                    if (partCache.has(lineNum)) {
                        partId = partCache.get(lineNum);
                    } else {
                        const parsed = parseType1Line(editorLines[lineNum]);
                        partId = parsed ? parsed.partId : null;
                        partCache.set(lineNum, partId);
                    }
                }
            }
            rows.push({
                idx,
                lineNum,
                partId,
                lineText,
                gridX: v.gridX,
                gridZ: v.gridZ,
                layer: v.layer,
                worldX: v.from && typeof v.from.x === 'number' ? v.from.x : null,
                worldY: v.from && typeof v.from.y === 'number' ? v.from.y : null,
                worldZ: v.from && typeof v.from.z === 'number' ? v.from.z : null,
                baseY: v.to && typeof v.to.y === 'number' ? v.to.y : null,
                deltaY: v.deltaY,
                proposedDeltaY: transform && typeof transform.deltaY === 'number' ? transform.deltaY : null,
                yBefore: transform && transform.translationBefore ? transform.translationBefore.y : null,
                yAfter: transform && transform.translationAfter ? transform.translationAfter.y : null
            });
        }
        if (console.table) {
            console.table(rows);
        } else {
            console.log(rows);
        }
        return rows;
    }

            // Delete key = Delete selected lines (GRACE FEATURE!)
            if (e.key === 'Delete' || e.key === 'Backspace') {
                // Only if not focused in editable content
                if (e.target.classList.contains('line-content')) return;
                
                if (selectedLines.size > 0) {
                    e.preventDefault();
                    
                    // Sort in reverse order so deletion doesn't shift indices
                    const sortedIndices = Array.from(selectedLines).sort((a, b) => b - a);
                    
                    // Delete lines from bottom up
                    sortedIndices.forEach(idx => {
                        editorLines.splice(idx, 1);
                    });
                    
                    // Clear selection
                    selectedLines.clear();
                    
                    // Re-render editor
                    renderEditor(editorLines);
                    
                    const statusText = document.getElementById('status-text');
                    if (statusText) {
                        statusText.textContent = `💚 Deleted ${sortedIndices.length} line(s)`;
                        statusText.style.color = 'var(--success)';
                        setTimeout(() => {
                            statusText.textContent = 'Ready';
                            statusText.style.color = '';
                        }, 2000);
                    }
                    
                    console.log(`💚 Grace: Deleted ${sortedIndices.length} selected lines`);
                    return;
                }
            }
            
            // Cmd+Z or Ctrl+Z = Undo
            if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key === 'z') {
                e.preventDefault();
                if (history.position > 0) {
                    history.position--;
                    editorLines = [...history.stack[history.position]];
                    STATE.scenes[STATE.activeSceneIdx].lines = [...editorLines];
                    renderEditor(editorLines);
                    document.getElementById('status-text').textContent = `↶ Undo (${history.position + 1}/${history.stack.length})`;
                } else {
                    document.getElementById('status-text').textContent = 'Nothing to undo';
                }
                return;
            }
            
            // Cmd+Shift+Z or Ctrl+Shift+Z = Redo
            if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'z') {
                e.preventDefault();
                if (history.position < history.stack.length - 1) {
                    history.position++;
                    editorLines = [...history.stack[history.position]];
                    STATE.scenes[STATE.activeSceneIdx].lines = [...editorLines];
                    renderEditor(editorLines);
                    document.getElementById('status-text').textContent = `↷ Redo (${history.position + 1}/${history.stack.length})`;
                } else {
                    document.getElementById('status-text').textContent = 'Nothing to redo';
                }
                return;
            }
            
            // Ctrl+Shift+S = Screenshot
            if (e.ctrlKey && e.shiftKey && e.key === 'S') {
                e.preventDefault();
                captureScreenshot();
                return;
            }
            
            // Cmd+S or Ctrl+S = Trigger render (compile)
            if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                e.preventDefault();
                compile();
                return;
            }
            
            // Cmd+A or Ctrl+A = Select All
            if ((e.metaKey || e.ctrlKey) && e.key === 'a') {
                e.preventDefault();
                selectAllLines();
                return;
            }
            
            // Esc = Deselect All
            if (e.key === 'Escape' && selectedLines.size > 0) {
                e.preventDefault();
                deselectAllLines();
                return;
            }
            
            // Cmd+I or Ctrl+I = Invert Selection
            if ((e.metaKey || e.ctrlKey) && e.key === 'i') {
                e.preventDefault();
                invertSelection();
                return;
            }
            
            // Cmd+E or Ctrl+E = Batch Edit Numbers (when lines selected)
            if ((e.metaKey || e.ctrlKey) && e.key === 'e' && selectedLines.size > 0) {
                e.preventDefault();
                showBatchEditModal();
                return;
            }
            
            // Cmd+/ or Ctrl+/ = Toggle comments (turn sections on/off)
            if ((e.metaKey || e.ctrlKey) && e.key === '/' && selectedLines.size > 0) {
                e.preventDefault();
                toggleComments();
                return;
            }
        });
    }
    
    // 💚 TOGGLE COMMENTS - Turn sections on/off by commenting
    function toggleComments() {
        let commentedCount = 0;
        let uncommentedCount = 0;
        
        // Check if all selected lines are commented
        const allCommented = Array.from(selectedLines).every(idx => {
            return editorLines[idx].trim().startsWith('0 //');
        });
        
        selectedLines.forEach(idx => {
            const line = editorLines[idx];
            
            if (allCommented) {
                // Uncomment: Remove "0 // " prefix
                if (line.trim().startsWith('0 //')) {
                    editorLines[idx] = line.replace(/^(\s*)0 \/\/ /, '$1');
                    uncommentedCount++;
                }
            } else {
                // Comment: Add "0 // " prefix (unless already a comment line)
                if (!line.trim().startsWith('0 ')) {
                    editorLines[idx] = `0 // ${line}`;
                    commentedCount++;
                } else if (line.trim().startsWith('0 ') && !line.trim().startsWith('0 //')) {
                    // Convert regular comment to disabled comment
                    editorLines[idx] = line.replace(/^(\s*)0 /, '$10 // ');
                    commentedCount++;
                }
            }
        });
        
        renderEditor(editorLines);
        
        const statusText = document.getElementById('status-text');
        if (statusText) {
            if (allCommented) {
                statusText.textContent = `💚 Enabled ${uncommentedCount} line(s)`;
            } else {
                statusText.textContent = `💚 Disabled ${commentedCount} line(s)`;
            }
            statusText.style.color = 'var(--accent)';
            setTimeout(() => {
                statusText.textContent = 'Ready';
                statusText.style.color = '';
            }, 2000);
        }
        
        console.log(`💚 Toggle: ${allCommented ? 'Enabled' : 'Disabled'} ${selectedLines.size} lines`);
    }

    function exportSceneAsGLB() {
        const statusText = document.getElementById('status-text');
        const glbBtn = document.getElementById('glb-export-btn');
        try {
            if (typeof THREE === 'undefined' || !THREE.GLTFExporter) {
                console.warn('[GLB] THREE.GLTFExporter not available');
                if (statusText) statusText.textContent = 'GLB export not available';
                return;
            }
            if (!STATE.viewer) {
                console.warn('[GLB] Viewer not ready');
                if (statusText) statusText.textContent = 'GLB export failed';
                return;
            }

            // Prefer the underlying LDraw model root to avoid exporting helpers/grid
            const root = (STATE.viewer.getModel && STATE.viewer.getModel()) ||
                         STATE.viewer.modelRoot ||
                         STATE.viewer.modelWrapper ||
                         STATE.viewer.scene;
            if (!root) {
                console.warn('[GLB] No model to export');
                if (statusText) statusText.textContent = 'No model to export';
                return;
            }

            const exporter = new THREE.GLTFExporter();
            const sceneMeta = STATE.scenes[STATE.activeSceneIdx];
            const sceneName = sceneMeta ? sceneMeta.name : 'Scene';
            const safeName = sceneName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            const date = new Date();
            const dateStr = date.toISOString().split('T')[0];
            const timeStr = date.toTimeString().split(' ')[0].replace(/:/g, '-');
            const baseFilename = `grace_scene_${safeName}_${dateStr}_${timeStr}`;

            if (statusText) {
                statusText.textContent = 'Exporting GLB...';
                statusText.style.color = 'var(--accent)';
            }
            if (glbBtn) {
                glbBtn.disabled = true;
                glbBtn.textContent = '…';
            }

            exporter.parse(
                root,
                (gltf) => {
                    try {
                        let blob;
                        let filename;

                        // three@0.128: when { binary: true } is honored, gltf is an ArrayBuffer.
                        if (gltf instanceof ArrayBuffer) {
                            blob = new Blob([gltf], { type: 'model/gltf-binary' });
                            filename = `${baseFilename}.glb`;
                        } else {
                            // Fallback: JSON glTF object
                            const json = typeof gltf === 'string' ? gltf : JSON.stringify(gltf, null, 2);
                            blob = new Blob([json], { type: 'model/gltf+json' });
                            filename = `${baseFilename}.gltf`;
                        }

                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = filename;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                        // Also broadcast this GLB to the studio bus so shells like
                        // Shield-of-Achilles / MENTO can treat the exported scene
                        // as the "current Courage stage".
                        try {
                            if (typeof wagFrankPost === 'function') {
                                wagFrankPost({
                                    kind: 'courage-glb',
                                    source: 'wag-courage',
                                    glb_url: url,
                                    filename,
                                    scene: sceneName,
                                    timestamp: date.toISOString()
                                });
                            }
                        } catch (busErr) {
                            console.warn('[GLB] Failed to broadcast courage-glb on wag-frank', busErr);
                        }

                        // Build a manifest of LDraw part placements (like screenshot JSON)
                        try {
                            const partEntries = [];
                            if (Array.isArray(editorLines)) {
                                editorLines.forEach((line, idx) => {
                                    if (!line || typeof line !== 'string') return;
                                    const trimmed = line.trim();
                                    if (!trimmed.startsWith('1 ')) return; // Only part placement lines

                                    const pieces = trimmed.split(/\s+/);
                                    if (pieces.length < 15) return; // color + x y z + 3x3 matrix + filename

                                    const colorCode = parseInt(pieces[1], 10);
                                    const x = parseFloat(pieces[2]);
                                    const y = parseFloat(pieces[3]);
                                    const z = parseFloat(pieces[4]);
                                    const m = pieces.slice(5, 14).map((v) => parseFloat(v));
                                    const file = pieces[14];

                                    partEntries.push({
                                        lineIndex: idx,
                                        lineNumber: idx + 1,
                                        raw: line,
                                        colorCode: Number.isNaN(colorCode) ? null : colorCode,
                                        position: {
                                            x: Number.isNaN(x) ? null : x,
                                            y: Number.isNaN(y) ? null : y,
                                            z: Number.isNaN(z) ? null : z
                                        },
                                        matrix: m,
                                        filename: file
                                    });
                                });
                            }

                            const manifest = {
                                filename,
                                scene: sceneName,
                                date: dateStr,
                                time: timeStr,
                                timestamp: date.toISOString(),
                                line_count: Array.isArray(editorLines) ? editorLines.length : null,
                                part_count: partEntries.length,
                                camera: STATE.viewer && STATE.viewer.getCamera ? STATE.viewer.getCamera() : null,
                                stats: STATE.viewer && STATE.viewer.getStats ? STATE.viewer.getStats() : null,
                                parts: partEntries
                            };

                            const manifestBlob = new Blob([JSON.stringify(manifest, null, 2)], { type: 'application/json' });
                            const manifestURL = URL.createObjectURL(manifestBlob);
                            const manifestLink = document.createElement('a');
                            manifestLink.href = manifestURL;
                            manifestLink.download = `${baseFilename}_manifest.json`;
                            document.body.appendChild(manifestLink);
                            manifestLink.click();
                            document.body.removeChild(manifestLink);
                            URL.revokeObjectURL(manifestURL);
                        } catch (manifestErr) {
                            console.error('[GLB] Manifest generation failed', manifestErr);
                        }

                        console.log('[GLB] Exported', filename);
                        if (statusText) {
                            statusText.textContent = 'GLB exported';
                            statusText.style.color = 'var(--accent)';
                            setTimeout(() => {
                                statusText.textContent = 'Ready';
                                statusText.style.color = '';
                            }, 2000);
                        }
                    } catch (e) {
                        console.error('[GLB] Download failed', e);
                        if (statusText) {
                            statusText.textContent = 'GLB download failed';
                            statusText.style.color = '';
                        }
                    } finally {
                        if (glbBtn) {
                            glbBtn.disabled = false;
                            glbBtn.textContent = 'GLB';
                        }
                    }
                },
                { binary: true }
            );
        } catch (err) {
            console.error('[GLB] Export exception', err);
            if (statusText) {
                statusText.textContent = 'GLB export failed';
                statusText.style.color = '';
            }
            if (glbBtn) {
                glbBtn.disabled = false;
                glbBtn.textContent = 'GLB';
            }
        }
    }

    function computeStudSkeletonDiagnostic(nodes, lines) {
        if (!Array.isArray(nodes) || !Array.isArray(lines) || !nodes.length) {
            return null;
        }

        const parts = [];
        for (let idx = 0; idx < lines.length; idx++) {
            const raw = lines[idx];
            if (!raw || typeof raw !== 'string') continue;
            const trimmed = raw.trim();
            if (!trimmed || !trimmed.startsWith('1 ')) continue;
            const parsed = parseType1Line(raw);
            if (!parsed) continue;
            const px = typeof parsed.x === 'number' ? parsed.x : 0;
            const py = typeof parsed.y === 'number' ? parsed.y : 0;
            const pz = typeof parsed.z === 'number' ? parsed.z : 0;
            parts.push({ lineNum: idx, x: px, y: py, z: pz });
        }

        if (!parts.length) {
            return null;
        }

        const perLine = new Map();
        parts.forEach(p => {
            perLine.set(p.lineNum, { lineNum: p.lineNum, claimed: 0, nearest: 0 });
        });

        let total = 0;
        let withLineNum = 0;
        let withoutLineNum = 0;
        let withNearest = 0;
        let mismatches = 0;

        nodes.forEach(n => {
            const wx = typeof n.x === 'number' ? n.x : null;
            const wy = typeof n.y === 'number' ? n.y : null;
            const wz = typeof n.z === 'number' ? n.z : null;
            if (wx === null || wy === null || wz === null) return;

            total++;
            const assigned = typeof n.lineNum === 'number' ? n.lineNum : null;
            if (assigned !== null) withLineNum++; else withoutLineNum++;

            let bestLineNum = null;
            let bestDist2 = Infinity;
            for (let i = 0; i < parts.length; i++) {
                const p = parts[i];
                const dx = wx - p.x;
                const dy = wy - p.y;
                const dz = wz - p.z;
                const d2 = dx * dx + dy * dy + dz * dz;
                if (d2 < bestDist2) {
                    bestDist2 = d2;
                    bestLineNum = p.lineNum;
                }
            }

            if (bestLineNum !== null) {
                withNearest++;
                const nearestRow = perLine.get(bestLineNum) || { lineNum: bestLineNum, claimed: 0, nearest: 0 };
                nearestRow.nearest++;
                perLine.set(bestLineNum, nearestRow);
            }

            if (assigned !== null) {
                const claimRow = perLine.get(assigned) || { lineNum: assigned, claimed: 0, nearest: 0 };
                claimRow.claimed++;
                perLine.set(assigned, claimRow);
            }

            if (assigned !== null && bestLineNum !== null && assigned !== bestLineNum) {
                mismatches++;
            }
        });

        const linesSummary = Array.from(perLine.values());
        linesSummary.sort((a, b) => (b.claimed - a.claimed) || (b.nearest - a.nearest));

        const claimedHistogram = {};
        const nearestHistogram = {};
        linesSummary.forEach(entry => {
            if (entry.claimed) claimedHistogram[entry.lineNum] = entry.claimed;
            if (entry.nearest) nearestHistogram[entry.lineNum] = entry.nearest;
        });

        const claimedDistinctLines = Object.keys(claimedHistogram).length;
        const nearestDistinctLines = Object.keys(nearestHistogram).length;

        return {
            mpdLinesCount: parts.length,
            claimedDistinctLines,
            nearestDistinctLines,
            totalStudsConsidered: total,
            studsWithLineNum: withLineNum,
            studsWithoutLineNum: withoutLineNum,
            studsWithNearestPart: withNearest,
            lineBindingMismatchCount: mismatches,
            lineBindingMatchRatio: total > 0 ? (total - mismatches) / total : null,
            claimedHistogram,
            nearestHistogram,
            perLine: linesSummary
        };
    }

    function buildSkeletonPathologyReport(diag, totalStuds) {
        if (!diag || !diag.claimedHistogram || !diag.nearestHistogram || !totalStuds) {
            return null;
        }

        function topFromHistogram(hist) {
            let bestLine = null;
            let bestCount = 0;
            Object.keys(hist).forEach(k => {
                const ln = Number(k);
                const c = hist[k];
                if (c > bestCount) {
                    bestCount = c;
                    bestLine = ln;
                }
            });
            return { line: bestLine, count: bestCount };
        }

        const origTop = topFromHistogram(diag.claimedHistogram);
        const corrTop = topFromHistogram(diag.nearestHistogram);

        const origPct = origTop.count > 0 ? (origTop.count / totalStuds) * 100 : 0;
        const corrPct = corrTop.count > 0 ? (corrTop.count / totalStuds) * 100 : 0;

        let severity = 'HEALTHY';
        if (origPct >= 90) {
            severity = 'CRITICAL';
        } else if (origPct >= 70 || diag.claimedDistinctLines <= 2) {
            severity = 'WARNING';
        }

        return {
            detected_at: new Date().toISOString(),
            corrected_by: 'Courage Stud Skeleton Export v1.0',
            severity,
            original_distribution: {
                distinct_lines: diag.claimedDistinctLines,
                top_line: origTop.line,
                top_count: origTop.count,
                top_percentage: Number(origPct.toFixed(1)),
                histogram: diag.claimedHistogram
            },
            corrected_distribution: {
                distinct_lines: diag.nearestDistinctLines,
                top_line: corrTop.line,
                top_count: corrTop.count,
                top_percentage: Number(corrPct.toFixed(1)),
                histogram: diag.nearestHistogram
            },
            correction_method: 'spatial_proximity_3d_euclidean',
            correction_parameters: {
                algorithm: 'nearest_neighbor_by_world_position',
                distance_metric: 'euclidean_3d'
            },
            mpd_lines_count: diag.mpdLinesCount,
            part_lines_count: diag.mpdLinesCount,
            recommendation: 'Regenerate from source using per-line stud sampler (Courage v9+) for canonical skeleton'
        };
    }

    function captureScreenshot() {
        const statusText = document.getElementById('status-text');
        if (statusText) statusText.textContent = 'Capturing 4:3 shot...';
        
        try {
            // Get canvas from Prime engine viewer
            const canvas = document.querySelector('#viewer canvas');
            if (!canvas) {
                if (statusText) statusText.textContent = 'No canvas found';
                logError('Screenshot', new Error('Canvas element not found'));
                return;
            }
            
            // Force multiple render frames to ensure scene is drawn
            if (STATE.viewer && STATE.viewer.render) {
                STATE.viewer.render();
                STATE.viewer.render();
                STATE.viewer.render();
            }
            
            // Small delay to let rendering complete
            setTimeout(() => {
                captureScreenshotDelayed(canvas, statusText);
            }, 100);
        } catch (err) {
            console.error('Screenshot failed:', err);
            logError('Screenshot', err);
            if (statusText) statusText.textContent = 'Screenshot failed';
        }
    }
    
    function captureScreenshotDelayed(canvas, statusText) {
        try {
            // CRITICAL: Resize renderer to 4:3 BEFORE capturing (no stretching!)
            const targetWidth = 1600;
            const targetHeight = 1200; // 4:3 ratio
            let dataURL = null;
            
            if (STATE.viewer && STATE.viewer.renderer) {
                const renderer = STATE.viewer.renderer;
                const camera = STATE.viewer.camera;
                const scene = STATE.viewer.scene;
                
                console.log('[SCREENSHOT] Renderer:', renderer);
                console.log('[SCREENSHOT] Camera:', camera);
                console.log('[SCREENSHOT] Scene:', scene);
                
                // Store original size
                const origWidth = renderer.domElement.width;
                const origHeight = renderer.domElement.height;
                
                console.log('[SCREENSHOT] Original:', origWidth, 'x', origHeight);
                console.log('[SCREENSHOT] Resizing to native 4:3:', targetWidth, 'x', targetHeight);
                
                // Resize renderer to 4:3 aspect ratio
                renderer.setSize(targetWidth, targetHeight, false);
                camera.aspect = targetWidth / targetHeight;
                camera.updateProjectionMatrix();
                
                // Render at new 4:3 size - use the engine's render directly
                console.log('[SCREENSHOT] About to render...');
                renderer.render(scene, camera);
                console.log('[SCREENSHOT] Render complete');
                
                // Capture at NATIVE 4:3 resolution (no stretching!)
                console.log('[SCREENSHOT] Calling toDataURL...');
                dataURL = renderer.domElement.toDataURL('image/png');
                console.log('[SCREENSHOT] dataURL length:', dataURL ? dataURL.length : 'NULL');
                
                // Restore original size
                renderer.setSize(origWidth, origHeight, false);
                camera.aspect = origWidth / origHeight;
                camera.updateProjectionMatrix();
                renderer.render(scene, camera);
                
                console.log('[SCREENSHOT] ✅ Captured at native 4:3, restored to', origWidth, 'x', origHeight);
            }
            
            if (!dataURL) {
                throw new Error('Failed to capture screenshot - no dataURL generated');
            }
            
            // Create filename with date and scene name
            const scene = STATE.scenes[STATE.activeSceneIdx];
            const filename = scene.name.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            const date = new Date();
            const dateStr = date.toISOString().split('T')[0];
            const timeStr = date.toTimeString().split(' ')[0].replace(/:/g, '-');
            
            const baseFilename = `wag_gold_${filename}_${dateStr}_${timeStr}`;
            
            let studSkeletonSnapshot = null;
            let studSkeletonV2 = null;
            let skeletonDiagnostic = null;
            let skeletonPathology = null;
            if (Array.isArray(STATE.studSkeleton)) {
                const canonicalNodes = [];
                let hasTemplate = false;
                let hasSampled = false;
                STATE.studSkeleton.forEach(node => {
                    if (!node || !node.worldPos) return;
                    const src = typeof node.source === 'string' ? node.source : null;
                    if (src === 'template') hasTemplate = true;
                    if (src === 'sampled') hasSampled = true;
                    const base = {
                        x: node.worldPos.x,
                        y: node.worldPos.y,
                        z: node.worldPos.z,
                        layer: node.layer,
                        kind: node.kind,
                        lineNum: node.lineNum,
                        gridX: typeof node.gridX === 'number' ? node.gridX : null,
                        gridZ: typeof node.gridZ === 'number' ? node.gridZ : null,
                        partId: node.partId || null,
                        studIndex: typeof node.studIndex === 'number' ? node.studIndex : null,
                        local: (node.local && typeof node.local.x === 'number' && typeof node.local.y === 'number' && typeof node.local.z === 'number')
                            ? { x: node.local.x, y: node.local.y, z: node.local.z }
                            : null,
                        source: src || 'unknown',
                        studVersion: typeof node.studVersion === 'number' ? node.studVersion : 1
                    };
                    canonicalNodes.push(base);
                });
                if (canonicalNodes.length) {
                    skeletonDiagnostic = computeStudSkeletonDiagnostic(canonicalNodes, Array.isArray(editorLines) ? editorLines : []);
                    if (skeletonDiagnostic && skeletonDiagnostic.totalStudsConsidered > 0) {
                        skeletonPathology = buildSkeletonPathologyReport(skeletonDiagnostic, canonicalNodes.length);
                    }
                    if (skeletonPathology && skeletonPathology.severity === 'CRITICAL') {
                        console.warn('[STUD] Skeleton pathology CRITICAL; clearing stud skeleton for export');
                        studSkeletonV2 = null;
                        studSkeletonSnapshot = null;
                    } else {
                        let summarySource = 'unknown';
                        if (hasTemplate && hasSampled) summarySource = 'mixed';
                        else if (hasTemplate) summarySource = 'template';
                        else if (hasSampled) summarySource = 'sampled';
                        studSkeletonV2 = {
                            version: 1,
                            source: summarySource,
                            nodes: canonicalNodes
                        };
                        studSkeletonSnapshot = canonicalNodes.map(n => {
                            const snap = {
                                x: n.x,
                                y: n.y,
                                z: n.z,
                                layer: n.layer,
                                kind: n.kind,
                                lineNum: n.lineNum
                            };
                            if (typeof n.gridX === 'number') snap.gridX = n.gridX;
                            if (typeof n.gridZ === 'number') snap.gridZ = n.gridZ;
                            if (n.partId) snap.partId = n.partId;
                            if (typeof n.studIndex === 'number') snap.studIndex = n.studIndex;
                            if (n.local && typeof n.local.x === 'number' && typeof n.local.y === 'number' && typeof n.local.z === 'number') {
                                snap.local = { x: n.local.x, y: n.local.y, z: n.local.z };
                            }
                            return snap;
                        });
                    }
                }
            }

            let partSkeletonSnapshot = null;
            if (STATE.partSkeletonLibrary && typeof STATE.partSkeletonLibrary === 'object') {
                partSkeletonSnapshot = {};
                Object.keys(STATE.partSkeletonLibrary).forEach(key => {
                    const entry = STATE.partSkeletonLibrary[key];
                    if (!entry || !Array.isArray(entry.studs)) return;
                    partSkeletonSnapshot[key] = {
                        partId: entry.partId || key,
                        studs: entry.studs.map(s => ({
                            x: s.x,
                            y: s.y,
                            z: s.z,
                            role: s.role || 'stud'
                        }))
                    };
                });
            }

            const groundViolationsSnapshot = Array.isArray(STATE.groundViolationSummary)
                ? STATE.groundViolationSummary.map(v => ({
                      lineNum: v.lineNum,
                      count: v.count,
                      partId: v.partId,
                      y: v.y
                  }))
                : null;

            // Create JSON metadata
            const metadata = {
                filename: `${baseFilename}.png`,
                scene: scene.name,
                date: dateStr,
                time: timeStr,
                timestamp: date.toISOString(),
                aspect_ratio: '4:3',
                resolution: `${targetWidth}x${targetHeight}`,
                line_count: editorLines.length,
                locked_lines: Array.from(scene.lockedLines),
                theme: document.documentElement.getAttribute('data-theme') || 'dark',
                diagnostics: STATE.diagnostics,
                camera: STATE.viewer.getCamera ? STATE.viewer.getCamera() : null,
                errors: ERROR_LOG.length,
                mpd_content: editorLines.join('\n'),
                stud_skeleton: studSkeletonSnapshot,
                stud_skeleton_v2: studSkeletonV2,
                grid_spec: {
                    cellLDU: 20,
                    layerHeightLDU: 8,
                    origin: { x: 0, y: 0, z: 0 },
                    axis: {
                        right: 'x',
                        up: 'y',
                        forward: '-z'
                    }
                },
                ground_violations: groundViolationsSnapshot,
                part_skeletons: partSkeletonSnapshot
            };

            // Optional per-line stud map, compatible with WERE/Master: metadata.lines[].studs
            try {
                if (studSkeletonV2 && Array.isArray(studSkeletonV2.nodes) && Array.isArray(editorLines)) {
                    const byLine = new Map();

                    studSkeletonV2.nodes.forEach(n => {
                        if (!n) return;
                        const ln = typeof n.lineNum === 'number' ? n.lineNum : null;
                        if (ln == null || ln < 0 || ln >= editorLines.length) return;

                        let entry = byLine.get(ln);
                        if (!entry) {
                            const raw = editorLines[ln] || '';
                            let partId = n.partId || null;
                            let color = null;
                            const trimmed = raw.trim();
                            if (trimmed.startsWith('1 ')) {
                                const tokens = trimmed.split(/\s+/);
                                if (tokens.length > 1) {
                                    const colCode = parseInt(tokens[1], 10);
                                    if (!Number.isNaN(colCode)) {
                                        color = colCode;
                                    }
                                }
                                if (!partId && tokens.length > 14) {
                                    partId = tokens[tokens.length - 1];
                                }
                            }

                            entry = {
                                lineNum: ln,
                                raw,
                                partId,
                                color,
                                studs: []
                            };
                            byLine.set(ln, entry);
                        }

                        entry.studs.push({
                            x: n.x,
                            y: n.y,
                            z: n.z,
                            layer: n.layer,
                            gridX: typeof n.gridX === 'number' ? n.gridX : undefined,
                            gridZ: typeof n.gridZ === 'number' ? n.gridZ : undefined
                        });
                    });

                    if (byLine.size) {
                        metadata.lines = Array.from(byLine.values());
                    }
                }
            } catch (e) {
                console.warn('[COURAGE] Failed to build per-line stud map for GOLD metadata', e);
            }

            if (skeletonPathology) {
                metadata._skeleton_pathology_report = skeletonPathology;
            }

            // Wolf bus: if hosted in a studio, broadcast GOLD snapshot to parent
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        type: 'courage-gold-snapshot',
                        payload: metadata
                    }, '*');
                }
            } catch (err) {
                console.warn('[COURAGE] failed to post courage-gold-snapshot', err);
            }
            
            // Download PNG
            const imgLink = document.createElement('a');
            imgLink.href = dataURL;
            imgLink.download = `${baseFilename}.png`;
            imgLink.click();
            
            // Download JSON
            const jsonBlob = new Blob([JSON.stringify(metadata, null, 2)], { type: 'application/json' });
            const jsonURL = URL.createObjectURL(jsonBlob);
            const jsonLink = document.createElement('a');
            jsonLink.href = jsonURL;
            jsonLink.download = `${baseFilename}.json`;
            jsonLink.click();
            URL.revokeObjectURL(jsonURL);
            
            if (statusText) {
                statusText.textContent = '📸 Screenshot + JSON saved!';
                setTimeout(() => statusText.textContent = 'Ready', 2000);
            }
        } catch (err) {
            console.error('Screenshot delayed failed:', err);
            logError('Screenshot', err);
            if (statusText) statusText.textContent = 'Screenshot failed';
        }
    }

    function switchScene(idx) {
        idx = parseInt(idx);
        if (idx === STATE.activeSceneIdx) return;
        
        // Save current scene (get current lines from editor)
        STATE.scenes[STATE.activeSceneIdx].lines = [...editorLines];
        
        // Load new scene
        STATE.activeSceneIdx = idx;
        const scene = STATE.scenes[idx];
        editorLines = [...scene.lines];
        renderEditor(editorLines);
        
        // Update UI
        updateSceneSelector();
        renderSceneDots();
        document.getElementById('status-text').textContent = `Switched to ${scene.name}`;
    }
    
    function closeScene(idx) {
        if (STATE.scenes.length === 1) {
            document.getElementById('status-text').textContent = 'Cannot close last scene';
            return;
        }
        
        STATE.scenes.splice(idx, 1);
        if (STATE.activeSceneIdx >= STATE.scenes.length) {
            STATE.activeSceneIdx = STATE.scenes.length - 1;
        }
        if (idx <= STATE.activeSceneIdx && STATE.activeSceneIdx > 0) {
            STATE.activeSceneIdx--;
        }
        
        switchScene(STATE.activeSceneIdx);
    }

    function showSceneContextMenu(x, y) {
        // Simple prompt-based for now
        const action = prompt('Scene Actions:\n1. New Scene\n2. Rename Scene\n3. Delete Scene (if >1)\n\nEnter 1, 2, or 3:');
        
        if (action === '1') {
            const newScene = createScene(`Scene ${STATE.scenes.length + 1}`);

    function filterModels(query) {
        const q = query.trim().toLowerCase();
        if (!q) {
            WAG.filtered = [...WAG.models];
        } else {
            WAG.filtered = WAG.models.filter(model => {
                const hay = `${model.filename} ${model.name || ''} ${model.description || ''}`.toLowerCase();
                return hay.includes(q);
            });
        }
        renderModelList();
        updateStats(q);

    function renderModelList() {
        const list = document.getElementById('model-list');
        list.innerHTML = '';
        if (!WAG.filtered.length) {
            list.innerHTML = '<div class="empty-state">No models match.</div>';
            return;
        }
        WAG.filtered.forEach((model, idx) => {
            const item = document.createElement('div');
            item.className = 'model-item';
            if (idx === WAG.lastSelectedIdx) item.classList.add('active');
            item.innerHTML = `<div class="model-title">${model.name || model.filename}</div>
                              <div class="model-meta">${model.filename} • ${formatBytes(model.size)}</div>`;
            item.addEventListener('click', () => {

                item.classList.add('active');

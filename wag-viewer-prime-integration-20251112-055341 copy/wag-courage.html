    function drawRedBullPatchOverlay() {
        if (!STATE || !STATE.viewer || !STATE.viewer.scene || !window.THREE) {
            console.warn('[RED-BULL] Viewer/scene missing; cannot draw patch overlay');
            return;
        }

        const scene = STATE.viewer.scene;
        if (STATE.redBullPatchGroup && STATE.redBullPatchGroup.parent) {
            STATE.redBullPatchGroup.parent.remove(STATE.redBullPatchGroup);
        }

        const skeleton = STATE.redBullSkeleton;
        if (!skeleton || !Array.isArray(skeleton.nodes) || !skeleton.nodes.length) {
            console.warn('[RED-BULL] No redBullSkeleton nodes available for patch overlay');
            STATE.redBullPatchGroup = null;
            return;
        }

        const timeByLine = new Map();
        if (typeof window !== 'undefined' && Array.isArray(window.redBullEvents)) {
            window.redBullEvents.forEach(ev => {
                if (!ev || typeof ev.lineIndex !== 'number') return;
                const lineIndex = ev.lineIndex;
                const t = typeof ev.tRel === 'number' ? ev.tRel : (typeof ev.tAbs === 'number' ? ev.tAbs : null);
                if (t == null) return;
                const prev = timeByLine.get(lineIndex);
                if (prev == null || t < prev) {
                    timeByLine.set(lineIndex, t);
                }
            });
        }

        const nodes = skeleton.nodes;
        let minX = Infinity, maxX = -Infinity;
        let minY = Infinity, maxY = -Infinity;
        let minZ = Infinity, maxZ = -Infinity;

        nodes.forEach(node => {
            if (!node) return;
            const x = typeof node.x === 'number' ? node.x : (node.worldPos && typeof node.worldPos.x === 'number' ? node.worldPos.x : null);
            const y = typeof node.y === 'number' ? node.y : (node.worldPos && typeof node.worldPos.y === 'number' ? node.worldPos.y : null);
            const z = typeof node.z === 'number' ? node.z : (node.worldPos && typeof node.worldPos.z === 'number' ? node.worldPos.z : null);
            if (x == null || y == null || z == null) return;
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
            if (z < minZ) minZ = z;
            if (z > maxZ) maxZ = z;
        });

        if (!isFinite(minX) || !isFinite(maxX) || !isFinite(minZ) || !isFinite(maxZ)) {
            console.warn('[RED-BULL] Invalid bounds for patch overlay');
            STATE.redBullPatchGroup = null;
            return;
        }

        const cellsX = 12;
        const cellsZ = 12;
        const rangeX = maxX - minX || 1;
        const rangeZ = maxZ - minZ || 1;
        const cellSizeX = rangeX / cellsX;
        const cellSizeZ = rangeZ / cellsZ;

        const patchMap = new Map();

        nodes.forEach(node => {
            if (!node) return;
            const x = typeof node.x === 'number' ? node.x : (node.worldPos && typeof node.worldPos.x === 'number' ? node.worldPos.x : null);
            const y = typeof node.y === 'number' ? node.y : (node.worldPos && typeof node.worldPos.y === 'number' ? node.worldPos.y : null);
            const z = typeof node.z === 'number' ? node.z : (node.worldPos && typeof node.worldPos.z === 'number' ? node.worldPos.z : null);
            if (x == null || y == null || z == null) return;
            const ln = typeof node.lineNum === 'number' ? node.lineNum : null;
            const t = ln != null ? (timeByLine.get(ln) || null) : null;
            const ux = (x - minX) / rangeX;
            const uz = (z - minZ) / rangeZ;
            let ix = Math.floor(ux * cellsX);
            let iz = Math.floor(uz * cellsZ);
            if (ix < 0) ix = 0;
            if (ix >= cellsX) ix = cellsX - 1;
            if (iz < 0) iz = 0;
            if (iz >= cellsZ) iz = cellsZ - 1;
            const key = ix + ',' + iz;
            let patch = patchMap.get(key);
            if (!patch) {
                patch = {
                    ix,
                    iz,
                    minX: x,
                    maxX: x,
                    minY: y,
                    maxY: y,
                    minZ: z,
                    maxZ: z,
                    tMin: t,
                    tMax: t,
                    count: 0
                };
                patchMap.set(key, patch);
            } else {
                if (x < patch.minX) patch.minX = x;
                if (x > patch.maxX) patch.maxX = x;
                if (y < patch.minY) patch.minY = y;
                if (y > patch.maxY) patch.maxY = y;
                if (z < patch.minZ) patch.minZ = z;
                if (z > patch.maxZ) patch.maxZ = z;
                if (t != null) {
                    if (patch.tMin == null || t < patch.tMin) patch.tMin = t;
                    if (patch.tMax == null || t > patch.tMax) patch.tMax = t;
                }
            }
            patch.count++;
        });

        if (!patchMap.size) {
            console.warn('[RED-BULL] No patches populated for patch overlay');
            STATE.redBullPatchGroup = null;
            return;
        }

        let globalTMin = Infinity;
        let globalTMax = -Infinity;
        patchMap.forEach(p => {
            if (p.tMin == null || p.tMax == null) return;
            if (p.tMin < globalTMin) globalTMin = p.tMin;
            if (p.tMax > globalTMax) globalTMax = p.tMax;
        });

        if (!isFinite(globalTMin) || !isFinite(globalTMax) || globalTMax === globalTMin) {
            globalTMin = 0;
            globalTMax = 1;
        }

        const group = new THREE.Group();
        group.name = 'RedBullPatchOverlay';

        patchMap.forEach(p => {
            if (!p.count) return;
            const tMid = p.tMin != null && p.tMax != null ? (p.tMin + p.tMax) / 2 : globalTMin;
            const norm = (tMid - globalTMin) / (globalTMax - globalTMin);
            const color = new THREE.Color();
            color.setHSL(0.6 * (1 - norm), 1.0, 0.5);

            const width = Math.max(p.maxX - p.minX, cellSizeX * 0.5);
            const depth = Math.max(p.maxZ - p.minZ, cellSizeZ * 0.5);
            const height = Math.max(p.maxY - p.minY, 16);
            const geom = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.25,
                depthTest: true,
                depthWrite: false
            });
            const mesh = new THREE.Mesh(geom, mat);
            const cx = (p.minX + p.maxX) / 2;
            const cy = p.minY + height / 2;
            const cz = (p.minZ + p.maxZ) / 2;
            mesh.position.set(cx, cy, cz);
            mesh.userData = mesh.userData || {};
            mesh.userData.count = p.count;
            mesh.userData.tMin = p.tMin;
            mesh.userData.tMax = p.tMax;
            group.add(mesh);
        });

        scene.add(group);
        STATE.redBullPatchGroup = group;
        console.log('[RED-BULL] Patch overlay drawn. Patches:', patchMap.size);
    }

    function buildPartControlSkeleton() {
        if (!Array.isArray(editorLines) || !editorLines.length) {
            STATE.partControlSkeleton = [];
            return;
        }
        const filterId = (STATE && STATE.partControlFilterPartId)
            ? String(STATE.partControlFilterPartId).trim().toLowerCase()
            : '';
        const nodes = [];
        for (let idx = 0; idx < editorLines.length; idx++) {
            const line = editorLines[idx];
            const trimmed = line && line.trim();
            if (!trimmed || !trimmed.startsWith('1 ')) continue;
            const parsed = parseType1Line(line);
            if (!parsed) continue;
            if (filterId && parsed.partId && parsed.partId.toLowerCase() !== filterId) continue;
            nodes.push({
                kind: 'part',
                lineNum: idx,
                partId: parsed.partId,
                color: parsed.color,
                worldPos: { x: parsed.x, y: parsed.y, z: parsed.z }
            });
        }
        STATE.partControlSkeleton = nodes;
        console.log('[PART] Built part control skeleton nodes:', nodes.length, filterId ? `(filtered by ${filterId})` : '');
    }

    function runPartControlSkeletonSelfTest() {
        const result = {
            expectedNodes: 0,
            builtNodes: 0,
            overlayDots: 0,
            errors: []
        };

        if (!Array.isArray(editorLines) || !editorLines.length) {
            result.errors.push('No editorLines loaded');
            console.warn('[PART-TEST] No MPD lines; load a model first.', result);
            return result;
        }

        // Rebuild part-control skeleton using current editorLines + filter
        buildPartControlSkeleton();
        const nodes = Array.isArray(STATE.partControlSkeleton) ? STATE.partControlSkeleton : [];
        result.builtNodes = nodes.length;

        // Count how many type-1 lines would be tracked by buildPartControlSkeleton
        const filterId = (STATE && STATE.partControlFilterPartId)
            ? String(STATE.partControlFilterPartId).trim().toLowerCase()
            : '';
        let expected = 0;
        for (let idx = 0; idx < editorLines.length; idx++) {
            const raw = editorLines[idx];
            const trimmed = raw && raw.trim();
            if (!trimmed || !trimmed.startsWith('1 ')) continue;
            const parsed = parseType1Line(raw);
            if (!parsed) continue;
            if (filterId && parsed.partId && parsed.partId.toLowerCase() !== filterId) continue;
            expected++;
        }
        result.expectedNodes = expected;
        if (expected !== nodes.length) {
            result.errors.push(`Expected ${expected} part-control nodes, but built ${nodes.length}`);
        }

        // Basic per-node checks: lineNum range + worldPos vs parsed x/y/z
        nodes.forEach(node => {
            if (typeof node.lineNum !== 'number' || node.lineNum < 0 || node.lineNum >= editorLines.length) {
                result.errors.push(`Node with invalid lineNum: ${node.lineNum}`);
                return;
            }
            const raw = editorLines[node.lineNum];
            const parsed = parseType1Line(raw);
            if (!parsed) {
                result.errors.push(`Node at line ${node.lineNum} does not map to a valid type-1 line`);
                return;
            }
            if (Math.round(parsed.x) !== Math.round(node.worldPos.x) ||
                Math.round(parsed.y) !== Math.round(node.worldPos.y) ||
                Math.round(parsed.z) !== Math.round(node.worldPos.z)) {
                result.errors.push(`WorldPos mismatch at line ${node.lineNum}: parsed=(${parsed.x},${parsed.y},${parsed.z}), node=(${node.worldPos.x},${node.worldPos.y},${node.worldPos.z})`);
            }
        });

        // Draw overlay and compare mesh count to nodes length
        // Temporarily enable overlay for test
        const wasEnabled = STATE.diagnostics.partControlOverlay;
        STATE.diagnostics.partControlOverlay = true;
        drawPartControlOverlay();
        const group = STATE.partControlGroup;
        
        // Restore previous state and clean up if it was disabled
        STATE.diagnostics.partControlOverlay = wasEnabled;
        if (!wasEnabled) {
            drawPartControlOverlay(); // This will remove the overlay since toggle is off
        }
        
        const overlayCount = group && Array.isArray(group.children) ? group.children.length : 0;
        result.overlayDots = overlayCount;
        if (overlayCount !== nodes.length) {
            result.errors.push(`Overlay has ${overlayCount} meshes but skeleton has ${nodes.length} nodes`);
        }

        if (!result.errors.length) {
            console.log('[PART-TEST] PASS — part control skeleton is 1:1 with tracked type-1 lines.', result);
        } else {
            console.warn('[PART-TEST] FAIL — see errors for details.', result);
        }
        return result;
    }

    async function loadManifest() {
        try {
            const response = await fetch('./root-models-manifest.json');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const manifest = await response.json();
            WAG.manifest = manifest;
            const files = manifest.files || [];
            const included = [];
            const quarantined = [];
            files.forEach(file => {
                if (!shouldIncludeModel(file)) return;
                if (isQuarantined(file)) {
                    quarantined.push(file);
                } else {
                    included.push(file);
                }
            });
            WAG.models = included.sort((a, b) => (a.filename || '').localeCompare(b.filename || '', undefined, { sensitivity: 'base' }));
            WAG.quarantinedFiles = quarantined;
            WAG.filtered = [...WAG.models];
            updateStats();
            if (!WAG.models.length) {
                document.getElementById('model-list').innerHTML = '<div class="empty-state">No models found. Run <code>node generate-root-models-manifest.js</code>.</div>';
            }
        } catch (err) {
            console.error('Failed to load manifest', err);
            document.getElementById('stats').textContent = 'Manifest missing - run generator script';
            document.getElementById('model-list').innerHTML = '<div class="empty-state">Cannot fetch root-models-manifest.json</div>';
        }
    }

    function buildLibraryFileMap(manifest) {
        const map = {};
        if (!manifest || !manifest.categories) return map;
        manifest.categories.forEach(category => {
            const basePath = category.path || '';
            (category.files || []).forEach(file => {
                const filename = file.filename || '';
                if (!filename) return;
                const relPathRaw = file.relativePath || file.path || `${basePath}/${filename}`;
                const relPath = normalizeRelativePath(relPathRaw);
                const normalized = normalizeLibraryTarget(relPath);
                registerPathVariants(map, relPath, normalized);
            });
        });
        return map;
    }

    function normalizeRelativePath(path) {
        if (!path) return '';
        return path.replace(/\\/g, '/').replace(/^(\.\/|\.\\)/, '').replace(/^\/+/, '');
    }

    function normalizeLibraryTarget(path) {
        if (!path) return '';
        return path
            .replace(/\\/g, '/')
            .replace(/^(\.\/)+/, '')
            .replace(/^ldraw\//, '')
            .replace(/\/{2,}/g, '/');
    }

    function registerPathVariants(map, relPath, normalizedPath) {
        if (!normalizedPath) return;
        const keys = new Set();
        const clean = relPath;
        const lower = clean.toLowerCase();
        const normalizedLower = normalizedPath.toLowerCase();
        keys.add(clean);
        keys.add(lower);
        keys.add(normalizedPath);
        keys.add(normalizedLower);
        if (clean.startsWith('ldraw/')) {
            const withoutPrefix = clean.replace(/^ldraw\//, '');
            keys.add(withoutPrefix);
            keys.add(withoutPrefix.toLowerCase());
        } else {
            keys.add(`ldraw/${clean}`);
            keys.add(`ldraw/${clean}`.toLowerCase());
        }
        keys.add(`./${clean}`);
        keys.add(`./${clean}`.toLowerCase());
        keys.add(`../${clean}`);
        keys.add(`../${clean}`.toLowerCase());
        if (clean.startsWith('parts/')) {
            const withoutParts = clean.substring(6);
            keys.add(withoutParts);
            keys.add(withoutParts.toLowerCase());
            keys.add(`./${withoutParts}`);
            keys.add(`./${withoutParts}`.toLowerCase());
            keys.add(`../${withoutParts}`);
            keys.add(`../${withoutParts}`.toLowerCase());
            keys.add(`ldraw/${withoutParts}`);
            keys.add(`ldraw/${withoutParts}`.toLowerCase());
        }
        if (clean.startsWith('p/')) {
            const withoutPrimitive = clean.substring(2);
            keys.add(withoutPrimitive);
            keys.add(withoutPrimitive.toLowerCase());
            keys.add(`./${withoutPrimitive}`);
            keys.add(`./${withoutPrimitive}`.toLowerCase());
            keys.add(`../${withoutPrimitive}`);
            keys.add(`../${withoutPrimitive}`.toLowerCase());
            keys.add(`ldraw/${withoutPrimitive}`);
            keys.add(`ldraw/${withoutPrimitive}`.toLowerCase());
        }
        const basename = clean.substring(clean.lastIndexOf('/') + 1);
        keys.add(basename);
        keys.add(basename.toLowerCase());
        keys.forEach(key => {
            if (!key) return;
            const normalizedKey = key.replace(/\\/g, '/').replace(/\/{2,}/g, '/');
            if (normalizedKey && !map[normalizedKey]) {
                map[normalizedKey] = normalizedPath;
            }
        });
    }

    function lookupLibraryPath(rawPath, filename) {
        if (!STATE.libraryFileMap) return null;
        const attempts = [rawPath, rawPath?.toLowerCase(), filename, filename?.toLowerCase()];
        for (const key of attempts) {
            if (key && STATE.libraryFileMap[key]) {
                return STATE.libraryFileMap[key];
            }
        }
        return null;
    }

    function buildCandidatePaths(model) {
        const set = new Set();
        const raw = normalizeRelativePath(model.path || model.filename || '');
        const libraryMatch = lookupLibraryPath(raw, model.filename);
        const add = path => {
            if (!path) return;
            const normalized = normalizeRelativePath(path);
            if (normalized) set.add(normalized);
        };
        const addRoot = path => {
            if (!path) return;
            add(`${ROOT_PREFIX_FROM_LIBRARY}${normalizeRelativePath(path)}`);
        };
        if (libraryMatch) add(libraryMatch);
        add(model.path);
        add(raw);
        if (model.filename) add(model.filename);
        addRoot(model.path);
        addRoot(raw);
        if (model.filename) addRoot(model.filename);
        return Array.from(set).filter(Boolean);
    }

    function shouldIncludeModel(file) {
        const filename = (file.filename || '').trim().toLowerCase();
        const extension = filename.includes('.') ? filename.substring(filename.lastIndexOf('.')) : '';
        if (AI_FILE_PATTERN.test(filename)) return true;
        if (extension === '.mpd') return true;
        const name = (file.name || '').toLowerCase();
        if (name.startsWith('ai ') || name.includes('generated')) return true;
        const description = (file.description || '').toLowerCase();
        return description.includes('ai ') || description.includes('generated');
    }

    function isQuarantined(file) {
        if (!file || !file.filename || !WAG.quarantineSet) return false;
        return WAG.quarantineSet.has(file.filename.trim().toLowerCase());
    }

        // 📷 CAMERA PRESETS - Stable, invariant views for thinking & documentation
        // These provide fixed orthographic-style views that don't cause motion sickness
        function setCameraPreset(preset) {
            if (!STATE.viewer || !STATE.viewer.camera || !STATE.viewer.controls) {
                console.warn('[CAM] Viewer not ready');
                return;
            }
            
            const camera = STATE.viewer.camera;
            const controls = STATE.viewer.controls;
            
            // Get model bounds for proper framing
            let center = new THREE.Vector3(0, -50, 0);
            let distance = 400;
            
            if (STATE.viewer.scene) {
                const box = new THREE.Box3().setFromObject(STATE.viewer.scene);
                if (!box.isEmpty()) {
                    box.getCenter(center);
                    const size = box.getSize(new THREE.Vector3());
                    distance = Math.max(size.x, size.y, size.z) * 2;
                }
            }
            
            // Disable auto-spin for stable views
            STATE.autoSpin = false;
            if (STATE.viewer.setAutoSpin) STATE.viewer.setAutoSpin(false);
            const spinBtn = document.getElementById('spin-quick');
            if (spinBtn) spinBtn.classList.remove('active');
            
            switch (preset) {
                case 'front':
                    // Front view - looking at -Z face
                    camera.position.set(center.x, center.y, center.z + distance);
                    controls.target.copy(center);
                    break;
                    
                case 'top':
                    // Top-down view - bird's eye
                    camera.position.set(center.x, center.y + distance, center.z);
                    controls.target.copy(center);
                    camera.up.set(0, 0, -1); // Z points "up" on screen
                    break;
                    
                case 'right':
                    // Right side view - looking at -X face
                    camera.position.set(center.x + distance, center.y, center.z);
                    controls.target.copy(center);
                    break;
                    
                case 'iso':
                    // Isometric 45° view - classic stable angle
                    const isoAngle = Math.PI / 4; // 45 degrees
                    const isoHeight = Math.sin(Math.PI / 6) * distance; // 30° elevation
                    const isoRadius = Math.cos(Math.PI / 6) * distance;
                    camera.position.set(
                        center.x + isoRadius * Math.cos(isoAngle),
                        center.y + isoHeight,
                        center.z + isoRadius * Math.sin(isoAngle)
                    );
                    controls.target.copy(center);
                    camera.up.set(0, 1, 0);
                    break;
            }
            
            camera.lookAt(controls.target);
            controls.update();
            
            // Update status
            const names = { front: 'Front', top: 'Top', right: 'Right', iso: 'Isometric' };
            document.getElementById('status-text').textContent = `📷 ${names[preset]} view`;
            
            // Highlight active preset button
            document.querySelectorAll('.cam-preset').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`cam-${preset}`).classList.add('active');
        }

        const TAXO_PRIMITIVE_THRESHOLD = 30;

        const forEachTaxonomyPart = (node, cb) => {
            if (!node) return;
            if (Array.isArray(node)) {
                for (let i = 0; i < node.length; i++) {
                    const item = node[i];
                    if (item && typeof item === 'object') {
                        if (item.filename && item.description) cb(item);
                        forEachTaxonomyPart(item, cb);
                    }
                }
            } else if (typeof node === 'object') {
                const values = Object.values(node);
                for (let i = 0; i < values.length; i++) {
                    forEachTaxonomyPart(values[i], cb);
                }
            }
        };

        const extractTaxonomyHeadPhrase = (description) => {
            if (!description) return null;
            let desc = description.trim();
            if (!desc) return null;
            const firstChar = desc.charAt(0);
            if (firstChar === '~' || firstChar === '=') return null;
            desc = desc.toLowerCase();
            const m = desc.match(/^[^0-9,.;()]+/);
            if (!m) return null;
            let head = m[0].trim().replace(/\s+/g, ' ');
            if (!head) return null;
            return head;
        };

        const tagTaxonomyPrimitiveDomain = (head) => {
            if (!head) return 'misc';
            if (/wheel|tyre/.test(head)) return 'vehicle';
            if (/windscreen|windshield/.test(head)) return 'vehicle';
            if (/boat hull/.test(head)) return 'vehicle-ship';
            if (/train base|train /.test(head)) return 'vehicle-train';
            if (/fuselage|wing |propeller|jet engine|cockpit/.test(head)) return 'vehicle-air';
            if (/door |window |panel |wall |roof|arch /.test(head)) return 'architecture';
            if (/tree |plant |leaf |bush|palm /.test(head)) return 'environment';
            if (/technic|gear |axle |beam |liftarm|engine /.test(head)) return 'technic';
            return 'misc';
        };

        const analyzeTaxonomyPrimitives = (taxonomy) => {
            if (!taxonomy || !taxonomy.kingdoms) return;
            const freq = {};
            let total = 0;

            forEachTaxonomyPart(taxonomy.kingdoms, (part) => {
                const head = extractTaxonomyHeadPhrase(part.description);
                if (!head) return;
                freq[head] = (freq[head] || 0) + 1;
                total++;
            });

            const entries = Object.entries(freq)
                .map(([head, count]) => ({ head, count, domain: tagTaxonomyPrimitiveDomain(head) }))
                .sort((a, b) => b.count - a.count);

            const primitives = entries.filter(e => e.count >= TAXO_PRIMITIVE_THRESHOLD);

            const bucketSuggestions = primitives.reduce((acc, p) => {
                if (!acc[p.domain]) acc[p.domain] = [];
                acc[p.domain].push(p);
                return acc;
            }, {});

            Object.keys(bucketSuggestions).forEach(domain => {
                bucketSuggestions[domain] = bucketSuggestions[domain].slice(0, 12);
            });

            console.log('Grace taxonomy primitive analysis:', {
                totalPartsVisited: total,
                primitiveThreshold: TAXO_PRIMITIVE_THRESHOLD,
                topPrimitives: primitives.slice(0, 50)
            });
            console.log('Grace taxonomy suggested primitive buckets:', bucketSuggestions);
        };

                    } else if (label === 'WALL') {
                        x = 0; y = 80; z = -120;
                    } else if (label === 'DOOR') {
                        x = 0; y = 40; z = -119;
                    } else if (label === 'WINDOW') {
                        x = 60; y = 60; z = -119;
                    } else if (label === 'ROOF') {
                        x = 0; y = 160; z = 0;
                    } else if (label === 'TREE') {
                        x = -160 + idx * 40; y = 0; z = 120;
                    } else if (label === 'PROP') {
                        x = -80 + idx * 40; y = 0; z = 40;
                    }
                    const color = part.colorCode ?? part.color ?? 16;
                    let filename = part.filename || part.path || '';
                    if (filename && !filename.startsWith('parts/')) {
                        filename = `parts/${filename}`;
                    }
                    lines.push(`0 // ${label} - ${part.description || filename}`);
                    lines.push(`1 ${color} ${x} ${y} ${z} 1 0 0 0 1 0 0 0 1 ${filename}`);
                    lines.push('');
                });

                lines.push('0 STEP');
                return lines;
            }

            function loadLocation(lines, name, replace = true) {
                if (replace) {
                    editorLines = [...lines];
                } else {
                    const insertIdx = editorLines.lastIndexOf('0 STEP');
                    const offsetZ = (() => {
                        const matches = editorLines.filter((line) => line.startsWith('1 '));
                        let maxZ = 0;
                        matches.forEach((line) => {
                            const parts = line.trim().split(/\s+/);
                            const z = parseFloat(parts[5]);
                            if (!Number.isNaN(z)) {
                                maxZ = Math.max(maxZ, z);
                            }
                        });
                        return maxZ + 320;
                    })();
                    const shifted = lines.map((line) => {
                        if (!line.startsWith('1 ')) return line;
                        const segments = line.trim().split(/\s+/);
                        const z = parseFloat(segments[5]);
                        if (!Number.isNaN(z)) {
                            segments[5] = (z + offsetZ).toString();
                            return segments.join(' ');
                        }
                        return line;
                    });
                    if (insertIdx >= 0) {
                        editorLines.splice(insertIdx, 0, `0 // Added Location ${name}`, ...shifted, '');
                    } else {
                        editorLines.push(`0 // Added Location ${name}`, ...shifted, '');
                    }
                }

                STATE.scenes[STATE.activeSceneIdx].lines = [...editorLines];
                STATE.scenes[STATE.activeSceneIdx].name = name;
                renderEditor(editorLines);
                updateSceneSelector();
                document.getElementById('status-text').textContent = `${replace ? 'Loaded' : '➕ Added'} ${name}`;

                if (replace) {
                    document.body.removeChild(modal);
                }

                setTimeout(() => compileCurrentMPD(), 500);
            }

            // Add parts to existing scene (batch add with array of part objects)
            function addPartToScene(parts, name) {
                console.log('[ADD-PART] addPartToScene called with', parts?.length, 'parts, name:', name);
                console.log('[ADD-PART] parts:', parts);
                console.log('[ADD-PART] editorLines defined?', Array.isArray(editorLines), 'length:', editorLines?.length);
                
                if (!Array.isArray(parts) || parts.length === 0) {
                    console.error('[ADD-PART] Invalid parts array:', parts);
                    return;
                }
                
                const GRID_SPACING = 200;
                const COLUMNS = 6;
                const Y_OFFSET = -50;
                
                // Find next available Z position
                const currentLines = editorLines.join('\n');
                const lineMatches = currentLines.match(/1\s+\d+\s+[\d\-\.]+\s+[\d\-\.]+\s+([\d\-\.]+)/g);
                let maxZ = 0;
                if (lineMatches) {
                    lineMatches.forEach(line => {
                        const z = parseFloat(line.split(/\s+/)[5]);
                        if (!isNaN(z) && z > maxZ) maxZ = z;
                    });
                }
                const startZ = maxZ + GRID_SPACING * 2;
                
                // Generate new part lines
                const newLines = [];
                newLines.push(`0 // Added from ${name}`);
                
                parts.forEach((part, idx) => {
                    const col = idx % COLUMNS;
                    const row = Math.floor(idx / COLUMNS);
                    const x = col * GRID_SPACING - ((COLUMNS - 1) * GRID_SPACING / 2);
                    const y = Y_OFFSET;
                    const z = startZ + (row * GRID_SPACING);
                    const color = ((idx % 15) + 1);
                    
                    // Use filename only for LDraw (e.g., "3001.dat" not "parts/3001.dat")
                    const partRef = part.filename || part.path;
                    
                    newLines.push(`0 // ${part.description || part.name}`);
                    newLines.push(`1 ${color} ${x} ${y} ${z} 1 0 0 0 1 0 0 0 1 ${partRef}`);
                });
                
                // Insert before final STEP
                const stepIdx = editorLines.lastIndexOf('0 STEP');
                if (stepIdx > 0) {
                    editorLines.splice(stepIdx, 0, ...newLines, '');
                } else {
                    editorLines.push(...newLines);
                }
                
                STATE.scenes[STATE.activeSceneIdx].lines = [...editorLines];
                renderEditor(editorLines);
                document.getElementById('status-text').textContent = `➕ Added ${parts.length} parts to scene`;
                
                console.log('[ADD-PART] Batch add complete:', parts.length, 'parts, total lines now:', editorLines.length);
                
                // Auto-compile (wrapped in try-catch to prevent freeze)
                // Force reset compileInProgress in case it got stuck
                compileInProgress = false;
                
                setTimeout(async () => {
                    console.log('[ADD-PART] Starting compile...');
                    try {
                        await compile();
                        console.log('[ADD-PART] Compile finished');
                    } catch (err) {
                        console.error('[ADD-PART] Compile failed:', err);
                        document.getElementById('status-text').textContent = `⚠️ Added parts but compile failed: ${err.message}`;
                    }
                }, 500);
            }
            
            // Generate MPD from parts and load to scene
            function loadPartsToScene(parts, name, replace = true) {
                const GRID_SPACING = 200;
                const COLUMNS = 6;
                const Y_OFFSET = -50;
                
                let mpd = `0 FILE ${name.replace(/\s+/g, '_')}.mpd\n`;
                mpd += `0 Name: ${name}\n`;
                mpd += `0 Author: Grace Catalog Browser\n`;
                mpd += `0 !LDRAW_ORG Model\n`;
                mpd += `0 BFC CERTIFY CCW\n\n`;
                mpd += `0 STEP\n\n`;
                
                parts.forEach((part, idx) => {
                    const col = idx % COLUMNS;
                    const row = Math.floor(idx / COLUMNS);

                });

                        // Extract size from description (e.g., "1x2", "2x4", "1x1x2")
                        function extractSize(desc) {
                            const match = desc.match(/(\d+)\s*x\s*(\d+)(?:\s*x\s*(\d+))?/i);
                            if (match) {
                                const w = parseInt(match[1]) || 1;
                                const l = parseInt(match[2]) || 1;
                                const h = parseInt(match[3]) || 1;
                                return { w, l, h, area: w * l, volume: w * l * h, str: match[0] };
                            }
                            return { w: 1, l: 1, h: 1, area: 1, volume: 1, str: '' };
                        }
                        
                        // Estimate complexity from filename (more digits/letters = more complex)
                        function estimateComplexity(filename) {
                            const base = filename.replace('.dat', '');
                            // Simple parts: 3001, 3002, etc. Complex: 973pr1234, 92456pb123
                            const hasPattern = /p[br]\d+|c\d+|d\d+/.test(base);
                            const numLen = (base.match(/\d+/g) || []).join('').length;
                            return hasPattern ? 3 : (numLen > 4 ? 2 : 1);
                        }
                        
                        // ═══════════════════════════════════════════════════════════
                        // DIMENSION NORMALIZATION - "2 x 4" → "2x4", "one by two" → "1x2"
                        // ═══════════════════════════════════════════════════════════
                        function normalizeQuery(q) {
                            return q
                                .replace(/(\d+)\s*[xX×]\s*(\d+)(?:\s*[xX×]\s*(\d+))?/g, (m, a, b, c) => 
                                    c ? `${a}x${b}x${c}` : `${a}x${b}`)  // "2 x 4" → "2x4"
                                .replace(/\bone\b/gi, '1').replace(/\btwo\b/gi, '2')
                                .replace(/\bthree\b/gi, '3').replace(/\bfour\b/gi, '4')
                                .replace(/\bfive\b/gi, '5').replace(/\bsix\b/gi, '6')
                                .replace(/\beight\b/gi, '8').replace(/\bten\b/gi, '10')
                                .replace(/\btwelve\b/gi, '12').replace(/\bsixteen\b/gi, '16')
                                .toLowerCase().trim();
                        }
                        
                        // ═══════════════════════════════════════════════════════════
                        // SYNONYM MAP - Builder slang → Official LDraw terms
                        // ═══════════════════════════════════════════════════════════
                        const SYNONYMS = {
                            // Common nicknames
                            'cheese': ['slope 30 1 x 1', '54200', 'cheese slope', 'cheese wedge'],
                            'jumper': ['plate 1 x 2 offset', 'plate 1 x 2 with 1 stud', '3794', '15573', 'jumper plate'],
                            'erling': ['headlight', 'brick 1 x 1 with headlight', '4070'],
                            'travis': ['brick 1 x 1 with studs on 4 sides', '4733'],
                            'snot': ['stud not on top', 'sideways', 'bracket'],
                            
                            // Connection types
                            'clip': ['holder', 'claw', 'bar holder', 'clip horizontal', 'clip vertical'],
                            'bar': ['handle', 'rod', 'antenna', 'lightsaber blade'],
                            'stud': ['knob', 'bump', 'pip'],
                            'anti-stud': ['tube', 'underside tube'],
                            'pin': ['connector peg', 'friction pin', 'axle pin'],
                            'axle': ['cross axle', 'technic axle'],
                            
                            // Part types
                            'baseplate': ['base plate', 'plate 32 x 32', 'plate 48 x 48'],
                            'wing': ['wedge plate', 'wedge'],
                            'door': ['door frame', 'door 1 x 4'],
                            'window': ['window frame', 'window 1 x 2'],
                            'wheel': ['tyre', 'tire', 'rim'],
                            'tyre': ['tire', 'wheel'],
                            
                            // Minifig
                            'head': ['minifig head', 'minifigure head'],
                            'torso': ['minifig torso', 'minifigure torso', 'body'],
                            'legs': ['minifig legs', 'minifigure legs', 'hips'],
                            'hair': ['minifig hair', 'minifigure hair', 'wig'],
                            'helmet': ['minifig helmet', 'headgear'],
                            'cape': ['minifig cape', 'cloth cape'],
                            
                            // Themes
                            'castle': ['knight', 'medieval', 'kingdom'],
                            'space': ['spaceship', 'rocket', 'astronaut', 'classic space'],
                            'pirate': ['ship', 'sail', 'cannon'],
                            'train': ['locomotive', 'railway', 'track'],
                            'city': ['town', 'modular', 'building']
                        };
                        
                        // Expand a term with its synonyms (returns array of terms to match)
                        function expandWithSynonyms(term) {
                            const normalized = term.toLowerCase();
                            const expanded = [normalized];
                            
                            // Check if term is a key in synonyms
                            if (SYNONYMS[normalized]) {
                                expanded.push(...SYNONYMS[normalized]);
                            }
                            
                            // Check if term appears in any synonym list (reverse lookup)
                            for (const [key, aliases] of Object.entries(SYNONYMS)) {
                                if (aliases.some(a => a.includes(normalized) || normalized.includes(a))) {
                                    expanded.push(key);
                                    expanded.push(...aliases);
                                }
                            }
                            
                            return [...new Set(expanded)]; // Dedupe
                        }
                        
                        // Normalize the query first
                        const normalizedQuery = normalizeQuery(query);
                        console.log('[SEARCH] Normalized query:', query, '→', normalizedQuery);
                        
                        // Parse search terms from NORMALIZED query
                        const terms = normalizedQuery.split(/\s+/).filter(t => t.length > 0);
                        const positiveTerms = terms.filter(t => !t.startsWith('-'));
                        const negativeTerms = terms.filter(t => t.startsWith('-')).map(t => t.slice(1)).filter(t => t.length > 0);
                        
                        // Expand positive terms with synonyms
                        const expandedPositiveTerms = positiveTerms.map(t => ({
                            original: t,
                            expanded: expandWithSynonyms(t)
                        }));
                        
                        console.log('[SEARCH] Terms expanded:', expandedPositiveTerms.map(e => `${e.original} → [${e.expanded.join(', ')}]`));
                        
                        // Word boundary matching helper - matches whole words only
                        // e.g., "car" matches "car", "cars", but NOT "cardboard", "carton"
                        function wordMatch(text, term) {
                            const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                            const regex = new RegExp(`\\b${escaped}(s|es|ed|ing)?\\b`, 'i');
                            return regex.test(text);
                        }
                        
                        // Substring match (for size patterns like "1x2", part IDs)
                        function substringMatch(text, term) {
                            return text.includes(term);
                        }
                        
                        // Smart match: picks strategy based on term format
                        function smartMatch(text, term) {
                            // Size patterns (1x2, 2x4) should use substring
                            if (/^\d+x\d+/.test(term)) return substringMatch(text, term);
                            // Part IDs (all digits) use substring
                            if (/^\d{3,}$/.test(term)) return substringMatch(text, term);
                            // Short terms (1-2 chars) use substring
                            if (term.length <= 2) return substringMatch(text, term);
                            // Longer terms use word boundary
                            return wordMatch(text, term);
                        }
                        
                        // Check if ANY of the expanded synonyms match
                        function synonymMatch(text, expandedTerm) {
                            return expandedTerm.expanded.some(syn => smartMatch(text, syn));
                        }
                        
                        console.log('[SEARCH] Positive:', positiveTerms, 'Negative:', negativeTerms);
                        
                        // Collect all matching parts (enhanced with enriched index if available)
                        Object.values(taxonomy.kingdoms).forEach(kingdomData => {
                            Object.values(kingdomData.phyla).forEach(phylumData => {
                                Object.values(phylumData.classes).forEach(classData => {
                                    Object.values(classData.orders).forEach(orderData => {
                                        Object.values(orderData.families).forEach(familyData => {
                                            familyData.parts.forEach(part => {
                                                // Get enriched data if available
                                                const enriched = enrichedIndex?.lookup?.get(part.filename);
                                                
                                                // Build searchable text - include keywords from enriched index
                                                let text = `${part.filename} ${part.name} ${part.description}`.toLowerCase();
                                                if (enriched) {
                                                    // Add official keywords to searchable text
                                                    if (enriched.k) text += ' ' + enriched.k.join(' ');
                                                    // Add official category
                                                    if (enriched.c) text += ' ' + enriched.c.toLowerCase();
                                                }
                                                
                                                // Check ALL positive terms match (using SYNONYM expansion)
                                                const matchesPositive = expandedPositiveTerms.length === 0 || 
                                                    expandedPositiveTerms.every(expTerm => synonymMatch(text, expTerm));
                                                
                                                // Check NO negative terms match (using smart matching - no synonym expansion for exclusions)
                                                const matchesNegative = negativeTerms.length === 0 ||
                                                    negativeTerms.every(term => !smartMatch(text, term));
                                                
                                                if (matchesPositive && matchesNegative) {
                                                    // Score relevance (filename match = higher, synonym match = bonus)
                                                    let score = 0;
                                                    const fname = part.filename.toLowerCase();
                                                    
                                                    expandedPositiveTerms.forEach(expTerm => {
                                                        // Direct match on original term = highest
                                                        if (fname.includes(expTerm.original)) score += 15;
                                                        if (fname === expTerm.original || fname === expTerm.original + '.dat') score += 25;
                                                        if (fname.startsWith(expTerm.original)) score += 8;
                                                        
                                                        // Synonym matches = good but lower
                                                        expTerm.expanded.forEach(syn => {
                                                            if (syn !== expTerm.original && text.includes(syn)) score += 3;
                                                        });
                                                        
                                                        // NEW: Boost for keyword match from enriched index
                                                        if (enriched?.k?.some(k => k.includes(expTerm.original))) score += 12;
                                                        // NEW: Boost for category match
                                                        if (enriched?.c?.toLowerCase().includes(expTerm.original)) score += 10;
                                                    });
                                                    
                                                    // Use enriched data or extract from description
                                                    const desc = (part.description || '').toLowerCase();
                                                    const size = enriched?.s || extractSize(part.description || part.name || '');
                                                    const complexity = estimateComplexity(part.filename);
                                                    
                                                    // Use official !CATEGORY if available, else infer from description
                                                    let partType = enriched?.c?.toLowerCase() || 'other';
                                                    if (partType === 'other') {
                                                        if (desc.includes('brick') || fname.includes('brick')) partType = 'brick';
                                                        else if (desc.includes('plate') || fname.includes('plate')) partType = 'plate';
                                                        else if (desc.includes('slope') || fname.includes('slope')) partType = 'slope';
                                                        else if (desc.includes('tile') || fname.includes('tile')) partType = 'tile';
                                                        else if (desc.includes('minifig') || fname.includes('minifig')) partType = 'minifig';
                                                        else if (desc.includes('technic') || fname.includes('technic')) partType = 'technic';
                                                    }
                                                    
                                                    // NEW: Add connector info from enriched index
                                                    const connectors = enriched?.n || [];
                                                    const keywords = enriched?.k || [];
                                                    const isAlias = enriched?.a === 1;
                                                    const isObsolete = enriched?.o === 1;
                                                    
                                                    // Skip alias/obsolete parts by default (lower rank)
                                                    if (isAlias || isObsolete) score -= 50;
                                                    
                                                    results.push({ 
                                                        part, score, partType, size, complexity,
                                                        connectors, keywords, 
                                                        category: enriched?.c,
                                                        basePartId: enriched?.b,
                                                        variationType: enriched?.t,
                                                        // NEW: Shadow Library connectivity data
                                                        connectivitySig: enriched?.sig,  // e.g., "S8-T3"
                                                        snapCount: enriched?.sc
                                                    });
                                                }
                                            });
                                        });
                                    });
                                });
                            });
                        });
                        
                        // Sort by relevance
                        results.sort((a, b) => b.score - a.score);
                        
                        // Update selection toolbar
                        function updateSelectionUI() {
                            const count = selectedParts.size;
                            if (count > 0) {
                                selectionToolbar.style.display = 'flex';
                                selectedCountEl.textContent = count;
                            } else {
                                selectionToolbar.style.display = 'none';
                            }
                            // Update card states
                            document.querySelectorAll('.part-card').forEach(card => {
                                const path = card.dataset.path;
                                if (selectedParts.has(path)) {
                                    card.style.borderColor = 'var(--accent)';
                                    card.style.background = 'rgba(0, 255, 136, 0.1)';
                                    card.querySelector('.select-indicator').textContent = '✓';
                                } else {
                                    card.style.borderColor = 'var(--border-primary)';
                                    card.style.background = 'var(--bg-main)';
                                    card.querySelector('.select-indicator').textContent = '○';
                                }
                            });
                        }
                        
                        // Render results with optional filter and pagination
                        function renderResults(filterType = 'all', append = false) {
                            if (!append) {
                                resultsGrid.innerHTML = '';
                                currentPage = 0;
                            }
                            
                            // Filter by category
                            currentFiltered = filterType === 'all' 
                                ? [...results]
                                : results.filter(r => r.partType?.toLowerCase() === filterType || 
                                                     r.category?.toLowerCase() === filterType);
                            
                            // Filter by active connectors (if any selected)
                            if (activeConnectors && activeConnectors.size > 0) {
                                currentFiltered = currentFiltered.filter(r => {
                                    if (!r.connectors || r.connectors.length === 0) return false;
                                    // Part must have ALL selected connectors
                                    return [...activeConnectors].every(c => r.connectors.includes(c));
                                });
                            }
                            
                            // Apply current sort
                            switch(currentSort) {
                                case 'size-asc':
                                    currentFiltered.sort((a, b) => a.size.volume - b.size.volume);
                                    break;
                                case 'size-desc':
                                    currentFiltered.sort((a, b) => b.size.volume - a.size.volume);
                                    break;
                                case 'name':
                                    currentFiltered.sort((a, b) => a.part.filename.localeCompare(b.part.filename));
                                    break;
                                case 'simple':
                                    currentFiltered.sort((a, b) => a.complexity - b.complexity);
                                    break;
                                default: // relevance
                                    currentFiltered.sort((a, b) => b.score - a.score);
                            }
                            
                            const startIdx = currentPage * PAGE_SIZE;
                            const endIdx = Math.min(startIdx + PAGE_SIZE, currentFiltered.length);
                            const pageResults = currentFiltered.slice(startIdx, endIdx);
                            
                            // Update progress bar and range display
                            const showingRangeEl = document.getElementById('showing-range');
                            const progressBar = document.getElementById('progress-bar');
                            if (showingRangeEl) {
                                const showing = Math.min(endIdx, currentFiltered.length);
                                showingRangeEl.textContent = `Showing ${showing} of ${currentFiltered.length}`;
                            }
                            if (progressBar) {
                                const pct = currentFiltered.length > 0 ? (endIdx / currentFiltered.length) * 100 : 0;
                                progressBar.style.width = `${pct}%`;
                            }
                            
                            pageResults.forEach(({ part, partType, size, complexity, connectors, connectivitySig, snapCount, basePartId, category }) => {
                                const isSelected = selectedParts.has(part.path);
                                const partDiv = document.createElement('div');
                                partDiv.className = 'part-card';
                                partDiv.dataset.path = part.path;
                                
                                // Complexity indicators
                                const complexityIcon = complexity === 1 ? '🟢' : complexity === 2 ? '🟡' : '🔴';
                                const complexityLabel = complexity === 1 ? 'Simple' : complexity === 2 ? 'Medium' : 'Complex';
                                
                                partDiv.style.cssText = `
                                    padding: 8px;
                                    background: ${isSelected ? 'rgba(0, 255, 136, 0.1)' : 'var(--bg-main)'};
                                    border-radius: 6px;
                                    font-size: 11px;
                                    cursor: pointer;
                                    transition: all 0.15s ease;
                                    border: 2px solid ${isSelected ? 'var(--accent)' : 'var(--border-primary)'};
                                    position: relative;
                                `;
                                
                                // Rebrickable image URL - try part number, then base part for variants
                                const partNum = part.filename.replace('.dat', '');
                                const baseNum = basePartId || partNum.replace(/[a-z]+\d*$|p[br]\d+.*$|s\d+$/i, '');
                                const imgUrl = `https://cdn.rebrickable.com/media/parts/ldraw/0/${partNum}.png`;
                                const fallbackUrl = partNum !== baseNum ? `https://cdn.rebrickable.com/media/parts/ldraw/0/${baseNum}.png` : null;
                                
                                // Connector badges
                                const connectorBadges = (connectors || []).slice(0, 3).map(c => {
                                    const icons = { 'stud': '⬤', 'tube': '○', 'clip': '📎', 'axle-hole': '✚', 'technic-hole': '◉', 'bar': '|', 'hinge': '↔' };
                                    return `<span title="${c}" style="font-size: 7px; opacity: 0.7;">${icons[c] || '•'}</span>`;
                                }).join('');
                                
                                partDiv.innerHTML = `
                                    <div style="display: flex; gap: 6px;">
                                        <!-- Part thumbnail from Rebrickable -->
                                        <div class="part-thumb" style="flex-shrink: 0; width: 52px; height: 52px; background: #1a1a1a; border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden;">
                                            <img src="${imgUrl}" alt="${partNum}" style="max-width: 100%; max-height: 100%; object-fit: contain;" 
                                                onerror="this.onerror=null; ${fallbackUrl ? `this.src='${fallbackUrl}';` : `this.style.display='none'; this.parentNode.innerHTML='<span style=\\'font-size:24px;opacity:0.3\\'>🧱</span>';`}">
                                        </div>
                                        <div style="flex: 1; min-width: 0;">
                                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 2px;">
                                                <span class="select-indicator" style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 8px; color: var(--accent);">${isSelected ? '✓' : '○'}</span>
                                                <div style="display: flex; gap: 2px; align-items: center;">
                                                    ${connectivitySig ? `<span title="Connectivity: ${connectivitySig}" style="font-size: 6px; background: #333; padding: 1px 3px; border-radius: 2px; color: #0f8; font-family: monospace;">${connectivitySig}</span>` : ''}
                                                    ${size?.str ? `<span style="font-size: 6px; background: var(--bg-secondary); padding: 1px 3px; border-radius: 2px; color: #aaa;">${size.str}</span>` : ''}
                                                    <button class="copy-btn" title="Copy path" style="background: var(--bg-secondary); border: none; padding: 2px 4px; border-radius: 3px; cursor: pointer; font-size: 7px;">📋</button>
                                                    <button class="add-btn" title="Add to scene" style="background: var(--accent); border: none; padding: 2px 4px; border-radius: 3px; cursor: pointer; font-size: 7px; color: #000;">➕</button>
                                                </div>
                                            </div>
                                            <div style="font-weight: 700; color: var(--accent); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${part.filename}</div>
                                            <div style="color: #888; font-size: 8px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${(part.description || part.name).slice(0, 40)}</div>
                                            <div style="display: flex; gap: 4px; margin-top: 2px; align-items: center;">
                                                ${category ? `<span style="font-size: 6px; background: #2a2a2a; padding: 1px 4px; border-radius: 2px; color: #888;">${category}</span>` : ''}
                                                ${connectorBadges ? `<span style="display: flex; gap: 2px;">${connectorBadges}</span>` : ''}
                                            </div>
                                        </div>
                                    </div>
                                `;
                                
                                // Toggle selection on card click
                                partDiv.addEventListener('click', (e) => {
                                    if (e.target.closest('.copy-btn') || e.target.closest('.add-btn')) return;
                                    if (selectedParts.has(part.path)) {
                                        selectedParts.delete(part.path);
                                    } else {
                                        selectedParts.add(part.path);
                                    }
                                    updateSelectionUI();
                                    playMagnetClickSound();
                                });
                                
                                // Copy button
                                partDiv.querySelector('.copy-btn').addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    navigator.clipboard.writeText(part.path);
                                    document.getElementById('status-text').textContent = `📋 Copied: ${part.path}`;
                                    playMagnetClickSound();
                                });
                                
                                // Add button - use single part adder (not batch)
                                partDiv.querySelector('.add-btn').addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    addSinglePartToScene(part.path);
                                    playMagnetClickSound();
                                });
                                
                                resultsGrid.appendChild(partDiv);
                            });
                            
                            // Update count in header
                            if (searchCountEl) {
                                searchCountEl.textContent = `${currentFiltered.length} found`;
                            }
                            
                            // Remove old Load More button if exists
                            const oldLoadMore = document.getElementById('load-more-btn');
                            if (oldLoadMore) oldLoadMore.remove();
                            
                            // Add Load More button if there are more results
                            if (endIdx < currentFiltered.length) {
                                const loadMoreBtn = document.createElement('button');
                                loadMoreBtn.id = 'load-more-btn';
                                loadMoreBtn.style.cssText = `
                                    grid-column: 1 / -1;
                                    padding: 12px 24px;
                                    background: var(--bg-secondary);
                                    border: 2px solid var(--accent);
                                    border-radius: 6px;
                                    color: var(--accent);
                                    font-weight: 700;
                                    cursor: pointer;
                                    margin-top: 8px;
                                    transition: all 0.2s;
                                `;
                                loadMoreBtn.textContent = `📦 Load Next ${Math.min(PAGE_SIZE, currentFiltered.length - endIdx)} (${currentFiltered.length - endIdx} remaining)`;
                                loadMoreBtn.addEventListener('mouseenter', () => {
                                    loadMoreBtn.style.background = 'var(--accent)';
                                    loadMoreBtn.style.color = '#000';
                                });
                                loadMoreBtn.addEventListener('mouseleave', () => {
                                    loadMoreBtn.style.background = 'var(--bg-secondary)';
                                    loadMoreBtn.style.color = 'var(--accent)';
                                });
                                loadMoreBtn.addEventListener('click', () => {
                                    currentPage++;
                                    renderResults(activeFilter, true);
                                    playMagnetClickSound();
                                });
                                resultsGrid.appendChild(loadMoreBtn);
                            }
                            
                            if (currentFiltered.length === 0) {
                                resultsGrid.innerHTML = `
                                    <div style="grid-column: 1 / -1; color: #888; text-align: center; padding: 30px;">
                                        No ${filterType === 'all' ? '' : filterType + ' '}parts found
                                    </div>
                                `;
                            }
                        }
                        
                        // Filter chip handlers
                        filterChips.forEach(chip => {
                            chip.addEventListener('click', () => {
                                filterChips.forEach(c => {
                                    c.style.background = 'var(--bg-secondary)';
                                    c.style.borderColor = 'var(--border-primary)';
                                    c.style.color = 'var(--text-primary)';
                                    c.classList.remove('active');
                                });
                                chip.style.background = 'var(--accent)';
                                chip.style.borderColor = 'var(--accent)';
                                chip.style.color = '#000';
                                chip.classList.add('active');
                                activeFilter = chip.dataset.filter;
                                renderResults(activeFilter);
                                updateSelectionUI();
                            });
                        });
                        
                        // Connector chip handlers (toggle filter)
                        document.querySelectorAll('.connector-chip').forEach(chip => {
                            chip.addEventListener('click', () => {
                                const connector = chip.dataset.connector;
                                if (activeConnectors.has(connector)) {
                                    activeConnectors.delete(connector);
                                    chip.style.background = 'transparent';
                                    chip.style.borderColor = '#555';
                                    chip.style.color = '#aaa';
                                } else {
                                    activeConnectors.add(connector);
                                    chip.style.background = 'var(--accent)';
                                    chip.style.borderColor = 'var(--accent)';
                                    chip.style.color = '#000';
                                }
                                renderResults(activeFilter);
                                updateSelectionUI();
                            });
                        });
                        
                        // Add all selected button - use single part adder for each
                        document.getElementById('add-selected-btn').addEventListener('click', () => {
                            selectedParts.forEach(path => addSinglePartToScene(path));
                            playMagnetClickSound();
                            setTimeout(() => playMagnetClickSound(), 100);
                            document.getElementById('status-text').textContent = `➕ Added ${selectedParts.size} parts`;
                            selectedParts.clear();
                            updateSelectionUI();
                        });
                        
                        // Clear selection button
                        document.getElementById('clear-selection-btn').addEventListener('click', () => {
                            selectedParts.clear();
                            updateSelectionUI();
                        });
                        
                        // Select visible (currently displayed) parts
                        document.getElementById('select-visible-btn').addEventListener('click', () => {
                            document.querySelectorAll('.part-card').forEach(card => {
                                selectedParts.add(card.dataset.path);
                            });
                            updateSelectionUI();
                            playMagnetClickSound();
                        });
                        
                        // Select ALL filtered parts (not just visible page)
                        document.getElementById('select-all-filtered-btn').addEventListener('click', () => {
                            currentFiltered.forEach(({ part }) => {
                                selectedParts.add(part.path);
                            });
                            updateSelectionUI();

            // ═══════════════════════════════════════════════════════════

                    }, 1000);
                });
                
                // Copy path button
                lightbox.querySelector('.part-lightbox-copy').addEventListener('click', () => {
                    const path = partPath || `parts/${partNum}.dat`;
                    navigator.clipboard.writeText(path);
                    const btn = lightbox.querySelector('.part-lightbox-copy');
                    btn.textContent = '✓ COPIED!';
                    setTimeout(() => btn.textContent = '📋 COPY PATH', 1000);
                });
                
                // Navigation buttons
                if (showNav) {
                    const prevBtn = lightbox.querySelector('.part-lightbox-nav.prev');
                    const nextBtn = lightbox.querySelector('.part-lightbox-nav.next');
                    
                    if (prevBtn) {
                        prevBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (idx > 0) {
                                window.lightboxIndex = idx - 1;
                                navigateToCurrentPart();
                            }
                        });
                    }
                    if (nextBtn) {
                        nextBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (idx < parts.length - 1) {
                                window.lightboxIndex = idx + 1;
                                navigateToCurrentPart();
                            }
                        });
                    }
                }
                
                // Keyboard navigation
                const keyHandler = (e) => {
                    if (e.key === 'Escape') {
                        lightbox.remove();
                        document.removeEventListener('keydown', keyHandler);
                    } else if (e.key === 'ArrowLeft' && hasPrev) {
                        window.lightboxIndex = idx - 1;
                        navigateToCurrentPart();
                        document.removeEventListener('keydown', keyHandler);
                    } else if (e.key === 'ArrowRight' && hasNext) {
                        window.lightboxIndex = idx + 1;
                        navigateToCurrentPart();
                        document.removeEventListener('keydown', keyHandler);
                    }
                };
                document.addEventListener('keydown', keyHandler);
                
                // Touch swipe support
                let touchStartX = 0;
                let touchEndX = 0;
                
                lightbox.addEventListener('touchstart', (e) => {
                    touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });
                
                lightbox.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].screenX;
                    const diff = touchStartX - touchEndX;
                    
                    if (Math.abs(diff) > 50) { // Minimum swipe distance
                        if (diff > 0 && hasNext) {
                            // Swipe left = next
                            window.lightboxIndex = idx + 1;
                            navigateToCurrentPart();
                        } else if (diff < 0 && hasPrev) {
                            // Swipe right = prev
                            window.lightboxIndex = idx - 1;
                            navigateToCurrentPart();
                        }
                    }
                }, { passive: true });
                
                document.body.appendChild(lightbox);
                console.log('[LIGHTBOX] Opened:', partNum, 'Index:', idx, '/', parts.length);
            }

            function navigateToCurrentPart() {
                const parts = window.lightboxParts;
                const idx = window.lightboxIndex;
                if (idx >= 0 && idx < parts.length) {
                    const p = parts[idx];
                    showPartLightbox(p.partNum, p.description, p.category, p.imgUrl, p.fallbackUrl, p.path);
                }

            window.setLightboxParts = setLightboxParts;
            
            // ═══════════════════════════════════════════════════════════
            // TOAST & STAGING QUEUE SYSTEM
            // ═══════════════════════════════════════════════════════════
            
            // Create toast container if not exists

            if (!toastContainer) {
                toastContainer = document.createElement('div');
                toastContainer.className = 'toast-container';
                document.body.appendChild(toastContainer);

            // Staging queue for recently added parts
            const stagingQueue = [];
            let stagingEl = null;
            
            function showToast(message, partPath, partFilename) {
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `
                    <span class="toast-icon">✓</span>
                    <span class="toast-text">${message}</span>
                `;

            function addToStagingQueue(partPath, partFilename) {
                // Add to queue (keep last 10)
                stagingQueue.unshift({ path: partPath, filename: partFilename, time: Date.now() });
                if (stagingQueue.length > 10) stagingQueue.pop();
                
                renderStagingQueue();
            }
            
            function renderStagingQueue() {
                // Create or get staging element
                if (!stagingEl) {
                    stagingEl = document.createElement('div');
                    stagingEl.className = 'staging-queue';
                    stagingEl.innerHTML = `
                        <div class="staging-header">
                            <span class="staging-title">📦 Recently Added (${stagingQueue.length})</span>
                            <button class="staging-clear">Clear</button>
                        </div>
                        <div class="staging-items"></div>
                    `;
                    document.body.appendChild(stagingEl);
                    
                    stagingEl.querySelector('.staging-clear').addEventListener('click', () => {
                        stagingQueue.length = 0;
                        renderStagingQueue();
                    });
                }
                
                // Update content
                const itemsEl = stagingEl.querySelector('.staging-items');
                stagingEl.querySelector('.staging-title').textContent = `📦 Recently Added (${stagingQueue.length})`;
                
                if (stagingQueue.length === 0) {
                    stagingEl.classList.remove('has-items');
                    return;
                }
                
                stagingEl.classList.add('has-items');
                itemsEl.innerHTML = stagingQueue.map((item, idx) => `
                    <div class="staging-item" data-idx="${idx}">
                        <span>${item.filename}</span>
                        <button class="staging-item-remove" data-idx="${idx}">×</button>
                    </div>
                `).join('');
                
                // Remove handlers
                itemsEl.querySelectorAll('.staging-item-remove').forEach(btn => {
                    btn.addEventListener('click', (e) => {

<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#020617"/>

  <!-- Greek loom frame -->
  <rect x="10" y="12" width="44" height="32" rx="4" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <line x1="14" y1="18" x2="50" y2="18" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>

  <!-- Vertical warp threads -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round">
    <line x1="16" y1="20" x2="16" y2="40"/>
    <line x1="22" y1="20" x2="22" y2="40"/>
    <line x1="28" y1="20" x2="28" y2="40"/>
    <line x1="34" y1="20" x2="34" y2="40"/>
    <line x1="40" y1="20" x2="40" y2="40"/>
    <line x1="46" y1="20" x2="46" y2="40"/>
  </g>

  <!-- Yellow "H" shuttle (Homer + Homer) -->
  <rect x="20" y="36" width="24" height="10" rx="3" fill="#facc15" stroke="#78350f" stroke-width="1.6"/>
  <path d="M26 38 V44 M32 38 V44 M38 38 V44" stroke="#78350f" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Small laurel arc -->
  <path d="M18 50 A16 16 0 0 0 46 50" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3"/>
</svg>

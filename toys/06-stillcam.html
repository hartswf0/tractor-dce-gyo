<title>06 · The camera will not turn</title>
<link rel="icon" type="image/svg+xml" href="../ball-jar-favicon.svg" />
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../examples/js/loaders/LDrawLoader.js"></script>
<script src="../beta-prime-engine.js"></script>

<script src="../nabugo-ui.js"></script>

<script src="./common.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* 06 · The camera will not turn. A camera that refuses to rotate when the spacecraft rotates. */
const { DEG, M } = Toy.T;
const TUNE = { dist: 60, high: 26, k: 6, c: 4 };
const camDir = new THREE.Vector3(0, -0.42, -1).normalize(), camVel = new THREE.Vector3(), camPos = new THREE.Vector3();
let P = null;
Toy.boot({
  index: '06 / 12', title: 'The camera will not turn',
  notice: 'The camera follows you but never rotates. Turn, and you see the ship in profile; its shape is the only instrument.',
  keys: 'wasd steer · shift boost',
  setup(T) { T.pos.set(0, 40 * M, 60 * M); P = T.makePath(); camPos.copy(T.pos).addScaledVector(camDir, -TUNE.dist * M); },
  step(T, dt) {
    P.step(T.stickL(), T.boost(), dt);
    T.V1.copy(T.pos).addScaledVector(camDir, -TUNE.dist * M);                 // the same place behind, whichever way it faces
    camVel.addScaledVector(T.V2.subVectors(T.V1, camPos), TUNE.k * dt).multiplyScalar(Math.exp(-TUNE.c * dt));
    camPos.addScaledVector(camVel, dt);
    T.camera.position.copy(camPos); T.camera.up.copy(T.UP); T.camera.lookAt(T.V3.copy(camPos).add(camDir));
  },
  draw(T) { T.readout(`heading ${(Math.atan2(P.velDir.x, -P.velDir.z) / DEG).toFixed(0)}°\n${(P.v / M).toFixed(0)} m/s`); },
  state: T => ({ velDir: P.velDir.toArray(), speed: P.v }),
});
</script>
</body>

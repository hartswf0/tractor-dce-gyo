<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#b8cbd8" />
<title>05 · Flick</title>
<link rel="icon" type="image/svg+xml" href="../ball-jar-favicon.svg" />
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../examples/js/loaders/LDrawLoader.js"></script>
<script src="../beta-prime-engine.js"></script>
<script src="../nabugo.js"></script>
<script src="../nabugo-ui.js"></script>
<script src="./terrain-data.js"></script>
<script src="./common.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* 05 · Flick. A craft controlled only through flick impulses with no joystick. */
const { DEG, M } = Toy.T;
const TUNE = { speed: 320, radPerPxs: 0.0038, damp: 2.0, follow: 3.0, shove: 320, shoveDecay: 1.5 };
const w = { yaw: 0, pitch: 0 }, nose = new THREE.Vector3(0, 0, -1), velDir = new THREE.Vector3(0, 0, -1), E = new THREE.Euler();
let yaw = Math.PI, pitch = 0, shove = 0, flicks = 0, lastMulti = -9;
function flick(T, vx, vy) { w.yaw -= vx * TUNE.radPerPxs; w.pitch += vy * TUNE.radPerPxs; flicks++; }
Toy.boot({
  index: '05 / 12', title: 'Flick',
  notice: 'Nothing is held. A swipe is a push that keeps turning it. A tap fires. Two fingers shove it forward. Correct, overshoot, counter.',
  keys: 'arrow taps push · shift shove · space fire',
  setup(T) { T.pos.set(0, 40 * M, 60 * M); },
  onSwipe(T, p, vx, vy) { flick(T, vx, vy); },
  onTap(T, p) { if (T.t - lastMulti > 0.4) T.fire(nose, T.vel); },
  onMulti(T) { shove = TUNE.shove; lastMulti = T.t; },
  onKey(T, code, on) { if (!on) return; const k = 320; if (code === 'ArrowLeft') flick(T, -k, 0); if (code === 'ArrowRight') flick(T, k, 0); if (code === 'ArrowUp') flick(T, 0, -k); if (code === 'ArrowDown') flick(T, 0, k); if (code === 'Space') T.fire(nose, T.vel); if (/Shift/.test(code)) shove = TUNE.shove; },
  step(T, dt) {
    const e = Math.exp(-dt / TUNE.damp); w.yaw *= e; w.pitch *= e; shove *= Math.exp(-dt / TUNE.shoveDecay);
    yaw += w.yaw * dt; pitch = T.clamp(pitch + w.pitch * dt, -70 * DEG, 70 * DEG);
    T.quat.setFromEuler(E.set(-pitch, yaw, -w.yaw * 0.3, 'YXZ')); nose.set(0, 0, 1).applyQuaternion(T.quat);
    T.rotateTowards(velDir, nose, TUNE.follow * dt);
    T.vel.copy(velDir).multiplyScalar(TUNE.speed + shove); T.pos.addScaledVector(T.vel, dt); T.keepAbove(8 * M);
    T.chase(velDir, 60 * M, 18 * M, 0.3, dt);
  },
  draw(T) { T.readout(`spin ${(w.yaw / DEG).toFixed(0)}°/s · ${(w.pitch / DEG).toFixed(0)}°/s\n${((TUNE.speed + shove) / M).toFixed(0)} m/s · flicks ${flicks}`); },
  state: T => ({ yawRate: w.yaw, pitchRate: w.pitch, shove, flicks }),
  hooks: T => ({ flick: (vx, vy) => flick(T, vx, vy), shove: () => { shove = TUNE.shove; } }),
});
</script>
</body>
</html>

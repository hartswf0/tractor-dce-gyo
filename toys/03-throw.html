<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#b8cbd8" />
<title>03 · Throw it</title>
<link rel="icon" type="image/svg+xml" href="../ball-jar-favicon.svg" />
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../examples/js/loaders/LDrawLoader.js"></script>
<script src="../beta-prime-engine.js"></script>
<script src="../nabugo.js"></script>
<script src="../nabugo-ui.js"></script>
<script src="./terrain-data.js"></script>
<script src="./common.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
/* 03 · Throw it. A TIE you grab directly with one finger, pull backward, and throw. */
const { DEG, M } = Toy.T;
const TUNE = { launchPerPx: 7, vMax: 1600, drag: 2.5, hover: 25 };
const vel = new THREE.Vector3(), nose = new THREE.Vector3(0, 0, -1), launch = new THREE.Vector3();
let grab = null, stretch = 0, throws = 0, hoverY = 0;
function pullTo(T, p) {                           // the pull in screen space, mapped to the ground plane through the camera
  const dx = p.x - p.x0, dy = p.y - p.y0; stretch = Math.min(220, Math.hypot(dx, dy));
  if (stretch < 4) return;
  const f = T.camera.getWorldDirection(T.V1); f.y = 0; f.normalize(); const r = T.V2.crossVectors(f, T.UP).normalize();
  launch.copy(r).multiplyScalar(-dx).addScaledVector(f, dy).normalize();      // opposite to the pull: a slingshot
  T.rotateTowards(nose, launch, 8 * 1 / 60);
}
Toy.boot({
  index: '03 / 12', title: 'Throw it',
  notice: 'Put your finger on the ship. Pull back to load a throw; it turns to face where it will go. Let go.',
  keys: 'not a keyboard toy',
  setup(T) { T.pos.set(0, 30 * M, 20 * M); hoverY = T.pos.y; },
  onDown(T, p) { if (!grab && T.pick(p.x, p.y, T.ship)) { grab = p; stretch = 0; vel.set(0, 0, 0); } },
  onMove(T, p) { if (p === grab) pullTo(T, p); },
  onUp(T, p) { if (p === grab) { if (stretch > 8) { vel.copy(launch).multiplyScalar(Math.min(TUNE.vMax, stretch * TUNE.launchPerPx)); throws++; } grab = null; stretch = 0; } },
  step(T, dt) {
    if (!grab) {
      vel.multiplyScalar(Math.exp(-dt / TUNE.drag)); T.pos.addScaledVector(vel, dt);
      const g = T.groundH(T.pos.x, T.pos.z) + TUNE.hover * M; T.pos.y += (g - T.pos.y) * (1 - Math.exp(-dt * 2));
      if (vel.length() > 30) T.rotateTowards(nose, T.V1.copy(vel).normalize(), 3 * dt);
    }
    T.vel.copy(vel); T.lookQuat(T.quat, nose);
    T.V1.set(T.pos.x, T.pos.y + 45 * M, T.pos.z + 70 * M); T.placeCamera(T.V1, T.pos);   // a table view: it never turns
  },
  draw(T) {
    if (grab) {
      const p = T.project(T.pos); T.circle(p.x, p.y, 14, T.colour.N, 2);
      if (stretch > 4) { T.line(T.pos, T.V3.copy(T.pos).addScaledVector(launch, stretch * 0.5 * M), T.colour.N, [], 2.5); T.mark(T.V3, 'throw', T.colour.N); }
    }
    T.readout(`${(vel.length() / M).toFixed(0)} m/s\nthrows ${throws}`);
  },
  state: T => ({ held: !!grab, stretch, speed: vel.length(), throws }),
  hooks: T => ({
    grab: () => { const p = T.project(T.pos); const q = { id: -2, x: p.x, y: p.y, x0: p.x, y0: p.y, px: p.x, py: p.y, moved: 0, t0: 0, t: 0, left: true }; grab = q; stretch = 0; vel.set(0, 0, 0); return q; },
    pull: (dx, dy) => { if (grab) { grab.x = grab.x0 + dx; grab.y = grab.y0 + dy; pullTo(T, grab); } },
    release: () => { if (grab) { if (stretch > 8) { vel.copy(launch).multiplyScalar(Math.min(TUNE.vMax, stretch * TUNE.launchPerPx)); throws++; } grab = null; stretch = 0; } },
  }),
});
</script>
</body>
</html>

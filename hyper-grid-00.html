<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>HYPER_GRID // MEDIA_FOR_THINKING</title>
    <style>
        :root {
            --bg: #080808;
            --panel: #111;
            --border: #333;
            --border-active: #555;
            --accent: #00ff9d; /* Sharp Cyber Green */
            --secondary: #0088ff; /* Data Blue */
            --text: #ccc;
            --text-dim: #666;
            --font: 'JetBrains Mono', 'Courier New', monospace;

            --danger: #ff3355;
            --ok: #7cfc00;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER: TWO ROWS --- */
        header {
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: #000;
            flex-shrink: 0;
            font-size: 11px;
            letter-spacing: 0.05em;
        }
        
        .header-row {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .header-row:first-child {
            border-bottom: 1px solid #1a1a1a;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }
        
        .brand-icon svg {
            width: 100%;
            height: 100%;
        }
        
        .divider { width: 1px; height: 20px; background: var(--border); }

        .tools {
            display: flex;
            gap: 6px;
            align-items: center;
            flex: 0 0 auto;
        }

        .toolbtn {
            border-radius: 3px;
            border: 1px solid var(--border);
            background: #111;
            color: var(--text-dim);
            font-size: 9px;
            padding: 3px 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }

        .toolbtn:hover { border-color: var(--border-active); color: var(--text); }
        .toolbtn:active { transform: translateY(1px); }
        .toolbtn.primary { border-color: var(--accent); color: var(--accent); }
        .toolbtn.danger { border-color: #552; color: #c98; }

        .tog {
            display: inline-flex;
            gap: 6px;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 4px 8px;
            background: #0d0d0d;
        }
        .tog label {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .tog input[type="range"] {
            width: 90px;
        }
        .tog input[type="checkbox"] {
            accent-color: var(--accent);
        }

        .palette {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            min-width: 0;
        }

        .brick {
            border-radius: 3px;
            border: 1px solid var(--border);
            background: #111;
            color: var(--text-dim);
            font-size: 9px;
            padding: 3px 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .brick span.glyph {
            font-size: 10px;
            opacity: 0.8;
        }

        .brick:hover {
            border-color: var(--border-active);
            color: var(--text);
        }

        .brick.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        .palette-wrap {
            position: relative;
        }

        .palette-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px;
            z-index: 100;
            min-width: 120px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .palette-dropdown.open {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .palette-dropdown .brick {
            width: 100%;
            justify-content: flex-start;
            padding: 6px 10px;
        }

        /* --- SPLIT VIEW --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- TOP: THE SPATIAL GRID --- */
        .grid-viewport {
            flex: 1;
            background: #0c0c0c;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
        }

        .grid-shell {
            position: relative;
            width: min(60vh, 90vw);
            height: min(60vh, 90vw);
        }

        .grid-layer {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            width: 100%;
            height: 100%;
            gap: 1px;
            transition: transform 0.1s linear;
            transform-origin: center;
        }

        .flow-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
        }

        .flow-path {
            fill: none;
            stroke: rgba(0, 255, 157, 0.35);
            stroke-width: 2;
            filter: drop-shadow(0 0 6px rgba(0, 255, 157, 0.35));
        }

        .flow-dot {
            fill: rgba(0, 255, 157, 0.85);
        }

        .flow-label {
            font-size: 10px;
            fill: rgba(0, 255, 157, 0.85);
        }

        .cell {
            background: var(--panel);
            border: 1px solid var(--border);
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            padding: 4px;
            transition: all 0.1s;
            overflow: hidden;
            user-select: none;
        }

        .cell.empty {
            background: repeating-linear-gradient(
                45deg,
                #0d0d0d,
                #0d0d0d 2px,
                #111 2px,
                #111 4px
            );
            border-color: #1a1a1a;
            cursor: default;
        }

        .cell.dimmed { opacity: 0.12; }

        .cell:hover:not(.empty) {
            border-color: var(--accent);
            background: #1a1a1a;
            z-index: 10;
            box-shadow: 0 0 0 1px var(--accent);
        }

        .cell.selected:not(.empty) {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent), 0 0 0 2px rgba(0,255,157,0.15);
        }

        .cell-header {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            font-weight: bold;
            color: var(--text-dim);
            margin-bottom: 2px;
        }
        .cell:hover .cell-header { color: var(--text); }

        .cell-tag { color: var(--secondary); text-transform: uppercase; }
        .cell-idx { opacity: 0.5; }

        .cell-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1px;
            opacity: 0.85;
        }

        .code-line { height: 2px; background: #333; width: 100%; }
        .code-line.short { width: 40%; }
        .code-line.med { width: 70%; }
        .code-line.attr { background: #444; }

        .cell.layout .code-line.med { width: 90%; }
        .cell.button .code-line.med { width: 60%; }
        .cell.text .code-line.med { width: 80%; }

        .cell:hover .code-line { background: #555; }
        .cell:hover .code-line.attr { background: var(--accent); opacity: 0.6; }

        .cell-footer {
            margin-top: auto;
            font-size: 8px;
            color: var(--text-dim);
            text-align: right;
        }

        /* Helper overlay for "Surfaces the Invisible" */
        .hint-overlay {
            position: absolute;
            left: 14px;
            top: 12px;
            z-index: 40;
            padding: 8px 10px;
            border: 1px solid #1e1e1e;
            background: rgba(0,0,0,0.65);
            font-size: 10px;
            color: #9aa;
            max-width: 42ch;
        }
        .hint-overlay b { color: var(--accent); }
        .hint-overlay .mini { color: #667; font-size: 9px; margin-top: 6px; }

        /* --- BOTTOM: SOURCE + PREVIEW + STATE --- */
        .source-panel {
            height: 320px;
            background: #050505;
            font-size: 11px;
            border-top: 1px solid var(--border);
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        .source-header {
            padding: 8px 16px;
            background: #111;
            border-bottom: 1px solid var(--border);
            font-size: 10px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .header-left { display: flex; align-items: center; gap: 10px; }

        .tabs {
            display: inline-flex;
            border: 1px solid #1e1e1e;
            border-radius: 4px;
            overflow: hidden;
        }
        .tab {
            border: 0;
            background: #0d0d0d;
            color: #778;
            font-size: 9px;
            padding: 4px 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .tab.active {
            background: #131313;
            color: var(--accent);
        }

        .source-line {
            display: flex;
            padding: 2px 16px;
            cursor: pointer;
            border-left: 2px solid transparent;
            color: #777;
        }

        .source-line:hover, .source-line.active {
            background: #111;
            color: #eee;
            border-left-color: var(--accent);
        }

        .ln {
            min-width: 30px;
            color: #444;
            user-select: none;
            text-align: right;
            margin-right: 12px;
        }

        .code { white-space: pre; font-family: var(--font); }

        .panes {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        .pane {
            flex: 1;
            min-width: 0;
            overflow: auto;
            display: none;
        }

        .pane.active { display: block; }

        #source-stream { padding: 6px 0 10px; }

        .preview-panel {
            padding: 10px 16px 12px;
            font-size: 10px;
            color: var(--text-dim);
        }

        .preview-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .preview-surface {
            border: 1px solid #222;
            background: #070707;
            padding: 8px;
            min-height: 110px;
        }

        .preview-node {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border: 1px solid #1e1e1e;
            background: #0b0b0b;
            padding: 6px 8px;
            margin: 4px 0;
            cursor: pointer;
        }
        .preview-node:hover { border-color: #2a2a2a; }
        .preview-node.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(0,255,157,0.25);
        }
        .preview-node .type {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--secondary);
            opacity: 0.9;
        }
        .preview-node .txt {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            color: #aab;
        }
        .preview-node .coord {
            font-size: 9px;
            color: #556;
            white-space: nowrap;
        }

        .preview-meta {
            font-size: 9px;
            color: #555;
            margin-top: 8px;
        }

        .state-panel {
            padding: 10px 16px 12px;
        }
        .state-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }
        .pill {
            border: 1px solid #1e1e1e;
            border-radius: 999px;
            padding: 4px 8px;
            font-size: 9px;
            color: #889;
            background: #0b0b0b;
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }
        .pill b { color: var(--accent); font-weight: 700; }
        .pill .k { color: #667; }

        .jsonbox {
            border: 1px solid #1e1e1e;
            background: #070707;
            padding: 10px;
            font-size: 10px;
            line-height: 1.35;
            color: #9aa;
            overflow: auto;
            white-space: pre;
            min-height: 140px;
        }

        .log {
            margin-top: 10px;
            border-top: 1px solid #141414;
            padding-top: 10px;
        }
        .log .item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 4px 0;
            color: #778;
            font-size: 10px;
        }
        .log .item .t { color: #556; font-size: 9px; }
        .log .item .a b { color: var(--accent); }

        /* --- Modal (Export / Import) --- */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            padding: 16px;
        }
        .modal.open { display: flex; }
        .modal-card {
            width: min(860px, 96vw);
            max-height: min(680px, 90vh);
            border: 1px solid #1f1f1f;
            background: #070707;
            box-shadow: 0 20px 80px rgba(0,0,0,0.75);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-head {
            padding: 10px 12px;
            background: #0c0c0c;
            border-bottom: 1px solid #141414;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-head b { color: var(--accent); font-size: 10px; letter-spacing: 0.1em; }
        .modal-head .x {
            cursor: pointer;
            border: 1px solid #1f1f1f;
            background: #0d0d0d;
            color: #889;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1;
            padding: 6px 10px;
        }
        .modal-body {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }
        .modal-body textarea {
            width: 100%;
            flex: 1;
            min-height: 220px;
            resize: vertical;
            border: 1px solid #1f1f1f;
            background: #050505;
            color: #cbd5e1;
            font-family: var(--font);
            font-size: 11px;
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .toast {
            position: fixed;
            right: 14px;
            bottom: 14px;
            border: 1px solid #1f1f1f;
            background: rgba(0,0,0,0.7);
            color: #cbd5e1;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 10px;
            display: none;
            z-index: 100000;
        }
        .toast.show { display: block; }
        
        /* MOBILE STYLES */
        @media (max-width: 600px) {
            .header-row {
                padding: 8px;
                gap: 6px;
            }
            
            .toolbtn {
                padding: 8px 10px;
                font-size: 11px;
                min-height: 36px;
            }
            
            .brand-icon {
                width: 32px;
                height: 32px;
            }
            
            .divider { display: none; }
            
            .tog {
                padding: 6px;
            }
            
            .tog label {
                display: none;
            }
            
            .tog input[type="range"] {
                width: 50px;
            }
            
            .palette-dropdown {
                right: auto;
                left: 0;
            }
            
            .grid-shell {
                width: 95vw;
                height: 95vw;
            }
            
            .source-panel {
                height: 200px;
            }
            
            .hint-overlay {
                font-size: 9px;
                padding: 6px 8px;
                max-width: 90vw;
            }
            
            .cell {
                padding: 2px;
            }
            
            .cell-header {
                font-size: 7px;
            }
            
            .cell-body {
                font-size: 7px !important;
            }
            
            .cell-footer {
                font-size: 6px;
            }
        }
    </style>

    <script>
        // Global stub to avoid ReferenceError if legacy markup calls init_core()
        function init_core() {
            // No-op initializer; kept so older inline script calls won't break the page
            console.log('init_core() stub called – no-op initializer for HYPER_GRID.');
        }
    </script>
</head>
<body>

    <!-- UI LAYER -->
    <header>
        <!-- ROW 1: Brand + Actions -->
        <div class="header-row">
            <div class="brand-icon">
                <svg viewBox="0 0 32 32" fill="none">
                    <rect x="2" y="2" width="8" height="8" rx="1" fill="#00ff9d"/>
                    <rect x="12" y="2" width="8" height="8" rx="1" fill="#0088ff"/>
                    <rect x="22" y="2" width="8" height="8" rx="1" fill="#00ff9d" opacity="0.5"/>
                    <rect x="2" y="12" width="8" height="8" rx="1" fill="#0088ff"/>
                    <rect x="12" y="12" width="8" height="8" rx="1" fill="#fff"/>
                    <rect x="22" y="12" width="8" height="8" rx="1" fill="#0088ff"/>
                    <rect x="2" y="22" width="8" height="8" rx="1" fill="#00ff9d" opacity="0.5"/>
                    <rect x="12" y="22" width="8" height="8" rx="1" fill="#0088ff"/>
                    <rect x="22" y="22" width="8" height="8" rx="1" fill="#00ff9d"/>
                </svg>
            </div>
            <button class="toolbtn" id="undoBtn" title="Undo">↶</button>
            <button class="toolbtn" id="redoBtn" title="Redo">↷</button>
            <button class="toolbtn" id="saveBtn" title="Save">SAVE</button>
            <button class="toolbtn" id="loadBtn" title="Load">LOAD</button>
            <div class="divider"></div>
            <button class="toolbtn primary" id="exportHtmlBtn" title="Export HTML">HTML</button>
            <button class="toolbtn" id="previewIframeBtn" title="Preview">👁</button>
            <button class="toolbtn" id="importHtmlBtn" title="Gridify HTML">GRIDIFY</button>
            <div class="divider"></div>
            <div class="palette-wrap">
                <button class="toolbtn" id="paletteToggle">▢ DIV ▾</button>
                <div class="palette-dropdown" id="palette">
                    <div style="font-size:8px;color:#666;padding:2px 6px;border-bottom:1px solid #333;">CODE</div>
                    <button class="brick" data-type="func"><span class="glyph" style="color:#f43f5e">ƒ</span>FUNC</button>
                    <button class="brick" data-type="variable"><span class="glyph" style="color:#2dd4bf">=</span>VAR</button>
                    <button class="brick" data-type="control"><span class="glyph" style="color:#fbbf24">⟳</span>CTRL</button>
                    <button class="brick" data-type="style"><span class="glyph" style="color:#ec4899">#</span>CSS</button>
                    <div style="font-size:8px;color:#666;padding:2px 6px;border-bottom:1px solid #333;">MARKUP</div>
                    <button class="brick" data-type="tag"><span class="glyph" style="color:#8b5cf6"><></span>TAG</button>
                    <button class="brick active" data-type="layout"><span class="glyph">▢</span>DIV</button>
                    <button class="brick" data-type="heading"><span class="glyph">H</span>H1</button>
                    <button class="brick" data-type="text"><span class="glyph">≡</span>TEXT</button>
                    <button class="brick" data-type="link"><span class="glyph">↗</span>LINK</button>
                    <button class="brick" data-type="button"><span class="glyph">●</span>BTN</button>
                    <button class="brick" data-type="empty"><span class="glyph">×</span>ERASE</button>
                </div>
            </div>
        </div>
        <!-- ROW 2: View controls -->
        <div class="header-row">
            <button class="toolbtn" id="exportBtn" title="Export JSON">JSON</button>
            <button class="toolbtn" id="importBtn" title="Import JSON">IMPORT</button>
            <div class="divider"></div>
            <div class="tog" title="Zoom">
                <label>Z</label>
                <input id="zoom" type="range" min="60" max="160" value="100" style="width:60px;">
            </div>
            <div class="tog" title="Flow overlay">
                <label>FLOW</label>
                <input id="flowToggle" type="checkbox" checked>
            </div>
            <div class="tog" title="Focus mode">
                <label>FOCUS</label>
                <input id="focusToggle" type="checkbox">
            </div>
            <div class="divider"></div>
            <span id="depth-meter" style="color:var(--accent);font-size:10px;">DIV</span>
        </div>
    </header>

    <main>
        <!-- THE MAP (Top) -->
        <div class="grid-viewport">
            <div class="hint-overlay" id="hint" onclick="this.style.display='none'" style="cursor:pointer;">
                <b>WEBSITE BUILDER</b> · Paint → Export HTML · Double-click to edit · <span style="opacity:0.5">[click to dismiss]</span>
            </div>

            <div class="grid-shell" id="gridShell">
                <svg class="flow-layer" id="flowLayer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
                <div class="grid-layer" id="grid"></div>
            </div>
        </div>

        <!-- THE TERRITORY (Bottom) -->
        <div class="source-panel">
            <div class="source-header">
                <div class="header-left">
                    <span>SOURCE ∥ PREVIEW ∥ STATE</span>
                    <div class="tabs" role="tablist">
                        <button class="tab active" id="tab-source" data-pane="pane-source">SOURCE</button>
                        <button class="tab" id="tab-preview" data-pane="pane-preview">PREVIEW</button>
                        <button class="tab" id="tab-state" data-pane="pane-state">STATE</button>
                    </div>
                </div>
                <span id="node-count">0 BRICKS</span>
            </div>

            <div class="panes">
                <div class="pane active" id="pane-source">
                    <div id="source-stream"></div>
                </div>

                <div class="pane" id="pane-preview">
                    <div class="preview-panel">
                        <div class="preview-label-row">
                            <span>LIVE PREVIEW</span>
                            <span class="preview-hint">grid → bricks → HTML</span>
                        </div>
                        <div class="preview-surface" id="preview-surface"></div>
                        <div class="preview-meta" id="preview-meta">No bricks yet. Click a brick in the palette, then paint cells on the grid.</div>
                    </div>
                </div>

                <div class="pane" id="pane-state">
                    <div class="state-panel">
                        <div class="state-row" id="statePills"></div>
                        <div class="jsonbox" id="stateJson">{
  "status": "INIT"
}</div>
                        <div class="log" id="log"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Export/Import Modal -->
    <div class="modal" id="modal" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-head">
                <b id="modalTitle">EXPORT</b>
                <button class="x" id="modalClose" title="Close">×</button>
            </div>
            <div class="modal-body">
                <textarea id="modalText" spellcheck="false"></textarea>
                <div class="modal-actions" id="modalActions"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">OK</div>

    <!-- Iframe Preview Modal -->
    <div class="modal" id="iframeModal" aria-hidden="true">
        <div class="modal-card" style="width: min(95vw, 1200px); max-height: 95vh;">
            <div class="modal-head">
                <b id="iframeModalTitle">PREVIEW</b>
                <div style="display:flex;gap:8px;">
                    <button class="toolbtn" id="iframeNewTab">OPEN IN NEW TAB</button>
                    <button class="toolbtn" id="iframeDownload">DOWNLOAD .HTML</button>
                    <button class="x" id="iframeModalClose" title="Close">×</button>
                </div>
            </div>
            <div style="flex:1;display:flex;min-height:0;">
                <iframe id="previewIframe" style="flex:1;border:none;background:#fff;"></iframe>
            </div>
        </div>
    </div>

<script>
// HYPER_GRID Media for Thinking the Unthinkable
(function() {
    const GRID_SIZE = 9;
    const CELL_COUNT = GRID_SIZE * GRID_SIZE;
    const STORAGE_KEY = 'HYPER_GRID_v2.snapshot';

    // Code-aware brick types with semantic colors (inspired by INTERACTIVE_CODE_ENVIRONMENT)
    const BRICK_TYPES = {
        // CODE LAYER - JS
        func:    { id: 'func',    label: 'ƒ',     tag: 'div',    className: 'func-block',    glyph: 'ƒ', defaultText: 'function', spanW: 1, spanH: 1, color: '#fff', bg: '#f43f5e' },
        variable:{ id: 'variable',label: 'VAR',   tag: 'div',    className: 'var-block',     glyph: '=', defaultText: 'var', spanW: 1, spanH: 1, color: '#fff', bg: '#2dd4bf' },
        control: { id: 'control', label: 'CTRL',  tag: 'div',    className: 'ctrl-block',    glyph: '⟳', defaultText: 'if', spanW: 1, spanH: 1, color: '#000', bg: '#fbbf24' },
        // MARKUP LAYER - HTML
        tag:     { id: 'tag',     label: 'TAG',   tag: 'div',    className: 'tag-block',     glyph: '<>', defaultText: 'div', spanW: 1, spanH: 1, color: '#fff', bg: '#8b5cf6' },
        heading: { id: 'heading', label: 'H1',    tag: 'h1',     className: 'heading-block', glyph: 'H', defaultText: 'Heading', spanW: 2, spanH: 1, color: '#0f172a', bg: '#fff' },
        text:    { id: 'text',    label: 'TEXT',  tag: 'p',      className: 'text-block',    glyph: '≡', defaultText: 'Text', spanW: 1, spanH: 1, color: '#334155', bg: '#fffbeb' },
        link:    { id: 'link',    label: 'LINK',  tag: 'a',      className: 'link-block',    glyph: '↗', defaultText: 'Link', spanW: 1, spanH: 1, color: '#2563eb', bg: '#eff6ff' },
        // STYLE LAYER - CSS
        style:   { id: 'style',   label: 'CSS',   tag: 'div',    className: 'style-block',   glyph: '#', defaultText: '.class', spanW: 1, spanH: 1, color: '#fff', bg: '#ec4899' },
        // STRUCTURAL
        layout:  { id: 'layout',  label: 'DIV',   tag: 'div',    className: 'layout-block',  glyph: '▢', defaultText: '', spanW: 1, spanH: 1, color: '#94a3b8', bg: '#f1f5f9' },
        button:  { id: 'button',  label: 'BTN',   tag: 'button', className: 'btn-block',     glyph: '●', defaultText: 'Button', spanW: 1, spanH: 1, color: '#fff', bg: '#2563eb' },
        input:   { id: 'input',   label: 'INPUT', tag: 'input',  className: 'input-block',   glyph: '▭', defaultText: 'placeholder', spanW: 2, spanH: 1, color: '#64748b', bg: '#fff' },
        image:   { id: 'image',   label: 'IMG',   tag: 'img',    className: 'img-block',     glyph: '◫', defaultText: '', spanW: 1, spanH: 1, color: '#64748b', bg: '#e2e8f0' },
        nav:     { id: 'nav',     label: 'NAV',   tag: 'nav',    className: 'nav-block',     glyph: '☰', defaultText: 'Menu', spanW: 3, spanH: 1, color: '#fff', bg: '#0f172a' },
        empty:   { id: 'empty',   label: 'EMPTY', tag: null,     className: '',              glyph: '×', defaultText: '', spanW: 1, spanH: 1, color: '#333', bg: 'transparent' }
    };

    // --- State ---
    let currentBrickType = 'layout';
    const gridState = Array.from({ length: CELL_COUNT }, () => ({ type: 'empty', props: {} }));
    const stamp = new Array(CELL_COUNT).fill(0); // last-changed timestamp for flow ordering
    let clock = 1;

    let selectedIdx = -1;

    // Undo/redo
    const undoStack = [];
    const redoStack = [];

    // Interaction batching
    let painting = false;
    let strokeCheckpointed = false;

    // Visibility toggles
    let flowEnabled = true;
    let focusEnabled = false;

    // Action log (Surfacing the invisible)
    const actionLog = [];

    // DOM
    const gridEl = document.getElementById('grid');
    const gridShell = document.getElementById('gridShell');
    const flowLayer = document.getElementById('flowLayer');
    const sourceEl = document.getElementById('source-stream');
    const depthMeter = document.getElementById('depth-meter');
    const nodeCountEl = document.getElementById('node-count');
    const paletteEl = document.getElementById('palette');
    const previewSurface = document.getElementById('preview-surface');
    const previewMeta = document.getElementById('preview-meta');

    const zoomEl = document.getElementById('zoom');
    const flowToggle = document.getElementById('flowToggle');
    const focusToggle = document.getElementById('focusToggle');

    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const saveBtn = document.getElementById('saveBtn');
    const loadBtn = document.getElementById('loadBtn');
    const exportBtn = document.getElementById('exportBtn');
    const exportHtmlBtn = document.getElementById('exportHtmlBtn');
    const previewIframeBtn = document.getElementById('previewIframeBtn');
    const importBtn = document.getElementById('importBtn');
    const importHtmlBtn = document.getElementById('importHtmlBtn');
    
    const iframeModal = document.getElementById('iframeModal');
    const previewIframe = document.getElementById('previewIframe');
    const iframeNewTab = document.getElementById('iframeNewTab');
    const iframeDownload = document.getElementById('iframeDownload');
    const iframeModalClose = document.getElementById('iframeModalClose');
    
    let currentHtmlBlob = null;
    
    const paletteToggle = document.getElementById('paletteToggle');

    const tabs = document.querySelectorAll('.tab');
    const panes = document.querySelectorAll('.pane');

    const statePills = document.getElementById('statePills');
    const stateJson = document.getElementById('stateJson');
    const logEl = document.getElementById('log');

    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const modalActions = document.getElementById('modalActions');
    const modalClose = document.getElementById('modalClose');

    const toast = document.getElementById('toast');

    // ---------- Utilities ----------
    function nowStamp() { return clock++; }

    function cloneGridState(src) {
        // Avoid structuredClone for older envs; grid is tiny.
        return src.map(c => ({ type: c.type, props: { ...c.props } }));
    }

    function toastMsg(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        window.clearTimeout(toast._t);
        toast._t = window.setTimeout(() => toast.classList.remove('show'), 900);
    }

    function logAction(kind, payload) {
        const entry = {
            t: new Date().toLocaleTimeString(),
            kind,
            ...payload
        };
        actionLog.unshift(entry);
        if (actionLog.length > 12) actionLog.length = 12;
    }

    function setActivePane(id) {
        panes.forEach(p => p.classList.toggle('active', p.id === id));
        tabs.forEach(t => t.classList.toggle('active', t.dataset.pane === id));
    }

    // ---------- HUD / palette ----------
    function updateHUD() {
        const def = BRICK_TYPES[currentBrickType];
        if (depthMeter) depthMeter.textContent = def ? def.label : currentBrickType.toUpperCase();
        if (undoBtn) undoBtn.style.opacity = undoStack.length ? '1' : '0.55';
        if (redoBtn) redoBtn.style.opacity = redoStack.length ? '1' : '0.55';
    }

    function setCurrentBrickType(type) {
        if (!BRICK_TYPES[type]) return;
        currentBrickType = type;
        updateHUD();
        if (!paletteEl) return;
        const buttons = paletteEl.querySelectorAll('.brick');
        buttons.forEach(btn => {
            const t = btn.getAttribute('data-type');
            btn.classList.toggle('active', t === type);
        });
        // Update toggle button text
        const def = BRICK_TYPES[type];
        if (paletteToggle && def) {
            paletteToggle.textContent = def.glyph + ' ' + def.label + ' ▾';
        }
        // Close dropdown
        if (paletteEl) paletteEl.classList.remove('open');
    }
    
    function togglePalette() {
        if (paletteEl) paletteEl.classList.toggle('open');
    }

    // ---------- Undo / redo ----------
    function pushCheckpoint(reason) {
        undoStack.push({ grid: cloneGridState(gridState), stamp: stamp.slice(), clock, selectedIdx });
        if (undoStack.length > 80) undoStack.shift();
        redoStack.length = 0;
        logAction('checkpoint', { reason });
        updateHUD();
    }

    function restoreSnapshot(snap) {
        if (!snap) return;
        const g = snap.grid;
        for (let i = 0; i < CELL_COUNT; i++) {
            gridState[i].type = g[i].type;
            gridState[i].props = { ...g[i].props };
            stamp[i] = snap.stamp[i];
        }
        clock = snap.clock || clock;
        selectedIdx = typeof snap.selectedIdx === 'number' ? snap.selectedIdx : -1;
    }

    function undo() {
        if (!undoStack.length) return;
        const prev = undoStack.pop();
        redoStack.push({ grid: cloneGridState(gridState), stamp: stamp.slice(), clock, selectedIdx });
        restoreSnapshot(prev);
        logAction('undo', { });
        updateAll();
        toastMsg('UNDO');
    }

    function redo() {
        if (!redoStack.length) return;
        const next = redoStack.pop();
        undoStack.push({ grid: cloneGridState(gridState), stamp: stamp.slice(), clock, selectedIdx });
        restoreSnapshot(next);
        logAction('redo', { });
        updateAll();
        toastMsg('REDO');
    }

    // ---------- Painting ----------
    function setCell(index, type, toggle) {
        const prev = gridState[index].type;
        let next = type;
        if (toggle && prev === type) next = 'empty';

        if (prev === next) return;

        gridState[index].type = next;
        gridState[index].props = gridState[index].props || {};
        stamp[index] = next === 'empty' ? 0 : nowStamp();

        logAction('paint', { idx: index, prev, next });
    }

    function selectCell(index) {
        selectedIdx = index;
        logAction('select', { idx: index });
        renderSelectionSync();
        renderState();
    }

    function editCellText(index) {
        const cell = gridState[index];
        if (!cell || cell.type === 'empty') return;
        
        const def = BRICK_TYPES[cell.type] || BRICK_TYPES.layout;
        
        // Open edit modal with all properties
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        modalTitle.textContent = 'EDIT ' + def.label + ' [' + Math.floor(index/9) + ',' + (index%9) + ']';
        
        const p = cell.props;
        modalText.value = [
            'text: ' + (p.text || def.defaultText),
            'bg: ' + (p.bg || ''),
            'color: ' + (p.color || ''),
            'href: ' + (p.href || ''),
            'spanW: ' + (p.spanW || 1),
            'spanH: ' + (p.spanH || 1)
        ].join('\n');
        
        modalActions.innerHTML = '';
        
        const save = document.createElement('button');
        save.className = 'toolbtn primary';
        save.textContent = 'SAVE';
        save.addEventListener('click', () => {
            pushCheckpoint('edit-cell');
            // Parse the textarea
            const lines = modalText.value.split('\n');
            lines.forEach(line => {
                const [key, ...rest] = line.split(':');
                const val = rest.join(':').trim();
                if (key && key.trim()) {
                    const k = key.trim();
                    if (k === 'text') cell.props.text = val;
                    else if (k === 'bg') cell.props.bg = val;
                    else if (k === 'color') cell.props.color = val;
                    else if (k === 'href') cell.props.href = val;
                    else if (k === 'spanW') cell.props.spanW = parseInt(val) || 1;
                    else if (k === 'spanH') cell.props.spanH = parseInt(val) || 1;
                }
            });
            logAction('edit', { idx: index });
            closeModal();
            updateAll();
        });
        
        modalActions.appendChild(save);
    }

    function cellCoord(index) {
        return {
            row: Math.floor(index / GRID_SIZE),
            col: index % GRID_SIZE
        };
    }

    // ---------- Rendering: grid ----------
    function renderGrid() {
        gridEl.innerHTML = '';
        const anyFilled = gridState.some(c => c.type !== 'empty');

        gridState.forEach((cellState, index) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.index = String(index);

            const { row, col } = cellCoord(index);

            if (!cellState || cellState.type === 'empty') {
                cell.classList.add('empty');
                if (focusEnabled && anyFilled) cell.classList.add('dimmed');
                cell.innerHTML = '';
            } else {
                const def = BRICK_TYPES[cellState.type] || BRICK_TYPES.empty;
                cell.classList.add(cellState.type);

                const order = stamp[index] ? String(stamp[index]).padStart(2, '0') : '--';
                const cellText = cellState.props.text || def.defaultText || '';
                const displayText = cellText.length > 12 ? cellText.slice(0, 11) + '…' : cellText;
                
                // Use custom colors if set, otherwise use type defaults
                const bg = cellState.props.bg || def.bg || '';
                const color = cellState.props.color || def.color || '#888';
                const href = cellState.props.href || '';
                
                // Apply type-specific styling to the cell itself
                cell.style.borderColor = bg !== 'transparent' ? bg : '#333';
                cell.style.borderLeftWidth = '3px';
                cell.style.borderLeftColor = bg !== 'transparent' ? bg : def.color;
                
                let bodyStyle = 'font-size:9px;justify-content:center;text-align:center;flex:1;display:flex;align-items:center;';
                bodyStyle += 'background:' + bg + ';border-radius:3px;margin:2px;';
                bodyStyle += 'color:' + color + ';';

                cell.innerHTML = `
                    <div class="cell-header">
                        <span class="cell-tag" style="color:${def.color};background:${def.bg};padding:1px 3px;border-radius:2px;">${def.label}${href ? '↗' : ''}</span>
                        <span class="cell-idx">${row},${col}</span>
                    </div>
                    <div class="cell-body" style="${bodyStyle}">
                        ${displayText ? '<div style="padding:2px;">' + escapeHtml(displayText) + '</div>' : ''}
                    </div>
                    <div class="cell-footer">T${order}</div>
                `;
            }

            if (index === selectedIdx && cellState.type !== 'empty') {
                cell.classList.add('selected');
            }

            cell.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                painting = true;
                strokeCheckpointed = false;

                if (!strokeCheckpointed) {
                    pushCheckpoint('stroke');
                    strokeCheckpointed = true;
                }

                setCell(index, currentBrickType, true);
                selectCell(index);
                updateAll();

                // Capture pointer so pointerup happens reliably
                try { cell.setPointerCapture(e.pointerId); } catch (_) {}
            });

            cell.addEventListener('pointerenter', (e) => {
                if (!painting) return;
                if (e.buttons === 0) return;
                if (!strokeCheckpointed) {
                    pushCheckpoint('stroke');
                    strokeCheckpointed = true;
                }
                // Drag painting is SET, not TOGGLE
                setCell(index, currentBrickType, false);
                selectCell(index);
                updateAll();
            });

            cell.addEventListener('pointerup', () => {
                painting = false;
                strokeCheckpointed = false;
            });

            cell.addEventListener('click', () => {
                // click fallback for non-pointer browsers
                selectCell(index);
            });

            // Double-click to edit text
            cell.addEventListener('dblclick', (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (cellState.type === 'empty') return;
                editCellText(index);
            });

            gridEl.appendChild(cell);
        });
    }

    // ---------- Rendering: source + preview ----------
    function renderSourceAndPreview() {
        sourceEl.innerHTML = '';
        previewSurface.innerHTML = '';

        const lines = [];
        lines.push('<div class="hyper-grid-page">');

        let brickCount = 0;

        // We create an "ordered" list by stamp, not by index (so flow and code order coincide)
        const filled = [];
        for (let i = 0; i < CELL_COUNT; i++) {
            if (gridState[i].type !== 'empty' && stamp[i] > 0) filled.push(i);
        }
        filled.sort((a, b) => stamp[a] - stamp[b]);

        filled.forEach((index) => {
            const cellState = gridState[index];
            const def = BRICK_TYPES[cellState.type];
            if (!def || !def.tag) return;
            const { row, col } = cellCoord(index);
            const text = cellState.props.text || def.defaultText;
            const line = `  <${def.tag} class="${def.className}" data-cell="${row},${col}">${text}</${def.tag}>`;
            lines.push(line);
            brickCount++;
        });

        lines.push('</div>');

        // Source lines
        let lineNo = 1;
        lines.forEach((text) => {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'source-line';
            lineDiv.dataset.ln = String(lineNo);

            const ln = document.createElement('div');
            ln.className = 'ln';
            ln.textContent = String(lineNo++).padStart(2, '0');

            const code = document.createElement('div');
            code.className = 'code';
            code.textContent = text;

            lineDiv.appendChild(ln);
            lineDiv.appendChild(code);
            sourceEl.appendChild(lineDiv);
        });

        nodeCountEl.textContent = brickCount + ' BRICKS';

        // Preview
        if (brickCount === 0) {
            previewMeta.textContent = 'No bricks yet. Click a brick in the palette, then paint cells on the grid.';
            renderState();
            renderFlow();
            return;
        }

        filled.forEach((index) => {
            const cellState = gridState[index];
            const def = BRICK_TYPES[cellState.type];
            if (!def || !def.tag) return;
            const { row, col } = cellCoord(index);
            const text = cellState.props.text || def.defaultText;

            const node = document.createElement('div');
            node.className = 'preview-node';
            node.dataset.index = String(index);

            node.innerHTML = `
                <span class="type">${def.label}</span>
                <span class="txt">${escapeHtml(text)}</span>
                <span class="coord">${row},${col}</span>
            `;

            node.addEventListener('mouseenter', () => {
                selectCell(index);
                renderSelectionSync();
            });
            node.addEventListener('click', () => {
                setActivePane('pane-preview');
                selectCell(index);
                renderSelectionSync();
            });

            previewSurface.appendChild(node);
        });

        previewMeta.textContent = 'Preview is a structural echo of your brush-strokes. Order is driven by the flow timestamps (Txx).';

        renderState();
        renderFlow();
        renderSelectionSync();
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // ---------- Rendering: state (invisible surfaced) ----------
    function renderState() {
        const counts = { layout: 0, button: 0, text: 0 };
        let filledCount = 0;
        for (let i = 0; i < CELL_COUNT; i++) {
            const t = gridState[i].type;
            if (t !== 'empty') {
                filledCount++;
                if (counts[t] !== undefined) counts[t]++;
            }
        }

        const sel = selectedIdx >= 0 ? gridState[selectedIdx] : null;
        const selCoord = selectedIdx >= 0 ? cellCoord(selectedIdx) : null;

        // pills
        statePills.innerHTML = '';
        const pills = [
            { k: 'filled', v: filledCount },
            { k: 'div', v: counts.layout },
            { k: 'btn', v: counts.button },
            { k: 'text', v: counts.text },
            { k: 'undo', v: undoStack.length },
            { k: 'redo', v: redoStack.length },
            { k: 'selected', v: selectedIdx >= 0 ? (selCoord.row + ',' + selCoord.col) : '—' }
        ];
        pills.forEach(p => {
            const el = document.createElement('div');
            el.className = 'pill';
            el.innerHTML = `<span class="k">${p.k}</span><b>${p.v}</b>`;
            statePills.appendChild(el);
        });

        // symbol view
        const snapshot = exportSnapshot(false);
        const brief = {
            version: snapshot.version,
            meta: snapshot.meta,
            selection: snapshot.selection,
            bricks: snapshot.bricks,
            order: snapshot.order
        };
        stateJson.textContent = JSON.stringify(brief, null, 2);

        // log view
        logEl.innerHTML = '<div class="item"><div class="a"><b>RECENT ACTIONS</b></div><div class="t">(surfacing the invisible)</div></div>';
        actionLog.slice(0, 10).forEach((a) => {
            const div = document.createElement('div');
            div.className = 'item';
            if (a.kind === 'paint') {
                const c = cellCoord(a.idx);
                div.innerHTML = `<div class="a">${a.kind} <b>${a.prev}</b>→<b>${a.next}</b> @ ${c.row},${c.col}</div><div class="t">${a.t}</div>`;
            } else if (a.kind === 'select') {
                const c = cellCoord(a.idx);
                div.innerHTML = `<div class="a">select @ ${c.row},${c.col}</div><div class="t">${a.t}</div>`;
            } else {
                div.innerHTML = `<div class="a">${a.kind}${a.reason ? ' — ' + a.reason : ''}</div><div class="t">${a.t}</div>`;
            }
            logEl.appendChild(div);
        });
    }

    // ---------- Rendering: flow overlay ----------
    function renderFlow() {
        flowLayer.innerHTML = '';
        if (!flowEnabled) return;

        const indices = [];
        for (let i = 0; i < CELL_COUNT; i++) {
            if (gridState[i].type !== 'empty' && stamp[i] > 0) indices.push(i);
        }
        indices.sort((a, b) => stamp[a] - stamp[b]);
        if (indices.length < 2) return;

        // Use viewBox 0..100 so drawing is easy.
        const pts = indices.map((idx) => {
            const { row, col } = cellCoord(idx);
            const x = (col + 0.5) * (100 / GRID_SIZE);
            const y = (row + 0.5) * (100 / GRID_SIZE);
            return { idx, x, y };
        });

        // Path
        const d = pts.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('class', 'flow-path');
        flowLayer.appendChild(path);

        // Dots
        pts.forEach((p, i) => {
            const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            c.setAttribute('cx', String(p.x));
            c.setAttribute('cy', String(p.y));
            c.setAttribute('r', i === pts.length - 1 ? '1.8' : '1.4');
            c.setAttribute('class', 'flow-dot');
            c.style.opacity = i === pts.length - 1 ? '1' : '0.55';
            flowLayer.appendChild(c);
        });
    }

    // ---------- Selection sync (links perspectives) ----------
    function renderSelectionSync() {
        const cells = gridEl.querySelectorAll('.cell');
        cells.forEach((c) => {
            const idx = Number(c.dataset.index);
            c.classList.toggle('selected', idx === selectedIdx && gridState[idx].type !== 'empty');
        });

        document.querySelectorAll('.source-line.active').forEach(l => l.classList.remove('active'));
        document.querySelectorAll('.preview-node.active').forEach(n => n.classList.remove('active'));

        if (selectedIdx < 0) return;

        // In source, selection corresponds to its order line if the selected idx is present.
        const filled = [];
        for (let i = 0; i < CELL_COUNT; i++) {
            if (gridState[i].type !== 'empty' && stamp[i] > 0) filled.push(i);
        }
        filled.sort((a, b) => stamp[a] - stamp[b]);
        const orderPos = filled.indexOf(selectedIdx);
        if (orderPos >= 0) {
            // +2: first line is <div class=...>, then the brick lines start
            const ln = orderPos + 2;
            const linesEls = sourceEl.querySelectorAll('.source-line');
            const target = linesEls[ln - 1];
            if (target) {
                target.classList.add('active');
                target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        const pn = previewSurface.querySelector(`.preview-node[data-index="${selectedIdx}"]`);
        if (pn) {
            pn.classList.add('active');
            pn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    // ---------- Export / import (abstract & generalize) ----------
    function exportSnapshot(includeRawGrid) {
        const bricks = [];
        const order = [];
        const filled = [];
        for (let i = 0; i < CELL_COUNT; i++) {
            if (gridState[i].type !== 'empty' && stamp[i] > 0) filled.push(i);
        }
        filled.sort((a, b) => stamp[a] - stamp[b]);

        filled.forEach((idx) => {
            const { row, col } = cellCoord(idx);
            bricks.push({ idx, row, col, type: gridState[idx].type, text: gridState[idx].props.text || '' });
            order.push({ idx, t: stamp[idx] });
        });

        const snap = {
            version: '2.1',
            meta: {
                grid: GRID_SIZE + 'x' + GRID_SIZE,
                createdAt: new Date().toISOString()
            },
            selection: selectedIdx,
            bricks,
            order
        };

        if (includeRawGrid) {
            snap.raw = {
                grid: cloneGridState(gridState),
                stamp: stamp.slice(),
                clock
            };
        }

        return snap;
    }

    function importSnapshot(jsonText) {
        const obj = JSON.parse(jsonText);
        const raw = obj && obj.raw;

        // Prefer raw (lossless)
        if (raw && Array.isArray(raw.grid) && Array.isArray(raw.stamp)) {
            for (let i = 0; i < CELL_COUNT; i++) {
                const c = raw.grid[i] || { type: 'empty', props: {} };
                gridState[i].type = BRICK_TYPES[c.type] ? c.type : 'empty';
                gridState[i].props = { ...(c.props || {}) };
                stamp[i] = Number(raw.stamp[i] || 0);
            }
            clock = Number(raw.clock || clock);
            selectedIdx = typeof obj.selection === 'number' ? obj.selection : -1;
            return;
        }

        // Otherwise rebuild from bricks list
        if (!obj || !Array.isArray(obj.bricks)) throw new Error('Invalid snapshot');

        // Clear
        for (let i = 0; i < CELL_COUNT; i++) {
            gridState[i].type = 'empty';
            gridState[i].props = {};
            stamp[i] = 0;
        }
        clock = 1;

        // Apply bricks in order list if provided
        const bricks = obj.bricks.slice();
        const ord = Array.isArray(obj.order) ? obj.order.slice() : [];
        const idxToT = new Map(ord.map(o => [o.idx, o.t]));

        bricks.forEach((b) => {
            if (typeof b.idx !== 'number') return;
            const t = BRICK_TYPES[b.type] ? b.type : 'layout';
            gridState[b.idx].type = t;
            gridState[b.idx].props = { text: b.text || '' };
            stamp[b.idx] = Number(idxToT.get(b.idx) || nowStamp());
        });

        selectedIdx = typeof obj.selection === 'number' ? obj.selection : -1;
    }

    function saveToLocal() {
        const snap = exportSnapshot(true);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snap));
        toastMsg('SAVED');
        logAction('save', {});
        renderState();
    }

    function loadFromLocal() {
        const s = localStorage.getItem(STORAGE_KEY);
        if (!s) {
            toastMsg('NO SAVE');
            return;
        }
        pushCheckpoint('load');
        importSnapshot(s);
        toastMsg('LOADED');
        logAction('load', {});
        updateAll();
    }

        modal.setAttribute('aria-hidden', 'false');
        modalActions.innerHTML = '';

            copy.className = 'toolbtn primary';
            copy.textContent = 'COPY';
            copy.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(modalText.value);

                } catch (_) {
                    toastMsg('COPY FAILED');
                }
            });

            modalActions.appendChild(copy);
        } else {
            modalTitle.textContent = 'IMPORT SNAPSHOT';
            modalText.value = '';

            const apply = document.createElement('button');
            apply.className = 'toolbtn primary';
            apply.textContent = 'APPLY';

                    importSnapshot(modalText.value);
                    toastMsg('IMPORTED');
                    logAction('import', {});
                    closeModal();
                    updateAll();

        }

    // ---------- HTML Export (standalone file) ----------
    function generateStandaloneHtml() {
        const filled = [];
        for (let i = 0; i < CELL_COUNT; i++) {
            if (gridState[i].type !== 'empty' && stamp[i] > 0) filled.push(i);
        }

        let bodyContent = '';
        filled.forEach((idx) => {
            const { row, col } = cellCoord(idx);
            const cell = gridState[idx];
            const def = BRICK_TYPES[cell.type] || BRICK_TYPES.layout;
            const text = cell.props.text || def.defaultText;
            const spanW = cell.props.spanW || def.spanW || 1;
            const spanH = cell.props.spanH || def.spanH || 1;
            const bg = cell.props.bg || '';
            const color = cell.props.color || '';
            
            // CSS Grid positioning (1-indexed)
            const gridRow = (row + 1);
            const gridCol = (col + 1);
            // Use custom colors or fall back to type defaults
            const finalBg = bg || def.bg || '#fff';
            const finalColor = color || def.color || '#333';
            let style = 'grid-row: ' + gridRow + ' / span ' + spanH + '; grid-column: ' + gridCol + ' / span ' + spanW + ';';
            style += ' background: ' + finalBg + ';';
            style += ' color: ' + finalColor + ';';
            
            const tag = def.tag;
            if (tag === 'div') {
                bodyContent += '  <div class="' + def.className + '" style="' + style + '">' + text + '<' + '/div>\n';
            } else if (tag === 'button') {
                bodyContent += '  <button class="' + def.className + '" style="' + style + '">' + text + '<' + '/button>\n';
            } else if (tag === 'p') {
                bodyContent += '  <p class="' + def.className + '" style="' + style + '">' + text + '<' + '/p>\n';
            } else if (tag === 'h1') {
                bodyContent += '  <h1 class="' + def.className + '" style="' + style + '">' + text + '<' + '/h1>\n';
            } else if (tag === 'input') {
                bodyContent += '  <input class="' + def.className + '" style="' + style + '" placeholder="' + text + '">\n';
            } else if (tag === 'img') {
                bodyContent += '  <div class="' + def.className + '" style="' + style + '">IMG<' + '/div>\n';
            } else if (tag === 'nav') {
                bodyContent += '  <nav class="' + def.className + '" style="' + style + '">' + text + '<' + '/nav>\n';
            } else if (tag === 'a') {
                const href = cell.props.href || '#';
                bodyContent += '  <a class="' + def.className + '" href="' + href + '" style="' + style + '">' + text + '<' + '/a>\n';
            }
        });

        const timestamp = new Date().toISOString().slice(0,19).replace(/[T:]/g, '-');
        
        // Build HTML as array to avoid closing tag issues in script
        const lines = [
            '<!DOCTYPE html>',
            '<html lang="en">',
            '<head>',
            '  <meta charset="UTF-8">',
            '  <meta name="viewport" content="width=device-width, initial-scale=1.0">',
            '  <title>HYPER_GRID Export - ' + timestamp + '<' + '/title>',
            '  <style>',
            '    * { box-sizing: border-box; margin: 0; padding: 0; }',
            '    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; min-height: 100vh; }',
            '    .grid-page { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, minmax(60px, auto)); gap: 8px; max-width: 900px; margin: 0 auto; padding: 20px; min-height: 100vh; }',
            '    .layout-block { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; display: flex; align-items: center; justify-content: center; }',
            '    .btn-block { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }',
            '    .btn-block:hover { background: #1d4ed8; transform: translateY(-1px); }',
            '    .text-block { color: #334155; font-size: 14px; line-height: 1.6; padding: 12px; display: flex; align-items: center; }',
            '    .heading-block { font-size: 24px; font-weight: 700; color: #0f172a; padding: 16px; display: flex; align-items: center; }',
            '    .input-block { border: 2px solid #e2e8f0; border-radius: 8px; padding: 12px 16px; font-size: 14px; background: #fff; }',
            '    .input-block:focus { border-color: #2563eb; outline: none; }',
            '    .img-block { background: #e2e8f0; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 12px; }',
            '    .nav-block { background: #0f172a; color: #fff; padding: 16px 24px; border-radius: 8px; display: flex; align-items: center; font-weight: 600; }',
            '    .link-block { color: #2563eb; text-decoration: none; font-weight: 500; display: flex; align-items: center; padding: 8px; }',
            '    .link-block:hover { text-decoration: underline; }',
            '  <' + '/style>',
            '<' + '/head>',
            '<body>',
            '<div class="grid-page">',
            bodyContent,
            '<' + '/div>',
            '<!-- Generated by HYPER_GRID at ' + timestamp + ' -->',
            '<!-- Brick count: ' + filled.length + ' -->',
            '<' + '/body>',
            '<' + '/html>'
        ];
        return lines.join('\n');
    }

    // ---------- HTML Import / Gridify ----------
    function openGridifyModal() {
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        modalActions.innerHTML = '';
        modalTitle.textContent = 'GRIDIFY HTML';
        modalText.value = '';
        modalText.placeholder = 'Paste HTML here to place elements on the grid...';

        const apply = document.createElement('button');
        apply.className = 'toolbtn primary';
        apply.textContent = 'GRIDIFY';
        apply.addEventListener('click', () => {
            try {
                pushCheckpoint('gridify');
                gridifyHtml(modalText.value);
                toastMsg('GRIDIFIED');
                logAction('gridify', {});
                closeModal();
                updateAll();
            } catch (e) {
                toastMsg('PARSE ERROR');
                console.error(e);
            }
        });

        modalActions.appendChild(apply);
    }

    function gridifyHtml(htmlStr) {
        pushCheckpoint('gridify');
        
        // Clear grid
        gridState.forEach((_, i) => {
            gridState[i] = { type: 'empty', props: {} };
            stamp[i] = 0;
        });
        
        const entities = [];
        
        // ========== LAYER 1: CSS PARSER ==========
        const styleMatches = htmlStr.match(/<style[^>]*>([\s\S]*?)<\/style>/gi) || [];
        styleMatches.forEach(styleBlock => {
            const css = styleBlock.replace(/<\/?style[^>]*>/gi, '');
            // Extract CSS variables
            const varMatches = css.match(/--[\w-]+:\s*[^;]+/g) || [];
            varMatches.slice(0, 10).forEach(v => {
                const [name, value] = v.split(':').map(s => s.trim());
                entities.push({ type: 'style', text: name, fullText: v, layer: 'css', priority: 3 });
            });
            // Extract selectors
            const selectorMatches = css.match(/([.#][\w-]+)\s*\{/g) || [];
            selectorMatches.slice(0, 15).forEach(s => {
                const sel = s.replace(/\s*\{/, '');
                entities.push({ type: 'style', text: sel, fullText: sel, layer: 'css', priority: 2 });
            });
        });
        
        // ========== LAYER 2: JS PARSER ==========
        const scriptMatches = htmlStr.match(/<script[^>]*>([\s\S]*?)<\/script>/gi) || [];
        scriptMatches.forEach(scriptBlock => {
            const js = scriptBlock.replace(/<\/?script[^>]*>/gi, '');
            // Extract functions
            const funcMatches = js.match(/(?:function|class)\s+(\w+)/g) || [];
            funcMatches.forEach(f => {
                const name = f.replace(/(?:function|class)\s+/, '');
                entities.push({ type: 'func', text: name, fullText: f, layer: 'js', priority: 5 });
            });
            // Extract const/let/var declarations
            const varMatches = js.match(/(?:const|let|var)\s+(\w+)/g) || [];
            varMatches.slice(0, 20).forEach(v => {
                const name = v.replace(/(?:const|let|var)\s+/, '');
                entities.push({ type: 'variable', text: name, fullText: v, layer: 'js', priority: 2 });
            });
            // Extract control flow
            const ctrlMatches = js.match(/\b(if|for|while|return|switch|try|catch)\b/g) || [];
            [...new Set(ctrlMatches)].forEach(c => {
                entities.push({ type: 'control', text: c, fullText: c, layer: 'js', priority: 1 });
            });
        });
        
        // ========== LAYER 3: HTML PARSER ==========
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlStr, 'text/html');
        
        const tagMap = {
            'div': 'tag', 'section': 'tag', 'article': 'tag', 'main': 'tag', 'header': 'tag', 'footer': 'tag',
            'nav': 'nav', 'button': 'button', 'a': 'link',
            'p': 'text', 'span': 'text', 'li': 'text',
            'h1': 'heading', 'h2': 'heading', 'h3': 'heading', 'h4': 'heading',
            'input': 'input', 'textarea': 'input', 'img': 'image'
        };
        
        function classifyElement(el) {
            const tag = el.tagName ? el.tagName.toLowerCase() : '';
            const cls = (el.className || '').toLowerCase();
            // Detect semantic intent from class names
            if (cls.includes('narration') || cls.includes('speech') || cls.includes('concept')) return 'text';
            if (cls.includes('header') || cls.includes('title')) return 'heading';
            if (cls.includes('btn') || cls.includes('button')) return 'button';
            return tagMap[tag] || 'tag';
        }
        
        function extractLeaves(el, depth) {
            const children = Array.from(el.children);
            const hasTextChildren = children.some(c => c.textContent && c.textContent.trim());
            const directText = Array.from(el.childNodes).some(n => n.nodeType === 3 && n.textContent.trim());
            
            if (children.length === 0 || directText || !hasTextChildren) {
                const tag = el.tagName ? el.tagName.toLowerCase() : '';
                if (tagMap[tag] && el.textContent) {
                    const text = el.textContent.trim().slice(0, 50);
                    if (text || tag === 'img' || tag === 'input') {
                        const inlineStyle = el.getAttribute('style') || '';
                        let bg = '', color = '';
                        if (inlineStyle) {
                            const bgMatch = inlineStyle.match(/background[^:]*:\s*([^;]+)/i);
                            const colorMatch = inlineStyle.match(/(?:^|[^-])color:\s*([^;]+)/i);
                            if (bgMatch) bg = bgMatch[1].trim();
                            if (colorMatch) color = colorMatch[1].trim();
                        }
                        entities.push({
                            type: classifyElement(el),
                            text: text,
                            fullText: el.textContent.trim().slice(0, 100),
                            layer: 'html',
                            priority: tag.match(/^h[1-6]$/) ? 4 : 2,
                            bg, color,
                            href: el.getAttribute('href') || '',
                            classes: el.className || '',
                            originalTag: tag
                        });
                    }
                }
            } else {
                children.forEach(c => extractLeaves(c, depth + 1));
            }
        }
        
        extractLeaves(doc.body, 0);
        
        // ========== SORT & PLACE ==========
        // Sort by priority (higher first), then by layer order (js, css, html)
        const layerOrder = { js: 0, css: 1, html: 2 };
        entities.sort((a, b) => {
            if (b.priority !== a.priority) return b.priority - a.priority;
            return layerOrder[a.layer] - layerOrder[b.layer];
        });
        
        // Place on grid (max 81)
        const toPlace = entities.slice(0, 81);
        toPlace.forEach((ent, i) => {
            gridState[i] = {
                type: ent.type,
                props: {
                    text: ent.text,
                    fullText: ent.fullText,
                    bg: ent.bg || '',
                    color: ent.color || '',
                    href: ent.href || '',
                    classes: ent.classes || '',
                    originalTag: ent.originalTag || '',
                    layer: ent.layer
                }
            };
            stamp[i] = ++clock;
        });
        
        logAction('gridify', { count: toPlace.length, layers: { js: entities.filter(e => e.layer === 'js').length, css: entities.filter(e => e.layer === 'css').length, html: entities.filter(e => e.layer === 'html').length } });
        updateAll();
    }

    // ---------- Update all ----------
    function updateAll() {
        renderGrid();
        renderSourceAndPreview();
        updateHUD();
    }

    // ---------- Init ----------
    function initPalette() {
        if (!paletteEl) return;
        const buttons = paletteEl.querySelectorAll('.brick');
        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent closing dropdown before selection
                const type = btn.getAttribute('data-type');
                console.log('Brick selected:', type);
                setCurrentBrickType(type);
            });
        });
    }

    function initTabs() {
        tabs.forEach(t => {
            t.addEventListener('click', () => {
                setActivePane(t.dataset.pane);
            });
        });
    }

    function initControls() {
        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);
        saveBtn.addEventListener('click', saveToLocal);
        loadBtn.addEventListener('click', loadFromLocal);
        exportBtn.addEventListener('click', () => openModal('export'));
        exportHtmlBtn.addEventListener('click', openHtmlExportModal);
        previewIframeBtn.addEventListener('click', openIframePreview);
        importBtn.addEventListener('click', () => openModal('import'));
        importHtmlBtn.addEventListener('click', openGridifyModal);

        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        
        // Iframe modal controls
        iframeModalClose.addEventListener('click', closeIframeModal);
        iframeModal.addEventListener('click', (e) => {
            if (e.target === iframeModal) closeIframeModal();
        });
        iframeNewTab.addEventListener('click', openHtmlNewTab);
        iframeDownload.addEventListener('click', downloadHtml);
        
        // Palette dropdown toggle
        if (paletteToggle) {
            paletteToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                togglePalette();
            });
        }
        // Close palette when clicking outside
        document.addEventListener('click', (e) => {
            if (paletteEl && !paletteEl.contains(e.target) && e.target !== paletteToggle && !paletteToggle.contains(e.target)) {
                paletteEl.classList.remove('open');
            }
        });

        zoomEl.addEventListener('input', () => {
            const z = Number(zoomEl.value) / 100;
            document.getElementById('gridShell').querySelector('.grid-layer').style.transform = `scale(${z})`;
            logAction('zoom', { value: z });
        });

        flowToggle.addEventListener('change', () => {
            flowEnabled = !!flowToggle.checked;
            logAction('flow', { enabled: flowEnabled });
            renderFlow();
        });

        focusToggle.addEventListener('change', () => {
            focusEnabled = !!focusToggle.checked;
            logAction('focus', { enabled: focusEnabled });
            renderGrid();
            renderSelectionSync();
        });

        // global pointerup to end painting
        document.addEventListener('pointerup', () => {
            painting = false;
            strokeCheckpointed = false;
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            const mod = e.ctrlKey || e.metaKey;
            if (mod && (e.key === 'z' || e.key === 'Z')) {
                e.preventDefault();
                if (e.shiftKey) redo();
                else undo();
            }
        });
    }

    // --- Smoke tests (expanded) ---
    function runSmokeTests() {
        try {
            console.assert(typeof init_core === 'function', 'init_core should be defined');
            console.assert(gridEl instanceof HTMLElement, 'grid element should exist');
            console.assert(previewSurface instanceof HTMLElement, 'preview surface should exist');
            console.assert(Array.isArray(gridState) && gridState.length === CELL_COUNT, 'gridState sized to GRID_SIZE^2');
            console.assert(typeof exportSnapshot === 'function', 'exportSnapshot should exist');
            const s = exportSnapshot(true);
            console.assert(s && s.meta && Array.isArray(s.raw.grid), 'exportSnapshot(true) should include raw.grid');
        } catch (err) {
            console.warn('HYPER_GRID smoke tests encountered an error:', err);
        }
    }

    function init() {
        initPalette();
        initTabs();
        initControls();

        setCurrentBrickType('layout');
        updateHUD();
        logAction('boot', { version: '2.1' });
        updateAll();
        renderState();
        renderFlow();
        runSmokeTests();

        // Apply initial zoom
        zoomEl.dispatchEvent(new Event('input'));
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

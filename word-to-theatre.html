<html lang="en">
<head>

<title>WORD-TO-THEATRE / PRODUCTION</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23ffdf2b'/%3E%3Cpath d='M15 43h34M20 33h24M25 23h14' stroke='%23000' stroke-width='5'/%3E%3C/svg%3E">
<style>
:root{--ink:#0a0a09;--paper:#faf9f4;--field:#f1eee5;--yellow:#ffdf2b;--green:#16b86f;--red:#ffb6ae;--amber:#ffd982;--blue:#b8ddff;--muted:#6c6a64;--line:#111}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,select,input{font:inherit;color:inherit;background:var(--paper);border:1.5px solid var(--line);border-radius:0;font-weight:850}button{min-height:44px;padding:7px 9px}button:active,.active{background:var(--yellow)!important}button:disabled{opacity:.4}.ok{background:var(--green)!important}.bad{background:var(--red)!important}.try{background:var(--amber)!important}
#app{height:100dvh;display:grid;grid-template-rows:40px 46px minmax(0,1fr) 58px;overflow:hidden}.top,.pickers,.dock{display:flex;align-items:center;gap:6px;padding:5px 7px;border-bottom:2px solid var(--line);min-width:0}.top strong{font-size:10px;margin-right:auto}.chip{font-size:7px;border:1px solid var(--line);padding:5px 6px;white-space:nowrap}.pickers label{font-size:8px;font-weight:950}.pickers select{height:34px;min-width:0;padding:4px 6px;font-size:9px}.pickers select:first-of-type{flex:1.05}.pickers select:last-of-type{flex:1}
#view{position:relative;min-height:0;background:var(--field);overflow:hidden}#threeHost{position:absolute;inset:0}canvas{display:block;width:100%!important;height:100%!important;touch-action:none}.identity{position:absolute;left:8px;top:8px;z-index:4;background:rgba(250,249,244,.94);border:2px solid var(--line);padding:7px 9px;max-width:62%;pointer-events:none}.identity small{display:block;font-size:7px;letter-spacing:.12em;color:var(--muted)}.identity strong{display:block;font-size:16px;line-height:1.05;margin-top:2px}.identity span{display:block;font-size:8px;color:var(--muted);margin-top:3px}.portBadge{position:absolute;right:8px;top:8px;z-index:4;background:var(--paper);border:1px solid var(--line);padding:5px 7px;font-size:7px;max-width:35%;text-align:right}.magnet{position:absolute;left:50%;bottom:12px;z-index:7;transform:translateX(-50%);border:2px solid var(--line);background:var(--paper);padding:7px 12px;font-size:9px;font-weight:950;opacity:0;pointer-events:none;transition:opacity .08s,transform .08s}.magnet.on{opacity:1;transform:translateX(-50%) scale(1.04)}.magnet.hear{background:var(--blue)}.magnet.pull,.magnet.align,.magnet.slide,.magnet.clock{background:var(--amber)}.magnet.click{background:var(--green)}.magnet.blocked{background:var(--red)}
.dock{border-top:2px solid var(--line);border-bottom:0;padding-bottom:max(6px,env(safe-area-inset-bottom));background:var(--paper)}.dock button{flex:1;min-width:0;font-size:8px;padding:6px 2px}
#app.trayOpen{grid-template-rows:40px 46px minmax(210px,1fr) 58px min(39dvh,365px)}#tray{display:none;min-height:0;background:var(--paper);border-top:2px solid var(--line);grid-template-rows:46px auto minmax(0,1fr)}#app.trayOpen #tray{display:grid}.trayHead{display:flex;align-items:center;gap:6px;padding:5px 7px;border-bottom:1px solid var(--line)}.trayHead strong{font-size:10px;margin-right:auto}.trayHead button{min-height:34px}.subtabs{display:flex;gap:4px;padding:5px 7px;border-bottom:1px solid #aaa;overflow-x:auto}.subtabs:empty{display:none}.subtabs button{min-height:32px;white-space:nowrap;font-size:7px}.trayBody{min-height:0;overflow:auto}.hint{padding:7px 9px;font-size:7px;color:var(--muted);border-bottom:1px solid #aaa}.rigState{display:flex;gap:5px;align-items:center;padding:7px 9px;border-bottom:1px solid #aaa;font-size:7px}.state{border:1px solid var(--line);padding:3px 5px;font-weight:950}.state.click{background:var(--green)}.state.blocked{background:var(--red)}.state.try,.state.hear,.state.pull,.state.align,.state.slide,.state.clock{background:var(--amber)}.state.probe{background:var(--blue)}.section{padding:8px;border-bottom:1px solid #aaa}.sectionTitle{font-size:7px;font-weight:950;letter-spacing:.12em;margin-bottom:7px}.skins,.paints,.clocks{display:flex;gap:5px;overflow-x:auto}.swatch{width:42px;height:42px;min-height:42px;flex:0 0 42px;padding:0;border:2px solid var(--line);position:relative}.swatch.active:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:1000;color:#000;text-shadow:0 1px #fff}.clock{min-width:58px;min-height:38px;font-size:8px}.search{padding:7px;border-bottom:1px solid var(--line)}.search input{width:100%;height:40px;padding:7px 9px;font-size:11px}.choice,.piece{width:100%;display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:7px;text-align:left;border:0;border-bottom:1px solid #bbb;background:var(--paper);padding:9px;min-height:0;align-items:center}.choice b,.piece b{font-size:8px;color:#08784c}.choice span,.piece span{font-size:8px;overflow-wrap:anywhere}.choice small,.piece small{font-size:7px;color:var(--muted)}.original,.none{background:#fff4ad}.headerText{padding:9px;font-size:7px;line-height:1.35;white-space:pre-wrap;word-break:break-word;border-top:1px solid var(--line);background:#f5f2ea}.slotSummary{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:7px}.slotCard{border:1px solid var(--line);padding:7px;min-height:58px}.slotCard b{display:block;font-size:7px}.slotCard span{display:block;font-size:8px;margin-top:5px}.slotCard small{display:block;font-size:6px;color:var(--muted);margin-top:3px}
@media(min-width:760px){#app{max-width:1080px;margin:auto;border-left:1px solid #bbb;border-right:1px solid #bbb}.identity strong{font-size:20px}.dock button{font-size:10px}}
</style>

</head>
<body><div id="app">
<header class="top"><strong>WORD-TO-THEATRE / PRODUCTION</strong><span id="catalogReady" class="chip">CATALOG…</span><span id="rigReady" class="chip">BEAVER…</span><span id="ldrawReady" class="chip">LDRAW…</span></header>

</div><script type="module" src="./movieator-production-v3.js"></script></body></html>

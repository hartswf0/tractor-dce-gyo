<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>INCEPTION // APEX</title>
	<link rel="icon" type="image/svg+xml" href="favicon.svg">
	<style>
        :root {
            --bg: #09090b;
            --panel: #121214;
            --surface: #18181b;
            --border: #27272a;
            --text-main: #e4e4e7;
            --text-muted: #71717a;
            
            /* SEMANTICS */
            --func: #f43f5e;   /* Rose */
            --var: #2dd4bf;    /* Teal */
            --tag: #8b5cf6;    /* Violet */
            --ctrl: #fbbf24;   /* Amber */
            
            /* FLOW */
            --focus: #ffffff;
            --up: #3b82f6;     /* Blue */
            --down: #10b981;   /* Green */
            
            --font: 'JetBrains Mono', 'Menlo', monospace;
            --lh: 20px; /* Fixed Line Height for Sync */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            height: 100vh;
            height: 100dvh;
            background: var(--bg);
            color: var(--text-main);
            font-family: var(--font);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- 1. HEADER --- */
        header {
            height: 50px;
            flex: 0 0 auto;
            background: #000;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 140px 1fr 140px;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            z-index: 500;
        }

        .brand { 
            font-weight: 900; letter-spacing: 0.1em; color: var(--text-muted); 
            display: flex; align-items: center; gap: 8px; cursor: pointer;
        }
        .brand span { color: var(--func); }

        /* Nav Deck (Center) */
        .nav-deck {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            height: 100%;
            overflow: hidden;
        }

        .nav-group {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-width: 60px; max-width: 200px;
        }
        
        .nav-label { font-size: 7px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 2px; }
        .nav-val { font-size: 11px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
        #nav-focus { color: var(--focus); }

        .chip-list { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
        .chip-list::-webkit-scrollbar { display: none; }

        .chip {
            padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border);
            background: var(--panel); font-size: 9px; cursor: pointer; color: var(--text-muted);
            white-space: nowrap; transition: 0.1s;
        }
        .chip:hover { color: #fff; border-color: #fff; transform: translateY(-1px); }
        .chip.up { border-left: 2px solid var(--up); }
        .chip.down { border-right: 2px solid var(--down); }

        /* Right Controls */
        .controls { display: flex; justify-content: flex-end; gap: 8px; }
        .btn {
            background: var(--panel); border: 1px solid var(--border); color: var(--text-main);
            padding: 4px 10px; border-radius: 3px; font-size: 9px; font-weight: 600;
            cursor: pointer; text-transform: uppercase; font-family: inherit;
        }
        .btn:hover { border-color: var(--func); color: #fff; }
        .btn.active { background: var(--func); color: #000; border-color: var(--func); }


        /* --- 2. GRID VIEWPORT --- */
        .viewport {
            flex: 0 0 45vh;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        .grid-lock {
            height: 90%; aspect-ratio: 1/1;
            position: relative; max-width: 95vw;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 2px; width: 100%; height: 100%;
            position: relative; z-index: 10;
        }

        .block {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 2px; cursor: pointer; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .block-icon { font-size: 10px; opacity: 0.4; margin-bottom: 2px; }
        .block-label { font-size: 6px; opacity: 0.5; max-width: 90%; overflow: hidden; white-space: nowrap; }
        
        .port { position: absolute; width: 3px; height: 3px; background: var(--border); border-radius: 50%; left: 50%; transform: translateX(-50%); opacity: 0.5; }
        .port.in { top: -2px; } .port.out { bottom: -2px; }

        /* States */
        .block:hover { border-color: #fff; background: var(--surface); z-index: 100; transform: scale(1.15); }
        .block.focus { background: var(--focus); border-color: var(--focus); color: #000; z-index: 200; transform: scale(1.2); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .block.focus .block-icon, .block.focus .block-label { opacity: 1; color: #000; font-weight: 800; }
        .block.focus .port { background: #000; }
        .block.up { border-color: var(--up); background: rgba(59, 130, 246, 0.1); color: var(--up); z-index: 50; }
        .block.down { border-color: var(--down); background: rgba(16, 185, 129, 0.1); color: var(--down); z-index: 50; }
        .block.muted { opacity: 0.1; filter: grayscale(1); transform: scale(0.95); }

        /* Wires */
        .wire-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: visible; }
        path.cable { fill: none; stroke: #333; stroke-width: 1; opacity: 0.3; transition: opacity 0.2s; }
        path.cable.active { opacity: 1; stroke-width: 1.5; filter: drop-shadow(0 0 2px currentColor); }
        path.cable.up { stroke: var(--up); } path.cable.down { stroke: var(--down); }

        /* --- 3. BRANCH BAR --- */
        .branch-bar {
            height: 24px; background: var(--surface); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 12px; gap: 6px;
            font-size: 10px; color: var(--text-muted); overflow-x: auto;
        }
        .branch-node { color: var(--text-main); cursor: pointer; }
        .branch-node:hover { color: var(--func); text-decoration: underline; }
        .branch-sep { opacity: 0.5; font-size: 8px; }

        /* --- 4. EDITOR & MINIMAP --- */
        .editor-container {
            flex: 1; display: flex; background: var(--bg); position: relative; overflow: hidden;
        }

        .code-scroll {
            flex: 1; overflow-y: auto; position: relative; scroll-behavior: smooth;
        }

        /* Textarea Layer */
        .code-editor {
            display: block; width: 100%; min-height: 100%;
            background: transparent; color: transparent; /* Text hidden, caret visible */
            caret-color: #fff; font-family: inherit; font-size: 12px; line-height: var(--lh);
            padding: 20px 50px 100px 10px; border: none; outline: none; resize: none;
            white-space: pre; overflow: hidden; z-index: 2; position: absolute; top: 0; left: 0;
        }

        /* Visual Layer (Behind Textarea) */
        .visual-layer {
            position: absolute; top: 0; left: 0; width: 100%; min-height: 100%;
            padding: 20px 50px 100px 10px; pointer-events: none; z-index: 1;
        }

        .line {
            display: flex; height: var(--lh); align-items: center;
            border-left: 2px solid transparent; padding-left: 8px;
        }
        
        .line.active { background: rgba(255,255,255,0.08); border-left-color: #fff; }
        .line.up { background: rgba(59, 130, 246, 0.08); border-left-color: var(--up); }
        .line.down { background: rgba(16, 185, 129, 0.08); border-left-color: var(--down); }

        .ln {
            display: inline-block; width: 30px; text-align: right; margin-right: 10px;
            color: var(--dim); font-size: 10px; user-select: none;
        }

        .code-text { color: var(--text-muted); font-size: 12px; white-space: pre; }
        
        /* Syntax */
        .kwd { color: var(--func); } .def { color: var(--text-main); font-weight: bold; }
        .var { color: var(--var); } .tag { color: var(--tag); } .str { color: #fcd34d; } .com { color: #52525b; }

        /* Preview Frame */
        .preview-frame {
            position: absolute; inset: 0; width: 100%; height: 100%; background: #fff;
            border: none; display: none; z-index: 50;
        }
        .preview-frame.visible { display: block; }

        /* Minimap */
        .minimap-rail {
            width: 48px; border-left: 1px solid var(--border); background: var(--panel);
            position: relative; z-index: 20; flex-shrink: 0;
        }
        canvas { width: 100%; height: 100%; cursor: crosshair; display: block; }
        .mm-view {
            position: absolute; left: 0; right: 0; top: 0; height: 0;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); pointer-events: none;
        }

        /* Sideblade */
        .sideblade {
            position: fixed; top: 0; left: 0; bottom: 0; width: 280px;
            background: var(--panel); border-right: 1px solid var(--border);
            transform: translateX(-100%); transition: transform 0.3s ease;
            z-index: 999; padding: 20px; display: flex; flex-direction: column; gap: 20px;
            box-shadow: 10px 0 50px rgba(0,0,0,0.5);
        }
        .sideblade.open { transform: translateX(0); }
        .blade-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: #fff; font-weight: bold; font-size: 12px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 900; display: none; }
        .overlay.open { display: block; }
        
        textarea.ingest {
            background: #000; border: 1px solid var(--border); color: #ccc;
            height: 120px; padding: 10px; font-family: inherit; font-size: 10px; resize: none; width: 100%;
        }

    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="brand" onclick="toggleBlade()">
            <span>✦</span> INCEPTION
        </div>
        
        <div class="nav-deck">
            <div class="nav-group">
                <span class="nav-label">USED BY</span>
                <div class="chip-list" id="nav-up"></div>
            </div>
            
            <div class="nav-group" style="border-left:1px solid var(--border); border-right:1px solid var(--border); padding:0 12px;">
                <span class="nav-label">FOCUS</span>
                <span class="nav-val" id="nav-focus">--</span>
            </div>
            
            <div class="nav-group">
                <span class="nav-label">USES</span>
                <div class="chip-list" id="nav-down"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn active" id="btn-code" onclick="setMode('code')">CODE</button>
            <button class="btn" id="btn-run" onclick="setMode('run')">RUN</button>
        </div>
    </header>

    <!-- GRID -->
    <div class="viewport">
        <div class="grid-lock" id="grid-lock">
            <div class="grid" id="grid"></div>
            <svg class="wire-canvas" id="wires"></svg>
        </div>
    </div>

    <!-- BRANCH BAR -->
    <div class="branch-bar" id="branch-bar">
        <span class="branch-node">ROOT</span>
    </div>

    <!-- EDITOR -->
    <div class="editor-container">
        <div class="code-scroll" id="scroller">
            <!-- Visual Layer (Syntax Highlighted) -->
            <div class="visual-layer" id="visual-layer"></div>
            <!-- Input Layer (Transparent, for editing) -->
            <textarea id="code-editor" class="code-editor" spellcheck="false"></textarea>
        </div>
        
        <iframe id="preview-frame" class="preview-frame"></iframe>

        <div class="minimap-rail">
            <canvas id="minimap"></canvas>
            <div class="mm-view" id="mm-view"></div>
        </div>
    </div>

    <!-- SIDEBLADE -->
    <div class="overlay" id="overlay" onclick="toggleBlade()"></div>
    <div class="sideblade" id="sideblade">
        <div class="blade-header">
            <span>SYSTEM</span>
            <span style="cursor:pointer" onclick="toggleBlade()">✕</span>
        </div>
        <div>
            <div class="nav-label">INGESTION</div>
            <textarea class="ingest" id="paste-input" placeholder="// Paste Code..."></textarea>
            <button class="btn" style="width:100%; margin-top:8px; border-color:var(--func); color:var(--func)" onclick="ingest()">LOAD</button>
        </div>
        <div>
            <div class="nav-label">THEME</div>
            <div style="display:flex; gap:8px; margin-top:4px;">
                <button class="btn" onclick="setTheme('dark')">DARK</button>
                <button class="btn" onclick="setTheme('parchment')">PAPER</button>
                <button class="btn" onclick="setTheme('terminal')">CRT</button>
            </div>
        </div>
    </div>

<script>
    // ----------------------------------------------------
    // 1. CORE STATE
    // ----------------------------------------------------
    const DEFAULT_CODE = document.documentElement.outerHTML;
    let lines = DEFAULT_CODE.split('\n');
    
    let blocks = new Array(81).fill(null);
    let edges = []; 
    let definitions = {};
    let activeIdx = null;
    
    // Parsing Meta
    let scopes = []; // {start, end, name}

    const els = {
        grid: document.getElementById('grid'),
        wires: document.getElementById('wires'),
        visual: document.getElementById('visual-layer'),
        editor: document.getElementById('code-editor'),
        scroller: document.getElementById('scroller'),
        mm: document.getElementById('minimap'),
        mmv: document.getElementById('mm-view'),
        lock: document.getElementById('grid-lock'),
        preview: document.getElementById('preview-frame'),
        branch: document.getElementById('branch-bar'),
        navFocus: document.getElementById('nav-focus'),
        navUp: document.getElementById('nav-up'),
        navDown: document.getElementById('nav-down')
    };

    // Init
    els.editor.value = DEFAULT_CODE;

    // ----------------------------------------------------
    // 2. PARSER
    // ----------------------------------------------------
    function parse() {
        blocks = new Array(81).fill(null);
        edges = [];
        definitions = {};
        scopes = [];
        let scopeStack = [];

        const lpc = Math.ceil(lines.length / 81);

        lines.forEach((line, i) => {
            const trim = line.trim();
            const cellIdx = Math.floor(i / lpc);
            let type = null, name = null;

            // Identify
            const fn = trim.match(/(?:function|class)\s+(\w+)|(\w+)\s*\(/);
            if(fn && !trim.includes('=')) { type = 'function'; name = fn[1]||fn[2]; }
            
            const vr = trim.match(/(?:const|let|var)\s+(\w+)/);
            if(vr && !type) { type = 'variable'; name = vr[1]; }

            const tag = trim.match(/^<(\w+)/);
            if(tag && !type) { type = 'tag'; name = tag[1].toUpperCase(); }

            // Scopes
            if(trim.includes('{')) {
                let scopeName = name || (scopeStack.length ? scopeStack[scopeStack.length-1].name : 'ROOT');
                scopeStack.push({start: i, name: scopeName});
            }
            if(trim.includes('}')) {
                if(scopeStack.length) {
                    let s = scopeStack.pop();
                    s.end = i;
                    scopes.push(s);
                }
            }

            // Map Block
            if(type && name) {
                const pri = type==='function'?4: type==='variable'?3: 2;
                if(!blocks[cellIdx] || blocks[cellIdx].pri < pri) {
                    blocks[cellIdx] = { idx: cellIdx, type, name, line: i, pri, deps: [], callers: [] };
                    definitions[name] = cellIdx;
                }
            }
        });

        // Wiring
        lines.forEach((line, i) => {
            const fromIdx = Math.floor(i / lpc);
            const matches = line.trim().matchAll(/(\w+)/g);
            for(const m of matches) {
                const target = m[1];
                const toIdx = definitions[target];
                if(toIdx !== undefined && toIdx !== fromIdx) {
                    edges.push({from: fromIdx, to: toIdx});
                    if(blocks[fromIdx]) blocks[fromIdx].deps.push(toIdx);
                    if(blocks[toIdx]) blocks[toIdx].callers.push(fromIdx);
                }
            }
        });

        // Dedup
        blocks.forEach(b => {
            if(b) {
                b.deps = [...new Set(b.deps)];
                b.callers = [...new Set(b.callers)];
            }
        });
    }

    // ----------------------------------------------------
    // 3. RENDERER
    // ----------------------------------------------------
    function render() {
        els.grid.innerHTML = '';
        els.visual.innerHTML = '';
        els.wires.innerHTML = '';

        const lpc = Math.ceil(lines.length / 81);

        // A. Grid
        for(let i=0; i<81; i++) {
            const cell = document.createElement('div');
            cell.className = 'block';
            const d = blocks[i];
            
            if(d) {
                let icon = d.type==='function'?'ƒ': d.type==='tag'?'<>':'=';
                cell.innerHTML = `<div class="port in"></div><div class="block-icon">${icon}</div><div class="block-label">${d.name}</div><div class="port out"></div>`;
                cell.setAttribute('data-type', d.type);
            } else {
                cell.style.opacity = '0.05';
                cell.innerHTML = '·';
            }

            cell.onmouseenter = () => { if(activeIdx === null) xray(i); };
            cell.onclick = (e) => { 
                e.stopPropagation();
                activeIdx = (activeIdx === i) ? null : i; 
                xray(activeIdx || i); 
                if(activeIdx !== null) scrollToLine(i*lpc);
            };
            els.grid.appendChild(cell);
        }

        // B. Code Visuals
        lines.forEach((l, i) => {
            const div = document.createElement('div');
            div.className = 'line';
            div.id = `L${i}`;
            
            let html = l.replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/(function|class|const|let|var|if|return)/g, '<span class="kwd">$1</span>')
                .replace(/([a-zA-Z0-9_]+)\(/g, '<span class="var">$1</span>(')
                .replace(/(\/\/.*)/g, '<span class="com">$1</span>');

            const mapItem = blocks[Math.floor(i/lpc)];
            if(mapItem && mapItem.name && l.includes(mapItem.name)) {
                html = html.replace(mapItem.name, `<span class="def">${mapItem.name}</span>`);
            }

            div.innerHTML = `<span class="ln">${i}</span><span class="code-text">${html}</span>`;
            div.onclick = () => {
                const bIdx = Math.floor(i/lpc);
                activeIdx = bIdx;
                xray(bIdx);
            };
            els.visual.appendChild(div);
        });

        requestAnimationFrame(drawWires);
        renderMinimap();
    }

    function drawWires() {
        els.wires.innerHTML = '';
        const rect = els.lock.getBoundingClientRect();
        if(rect.width === 0) return;

        const cw = rect.width / 9;
        const ch = rect.height / 9;
        const unique = [...new Set(edges.map(JSON.stringify))].map(JSON.parse);

        unique.forEach(e => {
            const fromEl = els.grid.children[e.from];
            const toEl = els.grid.children[e.to];
            if(!fromEl || !toEl) return;

            const r1 = fromEl.getBoundingClientRect();
            const r2 = toEl.getBoundingClientRect();
            
            // Rel to container
            const x1 = (r1.left - rect.left) + r1.width/2;
            const y1 = (r1.bottom - rect.top) - 2;
            const x2 = (r2.left - rect.left) + r2.width/2;
            const y2 = (r2.top - rect.top) + 2;

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            const cp1x = x1; const cp1y = y1 + 20;
            const cp2x = x2; const cp2y = y2 - 20;
            
            path.setAttribute("d", `M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}`);
            path.setAttribute("class", "cable");
            path.dataset.from = e.from;
            path.dataset.to = e.to;
            els.wires.appendChild(path);
        });
    }

    // ----------------------------------------------------
    // 4. X-RAY & BRANCHING
    // ----------------------------------------------------
    function xray(idx) {
        // Reset
        document.querySelectorAll('.block').forEach(b => b.className = 'block');
        document.querySelectorAll('.cable').forEach(w => w.setAttribute('class', 'cable'));
        document.querySelectorAll('.line').forEach(l => l.className = 'line');

        if(idx === null || !blocks[idx]) {
            document.querySelectorAll('.block').forEach(b => b.classList.remove('muted'));
            document.querySelectorAll('.cable').forEach(w => w.style.opacity = '0.3');
            updateHUD(null);
            updateBranch(null);
            return;
        }

        const root = blocks[idx];
        const lpc = Math.ceil(lines.length/81);

        // Mute
        document.querySelectorAll('.block').forEach(b => b.classList.add('muted'));
        document.querySelectorAll('.cable').forEach(w => w.style.opacity = '0.05');

        // Focus Root
        const el = els.grid.children[idx];
        el.classList.remove('muted');
        el.classList.add('focus');
        
        for(let i=idx*lpc; i<(idx+1)*lpc; i++) document.getElementById(`L${i}`)?.classList.add('active');

        // Upstream
        root.callers.forEach(c => {
            els.grid.children[c]?.classList.remove('muted');
            els.grid.children[c]?.classList.add('up');
            const w = document.querySelector(`path[data-from="${c}"][data-to="${idx}"]`);
            if(w) { w.setAttribute('class', 'cable active up'); w.style.opacity = '1'; }
            document.getElementById(`L${c*lpc}`)?.classList.add('up');
        });

        // Downstream
        root.deps.forEach(d => {
            els.grid.children[d]?.classList.remove('muted');
            els.grid.children[d]?.classList.add('down');
            const w = document.querySelector(`path[data-from="${idx}"][data-to="${d}"]`);
            if(w) { w.setAttribute('class', 'cable active down'); w.style.opacity = '1'; }
            document.getElementById(`L${d*lpc}`)?.classList.add('down');
        });

        updateHUD(root);
        updateBranch(root);
    }

    function updateHUD(data) {
        els.navUp.innerHTML = ''; els.navDown.innerHTML = '';
        if(!data) { els.navFocus.innerText = "--"; return; }
        
        els.navFocus.innerText = data.name;

        const mkChip = (idx, cls) => {
            const b = blocks[idx]; if(!b) return null;
            const c = document.createElement('div');
            c.className = `chip ${cls}`;
            c.innerText = b.name;
            c.onclick = (e) => { e.stopPropagation(); activeIdx=idx; xray(idx); scrollToLine(idx * Math.ceil(lines.length/81)); };
            return c;
        };

        data.callers.forEach(c => { const el=mkChip(c,'up'); if(el) els.navUp.appendChild(el); });
        data.deps.forEach(d => { const el=mkChip(d,'down'); if(el) els.navDown.appendChild(el); });
    }

    function updateBranch(data) {
        if(!data) { els.branch.innerHTML = '<span class="branch-node">ROOT</span>'; return; }
        
        // Find scope chain
        let path = ['ROOT'];
        const line = data.line;
        
        scopes.forEach(s => {
            if(line >= s.start && line <= s.end) {
                // Extract name from line
                const match = lines[s.start].match(/(?:class|function)\s+(\w+)/);
                if(match) path.push(match[1].toUpperCase());
            }
        });
        path.push(data.name.toUpperCase());
        
        // Render
        els.branch.innerHTML = path.map(p => `<span class="branch-node">${p}</span>`).join('<span class="branch-sep"> > </span>');
    }

    // ----------------------------------------------------
    // 5. SYSTEM
    // ----------------------------------------------------
    function scrollToLine(idx) {
        const lh = 20; // Matched to CSS
        const top = (idx * lh) - 100;
        els.scroller.scrollTo({top: top, behavior: 'smooth'});
    }

    function renderMinimap() {
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        const lh = rect.height / lines.length;

        const style = getComputedStyle(document.body);
        const cFunc = style.getPropertyValue('--func').trim();
        const cVar = style.getPropertyValue('--var').trim();
        const cDim = style.getPropertyValue('--border').trim();

        lines.forEach((line, i) => {
            if(!line.trim()) return;
            const indent = line.search(/\S|$/);
            const len = Math.min(rect.width, line.trim().length * 2);
            let color = cDim;
            
            const m = blocks[Math.floor(i / Math.ceil(lines.length/81))];
            if(m) {
                if(m.type==='function') color = cFunc;
                else if(m.type==='variable') color = cVar;
            }
            
            ctx.fillStyle = color;
            ctx.fillRect(indent*2, i*lh, len, Math.max(1, lh));
        });

        canvas.onclick = (e) => {
            const pct = e.offsetY / rect.height;
            scrollToLine(Math.floor(pct * lines.length));
        };
    }

    // Observer for Wires & Resizing
    const ro = new ResizeObserver(() => {
        drawWires();
        renderMinimap();
    });
    ro.observe(els.lock);

    // Sync Minimap Viewport
    els.scroller.addEventListener('scroll', () => {
        const pct = els.scroller.scrollTop / (els.scroller.scrollHeight - els.scroller.clientHeight);
        const h = els.mm.getBoundingClientRect().height;
        const vh = (els.scroller.clientHeight / els.scroller.scrollHeight) * h;
        els.mmv.style.height = `${vh}px`;
        els.mmv.style.top = `${pct * (h - vh)}px`;
    });

    // Features
    function setMode(m) {
        if(m === 'code') {
            els.preview.classList.remove('visible');
            document.getElementById('btn-code').classList.add('active');
            document.getElementById('btn-run').classList.remove('active');
        } else {
            const blob = new Blob([els.editor.value], {type:'text/html'});
            els.preview.src = URL.createObjectURL(blob);
            els.preview.classList.add('visible');
            document.getElementById('btn-run').classList.add('active');
            document.getElementById('btn-code').classList.remove('active');
        }
    }

    function toggleBlade() { document.getElementById('sideblade').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }
    function setTheme(t) { document.documentElement.setAttribute('data-theme', t); setTimeout(renderMinimap, 100); }
    
    function ingest() {
        const v = document.getElementById('paste-input').value;
        if(v.trim()) {
            lines = v.split('\n');
            els.editor.value = v;
            activeIdx = null;
            parse();
            render();
            toggleBlade();
        }
    }

    // Live Edit Sync
    els.editor.addEventListener('input', () => {
        lines = els.editor.value.split('\n');
        // Simple debounce
        setTimeout(() => { parse(); render(); }, 500);
    });

    // Boot
    parse();
    render();

</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>WOPR Hand Butter</title>
<meta name="theme-color" content="#040709">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one board (the Crystal Palace plate) over one control deck.
   Phone: board on top, deck below, nothing scrolls but the deck's own list. Desktop (>=960px): board left, deck right. */
:root{
  color-scheme:dark;
  --bg:#040709; --panel:#080d12; --panel2:#0c141b; --line:#1a2b38;
  --ink:#e6f4ef; --dim:#7a948d; --phos:#19e6c8; --amber:#ffd23f; --red:#ff2e2e; --blue:#3b82f6;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --tap:42px;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 var(--mono);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--amber);outline-offset:1px}
[hidden]{display:none!important}

#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (min-width:960px){#app{grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) 400px}#bar{grid-column:1/3}#deck{grid-row:2;grid-column:2;max-height:none}}

/* header */
#bar{display:flex;align-items:center;gap:8px;height:44px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:#060a0e;min-width:0}
.brand{font-weight:600;letter-spacing:.14em;color:var(--phos);white-space:nowrap;display:flex;align-items:center;gap:8px}
.led{width:8px;height:8px;background:var(--phos);box-shadow:0 0 8px var(--phos)}
.defcon{display:flex;gap:2px;align-items:center}
.defcon b{font-weight:500;font-size:9px;letter-spacing:.14em;color:var(--dim);margin-right:3px}
.defcon i{font-style:normal;width:17px;text-align:center;font-size:10px;border:1px solid var(--line);color:#3c5049;padding:1px 0}
.defcon i.on[data-d="5"]{background:#123d2c;color:#7fffc4;border-color:var(--phos)}
.defcon i.on[data-d="4"]{background:#12304a;color:#9ccaff;border-color:var(--blue)}
.defcon i.on[data-d="3"]{background:#4a3c08;color:var(--amber);border-color:var(--amber)}
.defcon i.on[data-d="2"]{background:#4d2108;color:#ffb27a;border-color:#ff8a3d}
.defcon i.on[data-d="1"]{background:#5c0d0d;color:#fff;border-color:var(--red);box-shadow:0 0 10px rgba(255,46,46,.6)}
#cov{flex:1;min-width:0;color:var(--dim);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.06em}
.hb{height:30px;border:1px solid var(--line);background:#0b1219;padding:0 10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.hb:hover{border-color:var(--phos);color:var(--phos)}
.hb.on{border-color:var(--amber);color:var(--amber)}
#fileMenu{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(44px + env(safe-area-inset-top,0px));z-index:60;display:flex;flex-direction:column;border:1px solid var(--line);background:#060a0e;min-width:180px}
#fileMenu button{height:var(--tap);border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:0 12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
#fileMenu button:last-child{border-bottom:0}
#fileMenu button:hover{color:var(--phos)}
@media (max-width:620px){.brand .full,#cov,.defcon b{display:none}.spacer{flex:1}}
@media (min-width:621px){.spacer{display:none}}

/* stage */
#stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#0a1720,#030608 72%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
.tag{position:absolute;padding:3px 7px;background:rgba(4,7,9,.86);border:1px solid rgba(25,230,200,.35);color:var(--phos);font-size:10px;letter-spacing:.12em;pointer-events:none;z-index:3;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageTag{top:8px;left:max(8px,env(safe-area-inset-left,0px))}
#stageHint{bottom:8px;left:max(8px,env(safe-area-inset-left,0px));right:auto;color:var(--ink);border-color:var(--line);letter-spacing:.03em;white-space:normal;max-width:calc(100% - 66px);font-size:11px}
.zoomer{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:8px;z-index:4;display:flex;flex-direction:column;border:1px solid var(--line);background:rgba(4,7,9,.86)}
.zoomer button{width:40px;height:40px;border:0;border-bottom:1px solid var(--line);background:transparent;display:grid;place-items:center}
.zoomer button:last-child{border-bottom:0}
.zoomer button:hover{color:var(--phos)}
.ico{position:relative;width:14px;height:14px;display:block}
.ico.plus::before,.ico.plus::after,.ico.minus::before{content:"";position:absolute;left:0;top:6px;width:14px;height:2px;background:currentColor}
.ico.plus::after{transform:rotate(90deg)}
.ico.fit{border:2px solid currentColor;width:14px;height:11px}
#camWrap{position:absolute;top:8px;right:max(8px,env(safe-area-inset-right,0px));width:96px;height:72px;border:1px solid var(--phos);z-index:4;background:#000}
#camWrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.8}
#camWrap span{position:absolute;left:0;right:0;bottom:0;font-size:9px;letter-spacing:.1em;background:rgba(0,0,0,.75);color:var(--phos);padding:1px 4px;white-space:nowrap;overflow:hidden}
#loadBar{position:absolute;left:0;right:0;top:0;height:2px;background:var(--amber);transform-origin:left;transform:scaleX(0);z-index:6;transition:transform .2s}

/* full-screen CRT */
#crt{position:absolute;inset:0;z-index:7;background:#000;overflow:hidden}
#crt video,#crt img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#crt .tag{top:8px;left:8px}
#crtClose{position:absolute;top:6px;right:max(8px,env(safe-area-inset-right,0px));z-index:8;height:var(--tap);padding:0 14px;border:1px solid var(--phos);background:rgba(4,7,9,.9);color:var(--phos);font-size:11px;letter-spacing:.12em}
#crtNote{position:absolute;left:8px;right:8px;bottom:8px;padding:5px 8px;background:rgba(4,7,9,.86);border:1px solid var(--line);font-size:12px;color:var(--ink);z-index:2}

/* deck */
#deck{min-height:0;max-height:min(56%,480px);display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--panel)}
@media (min-width:960px){#deck{border-top:0;border-left:1px solid var(--line)}}
#topRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.25fr);border-bottom:1px solid var(--line);flex:none}
#topRow button{min-height:48px;background:#060a0e;border:0;border-right:1px solid var(--line);padding:4px 3px;font-size:10.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;line-height:1.25}
#topRow button small{display:block;font-size:8.5px;letter-spacing:.08em;color:#4b615b}
#topRow button.on{color:var(--phos);box-shadow:inset 0 -2px 0 var(--phos);background:rgba(25,230,200,.06)}
#topRow button.on small{color:var(--dim)}
#primary{border-right:0!important;background:rgba(255,210,63,.1)!important;color:var(--amber)!important;font-weight:600}
#primary:hover{background:var(--amber)!important;color:#040709!important}
#primary .thumbmark{width:10px;height:10px;border:1.5px solid currentColor;border-bottom-width:4px;display:inline-block;margin-right:5px;vertical-align:-1px}
#ctx{flex:1 1 auto;min-height:72px;overflow-y:auto;overscroll-behavior:contain;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.k{font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.p{color:var(--ink);font-size:12px}
.p.dim{color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{min-height:38px;padding:0 12px;border:1px solid var(--line);background:#0b1219;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.btn:hover{border-color:var(--phos);color:var(--phos)}
.btn.warn{border-color:rgba(255,46,46,.5);color:var(--red)}
.btn.warn:hover{background:var(--red);color:#fff}
.btn.on{border-color:var(--amber);color:var(--amber)}
.lk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;border:1px solid var(--line);padding:5px 6px;background:var(--panel2)}
.lk input,#termIn{min-width:0;background:#030608;border:1px solid var(--line);padding:6px 8px;text-transform:uppercase;font-size:16px;height:38px}
.lk .to{font-size:11px;color:var(--dim);white-space:nowrap;display:flex;gap:6px;align-items:center}
.pill{font-size:9px;letter-spacing:.14em;padding:1px 5px;border:1px solid var(--dim);color:var(--dim);white-space:nowrap}
.pill.ok{border-color:var(--phos);color:var(--phos)}
.pill.st{border-color:var(--amber);color:var(--amber)}
.cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.cmd{min-height:46px;padding:4px 10px;border:1px solid var(--phos);background:rgba(25,230,200,.08);color:var(--phos);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:left}
.cmd:hover{background:var(--phos);color:#020405}
.cmd.auto{border-color:var(--amber);color:var(--amber);background:rgba(255,210,63,.08)}
.cmd small{display:block;font-size:9px;color:var(--dim);letter-spacing:.06em}
#termForm{display:flex;gap:0;border:1px solid var(--line)}
#termForm span{padding:0 6px 0 8px;color:var(--phos);font-weight:600;display:flex;align-items:center}
#termForm input{flex:1;border:0}
#termForm input:focus{outline:none}
.out{color:var(--amber);font-size:11.5px}
.log{display:flex;flex-direction:column;gap:4px}
.log div{border-left:2px solid var(--line);padding:2px 0 2px 7px;font-size:11px;color:var(--ink);word-break:break-word}
.log div.end{border-color:var(--phos)}
.log div.stop{border-color:var(--red)}
.score{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line)}
.score div{padding:5px;text-align:center;border-right:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:10px;color:var(--dim);letter-spacing:.1em}
.score div:last-child{border-right:0}
.score b{display:block;font-size:18px;font-weight:500;color:var(--ink)}

/* tray */
#filters{display:flex;gap:4px;overflow-x:auto;padding:6px max(10px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);scrollbar-width:none;flex:none}
#filters::-webkit-scrollbar{display:none}
#filters button{flex:none;height:30px;border:1px solid var(--line);background:#060a0e;padding:0 9px;font-size:10px;letter-spacing:.08em;color:var(--dim)}
#filters button.on{border-color:var(--phos);color:var(--phos)}
#tray{display:flex;gap:6px;overflow-x:auto;padding:0 max(10px,env(safe-area-inset-left,0px)) 8px;touch-action:pan-x;flex:none;scrollbar-width:thin;overscroll-behavior-x:contain}
.tile{flex:none;width:104px;border:1px solid var(--line);background:#0b1219;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;position:relative}
.tile.armed{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.tile .th{height:66px;background:#000 center/cover no-repeat;position:relative;overflow:hidden}
.tile .th video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.tile .th span{position:absolute;top:3px;left:3px;font-size:8.5px;padding:0 4px;background:rgba(0,0,0,.85);color:var(--phos)}
.tile .th em{position:absolute;bottom:3px;right:3px;font-size:8.5px;font-style:normal;padding:0 4px;background:rgba(0,0,0,.85);color:var(--amber)}
.tile .nm{padding:3px 5px;font-size:9.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .pal{display:flex;height:3px}.tile .pal i{flex:1}
/* drawn minifig mark for cast tiles */
.fig{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:28px;height:56px}
.fig i{position:absolute;display:block}
.fig .hair{left:7px;top:0;width:14px;height:5px}
.fig .head{left:8px;top:4px;width:12px;height:11px;background:#f2cd37}
.fig .torso{left:3px;top:15px;width:22px;height:18px;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.fig .armL{left:0;top:16px;width:5px;height:15px}.fig .armR{right:0;top:16px;width:5px;height:15px}
.fig .hips{left:4px;top:33px;width:20px;height:4px}
.fig .legs{left:4px;top:37px;width:20px;height:18px;background-image:linear-gradient(90deg,transparent 9px,#0b1219 9px,#0b1219 11px,transparent 11px)}
.tile.cast .th{background:radial-gradient(circle at 50% 70%,#13222b,#05080b)}

/* overlays */
#dragChip{position:fixed;z-index:30;width:78px;height:54px;border:1px solid var(--amber);background:#000 center/cover no-repeat;pointer-events:none;transform:translate(-50%,-70%);opacity:.92;color:var(--amber);font-size:10px;display:grid;place-items:center}
#hand{position:fixed;inset:0;z-index:40;pointer-events:none;width:100%;height:100%}
#toast{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;padding:6px 10px;border:1px solid var(--phos);background:#040709;color:var(--phos);font-size:11.5px;letter-spacing:.04em;max-width:calc(100% - 32px);pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand"><i class="led"></i><span>WOPR<span class="full"> // HAND BUTTER</span></span></div>
    <div class="defcon" id="defcon"><b>DEFCON</b><i data-d="5">5</i><i data-d="4">4</i><i data-d="3">3</i><i data-d="2">2</i><i data-d="1">1</i></div>
    <div id="cov">0 SCREENS · 0 LINKS</div>
    <span class="spacer"></span>
    <button class="hb" id="btnHands" title="Use your camera: pinch to grab, open hand to drop, thumbs-up for the main action">Hands</button>
    <button class="hb" id="btnFile" aria-haspopup="true">File</button>
    <input type="file" id="fileIn" accept="application/json,.json" hidden>
  </header>
  <div id="fileMenu" hidden>
    <button data-f="save">Save flow file</button>
    <button data-f="load">Load flow file</button>
    <button data-f="sample">Load sample flow</button>
    <button data-f="versions">Other Butter builds</button>
  </div>

  <section id="stage">
    <div id="loadBar"></div>
    <span class="tag" id="stageTag">BOARD · BUILD</span>
    <span class="tag" id="stageHint">Drag a screen from the tray onto the board.</span>
    <div class="zoomer"><button id="zIn" aria-label="Zoom in"><i class="ico plus"></i></button><button id="zOut" aria-label="Zoom out"><i class="ico minus"></i></button><button id="zFit" aria-label="Show whole board"><i class="ico fit"></i></button></div>
    <div id="camWrap" hidden><video id="cam" playsinline muted></video><span id="camState">HANDS · LOADING</span></div>
    <div id="crt" hidden><span class="tag" id="crtTag">RUN</span><button id="crtClose">CLOSE</button><div id="crtNote"></div></div>
  </section>

  <aside id="deck">
    <nav id="topRow">
      <button data-m="build" class="on">Build<small>BUG makes</small></button>
      <button data-m="run">Run<small>NIT checks</small></button>
      <button data-m="ttt">Last Move<small>vs WOPR</small></button>
      <button id="primary"><i class="thumbmark"></i><span id="primaryLbl">Run</span></button>
    </nav>
    <div id="ctx"></div>
    <div id="filters"></div>
    <div id="tray"></div>
  </aside>
</div>
<div id="dragChip" hidden></div>
<canvas id="hand"></canvas>
<div id="toast" hidden></div>

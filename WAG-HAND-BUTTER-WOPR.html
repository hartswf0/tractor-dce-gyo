<head>

<style>
/* One object: a wall of nine screens. One verb: put a clip in a square.
   The game is the order of moves; the edit is the same order played back. */
:root{
  color-scheme:dark;
  --bg:#000; --ink:#e8f2ef; --dim:#6b7f79; --line:#1c2a31;
  --x:#3b82f6; --o:#ff2e2e; --phos:#19e6c8; --amber:#ffd23f;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 var(--mono);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px))}

header{flex:none;height:46px;display:flex;align-items:center;gap:12px}
#status{flex:1;min-width:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status b{font-weight:600}
#status .x{color:var(--x)} #status .o{color:var(--o)} #status .w{color:var(--amber)}
#hands{height:32px;padding:0 10px;border:1px solid var(--line);font-size:10.5px;letter-spacing:.14em;color:var(--dim)}
#hands.on{border-color:var(--amber);color:var(--amber)}

/* the wall */
#wallBox{flex:1;min-height:0;display:grid;place-items:center;position:relative}
#wall{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,calc((100% ) * 1));aspect-ratio:4/3;max-height:100%;max-width:100%}
.sq{position:relative;background:#05090c;border:1px solid var(--line);overflow:hidden;touch-action:none}
.sq video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.sq.x{border-color:var(--x);box-shadow:inset 0 0 0 1px var(--x)}
.sq.o{border-color:var(--o);box-shadow:inset 0 0 0 1px var(--o)}
.sq .mk{position:absolute;left:0;top:0;padding:1px 6px;font-size:11px;font-weight:600;color:#fff}
.sq.x .mk{background:var(--x)} .sq.o .mk{background:var(--o)}
.sq .n{position:absolute;right:4px;bottom:3px;font-size:10px;color:#fff;text-shadow:0 0 3px #000}
.sq.open.target{border-color:var(--phos);background:#071a18}
.sq.open.armed::after{content:"";position:absolute;inset:38% 44%;border:2px solid var(--phos)}
#wall.over .sq:not(.line){opacity:.28}
.sq.line{border-color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.sq.fresh{animation:fresh .5s ease-out}
@keyframes fresh{from{transform:scale(.92);filter:brightness(2)}to{transform:none;filter:none}}

/* the cut: the moves played back in order */
#cut{position:absolute;inset:0;background:#000;z-index:5}
#cut video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#cutTag{position:absolute;left:0;top:0;padding:3px 8px;font-size:11px;letter-spacing:.1em;background:#000;z-index:2}

/* one row: the dominant action and its recovery */
#act{flex:none;display:flex;gap:8px;padding:8px 0}
#act button{height:46px;padding:0 16px;border:1px solid var(--line);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#act .main{flex:1;border-color:var(--amber);color:var(--amber)}
#act .main:hover{background:var(--amber);color:#000}
#act .back{color:var(--dim)}

/* clips */
#tray{flex:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;touch-action:pan-x;scrollbar-width:none;overscroll-behavior-x:contain}
#tray::-webkit-scrollbar{display:none}
.clip{flex:none;width:92px;aspect-ratio:4/3;background:#05090c center/cover no-repeat;border:1px solid var(--line);position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.clip video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.clip.armed{border-color:var(--phos);box-shadow:0 0 0 1px var(--phos)}
.clip.used{opacity:.3}
.clip span{position:absolute;left:0;bottom:0;font-size:9px;padding:0 4px;background:rgba(0,0,0,.8);color:var(--dim)}
#tray.locked{opacity:.25;pointer-events:none}

#ghost{position:fixed;z-index:20;width:84px;aspect-ratio:4/3;border:1px solid var(--phos);background:#000 center/cover no-repeat;pointer-events:none;transform:translate(-50%,-50%)}
#hand{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}

@media (min-width:900px){ .clip{width:120px} #act button{height:44px} }
@media (prefers-reduced-motion:reduce){.sq.fresh{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="status" role="status" aria-live="polite"></div>
    <button id="hands" title="Camera hands: pinch to pick up a clip, open your hand to drop it, thumbs-up for the main action">Hands</button>
  </header>
  <div id="wallBox">
    <div id="wall"></div>
    <div id="cut" hidden><div id="cutTag"></div></div>
  </div>
  <div id="act"></div>
  <div id="tray"></div>
</div>
<div id="ghost" hidden></div>
<canvas id="hand"></canvas>
<video id="cam" playsinline muted></video>

const MBASE = 'https://hartswf0.github.io/2700-fa26/WARGAMES%20-%20MILESTONES/';
const CLIPS = [];
for (const s of M.shots) if (s.v) CLIPS.push({ id:s.id, code:M.subs[s.s].c.replace('SYS-', ''), src:BASE + 'clips/' + s.id + '.mp4', img:BASE + 'thumbs/screens/' + s.id + '.jpg', ttt:s.cat === 'tictactoe_scenarios' || s.s === 9 });
for (let i = 1; i <= 7; i++) CLIPS.push({ id:'M' + i, code:'M' + i, src:MBASE + 'films/M' + i + '.mp4', img:null, ttt:false });
const byId = Object.fromEntries(CLIPS.map(c => [c.id, c]));
const WOPR_POOL = CLIPS.filter(c => c.ttt).map(c => c.id);
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const SQUARE = ['TOP LEFT','TOP','TOP RIGHT','LEFT','CENTER','RIGHT','BOTTOM LEFT','BOTTOM','BOTTOM RIGHT'];
const ZERO_GAMES = 12;

/* ---------- state: the board and its move list ---------- */
const KEY = 'wopr-wall-v1';
let B = fresh();
function fresh(){ return { sq:Array(9).fill(null), moves:[] }; }   // sq[i] = {p:'X'|'O', clip}; moves = [{i,p,clip}]
try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o && o.sq && o.moves) B = o; } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(B)); } catch(e){} };
let armed = null, busy = false, zero = null, cutRun = null;

function winner(sq){
  for (const L of LINES) { const a = sq[L[0]], b = sq[L[1]], c = sq[L[2]]; if (a && b && c && a.p === b.p && b.p === c.p) return { p:a.p, L }; }
  return sq.every(Boolean) ? { p:'D', L:null } : null;
}
function minimax(b, p){
  const w = winner(b.map(v => v && { p:v })); if (w) return { s:w.p === 'O' ? 10 : w.p === 'X' ? -10 : 0 };
  let best = { s:p === 'O' ? -99 : 99, m:[] };
  for (let i = 0; i < 9; i++) if (!b[i]) { b[i] = p; const s0 = minimax(b, p === 'O' ? 'X' : 'O').s; b[i] = null; const s = s0 - Math.sign(s0) * .1;
    if (p === 'O' ? s > best.s : s < best.s) best = { s, m:[i] }; else if (s === best.s) best.m.push(i); }
  return best;
}
const bestMove = p => { const r = minimax(B.sq.map(v => v && v.p), p); return r.m[Math.floor(Math.random() * r.m.length)]; };
const phase = () => { if (cutRun) return 'CUT'; if (zero) return 'ZERO'; if (winner(B.sq)) return 'OVER'; if (busy) return 'WOPR'; return B.moves.length ? 'PLAY' : 'REST'; };

/* ---------- operations ---------- */
function put(i, clip, p){
  delete B.result; B.sq[i] = { p, clip }; B.moves.push({ i, p, clip }); save();
}
function playerPut(i, clipId){
  const ph = phase(); if (!(ph === 'REST' || ph === 'PLAY') || B.sq[i]) return;
  put(i, clipId, 'X'); arm(null); render(i);
  if (winner(B.sq)) return render();
  busy = true; render();
  setTimeout(() => {
    const j = bestMove('O');
    const pool = WOPR_POOL.filter(id => !B.moves.some(m => m.clip === id)); const src = pool.length ? pool : WOPR_POOL;
    put(j, src[Math.floor(Math.random() * src.length)], 'O'); busy = false; render(j);
  }, 700);
}
function takeBack(){
  if (busy || zero) return;
  while (B.moves.length) { const m = B.moves.pop(); B.sq[m.i] = null; if (m.p === 'X') break; }
  save(); render();
}
function newBoard(){ stopCut(); B = fresh(); save(); render(); }
function playCut(){
  const list = B.moves.slice(); if (!list.length) return;
  const el = document.getElementById('cut'); el.hidden = false;
  const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); el.appendChild(v);
  cutRun = { k:0, v, list }; render();
  const next = () => {
    if (!cutRun) return;
    if (cutRun.k >= list.length) { stopCut(); return; }
    const m = list[cutRun.k], c = byId[m.clip];
    document.getElementById('cutTag').innerHTML = `<span style="color:${m.p === 'X' ? 'var(--x)' : 'var(--o)'}">${m.p}</span> ${cutRun.k + 1} / ${list.length} · ${SQUARE[m.i]} · ${c.id.toUpperCase()}`;
    v.src = c.src; v.play().catch(() => {});
    clearTimeout(cutRun.t); cutRun.t = setTimeout(() => { cutRun && cutRun.k++; next(); }, 6000);   // a clip that never ends still advances
    v.onended = () => { clearTimeout(cutRun.t); cutRun.k++; next(); };
  };
  next();
}
function stopCut(){
  if (!cutRun) return;
  clearTimeout(cutRun.t); cutRun.v.remove(); cutRun = null;
  document.getElementById('cut').hidden = true; render();
}
function zeroPlayers(){
  if (zero) { clearTimeout(zero.t); zero = null; render(); return; }
  B = fresh(); zero = { games:0, draws:0, delay:450, t:null, p:'X' };
  const tick = () => {
    if (!zero) return;
    const w = winner(B.sq);
    if (w) {
      zero.games++; if (w.p === 'D') zero.draws++;
      if (zero.games >= ZERO_GAMES) { const z = zero; zero = null; B = fresh(); B.result = `${z.draws} OF ${z.games} DRAWN`; save(); render(); return; }
      B = fresh(); zero.delay = Math.max(60, zero.delay * .74);
    } else {
      const i = B.moves.length ? bestMove(zero.p) : Math.floor(Math.random() * 9);
      put(i, WOPR_POOL[Math.floor(Math.random() * WOPR_POOL.length)], zero.p); zero.p = zero.p === 'X' ? 'O' : 'X';
    }
    render(); zero.t = setTimeout(tick, zero.delay);
  };
  render(); tick();
}

/* ---------- surface ---------- */
const wall = document.getElementById('wall'), act = document.getElementById('act'), tray = document.getElementById('tray'), statusEl = document.getElementById('status');
const cells = [];
for (let i = 0; i < 9; i++) {
  const d = document.createElement('div'); d.className = 'sq open'; d.dataset.i = i; d.setAttribute('role', 'button'); d.setAttribute('aria-label', SQUARE[i]);
  wall.appendChild(d); cells.push(d);
}
function paintCell(i, isFresh){
  const d = cells[i], s = B.sq[i];
  const cur = d.dataset.clip || '';
  if (!s) { if (cur) { d.innerHTML = ''; d.dataset.clip = ''; } d.className = 'sq open'; return; }
  if (cur !== s.clip) {
    const c = byId[s.clip];
    d.innerHTML = `<video src="${c.src}" muted loop autoplay playsinline preload="auto"${c.img ? ` poster="${c.img}"` : ''}></video><span class="mk">${s.p}</span><span class="n"></span>`;
    d.dataset.clip = s.clip; const v = d.querySelector('video'); v.muted = true; v.play().catch(() => {});
  }
  d.className = 'sq ' + s.p.toLowerCase() + (isFresh ? ' fresh' : '');
  d.querySelector('.n').textContent = String(B.moves.findIndex(m => m.i === i) + 1);
}
function render(freshI = -1){
  const ph = phase(), w = winner(B.sq);
  for (let i = 0; i < 9; i++) paintCell(i, i === freshI);
  wall.classList.toggle('over', !!(w && w.L) && ph !== 'ZERO');
  cells.forEach((d, i) => d.classList.toggle('line', !!(w && w.L && w.L.includes(i))));
  cells.forEach(d => d.classList.toggle('armed', !!armed && d.classList.contains('open')));
  // status: the one current truth
  const last = B.moves[B.moves.length - 1];
  statusEl.innerHTML =
    ph === 'REST' ? 'Put a clip in a square' :
    ph === 'PLAY' ? `<b class="o">O</b> took ${SQUARE[last.i].toLowerCase()} · <b class="x">your move</b>` :
    ph === 'WOPR' ? '<b class="o">WOPR</b> is choosing' :
    ph === 'OVER' ? (w.p === 'D' ? '<b class="w">Draw</b> · winner none' : w.p === 'X' ? '<b class="x">You win</b>' : '<b class="o">WOPR wins</b>') + ` · ${B.moves.length} moves` :
    ph === 'ZERO' ? `<b class="o">WOPR</b> plays itself · game ${zero.games + 1} of ${ZERO_GAMES}` :
    `Playing the cut`;
  if (ph === 'REST' && B.result) statusEl.innerHTML = `<b class="w">${B.result}</b> · put a clip in a square`;
  // the dominant action and its recovery, only while valid
  const A = [];
  if (ph === 'REST') A.push(['main', 'Let WOPR play itself', zeroPlayers]);
  if (ph === 'PLAY') A.push(['main', 'Play the cut so far', playCut], ['back', 'Take back', takeBack]);
  if (ph === 'OVER') A.push(['main', `Play the cut · ${B.moves.length} shots`, playCut], ['back', 'Take back', takeBack], ['back', 'New board', newBoard]);
  if (ph === 'ZERO' || ph === 'CUT') A.push(['main', 'Stop', ph === 'ZERO' ? zeroPlayers : stopCut]);
  act.innerHTML = ''; act.hidden = !A.length;
  for (const [cls, label, fn] of A) { const b = document.createElement('button'); b.className = cls; b.textContent = label; b.onclick = fn; act.appendChild(b); }
  primaryFn = A[0] ? A[0][2] : null;
  tray.classList.toggle('locked', !(ph === 'REST' || ph === 'PLAY'));
  const used = new Set(B.moves.map(m => m.clip));
  tray.querySelectorAll('.clip').forEach(t => { t.classList.toggle('used', used.has(t.dataset.id)); t.classList.toggle('armed', t.dataset.id === armed); });
}
let primaryFn = null;
function renderTray(){
  tray.innerHTML = CLIPS.map(c => `<div class="clip" data-id="${c.id}" style="${c.img ? `background-image:url('${c.img}')` : ''}">${c.img ? '' : `<video src="${c.src}#t=4" preload="metadata" muted playsinline></video>`}<span>${c.code} ${c.id.toUpperCase()}</span></div>`).join('');
}
function arm(id){ armed = id; render(); }

/* ---------- one grab-place transaction: mouse, touch, hand ---------- */
const ghost = document.getElementById('ghost');
let press = null, carry = null;
const cellAt = (x, y) => { const e = document.elementFromPoint(x, y); const d = e && e.closest('.sq'); return d ? +d.dataset.i : -1; };
function pdown(x, y, src){
  const e = document.elementFromPoint(x, y);
  const clip = e && e.closest('.clip');
  if (src === 'hand' && e && !clip) { const b = e.closest('button'); if (b) { b.click(); return; } }
  if (tray.classList.contains('locked') && clip) return;
  press = { x, y, src, clip, moved:false };
  if (clip && src === 'hand') begin(clip.dataset.id, x, y);
}
function pmove(x, y){
  if (!press) return;
  if (!press.moved && Math.hypot(x - press.x, y - press.y) > 8) {
    press.moved = true;
    if (press.clip && !carry) { if (press.src === 'touch' && Math.abs(x - press.x) > Math.abs(y - press.y) * .8) { press = null; return; } begin(press.clip.dataset.id, x, y); }
  }
  if (carry) { ghost.style.left = x + 'px'; ghost.style.top = y + 'px'; const i = cellAt(x, y); cells.forEach((d, k) => d.classList.toggle('target', k === i && !B.sq[k])); }
}
function pup(x, y){
  if (!press) return;
  const p = press; press = null;
  if (carry) { const id = carry; carry = null; ghost.hidden = true; cells.forEach(d => d.classList.remove('target')); const i = cellAt(x, y); if (i >= 0) playerPut(i, id); return; }
  if (p.moved) return;
  if (p.clip) { arm(armed === p.clip.dataset.id ? null : p.clip.dataset.id); return; }
  const i = cellAt(x, y);
  if (i >= 0 && armed) playerPut(i, armed);
}
function begin(id, x, y){ carry = id; const c = byId[id]; ghost.style.backgroundImage = c.img ? `url("${c.img}")` : 'none'; ghost.hidden = false; ghost.style.left = x + 'px'; ghost.style.top = y + 'px'; }
tray.addEventListener('pointerdown', e => pdown(e.clientX, e.clientY, e.pointerType));
wall.addEventListener('pointerdown', e => pdown(e.clientX, e.clientY, e.pointerType));
addEventListener('pointermove', e => { if (press) { pmove(e.clientX, e.clientY); if (carry) e.preventDefault(); } }, { passive:false });
addEventListener('pointerup', e => pup(e.clientX, e.clientY));
addEventListener('pointercancel', () => { if (press && !carry) press = null; });
addEventListener('keydown', e => { if (e.key === 'Escape') { arm(null); stopCut(); } if ((e.metaKey || e.ctrlKey) && e.key === 'z') takeBack(); });

/* ---------- hands: pinch picks up, open hand drops, thumbs-up runs the main action ---------- */
const handBtn = document.getElementById('hands'), cam = document.getElementById('cam'), hc = document.getElementById('hand'), hg = hc.getContext('2d');
const H = { on:false, lm:null, x:innerWidth / 2, y:innerHeight / 2, pinch:false, thumb:0, lastThumb:0, lost:0, t:-1 };
let landmarker = null;
handBtn.onclick = async () => {
  if (H.on) { H.on = false; handBtn.classList.remove('on'); handBtn.textContent = 'Hands'; cam.srcObject && cam.srcObject.getTracks().forEach(t => t.stop()); return; }
  try {
    handBtn.textContent = 'Starting';
    cam.srcObject = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ ideal:640 }, height:{ ideal:480 } }, audio:false }); await cam.play();
    if (!landmarker) {
      const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm');
      const fs = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');
      const o = d => ({ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d }, runningMode:'VIDEO', numHands:1 });
      try { landmarker = await vision.HandLandmarker.createFromOptions(fs, o('GPU')); } catch(e) { landmarker = await vision.HandLandmarker.createFromOptions(fs, o('CPU')); }
    }
    H.on = true; handBtn.classList.add('on'); handBtn.textContent = 'Hands on';
  } catch(e) { handBtn.textContent = 'No camera'; setTimeout(() => handBtn.textContent = 'Hands', 2500); }
};
const dd = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function handTick(now){
  if (!H.on || !landmarker || cam.readyState < 2 || cam.currentTime === H.t) return; H.t = cam.currentTime;
  const lm = (landmarker.detectForVideo(cam, now).landmarks || [])[0];
  if (!lm) { H.lm = null; if (!H.lost) H.lost = now; if (now - H.lost > 700 && (H.pinch || carry)) { H.pinch = false; carry = null; press = null; ghost.hidden = true; } return; }
  H.lost = 0; H.lm = lm;
  const size = dd(lm[0], lm[9]) || 1e-3, pr = dd(lm[4], lm[8]) / size;
  const ext = [[8,6],[12,10],[16,14],[20,18]].filter(([t, p]) => dd(lm[0], lm[t]) > dd(lm[0], lm[p]) * 1.12).length;
  const thumbUp = lm[4].y < lm[3].y && lm[3].y < lm[2].y && (lm[2].y - lm[4].y) / size > .45 && ext === 0 && pr > .45;
  const was = H.pinch;
  if (H.pinch) { if (pr > .5 || ext >= 4) H.pinch = false; } else if (pr < .32) H.pinch = true;
  const mx = 1 - (lm[4].x + lm[8].x) / 2, my = (lm[4].y + lm[8].y) / 2;
  const tx = Math.min(1, Math.max(0, (mx - .12) / .76)) * innerWidth, ty = Math.min(1, Math.max(0, (my - .1) / .72)) * innerHeight;
  const k = H.pinch ? .35 : .5; H.x += (tx - H.x) * k; H.y += (ty - H.y) * k;
  if (!was && H.pinch) pdown(H.x, H.y, 'hand'); else if (H.pinch) pmove(H.x, H.y); else if (was) pup(H.x, H.y);
  if (thumbUp && !H.pinch) { if (!H.thumb) H.thumb = now; if (now - H.thumb > 450 && now - H.lastThumb > 1400 && primaryFn) { H.lastThumb = now; primaryFn(); } } else H.thumb = 0;
}
function drawHand(now){
  const w = innerWidth, h = innerHeight, r = devicePixelRatio || 1;
  if (hc.width !== Math.round(w * r)) { hc.width = Math.round(w * r); hc.height = Math.round(h * r); }
  hg.setTransform(r, 0, 0, r, 0, 0); hg.clearRect(0, 0, w, h);
  if (!H.on || !H.lm) return;
  hg.strokeStyle = hg.fillStyle = H.pinch || H.thumb ? '#ffd23f' : '#19e6c8'; hg.lineWidth = 2;
  hg.beginPath(); hg.arc(H.x, H.y, H.pinch ? 9 : 16, 0, Math.PI * 2); H.pinch ? hg.fill() : hg.stroke();
  if (H.thumb) { hg.beginPath(); hg.arc(H.x, H.y, 22, -Math.PI / 2, -Math.PI / 2 + Math.min(1, (now - H.thumb) / 450) * Math.PI * 2); hg.stroke(); }
}
(function loop(now){ requestAnimationFrame(loop); try { handTick(now); } catch(e){} drawHand(now); })(performance.now());

/* fit the wall: 4:3, as large as the space allows */
const box = document.getElementById('wallBox');
new ResizeObserver(() => { const r = box.getBoundingClientRect(); const w = Math.min(r.width, r.height * 4 / 3); wall.style.width = w + 'px'; wall.style.height = w * 3 / 4 + 'px'; }).observe(box);

renderTray(); render();
window.__wall = { get B(){ return B; }, playerPut, takeBack, newBoard, playCut, stopCut, zeroPlayers, phase, CLIPS };
</script>

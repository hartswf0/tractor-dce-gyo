<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WOPR Hand Butter</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* A world is a list of layers on one sheet of paper, back to front.
   A layer is footage, a drawn plane, masks, a drawing, a tic-tac-toe grid or a clip.
   Every layer carries its own marks, note and prompt. Time runs across all of them;
   depth spreads them apart so they can be seen, turned and reordered. */
:root{
  color-scheme:dark;
  --bg:#000; --ink:#e8f2ef; --dim:#6b7f79; --line:#1c2a31;
  --paper:#ffffff; --sheet:#f4f5f7; --pink:#161412; --muted:#8c8378; --key:#c8402f; --rule:#c9ced6;
  --x:#3b82f6; --o:#ff2e2e; --phos:#19e6c8; --amber:#ffd23f;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 var(--mono);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-left,0px))}

header{flex:none;height:42px;display:flex;align-items:center;gap:6px}
#status{flex:1;min-width:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status b{font-weight:600;color:var(--amber)}
.hb{flex:none;height:30px;padding:0 9px;border:1px solid var(--line);font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.hb:hover,.hb.on{border-color:var(--amber);color:var(--amber)}

/* the stage is paper; the world sits on it */
#stage{flex:1;min-height:0;position:relative;background:var(--sheet);perspective:1400px;perspective-origin:50% 40%;overflow:hidden;touch-action:none}
#world{position:absolute;transform-style:preserve-3d;background:var(--paper)}
#world.spread{background:transparent}
.layer{position:absolute;inset:0;pointer-events:none}
.layer canvas{position:absolute;inset:0;width:100%;height:100%}
.layer video.clipv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#world.spread .layer{outline:1px solid var(--rule);background:rgba(255,255,255,.18);pointer-events:auto;cursor:pointer}
#world.spread .layer.sel{outline:2px solid var(--key)}
.layer .lab{position:absolute;left:0;bottom:100%;padding:1px 6px;font-size:11px;font-weight:600;color:#4a5560;white-space:nowrap;display:none}
#world.spread .layer .lab{display:block}
.layer.sel .lab{color:var(--key)}
/* the game grid */
.grid{position:absolute;inset:6%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:5px}
.layer.sel:not(.flatoff) .grid{pointer-events:auto}
.sq{position:relative;border:1px solid var(--rule);overflow:hidden;background:rgba(255,255,255,.25)}
.sq video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.mark{position:absolute;inset:22%;pointer-events:none}
.mark.X::before,.mark.X::after{content:"";position:absolute;left:50%;top:-12%;width:11%;height:124%;margin-left:-5.5%;background:var(--x)}
.mark.X::before{transform:rotate(45deg)} .mark.X::after{transform:rotate(-45deg)}
.mark.O{border:max(3px,1.3vmin) solid var(--o);border-radius:50%}
.sq.clipc .mark{inset:auto;left:3px;top:3px;width:14px;height:14px}
.sq.line{box-shadow:inset 0 0 0 3px var(--amber)}

#viewBtn{position:absolute;right:8px;top:8px;z-index:5;height:30px;padding:0 10px;background:#000;border:1px solid #000;color:#fff;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
#viewBtn.on{background:var(--key);border-color:var(--key)}
#loading{position:absolute;left:8px;top:8px;z-index:5;padding:3px 8px;background:#000;color:var(--amber);font-size:11px;letter-spacing:.08em}

/* time */
#time{flex:none;display:flex;gap:6px;height:40px;margin-top:6px}
.sq-btn{flex:none;width:40px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.ic{position:relative;display:block;width:14px;height:14px}
.ic.play{width:0;height:0;border-left:12px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent}
.ic.pause{width:12px;height:14px;border-left:4px solid currentColor;border-right:4px solid currentColor}
#scrub{flex:1;min-width:0;position:relative;border:1px solid var(--line);touch-action:none;cursor:ew-resize}
#ticks i{position:absolute;bottom:0;width:1px;height:30%;background:#36474f}
#ticks i.k{height:60%;background:var(--amber)}
#fph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff}
#flab{position:absolute;left:6px;top:3px;font-size:10px;letter-spacing:.06em;color:var(--dim);pointer-events:none;white-space:nowrap}

/* layers, back to front */
#layers{flex:none;display:flex;gap:4px;margin-top:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#layers::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;min-width:76px;max-width:150px;padding:4px 8px 4px 24px;border:1px solid var(--line);position:relative;text-align:left;user-select:none;-webkit-user-select:none;cursor:grab}
.chip.sel{border-color:var(--amber)}
.chip .nm{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .sub{display:block;font-size:9px;color:var(--dim);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .eye{position:absolute;left:5px;top:50%;margin-top:-6px;width:12px;height:12px;border:1.5px solid var(--dim)}
.chip .eye.on{background:var(--ink);border-color:var(--ink)}
.chip.off .nm{color:var(--dim);text-decoration:line-through}
.chip.has::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;background:var(--key)}
.chip.dragging{opacity:.4}
.chip.add{min-width:44px;padding:0;display:grid;place-items:center;color:var(--dim)}
.ic.plus::before,.ic.plus::after{content:"";position:absolute;left:0;top:6px;width:14px;height:2px;background:currentColor}
.ic.plus::after{transform:rotate(90deg)}

/* tools for the selected layer */
#tools{flex:none;display:flex;gap:4px;margin:6px 0 10px;overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tl{flex:none;height:38px;min-width:40px;padding:0 9px;border:1px solid var(--line);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tl.on{border-color:var(--ink);color:var(--ink)}
.tl.main{border-color:var(--amber);color:var(--amber)}
.tl .sw{width:12px;height:12px;display:block}
.ic.X::before,.ic.X::after{content:"";position:absolute;left:6px;top:-1px;width:2.5px;height:16px;background:var(--x)}
.ic.X::before{transform:rotate(45deg)} .ic.X::after{transform:rotate(-45deg)}
.ic.O{border:2.5px solid var(--o);border-radius:50%}
.tsep{flex:none;width:1px;background:var(--line);margin:4px 2px}

/* one sheet at a time */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;z-index:20;background:#05080a;border-top:1px solid var(--amber);display:flex;flex-direction:column}
#sheetHead{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-bottom:1px solid var(--line)}
#sheetHead b{flex:1;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheetBody{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.k{font-size:9.5px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.p{font-size:12px}
.p a{color:var(--phos)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{min-height:36px;padding:0 12px;border:1px solid var(--line);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.btn:hover{border-color:var(--phos);color:var(--phos)}
.btn.warn{color:var(--o);border-color:rgba(255,46,46,.4)}
.btn.main{border-color:var(--amber);color:var(--amber)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld input[type=text],.fld textarea,.fld select{background:#000;border:1px solid var(--line);padding:7px 8px;font-size:16px;width:100%}
.fld textarea{min-height:64px;resize:vertical;font-size:14px}
.fld input[type=range]{width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.card{border:1px solid var(--line);text-align:left;padding:0;display:flex;flex-direction:column}
.card .th{aspect-ratio:4/3;background:#111 center/cover no-repeat;position:relative}
.card .th span{position:absolute;right:2px;bottom:2px;font-size:9px;padding:0 3px;background:#000;color:var(--dim)}
.card .tt{font-size:10.5px;padding:4px 5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ts{font-size:9px;padding:0 5px 4px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:hover{border-color:var(--phos)}
.part{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;border:1px solid var(--line);padding:6px 8px}
.part small{display:block;color:var(--dim);font-size:10px}
#wt{white-space:pre-wrap;font-size:11.5px;background:#000;border:1px solid var(--line);padding:8px;max-height:42vh;overflow:auto;user-select:text}
#search{background:#000;border:1px solid var(--line);padding:7px 8px;font-size:16px;width:100%}
#toast{position:fixed;left:50%;top:calc(48px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;padding:6px 10px;border:1px solid var(--amber);background:#000;color:var(--amber);font-size:11.5px;max-width:calc(100% - 24px);display:flex;gap:10px;align-items:center}
#toast button{color:var(--phos);text-decoration:underline;font-size:11.5px}
#hand{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
#cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="status" role="status" aria-live="polite"></div>
    <button class="hb" id="bShots">Shots</button>

  <div id="stage">
    <div id="world"></div>
    <button id="viewBtn">Depth</button>

  <div id="layers"></div>
  <div id="tools"></div>
</div>
<div id="toast" hidden></div>
<canvas id="hand"></canvas>
<video id="cam" playsinline muted></video>

const shotCache = new Map();
function getShot(slug){
  if (shotCache.has(slug)) return shotCache.get(slug);
  const p = (async () => {
    let S;
    if (slug === 'giraffe-walks-past') {
      const html = await (await fetch(SHM + 'pages/giraffe-walks-past.html')).text();
      S = JSON.parse(new DOMParser().parseFromString(html, 'text/html').getElementById('data').textContent);
      S.footageUrls = S.footage;
    } else {
      const r = await fetch(`${SHM}shots/${slug}-gwp/shot.json`); if (!r.ok) throw new Error(slug + ' ' + r.status);
      S = await r.json(); S.footageUrls = S.footage.map(u => `${SHM}shots/${slug}-gwp/${u}`);
    }
    S.slug = slug; S.n = S.cast && S.cast.frames ? S.cast.frames.length : S.footageUrls.length;
    S.imgs = S.footageUrls.map(u => { const i = new Image(); i.decoding = 'async'; i.onload = () => dirtyAll(); i.src = u; return i; });
    S.film = S.source && S.source.film || ''; S.url = S.source && S.source.url || '';
    return S;
  })();
  shotCache.set(slug, p); p.catch(() => shotCache.delete(slug)); return p;
}
const shotNow = new Map();      // slug -> loaded shot, for synchronous drawing
async function need(slug){ if (shotNow.has(slug)) return shotNow.get(slug); const S = await getShot(slug); shotNow.set(slug, S); return S; }

function layerBase(kind, name, z){ return { id:uid(), kind, name, z, vis:true, op:1, blend:'normal', look:'', note:'', prompt:'', marks:[] }; }
function layersFromShot(S, which){
  const out = [], label = S.title.replace(/,.*$/, '');
  if (!which || which === 'footage') { const L = layerBase('footage', label + ' · footage', 20); L.src = { slug:S.slug }; L.look = 'wash'; out.push(L); }
  if (!which || which === 'planes') for (const p of [...S.planes].sort((a, b) => b.z - a.z)) { const L = layerBase('plane', p.label, p.z); L.src = { slug:S.slug, plane:p.id }; L.look = 'ink'; out.push(L); }
  if (!which || which === 'masks') { if (S.masks && S.masks.length) { const L = layerBase('mask', label + ' · silhouettes', 1.9); L.src = { slug:S.slug }; L.look = 'fill'; L.vis = !!which; out.push(L); } }
  if (typeof which === 'object') { const p = S.planes.find(q => q.id === which.plane); const L = layerBase('plane', p.label, p.z); L.src = { slug:S.slug, plane:p.id }; L.look = 'ink'; out.push(L); }
  return out;
}

const touches = new Map(); let grip = null;

function gripMove(x, y){ if (!grip) return; yaw = Math.max(-75, Math.min(75, grip.yaw0 + (x - grip.x) * .3)); setSpread(Math.max(0, Math.min(1, grip.s0 - (y - grip.y) / (stage.clientHeight * .5))), true); }
function gripEnd(){ grip = null; }
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('#sheet,#viewBtn')) return;
  touches.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (touches.size === 2) { const [a, b] = [...touches.values()]; gripStart((a.x + b.x) / 2, (a.y + b.y) / 2); return; }
  pdown(e.clientX, e.clientY, e.pointerType);
});
scrubEl.addEventListener('pointerdown', e => { press = { kind:'scrub' }; scrubAt(e.clientX); scrubEl.setPointerCapture(e.pointerId); });
addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (grip && touches.size >= 2) { const [a, b] = [...touches.values()]; gripMove((a.x + b.x) / 2, (a.y + b.y) / 2); e.preventDefault(); return; }
  if (press && press.kind === 'scrub') { scrubAt(e.clientX); return; }
  if (press) { pmove(e.clientX, e.clientY); e.preventDefault(); }
}, { passive:false });
const endPtr = e => { touches.delete(e.pointerId); if (grip) { if (touches.size < 2) gripEnd(); return; } if (press && press.kind === 'scrub') { press = null; return; } pup(e.clientX, e.clientY); };
addEventListener('pointerup', endPtr); addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', e => { if (e.target.closest('#sheet')) return; e.preventDefault(); if (spread > .05) { yaw = Math.max(-75, Math.min(75, yaw + e.deltaX * .2)); setSpread(Math.max(0, Math.min(1, spread - e.deltaY * .002)), true); } else setFrame(f + Math.sign(e.deltaY)); }, { passive:false });

/* spread: flat (0) shows the composite with blends; spread (1) shows the layers apart in depth */
let spreadT = 0;
function setSpread(s, target){ spread = s; if (target) spreadT = s; document.getElementById('viewBtn').classList.toggle('on', s > .05); document.getElementById('viewBtn').textContent = s > .05 ? 'Flat' : 'Depth'; layout(); styleLayers(); status(); }
document.getElementById('viewBtn').onclick = () => { spreadT = spread > .05 ? 0 : 1; if (spreadT === 0) { yawT = 0; pitchT = 0; } else { yawT = -28; pitchT = 0; } animSpread = true; };

/* ================= worldtext: every layer's note, prompt and marks, in order ================= */
function worldtext(){
  const n = frameCount();
  const lines = [`WORLD ${W.name} · ${W.W}x${W.H} · ${n} frames at ${W.fps} fps · ${W.layers.length} layers, back to front`];
  W.layers.forEach((l, i) => {
    const S = l.src && shotNow.get(l.src.slug);
    const from = S ? ` · from “${S.title}”${S.film ? ` (${S.film})` : ''}` : l.kind === 'clip' ? ` · WarGames ${l.clip.toUpperCase()}` : '';
    lines.push('', `LAYER ${i + 1} · ${l.name} · ${KIND[l.kind]} · z ${+l.z.toFixed(2)}${l.vis ? '' : ' · hidden'}${l.blend !== 'normal' ? ' · blend ' + l.blend : ''}${l.op < 1 ? ' · opacity ' + Math.round(l.op * 100) + '%' : ''}${from}`);
    if (l.note) lines.push('  note: ' + l.note.replace(/\n/g, '\n        '));
    if (l.prompt) lines.push('  prompt: ' + l.prompt.replace(/\n/g, '\n          '));
    if (l.marks.length) { const fr = [...new Set(l.marks.filter(m => m.f != null).map(m => m.f + 1))].sort((a, b) => a - b); lines.push(`  marks: ${l.marks.length}` + (fr.length ? ` · drawn on frames ${fr.join(', ')}` : ' · held on all frames')); }
    if (l.kind === 'grid') lines.push('  board: ' + l.cells.map(c => c ? (c.p || '') + (c.clip ? '[' + c.clip + ']' : '') || '?' : '.').join(' '));
  });
  return lines.join('\n');
}

  let s = `<span style="color:var(--dim)">${esc(W.name)} · </span>${esc(l.name)}`;

addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select')) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight' || e.key === '.') setFrame(f + 1);
  if (e.key === 'ArrowLeft' || e.key === ',') setFrame(f - 1);
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.key === 'Escape') closeSheet();
});

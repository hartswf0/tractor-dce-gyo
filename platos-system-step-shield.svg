<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" style="background:#222; font-family:Arial, sans-serif;">
  <defs>
    <filter id="shadowShield" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g transform="translate(20,20)">
    <rect width="360" height="40" rx="4" fill="#333" stroke="#555" stroke-width="2"/>
    <text x="180" y="26" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">FOREST ↔ SHIELD MAPPING</text>
  </g>

  <!-- Forest panel -->
  <g transform="translate(200,150)" filter="url(#shadowShield)">
    <rect x="-220" y="-70" width="200" height="120" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <text x="-120" y="-48" fill="#facc15" font-weight="bold" font-size="13">FOREST</text>
    <text x="-120" y="-26" fill="#e5e7eb" font-size="11">Center: clearing</text>
    <text x="-120" y="-10" fill="#e5e7eb" font-size="11">Ring: trees · crates</text>
    <text x="-120" y="6" fill="#e5e7eb" font-size="11">Rim: train · plane</text>
  </g>

  <!-- Shield panel -->
  <g transform="translate(520,150)" filter="url(#shadowShield)">
    <rect x="-60" y="-70" width="220" height="120" rx="10" fill="#0f172a" stroke="#eab308" stroke-width="2"/>
    <text x="40" y="-48" fill="#eab308" font-weight="bold" font-size="13">SHIELD</text>
    <text x="40" y="-26" fill="#e5e7eb" font-size="11">Center: sun · hearth</text>
    <text x="40" y="-10" fill="#e5e7eb" font-size="11">Rings: cities · war · harvest</text>
    <text x="40" y="6" fill="#e5e7eb" font-size="11">Rim: Oceanus</text>
  </g>

  <!-- Caption -->
  <text x="400" y="230" text-anchor="middle" fill="#e5e7eb" font-size="12">
    Same 9×9 tray logic: just swap "forest scene" labels for the Shield-of-Achilles regions.
  </text>
</svg>

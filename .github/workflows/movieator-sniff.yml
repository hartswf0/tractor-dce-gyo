name: Movieator Sniff Test
on:
  push:
    branches: ["claude/platos-cave-ldraw-wzcr71"]
    paths:
      - "screen-piece-index-test.html"
      - "tests/movieator-sniff.mjs"
      - ".github/workflows/movieator-sniff.yml"
permissions:
  contents: read
jobs:
  sniff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Serve
        run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Render every figure
        run: node tests/movieator-sniff.mjs
      - name: Contact sheet
        if: always()
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import glob,os,math
          fs=glob.glob('sniff-v2/*.png'); cards=[]
          for f in fs:
            im=Image.open(f).convert('RGB'); im.thumbnail((240,520)); c=Image.new('RGB',(250,550),'white'); c.paste(im,((250-im.width)//2,15)); ImageDraw.Draw(c).text((8,530),os.path.basename(f),(0,0,0)); cards.append(c)
          cols=3; rows=max(1,math.ceil(len(cards)/cols)); out=Image.new('RGB',(cols*250,rows*550),(230,230,230))
          for i,c in enumerate(cards):out.paste(c,((i%cols)*250,(i//cols)*550))
          out.save('movieator-contact-v2.jpg',quality=60,optimize=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: movieator-sniff-v2
          path: |
            sniff-v2/
            sniff-v2-results.json
            movieator-contact-v2.jpg

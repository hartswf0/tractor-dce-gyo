name: Headwear Census
on:
  push:
    branches: ["claude/platos-cave-ldraw-wzcr71"]
    paths:
      - "tools/build-headwear-index.mjs"
      - ".github/workflows/headwear-census.yml"
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build census
        run: node tools/build-headwear-index.mjs
      - name: Commit public indexes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add headwear-index.json powerpuff-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh headwear corpus"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: headwear-census
          path: audit-output/

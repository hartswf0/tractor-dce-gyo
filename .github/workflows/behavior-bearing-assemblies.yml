name: Behavior-bearing assemblies patch

on:
  push:
    branches:
      - feature/behavior-bearing-assemblies-v1
    paths:
      - .github/workflows/behavior-bearing-assemblies.yml
      - tools/patch-behavior-bearing-assemblies.py
      - tools/test-behavior-runtime.mjs
      - odyssey-production/native/world/behavior.js
      - odyssey-production/native/world/put-that-there.js
      - odyssey-production/native/world/odyssey-play.js
      - odyssey-production/native/word-to-world.html
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/behavior-bearing-assemblies.yml
      - tools/patch-behavior-bearing-assemblies.py
      - tools/test-behavior-runtime.mjs
      - odyssey-production/native/world/behavior.js
      - odyssey-production/native/world/put-that-there.js
      - odyssey-production/native/world/odyssey-play.js
      - odyssey-production/native/word-to-world.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-check:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message || '', '[behavior-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install vertical slice
        run: python tools/patch-behavior-bearing-assemblies.py

      - name: Syntax, runtime, and patch checks
        run: |
          node --check odyssey-production/native/world/behavior.js
          node --check odyssey-production/native/world/put-that-there.js
          node --check odyssey-production/native/world/odyssey-play.js
          node tools/test-behavior-runtime.mjs
          git diff --check
          grep -q 'world/behavior.js?v=1' odyssey-production/native/word-to-world.html
          grep -q 'WorldBehavior.perform' odyssey-production/native/world/put-that-there.js
          grep -q 'WorldBehavior.attackCone' odyssey-production/native/world/odyssey-play.js

      - name: Commit installed patch
        if: ${{ github.event_name == 'push' }}
        run: |
          if git diff --quiet; then
            echo 'Already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add odyssey-production/native/word-to-world.html \
                  odyssey-production/native/world/behavior.js \
                  odyssey-production/native/world/put-that-there.js \
                  odyssey-production/native/world/odyssey-play.js
          git commit -m 'Install behavior-bearing assemblies v1 [behavior-patched]'
          git push origin HEAD:${GITHUB_REF_NAME}

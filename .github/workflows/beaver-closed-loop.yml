name: Beaver Closed Loop

on:
  push:
    paths:
      - 'ldraw-affordance/beaver/**'
      - 'ldraw-affordance/beaver-hogwarts/**'
      - 'ldraw-affordance/beaver-house-water/**'
      - 'ldraw-affordance/beaver-house-complex/**'
      - 'ldraw-affordance/beaver-house-complex-v2/**'
      - 'ldraw-affordance/beaver-spaceship/**'
      - 'ldraw-affordance/beaver-spaceship-live/**'
      - 'ldraw-affordance/beaver-world/**'
      - 'ldraw-affordance/library/**'
      - 'ldraw-affordance/src/**'
      - 'ldraw-affordance/tests/beaver-closed-loop.mjs'
      - 'ldraw-affordance/tests/beaver-build-library.mjs'
      - 'ldraw-affordance/tests/beaver-ui-contract.mjs'
      - 'ldraw-affordance/tests/hogwarts-target-import.mjs'
      - 'ldraw-affordance/tests/beaver-house-water.mjs'
      - 'ldraw-affordance/tests/beaver-house-complex.mjs'
      - 'ldraw-affordance/tests/beaver-house-complex-v2.mjs'
      - 'ldraw-affordance/tests/beaver-spaceship.mjs'
      - 'ldraw-affordance/tests/beaver-world.mjs'
      - 'ldraw-affordance/tests/releaser-field.json'
      - 'ldraw-affordance/package.json'
      - '.github/workflows/beaver-closed-loop.yml'
  workflow_dispatch:

jobs:
  hard-handshake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run LDraw affordance and beaver tests
        working-directory: ldraw-affordance
        run: |
          npm test
          node --check beaver-spaceship-live/live.js

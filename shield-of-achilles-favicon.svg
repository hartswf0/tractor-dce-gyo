<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="shieldCore" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <radialGradient id="shieldRim" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#facc15" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
  </defs>

  <!-- Outer rim -->
  <circle cx="32" cy="32" r="30" fill="url(#shieldRim)" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Inner shield -->
  <circle cx="32" cy="32" r="22" fill="url(#shieldCore)" stroke="#451a03" stroke-width="1"/>

  <!-- Cross motif -->
  <g stroke="#0f172a" stroke-width="2.2" stroke-linecap="round">
    <line x1="32" y1="16" x2="32" y2="48"/>
    <line x1="16" y1="32" x2="48" y2="32"/>
  </g>

  <!-- Center boss -->
  <circle cx="32" cy="32" r="6" fill="#0f172a" stroke="#fef9c3" stroke-width="1.2"/>
</svg>

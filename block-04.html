<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ONYX // Ontological Ancestor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        :root {
            --bg: #0b1121; --panel: #0f172a; --surface: #1e293b; --border: #334155;
            --text-main: #e2e8f0; --text-muted: #64748b;
            --func: #fbbf24; --var: #60a5fa; --tag: #c084fc; --ctrl: #f87171;
            --focus: rgba(245, 158, 11, 0.2); --up: rgba(34, 197, 94, 0.3); --down: rgba(239, 68, 68, 0.3);
            --wire-base: #475569; --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --header-height: 64px; --console-height: 256px; --sidebar-width: 288px; --inspector-width: 320px;
            --grid-color: #334155;
        }
        [data-theme="parchment"] {
            --bg: #fefce8; --panel: #fef9c3; --surface: #fde047; --border: #facc15; --text-muted: #eab308; --text-main: #713f12;
            --wire-base: #facc15; --func: #dc2626; --var: #2563eb; --tag: #7c3aed; --ctrl: #16a34a; --focus: rgba(245, 158, 11, 0.4);
        }
        [data-theme="terminal"] {
            --bg: #171717; --panel: #262626; --surface: #404040; --border: #525252; --text-muted: #737373; --text-main: #86efac;
            --wire-base: #22c55e; --func: #fde047; --var: #93c5fd; --tag: #d8b4fe; --ctrl: #fca5a5; --focus: rgba(34, 197, 94, 0.3);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text-main); overscroll-behavior: none; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--panel); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--surface); }

        .layout-root {
            display: grid;
            grid-template-areas: "sidebar header header" "sidebar canvas inspector" "console console console";
            grid-template-columns: var(--sidebar-width) 1fr var(--inspector-width);
            grid-template-rows: var(--header-height) 1fr var(--console-height);
            width: 100vw; height: 100dvh;
        }
        @media (max-width: 768px) {
            .layout-root {
                grid-template-areas: "header header header" "canvas canvas canvas" "console console console";
                grid-template-columns: 0px 1fr 0px;
            }
        }
        #header-bar { grid-area: header; }
        #canvas-area { grid-area: canvas; }
        #sidebar { grid-area: sidebar; }
        #inspector { grid-area: inspector; }
        #console-panel { grid-area: console; }

        .header-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1rem; background: var(--panel);
            border-bottom: 1px solid var(--border);
            z-index: 900;
        }
        .nav-deck {
            display: flex; gap: 0.5rem;
            background: var(--surface);
            padding: 0.25rem; border-radius: 0.5rem;
        }
        .nav-tab {
            padding: 0.5rem 1rem; border-radius: 0.375rem;
            font-size: 0.875rem; color: var(--text-muted);
            cursor: pointer; transition: all 0.2s var(--ease);
        }
        .nav-tab.active {
            background: var(--focus); color: var(--func);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
        }

        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            transition: width 0.3s var(--ease);
            overflow: hidden; z-index: 500;
        }
        .sidebar-collapsed { width: 0 !important; }
        .sidebar-expanded { width: var(--sidebar-width) !important; }
        .tool-item {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.75rem; margin: 0.25rem;
            border-radius: 0.5rem; color: var(--text-main);
            cursor: pointer; transition: all 0.2s var(--ease);
        }
        .tool-item:hover {
            background: var(--surface); transform: translateX(4px);
        }
        .icon { width: 2rem; height: 2rem; flex-shrink: 0; }

        #mobile-menu-btn {
            display: none; position: absolute; top: 1rem; left: 1rem;
            z-index: 1000; padding: 0.5rem;
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 0.375rem; cursor: pointer;
        }
        @media (max-width: 768px) { #mobile-menu-btn { display: block; } }

        #canvas-area {
            position: relative; width: 100%; height: 100%;
            overflow: hidden; background: var(--bg);
        }
        .grid-overlay {
            position: absolute; inset: 0;
            pointer-events: none; opacity: 0.1;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: grid-fade 2s ease-in-out infinite alternate;
        }

        #grid-shell {
            position: absolute; inset: 0; margin: auto;
            aspect-ratio: 1 / 1;
            width: min(100%, calc(100dvh - var(--header-height) - var(--console-height)));
            max-height: 100%;
        }

        #grid-lock {
            position: absolute; inset: 0;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 1px; padding: 0;
            pointer-events: none;
            z-index: 5;
        }
        .grid-cell {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 0.375rem; position: relative;
            pointer-events: auto; transition: all 0.2s var(--ease);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 0; min-width: 0;
        }
        .grid-cell:hover {
            border-color: var(--func);
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
        }
        .grid-cell.active {
            background: var(--focus);
            border-color: var(--func);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
        }
        .grid-cell.highlight-up {
            border-color: var(--up);
            background: rgba(34, 197, 94, 0.1);
        }
        .grid-cell.highlight-down {
            border-color: var(--down);
            background: rgba(239, 68, 68, 0.1);
        }

        #nodes-layer {
            position: absolute; inset: 0;
            z-index: 10; pointer-events: none;
        }
        .node-instance {
            position: absolute; transform: translate(-50%, -50%);
            cursor: grab; pointer-events: auto;
            transition: transform 0.2s var(--ease);
            z-index: 10;
        }
        .node-instance:hover {
            transform: translate(-50%, -50%) scale(1.1);
            z-index: 50;
        }
        .node-instance.selected {
            transform: translate(-50%, -50%) scale(1.15);
            z-index: 50;
        }
        .node-halo {
            position: absolute; inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--func) 0%, transparent 70%);
            opacity: 0; transition: opacity 0.3s var(--ease);
        }
        .node-instance:hover .node-halo { opacity: 0.3; }
        .node-instance.selected .node-halo { opacity: 0.6; }

        #connections-layer {
            position: absolute; inset: 0;
            pointer-events: none; z-index: 6;
        }
        path.wire {
            fill: none; stroke: var(--wire-base); stroke-width: 1.5;
            opacity: 0.4; transition: opacity 0.2s var(--ease);
        }
        path.wire.active {
            opacity: 1; stroke-width: 2.5;
            filter: drop-shadow(0 0 4px currentColor);
        }
        path.wire.up { stroke: var(--up); color: var(--up); }
        path.wire.down { stroke: var(--down); color: var(--down); }

        #code-editor {
            display: none; position: absolute; inset: 0;
            background: var(--bg); padding: 1rem;
            overflow-y: auto; font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem; line-height: 1.5;
            z-index: 15;
        }
        .line {
            padding: 0.125rem 0.5rem;
            border-left: 2px solid transparent;
            transition: all 0.2s var(--ease);
            white-space: pre-wrap;
        }
        .line:hover { background: var(--surface); }
        .line.active {
            background: var(--focus);
            border-left-color: var(--func);
        }
        .token-func { color: var(--func); }
        .token-var { color: var(--var); }
        .token-tag { color: var(--tag); }
        .token-ctrl { color: var(--ctrl); }
        .token-comment { color: var(--text-muted); font-style: italic; }

        #preview-frame {
            display: none; position: absolute; inset: 0;
            width: 100%; height: 100%; border: none; background: white;
            z-index: 20;
        }

        #inspector {
            background: var(--panel);
            border-left: 1px solid var(--border);
            display: flex; flex-direction: column;
            transition: transform 0.3s var(--ease);
            z-index: 999; overflow: hidden;
        }
        .inspector-collapsed { transform: translateX(100%); }
        .inspector-expanded { transform: translateX(0); }
        @media (max-width: 768px) {
            #inspector {
                position: fixed; top: var(--header-height);
                left: 0; right: 0; height: 50vh;
                transform: translateY(100%);
                border-left: none; border-top: 1px solid var(--border);
            }
            .inspector-expanded { transform: translateY(0) !important; }
        }

        .nav-stream {
            display: flex; align-items: center; gap: 0.5rem;
            overflow-x: auto; height: 100%;
        }
        .chip {
            display: inline-flex; height: 22px; align-items: center; padding: 0 8px;
            border-radius: 4px; font-size: 10px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-muted); cursor: pointer;
            white-space: nowrap; transition: all 0.1s var(--ease);
        }
        .chip:hover {
            border-color: var(--text-main); color: var(--text-main);
            transform: translateY(-1px);
        }
        .chip.up { border-left: 2px solid var(--up); }
        .chip.down { border-right: 2px solid var(--down); }

        #console-panel {
            background: var(--panel);
            border-top: 1px solid var(--border);
            transition: height 0.3s var(--ease);
            z-index: 200;
        }
        .console-collapsed { height: 2rem !important; }
        .log-entry {
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
            padding: 0.25rem 0.5rem; border-bottom: 1px solid var(--border);
        }
        .log-success { color: #22c55e; }
        .log-info { color: #60a5fa; }
        .log-warn { color: var(--func); }
        .log-error { color: #f87171; }

        #toast-container {
            position: fixed; bottom: 1rem; left: 50%;
            transform: translateX(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 0.5rem;
            width: 90%; max-width: 400px; pointer-events: none;
        }
        .toast {
            background: var(--panel); border: 1px solid var(--func);
            color: var(--text-main); padding: 0.75rem; border-radius: 0.5rem;
            font-size: 0.875rem; backdrop-filter: blur(4px);
            display: flex; align-items: center; gap: 0.5rem;
            pointer-events: auto; animation: fadeUp 0.3s var(--ease);
        }

        .theme-switcher {
            display: flex; gap: 0.25rem; padding: 0.25rem;
            background: var(--surface); border-radius: 0.375rem;
        }
        .theme-btn {
            padding: 0.25rem 0.5rem; border-radius: 0.25rem;
            font-size: 0.75rem; cursor: pointer;
            color: var(--text-muted); transition: all 0.2s var(--ease);
        }
        .theme-btn.active {
            background: var(--focus); color: var(--func);
        }

        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes grid-fade { 0% { opacity: 0.05; } 100% { opacity: 0.15; } }

        .empty-msg { font-size: 9px; color: #222; font-style: italic; }
    </style>
<base target="_blank">
</head>
<body class="layout-root" data-theme="dark">
    <div id="toast-container"></div>

    <div id="sideblade-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center;">
        <div style="width: 90%; max-width: 600px; background: var(--panel); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
            <h3 style="color: var(--func); font-weight: bold; font-size: 1.125rem;">INGEST CODE OR NODES</h3>
            <textarea id="paste-input" placeholder="Paste JavaScript, HTML, or node definitions JSON..." style="background: var(--bg); border: 1px solid var(--border); padding: 0.5rem; color: var(--text-main); font-family: 'JetBrains Mono', monospace; min-height: 120px; border-radius: 0.375rem;"></textarea>
            <div style="display: flex; gap: 0.5rem;">
                <button onclick="INGEST.loadCode()" class="tool-item" style="flex: 1; justify-content: center;">LOAD CODE</button>
                <button onclick="INGEST.loadNodes()" class="tool-item" style="flex: 1; justify-content: center;">LOAD NODES</button>
                <button onclick="INGEST.toggle()" class="tool-item" style="flex: 1; justify-content: center;">CANCEL</button>
            </div>
        </div>
    </div>

    <button id="mobile-menu-btn" onclick="SIDEBAR.toggle()">
        <i data-lucide="menu" style="color: var(--text-main); width: 1rem; height: 1rem;"></i>
    </button>
    
    <header id="header-bar" class="header-bar">
        <div class="nav-deck">
            <button class="nav-tab active" data-view="grid" onclick="VIEW.switch('grid')">GRID</button>
            <button class="nav-tab" data-view="code" onclick="VIEW.switch('code')">CODE</button>
            <button class="nav-tab" data-view="preview" onclick="VIEW.switch('preview')">PREVIEW</button>
        </div>
        
        <div style="display: flex; align-items: center; gap: 1rem;">
            <button id="btn-play" onclick="AUTOPLAY.toggle()" title="Toggle Autoplay" style="padding: 0.5rem; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--panel);">
                <i data-lucide="play" style="color: var(--text-muted); width: 1rem; height: 1rem;"></i>
            </button>
            
            <div class="theme-switcher">
                <button class="theme-btn active" data-theme="dark" onclick="THEME.switch('dark')">DARK</button>
                <button class="theme-btn" data-theme="parchment" onclick="THEME.switch('parchment')">PARCH</button>
                <button class="theme-btn" data-theme="terminal" onclick="THEME.switch('terminal')">TERM</button>
            </div>
            
            <button onclick="INGEST.toggle()" title="Ingest" style="padding: 0.5rem; border: 1px solid var(--border); border-radius: 0.375rem; background: var(--panel);">
                <i data-lucide="upload" style="color: var(--text-muted); width: 1rem; height: 1rem;"></i>
            </button>
        </div>
    </header>

    <aside id="sidebar" class="sidebar sidebar-expanded">
        <div style="height: var(--header-height); display: flex; align-items: center; padding: 0 1rem; border-bottom: 1px solid var(--border);">
            <div class="icon">
                <svg viewBox="0 0 40 40" class="iso-icon"><path d="M20 4 L36 12 L20 20 L4 12 Z" fill="#fbbf24" stroke="#1e293b" stroke-width="1"/><path d="M4 12 L20 20 L20 38 L4 30 Z" fill="#f59e0b" stroke="#1e293b" stroke-width="1"/><path d="M36 12 L20 20 L20 38 L36 30 Z" fill="#d97706" stroke="#1e293b" stroke-width="1"/></svg>
            </div>
            <div>
                <span style="font-weight: bold; color: var(--text-main);">ONYX</span>
                <span style="font-size: 0.625rem; color: var(--func); display: block;">Ontological Nexus</span>
            </div>
        </div>
        
        <div id="tools-list" style="flex: 1; overflow-y: auto; padding: 0.5rem;"></div>
        
        <div style="padding: 0.5rem; font-size: 0.625rem; color: var(--text-muted); text-align: center;">
            Click tool → place on grid • Click cell → inspect
        </div>
        
        <div style="padding: 1rem; border-top: 1px solid var(--border);">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                <span style="font-size: 0.75rem; color: var(--text-muted);">Storage</span>
                <span id="storage-status" style="font-size: 0.75rem; color: #22c55e;">Synced</span>
            </div>
            <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.625rem; color: var(--text-muted);">
                <div style="width: 0.5rem; height: 0.5rem; background: var(--panel); border: 1px solid var(--border); border-radius: 0.125rem;"></div>
                <span>Local Persistence</span>
            </div>
        </div>
    </aside>

    <main id="canvas-area">
        <div class="grid-overlay"></div>
        
        <div id="grid-shell">
            <div id="grid-lock"></div>
            
            <div id="nodes-layer"></div>
            
            <svg id="connections-layer"></svg>
            
            <div id="code-editor"></div>
            
            <iframe id="preview-frame"></iframe>
        </div>
    </main>

    <aside id="inspector" class="inspector-collapsed">
        <div style="height: 3rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <div class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></div>
                <span style="font-weight: bold; color: var(--text-main);">Inspector</span>
            </div>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <span class="focus-label" style="font-size: 8px; color: #444; letter-spacing: 0.1em;">FOCUS</span>
                <span class="focus-val" id="nav-label" style="font-size: 12px; font-weight: 800; color: var(--focus); white-space: nowrap;">--</span>
                <button onclick="INSPECTOR.close()" style="color: var(--text-muted);">
                    <i data-lucide="x" style="width: 1rem; height: 1rem;"></i>
                </button>
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 0.5rem 1rem; background: var(--panel); border-bottom: 1px solid var(--border);">
            <div class="nav-stream upstream" id="nav-up" style="justify-content: flex-end;"></div>
            <div class="nav-focus" style="display: flex; flex-direction: column; align-items: center; min-width: 100px;">
                <span class="focus-label">FOCUS</span>
                <span class="focus-val" id="nav-label-center">--</span>
            </div>
            <div class="nav-stream downstream" id="nav-down"></div>
        </div>
        
        <div id="inspector-content" style="flex: 1; overflow-y: auto; padding: 1rem;"></div>
        
        <div style="padding: 1rem; border-top: 1px solid var(--border);">
            <button onclick="INSPECTOR.delete()" style="width: 100%; padding: 0.75rem; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #f87171; border-radius: 0.375rem; font-size: 0.75rem; font-weight: bold; text-transform: uppercase;">DELETE ENTITY</button>
        </div>
    </aside>

    <div id="console-panel" style="height: var(--console-height);">
        <div id="console-header" style="height: 2rem; background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; cursor: pointer; border-bottom: 1px solid var(--border);" onclick="CONSOLE.toggle()">
            <div style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-muted); font-size: 0.75rem; font-weight: bold;">
                <i data-lucide="terminal" style="width: 1rem; height: 1rem;"></i>
                <span>SYSTEM CONSOLE</span>
            </div>
            <i id="console-toggle-icon" data-lucide="chevron-down" style="width: 1rem; height: 1rem; color: var(--text-muted);"></i>
        </div>
        <div id="console-content" style="height: calc(100% - 2rem); overflow-y: auto; padding: 0.5rem;"></div>
    </div>

    <script>
        const STATE = {
            grid: Array(81).fill(null).map((_, i) => ({
                cellIndex: i,
                type: null,
                data: null,
                deps: [],
                callers: []
            })),
            activeCell: null,
            viewMode: 'grid',
            theme: 'dark',
            consoleOpen: true,
            isDragging: false,
            draggedNodeId: null,
            lastX: 0,
            lastY: 0
        };

        const ICONS = {
            getIsoCube(color = "blue") {
                const colors = { blue: { top: '#60a5fa', left: '#3b82f6', right: '#2563eb' }, yellow: { top: '#fcd34d', left: '#f59e0b', right: '#d97706' }, cyan: { top: '#22d3ee', left: '#06b6d4', right: '#0891b2' }, purple: { top: '#e879f9', left: '#c026d3', right: '#a21caf' }, green: { top: '#4ade80', left: '#16a34a', right: '#15803d' } };
                const c = colors[color] || colors.blue;
                return `<svg viewBox="0 0 40 40" class="w-full h-full"><path d="M20 4 L36 12 L20 20 L4 12 Z" fill="${c.top}" stroke="#1e293b" stroke-width="1"/><path d="M4 12 L20 20 L20 38 L4 30 Z" fill="${c.left}" stroke="#1e293b" stroke-width="1"/><path d="M36 12 L20 20 L20 38 L36 30 Z" fill="${c.right}" stroke="#1e293b" stroke-width="1"/></svg>`;
            },
            Entity: () => ICONS.getIsoCube('blue'),
            Core: () => ICONS.getIsoCube('yellow'),
            Goal: () => `<div class="relative w-full h-full"><div class="absolute -top-2 left-0 right-0 mx-auto w-4 h-4 flex justify-center items-center text-yellow-400"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg></div>${ICONS.getIsoCube('blue')}</div>`,
            Obstacle: () => `<div class="relative w-full h-full flex items-center justify-center"><div class="w-3/4 h-3/4 relative">${ICONS.getIsoCube('blue')}</div><div class="absolute right-0 h-full w-1 bg-slate-400/80"></div><div class="absolute right-1 top-1/2 w-3 h-0.5 bg-yellow-400"></div></div>`,
            Morphism: () => `<div class="relative w-full h-full flex items-center justify-between"><div class="w-5 h-5">${ICONS.getIsoCube('blue')}</div><div class="flex-1 h-0.5 bg-yellow-400 mx-1 relative"></div><div class="w-5 h-5">${ICONS.getIsoCube('blue')}</div></div>`,
            Shift: () => `<div class="relative w-full h-full flex items-center justify-center"><div class="w-5 h-5 opacity-50">${ICONS.getIsoCube('blue')}</div><div class="absolute z-10 text-yellow-400"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="currentColor"/></svg></div><div class="w-5 h-5 opacity-50">${ICONS.getIsoCube('blue')}</div></div>`,
            Location: () => `<div class="relative w-full h-full flex items-center justify-center"><div class="absolute top-0 right-0 w-4 h-4">${ICONS.getIsoCube('cyan')}</div><div class="absolute bottom-0 left-0 w-4 h-4">${ICONS.getIsoCube('cyan')}</div></div>`,
            Timepoint: () => `<div class="relative w-full h-full flex items-center justify-center"><div class="w-3/4 h-3/4">${ICONS.getIsoCube('cyan')}</div><div class="absolute -right-1 -bottom-1 w-5 h-5 bg-[var(--bg)] rounded-full border border-cyan-500 flex items-center justify-center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="2" fill="none"/></svg></div></div>`,
            Scene: () => `<div class="relative w-full h-full flex items-center justify-center p-1"><div class="absolute top-0 left-0 w-2 h-2 border-l-2 border-t-2 border-cyan-400"></div><div class="absolute top-0 right-0 w-2 h-2 border-r-2 border-t-2 border-cyan-400"></div><div class="absolute bottom-0 left-0 w-2 h-2 border-l-2 border-b-2 border-cyan-400"></div><div class="absolute bottom-0 right-0 w-2 h-2 border-r-2 border-b-2 border-cyan-400"></div><div class="flex gap-0.5"><div class="w-3 h-3">${ICONS.getIsoCube('cyan')}</div><div class="w-3 h-3">${ICONS.getIsoCube('cyan')}</div></div></div>`,
            Story: () => `<div class="relative w-full h-full flex flex-col items-center justify-start pt-1"><div class="w-4 h-4 z-10">${ICONS.getIsoCube('cyan')}</div><div class="w-full h-0.5 bg-cyan-500/50"></div><div class="flex gap-1 mt-2"><div class="w-2.5 h-2.5">${ICONS.getIsoCube('cyan')}</div><div class="w-2.5 h-2.5">${ICONS.getIsoCube('cyan')}</div><div class="w-2.5 h-2.5">${ICONS.getIsoCube('cyan')}</div></div></div>`
        };

        const GRID = {
            step: 100 / 9,
            snapToGrid: true,
            center(col, row) {
                const x = (col + 0.5) * this.step;
                const y = (row + 0.5) * this.step;
                return { x, y, row, col, cellIndex: row * 9 + col };
            },
            snap(x, y) {
                const col = Math.max(0, Math.min(8, Math.floor(x / this.step)));
                const row = Math.max(0, Math.min(8, Math.floor(y / this.step)));
                return this.center(col, row);
            }
        };

        const PARSER = {
            patterns: {
                fn: /(?:function|class)\s+(\w+)|(\w+)\s*\(/,
                vr: /(?:const|let|var)\s+(\w+)/,
                tag: /^<(\w+)/,
                comment: /\/\/(.*)$/,
                scopeStart: /[{([]/,
                scopeEnd: /[}\])]/
            },

            parseCode(text) {
                const lines = text.split('\n').filter(l => l.trim());
                STATE.grid.forEach(cell => {
                    if (cell.type === 'block') {
                        cell.type = null;
                        cell.data = null;
                        cell.deps = [];
                        cell.callers = [];
                    }
                });
                
                const lpc = Math.ceil(lines.length / 81);
                let blockCount = 0;
                
                lines.forEach((line, i) => {
                    const cellIdx = Math.floor(i / lpc);
                    if (cellIdx >= 81 || STATE.grid[cellIdx].type === 'node') return;
                    
                    const trimmed = line.trim();
                    let type = 'other';
                    let name = null;
                    
                    if (trimmed.match(this.patterns.tag)) {
                        type = 'tag';
                        name = trimmed.match(this.patterns.tag)[1];
                    } else if (trimmed.match(this.patterns.fn)) {
                        type = 'func';
                        name = (trimmed.match(this.patterns.fn)[1] || trimmed.match(this.patterns.fn)[2]);
                    } else if (trimmed.match(this.patterns.vr)) {
                        type = 'var';
                        name = trimmed.match(this.patterns.vr)[1];
                    } else if (trimmed.match(this.patterns.comment)) {
                        type = 'comment';
                    }
                    
                    if (name && !STATE.grid[cellIdx].data) {
                        STATE.grid[cellIdx].type = 'block';
                        STATE.grid[cellIdx].data = { type, name, line: i, pri: type === 'func' ? 3 : type === 'tag' ? 2 : 1 };
                        blockCount++;
                    }
                });

                // Second pass for dependencies
                lines.forEach((line, i) => {
                    const cellIdx = Math.floor(i / lpc);
                    if (cellIdx >= 81 || !STATE.grid[cellIdx].data) return;
                    
                    const words = line.match(/\w+/g) || [];
                    words.forEach(word => {
                        const targetIdx = STATE.grid.findIndex(cell => cell.data && cell.data.name === word);
                        if (targetIdx !== -1 && targetIdx !== cellIdx) {
                            STATE.grid[cellIdx].deps.push(targetIdx);
                            STATE.grid[targetIdx].callers.push(cellIdx);
                        }
                    });
                });

                STATE.grid.forEach(cell => {
                    cell.deps = [...new Set(cell.deps)];
                    cell.callers = [...new Set(cell.callers)];
                });
                
                LOG.toast(`Parsed ${lines.length} lines into ${blockCount} blocks`);
            },

            parseNodes(defs) {
                if (!Array.isArray(defs)) throw new Error("Expected array");
                
                // Clear existing nodes
                STATE.grid.forEach(cell => {
                    if (cell.type === 'node') {
                        cell.type = null;
                        cell.data = null;
                    }
                });
                
                defs.forEach((node, i) => {
                    const cellIdx = node.cellIndex !== undefined ? node.cellIndex : i;
                    if (cellIdx >= 81) return;
                    
                    STATE.grid[cellIdx].type = 'node';
                    STATE.grid[cellIdx].data = {
                        id: node.id || Date.now() + i,
                        type: node.type || 'entity',
                        icon: node.icon || 'Entity',
                        label: node.label || `${node.type}<${node.type}>`
                    };
                });
                
                LOG.toast(`Loaded ${defs.length} nodes`);
            }
        };

        const RENDERER = {
            grid() {
                const container = document.getElementById('grid-lock');
                container.innerHTML = '';
                
                STATE.grid.forEach((cell, i) => {
                    const el = document.createElement('div');
                    el.className = 'grid-cell';
                    el.dataset.index = i;
                    
                    if (cell.type === 'node' && cell.data) {
                        el.innerHTML = ICONS[cell.data.icon] ? ICONS[cell.data.icon]() : ICONS.Entity();
                        el.onclick = () => INSPECTOR.selectNode(i);
                    } else if (cell.type === 'block' && cell.data) {
                        const symbols = { func: '⚡', var: '◆', tag: '◻', comment: '//', other: '○' };
                        const symbol = symbols[cell.data.type] || '○';
                        el.innerHTML = `<div style="font-size: 1.5rem;">${symbol}</div><div style="font-size: 0.5rem; margin-top: -4px; opacity: 0.7;">${cell.data.name.slice(0, 4)}</div>`;
                        el.onclick = () => NAV.xray(i);
                    } else {
                        el.innerHTML = '<div style="opacity: 0.1;">·</div>';
                        el.onclick = null;
                    }
                    
                    if (STATE.activeCell === i) {
                        el.classList.add('active');
                    }
                    
                    container.appendChild(el);
                });
            },

            connections() {
                const svg = document.getElementById('connections-layer');
                svg.innerHTML = '';
                
                STATE.grid.forEach((cell, i) => {
                    if (!cell.data) return;
                    
                    const fromPos = GRID.center(i % 9, Math.floor(i / 9));
                    
                    cell.deps.forEach(depIdx => {
                        const dep = STATE.grid[depIdx];
                        if (!dep.data) return;
                        
                        const toPos = GRID.center(depIdx % 9, Math.floor(depIdx / 9));
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        
                        const d = `M ${fromPos.x}% ${fromPos.y}% C ${fromPos.x + 10}% ${fromPos.y}%, ${toPos.x - 10}% ${toPos.y}%, ${toPos.x}% ${toPos.y}%`;
                        path.setAttribute('d', d);
                        path.setAttribute('class', 'wire');
                        path.dataset.from = i;
                        path.dataset.to = depIdx;
                        svg.appendChild(path);
                    });
                });
            },

            code() {
                const editor = document.getElementById('code-editor');
                editor.innerHTML = '';
                const blocks = STATE.grid.filter(cell => cell.type === 'block' && cell.data);
                blocks.sort((a, b) => a.data.line - b.data.line);
                
                blocks.forEach(cell => {
                    const line = document.createElement('div');
                    line.className = 'line';
                    line.dataset.cell = cell.cellIndex;
                    line.textContent = `// ${cell.data.name} (${cell.data.type})`;
                    if (STATE.activeCell === cell.cellIndex) {
                        line.classList.add('active');
                    }
                    editor.appendChild(line);
                });
            }
        };

        const NAV = {
            xray(idx) {
                STATE.activeCell = idx;
                
                // Reset all highlights
                document.querySelectorAll('.grid-cell').forEach(cell => {
                    cell.classList.remove('active', 'highlight-up', 'highlight-down');
                });
                document.querySelectorAll('.wire').forEach(w => {
                    w.classList.remove('active', 'up', 'down');
                    w.style.opacity = '0.4';
                });
                
                // Update labels
                const cell = STATE.grid[idx];
                document.getElementById('nav-label').textContent = cell?.data?.name || '--';
                document.getElementById('nav-label-center').textContent = cell?.data?.name || '--';
                
                if (!cell || !cell.data) {
                    this.updateStreams(null);
                    return;
                }
                
                // Highlight cell
                document.querySelector(`[data-index="${idx}"]`)?.classList.add('active');
                
                // Highlight dependencies
                cell.callers?.forEach(c => {
                    document.querySelector(`[data-index="${c}"]`)?.classList.add('highlight-up');
                    const w = document.querySelector(`path[data-from="${c}"][data-to="${idx}"]`);
                    if (w) { w.classList.add('active', 'up'); w.style.opacity = '1'; }
                });
                
                cell.deps?.forEach(d => {
                    document.querySelector(`[data-index="${d}"]`)?.classList.add('highlight-down');
                    const w = document.querySelector(`path[data-from="${idx}"][data-to="${d}"]`);
                    if (w) { w.classList.add('active', 'down'); w.style.opacity = '1'; }
                });
                
                this.updateStreams(cell);
                RENDERER.grid();
            },
            
            updateStreams(cell) {
                const up = document.getElementById('nav-up');
                const down = document.getElementById('nav-down');
                up.innerHTML = ''; down.innerHTML = '';
                
                if (!cell || !cell.data) {
                    up.innerHTML = '<span class="empty-msg">ROOT</span>';
                    down.innerHTML = '<span class="empty-msg">LEAF</span>';
                    return;
                }
                
                const mkChip = (idx, cls) => {
                    const target = STATE.grid[idx];
                    if (!target?.data) return;
                    const chip = document.createElement('div');
                    chip.className = `chip ${cls}`;
                    chip.textContent = target.data.name || target.data.label;
                    chip.onclick = () => this.xray(idx);
                    return chip;
                };
                
                if (!cell.callers?.length) up.innerHTML = '<span class="empty-msg">ROOT</span>';
                else cell.callers.forEach(c => up.appendChild(mkChip(c, 'up')));
                
                if (!cell.deps?.length) down.innerHTML = '<span class="empty-msg">LEAF</span>';
                else cell.deps.forEach(d => down.appendChild(mkChip(d, 'down')));
            }
        };

        const SIDEBAR = {
            toggle() {
                STATE.sidebarOpen = !STATE.sidebarOpen;
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('sidebar-collapsed', !STATE.sidebarOpen);
                sidebar.classList.toggle('sidebar-expanded', STATE.sidebarOpen);
                LOG.toast(STATE.sidebarOpen ? 'Sidebar opened' : 'Sidebar collapsed');
            },
            
            renderTools() {
                const tools = [
                    { label: 'Entity', icon: 'Entity' },
                    { label: 'Core', icon: 'Core' },
                    { label: 'Goal', icon: 'Goal' },
                    { label: 'Obstacle', icon: 'Obstacle' },
                    { label: 'Morphism', icon: 'Morphism' },
                    { label: 'Shift', icon: 'Shift' },
                    { label: 'Location', icon: 'Location' },
                    { label: 'Timepoint', icon: 'Timepoint' },
                    { label: 'Scene', icon: 'Scene' },
                    { label: 'Story', icon: 'Story' }
                ];
                
                const container = document.getElementById('tools-list');
                container.innerHTML = tools.map(tool => `
                    <div class="tool-item" onclick="SIDEBAR.addNode('${tool.label}', '${tool.icon}')">
                        <div class="icon">${ICONS[tool.icon]()}</div>
                        <div style="display: flex; flex-direction: column;">
                            <span style="font-size: 0.875rem; color: var(--text-main);">${tool.label}</span>
                            <span style="font-size: 0.625rem; color: var(--text-muted);">&lt;${tool.icon}&gt;</span>
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            },
            
            addNode(type, iconKey) {
                const emptyCells = STATE.grid.map((cell, i) => cell.type ? null : i).filter(i => i !== null);
                if (!emptyCells.length) return LOG.toast('Grid full');
                
                const cellIdx = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                const pos = GRID.center(cellIdx % 9, Math.floor(cellIdx / 9));
                
                STATE.grid[cellIdx].type = 'node';
                STATE.grid[cellIdx].data = {
                    id: Date.now(),
                    type: type.toLowerCase(),
                    icon: iconKey,
                    label: `${type}<${type}>`
                };
                
                RENDERER.grid();
                RENDERER.connections();
                PERSISTENCE.save();
                LOG.toast(`Added ${type}`);
                
                if (window.innerWidth <= 768) this.toggle();
            }
        };

        const INSPECTOR = {
            selectNode(cellIndex) {
                const cell = STATE.grid[cellIndex];
                if (!cell?.data) return;
                
                STATE.activeCell = cellIndex;
                RENDERER.grid();
                
                const content = document.getElementById('inspector-content');
                content.innerHTML = `
                    <div class="space-y-4 animate-fade-up">
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Identity</label>
                            <div class="p-3 rounded bg-slate-800/50 border border-slate-700/50 space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-slate-400">Cell</span>
                                    <span class="text-xs font-mono text-cyan-500">#${cellIndex}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-slate-400">Type</span>
                                    <span class="text-xs font-mono text-yellow-500 uppercase">${cell.data.type || cell.data.icon}</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span class="text-sm text-slate-400">Label</span>
                                    <input type="text" value="${cell.data.name || cell.data.label}" 
                                           onchange="INSPECTOR.updateLabel(${cellIndex}, this.value)"
                                           class="text-right text-sm bg-transparent border-b border-slate-600 focus:border-cyan-500 outline-none text-white w-32" />
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                const inspector = document.getElementById('inspector');
                inspector.classList.remove('inspector-collapsed');
                inspector.classList.add('inspector-expanded');
            },
            
            updateLabel(cellIndex, value) {
                const cell = STATE.grid[cellIndex];
                if (!cell?.data) return;
                
                if (cell.type === 'node') {
                    cell.data.label = value;
                } else {
                    cell.data.name = value;
                }
                
                RENDERER.grid();
                LOG.toast('Label updated');
                PERSISTENCE.save();
            },
            
            delete() {
                if (STATE.activeCell === null) return;
                
                const cell = STATE.grid[STATE.activeCell];
                if (!cell) return;
                
                cell.type = null;
                cell.data = null;
                cell.deps = [];
                cell.callers = [];
                
                STATE.activeCell = null;
                RENDERER.grid();
                RENDERER.connections();
                this.close();
                LOG.toast('Entity deleted');
                PERSISTENCE.save();
            },
            
            close() {
                STATE.activeCell = null;
                const inspector = document.getElementById('inspector');
                inspector.classList.add('inspector-collapsed');
                inspector.classList.remove('inspector-expanded');
                RENDERER.grid();
            }
        };

        const CONSOLE = {
            toggle() {
                STATE.consoleOpen = !STATE.consoleOpen;
                const panel = document.getElementById('console-panel');
                panel.classList.toggle('console-collapsed', !STATE.consoleOpen);
                
                const icon = document.getElementById('console-toggle-icon');
                icon.setAttribute('data-lucide', STATE.consoleOpen ? 'chevron-down' : 'chevron-up');
                lucide.createIcons();
            },
            
            log(type, msg) {
                const container = document.getElementById('console-content');
                const entry = document.createElement('div');
                entry.className = `log-entry log-${type.toLowerCase()}`;
                entry.innerHTML = `<span class="font-bold">${type}</span> <span>${msg}</span>`;
                container.prepend(entry);
            }
        };

        const EVENTS = {
            startDrag(e, id) {
                STATE.isDragging = true;
                STATE.draggedNodeId = id;
                const evt = e.touches ? e.touches[0] : e;
                STATE.lastX = evt.clientX;
                STATE.lastY = evt.clientY;
                document.body.style.cursor = 'grabbing';
                e.preventDefault();
            },
            
            handleDragMove(e) {
                if (!STATE.isDragging || !STATE.draggedNodeId) return;
                e.preventDefault();
                
                const evt = e.touches ? e.touches[0] : e;
                const deltaX = evt.clientX - STATE.lastX;
                const deltaY = evt.clientY - STATE.lastY;
                
                STATE.lastX = evt.clientX;
                STATE.lastY = evt.clientY;
                
                // Find cell being dragged
                const cell = STATE.grid.find(c => c.type === 'node' && c.data?.id === STATE.draggedNodeId);
                if (!cell) return;
                
                const canvasRect = document.getElementById('canvas-area').getBoundingClientRect();
                const pos = GRID.center(cell.cellIndex % 9, Math.floor(cell.cellIndex / 9));
                const newX = Math.max(0, Math.min(100, pos.x + (deltaX / canvasRect.width) * 100));
                const newY = Math.max(0, Math.min(100, pos.y + (deltaY / canvasRect.height) * 100));
                
                // Snap to new cell
                if (GRID.snapToGrid) {
                    const snapped = GRID.snap(newX, newY);
                    const newIndex = snapped.cellIndex;
                    
                    if (newIndex !== cell.cellIndex && !STATE.grid[newIndex].type) {
                        // Move to new cell
                        STATE.grid[newIndex] = { ...cell, cellIndex: newIndex };
                        STATE.grid[cell.cellIndex] = { cellIndex: cell.cellIndex, type: null, data: null, deps: [], callers: [] };
                        cell.cellIndex = newIndex;
                    }
                }
                
                RENDERER.grid();
                RENDERER.connections();
            },
            
            handleDragEnd() {
                if (!STATE.isDragging) return;
                STATE.isDragging = false;
                STATE.draggedNodeId = null;
                document.body.style.cursor = 'default';
                PERSISTENCE.save();
            }
        };

        const VIEW = {
            switch(mode) {
                STATE.viewMode = mode;
                
                document.querySelectorAll('.nav-tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.view === mode);
                });
                
                document.querySelectorAll('#nodes-layer, #grid-lock, #code-editor, #preview-frame').forEach(el => {
                    el.style.display = 'none';
                });
                
                switch(mode) {
                    case 'grid':
                        document.getElementById('nodes-layer').style.display = 'block';
                        document.getElementById('grid-lock').style.display = 'grid';
                        break;
                    case 'code':
                        document.getElementById('code-editor').style.display = 'block';
                        document.getElementById('grid-lock').style.display = 'grid';
                        RENDERER.code();
                        break;
                    case 'preview':
                        document.getElementById('preview-frame').style.display = 'block';
                        RENDERER.preview();
                        break;
                }
                
                RENDERER.connections();
                LOG.toast(`View: ${mode}`);
            }
        };

        const INGEST = {
            toggle() {
                const overlay = document.getElementById('sideblade-overlay');
                overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
            },
            
            loadCode() {
                const text = document.getElementById('paste-input').value;
                if (!text.trim()) return LOG.toast('No code to load');
                
                PARSER.parseCode(text);
                this.toggle();
                VIEW.switch('grid');
                PERSISTENCE.save();
            },
            
            loadNodes() {
                try {
                    const text = document.getElementById('paste-input').value;
                    const defs = JSON.parse(text);
                    PARSER.parseNodes(defs);
                    this.toggle();
                    VIEW.switch('grid');
                    PERSISTENCE.save();
                } catch(e) {
                    LOG.error('Invalid JSON');
                }
            }
        };

        const AUTOPLAY = {
            toggle() {
                if (STATE.autoplayInterval) {
                    clearInterval(STATE.autoplayInterval);
                    STATE.autoplayInterval = null;
                    document.getElementById('btn-play').innerHTML = '<i data-lucide="play" style="color: var(--text-muted); width: 1rem; height: 1rem;"></i>';
                } else {
                    const filledCells = STATE.grid.map((c, i) => c.type ? i : null).filter(i => i !== null);
                    if (!filledCells.length) return LOG.toast('Grid empty');
                    
                    let i = 0;
                    STATE.autoplayInterval = setInterval(() => {
                        NAV.xray(filledCells[i % filledCells.length]);
                        i++;
                    }, 1500);
                    
                    document.getElementById('btn-play').innerHTML = '<i data-lucide="pause" style="color: var(--func); width: 1rem; height: 1rem;"></i>';
                }
                lucide.createIcons();
            }
        };

        const THEME = {
            switch(mode) {
                document.documentElement.setAttribute('data-theme', mode);
                STATE.theme = mode;
                document.querySelectorAll('.theme-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === mode);
                });
                LOG.toast(`Theme: ${mode}`);
            }
        };

        const STORAGE_KEY = 'onyx_block04_state_v1';

        const PERSISTENCE = {
            save() {
                const data = {
                    _version: 1,
                    grid: STATE.grid,
                    viewMode: STATE.viewMode,
                    theme: STATE.theme,
                    consoleOpen: STATE.consoleOpen,
                    sidebarOpen: STATE.sidebarOpen
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                
                const status = document.getElementById('storage-status');
                status.textContent = 'Synced';
                status.style.color = '#22c55e';
                setTimeout(() => { status.textContent = 'Idle'; status.style.color = 'var(--text-muted)'; }, 1000);
            },
            
            load() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) throw new Error('No saved state');
                    
                    const data = JSON.parse(raw);
                    if (data._version !== 1) throw new Error('Version mismatch');
                    
                    STATE.grid = data.grid;
                    STATE.viewMode = data.viewMode;
                    STATE.theme = data.theme;
                    STATE.consoleOpen = data.consoleOpen;
                    STATE.sidebarOpen = data.sidebarOpen;
                    
                    THEME.switch(data.theme);
                    VIEW.switch(data.viewMode);
                    
                } catch(e) {
                    // Fresh defaults: rebuild grid from scratch to avoid undefined access
                    STATE.grid = Array.from({ length: 81 }, (_, i) => ({
                        cellIndex: i,
                        type: null,
                        data: null,
                        deps: [],
                        callers: []
                    }));

                    const centerIdx = 4 * 9 + 4;
                    STATE.grid[centerIdx].type = 'node';
                    STATE.grid[centerIdx].data = { id: 1, type: 'core', icon: 'Core', label: 'Core<Core>' };

                    THEME.switch('dark');
                    VIEW.switch('grid');
                }
            }
        };

        const LOG = {
            info(msg) { CONSOLE.log('INFO', msg); },
            success(msg) { CONSOLE.log('SUCCESS', msg); },
            warn(msg) { CONSOLE.log('WARN', msg); },
            error(msg) { CONSOLE.log('ERROR', msg); },
            toast(msg) {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<i data-lucide="check-circle" style="color: var(--func); width: 1rem; height: 1rem;"></i> ${msg}`;
                container.appendChild(toast);
                lucide.createIcons();
                setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
            }
        };

        function init() {
            lucide.createIcons();
            CONSOLE.log('SYSTEM', 'Initializing ONYX...');
            
            PERSISTENCE.load();
            SIDEBAR.renderTools();
            RENDERER.grid();
            RENDERER.connections();
            
            document.addEventListener('mousemove', EVENTS.handleDragMove);
            document.addEventListener('mouseup', EVENTS.handleDragEnd);
            document.addEventListener('touchmove', EVENTS.handleDragMove, { passive: false });
            document.addEventListener('touchend', EVENTS.handleDragEnd);
            window.addEventListener('resize', () => RENDERER.connections());
            
            CONSOLE.log('SUCCESS', 'ONYX initialized');
            CONSOLE.log('INFO', `${STATE.grid.filter(c => c.type).length} entities loaded`);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

            // Mobile Check
            if (window.innerWidth <= 768) document.getElementById('close-sb-mobile').style.display = 'block';
        },

        exportFullJson() {
            if (!Array.isArray(this.db) || !this.db.length) return;

            // Build a clean, exportable shape for each chapter
            const payload = this.db.map((ch) => ({
                id: ch.id,
                file: ch.file || null,
                title: ch.title,
                subtitle: ch.subtitle,
                text: ch.text || '',                // rendered TEXT view body (HTML)
                poml: ch.poml || null,              // parsed <poml> block
                p1: ch.p1 || null,                  // derived participant A summary
                p2: ch.p2 || null,                  // derived participant B summary
                assessments: Array.isArray(ch.assessments) ? ch.assessments : [],
                finalVerdict: ch.finalVerdict || null,
                images: Array.isArray(ch.images) ? ch.images : [],
                tags: Array.isArray(ch.tags) ? ch.tags : [],
                rawMarkdown: ch._rawMarkdown || null
            }));

            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const ts = new Date().toISOString().replace(/[:.]/g, '-');
            a.href = url;
            a.download = `onyx-full-data-${ts}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        },

        renderSidebar(data) {
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            
            // Using DocumentFragment for performance with large lists
            const fragment = document.createDocumentFragment();
            
            data.forEach((item, idx) => {
                const li = document.createElement('li');
                const originalIdx = this.db.indexOf(item);
                li.className = `file-item ${item.id === this.db[this.state.currentIdx]?.id ? 'active' : ''}`;
                li.dataset.idx = originalIdx;
                li.onclick = () => this.loadEntry(originalIdx);
                
                // Status dot color based on winner score
                const winnerScore = Math.max(item.p1?.score || 0, item.p2?.score || 0);
                const statusColor = winnerScore > 80 ? 'var(--success)' : 'var(--accent)';
                
                // Progress indicator (shows if chapter has been viewed)
                const isViewed = this.state.viewedChapters?.has(originalIdx);
                const isCurrent = originalIdx === this.state.currentIdx;
                
                li.innerHTML = `
                    <div class="f-id">${item.id}</div>
                    <div class="f-title">${item.title}</div>
                    <div class="f-meta" style="display:flex; align-items:center; gap:6px;">
                        ${isViewed ? '<i class="fas fa-check" style="font-size:8px; color:var(--success)"></i>' : ''}
                        <div style="width:6px; height:6px; border-radius:50%; background:${isCurrent ? 'var(--accent)' : statusColor}; ${isCurrent ? 'box-shadow: 0 0 8px var(--accent);' : ''}"></div>
                    </div>

                fragment.appendChild(li);
            });
            list.appendChild(fragment);
        },
        
        // Update sidebar to show current chapter and scroll it into view
        updateSidebarHighlight(idx) {

            items.forEach((el, i) => {

                el.classList.toggle('active', elIdx === idx);

        loadEntry(idx) {
            this.state.currentIdx = idx;
            const data = this.db[idx];
            
            // Close sidebar on mobile when selecting a chapter
            if (window.innerWidth <= 768) {
                this.closeSidebar();
            }
            
            // Track viewed chapters
            if (!this.state.viewedChapters) this.state.viewedChapters = new Set();
            this.state.viewedChapters.add(idx);
            
            // Update Sidebar Highlights and scroll into view
            this.updateSidebarHighlight(idx)
            
            // Header
            document.getElementById('crumb-id').innerText = data.id;
            document.getElementById('doc-id').innerText = data.id;
            document.getElementById('doc-title').innerText = data.title;
            document.getElementById('doc-sub').innerText = data.subtitle;
            document.getElementById('doc-content').innerHTML = data.text;

            // Visual Grid - load from media folder
            const grid = document.getElementById('visual-grid');
            grid.innerHTML = '<div class="grid-loading">Loading media...</div>';
            
            // Build media folder path
            const chapterNum = data.id.replace('M-', '');
            const p1Clean = (data.p1?.name || '').toUpperCase().replace(/\s+/g, '-');
            const p2Clean = (data.p2?.name || '').toUpperCase().replace(/\s+/g, '-');
            const mediaFolder = `media/ch${chapterNum}_${p1Clean}-vs-${p2Clean}`;
            
            // Try to load images from media folder
            this.loadMediaFolder(mediaFolder, data.id).then(images => {
                grid.innerHTML = '';
                
                if (images.length === 0) {
                    grid.innerHTML = `
                        <div class="grid-empty">
                            <i class="fas fa-images" style="font-size: 32px; opacity: 0.3; margin-bottom: 12px;"></i>
                            <div style="font-size: 12px; color: var(--text-muted);">No media files yet</div>
                            <div style="font-size: 10px; color: var(--text-dim); margin-top: 4px;">
                                Add images to:<br><code style="font-size: 9px;">${mediaFolder}/</code>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                images.forEach((img, i) => {
                    const div = document.createElement('div');
                    div.className = 'grid-item';
                    div.innerHTML = `
                        <img src="${img.src}" alt="${img.name}" class="grid-img" loading="lazy" 
                             onerror="this.parentElement.innerHTML='<div class=\\'grid-img-placeholder\\' style=\\'background:var(--surface)\\'><i class=\\'fas fa-image\\' style=\\'opacity:0.3\\'></i></div>'" />
                        <div class="grid-img-label">${img.name}</div>
                    `;
                    div.onclick = () => this.openLightbox(img.src, img.name);
                    grid.appendChild(div);
                });
            });

            // Data View
            const assessments = Array.isArray(data.assessments) ? data.assessments : [];
            const a1 = assessments[0] || null;
            const a2 = assessments[1] || null;
            const winnerName = data.finalVerdict && data.finalVerdict.winnerName
                ? String(data.finalVerdict.winnerName).toLowerCase()
                : null;
            const poml = data.poml || null;

            const renderStats = (p, a, idPrefix) => {
                const nameEl = document.getElementById(`${idPrefix}-name`);
                const scoreEl = document.getElementById(`${idPrefix}-score`);
                const metaEl = document.getElementById(`${idPrefix}-meta`);
                const statsEl = document.getElementById(`${idPrefix}-stats`);
                const assessEl = document.getElementById(`${idPrefix}-assessment`);

                if (!nameEl || !scoreEl || !statsEl) return;

                const isWinner = p && p.name && winnerName
                    ? p.name.toLowerCase() === winnerName
                    : false;

                nameEl.textContent = p.name;
                scoreEl.textContent = p.score;

                // Highlight panel for winner
                if (metaEl) {
                    const panelEl = metaEl.closest('.fighter-panel');
                    if (panelEl) {
                        if (isWinner) panelEl.classList.add('winner');
                        else panelEl.classList.remove('winner');
                    }
                }

                if (metaEl) {
                    let metaHtml = '';

                    // Winner badge
                    if (isWinner) {
                        metaHtml += '<div class="meta-row"><span class="winner-pill">WINNER</span></div>';
                    }

                    // High-level model label from POML
                    if (poml) {
                        let modelText = '';
                        if (idPrefix === 'p1' && poml.modelA) modelText = poml.modelA;
                        if (idPrefix === 'p2' && poml.modelB) modelText = poml.modelB;
                        if (modelText) {
                            metaHtml += `<div class="meta-row"><span class="meta-label">Model:</span> ${escapeInline(modelText)}</div>`;
                        }
                    }

                    // Compact Darkness Prior chip (full sentence lives in assessment text below)
                    if (a && a.calibration && (a.calibration.darknessPriorLevel || a.calibration.darknessPriorLabel)) {
                        const lvl = a.calibration.darknessPriorLevel || '';
                        const lbl = a.calibration.darknessPriorLabel || '';
                        const text = (lvl ? lvl + ' risk' : '').concat(lbl ? (lvl ? ' of ' : '') + lbl : '');
                        if (text) {
                            metaHtml += `<div class="meta-row"><span class="meta-chip">${escapeInline(text)}</span></div>`;
                        }
                    }

                    // Grade summary
                    if (typeof p.score === 'number' && a && a.scoreLabel) {
                        metaHtml += `<div class="meta-row"><span class="meta-label">Grade:</span> ${escapeInline(`${p.score}/100 (${a.scoreLabel})`)}</div>`;
                    }

                    metaHtml = metaHtml || '';
                    metaEl.innerHTML = metaHtml;
                }

                let assessmentHtml = '';
                if (a && a.calibrationText) {
                    assessmentHtml += simpleMarkdownToHtml(a.calibrationText);
                }
                if (a && a.forensicText) {
                    assessmentHtml += simpleMarkdownToHtml(a.forensicText);
                }
                if (a && a.overallGradeText) {
                    assessmentHtml += simpleMarkdownToHtml(a.overallGradeText);
                }

                // Highlight verdict words (Light/Twilight/Shadow/Void) as chips
                if (assessmentHtml) {
                    assessmentHtml = assessmentHtml.replace(/<strong>(Light|Twilight|Shadow|Void)<\/strong>/g, function (_, word) {
                        const v = String(word || '').toLowerCase();
                        let cls = 'verdict-fail';
                        if (v === 'light') cls = 'verdict-light';
                        else if (v === 'twilight') cls = 'verdict-twilight';
                        return '<span class="verdict-chip ' + cls + '"><strong>' + word + '</strong></span>';
                    });
                }

                statsEl.innerHTML = assessmentHtml
                    ? `<div class="assessment-body">${assessmentHtml}</div>`
                    : '';

                if (assessEl) {
                    assessEl.innerHTML = '';
                }
            };

            renderStats(data.p1, a1, 'p1');
            renderStats(data.p2, a2, 'p2');

            // Comparative criteria grid under both entities
            const compareEl = document.getElementById('criteria-compare');
            if (compareEl) {
                let html = '';

                // Final comparative verdict block (winner + explanation + table)
                const fv = data.finalVerdict;
                const rawMd = data._rawMarkdown || '';
                if (fv && (fv.winnerName || fv.tableMarkdown)) {
                    let winnerBlock = '';
                    if (fv.winnerName) {
                        // Try to extract the paragraph after **Winner:** line from raw markdown
                        let explanation = '';
                        const winRe = /\*\*Winner:\*\*\s*\*\*([^*]+)\*\*[\s\S]*?(?:\n\n([^#\n][^\n]*))/i;
                        const m = rawMd.match(winRe);
                        if (m && m[2]) explanation = m[2].trim();
                        winnerBlock = '<div style="margin-bottom:0.75rem;">'
                            + '<span class="crit-col-label">Final Verdict: </span>'
                            + '<span style="font-weight:600;">' + escapeInline(fv.winnerName) + '</span>';
                        if (explanation) {
                            winnerBlock += '<span style="display:block; margin-top:4px; font-size:11px; color:var(--text-main);">'
                                + escapeInline(explanation)
                                + '</span>';
                        }
                        winnerBlock += '</div>';
                    }

                    let tableBlock = '';
                    if (fv.tableMarkdown) {
                        tableBlock = simpleMarkdownToHtml(fv.tableMarkdown);
                    }

                    if (winnerBlock || tableBlock) {
                        html += '<div style="margin-bottom:1.25rem;">'
                            + '<h3>Final Comparative Verdict</h3>'
                            + winnerBlock
                            + (tableBlock ? '<div class="doc-body">' + tableBlock + '</div>' : '')
                            + '</div>';
                    }
                }

                // Criteria alignment grid
                const p1 = data.p1 || { criteria: [] };
                const p2 = data.p2 || { criteria: [] };
                const c1 = Array.isArray(p1.criteria) ? p1.criteria : [];
                const c2 = Array.isArray(p2.criteria) ? p2.criteria : [];
                const maxLen = Math.max(c1.length, c2.length);

                if (maxLen > 0) {
                    html += '<h3>Criterion-by-Criterion Comparison</h3>';
                    html += '<table><thead><tr>'
                        + '<th class="crit-col-label">Criterion</th>'
                        + '<th>' + escapeInline(p1.name || 'Entity A') + '</th>'
                        + '<th>' + escapeInline(p2.name || 'Entity B') + '</th>'
                        + '</tr></thead><tbody>';

                    for (let i = 0; i < maxLen; i++) {
                        const left = c1[i] || null;
                        const right = c2[i] || null;
                        const label = left && left.n ? left.n : (right && right.n ? right.n : 'Criterion ' + String(i + 1));
                        const leftVerdict = left && left.rawVerdict ? String(left.rawVerdict) : '';
                        const rightVerdict = right && right.rawVerdict ? String(right.rawVerdict) : '';

                        function verdictChip(v) {
                            if (!v) return '';
                            const lower = v.toLowerCase();
                            let cls = 'verdict-fail';
                            if (lower === 'light') cls = 'verdict-light';
                            else if (lower === 'twilight') cls = 'verdict-twilight';
                            return '<span class="verdict-chip ' + cls + '">' + escapeInline(v) + '</span>';
                        }

                        html += '<tr>';
                        html += '<td><span class="crit-col-label">' + escapeInline(label) + '</span></td>';
                        html += '<td>';
                        if (left) {
                            html += verdictChip(leftVerdict);
                        }
                        html += '</td>';
                        html += '<td>';
                        if (right) {
                            html += verdictChip(rightVerdict);
                        }
                        html += '</td>';
                        html += '</tr>';
                    }

                    html += '</tbody></table>';
                }

                compareEl.innerHTML = html;
            }

            // Close sidebar on mobile
            if(window.innerWidth <= 768) {
                this.state.sidebarOpen = false;
                document.getElementById('sidebar').classList.remove('open');
            }
            
            // Load audio for this chapter
            this.audio.loadChapter(data);
        },

        handleSearch(query) {

        // Load images from media folder
        async loadMediaFolder(folderPath, chapterId) {
            const extensions = ['jpg', 'jpeg', 'png', 'webp', 'gif', 'svg'];
            
            // Try to fetch a manifest file first (if it exists)
            try {
                const manifestRes = await fetch(`${folderPath}/manifest.json`);
                if (manifestRes.ok) {
                    const manifest = await manifestRes.json();
                    if (Array.isArray(manifest.files)) {
                        return manifest.files.map((f, i) => ({
                            id: `${chapterId}-img-${i}`,
                            src: `${folderPath}/${f.file || f}`,
                            name: f.name || f.file || f
                        }));
                    }
                }
            } catch (e) {
                // No manifest, try scanning for files
            }
            
            // Expanded list of filenames to check
            const commonNames = [
                // Standard names
                'cover', 'hero', 'main', 'banner', 'header',
                // Numbered 01-30
                ...Array.from({length: 30}, (_, i) => String(i + 1).padStart(2, '0')),
                // Also try without padding
                ...Array.from({length: 30}, (_, i) => String(i + 1)),
                // Character images
                'p1', 'p2', 'fighter1', 'fighter2', 'speaker1', 'speaker2',
                'bishop', 'foreman', 'scribe', 'golem', 'navigator', 'cartographer',
                'anatomist', 'architect', 'archivist', 'wizard', 'bard', 'mechanic',
                // Scene images
                'scene1', 'scene2', 'scene3', 'scene4', 'scene5',
                'opening', 'middle', 'closing', 'finale',
                // Diagrams
                'diagram', 'chart', 'illustration', 'figure', 'graph',
                'diagram1', 'diagram2', 'figure1', 'figure2',
                // Thumbnails
                'thumb', 'thumbnail', 'preview',
                // Generic
                'image', 'img', 'photo', 'pic', 'picture',
                'image1', 'image2', 'image3', 'image4', 'image5',
                'img1', 'img2', 'img3', 'img4', 'img5'
            ];
            
            const checkImage = async (name, ext) => {
                const src = `${folderPath}/${name}.${ext}`;
                try {
                    const res = await fetch(src, { method: 'HEAD' });
                    if (res.ok) {
                        return { id: `${chapterId}-${name}-${ext}`, src, name: `${name}.${ext}` };
                    }
                } catch (e) {}
                return null;
            };
            
            // Check for images in parallel (batch to avoid too many requests)
            const found = [];
            const batchSize = 20;
            
            for (let i = 0; i < commonNames.length; i += batchSize) {
                const batch = commonNames.slice(i, i + batchSize);
                const checks = [];
                for (const name of batch) {
                    for (const ext of extensions) {
                        checks.push(checkImage(name, ext));
                    }
                }
                const results = await Promise.all(checks);
                found.push(...results.filter(r => r !== null));
                
                // If we found some images, we can stop early
                if (found.length >= 20) break;
            }
            
            // Sort by filename for consistent ordering
            found.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
            
            return found;
        },
        
        // Open image in lightbox
        openLightbox(src, name) {
            // Remove existing lightbox
            const existing = document.getElementById('lightbox');
            if (existing) existing.remove();
            
            const lightbox = document.createElement('div');
            lightbox.id = 'lightbox';
            lightbox.style.cssText = `
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.9);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
                cursor: zoom-out;
                padding: 2rem;
            `;
            lightbox.innerHTML = `
                <img src="${src}" alt="${name}" style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px;" />
                <div style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; font-family: var(--font-ui); font-size: 12px; opacity: 0.7;">${name}</div>
                <button style="position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; opacity: 0.7;">&times;</button>
            `;
            lightbox.onclick = () => lightbox.remove();
            document.body.appendChild(lightbox);
            
            // Close on escape
            const closeOnEsc = (e) => {
                if (e.key === 'Escape') {
                    lightbox.remove();
                    document.removeEventListener('keydown', closeOnEsc);
                }
            };
            document.addEventListener('keydown', closeOnEsc);
        },

        // ============ AUDIO PLAYBACK SYSTEM ============
        audio: {
            synth: null,
            voices: [],
            lines: [],
            currentIndex: -1,
            isPlaying: false,
            isPaused: false,
            speed: 1.0,

            showAction: true,

            p2Name: '',

            // Slideshow state
            slideshow: {
                images: [],
                currentIndex: 0,
                syncEnabled: true,
                collapsed: false

            init() {
                this.synth = window.speechSynthesis;
                
                // Load voices (may be async)
                const loadVoices = () => {
                    this.voices = this.synth.getVoices();
                    console.log('Loaded', this.voices.length, 'voices');
                };
                loadVoices();
                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = loadVoices;

                // Bind controls
                document.getElementById('audio-play').onclick = () => this.play();
                document.getElementById('audio-pause').onclick = () => this.pause();
                document.getElementById('audio-stop').onclick = () => this.stop();
                document.getElementById('audio-prev').onclick = () => this.prev();

            getSpeakerClass(speaker, type) {

                        <span class="cinema-speaker speaker-presenter">PRESENTER</span>

                const pct = this.lines.length > 0 ? ((this.currentIndex + 1) / this.lines.length) * 100 : 0;

            // Slideshow methods
            async loadSlideshow(data) {
                const panel = document.getElementById('slideshow-panel');
                const chapterNum = data.id.replace('M-', '');
                const p1Clean = (data.p1?.name || '').toUpperCase().replace(/\s+/g, '-');
                const p2Clean = (data.p2?.name || '').toUpperCase().replace(/\s+/g, '-');
                const mediaFolder = `media/ch${chapterNum}_${p1Clean}-vs-${p2Clean}`;
                
                // Load images using the existing loadMediaFolder
                this.slideshow.images = await app.loadMediaFolder(mediaFolder, data.id);
                this.slideshow.currentIndex = 0;
                
                if (this.slideshow.images.length === 0) {
                    panel.classList.add('no-images');
                    return;
                }
                
                panel.classList.remove('no-images');
                panel.classList.remove('collapsed');
                document.getElementById('slideshow-toggle-text').textContent = 'Hide';
                
                // Render dots
                const dotsContainer = document.getElementById('slideshow-dots');
                dotsContainer.innerHTML = this.slideshow.images.map((_, i) => 
                    `<div class="slideshow-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`
                ).join('');
                
                // Bind dot clicks
                dotsContainer.querySelectorAll('.slideshow-dot').forEach(dot => {
                    dot.onclick = () => this.slideshowGoTo(parseInt(dot.dataset.index));
                });
                
                // Show first image
                this.slideshowGoTo(0);
            },
            
            slideshowGoTo(index) {
                if (this.slideshow.images.length === 0) return;
                
                index = Math.max(0, Math.min(index, this.slideshow.images.length - 1));
                this.slideshow.currentIndex = index;
                
                const img = document.getElementById('slideshow-img');
                const caption = document.getElementById('slideshow-caption');
                const image = this.slideshow.images[index];
                
                // Fade transition
                img.classList.add('fade');
                setTimeout(() => {
                    img.src = image.src;
                    img.alt = image.name;
                    caption.textContent = `${index + 1} / ${this.slideshow.images.length}`;
                    img.classList.remove('fade');
                }, 200);
                
                // Update dots
                document.querySelectorAll('.slideshow-dot').forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });
            },
            
            slideshowPrev() {
                const newIndex = this.slideshow.currentIndex - 1;
                if (newIndex >= 0) {
                    this.slideshowGoTo(newIndex);
                }
            },
            
            slideshowNext() {
                const newIndex = this.slideshow.currentIndex + 1;
                if (newIndex < this.slideshow.images.length) {
                    this.slideshowGoTo(newIndex);
                }
            },
            
            toggleSlideshow() {
                const panel = document.getElementById('slideshow-panel');
                this.slideshow.collapsed = !this.slideshow.collapsed;
                panel.classList.toggle('collapsed', this.slideshow.collapsed);
                document.getElementById('slideshow-toggle-text').textContent = 
                    this.slideshow.collapsed ? 'Show' : 'Hide';
            },
            
            // Sync slideshow with audio progress
            syncSlideshow() {
                if (!this.slideshow.syncEnabled || this.slideshow.images.length === 0) return;
                
                // Calculate which image to show based on progress through the transcript
                const progress = this.currentIndex / Math.max(1, this.lines.length - 1);
                const targetIndex = Math.floor(progress * this.slideshow.images.length);
                
                if (targetIndex !== this.slideshow.currentIndex) {
                    this.slideshowGoTo(targetIndex);
                }
            },
            
            assignVoices(participants) {
                // ═══════════════════════════════════════════════════════════
                // VOICE CASTING SYSTEM
                // ═══════════════════════════════════════════════════════════
                // We need 4 distinct voices for a radio play:
                //   PRESENTER - Announces chapters (authoritative, British)
                //   NARRATOR  - Reads stage directions (warm, storytelling)
                //   P1        - First speaker dialogue (gender-appropriate)
                //   P2        - Second speaker dialogue (gender-appropriate)
                // ═══════════════════════════════════════════════════════════
                
                const p1 = participants.p1 || 'Entity A';
                const p2 = participants.p2 || 'Entity B';
                
                // Infer gender from character names
                const inferGender = (name) => {
                    const upper = (name || '').toUpperCase();
                    // Female indicators
                    if (/WOMAN|GIRL|MOTHER|QUEEN|WITCH|MAIDEN|BRIDE|SISTER|DAUGHTER|WIFE|PRIESTESS|GODDESS|EMPRESS|PRINCESS/.test(upper)) {
                        return 'female';
                    }
                    // Male indicators (most characters default to male in this corpus)
                    return 'male';
                };
                
                const p1Gender = inferGender(p1);
                const p2Gender = inferGender(p2);
                
                // Get all English voices, excluding novelty/robotic ones
                const noveltyVoices = ['Albert', 'Bad News', 'Bahh', 'Bells', 'Boing', 
                    'Bubbles', 'Cellos', 'Good News', 'Jester', 'Junior', 'Organ', 
                    'Superstar', 'Trinoids', 'Whisper', 'Wobble', 'Zarvox'];
                
                const enVoices = this.voices.filter(v => 
                    v.lang.startsWith('en') && 
                    !noveltyVoices.some(n => v.name.includes(n))
                );
                
                // Helper: find first matching voice by name patterns
                const findVoice = (...patterns) => {
                    for (const pattern of patterns) {
                        const found = enVoices.find(v => v.name.includes(pattern));
                        if (found) return found;
                    }
                    return null;
                };
                
                // Helper: find voice not already used
                const findUnused = (...used) => {
                    return enVoices.find(v => !used.includes(v)) || used[0];
                };
                
                // ─────────────────────────────────────────────────────────────
                // VOICE SELECTION PRIORITY
                // ─────────────────────────────────────────────────────────────
                
                // Male voice pool
                const maleVoices = ['Fred', 'Ralph', 'Daniel', 'Rishi', 'Rocko', 
                    'Grandpa', 'Reed (English (US))', 'Eddy (English (US))', 'Reed (English (UK))'];
                // Female voice pool  
                const femaleVoices = ['Samantha', 'Karen', 'Moira', 'Tessa', 'Kathy',
                    'Flo', 'Shelley', 'Grandma'];
                
                // PRESENTER: British authority - Daniel is ideal (BBC-style)
                const presenterVoice = findVoice('Daniel', 'Reed (English (UK))', 
                    'Eddy (English (UK))', 'Fred', 'Ralph') || enVoices[0];
                
                // NARRATOR: Warm female for intimate storytelling
                const narratorVoice = findVoice('Samantha', 'Karen', 'Tessa', 'Kathy', 
                    'Flo', 'Shelley') || findUnused(presenterVoice);
                
                // P1: Gender-appropriate voice
                let p1Voice;
                if (p1Gender === 'female') {
                    p1Voice = findVoice(...femaleVoices.filter(v => 
                        !narratorVoice?.name?.includes(v)));
                } else {
                    p1Voice = findVoice(...maleVoices.filter(v => 
                        !presenterVoice?.name?.includes(v)));
                }
                p1Voice = p1Voice || findUnused(presenterVoice, narratorVoice);
                
                // P2: Gender-appropriate voice (different from P1)
                let p2Voice;
                if (p2Gender === 'female') {
                    p2Voice = findVoice(...femaleVoices.filter(v => 
                        !narratorVoice?.name?.includes(v) && !p1Voice?.name?.includes(v)));
                } else {
                    p2Voice = findVoice(...maleVoices.filter(v => 
                        !presenterVoice?.name?.includes(v) && !p1Voice?.name?.includes(v)));
                }
                p2Voice = p2Voice || findUnused(presenterVoice, narratorVoice, p1Voice);
                
                // ─────────────────────────────────────────────────────────────
                // STORE VOICE MAP
                // ─────────────────────────────────────────────────────────────
                
                this.voiceMap = {
                    'PRESENTER': presenterVoice,
                    'NARRATOR': narratorVoice,
                    [p1.toUpperCase()]: p1Voice,
                    [p2.toUpperCase()]: p2Voice
                };
                
                // Log voice cast to console
                console.log('🎭 Voice Cast:');
                console.log(`  PRESENTER: ${presenterVoice?.name || 'default'} (chapter intros)`);
                console.log(`  NARRATOR:  ${narratorVoice?.name || 'default'} (stage directions)`);
                console.log(`  ${p1.toUpperCase()} [${p1Gender}]: ${p1Voice?.name || 'default'}`);
                console.log(`  ${p2.toUpperCase()} [${p2Gender}]: ${p2Voice?.name || 'default'}`);
                console.log(`  Available: ${enVoices.length} quality voices (${this.voices.length} total)`);
            },
            
            loadChapter(chapterData) {
                this.stop();
                this.lines = [];
                this.currentIndex = -1;
                
                const id = chapterData.id || 'M-00';
                const title = chapterData.title || 'Unknown Chapter';
                const subtitle = chapterData.subtitle || '';
                const p1Name = chapterData.p1?.name || chapterData.assessments?.[0]?.name || 'Entity A';
                const p2Name = chapterData.p2?.name || chapterData.assessments?.[1]?.name || 'Entity B';
                
                // Store participant names for speaker alignment
                this.p1Name = p1Name.toUpperCase();
                this.p2Name = p2Name.toUpperCase();
                
                // Update header
                document.getElementById('audio-chapter-id').textContent = id;
                document.getElementById('audio-chapter-title').textContent = title;
                
                // Load slideshow images for this chapter
                this.loadSlideshow({ 
                    id, 
                    p1: { name: p1Name }, 
                    p2: { name: p2Name } 
                });
                
                // Assign voices
                this.assignVoices({ p1: p1Name, p2: p2Name });
                
                // Build script: Presenter intro
                this.lines.push({
                    type: 'presenter',
                    speaker: 'PRESENTER',
                    text: `Chapter ${id.replace('M-', '')}. ${title}. ${subtitle}`,
                    action: null
                });
                
                // Try to load full script from chapter folder
                const folderName = this.getFolderName(id, p1Name, p2Name);
                fetch(`chapters/${folderName}/script.json`)
                    .then(res => res.ok ? res.json() : null)
                    .then(data => {
                        if (data && data.script) {
                            // Use full script with narration, dialogue, shouts
                            data.script.forEach(el => {
                                // Skip very short narration (orphan punctuation)
                                if (el.type === 'narration' && el.text.length < 3) return;
                                this.lines.push(el);
                            });
                        } else {
                            // Fallback to dialogue.json
                            return fetch(`chapters/${folderName}/dialogue.json`).then(r => r.ok ? r.json() : null);
                        }
                    })
                    .then(data => {
                        if (data && data.dialogue && this.lines.length <= 1) {
                            data.dialogue.forEach(line => {
                                this.lines.push({
                                    type: 'dialogue',
                                    speaker: line.speaker,
                                    text: line.text,
                                    action: line.verb
                                });
                            });
                        }
                        this.renderTranscript();
                    })
                    .catch(() => {
                        this.renderTranscript();
                    });
            },
            
            getFolderName(id, p1, p2) {
                const clean = (s) => s.replace(/[^A-Z\-]/gi, '-').replace(/-+/g, '-');
                return `${id}_${clean(p1)}-vs-${clean(p2)}`;
            },
            
            renderTranscript() {
                const container = document.getElementById('audio-transcript');
                
                // Build transcript lines
                let html = this.lines.map((line, i) => {
                    const type = line.type || 'dialogue';
                    const speaker = line.speaker || '';
                    const speakerUpper = speaker.toUpperCase();
                    
                    // Determine speaker alignment (P1 left, P2 right, narration center)
                    let speakerClass = '';
                    if (type === 'dialogue' || type === 'shout') {
                        if (speakerUpper.includes(this.p1Name?.split(' ').pop())) {
                            speakerClass = 'speaker-p1';
                        } else if (speakerUpper.includes(this.p2Name?.split(' ').pop())) {
                            speakerClass = 'speaker-p2';
                        }
                    }
                    
                    const typeClass = `type-${type}`;
                    const hideText = this.showText ? '' : 'hide-text';
                    const hideAction = this.showAction ? '' : 'hide-action';
                    
                    // Build action/stage direction text
                    const actionHtml = line.action ? `<span class="audio-action">(${this.escapeHtml(line.action)})</span>` : '';
                    
                    return `<div class="audio-line ${typeClass} ${speakerClass} ${hideText} ${hideAction}" 
                                 data-index="${i}"
                                 data-line="${i + 1}"
                                 onclick="app.audio.jumpTo(${i})">
                        <span class="audio-line-num" onclick="event.stopPropagation(); app.audio.copyLineRef(${i + 1})" title="Copy line reference">${i + 1}</span>
                        <span class="audio-speaker">${this.escapeHtml(speaker)}</span>
                        <span class="audio-text">${this.escapeHtml(line.text)}</span>
                        ${actionHtml}
                    </div>`;
                }).join('');
                
                // Add subtle "Next Chapter" indicator at the end
                const currentIdx = app.state.currentIdx;
                const nextIdx = currentIdx + 1;
                if (nextIdx < app.db.length) {
                    const nextChapter = app.db[nextIdx];
                    html += `
                        <div class="next-chapter-prompt" onclick="app.audio.goToNextChapter()">
                            <div class="next-label">↓ scroll or swipe for next</div>
                            <div class="next-title">${this.escapeHtml(nextChapter.title || nextChapter.id)}</div>
                            <div class="next-subtitle">${this.escapeHtml(nextChapter.subtitle || '')}</div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="chapter-end">
                            <div class="end-label">✓ Archive Complete</div>
                        </div>
                    `;
                }
                
                container.innerHTML = html;
                
                this.updateProgress();
            },
            
            updateLineVisibility() {
                const showNarration = document.getElementById('audio-show-narration')?.checked ?? true;
                document.querySelectorAll('.audio-line').forEach(el => {
                    el.classList.toggle('hide-text', !this.showText);
                    el.classList.toggle('hide-action', !this.showAction);
                    // Hide/show narration lines entirely
                    if (el.classList.contains('type-narration')) {
                        el.style.display = showNarration ? '' : 'none';
                    }
                });
            },
            
            updateProgress() {
                const total = this.lines.length;
                const current = this.currentIndex + 1;
                const pct = total > 0 ? (current / total) * 100 : 0;
                
                document.getElementById('audio-progress-bar').style.width = pct + '%';
                document.getElementById('audio-progress-text').textContent = `${current} / ${total}`;
                
                // Update line states
                document.querySelectorAll('.audio-line').forEach((el, i) => {
                    el.classList.toggle('active', i === this.currentIndex);
                    el.classList.toggle('played', i < this.currentIndex);
                });
                
                // Scroll active line into view
                const activeLine = document.querySelector('.audio-line.active');
                if (activeLine) {
                    activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                
                // Sync slideshow with audio progress
                this.syncSlideshow();
                
                // Update cinema mode if active
                this.updateCinemaSubtitle();
            },
            
            speak(text, speaker, type, callback) {
                if (!this.synth) return callback && callback();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = this.speed;
                
                // Adjust pitch and voice based on type and speaker
                if (type === 'narration') {
                    utterance.pitch = 0.95;
                    utterance.rate = this.speed * 0.9; // Slower, more measured for narration
                    utterance.voice = this.voiceMap['NARRATOR'] || this.voiceMap['PRESENTER'] || this.voices[0];
                } else if (type === 'shout') {
                    utterance.pitch = 1.2;
                    utterance.rate = this.speed * 1.1; // Faster for shouts
                    utterance.volume = 1.0;
                    // Use speaker's voice
                    const voice = this.voiceMap[speaker] || this.voiceMap['PRESENTER'] || this.voices[0];
                    if (voice) utterance.voice = voice;
                } else if (type === 'presenter') {
                    utterance.pitch = 1.0;
                    utterance.voice = this.voiceMap['PRESENTER'] || this.voices[0];
                } else {
                    // Dialogue - use speaker's assigned voice
                    const speakerUpper = (speaker || '').toUpperCase();
                    let voice = null;
                    // Try to match speaker to voice map
                    for (const [key, v] of Object.entries(this.voiceMap)) {
                        if (speakerUpper.includes(key.split(' ').pop())) {
                            voice = v;
                            break;
                        }
                    }
                    utterance.voice = voice || this.voiceMap['PRESENTER'] || this.voices[0];
                    utterance.pitch = speakerUpper.includes(this.p1Name?.split(' ').pop()) ? 0.9 : 1.1;
                }
                
                utterance.onend = () => callback && callback();
                utterance.onerror = (e) => {
                    console.warn('Speech error:', e);
                    callback && callback();
                };
                
                this.synth.speak(utterance);
            },
            
            play() {
                if (this.lines.length === 0) return;
                
                if (this.isPaused) {
                    this.synth.resume();
                    this.isPaused = false;
                    this.isPlaying = true;
                    document.getElementById('audio-play').classList.add('active');
                    return;
                }
                
                if (this.isPlaying) return;
                
                this.isPlaying = true;
                document.getElementById('audio-play').classList.add('active');
                
                if (this.currentIndex < 0) this.currentIndex = 0;
                this.playCurrentLine();
            },
            
            playCurrentLine() {
                if (!this.isPlaying || this.currentIndex >= this.lines.length) {
                    // Auto-advance to next chapter when reaching the end
                    this.autoAdvanceToNextChapter();
                    return;
                }
                
                const line = this.lines[this.currentIndex];
                this.updateProgress();
                
                // Skip hidden narration lines
                const showNarration = document.getElementById('audio-show-narration')?.checked ?? true;
                if (line.type === 'narration' && !showNarration) {
                    this.currentIndex++;
                    this.playCurrentLine();
                    return;
                }
                
                this.speak(line.text, line.speaker, line.type, () => {
                    if (this.isPlaying && !this.isPaused) {
                        this.currentIndex++;
                        this.playCurrentLine();
                    }
                });
            },
            
            pause() {
                if (this.synth && this.isPlaying) {
                    this.synth.pause();
                    this.isPaused = true;
                    this.isPlaying = false;
                    document.getElementById('audio-play').classList.remove('active');
                }
            },
            
            stop() {
                if (this.synth) {
                    this.synth.cancel();
                }
                this.isPlaying = false;
                this.isPaused = false;
                this.currentIndex = -1;
                document.getElementById('audio-play').classList.remove('active');
                this.updateProgress();
            },
            
            prev() {
                if (this.currentIndex > 0) {
                    this.synth.cancel();
                    this.currentIndex--;
                    this.updateProgress();
                    if (this.isPlaying) {
                        this.playCurrentLine();
                    }
                }
            },
            
            next() {
                if (this.currentIndex < this.lines.length - 1) {
                    this.synth.cancel();
                    this.currentIndex++;
                    this.updateProgress();
                    if (this.isPlaying) {
                        this.playCurrentLine();
                    }
                }
            },
            
            jumpTo(index) {
                if (index >= 0 && index < this.lines.length) {
                    this.synth.cancel();
                    this.currentIndex = index;
                    this.updateProgress();
                    if (this.isPlaying) {
                        this.playCurrentLine();
                    }
                }
            },
            
            escapeHtml(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            },
            
            // Copy line reference to clipboard
            copyLineRef(lineNum) {
                const data = app.db[app.state.currentIdx];
                const chapterId = data?.id || 'unknown';
                const ref = `${chapterId}:${lineNum}`;
                
                // Copy to clipboard
                navigator.clipboard.writeText(ref).then(() => {
                    // Show brief feedback
                    this.showToast(`Copied: ${ref}`);
                }).catch(() => {
                    // Fallback
                    this.showToast(ref);
                });
            },
            
            showToast(message) {
                // Remove existing toast
                const existing = document.querySelector('.line-toast');
                if (existing) existing.remove();
                
                const toast = document.createElement('div');
                toast.className = 'line-toast';
                toast.textContent = message;
                toast.style.cssText = `
                    position: fixed;
                    bottom: 80px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: var(--accent);
                    color: #000;
                    padding: 8px 16px;
                    border-radius: 6px;
                    font-family: var(--font-ui);
                    font-size: 12px;
                    font-weight: 500;
                    z-index: 9999;
                    animation: toastFade 1.5s ease-out forwards;
                `;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 1500);
            },
            
            autoAdvanceToNextChapter() {
                // Stop current playback
                if (this.synth) {
                    this.synth.cancel();
                }
                this.isPlaying = false;
                this.isPaused = false;
                document.getElementById('audio-play').classList.remove('active');
                
                // Check if there's a next chapter
                const currentIdx = app.state.currentIdx;
                const nextIdx = currentIdx + 1;
                
                if (nextIdx < app.db.length) {
                    // Show transition indicator
                    const container = document.getElementById('audio-transcript');
                    const nextChapter = app.db[nextIdx];
                    
                    container.innerHTML += `
                        <div class="audio-line type-presenter" style="margin-top: 2rem; border: 1px solid var(--accent); animation: pulse 1s ease-in-out infinite;">
                            <span class="audio-speaker">NEXT</span>
                            <span class="audio-text">Loading: ${this.escapeHtml(nextChapter.title || nextChapter.id)}...</span>
                        </div>
                    `;
                    
                    // Scroll to the transition message
                    container.scrollTop = container.scrollHeight;
                    
                    // Load next chapter after a brief pause
                    setTimeout(() => {
                        app.loadEntry(nextIdx);
                        // Auto-play the next chapter
                        setTimeout(() => {
                            this.play();
                        }, 500);
                    }, 1500);
                } else {
                    // No more chapters - show completion message
                    const container = document.getElementById('audio-transcript');
                    container.innerHTML += `
                        <div class="audio-line type-presenter" style="margin-top: 2rem; border: 1px solid var(--success);">
                            <span class="audio-speaker">COMPLETE</span>
                            <span class="audio-text">You have reached the end of the archive.</span>
                        </div>
                    `;
                    container.scrollTop = container.scrollHeight;
                    this.currentIndex = -1;
                    this.updateProgress();
                }
            },
            
            // Manual next chapter (for scroll-triggered advance)
            goToNextChapter() {
                const currentIdx = app.state.currentIdx;
                const nextIdx = currentIdx + 1;
                
                if (nextIdx < app.db.length) {
                    app.loadEntry(nextIdx);
                }
            },
            
            goToPrevChapter() {
                const currentIdx = app.state.currentIdx;
                const prevIdx = currentIdx - 1;
                
                if (prevIdx >= 0) {
                    app.loadEntry(prevIdx);
                }
            }
        }
    };

    // Run
    document.addEventListener('DOMContentLoaded', () => {
        app.init();
        app.audio.init();
        
        const transcript = document.getElementById('audio-transcript');
        
        // ═══════════════════════════════════════════════════════════════
        // KEYBOARD NAVIGATION
        // ═══════════════════════════════════════════════════════════════
        document.addEventListener('keydown', (e) => {
            // Only handle if not typing in an input
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            switch(e.key) {
                case 'ArrowRight':
                case 'ArrowDown':
                    if (e.shiftKey) {
                        // Shift + Arrow = next chapter
                        e.preventDefault();
                        app.audio.goToNextChapter();
                    }
                    break;
                case 'ArrowLeft':
                case 'ArrowUp':
                    if (e.shiftKey) {
                        // Shift + Arrow = previous chapter
                        e.preventDefault();
                        app.audio.goToPrevChapter();
                    }
                    break;
                case 'j':
                    // j = next chapter (vim-style)
                    if (!e.ctrlKey && !e.metaKey) {
                        app.audio.goToNextChapter();
                    }
                    break;
                case 'k':
                    // k = previous chapter (vim-style)
                    if (!e.ctrlKey && !e.metaKey) {
                        app.audio.goToPrevChapter();
                    }
                    break;
                case ' ':
                    // Space = play/pause
                    e.preventDefault();
                    if (app.audio.isPlaying) {
                        app.audio.pause();
                    } else {
                        app.audio.play();
                    }
                    break;
                case 'f':
                case 'F':
                    // F = toggle cinema/fullscreen mode
                    if (!e.ctrlKey && !e.metaKey && app.state.view === 'audio') {
                        e.preventDefault();
                        if (app.audio.cinemaMode) {
                            app.audio.exitCinemaMode();
                        } else {
                            app.audio.enterCinemaMode();
                        }
                    }
                    break;
            }
        });
        
        // ═══════════════════════════════════════════════════════════════
        // SWIPE GESTURES (Mobile)
        // ═══════════════════════════════════════════════════════════════
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        
        transcript.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });
        
        transcript.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, { passive: true });
        
        function handleSwipe() {
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            const minSwipeDistance = 80;
            
            // Horizontal swipe (more horizontal than vertical)
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minSwipeDistance) {
                if (deltaX > 0) {
                    // Swipe right = previous chapter
                    app.audio.goToPrevChapter();
                    showSwipeIndicator('← Previous');
                } else {
                    // Swipe left = next chapter
                    app.audio.goToNextChapter();
                    showSwipeIndicator('Next →');
                }
            }
            
            // Vertical swipe at bottom = next chapter
            if (deltaY < -minSwipeDistance && Math.abs(deltaY) > Math.abs(deltaX)) {
                const isAtBottom = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 100;
                if (isAtBottom) {
                    app.audio.goToNextChapter();
                    showSwipeIndicator('Next Chapter ↓');
                }
            }
        }
        
        function showSwipeIndicator(text) {
            // Create temporary indicator
            const indicator = document.createElement('div');
            indicator.textContent = text;
            indicator.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: var(--accent);
                color: #000;
                padding: 12px 24px;
                border-radius: 8px;
                font-family: var(--font-ui);
                font-size: 14px;
                font-weight: 600;
                z-index: 9999;
                pointer-events: none;
                animation: fadeOut 0.8s ease-out forwards;
            `;
            document.body.appendChild(indicator);
            setTimeout(() => indicator.remove(), 800);
        }
        
        // Add fadeOut animation
        if (!document.getElementById('swipe-styles')) {
            const style = document.createElement('style');
            style.id = 'swipe-styles';
            style.textContent = `
                @keyframes fadeOut {
                    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
                }
            `;
            document.head.appendChild(style);
        }
        
        // ═══════════════════════════════════════════════════════════════
        // SCROLL-BASED CHAPTER TRANSITION
        // ═══════════════════════════════════════════════════════════════
        let isTransitioning = false;
        
        transcript.addEventListener('scroll', () => {
            if (isTransitioning) return;
            
            const isAtBottom = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 100;
            
            // Highlight next chapter prompt when near bottom
            const prompt = transcript.querySelector('.next-chapter-prompt');
            if (prompt) {
                prompt.classList.toggle('highlight', isAtBottom);
            }
        });
        
        // Wheel event for smoother chapter transitions
        transcript.addEventListener('wheel', (e) => {
            if (isTransitioning) return;
            
            const isAtBottom = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 5;
            const isAtTop = transcript.scrollTop < 5;
            
            // Scrolling down at bottom = next chapter
            if (isAtBottom && e.deltaY > 30) {
                isTransitioning = true;
                app.audio.goToNextChapter();
                setTimeout(() => { isTransitioning = false; }, 500);
            }
            
            // Scrolling up at top = previous chapter
            if (isAtTop && e.deltaY < -30) {
                isTransitioning = true;
                app.audio.goToPrevChapter();
                setTimeout(() => { isTransitioning = false; }, 500);
            }
        }, { passive: true });
    });

</script>
</body>

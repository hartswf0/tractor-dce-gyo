<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WOPR Hand Butter</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* One space: planes stacked in depth, each a 3x3 grid with a drawing over it.
   Depth is the one axis that means three things: frames (draw and flip),
   separate games (one per plane), or the three levels of a 3D board.
   Tools put X, O, clips and strokes into the space; rules read what is there. */
:root{
  color-scheme:dark;
  --bg:#000; --ink:#e8f2ef; --dim:#6b7f79; --line:#1c2a31;
  --x:#3b82f6; --o:#ff2e2e; --phos:#19e6c8; --amber:#ffd23f;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 var(--mono);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px))}

header{flex:none;height:44px;display:flex;align-items:center;gap:10px}
#status{flex:1;min-width:0;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status b{font-weight:600}
.x{color:var(--x)} .o{color:var(--o)} .w{color:var(--amber)} .d{color:var(--dim)}
.hb{height:32px;padding:0 10px;border:1px solid var(--line);font-size:10.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.hb.on{border-color:var(--amber);color:var(--amber)}

/* the space */
#stage{flex:1;min-height:0;position:relative;perspective:1300px;perspective-origin:50% 35%;touch-action:none;overflow:hidden}
#stack{position:absolute;inset:0;transform-style:preserve-3d}
.plane{position:absolute;transform-origin:50% 100%;will-change:transform,opacity}
.plane.back{pointer-events:none}
.plane .tag{position:absolute;left:0;bottom:100%;padding:2px 6px;font-size:10px;letter-spacing:.12em;color:var(--dim);background:#000;white-space:nowrap}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px}
.sq{position:relative;background:#05090c;border:1px solid var(--line);overflow:hidden}
.sq video,.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.sq .lbl{position:absolute;inset:0;display:grid;place-items:center;color:var(--amber);font-size:16px;font-weight:600}
.sq.x{border-color:var(--x);box-shadow:inset 0 0 0 1px var(--x)}
.sq.o{border-color:var(--o);box-shadow:inset 0 0 0 1px var(--o)}
/* drawn marks, no glyphs */
.mark{position:absolute;inset:22%;pointer-events:none;z-index:1}
.mark.X::before,.mark.X::after{content:"";position:absolute;left:50%;top:-12%;width:12%;height:124%;margin-left:-6%;background:var(--x)}
.mark.X::before{transform:rotate(45deg)} .mark.X::after{transform:rotate(-45deg)}
.mark.O{border:max(4px,1.6vmin) solid var(--o);border-radius:50%}
.sq.clipcell .mark{inset:auto;left:4px;top:4px;width:16px;height:16px}
.sq.clipcell .mark.O{border-width:3px}
.sq .tr{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:1}
.sq .tr i{position:absolute;top:0;bottom:0;background:var(--amber)}
.sq.target{border-color:var(--phos)!important;background:#071a18}
.sq.line{border-color:var(--amber)!important;box-shadow:inset 0 0 0 2px var(--amber)}
.plane.over .sq:not(.line){opacity:.35}
.sq.sel{outline:2px solid var(--amber);outline-offset:2px;z-index:2}
.plane.trimming .sq:not(.sel){opacity:.3}
.plane.ghost3d .sq{opacity:.25}
svg.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
svg.ink path{fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.onion path{stroke:var(--phos)!important;opacity:.35}

/* tools */
#tools{flex:none;display:flex;gap:4px;padding:6px 0 0;overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tl{flex:none;height:40px;min-width:46px;padding:0 10px;border:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:7px}
.tl.on{border-color:var(--ink);color:var(--ink)}
.tl .ic{position:relative;width:14px;height:14px;display:block}
.ic.X::before,.ic.X::after{content:"";position:absolute;left:6px;top:-1px;width:2.5px;height:16px;background:var(--x)}
.ic.X::before{transform:rotate(45deg)} .ic.X::after{transform:rotate(-45deg)}
.ic.O{border:2.5px solid var(--o);border-radius:50%}
.ic.CLIP{border:1.5px solid currentColor;background:linear-gradient(currentColor,currentColor) 50% 50%/40% 40% no-repeat}
.ic.DRAW::before{content:"";position:absolute;left:1px;top:6px;width:13px;height:2.5px;background:currentColor;transform:rotate(-40deg)}
.ic.ERASE{border:1.5px dashed currentColor}
.tl.rule{margin-left:auto;color:var(--amber);border-color:rgba(255,210,63,.45)}
.sep{flex:none;width:1px;background:var(--line);margin:4px 2px}

#act{flex:none;display:flex;gap:6px;padding:6px 0 0}
#act button{height:42px;padding:0 14px;border:1px solid var(--line);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
#act .main{flex:1;border-color:var(--amber);color:var(--amber)}
#act .main:hover{background:var(--amber);color:#000}
#act .back{color:var(--dim)}

/* the depth bar: one chip per plane, a continuous playhead, play, add, copy */
#depth{flex:none;display:flex;gap:6px;align-items:stretch;margin-top:6px;height:46px}
#depth .db{flex:none;width:46px;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim);font-size:10px;letter-spacing:.08em;position:relative}
#depth .db.on{border-color:var(--amber);color:var(--amber)}
.ic.play{width:0;height:0;border-left:12px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent}
.ic.pause{width:12px;height:14px;border-left:4px solid currentColor;border-right:4px solid currentColor}
.ic.plus::before,.ic.plus::after{content:"";position:absolute;left:0;top:6px;width:14px;height:2px;background:currentColor}
.ic.plus::after{transform:rotate(90deg)}
.ic.copy{border:1.5px solid currentColor;box-shadow:3px -3px 0 -1.5px #000,3px -3px 0 0 currentColor;width:11px;height:11px;margin:3px 0 0 -2px}
#bar{flex:1;min-width:0;position:relative;border:1px solid var(--line);touch-action:none;cursor:ew-resize;overflow:hidden}
#chips{position:absolute;inset:0;display:flex}
.chip{flex:1;min-width:0;border-right:1px solid #000;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:3px;background:#05090c;position:relative}
.chip i{background:#0c1418}
.chip i.x{background:var(--x)} .chip i.o{background:var(--o)} .chip i.c{background:#3a4a52}
.chip.ink::after{content:"";position:absolute;right:2px;bottom:2px;width:5px;height:5px;background:var(--phos)}
.chip.done{box-shadow:inset 0 0 0 1px var(--amber)}
.chip.dim{opacity:.35}
#ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;pointer-events:none;z-index:2}

/* bottom: clip tray, trim strip, or cut timeline */
#tray{flex:none;display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;touch-action:pan-x;scrollbar-width:none;overscroll-behavior-x:contain}
#tray::-webkit-scrollbar{display:none}
.clip{flex:none;width:84px;aspect-ratio:4/3;background:#05090c center/cover no-repeat;border:1px solid var(--line);position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.clip video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.clip.armed{border-color:var(--phos);box-shadow:0 0 0 1px var(--phos)}
.clip span{position:absolute;left:0;bottom:0;font-size:9px;padding:0 4px;background:rgba(0,0,0,.8);color:var(--dim)}
.strip{flex:none;position:relative;height:56px;margin:6px 0 10px;border:1px solid var(--line);background:#05090c;touch-action:none;cursor:ew-resize;overflow:hidden}
.strip .fr{position:absolute;inset:0;display:flex}
.strip .fr i{flex:1;background:#0a1014 center/cover no-repeat;border-right:1px solid #000}
.strip .shade{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.72)}
.strip .h{position:absolute;top:0;bottom:0;width:12px;margin-left:-6px;cursor:col-resize}
.strip .h::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:4px;background:var(--amber)}
.strip .ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;pointer-events:none}
.strip .seg{position:absolute;top:0;bottom:0;border-right:2px solid #000;background:#0a1014 center/cover no-repeat}
.strip .seg b{position:absolute;left:0;top:0;font-size:10px;padding:0 4px;color:#fff}
.strip .seg.x b{background:var(--x)} .strip .seg.o b{background:var(--o)}
#cut{position:absolute;inset:0;background:#000;z-index:30}
#cut video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;visibility:hidden}
#cut video.on{visibility:visible}
#cutTag{position:absolute;left:0;top:0;padding:3px 8px;font-size:11px;letter-spacing:.1em;background:#000;z-index:2}

#ghost{position:fixed;z-index:40;width:80px;aspect-ratio:4/3;border:1px solid var(--phos);background:#000 center/cover no-repeat;pointer-events:none;transform:translate(-50%,-50%)}
#hand{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
@media (min-width:900px){.clip{width:112px}.strip{height:66px}#depth{height:52px}}
</style>
</head>

<div id="app">
  <header>
    <div id="status" role="status" aria-live="polite"></div>
    <button class="hb" id="hands" title="Right hand: pinch to place, draw, trim and scrub; open hand releases; thumbs-up runs the main action. Left hand: pinch grips the depth; up and down moves through the planes, side to side tilts them.">Hands</button>
  </header>
  <div id="stage"><div id="stack"></div><div id="cut" hidden><div id="cutTag"></div></div></div>
  <div id="tools"></div>

  <div id="tray"></div>

</div>
<div id="ghost" hidden></div>
<canvas id="hand"></canvas>

const undo = [];   // { k (plane), i (cell) | stroke, before, after }  every change goes through here

function setCell(k, i, val, by){

/* ================= rules read the space ================= */
const LINES2 = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const LINES3 = (() => { const out = [], seen = new Set(), at = (x, y, z) => z * 9 + y * 3 + x;
  for (let z = 0; z < 3; z++) for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
    if (!dx && !dy && !dz) continue; const pts = [0,1,2].map(k => [x + dx * k, y + dy * k, z + dz * k]); if (pts.some(q => q.some(v => v < 0 || v > 2))) continue;
    const l = pts.map(q => at(...q)), key = [...l].sort((a, b) => a - b).join(); if (seen.has(key)) continue; seen.add(key); out.push(l); }

// a board is a flat array of 'X'|'O'|'' for the rule's cells
function boardOf(k){

  const m = []; for (let col = 0; col < 9; col++) for (let z = 0; z < 3; z++) if (!b[z * 9 + col]) { m.push(z * 9 + col); break; } return m;

function negamax(b, depth, alpha, beta, me){
  const w = winnerOf(b); if (w) return w.p === 'D' ? 0 : (w.p === me ? 1000 + depth : -1000 - depth);
  if (depth === 0) return evalFor(b, me);
  const op = me === 'X' ? 'O' : 'X'; let best = -1e9;
  for (const m of movesOf(b)) { b[m] = me; const v = -negamax(b, depth - 1, -beta, -alpha, op); b[m] = ''; if (v > best) best = v; if (v > alpha) alpha = v; if (alpha >= beta) break; }
  return best;

  return pick;
}
const cellAddr = (idx, k) => S.rule === 'cube' ? { k:Math.floor(idx / 9), i:idx % 9 } : { k, i:idx };
const gameKey = k => S.rule === 'cube' ? 'cube' : 'p' + k;
const busy = new Set(), zero = new Map();
function gameState(k = S.front){
  if (S.rule === 'free') return 'FREE';
  if (S.rule === 'cube' && S.planes.length < 3) return 'NEED3';
  if (zero.has(gameKey(k))) return 'ZERO';
  if (busy.has(gameKey(k))) return 'WOPR';
  const b = boardOf(k); if (winnerOf(b)) return 'OVER';

}
const playerTurn = k => { const b = boardOf(k), x = b.filter(v => v === 'X').length, o = b.filter(v => v === 'O').length; return x <= o; };

/* ================= operations ================= */
function placeAt(i, what){                    // what: {p} for a mark, {clip} for a clip
  const k = S.front, st = gameState(k);

    if (!(st === 'REST' || st === 'PLAY') || !playerTurn(k)) return;

    else if (S.planes[k].cells[i]) return;
    const a = cellAddr(idx, k);
    setCell(a.k, a.i, { p:'X', clip:what.clip || null, in:0, out:null, seq:S.seq++ }, 'X');

  }

  const prev = P().cells[i];
  let next;
  if (what.p) next = prev && prev.p === what.p ? (prev.clip ? { ...prev, p:null } : null) : { ...(prev || { clip:null, in:0, out:null }), p:what.p, seq:prev ? prev.seq : S.seq++ };

function woprAnswer(k){
  const b = boardOf(k); if (winnerOf(b)) return;
  const key = gameKey(k); busy.add(key); render();
  setTimeout(() => {
    busy.delete(key); if (S.rule === 'free' || !S.planes[k]) return render();

function clearGame(){
  const ks = S.rule === 'cube' ? [0,1,2] : [S.front];

}
function woprFirst(){ const k = S.front; if (gameState(k) !== 'REST') return; woprAnswerAsFirst(k); }
function woprAnswerAsFirst(k){ const b = boardOf(k), m = S.rule === 'cube' ? 4 : [0,2,4,6,8][Math.floor(Math.random() * 5)], a = cellAddr(m, k); setCell(a.k, a.i, { p:'O', clip:WOPR_POOL[Math.floor(Math.random() * WOPR_POOL.length)], in:0, out:null, seq:S.seq++ }, 'O'); render(); }

function goTo(k){ k = Math.max(0, Math.min(S.planes.length - 1, k)); if (k === S.front) return; stopCut(); sel = null; S.front = k; depth.t = k; save(); render(); }

const barEl = document.getElementById('bar');

const H = { on:false, tool:mkH(), plane:mkH(), thumb:0, lastThumb:0, t:-1 };

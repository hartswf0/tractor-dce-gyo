function originalHead(){return state.fig.parts.find(p=>p.role==='HEAD'||p.role==='BABY_HEAD')}
function currentHead(){if(state.look.prosthetic)return {file:state.look.prosthetic.filename,filename:state.look.prosthetic.filename,description:state.look.prosthetic.description,mountY:state.look.prosthetic.mountY};if(state.look.face)return {file:state.look.face.filename,filename:state.look.face.filename,description:state.look.face.description,mountY:-84};return originalHead()}
function currentPorts(){return actorPorts({head:currentHead()})}
function effectiveParts(){const out=[];for(const p of state.fig.parts){if((state.look.face||state.look.prosthetic)&&(p.role==='HEAD'||p.role==='BABY_HEAD'))continue;if(state.look.top&&(p.role==='TORSO'||p.role==='UPPER'))continue;if(state.look.bottom&&p.role==='LOWER')continue;if(state.look.hair!==undefined&&p.role==='HEADGEAR')continue;out.push({...p})}if(state.look.face)out.push(P('HEAD',state.look.face.filename,state.look.face.description,{exact:false,wardrobe:true,mountY:-84}));if(state.look.prosthetic)out.push(P(state.fig.body==='baby'?'BABY_HEAD':'HEAD',state.look.prosthetic.filename,state.look.prosthetic.description,{exact:false,wardrobe:true,mountY:state.look.prosthetic.mountY}));if(state.look.top)out.push(P('TORSO',state.look.top.filename,state.look.top.description,{exact:false,color:state.look.topColor,wardrobe:true}));if(state.look.bottom)out.push(P('LOWER',state.look.bottom.filename,state.look.bottom.description,{exact:false,color:state.look.bottomColor,wardrobe:true}));if(state.look.hair)out.push(P('HEADGEAR',state.look.hair.filename,state.look.hair.description,{exact:false,color:state.look.hairColor,wardrobe:true}));if(state.look.leftProp)out.push(P('HAND_PROP',state.look.leftProp.record.filename,state.look.leftProp.record.description,{exact:false,color:state.look.propColor,side:'left',probe:state.look.leftProp.probe}));if(state.look.rightProp)out.push(P('HAND_PROP',state.look.rightProp.record.filename,state.look.rightProp.record.description,{exact:false,color:state.look.propColor,side:'right',probe:state.look.rightProp.probe}));if(state.look.setProp)out.push(P('SET_PROP',state.look.setProp.filename,state.look.setProp.description,{exact:false,color:state.look.propColor}));return out}
function propTransform(p){const probe=p.probe,side=p.side,clock=(state.look[side+'Clock']||0)*Math.PI/180;const from=new THREE.Vector3(...probe.axis).normalize(),to=new THREE.Vector3(0,-1,0),qAlign=new THREE.Quaternion().setFromUnitVectors(from,to),qClock=new THREE.Quaternion().setFromAxisAngle(to,clock),q=qClock.multiply(qAlign);const local=new THREE.Vector3(...probe.localPoint).add(new THREE.Vector3(...probe.axis).multiplyScalar(probe.length*.5)).applyQuaternion(q),target=new THREE.Vector3(...handGrip(side)),t=target.sub(local);const m4=new THREE.Matrix4().makeRotationFromQuaternion(q),e=m4.elements,m=[e[0],e[4],e[8],e[1],e[5],e[9],e[2],e[6],e[10]];return {t:[t.x,t.y,t.z],m}}
async function assembly(){const lines=[`0 FILE production_${state.fig.id}.mpd`,`0 Name: ${state.fig.name}`,'0 !LDRAW_ORG Model','0 // Movieator production rig: only committed physical slots',''];for(const p of effectiveParts()){const c=p.color??16;switch(p.role){case'HEAD':lines.push(ref(p.color??state.look.skin,0,p.mountY??-84,0,p.file));break;case'BABY_HEAD':lines.push(ref(p.color??state.look.skin,0,p.mountY??-58,0,p.file));break;case'HEADGEAR':lines.push(ref(c,0,-84,0,p.file));break;case'UPPER':lines.push(...await expandUpper(p));break;case'TORSO':lines.push(...torsoLines(p));break;case'LOWER':lines.push(ref(c,0,-28,0,p.file));break;case'OVERLAY':lines.push(ref(c,0,-28,0,p.file));break;case'BABY':lines.push(ref(c,0,-42,0,p.file));break;case'HAND_PROP':{const x=propTransform(p);lines.push(ref(c,...x.t,p.file,x.m.join(' ')));break}case'SET_PROP':lines.push(ref(c,55,-18,24,p.file));break}lines.push('')}return lines.join('\n')}
async function renderFig(){if(!ldrawReady||!state.fig)return;$('portBadge').textContent='BUILDING';const text=await assembly();loader.parse(text,g=>{clear();state.root=new THREE.Group();state.root.rotation.x=Math.PI;state.root.add(g);scene.add(state.root);fit(state.root);updatePortBadge()},e=>{$('portBadge').textContent='LOAD ERROR';$('portBadge').className='portBadge bad';console.error(e)})}
function updatePortBadge(){const p=currentPorts(),bits=[p.crown?'CROWN':'NO CROWN',p.neckLayer?'NECK':'NO NECK','L GRIP','R GRIP'];$('portBadge').textContent=bits.join(' · ');$('portBadge').className='portBadge'}
function worldFigures(){return FIGURES.filter(f=>f.world===state.world)}
function resetLook(render=true){const f=state.fig;state.look={skin:f.skin??14,face:null,prosthetic:null,hair:undefined,neck:null,top:null,bottom:null,leftProp:null,rightProp:null,setProp:null,leftClock:0,rightClock:0,topColor:f.parts.find(p=>p.role==='TORSO'||p.role==='UPPER')?.color??4,bottomColor:f.parts.find(p=>p.role==='LOWER')?.color??1,hairColor:f.parts.find(p=>p.role==='HEADGEAR')?.color??0,propColor:14};if(render)renderFig();if(state.mode)renderTray()}
function selectFig(fig){state.fig=fig;$('figName').textContent=fig.name;$('figNote').textContent=fig.note;$('figure').value=fig.id;resetLook(false);renderFig();if(state.mode)renderTray()}
function renderSelectors(){const worlds=WORLDS.filter(w=>FIGURES.some(f=>f.world===w.id));$('world').innerHTML=worlds.map(w=>`<option value="${w.id}">${w.label}</option>`).join('');$('world').value=state.world;$('figure').innerHTML=worldFigures().map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}
function openMode(mode){state.mode=mode;state.submode=mode==='hmu'?'face':mode==='wardrobe'?'top':mode==='props'?'right':mode;$('app').classList.add('trayOpen');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));renderTray();setTimeout(()=>state.root&&fit(state.root),80)}function closeTray(){state.mode=null;state.submode=null;$('app').classList.remove('trayOpen');document.querySelectorAll('[data-mode]').forEach(b=>b.classList.remove('active'));setTimeout(()=>state.root&&fit(state.root),80)}
function renderTray(){if(!state.mode)return;$('trayTitle').textContent=state.mode==='hmu'?'HAIR / MAKEUP':state.mode.toUpperCase();const tabs=state.mode==='hmu'?[['face','FACE'],['prosthetic','PROSTHETIC'],['hair','HAIR / HAT'],['neck','BEARD / NECK'],['skin','SKIN']]:state.mode==='wardrobe'?[['top','TOP'],['bottom','BOTTOM']]:state.mode==='props'?[['left','LEFT HAND'],['right','RIGHT HAND'],['setprop','SET'],['clock','CLOCK']]:[];$('subtabs').innerHTML=tabs.map(([id,label])=>`<button data-sub="${id}" class="${state.submode===id?'active':''}">${label}</button>`).join('');document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{state.submode=b.dataset.sub;renderTray()});if(state.mode==='pieces')return renderPieces();if(state.submode==='skin')return renderSkin();if(state.submode==='clock')return renderClock();if(state.submode==='prosthetic')return renderProsthetics();if(state.submode==='neck')return renderNeck();if(state.submode==='hair')return renderHair();if(state.submode==='left'||state.submode==='right')return renderHandProps(state.submode);if(state.submode==='setprop')return renderSetProps();return renderSimpleCatalog(state.submode)}
function rigLine(status,reason){return `<div class="rigState"><span class="state ${status.toLowerCase()}">${status}</span><span>${reason}</span></div>`}
function renderSkin(){const family=headFamily(currentHead());if(family!=='standard'){$('trayBody').innerHTML=rigLine('BLOCKED','PROSTHETIC HEAD HAS AUTHORED SKIN')+'<div class="hint">Choose FACE to return to the standard head rig before changing skin tone.</div>';return}$('trayBody').innerHTML=rigLine('CLICK','STANDARD HEAD + REBUILDABLE HANDS')+`<div class="section"><div class="sectionTitle">SKIN</div><div class="skins">${SKINS.map(s=>`<button class="swatch ${state.look.skin===s.code?'active':''}" data-skin="${s.code}" title="${s.name}" style="background:${s.hex}"></button>`).join('')}</div></div>`;document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{state.look.skin=+b.dataset.skin;renderSkin();renderFig()})}
function renderSimpleCatalog(slot){if(state.fig.body==='baby'){$('trayBody').innerHTML=rigLine('BLOCKED','BABY RIG HAS DIFFERENT BODY PORTS');return}const title=slot==='top'?'TOP':'BOTTOM',rows=state.catalog[slot]||[];$('trayBody').innerHTML=rigLine('CLICK','STANDARD BODY SLOT')+`<div class="search"><input id="q" placeholder="search ${title.toLowerCase()}"></div><div id="rows"></div>`;const draw=()=>{const q=norm($('q').value);const list=(q?rows.filter(r=>norm(r.description+' '+r.filename).includes(q)):rows).slice(0,80);$('rows').innerHTML=`<button class="choice original" data-original><b>ORIGINAL</b><span>restore indexed ${title.toLowerCase()}</span></button>${list.map(r=>`<button class="choice" data-file="${r.filename}"><b>${r.filename}</b><span>${r.description}</span><span class="state click">CLICK</span></button>`).join('')}`;document.querySelector('[data-original]').onclick=()=>{state.look[slot]=null;renderFig()};document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{state.look[slot]=rows.find(r=>r.filename===b.dataset.file);renderFig()})};$('q').oninput=draw;draw()}
function renderProsthetics(){$('trayBody').innerHTML=rigLine('CLICK','APPROVED PROSTHETIC MOUNT TABLE')+'<div class="hint">Prosthetics replace the whole head geometry. They do not automatically expose crown or beard ports.</div>'+PROSTHETICS.map(r=>`<button class="choice" data-pro="${r.filename}"><b>${r.filename}</b><span>${r.description}</span><span class="state click">CLICK</span></button>`).join('');document.querySelectorAll('[data-pro]').forEach(b=>b.onclick=()=>{state.look.prosthetic=PROSTHETICS.find(r=>r.filename===b.dataset.pro);state.look.face=null;state.look.hair=null;state.look.neck=null;renderFig();renderTray()})}
function renderFaceCatalog(){const rows=state.catalog.face;$('trayBody').innerHTML=rigLine('CLICK','STANDARD 3626 HEAD FAMILY')+`<div class="hint">FACE changes a print within the standard cylindrical head family. It preserves the crown port.</div><div class="search"><input id="q" placeholder="search face / expression"></div><div id="rows"></div>`;const draw=()=>{const q=norm($('q').value),list=(q?rows.filter(r=>norm(r.description+' '+r.filename).includes(q)):rows).slice(0,100);$('rows').innerHTML=`<button class="choice original" data-original><b>ORIGINAL</b><span>restore indexed head</span></button>${list.map(r=>`<button class="choice" data-file="${r.filename}"><b>${r.filename}</b><span>${r.description}</span><span class="state click">CLICK</span></button>`).join('')}`;document.querySelector('[data-original]').onclick=()=>{state.look.face=null;state.look.prosthetic=null;renderFig();renderTray()};document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{state.look.face=rows.find(r=>r.filename===b.dataset.file);state.look.prosthetic=null;state.look.neck=null;renderFig();renderTray()})};$('q').oninput=draw;draw()}
async function renderHair(){const head=currentHead(),ports=currentPorts();if(!ports.crown){$('trayBody').innerHTML=rigLine('BLOCKED','CURRENT HEAD EXPOSES NO CROWN PORT')+'<div class="hint">Choose a standard FACE first. Sculpted prosthetics do not accept arbitrary hats.</div>';return}const rows=state.catalog.hair;$('trayBody').innerHTML=rigLine('CLICK','CROWN PORT OPEN · ANTI-STUD REQUIRED')+`<div class="search"><input id="q" placeholder="search hair / hat / helmet"></div><div id="rows"></div>`;const draw=()=>{const q=norm($('q').value),list=(q?rows.filter(r=>norm(r.description+' '+r.filename).includes(q)):rows).slice(0,36);$('rows').innerHTML=`<button class="choice none" data-none><b>NONE</b><span>leave crown open</span><span class="state click">CLICK</span></button>${list.map(r=>`<button class="choice" data-probe="${r.filename}" disabled><b>${r.filename}</b><span>${r.description}</span><span class="state inferred">PROBE</span></button>`).join('')}`;document.querySelector('[data-none]').onclick=()=>{state.look.hair=null;renderFig()};for(const r of list)headwearCompatibility({actorHead:head,candidate:r,cache:state.cache}).then(test=>{const b=document.querySelector(`[data-probe="${CSS.escape(r.filename)}"]`);if(!b)return;b.disabled=!test.ok;b.querySelector('.state').textContent=test.status;b.querySelector('.state').className='state '+test.status.toLowerCase();b.title=test.reason;if(test.ok)b.onclick=()=>{state.look.hair=r;renderFig()}})};$('q').oninput=draw};$('q').oninput=draw;draw()}
function renderNeck(){const test=currentPorts().neckLayer;if(!test){$('trayBody').innerHTML=rigLine('BLOCKED','CURRENT HEAD EXPOSES NO NECK-LAYER PORT')+'<div class="hint">A prosthetic sculpt owns the neck envelope. Arbitrary beards and respirators are hidden.</div>';return}const rows=state.catalog.neck;$('trayBody').innerHTML=rigLine('INFERRED','NECK FAMILY FOUND · CLEARANCE TEST NOT YET PROVEN')+'<div class="hint">These are candidates, not committed geometry. Movieator will not mount an inferred beard until collision clearance is implemented.</div>'+rows.slice(0,60).map(r=>`<button class="choice" disabled><b>${r.filename}</b><span>${r.description}</span><span class="state inferred">INFERRED</span></button>`).join('')}
function renderHandProps(side){if(state.fig.body==='baby'){$('trayBody').innerHTML=rigLine('BLOCKED','BABY RIG HAS NO STANDARD HAND GRIP');return}const rows=state.catalog.prop;$('trayBody').innerHTML=rigLine('CLICK',`${side.toUpperCase()} HAND GRIP OPEN · ~8 LDU SHAFT REQUIRED`)+`<div class="search"><input id="q" placeholder="search hand props"></div><div id="rows"></div>`;const draw=()=>{const q=norm($('q').value),list=(q?rows.filter(r=>norm(r.description+' '+r.filename).includes(q)):rows).slice(0,28);$('rows').innerHTML=`<button class="choice none" data-none><b>NONE</b><span>empty ${side} hand</span><span class="state click">CLICK</span></button>${list.map(r=>`<button class="choice" data-probe="${r.filename}" disabled><b>${r.filename}</b><span>${r.description}</span><span class="state inferred">PROBE</span></button>`).join('')}`;document.querySelector('[data-none]').onclick=()=>{state.look[side+'Prop']=null;renderFig()};for(const r of list)probeGrip(r,{cache:state.cache}).then(test=>{const b=document.querySelector(`[data-probe="${CSS.escape(r.filename)}"]`);if(!b)return;b.disabled=!test.ok;b.querySelector('.state').textContent=test.status;b.querySelector('.state').className='state '+test.status.toLowerCase();b.title=test.reason;if(test.ok)b.onclick=()=>{state.look[side+'Prop']={record:r,probe:test};renderFig();renderTray()}})};$('q').oninput=draw};$('q').oninput=draw;draw()}
function renderSetProps(){const rows=state.catalog.setprop;$('trayBody').innerHTML=rigLine('INFERRED','SET PROP DOES NOT OCCUPY A HAND PORT')+`<div class="search"><input id="q" placeholder="search set props"></div><div id="rows"></div>`;const draw=()=>{const q=norm($('q').value),list=(q?rows.filter(r=>norm(r.description+' '+r.filename).includes(q)):[]).slice(0,60);$('rows').innerHTML=`<button class="choice none" data-none><b>NONE</b><span>remove set prop</span></button>${list.map(r=>`<button class="choice" data-file="${r.filename}"><b>${r.filename}</b><span>${r.description}</span><span class="state inferred">SET</span></button>`).join('')}`;document.querySelector('[data-none]').onclick=()=>{state.look.setProp=null;renderFig()};document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{state.look.setProp=rows.find(r=>r.filename===b.dataset.file);renderFig()})};$('q').oninput=draw;draw()}
function renderClock(){$('trayBody').innerHTML=`<div class="hint">Clocking rotates a mechanically fitted prop around its own grip shaft without breaking the hand connection.</div>${['left','right'].map(side=>`<div class="section"><div class="sectionTitle">${side.toUpperCase()} HAND · ${state.look[side+'Prop']?state.look[side+'Prop'].record.description:'EMPTY'}</div><div class="clocks">${CLOCKS.map(c=>`<button class="clock ${state.look[side+'Clock']===c?'active':''}" data-clock="${side}|${c}" ${state.look[side+'Prop']?'':'disabled'}>${c}°</button>`).join('')}</div></div>`).join('')}`;document.querySelectorAll('[data-clock]').forEach(b=>b.onclick=()=>{const [side,c]=b.dataset.clock.split('|');state.look[side+'Clock']=+c;renderFig();renderClock()})}
function renderPieces(){const parts=effectiveParts();const ports=currentPorts();$('trayBody').innerHTML=`<div class="slotSummary"><div class="slotCard"><b>HEAD FAMILY</b><span>${headFamily(currentHead()).toUpperCase()}</span><small>${currentHead()?.file||currentHead()?.filename}</small></div><div class="slotCard"><b>OPEN PORTS</b><span>${[ports.crown?'CROWN':null,ports.neckLayer?'NECK':null,'L GRIP','R GRIP'].filter(Boolean).join(' · ')}</span></div></div><div class="hint">Committed assembly only. Search candidates do not appear here until they pass their slot test.</div>${parts.map((p,i)=>`<button class="piece" data-piece="${i}"><b>${String(i+1).padStart(2,'0')} · ${p.file}</b><span>${p.description}</span><small>${p.role}</small></button>`).join('')}<pre id="partHeader" class="headerText">Tap a piece for its .dat header.</pre>`;document.querySelectorAll('[data-piece]').forEach(b=>b.onclick=async()=>{const p=parts[+b.dataset.piece];try{const r=await fetch('./ldraw/parts/'+p.file,{cache:'no-store'});$('partHeader').textContent=(await r.text()).split(/\r?\n/).slice(0,30).join('\n')}catch{$('partHeader').textContent=p.file+'\nheader unavailable'}})}

function renderCurrentSub(){if(state.submode==='face')return renderFaceCatalog();return renderTray()}
const oldRenderTray=renderTray;renderTray=function(){if(state.mode==='hmu'&&state.submode==='face'){ $('trayTitle').textContent='HAIR / MAKEUP';$('subtabs').innerHTML=[['face','FACE'],['prosthetic','PROSTHETIC'],['hair','HAIR / HAT'],['neck','BEARD / NECK'],['skin','SKIN']].map(([id,label])=>`<button data-sub="${id}" class="${state.submode===id?'active':''}">${label}</button>`).join('');document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{state.submode=b.dataset.sub;oldRenderTray()});return renderFaceCatalog()}return oldRenderTray()}

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>state.mode===b.dataset.mode?closeTray():openMode(b.dataset.mode));$('closeTray').onclick=closeTray;$('world').onchange=e=>{state.world=e.target.value;renderSelectors();selectFig(worldFigures()[0])};$('figure').onchange=e=>selectFig(FIGURES.find(f=>f.id===e.target.value));
try{await loader.preloadMaterials('./ldraw/LDConfig.ldr');ldrawReady=true;$('ldrawReady').textContent='LDRAW READY';$('ldrawReady').classList.add('ok')}catch(e){$('ldrawReady').textContent='LDRAW ERROR';$('ldrawReady').classList.add('bad');console.error(e)}
try{const r=await fetch(DESCRIPTORS);if(r.ok){const data=await r.json(),records=[];collect(data,records,new WeakSet());state.records=records;classify(records)}}catch(e){console.warn(e)}
async function selfTest(){const checks=[];checks.push(headFamily({file:'15527p02.dat',description:'Homer Simpson'})==='prosthetic');checks.push(headFamily({file:'3626b.dat',description:'Minifig Head'})==='standard');checks.push((await probeCrownSocket({filename:'21787.dat'},{cache:state.cache})).ok);checks.push(!(await headwearCompatibility({actorHead:{file:'15527p02.dat',description:'Homer Simpson'},candidate:{filename:'21787.dat',description:'Minifig Hair Short Quiff'},cache:state.cache})).ok);checks.push((await probeGrip({filename:'39802.dat',description:'Minifig Axe with Pick End and Long Handle'},{cache:state.cache})).ok);const pass=checks.filter(Boolean).length;$('rigReady').textContent=`RIG ${pass}/${checks.length}`;$('rigReady').className='chip '+(pass===checks.length?'ok':'bad')}
renderSelectors();selectFig(worldFigures()[0]);await selfTest();

<style>
:root{--i:#090909;--p:#faf9f4;--w:#f0eee7;--m:#6d6d6d;--y:#ffdf2b;--g:#18be74;--b:#168dff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--p);color:var(--i);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input,select,a.ctrl{font:inherit;color:inherit;background:var(--p);border:1.5px solid #111;border-radius:0;min-height:36px;padding:5px 8px;font-weight:800;text-decoration:none}#app{height:100dvh;display:grid;grid-template-rows:42px 46px minmax(0,1fr) 48%}header,#filters{display:flex;align-items:center;gap:5px;padding:4px 6px;border-bottom:2px solid #111;overflow-x:auto;white-space:nowrap}header strong{font-size:10px;margin-right:auto}.chip{border:1px solid #111;padding:4px 6px;font-size:8px;flex:none}.ok{background:var(--g)}#filters input{min-width:185px;flex:1;font-size:9px}#filters select,#filters button{font-size:8px;min-height:34px}#screenBtn.active{background:var(--y)}#view{position:relative;min-height:0;background:var(--w);border-bottom:2px solid #111}#host{position:absolute;inset:0}canvas{display:block;width:100%!important;height:100%!important;touch-action:none}#identity{position:absolute;left:7px;top:7px;background:#fff;border:2px solid #111;padding:6px 8px;max-width:68%;z-index:3;pointer-events:none}#identity small{display:block;font-size:7px;letter-spacing:.12em}#identity strong{display:block;font-size:13px;line-height:1.08;margin:2px 0}#identity span{display:block;color:var(--m);font-size:8px}#badge{position:absolute;right:7px;top:7px;background:#fff;border:1px solid #111;padding:5px 7px;font-size:8px;z-index:3}#dock{min-height:0;display:grid;grid-template-rows:46px minmax(0,1fr)}#controls{display:flex;gap:4px;padding:4px 5px;border-bottom:2px solid #111;overflow-x:auto}#controls button,#controls a{font-size:8px;white-space:nowrap}#next{background:var(--y)}#lower{display:grid;grid-template-columns:1.1fr .9fr;min-height:0}.pane{min-height:0;overflow:auto;border-right:1px solid #111}.pane:last-child{border-right:0}.title{position:sticky;top:0;z-index:2;background:var(--p);border-bottom:1px solid #111;padding:6px 7px;font-size:8px;font-weight:950}.record{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #bbb;background:var(--p);padding:7px;min-height:0}.record.active{background:var(--y)}.record b{display:block;font-size:9px}.record span{display:block;font-size:8px;line-height:1.15}.record small{display:block;font-size:7px;color:var(--m);margin-top:2px}.screen{color:#007543!important}#meta{padding:8px;font-size:8px;line-height:1.35;word-break:break-word}#meta b{font-size:9px}#meta .row{padding:5px 0;border-bottom:1px solid #ccc}.key{display:block;color:var(--m);font-size:7px;letter-spacing:.08em}.empty{padding:12px;color:var(--m);font-size:9px}
@media(max-width:720px){#app{grid-template-rows:39px 43px minmax(0,1fr) 52%}header strong{font-size:8px}header .wide{display:none}#filters{padding:3px 5px}#filters input{min-width:142px;font-size:8px}#filters select,#filters button{font-size:7px;padding:4px 6px}#identity strong{font-size:11px}#identity{max-width:70%}#dock{grid-template-rows:44px minmax(0,1fr)}#controls button,#controls a{font-size:7px;padding:5px 7px}#lower{grid-template-columns:1fr 1fr}}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head><body><div id="app">
<header><strong>HEADWEAR / LDRAW CENSUS</strong><span id="ready" class="chip">LOADING</span><span id="count" class="chip">-- / --</span><span id="screenCount" class="chip wide">-- SCREEN-TAGGED</span></header>
<div id="filters"><input id="search" autocomplete="off" placeholder="hair, hat, character, filename"><select id="family"><option value="all">ALL HEADWEAR</option></select><button id="screenBtn">SCREEN ONLY</button></div>
<section id="view"><div id="host"></div><div id="identity"><small id="familyLabel">HEADWEAR</small><strong id="name">reading census…</strong><span id="file"></span></div><div id="badge">REAL LDRAW</div></section>
<section id="dock"><div id="controls"><button id="prev">PREV</button><button id="next">NEXT</button><button id="spin">SPIN</button><button id="head">ON HEAD</button><button id="open">OPEN .DAT</button><a class="ctrl" href="./screen-piece-index.html">MOVIEATOR</a></div><div id="lower"><div class="pane"><div class="title">MATCHING HEADWEAR</div><div id="list"></div></div><div class="pane"><div class="title">EXACT RECORD</div><div id="meta"></div></div></div></section>
</div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{LDrawLoader}from'three/addons/loaders/LDrawLoader.js';import{LDrawConditionalLineMaterial}from'three/addons/materials/LDrawConditionalLineMaterial.js';
const $=x=>document.getElementById(x),Q=new URLSearchParams(location.search),S={all:[],filtered:[],rec:null,screen:false,onHead:false,spin:false,root:null,error:null};
const FAMILIES=['hair','hat','helmet','cap','hood','mask','crown-tiara','headband-bandana','other-headwear'];
const host=$('host'),renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance',preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setClearColor(0xf0eee7);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,1,.1,10000),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.5));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(160,220,160);scene.add(key);const grid=new THREE.GridHelper(220,11,0x8c8c8c,0xd4d1c8);scene.add(grid);const loader=new LDrawLoader();loader.setConditionalLineMaterial(LDrawConditionalLineMaterial);loader.setPartsLibraryPath('./ldraw/');
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}function tick(){requestAnimationFrame(tick);resize();controls.update();if(S.spin&&S.root)S.root.rotation.y+=.009;renderer.render(scene,camera)}requestAnimationFrame(tick);function clear(){if(S.root){scene.remove(S.root);S.root=null}}function line(c,x,y,z,f){return`1 ${c} ${x} ${y} ${z} 1 0 0 0 1 0 0 0 1 parts/${f}`}
function mpd(r){const a=['0 FILE headwear-preview.mpd','0 !LDRAW_ORG Model','0 BFC CERTIFY CCW',''];if(S.onHead)a.push(line(78,0,0,0,'3626b.dat'));a.push(line(16,0,0,0,r.file));return a.join('\n')}
function fit(root){const b=new THREE.Box3().setFromObject(root);if(b.isEmpty())return null;const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z,35);controls.target.copy(c);camera.position.set(c.x+d*1.15,c.y+d*.7,c.z+d*1.65);camera.near=.1;camera.far=d*60;camera.updateProjectionMatrix();grid.position.y=b.max.y+10;return{x:+s.x.toFixed(1),y:+s.y.toFixed(1),z:+s.z.toFixed(1)}}
function render(){if(!S.rec)return;window.__HEADWEAR_READY=false;S.error=null;$('badge').textContent='LOADING';loader.parse(mpd(S.rec),g=>{clear();S.root=new THREE.Group();S.root.rotation.x=Math.PI;S.root.add(g);scene.add(S.root);const size=fit(S.root);$('badge').textContent=S.onHead?'STANDARD HEAD TEST':'REAL LDRAW PART';window.__HEADWEAR_SNIFF={pass:!!size&&!S.error,file:S.rec.file,size,error:S.error};window.__HEADWEAR_READY=true},e=>{S.error=String(e?.message||e);$('badge').textContent='LDRAW ERROR';window.__HEADWEAR_SNIFF={pass:false,file:S.rec.file,size:null,error:S.error};window.__HEADWEAR_READY=true})}
function blob(r){return`${r.file} ${r.description} ${(r.category||'')} ${(r.keywords||[]).join(' ')} ${(r.screenHints||[]).join(' ')}`.toLowerCase()}
function applyFilters(keep=true){const q=$('search').value.trim().toLowerCase(),fam=$('family').value;S.filtered=S.all.filter(r=>(fam==='all'||r.family===fam)&&(!S.screen||(r.screenHints||[]).length)&&(!q||blob(r).includes(q)));$('count').textContent=`${S.filtered.length} / ${S.all.length}`;$('screenBtn').classList.toggle('active',S.screen);if(!keep||!S.rec||!S.filtered.some(r=>r.file===S.rec.file))S.rec=S.filtered[0]||null;ui();if(S.rec){detail();render()}else{$('name').textContent='NO MATCH';$('file').textContent='';$('list').innerHTML='<div class="empty">No headwear matches these filters.</div>';$('meta').innerHTML=''}}
function ui(){if(!S.filtered.length)return $('list').innerHTML='<div class="empty">No matches.</div>';const max=600,shown=S.filtered.slice(0,max);$('list').innerHTML=shown.map(r=>`<button class="record ${S.rec?.file===r.file?'active':''}" data-file="${r.file}"><b>${r.file}</b><span>${r.description}</span><small>${r.family}${r.screenHints?.length?` · <i class="screen">${r.screenHints.join(' / ')}</i>`:''}</small></button>`).join('')+(S.filtered.length>max?`<div class="empty">${S.filtered.length-max} more. Narrow with search or family.</div>`:'');document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>select(S.filtered.find(r=>r.file===b.dataset.file))}
function detail(){const r=S.rec;$('familyLabel').textContent=r.family.toUpperCase();$('name').textContent=r.description;$('file').textContent=r.file;$('meta').innerHTML=`<div class="row"><span class="key">FILE</span><b>${r.file}</b></div><div class="row"><span class="key">FAMILY</span>${r.family}</div><div class="row"><span class="key">CATEGORY</span>${r.category||'—'}</div><div class="row"><span class="key">SCREEN HINTS</span>${r.screenHints?.length?r.screenHints.join(' · '):'—'}</div><div class="row"><span class="key">KEYWORDS</span>${(r.keywords||[]).join(' · ')||'—'}</div><div class="row"><span class="key">LDRAW</span>${r.org||'—'}</div>`}
function select(r){S.rec=r;ui();detail();render();history.replaceState(null,'',`?part=${encodeURIComponent(r.file)}${S.screen?'&screen=1':''}${$('family').value!=='all'?`&family=${$('family').value}`:''}`)}function shift(n){if(!S.filtered.length)return;let i=S.filtered.findIndex(r=>r.file===S.rec?.file);if(i<0)i=0;select(S.filtered[(i+n+S.filtered.length)%S.filtered.length])}
$('search').oninput=()=>applyFilters(false);$('family').onchange=()=>applyFilters(false);$('screenBtn').onclick=()=>{S.screen=!S.screen;applyFilters(false)};$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('spin').onclick=()=>{S.spin=!S.spin;$('spin').textContent=S.spin?'STOP':'SPIN'};$('head').onclick=()=>{S.onHead=!S.onHead;$('head').textContent=S.onHead?'PART ONLY':'ON HEAD';render()};$('open').onclick=()=>S.rec&&open('./ldraw/parts/'+S.rec.file,'_blank');
try{await loader.preloadMaterials('./ldraw/LDConfig.ldr');$('ready').textContent='LDRAW READY';$('ready').className='chip ok';const res=await fetch('./headwear-index.json',{cache:'no-store'});if(!res.ok)throw new Error('headwear-index '+res.status);const data=await res.json();S.all=data.records||[];$('screenCount').textContent=`${data.counts?.screenTagged??0} SCREEN-TAGGED`;$('family').innerHTML='<option value="all">ALL HEADWEAR</option>'+FAMILIES.filter(f=>S.all.some(r=>r.family===f)).map(f=>`<option value="${f}">${f.toUpperCase()}</option>`).join('');if(Q.get('family')&&FAMILIES.includes(Q.get('family')))$('family').value=Q.get('family');S.screen=Q.get('screen')==='1';const wanted=Q.get('part');S.rec=S.all.find(r=>r.file===wanted)||null;applyFilters(true);window.__HEADWEAR_DATA=data}catch(e){$('ready').textContent='LOAD ERROR';$('badge').textContent='INDEX ERROR';$('name').textContent=e.message;window.__HEADWEAR_READY=true;window.__HEADWEAR_SNIFF={pass:false,error:String(e)}}
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odyssey LDraw forage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f2f1ec'/%3E%3Crect x='6' y='12' width='20' height='12' fill='%23141414'/%3E%3Crect x='9' y='8' width='5' height='4' fill='%23141414'/%3E%3Crect x='18' y='8' width='5' height='4' fill='%23141414'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f2f1ec; --card:#f7f6f2; --ink:#141414; --dim:#77766f; --faint:#d8d6cf; --red:#e01b1b; --blue:#0033cc;
    --green:#2f7f5a; --yellow:#c99a00; --mono:ui-monospace,'SF Mono','IBM Plex Mono',Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#151514; --card:#1d1d1b; --ink:#ecebe6; --dim:#9a9990; --faint:#3a3935; --blue:#7f9dff; --green:#5fbf8f; --yellow:#e0b93a; } }
  :root[data-theme="dark"]{ --paper:#151514; --card:#1d1d1b; --ink:#ecebe6; --dim:#9a9990; --faint:#3a3935; --blue:#7f9dff; --green:#5fbf8f; --yellow:#e0b93a; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--mono)}
  a{color:var(--blue)}

  #brand{font-size:11px;font-weight:700;letter-spacing:.36em;text-transform:uppercase;margin-right:6px}
  #brand em{font-style:normal;color:var(--dim);font-weight:400}
  .chip{border:1px solid var(--faint);background:var(--card);cursor:pointer;font:inherit;font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:7px 10px;color:var(--dim);white-space:nowrap;min-height:32px}
  .chip:hover,.chip.on{border-color:var(--ink);color:var(--ink)}
  .chip.on{box-shadow:inset 0 -2px 0 var(--red)}
  #q{border:1px solid var(--faint);background:var(--card);color:var(--ink);padding:7px 10px;font:inherit;font-size:11px;width:160px;min-height:32px}
  #totals{width:100%;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
  #totals b{color:var(--ink);font-size:15px;letter-spacing:0;margin-right:5px}
  #table{padding:16px}
  .section{margin-bottom:26px}
  .secHead{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:5px;margin-bottom:10px}
  .secHead .rn{font-size:17px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
  .secHead .sc{margin-left:auto;font-size:9px;color:var(--dim);letter-spacing:.14em}
  .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
  .cell{position:relative;border:1.5px solid var(--faint);background:var(--card);cursor:pointer;padding:6px 7px 5px 9px;min-height:118px;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit}

  .cell .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
  .GREEN .bar{background:var(--green)} .YELLOW .bar{background:var(--yellow)} .RED .bar{background:var(--red)}
  .cell .num{font-size:8px;color:var(--dim);display:flex;justify-content:space-between;letter-spacing:.06em}
  .cell .num b{color:var(--blue)}
  .cell img{width:100%;height:58px;object-fit:contain;margin:3px 0}
  .cell .sym{font-size:24px;font-weight:900;line-height:58px;height:58px;margin:3px 0;text-align:center}
  .cell .nm{font-size:8px;letter-spacing:.08em;text-transform:uppercase;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

  #sheet.on{transform:none}
  #sheetHead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--faint)}
  #sheetHead h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;flex:1}
  #close{min-width:44px}
  #stage{position:relative;height:min(46vh,380px);background:#efece4;border-bottom:1px solid var(--faint)}

  #veil{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#77766f;letter-spacing:.14em;text-transform:uppercase;pointer-events:none}
  #body{overflow:auto;padding:14px;flex:1}
  .big{display:flex;flex-wrap:wrap;gap:14px 26px;margin-bottom:12px}
  .big div{display:flex;flex-direction:column}
  .big b{font-size:30px;font-weight:900;letter-spacing:-.01em;line-height:1}
  .big span{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:4px}
  .dims{font-size:20px;font-weight:900;margin:4px 0 2px}
  .dims small{font-size:11px;font-weight:400;color:var(--dim)}
  .sub{font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.6}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}

  .why{font-size:11px;line-height:1.6;color:var(--ink)}
  .why li{margin-left:16px}

  .tree ul{list-style:none;margin-left:14px;border-left:1px solid var(--faint);padding-left:10px}

  .tree .n{color:var(--dim)}
  .tree .src{display:block;font-size:9px;color:var(--dim)}
  .credits{font-size:10px;line-height:1.6;color:var(--dim)}

  #pvbar .row{display:flex;gap:8px;align-items:center}
  #pvbar input{flex:1;min-width:80px}
  #pvbar .chip{background:rgba(255,255,255,.92);color:#141414;border-color:#fff}
  body.film #pvbar .row{display:none}
  body.film #pvbar{padding:14px 5% 18px;font-size:15px;background:linear-gradient(transparent,rgba(10,10,10,.8))}

  body.film #pvbar #cap b{display:block;font-size:11px;margin:0 0 4px}
  body.render #top,body.render #table{display:none}

  body.render #sheetHead,body.render #body{display:none}
  body.render #stage{height:100vh;background:#f2f1ec;border:0}
  @media (max-width:560px){ #q{width:100%} .cells{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))} #stage{height:38vh} .big b{font-size:24px} }

    for (let da = -Math.PI; da < Math.PI; da += Math.PI / 8) for (const el of [0.12, 0.3, 0.55]) {
      const d = V3(Math.sin(base + 0.35 + da), el, Math.cos(base + 0.35 + da)).normalize(), side = V3(d.z, 0, -d.x).normalize(); ray.far = 330;
      const clear = [-22, 0, 22].every(o => { ray.set(S.clone().addScaledVector(side, o), d); return !ray.intersectObjects(meshes, false).length; });   /* three rays, a head's width apart: a neighbour's shoulder blocks too */
      const h = V3(d.x, 0, d.z).normalize(), score = (clear ? 10 : 0) + h.dot(fw) * 2 + Math.cos(da - 0.35) * 0.3 - el;   // clear first, then the face, then a little off-axis, then low
      if (score > bestScore) { bestScore = score; best = h; best.el = el; }
    }
    PV.dirs[key] = best || V3(-0.35, 0, 1).normalize(); return PV.dirs[key];
  }
  function setTime(t) {
    if (!PV) return; PV.t = Math.max(0, Math.min(PV.data.duration, t)); t = PV.t;
    const shot = PV.data.shots.find(s => t >= s.t0 && t < s.t1) || PV.data.shots[PV.data.shots.length - 1];
    PV.figs.forEach((f, i) => { if (!f) return; const st = figState(i, t), c = f.cast;
      f.g.position.set(f.base.x + (st.x - c.x) * 20, f.base.y, f.base.z + (st.z - c.z) * 20);   // LDraw units, the figure's parent frame (a pure translation of the set's)
      let yaw = st.dir ? Math.atan2(-st.dir[0], -st.dir[1]) : f.yaw;
      if (shot && (shot.speaker === i || shot.action === i) && shot.camera.object >= 0 && PV.figs[shot.camera.object] && !st.walking) { const o = figState(shot.camera.object, t); yaw = Math.atan2(-(o.x - st.x), -(o.z - st.z)); }
      if (yaw != null) { f.yaw = yaw; f.g.quaternion.setFromAxisAngle(V3(0, 1, 0), yaw); } else f.g.quaternion.copy(f.baseQ);
      const ph = t * 9, swing = st.walking ? Math.sin(ph) * 0.6 : 0; f.legs.forEach(([o, r0], k) => { o.rotation.x = r0 + (k % 2 ? swing : -swing); });
      const talk = shot && shot.speaker === i ? Math.max(0, Math.sin(t * 5)) * 0.7 : 0, hit = shot && shot.action === i ? Math.max(0, Math.sin(t * 3)) * 1.4 : 0;
      f.arms.forEach(([o, r0], k) => { o.rotation.x = r0 - (k === 0 ? talk + hit : st.walking ? -swing * 0.6 : 0) - (k === 1 && st.walking ? swing * 0.6 : 0); });
    });
    PV.model.updateMatrixWorld(true);
    /* the camera: each shot a move over its length */
    const k = shot ? ease((t - shot.t0) / (shot.t1 - shot.t0)) : 0, C = PV.centre, R = PV.radius;
    const subj = shot && PV.figs[shot.camera.subject], obj = shot && PV.figs[shot.camera.object];
    const S = subj ? headOf(subj) : C.clone(), O = obj ? headOf(obj) : null; let pos, look;
    const front = shot ? clearDir(shot, S, [subj, obj]) : V3(-0.35, 0, 1).normalize(), G = subj && subj.h ? Math.max(1, Math.sqrt(subj.h / 80)) : 1;   // a giant is framed from further off   // the side of the subject the camera can see from
    switch (shot ? shot.camera.kind : 'establish') {
      case 'establish': pos = C.clone().addScaledVector(front, R * (2.6 - 1.0 * k)).add(V3(0, R * (1.6 - 0.9 * k), 0)); look = C.clone().lerp(S, 0.3 * k); break;
      case 'pullback': pos = S.clone().addScaledVector(front, 160 + R * 2.2 * k).add(V3(0, 40 + R * 1.2 * k, 0)); look = S.clone().lerp(C, k); break;
      case 'two': { const mid = O ? S.clone().lerp(O, 0.5) : S; const d = O ? S.distanceTo(O) : 0; pos = mid.clone().addScaledVector(front, 220 + d * 1.1).add(V3(0, (front.el || 0.15) * (220 + d) + 10 * k, 0)); look = mid; break; }
      case 'ots': { if (!O) { pos = S.clone().addScaledVector(front, 170); look = S; break; } const back = O.clone().sub(S).setY(0).normalize(); const side = V3(back.z, 0, -back.x); pos = O.clone().addScaledVector(back, 70).addScaledVector(side, 30).add(V3(0, 12, 0)); look = S; break; }
      case 'push': pos = S.clone().addScaledVector(front, G * (330 - 150 * k)).add(V3(0, (front.el || 0.15) * G * (330 - 150 * k) - 20, 0)); look = S.clone().add(V3(0, -10, 0)); break;
      case 'track': pos = S.clone().addScaledVector(front, G * 300).add(V3(0, (front.el || 0.2) * G * 300, 0)); look = S; break;
      case 'orbit': { const a = -0.8 + 1.4 * k; pos = S.clone().add(V3(Math.sin(a) * 240, 90, Math.cos(a) * 240)); look = S; break; }
      default: pos = S.clone().addScaledVector(front, G * (280 - 30 * k)).add(V3(0, (front.el || 0.15) * G * 280, 0)); look = S.clone().add(V3(0, -15, 0));
    }
    /* a spring arm: whatever stands between the look point and the lens pulls the lens in, in front of it */
    if (!PV.meshes) { PV.meshes = []; PV.model.traverse(o => { if (o.isMesh) PV.meshes.push(o); }); }
    { const own = new Set(); for (const f of [subj]) if (f) f.g.traverse(o => own.add(o)); const d = pos.clone().sub(look), len = d.length(); d.normalize(); ray.set(look, d); ray.far = len;
      const hit = ray.intersectObjects(PV.meshes, false).find(h => !own.has(h.object) && h.distance > 25); if (hit) pos = look.clone().addScaledVector(d, Math.max(45, hit.distance - 18)); }
    camera.position.copy(pos); camera.lookAt(look); camera.near = 2; camera.far = R * 40; camera.updateProjectionMatrix(); controls.target.copy(look);
    const cap = $('#cap'); if (cap && shot) cap.innerHTML = `<b>${shot.n}/${PV.data.shots.length} · ${shot.camera.kind}</b> ${esc(shot.beat)}`;
    const sc = $('#scrub'); if (sc) sc.value = t;
  }
  function drawPrevisUI() {
    let bar = $('#pvbar'); if (!bar) { bar = document.createElement('div'); bar.id = 'pvbar'; $('#stage').appendChild(bar); }
    bar.innerHTML = `<div id="cap"></div><div class="row"><button class="chip" id="pvplay">Play</button><input type="range" id="scrub" min="0" max="${PV.data.duration}" step="0.05" value="0" aria-label="Time"><button class="chip" id="pvfree">Free camera</button></div>`;
    $('#pvplay').onclick = () => { PV.playing = !PV.playing; if (PV.t >= PV.data.duration) PV.t = 0; PV.last = performance.now(); $('#pvplay').textContent = PV.playing ? 'Pause' : 'Play'; };
    $('#scrub').oninput = e => { PV.playing = false; $('#pvplay').textContent = 'Play'; setTime(+e.target.value); };
    $('#pvfree').onclick = () => { PV.playing = false; $('#pvplay').textContent = 'Play'; controls.enabled = true; };
  }
  const endPrevis = () => { PV = null; controls.enabled = true; const b = $('#pvbar'); if (b) b.remove(); };
  (function loop(now) { if (window.__manual) { requestAnimationFrame(loop); return; } if (PV && PV.playing) { PV.t += Math.min(0.1, ((now || 0) - PV.last) / 1000); PV.last = now || 0; if (PV.t >= PV.data.duration) { PV.playing = false; const b = $('#pvplay'); if (b) b.textContent = 'Play'; } setTime(PV.t); } else if (PV) PV.last = now || 0;
    controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
  if (RENDER) { document.body.classList.add('render'); $('#sheet').classList.add('on'); resize();
    if (q.get('t') != null) { loadPrevis(RENDER).then(p => { if (!p) return; setTime(+q.get('t')); requestAnimationFrame(() => { window.__ready = RENDER; }); }); window.__pv = () => PV; window.__seek = t => { window.__manual = true; setTime(t); controls.update(); renderer.render(scene, camera); return true; }; if (q.get('film')) document.body.classList.add("film"); }   /* film: one render a frame, on demand */ else show3d(RENDER); return; }

  /* ── the table ── */
  const T = INDEX.cards, sum = k => T.reduce((s, c) => s + (c[k] || 0), 0), n = x => x.toLocaleString('en');
  const st = T.reduce((m, c) => (m[c.status] = (m[c.status] || 0) + 1, m), {});
  $('#totals').innerHTML = [[T.length, 'cards'], [sum('pieces'), 'pieces'], [sum('subBuilds'), 'sub-builds'], [sum('joints'), 'stud joints'], [Object.keys(INDEX.donors).length, 'donor sets'], [st.GREEN || 0, 'green'], [st.YELLOW || 0, 'yellow'], [st.RED || 0, 'red']].map(([v, k]) => `<span><b>${n(v)}</b>${k}</span>`).join('');
  let filter = q.get('type') || 'all', search = '';
  $('#types').innerHTML = [['all', 'All'], ...TYPES].map(([k, l]) => `<button class="chip${k === filter ? ' on' : ''}" data-t="${k}">${l}</button>`).join('');
  $('#types').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; filter = b.dataset.t; for (const x of $('#types').children) x.classList.toggle('on', x === b); draw(); };
  $('#q').oninput = e => { search = e.target.value.trim().toLowerCase(); draw(); };
  const sym = name => { const w = name.replace(/[^A-Za-z ]/g, '').split(/\s+/).filter(x => x.length > 2 && !/^(the|and|with|from|for)$/i.test(x)); return ((w[0] || name)[0] + ((w[1] || w[0] || name)[w[1] ? 0 : 1] || '')).toUpperCase().replace(/^(.)(.)$/, (m, a, b) => a + b.toLowerCase()); };
  function draw() {
    const show = T.filter(c => (filter === 'all' || c.type === filter) && (!search || (c.name + ' ' + c.id).toLowerCase().includes(search)));
    $('#table').innerHTML = TYPES.filter(([k]) => show.some(c => c.type === k)).map(([k, l]) => { const list = show.filter(c => c.type === k); return `<section class="section"><div class="secHead"><span class="rn">${l}</span><span class="sc">${list.length} cards · ${n(list.reduce((s, c) => s + c.pieces, 0))} pieces</span></div><div class="cells">${list.map(c => `<button class="cell ${c.status}" data-id="${esc(c.id)}" title="${esc(c.name)}"><span class="bar"></span><span class="num"><span>${esc(c.type === 'scene' ? c.id.replace('OD-', '') : (c.books || []).join('·'))}</span><b>${c.pieces}</b></span>${c.thumb ? `<img loading="lazy" alt="" src="odyssey/thumbs/${esc(c.id)}.webp">` : `<span class="sym">${esc(sym(c.name))}</span>`}<span class="nm">${esc(c.name)}</span></button>`).join('')}</div></section>`; }).join('') || '<p class="sub">No card matches.</p>';
  }
  $('#table').onclick = e => { const b = e.target.closest('.cell'); if (b) open(b.dataset.id); };
  $('#close').onclick = () => { $('#sheet').classList.remove('on'); history.replaceState(null, '', location.pathname + (filter !== 'all' ? '?type=' + filter : '')); };
  addEventListener('keydown', e => { if (e.key === 'Escape') $('#close').click(); });

  const treeHTML = t => `<li><span class="node"><b>${esc(t.name)}</b><span class="how ${t.how}">${esc(t.how)}</span><span class="n">${t.pieces} pieces</span></span>${t.source ? `<span class="src">${esc(t.source)}</span>` : ''}${t.children.length ? `<ul>${t.children.map(treeHTML).join('')}</ul>` : ''}</li>`;
  function open(id) {
    const c = byId.get(id); if (!c) return;
    $('#sTitle').textContent = c.name; $('#sheet').classList.add('on'); history.replaceState(null, '', '#' + id);
    const cast = c.assets ? c.assets.map(a => byId.get(a)).filter(Boolean) : [];
    $('#body').innerHTML = `
      <div class="big"><div><b>${n(c.pieces)}</b><span>pieces</span></div><div><b>${c.subBuilds}</b><span>sub-builds</span></div><div><b>${n(c.joints)}</b><span>stud joints</span></div><div><b>${c.depth}</b><span>levels</span></div></div>
      <div class="dims">${c.cm[0]} × ${c.cm[1]} × ${c.cm[2]} <small>cm</small></div>
      <div class="sub">${c.studs[0]} × ${c.studs[1]} studs · ${c.height.plates} plates high · ${c.anchored} pieces held to the plate by studs, ${c.held} by contact (clips, hands, hinges), ${c.detached} detached${c.flex ? `, ${c.flex} rope segments` : ''} · status <b>${c.status}</b></div>
      <div class="actions">${c.previs ? `<a class="primary" href="#" id="pvgo">Play previs · ${Math.round(c.previs.duration)} s, ${c.previs.shots} shots</a>` : ''}<a class="${c.previs ? '' : 'primary'}" href="play/hand-butter-odyssey.html?scene=${encodeURIComponent(c.id)}">Open in Hand Butter</a><a href="${esc(c.files.mpd)}" download>LDraw MPD</a><a href="${esc(c.files.butter)}" download>Butter scene</a><a href="${ATLAS}#${c.type === 'scene' ? 'scene' : 'asset'}/${encodeURIComponent(c.id)}">Atlas card</a></div>
      ${c.why.length ? `<h3>Notes</h3><ul class="why">${c.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      ${cast.length ? `<h3>Cast and set</h3><div class="cells">${cast.map(a => `<button class="cell ${a.status}" data-open="${esc(a.id)}"><span class="bar"></span><span class="num"><span>${esc(a.type.replace('_', ' '))}</span><b>${a.pieces}</b></span>${a.thumb ? `<img loading="lazy" alt="" src="odyssey/thumbs/${esc(a.id)}.webp">` : `<span class="sym">${esc(sym(a.name))}</span>`}<span class="nm">${esc(a.name)}</span></button>`).join('')}</div>` : ''}
      <h3>Sub-builds</h3><div class="tree"><ul>${treeHTML(c.tree)}</ul></div>
      ${c.sources.length ? `<h3>Foraged from</h3><div class="credits">${c.sources.map(s => `${esc(s.file || s.donor)}${s.sub ? ' : ' + esc(s.sub) : ''}${s.author ? ', by ' + esc(s.author) : ''}`).join('<br>')}<br>LDraw models redistributed under CCAL 2.0; the authors keep their credit in each FILE header.</div>` : ''}`;
    $('#body').querySelectorAll('[data-open]').forEach(b => b.onclick = () => open(b.dataset.open));
    $('#body').scrollTop = 0; endPrevis(); show3d(id);
    const go = $('#pvgo'); if (go) go.onclick = e => { e.preventDefault(); loadPrevis(id).then(p => { if (p) { p.playing = true; p.last = performance.now(); $('#pvplay').textContent = 'Pause'; } }); };
  }
  draw();
  if (location.hash.length > 1 && byId.has(decodeURIComponent(location.hash.slice(1)))) open(decodeURIComponent(location.hash.slice(1)));
})();
</script>

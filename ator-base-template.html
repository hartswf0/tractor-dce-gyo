<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATOR Base Template</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%234ECDC4'/%3E%3C/svg%3E">
  <style>
    :root {
      --ator-accent: #4ECDC4;
      --ator-accent-soft: #163635;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: #ddd;
      overflow: hidden;
      touch-action: pan-y;
    }

    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .header {
      padding: 10px 15px;
      background: #0a0a0a;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .title {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--ator-accent);
    }

    .stats {
      font-size: 8px;
      color: #666;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      padding: 6px 10px;
      font-size: 14px;
      background: transparent;
      color: var(--ator-accent);
      border: 1px solid #333;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.95);
      background: #1a1a1a;
    }

    .primary-btn {
      padding: 8px 12px;
      font-size: 9px;
      font-weight: bold;
      background: var(--ator-accent);
      color: #000;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .primary-btn:active {
      transform: scale(0.95);
      background: #3ab3ad;
    }

    .preview-section {
      display: flex;
      background: #0a0a0a;
      border-bottom: 1px solid #333;
      min-height: 260px;
    }

    .avatar-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      background: linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
    }

    .ator-avatar {
      width: 180px;
      height: 140px;
      border-radius: 6px;
      border: 1px solid #333;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08), transparent 60%),
                  linear-gradient(180deg, #050505 0%, #020202 100%);
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      transform-origin: center;
      transition: transform 0.3s ease;
    }

    .ator-avatar-base {
      position: absolute;
      bottom: 8px;
      left: 12px;
      right: 12px;
      height: 18px;
      border-radius: 4px;
      background: linear-gradient(90deg, #123 0%, #145 50%, #167 100%);
    }

    .ator-avatar-body {
      position: absolute;
      bottom: 26px;
      left: 32px;
      right: 32px;
      height: 36px;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, var(--ator-accent-soft) 0%, #050505 100%);
      border: 1px solid #333;
    }

    .ator-avatar-head {
      position: absolute;
      bottom: 64px;
      left: 70px;
      right: 70px;
      height: 20px;
      border-radius: 50%;
      background: #111;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .ator-avatar-tag {
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-size: 8px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid #333;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: #000;
    }

    .ator-avatar.rotating {
      animation: atorSpin 0.7s ease-in-out;
    }

    @keyframes atorSpin {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }

    .rotate-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 50%;
      color: var(--ator-accent);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .rotate-btn:active {
      background: #222;
      transform: scale(0.95);
    }

    .current-info {
      width: 210px;
      padding: 15px 12px;
      background: #000;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 8px;
    }

    .current-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--ator-accent);
    }

    .current-field {
      display: flex;
      flex-direction: column;
      gap: 2px;
      border-bottom: 1px solid #222;
      padding-bottom: 6px;
    }

    .current-label {
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .current-value {
      color: var(--ator-accent);
      font-weight: 600;
      word-break: break-all;
      line-height: 1.3;
    }

    .controls-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .search-bar {
      padding: 10px 15px;
      background: #0a0a0a;
      border-bottom: 1px solid #333;
      display: flex;
      gap: 8px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;
      padding: 10px 35px 10px 12px;
      background: #000;
      border: 1px solid #333;
      border-radius: 4px;
      color: #ddd;
      font-family: inherit;
      font-size: 10px;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--ator-accent);
    }

    .search-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #666;
    }

    .view-tabs {
      display: flex;
      background: #0a0a0a;
      border-bottom: 1px solid #333;
      align-items: stretch;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #666;
      font-family: inherit;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--ator-accent);
      border-bottom-color: var(--ator-accent);
    }

    .tab-extras {
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }

    .random-btn {
      padding: 6px 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 3px;
      color: var(--ator-accent);
      font-size: 8px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .random-btn:active {
      transform: scale(0.95);
      background: #222;
    }

    .content-area {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .view-panel {
      height: 100%;
      display: none;
      flex-direction: column;
    }

    .view-panel.active {
      display: flex;
    }

    .dial-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .dial-group {
      border: 1px solid #222;
      border-radius: 4px;
      background: #050505;
      overflow: hidden;
    }

    .dial-label {
      padding: 8px 10px;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--ator-accent);
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dial-counter {
      font-size: 8px;
      color: #666;
      font-weight: normal;
    }

    .dial-items {
      display: flex;
      overflow-x: auto;
      padding: 8px 6px;
      gap: 6px;
    }

    .dial-item {
      min-width: 120px;
      padding: 8px 10px;
      font-size: 9px;
      border-radius: 3px;
      border: 1px solid #333;
      background: #000;
      color: #888;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .dial-item.active {
      border-color: var(--ator-accent);
      color: var(--ator-accent);
      box-shadow: 0 0 6px rgba(78,205,196,0.4);
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
    }

    .list-section {
      border-bottom: 1px solid #222;
    }

    .list-header {
      padding: 12px 15px;
      background: #0a0a0a;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--ator-accent);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
    }

    .list-header:hover {
      background: #111;
    }

    .expand-icon {
      font-size: 10px;
      transition: transform 0.3s;
    }

    .list-section.expanded .expand-icon {
      transform: rotate(180deg);
    }

    .list-items {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .list-section.expanded .list-items {
      max-height: 480px;
      overflow-y: auto;
    }

    .list-item {
      padding: 10px 15px;
      background: #000;
      border-bottom: 1px solid #111;
      color: #999;
      font-size: 9px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .list-item:hover {
      background: #0a0a0a;
      color: #ddd;
      padding-left: 20px;
    }

    .list-item.selected {
      background: #1a1a1a;
      color: var(--ator-accent);
      border-left: 3px solid var(--ator-accent);
    }

    .item-icon {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .item-name {
      font-size: 9px;
    }

    .item-meta {
      font-size: 8px;
      color: #666;
    }

    .meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }

    .meta-tag {
      font-size: 7px;
      padding: 2px 5px;
      border-radius: 2px;
      border: 1px solid #333;
      color: #666;
      text-transform: uppercase;
    }

    .meta-tag.highlight {
      border-color: var(--ator-accent);
      color: var(--ator-accent);
    }

    .action-bar {
      display: flex;
      background: #020202;
      border-top: 1px solid #222;
    }

    .action-btn {
      flex: 1;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 9px;
      font-weight: 600;
      border: none;
      border-right: 1px solid #222;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .action-btn:last-child {
      border-right: none;
    }

    .btn-secondary {
      background: #020202;
      color: #888;
    }

    .btn-secondary:hover {
      color: var(--ator-accent);
      background: #050505;
    }

    .btn-primary {
      background: var(--ator-accent);
      color: #000;
    }

    .btn-primary:hover {
      background: #3ab3ad;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .status-bar {
      padding: 6px 14px;
      background: #000;
      border-top: 1px solid #333;
      font-size: 8px;
      display: flex;
      justify-content: space-between;
      color: #666;
    }

    .toast {
      position: fixed;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1a1a1a;
      color: var(--ator-accent);
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid #333;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--ator-accent);
    }

    @media (max-height: 800px) {
      body {
        overflow-y: auto;
      }

      .container {
        height: auto;
        min-height: 100vh;
      }

      .preview-section {
        min-height: 220px;
      }
    }

    @media (max-width: 900px) {
      body {
        overflow-y: auto;
      }

      .container {
        height: auto;
        min-height: 100vh;
      }

      .preview-section {
        flex-direction: column;
        min-height: auto;
      }

      .current-info {
        width: 100%;
        border-left: none;
        border-top: 1px solid #333;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-block">
        <div class="title" id="atorTitle">ATOR TEMPLATE</div>
        <div class="stats" id="atorStats">0 items loaded</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="undoBtn" title="Undo" disabled>↶</button>
        <button class="icon-btn" id="redoBtn" title="Redo" disabled>↷</button>
        <button class="icon-btn" id="randomBtn" title="Random">🎲</button>
        <button class="primary-btn" id="primaryCtaBtn">BUILD</button>
      </div>
    </div>

    <div class="preview-section">
      <div class="avatar-area">
        <button class="rotate-btn" id="rotateBtn">⟳</button>
        <div class="ator-avatar" id="atorAvatar">
          <div class="ator-avatar-base"></div>
          <div class="ator-avatar-body"></div>
          <div class="ator-avatar-head" id="atorAvatarHead">🙂</div>
          <div class="ator-avatar-tag" id="atorAvatarTag">IDLE</div>
        </div>
      </div>
      <div class="current-info">
        <div class="current-title-row">
          <span>CURRENT</span>
          <button class="icon-btn" id="clearCurrentBtn" style="padding:3px 6px;font-size:10px;">✕</button>
        </div>
        <div class="current-field">
          <span class="current-label">Name</span>
          <span class="current-value" id="currentName">—</span>
        </div>
        <div class="current-field">
          <span class="current-label">Designer</span>
          <span class="current-value" id="currentDesigner">—</span>
        </div>
        <div class="current-field">
          <span class="current-label">Primary Slot</span>
          <span class="current-value" id="currentPrimary">—</span>
        </div>
        <div class="current-field">
          <span class="current-label">Secondary Slot</span>
          <span class="current-value" id="currentSecondary">—</span>
        </div>
      </div>
    </div>

    <div class="controls-section">
      <div class="search-bar">
        <div class="search-wrapper">
          <input type="text" class="search-input" id="searchInput" placeholder="Search items...">
          <span class="search-icon">🔍</span>
        </div>
      </div>

      <div class="view-tabs">
        <button class="tab-btn active" data-view="dial">DIAL</button>
        <button class="tab-btn" data-view="list">LIST</button>
        <div class="tab-extras">
          <button class="random-btn" id="tabRandomBtn">RANDOM</button>
        </div>
      </div>

      <div class="content-area">
        <div class="view-panel active" id="dialView">
          <div class="dial-container" id="dialContainer"></div>
        </div>

        <div class="view-panel" id="listView">
          <div class="list-container" id="listContainer"></div>
        </div>
      </div>

      <div class="action-bar">
        <button class="action-btn btn-secondary" id="broadcastBtn">CONTEXT</button>
        <button class="action-btn btn-secondary" id="batchBtn">BATCH</button>
        <button class="action-btn btn-primary" id="loadBtn">LOAD</button>
      </div>

      <div class="status-bar">
        <span id="statusLeft">READY</span>
        <span id="statusRight">ATOR TEMPLATE</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      items: [
        {
          id: 'primary-1',
          family: 'PRIMARY',
          name: 'Primary Sample A',
          icon: '🧱',
          designer: 'ATOR',
          primary: 'Slot A',
          secondary: 'Variant 1',
          tags: ['primary', 'sample']
        },
        {
          id: 'primary-2',
          family: 'PRIMARY',
          name: 'Primary Sample B',
          icon: '🧱',
          designer: 'ATOR',
          primary: 'Slot B',
          secondary: 'Variant 2',
          tags: ['primary', 'sample']
        },
        {
          id: 'secondary-1',
          family: 'SECONDARY',
          name: 'Secondary Sample A',
          icon: '🎯',
          designer: 'ATOR',
          primary: 'Slot C',
          secondary: 'Alt 1',
          tags: ['secondary', 'sample']
        }
      ],
      filteredItems: [],
      dialFamilies: ['PRIMARY', 'SECONDARY'],
      selectedId: null,
      search: ''
    };

    const showToast = (msg) => {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    };

    const setStatus = (left, right) => {
      if (left != null) document.getElementById('statusLeft').textContent = left;
      if (right != null) document.getElementById('statusRight').textContent = right;
    };

    const applyFilter = () => {
      const term = state.search.trim().toLowerCase();
      state.filteredItems = state.items.filter(item => {
        if (!term) return true;
        const text = [item.name, item.family, item.primary, item.secondary, (item.tags || []).join(' ')].join(' ').toLowerCase();
        return text.includes(term);
      });
      renderDials();
      renderList();
      updateStats();
      if (!state.selectedId && state.filteredItems[0]) {
        state.selectedId = state.filteredItems[0].id;
      }
      updateCurrent();
    };

    const updateStats = () => {
      const statsEl = document.getElementById('atorStats');
      statsEl.textContent = `${state.filteredItems.length}/${state.items.length} items`;
    };

    const currentItem = () => state.items.find(i => i.id === state.selectedId) || null;

    const updateCurrent = () => {
      const item = currentItem();
      const nameEl = document.getElementById('currentName');
      const designerEl = document.getElementById('currentDesigner');
      const primaryEl = document.getElementById('currentPrimary');
      const secondaryEl = document.getElementById('currentSecondary');
      const headEl = document.getElementById('atorAvatarHead');
      const tagEl = document.getElementById('atorAvatarTag');

      if (!item) {
        nameEl.textContent = '—';
        designerEl.textContent = '—';
        primaryEl.textContent = '—';
        secondaryEl.textContent = '—';
        headEl.textContent = '🙂';
        tagEl.textContent = 'IDLE';
        return;
      }

      nameEl.textContent = item.name || '—';
      designerEl.textContent = item.designer || '—';
      primaryEl.textContent = item.primary || '—';
      secondaryEl.textContent = item.secondary || '—';
      headEl.textContent = item.icon || '🙂';
      tagEl.textContent = item.family || 'ITEM';
    };

    const renderDials = () => {
      const container = document.getElementById('dialContainer');
      container.innerHTML = '';
      state.dialFamilies.forEach(family => {
        const group = document.createElement('div');
        group.className = 'dial-group';

        const labelRow = document.createElement('div');
        labelRow.className = 'dial-label';
        const labelSpan = document.createElement('span');
        labelSpan.textContent = family;
        const counterSpan = document.createElement('span');
        counterSpan.className = 'dial-counter';
        const items = state.filteredItems.filter(i => i.family === family);
        counterSpan.textContent = `${items.length} items`;
        labelRow.appendChild(labelSpan);
        labelRow.appendChild(counterSpan);

        const itemsRow = document.createElement('div');
        itemsRow.className = 'dial-items';

        items.forEach(item => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'dial-item' + (item.id === state.selectedId ? ' active' : '');
          btn.textContent = item.name;
          btn.addEventListener('click', () => {
            state.selectedId = item.id;
            updateCurrent();
            renderDials();
            renderList();
          });
          itemsRow.appendChild(btn);
        });

        group.appendChild(labelRow);
        group.appendChild(itemsRow);
        container.appendChild(group);
      });
    };

    const renderList = () => {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';
      state.dialFamilies.forEach(family => {
        const section = document.createElement('div');
        section.className = 'list-section';

        const header = document.createElement('div');
        header.className = 'list-header';
        const hLabel = document.createElement('span');
        hLabel.textContent = family;
        const expand = document.createElement('span');
        expand.className = 'expand-icon';
        expand.textContent = '▼';
        header.appendChild(hLabel);
        header.appendChild(expand);

        const itemsWrap = document.createElement('div');
        itemsWrap.className = 'list-items';

        header.addEventListener('click', () => {
          const expanded = section.classList.toggle('expanded');
          if (expanded) {
            const anyItems = itemsWrap.querySelector('.list-item');
            if (!anyItems) {
              section.classList.remove('expanded');
            }
          }
        });

        const items = state.filteredItems.filter(i => i.family === family);
        items.forEach(item => {
          const row = document.createElement('div');
          row.className = 'list-item' + (item.id === state.selectedId ? ' selected' : '');

          const icon = document.createElement('div');
          icon.className = 'item-icon';
          icon.textContent = item.icon || '⬛';

          const details = document.createElement('div');
          details.className = 'item-details';

          const name = document.createElement('div');
          name.className = 'item-name';
          name.textContent = item.name;

          const meta = document.createElement('div');
          meta.className = 'item-meta';
          meta.textContent = item.designer || '';

          const tagsRow = document.createElement('div');
          tagsRow.className = 'meta-tags';
          (item.tags || []).forEach(tag => {
            const t = document.createElement('span');
            t.className = 'meta-tag' + (tag === family.toLowerCase() ? ' highlight' : '');
            t.textContent = tag;
            tagsRow.appendChild(t);
          });

          details.appendChild(name);
          details.appendChild(meta);
          details.appendChild(tagsRow);

          row.appendChild(icon);
          row.appendChild(details);

          row.addEventListener('click', () => {
            state.selectedId = item.id;
            updateCurrent();
            renderDials();
            renderList();
          });

          itemsWrap.appendChild(row);
        });

        section.appendChild(header);
        section.appendChild(itemsWrap);
        container.appendChild(section);
      });
    };

    const pickRandomItem = () => {
      if (!state.filteredItems.length) {
        showToast('No items to randomize');
        return;
      }
      const idx = Math.floor(Math.random() * state.filteredItems.length);
      state.selectedId = state.filteredItems[idx].id;
      updateCurrent();
      renderDials();
      renderList();
      showToast('Random item selected');
      setStatus('RANDOM', state.filteredItems[idx].name || '');
    };

    const broadcastCurrent = () => {
      const item = currentItem();
      if (!item) {
        showToast('Nothing selected');
        return;
      }
      showToast('Context broadcast (template)');
      setStatus('CONTEXT', item.name || '');
    };

    const batchExport = () => {
      if (!state.filteredItems.length) {
        showToast('No items for batch');
        return;
      }
      const lines = state.filteredItems.map(item => `${item.id}\t${item.name}`);
      const text = lines.join('\n');
      try {
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ator-template-batch.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Batch exported');
        setStatus('BATCH', `${state.filteredItems.length} items`);
      } catch (e) {
        showToast('Batch export failed');
      }
    };

    const loadCurrent = () => {
      const item = currentItem();
      if (!item) {
        showToast('Nothing to load');
        return;
      }
      showToast('Load triggered (template)');
      setStatus('LOAD', item.name || '');
    };

    const initTabs = () => {
      const tabs = Array.from(document.querySelectorAll('.tab-btn'));
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const view = tab.dataset.view;
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('dialView').classList.toggle('active', view === 'dial');
          document.getElementById('listView').classList.toggle('active', view === 'list');
        });
      });
    };

    const init = () => {
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', (e) => {
        state.search = e.target.value;
        applyFilter();
      });

      initTabs();
      applyFilter();

      const rotateBtn = document.getElementById('rotateBtn');
      rotateBtn.addEventListener('click', () => {
        const avatar = document.getElementById('atorAvatar');
        avatar.classList.remove('rotating');
        void avatar.offsetWidth;
        avatar.classList.add('rotating');
      });

      const clearCurrentBtn = document.getElementById('clearCurrentBtn');
      clearCurrentBtn.addEventListener('click', () => {
        state.selectedId = null;
        updateCurrent();
        renderDials();
        renderList();
      });

      document.getElementById('randomBtn').addEventListener('click', pickRandomItem);
      document.getElementById('tabRandomBtn').addEventListener('click', pickRandomItem);
      document.getElementById('broadcastBtn').addEventListener('click', broadcastCurrent);
      document.getElementById('batchBtn').addEventListener('click', batchExport);
      document.getElementById('loadBtn').addEventListener('click', loadCurrent);

      const titleEl = document.getElementById('atorTitle');
      const statsEl = document.getElementById('atorStats');
      titleEl.textContent = 'ATOR BASE TEMPLATE';
      statsEl.textContent = `${state.items.length} items (template)`;
    };

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background coin / halo -->
  <circle cx="32" cy="32" r="30" fill="#111827"/>

  <!-- Laurel ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>

  <!-- Homer-style yellow head -->
  <ellipse cx="32" cy="30" rx="15" ry="14" fill="#facc15" stroke="#78350f" stroke-width="2"/>

  <!-- Ear bump -->
  <circle cx="19" cy="30" r="3" fill="#facc15" stroke="#78350f" stroke-width="1.5"/>

  <!-- Poet brow line -->
  <path d="M23 22 Q32 18 41 22" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes (Homer-ish) -->
  <circle cx="27" cy="28" r="4" fill="#f9fafb" stroke="#111827" stroke-width="1.5"/>
  <circle cx="37" cy="28" r="4" fill="#f9fafb" stroke="#111827" stroke-width="1.5"/>
  <circle cx="28" cy="29" r="1.6" fill="#111827"/>
  <circle cx="38" cy="29" r="1.6" fill="#111827"/>

  <!-- Simple nose -->
  <path d="M32 28 Q34 32 31 34" fill="none" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Mouth hint -->
  <path d="M25 36 Q32 39 39 36" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>

  <!-- Scroll at bottom (epic poet) -->
  <rect x="20" y="40" width="24" height="8" rx="2" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <circle cx="20" cy="44" r="3" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <circle cx="44" cy="44" r="3" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M26 42 H36" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M26 45 H34" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Subtle donut hint (pink arc) -->
  <path d="M10 18 A12 12 0 0 1 18 10" fill="none" stroke="#f973a5" stroke-width="3" stroke-linecap="round"/>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LGI Brickbender // GS2P Mapper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');

        :root {
            --bg: #020617;
            --panel: #020617;
            --grid: #1e293b;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg);
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        @keyframes fadeUp {
            from { transform: translateY(8px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-fade-up { animation: fadeUp 0.2s ease-out forwards; }

        .node-halo { transition: opacity 0.15s ease; }
        .node:hover .node-halo { opacity: 0.5; }

        @media (max-width: 768px) {
            #sidebar { width: 0; padding: 0; overflow: hidden; }
            #sidebar.open { width: 100%; z-index: 40; }
            #inspector { bottom: 0; top: auto; height: 50vh; transform: translateY(100%); }
            #inspector.open { transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen w-full flex overflow-hidden text-slate-200">

    <!-- LEFT: PALETTE -->
    <aside id="sidebar" class="bg-slate-950/95 border-r border-slate-800 flex flex-col w-64 shrink-0 transition-all duration-300">
        <div class="h-14 border-b border-slate-800 flex items-center justify-between px-3">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded border border-cyan-500/60 bg-slate-900 flex items-center justify-center text-cyan-400 text-xs">9×9</div>
                <div class="flex flex-col leading-tight">
                    <span class="text-xs font-bold tracking-[0.2em] text-slate-100">LGI</span>
                    <span class="text-[9px] tracking-[0.16em] text-cyan-500/80">BRICKBENDER</span>
                </div>
            </div>
            <button id="sidebar-toggle" class="p-1 rounded text-slate-500 hover:text-white hover:bg-slate-800">
                <i data-lucide="panel-left-close" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="p-3 space-y-3 text-xs overflow-y-auto">
            <div>
                <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500 mb-2">GS2P Layers</div>
                <div class="grid grid-cols-2 gap-2">
                    <button class="bb-tool" data-kind="ground">
                        <div class="px-2 py-2 rounded-md border border-cyan-700/60 bg-slate-900/80 hover:bg-slate-900 flex flex-col items-start gap-1">
                            <span class="text-[10px] font-semibold tracking-[0.14em] text-cyan-300">GROUND</span>
                            <span class="text-[9px] text-slate-400">Execution path / flow step</span>
                        </div>
                    </button>
                    <button class="bb-tool" data-kind="site">
                        <div class="px-2 py-2 rounded-md border border-sky-700/60 bg-slate-900/80 hover:bg-slate-900 flex flex-col items-start gap-1">
                            <span class="text-[10px] font-semibold tracking-[0.14em] text-sky-300">SITE</span>
                            <span class="text-[9px] text-slate-400">Module / bounded place</span>
                        </div>
                    </button>
                    <button class="bb-tool" data-kind="sky">
                        <div class="px-2 py-2 rounded-md border border-purple-700/60 bg-slate-900/80 hover:bg-slate-900 flex flex-col items-start gap-1">
                            <span class="text-[10px] font-semibold tracking-[0.14em] text-purple-300">SKY</span>
                            <span class="text-[9px] text-slate-400">Constraints, risk, NFR</span>
                        </div>
                    </button>
                    <button class="bb-tool" data-kind="perspective">
                        <div class="px-2 py-2 rounded-md border border-amber-700/60 bg-slate-900/80 hover:bg-slate-900 flex flex-col items-start gap-1">
                            <span class="text-[10px] font-semibold tracking-[0.14em] text-amber-300">PERSPECTIVE</span>
                            <span class="text-[9px] text-slate-400">View / tool / lens</span>
                        </div>
                    </button>
                </div>
            </div>

            <div class="pt-1 border-t border-slate-800/70 mt-1">
                <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500 mb-2">Filters</div>
                <div class="flex flex-wrap gap-1.5 text-[10px]">
                    <button class="px-2 py-1 rounded-full border border-slate-700 text-slate-300 hover:border-cyan-500 hover:text-cyan-300" data-filter="all">ALL</button>
                    <button class="px-2 py-1 rounded-full border border-slate-700 text-cyan-300/80" data-filter="ground">GROUND</button>
                    <button class="px-2 py-1 rounded-full border border-slate-700 text-sky-300/80" data-filter="site">SITE</button>
                    <button class="px-2 py-1 rounded-full border border-slate-700 text-purple-300/80" data-filter="sky">SKY</button>
                    <button class="px-2 py-1 rounded-full border border-slate-700 text-amber-300/80" data-filter="perspective">PERSPECTIVE</button>
                </div>
            </div>

            <div class="pt-1 border-t border-slate-800/70 mt-1">
                <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500 mb-2">Session</div>
                <div class="flex flex-col gap-1 text-[10px] text-slate-400">
                    <button id="btn-layout-path" class="flex items-center justify-between px-2 py-1 rounded bg-slate-900/70 hover:bg-slate-800 border border-slate-700">
                        <span>Layout as Path</span>
                        <i data-lucide="route" class="w-3 h-3"></i>
                    </button>
                    <button id="btn-layout-sites" class="flex items-center justify-between px-2 py-1 rounded bg-slate-900/70 hover:bg-slate-800 border border-slate-700">
                        <span>Layout by Sites</span>
                        <i data-lucide="box" class="w-3 h-3"></i>
                    </button>
                    <button id="btn-export" class="flex items-center justify-between px-2 py-1 rounded bg-slate-900/70 hover:bg-slate-800 border border-slate-700">
                        <span>Copy JSON Spec</span>
                        <i data-lucide="copy" class="w-3 h-3"></i>
                    </button>
                </div>
            </div>

            <div class="pt-1 border-t border-slate-800/70 mt-1 text-[9px] text-slate-500 leading-relaxed">
                Use this map to tag any codebase or world with GS2P:
                ground = flow, site = place, sky = constraints, perspective = how you look.
            </div>
        </div>
    </aside>

    <!-- CENTER: CANVAS -->
    <main class="flex-1 flex flex-col relative">
        <div class="h-14 border-b border-slate-800 flex items-center justify-between px-3 bg-slate-950/80 backdrop-blur-sm">
            <div class="flex items-center gap-2 text-[10px] text-slate-400">
                <span class="uppercase tracking-[0.16em] text-slate-500">GS2P GRID</span>
                <span class="h-3 w-px bg-slate-700 mx-1"></span>
                <span class="text-slate-500">Tap to add · Drag to move · Tag in inspector</span>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-ingest" class="px-2 py-1 rounded text-[10px] border border-slate-700 text-slate-300 hover:border-cyan-500 hover:text-cyan-300 flex items-center gap-1">
                    <i data-lucide="file-code-2" class="w-3 h-3"></i><span>Ingest Code</span>
                </button>
                <button id="btn-reset" class="px-2 py-1 rounded text-[10px] border border-slate-700 text-slate-400 hover:border-red-500 hover:text-red-300 flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-3 h-3"></i><span>Reset</span>
                </button>
            </div>
        </div>

        <div id="canvas" class="flex-1 relative bg-slate-950 overflow-hidden">
            <div class="absolute inset-0 pointer-events-none opacity-40" style="background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 40px 40px;"></div>
            <svg id="edges" class="absolute inset-0 w-full h-full pointer-events-none"></svg>
            <div id="nodes" class="absolute inset-0 w-full h-full"></div>
        </div>
    </main>

    <!-- INGEST MODAL -->
    <div id="bb-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-40 hidden">
        <div class="w-full max-w-xl bg-slate-950 border border-slate-800 rounded-lg shadow-xl p-4 space-y-3">
            <div class="flex items-center justify-between text-xs text-slate-300">
                <span class="tracking-[0.16em] uppercase text-slate-500">Ingest Code</span>
                <button id="bb-modal-close" class="p-1 rounded text-slate-500 hover:text-white hover:bg-slate-800">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <textarea id="bb-code-input" class="w-full h-48 bg-slate-900 border border-slate-700 rounded text-[11px] text-slate-200 p-2 font-mono resize-vertical" placeholder="// Paste any code or text here..."></textarea>
            <div class="flex justify-end gap-2 text-[10px]">
                <button id="bb-modal-cancel" class="px-2 py-1 rounded border border-slate-700 text-slate-300 hover:border-slate-500 hover:text-white">Cancel</button>
                <button id="bb-modal-load" class="px-2 py-1 rounded border border-cyan-600 bg-cyan-600/20 text-cyan-200 hover:bg-cyan-600/30 flex items-center gap-1">
                    <i data-lucide="sparkles" class="w-3 h-3"></i><span>Generate Map</span>
                </button>
            </div>
        </div>
    </div>

    <!-- RIGHT: INSPECTOR -->
    <aside id="inspector" class="w-72 bg-slate-950/95 border-l border-slate-800 flex flex-col shrink-0 hidden md:flex">
        <div class="h-14 border-b border-slate-800 flex items-center justify-between px-3">
            <span class="text-xs font-semibold tracking-[0.16em] text-slate-400">NODE INSPECTOR</span>
            <button id="btn-close-inspector" class="p-1 rounded text-slate-500 hover:text-white hover:bg-slate-800">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
        <div id="inspector-body" class="flex-1 overflow-y-auto p-4 text-xs text-slate-300"></div>
    </aside>

<script>
const nodesEl = document.getElementById('nodes');
const edgesEl = document.getElementById('edges');
const inspectorEl = document.getElementById('inspector');
const inspectorBody = document.getElementById('inspector-body');
const modalEl = document.getElementById('bb-modal');
const codeInputEl = document.getElementById('bb-code-input');

let bbState = {
  nodes: [
    { id: 1, label: 'Entry Flow', kind: 'ground', x: 25, y: 40 },
    { id: 2, label: 'Core Service', kind: 'site', x: 50, y: 40 },
    { id: 3, label: 'External API', kind: 'site', x: 75, y: 40 },
    { id: 4, label: 'Latency Budget', kind: 'sky', x: 50, y: 20 },
    { id: 5, label: 'Dashboard / Logs', kind: 'perspective', x: 50, y: 65 }
  ],
  edges: [
    { from: 1, to: 2 },
    { from: 2, to: 3 },
    { from: 4, to: 2 },
    { from: 5, to: 2 }
  ],
  selectedId: null,
  draggingId: null,
  dragLast: null,
  filter: 'all'
};

function kindColor(kind) {
  switch(kind) {
    case 'ground': return { halo: 'bg-cyan-500/30', border: 'border-cyan-400', text: 'text-cyan-200' };
    case 'site': return { halo: 'bg-sky-500/25', border: 'border-sky-400', text: 'text-sky-200' };
    case 'sky': return { halo: 'bg-purple-500/25', border: 'border-purple-400', text: 'text-purple-200' };
    case 'perspective': return { halo: 'bg-amber-400/25', border: 'border-amber-300', text: 'text-amber-200' };
    default: return { halo: 'bg-slate-500/20', border: 'border-slate-500', text: 'text-slate-200' };
  }
}

function guessKindFromBlock(b) {
  if (!b || !b.type) return 'ground';
  const name = (b.name || '').toLowerCase();
  if (b.type === 'function' || b.type === 'control') return 'ground';
  if (b.type === 'tag') return 'site';
  if (b.type === 'variable') {
    if (/(timeout|budget|limit|quota|sla|retry|backoff)/.test(name)) return 'sky';
    if (/(log|metric|trace|debug|monitor|telemetry|analytics)/.test(name)) return 'perspective';
    return 'site';
  }
  return 'ground';
}

function parseCodeToGS2P(src) {
  const lines = src.split('\n');
  const blocks = new Array(81).fill(null);
  const defs = {};
  const edges = [];
  const linesPerCell = Math.max(1, Math.ceil(lines.length / 81));

  lines.forEach((line, i) => {
    const trim = line.trim();
    let type = null;
    let name = null;

    if (/^(class|function)\s+([A-Za-z0-9_]+)/.test(trim) || /([A-Za-z0-9_]+)\s*\(.*\)\s*\{/.test(trim)) {
      type = 'function';
      const m = trim.match(/\b([A-Za-z0-9_]+)\b/);
      name = m && m[1];
    } else if (/(const|let|var)\s+([A-Za-z0-9_]+)/.test(trim)) {
      type = 'variable';
      const m = trim.match(/(?:const|let|var)\s+([A-Za-z0-9_]+)/);
      name = m && m[1];
    } else if (/^<([a-zA-Z0-9-]+)/.test(trim)) {
      type = 'tag';
      const m = trim.match(/^<([a-zA-Z0-9-]+)/);
      name = m && m[1] ? m[1].toUpperCase() : null;
    } else if (/^(if|else|for|while|switch|return)/.test(trim)) {
      type = 'control';
      name = trim.split(/[\s(]/)[0];
    }

    if (type && name) {
      const cellIdx = Math.floor(i / linesPerCell);
      const priority = type === 'function' ? 4 : type === 'tag' ? 3 : type === 'control' ? 2 : 1;
      if (!blocks[cellIdx] || blocks[cellIdx].priority < priority) {
        blocks[cellIdx] = { type, name, lineIndex: i, priority };
        defs[name] = cellIdx;
      }
    }
  });

  lines.forEach((line, i) => {
    const trim = line.trim();
    const fromCell = Math.floor(i / linesPerCell);
    const matches = trim.matchAll(/([A-Za-z0-9_]+)\s*\(/g);
    for (const m of matches) {
      const target = m[1];
      const toCell = defs[target];
      if (toCell !== undefined && toCell !== fromCell) {
        edges.push({ from: fromCell, to: toCell });
      }
    }
  });

  return { lines, blocks, edges };
}

function openIngest() {
  if (!modalEl) return;
  modalEl.classList.remove('hidden');
  if (codeInputEl) codeInputEl.focus();
}

function closeIngest() {
  if (!modalEl) return;
  modalEl.classList.add('hidden');
}

function ingestCode() {
  if (!codeInputEl) return;
  const val = codeInputEl.value;
  if (!val.trim()) { closeIngest(); return; }
  const parsed = parseCodeToGS2P(val);
  bbState.nodes = [];
  bbState.edges = [];
  const cellToId = {};
  let nextId = 1;

  parsed.blocks.forEach((b, idx) => {
    if (!b) return;
    const row = Math.floor(idx / 9);
    const col = idx % 9;
    const x = 10 + (80 * (col / 8));
    const y = 15 + (70 * (row / 8));
    const id = nextId++;
    cellToId[idx] = id;
    bbState.nodes.push({
      id,
      label: b.name,
      kind: guessKindFromBlock(b),
      x,
      y,
      meta: { type: b.type, line: b.lineIndex }
    });
  });

  parsed.edges.forEach(e => {
    const fromId = cellToId[e.from];
    const toId = cellToId[e.to];
    if (fromId && toId) bbState.edges.push({ from: fromId, to: toId });
  });

  bbState.filter = 'all';
  bbState.selectedId = null;
  renderNodes();
  renderEdges();
  closeIngest();
}

function renderNodes() {
  nodesEl.innerHTML = bbState.nodes.map(n => {
    const c = kindColor(n.kind);
    const sel = n.id === bbState.selectedId;
    const dim = bbState.filter !== 'all' && n.kind !== bbState.filter;
    return `
      <div id="node-${n.id}" class="node absolute -translate-x-1/2 -translate-y-1/2 cursor-move select-none ${dim ? 'opacity-40' : 'opacity-100'}" style="left:${n.x}%; top:${n.y}%;" 
           onmousedown="startDrag(event, ${n.id})" ontouchstart="startDrag(event, ${n.id})" onclick="selectNode(${n.id})">
        <div class="relative w-20 h-20 flex items-center justify-center">
          <div class="node-halo absolute inset-0 rounded-full ${c.halo} blur-xl ${sel ? 'opacity-70' : 'opacity-0'}"></div>
          <div class="w-12 h-12 rounded-full border ${c.border} bg-slate-900 flex items-center justify-center text-[9px] ${c.text}">
            ${n.kind ? n.kind.toUpperCase().slice(0,3) : 'NOD'}
          </div>
          <div class="absolute -bottom-5 left-1/2 -translate-x-1/2 px-2 py-0.5 rounded bg-slate-900/90 border border-slate-700 text-[9px] text-slate-200 whitespace-nowrap">
            ${n.label}
          </div>
        </div>
      </div>`;
  }).join('');
  lucide.createIcons();
}

function renderEdges() {
  const defs = '<defs><marker id="bb-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#22d3ee" opacity="0.6"/></marker></defs>';
  const lines = bbState.edges.map(e => {
    const a = bbState.nodes.find(n => n.id === e.from);
    const b = bbState.nodes.find(n => n.id === e.to);
    if (!a || !b) return '';
    return `<line x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.4" marker-end="url(#bb-arrow)" />`;
  }).join('');
  edgesEl.innerHTML = defs + lines;
}

function selectNode(id) {
  bbState.selectedId = id;
  renderNodes();
  const n = bbState.nodes.find(n => n.id === id);
  if (!n) return;
  inspectorEl.classList.remove('hidden');
  inspectorEl.classList.add('open');
  inspectorBody.innerHTML = `
    <div class="space-y-4 animate-fade-up">
      <div>
        <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500 mb-1">Identity</div>
        <div class="space-y-1 bg-slate-900/80 border border-slate-800 rounded p-2.5">
          <div class="flex justify-between"><span class="text-slate-400">Label</span>
            <input class="bg-transparent border-b border-slate-700 focus:border-cyan-500 outline-none text-right text-[11px] w-36" value="${n.label}" onchange="updateLabel(${n.id}, this.value)" />
          </div>
          <div class="flex justify-between text-[11px] text-slate-400"><span>Kind</span><span class="uppercase tracking-[0.14em]">${n.kind || 'untyped'}</span></div>
          <div class="flex justify-between text-[11px] text-slate-400"><span>Coord</span><span>[${n.x.toFixed(1)}, ${n.y.toFixed(1)}]</span></div>
          ${n.meta && n.meta.type ? `<div class=\"flex justify-between text-[11px] text-slate-400\"><span>Source</span><span>${n.meta.type} @ line ${n.meta.line}</span></div>` : ''}
        </div>
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500 mb-1">GS2P Tag</div>
        <div class="grid grid-cols-2 gap-1">
          ${['ground','site','sky','perspective'].map(k => `
            <button onclick="setKind(${n.id}, '${k}')" class="px-2 py-1 rounded border text-[10px] ${n.kind===k ? 'border-cyan-500 text-cyan-300 bg-slate-900' : 'border-slate-700 text-slate-300 bg-slate-900/60 hover:border-slate-500'}">
              ${k.toUpperCase()}
            </button>`).join('')}
        </div>
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-[0.16em] text-slate-500 mb-1">Spec Snippet</div>
        <pre class="bg-slate-950 border border-slate-800 rounded p-2 text-[10px] leading-relaxed whitespace-pre-wrap">node ${n.id}:
  label: "${n.label}"
  kind: ${n.kind || '""'}
  coord: [${n.x.toFixed(1)}, ${n.y.toFixed(1)}]</pre>
      </div>
    </div>`;
}

function updateLabel(id, val) {
  const n = bbState.nodes.find(n => n.id === id);
  if (!n) return;
  n.label = val;
  renderNodes();
}

function setKind(id, kind) {
  const n = bbState.nodes.find(n => n.id === id);
  if (!n) return;
  n.kind = kind;
  selectNode(id);
  renderEdges();
}

function startDrag(ev, id) {
  ev.stopPropagation();
  bbState.draggingId = id;
  const e = ev.touches ? ev.touches[0] : ev;
  bbState.dragLast = { x: e.clientX, y: e.clientY };
  document.addEventListener('mousemove', dragMove);
  document.addEventListener('mouseup', endDrag);
  document.addEventListener('touchmove', dragMove, { passive:false });
  document.addEventListener('touchend', endDrag);
}

function dragMove(ev) {
  if (!bbState.draggingId || !bbState.dragLast) return;
  ev.preventDefault();
  const e = ev.touches ? ev.touches[0] : ev;
  const dx = e.clientX - bbState.dragLast.x;
  const dy = e.clientY - bbState.dragLast.y;
  bbState.dragLast = { x: e.clientX, y: e.clientY };
  const rect = document.getElementById('canvas').getBoundingClientRect();
  const nx = (dx / rect.width) * 100;
  const ny = (dy / rect.height) * 100;
  const n = bbState.nodes.find(n => n.id === bbState.draggingId);
  if (!n) return;
  n.x = Math.min(100, Math.max(0, n.x + nx));
  n.y = Math.min(100, Math.max(0, n.y + ny));
  renderNodes();
  renderEdges();
}

function endDrag() {
  bbState.draggingId = null;
  bbState.dragLast = null;
  document.removeEventListener('mousemove', dragMove);
  document.removeEventListener('mouseup', endDrag);
  document.removeEventListener('touchmove', dragMove);
  document.removeEventListener('touchend', endDrag);
}

function setFilter(kind) {
  bbState.filter = kind;
  renderNodes();
}

// Layout helpers
function layoutAsPath() {
  // order nodes by id for now; lay out left-to-right with sky above, perspective below
  const ground = bbState.nodes.filter(n => n.kind === 'ground');
  const site = bbState.nodes.filter(n => n.kind === 'site');
  const sky = bbState.nodes.filter(n => n.kind === 'sky');
  const persp = bbState.nodes.filter(n => n.kind === 'perspective');

  const lane = (arr, y) => {
    arr.forEach((n, i) => {
      n.x = 10 + (80 * (arr.length === 1 ? 0.5 : i/(arr.length-1)));
      n.y = y;
    });
  };

  lane(sky, 20);
  lane(site.length ? site : ground, 45);
  lane(persp, 70);
  if (!site.length) lane(ground, 45);

  renderNodes();
  renderEdges();
}

function layoutBySites() {
  const sites = bbState.nodes.filter(n => n.kind === 'site');
  const others = bbState.nodes.filter(n => n.kind !== 'site');
  const cols = Math.max(1, sites.length);

  sites.forEach((s, i) => {
    const colX = 10 + (80 * (cols === 1 ? 0.5 : i/(cols-1)));
    s.x = colX;
    s.y = 40;
    const attached = others.filter(n => bbState.edges.some(e => (e.from===n.id && e.to===s.id) || (e.to===n.id && e.from===s.id)));
    attached.forEach((a, j) => {
      a.x = colX + (j%2 ? -12 : 12);
      a.y = 20 + (j*12);
    });
  });

  renderNodes();
  renderEdges();
}

function exportJSON() {
  const data = { nodes: bbState.nodes, edges: bbState.edges };
  const txt = JSON.stringify(data, null, 2);
  navigator.clipboard.writeText(txt).then(() => {
    alert('LGI Brickbender spec copied to clipboard');
  });
}

// Wiring UI
Array.from(document.querySelectorAll('.bb-tool')).forEach(btn => {
  btn.addEventListener('click', () => {
    const kind = btn.dataset.kind;
    const id = Date.now();
    bbState.nodes.push({ id, label: kind.toUpperCase(), kind, x: 50 + (Math.random()*10-5), y: 50 + (Math.random()*10-5) });
    renderNodes();
    renderEdges();
  });
});

Array.from(document.querySelectorAll('[data-filter]')).forEach(btn => {
  btn.addEventListener('click', () => setFilter(btn.dataset.filter));
});

document.getElementById('btn-layout-path').addEventListener('click', layoutAsPath);
document.getElementById('btn-layout-sites').addEventListener('click', layoutBySites);
document.getElementById('btn-export').addEventListener('click', exportJSON);

document.getElementById('btn-close-inspector').addEventListener('click', () => {
  inspectorEl.classList.add('hidden');
  bbState.selectedId = null;
  renderNodes();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('Reset GS2P map to defaults?')) return;
  bbState.nodes = [
    { id: 1, label: 'Entry Flow', kind: 'ground', x: 25, y: 40 },
    { id: 2, label: 'Core Service', kind: 'site', x: 50, y: 40 },
    { id: 3, label: 'External API', kind: 'site', x: 75, y: 40 },
    { id: 4, label: 'Latency Budget', kind: 'sky', x: 50, y: 20 },
    { id: 5, label: 'Dashboard / Logs', kind: 'perspective', x: 50, y: 65 }
  ];
  bbState.edges = [
    { from: 1, to: 2 },
    { from: 2, to: 3 },
    { from: 4, to: 2 },
    { from: 5, to: 2 }
  ];
  bbState.filter = 'all';
  renderNodes();
  renderEdges();
});

renderNodes();
renderEdges();
lucide.createIcons();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ARCHIVE_CORE_INDEX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020617;
      --surface: #020617;
      --panel: #020617;
      --card: #020617;
      --border: #1f2937;
      --border-soft: #111827;
      --accent: #f97316;
      --accent-soft: rgba(249, 115, 22, 0.12);
      --text: #e5e7eb;
      --text-soft: #9ca3af;
      --text-dim: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #111827 0, #020617 45%, #020617 100%);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    header {
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-soft);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title span.badge {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 2px 8px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      background: var(--accent-soft);
    }
    h1 {
      margin: 10px 0 4px;
      font-size: 26px;
      letter-spacing: -0.03em;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-dim);
      max-width: 700px;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }
    .meta-row span strong {
      color: var(--text-soft);
    }
    .grid {
      margin-top: 30px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: radial-gradient(circle at top left, #111827 0, #020617 40%, #020617 100%);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.75);
      padding: 18px 18px 10px;
    }
    .grid-head {
      display: grid;
      grid-template-columns: 70px 1.6fr 1.3fr 1fr;
      gap: 14px;
      padding: 6px 10px 10px;
      border-bottom: 1px dashed var(--border);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }
    .rows {
      margin-top: 4px;
    }
    .row {
      display: grid;
      grid-template-columns: 70px 1.6fr 1.3fr 1fr;
      gap: 14px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: default;
      transition: background 0.12s, border-color 0.12s, transform 0.08s;
    }
    .row:hover {
      background: rgba(15, 23, 42, 0.9);
      border-color: var(--border);
      transform: translateY(-1px);
    }
    .c-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
    }
    .c-id span.dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      margin-right: 6px;
      background: radial-gradient(circle at 30% 0, #facc15 0, #f59e0b 30%, #b45309 100%);
    }
    .c-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .c-pair {
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
    }
    .c-title {
      font-size: 12px;
      color: var(--text-dim);
    }
    .c-meta {
      font-size: 11px;
      color: var(--text-soft);
    }
    .c-meta span.label {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
    }
    .winner-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(248, 250, 252, 0.12);
      background: radial-gradient(circle at 0 0, rgba(251, 191, 36, 0.3), transparent 60%);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .winner-pill span.name {
      color: #e5e7eb;
      letter-spacing: 0;
      text-transform: none;
      font-family: 'Inter', system-ui;
      font-weight: 500;
    }
    .summary {
      font-size: 12px;
      color: var(--text-soft);
      line-height: 1.5;
    }
    @media (max-width: 900px) {
      .grid-head, .row {
        grid-template-columns: 60px 2.1fr 0.9fr;
      }
      .grid-head div:nth-child(4),
      .row > div:nth-child(4) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="title">
        ARCHIVE_CORE <span class="badge">RESEARCH INDEX</span>
      </div>
      <h1>Guardian Comparative Log</h1>
      <div class="subtitle">
        One line per encounter: who met whom, who won, and why. Auto-generated from the Dark Matter Guardian assessments.
      </div>
      <div class="meta-row">
        <span><strong>Source:</strong> chapter-final-decisions.json</span>
        <span><strong>System:</strong> Onyx Thumb / Tail</span>
      </div>
    </header>
    <section class="grid">
      <div class="grid-head">
        <div>ID</div>
        <div>Encounter</div>
        <div>Winner</div>
        <div>Guardian Summary</div>
      </div>
      <div class="rows" id="rows"></div>
    </section>
  </div>
  <script>
    async function loadIndex() {
      try {
        const res = await fetch('chapter-final-decisions.json');
        if (!res || !res.ok) throw new Error('Failed to load chapter-final-decisions.json');
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error('Index data is not an array');
        const sorted = data.slice().sort((a, b) => {
          return (a.chapterId || 0) - (b.chapterId || 0);
        });
        const rowsEl = document.getElementById('rows');
        rowsEl.innerHTML = '';
        for (const ch of sorted) {
          const id = ch.chapterId != null ? `M-${String(ch.chapterId).padStart(2, '0')}` : (ch.id || '');
          const pair = ch.pairTitle || '(untitled encounter)';
          const title = ch.chapterTitle || '';
          const author = ch.author || '';
          const winner = ch.finalDecision && ch.finalDecision.winner ? ch.finalDecision.winner : '—';
          let summary = ch.finalDecision && ch.finalDecision.summary ? String(ch.finalDecision.summary) : '';
          summary = summary.replace(/^\.\n/, '').trim();
          const div = document.createElement('div');
          div.className = 'row';
          div.innerHTML = `
            <div class="c-id"><span class="dot"></span>${id || ''}</div>
            <div class="c-main">
              <div class="c-pair">${escapeHtml(pair)}</div>
              <div class="c-title">${escapeHtml(title)}</div>
              <div class="c-meta"><span class="label">Author</span> ${escapeHtml(author)}</div>
            </div>
            <div>
              <span class="winner-pill">WINNER <span class="name">${escapeHtml(winner)}</span></span>
            </div>
            <div class="summary">${escapeHtml(summary)}</div>
          `;
          rowsEl.appendChild(div);
        }
      } catch (e) {
        console.error('Failed to load research index:', e);
        const rowsEl = document.getElementById('rows');
        rowsEl.innerHTML = '<div style="padding:16px; font-size:13px; color:#fca5a5;">Failed to load chapter-final-decisions.json. Run <code>node parse-chapters-final-verdicts.js &gt; chapter-final-decisions.json</code> from the archive root.</div>';
      }
    }
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
    loadIndex();
  </script>
</body>
</html>

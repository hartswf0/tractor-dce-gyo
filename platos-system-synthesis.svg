<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="background:#222; font-family:Arial, sans-serif;">
  <defs>
    <!-- GLOBAL FILTERS & PATTERNS -->
    <filter id="brickShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="tubeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="50%" stop-color="#333"/>
      <stop offset="100%" stop-color="#555"/>
    </linearGradient>
    <linearGradient id="urnClay" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A05F35"/>
      <stop offset="50%" stop-color="#D67229"/>
      <stop offset="100%" stop-color="#A05F35"/>
    </linearGradient>
  </defs>

  <!-- TITLE HEADER -->
  <g transform="translate(20, 20)">
    <rect width="300" height="50" rx="4" fill="#333" stroke="#555" stroke-width="2"/>
    <text x="150" y="32" text-anchor="middle" fill="#fff" font-weight="bold" font-size="18">THE NARRATIVE SYNTHESIS</text>
  </g>

  <!-- THE URN (CENTERPIECE) -->
  <g transform="translate(400, 480) scale(6)">
    <g filter="url(#brickShadow)">
      <!-- Base -->
      <rect x="-10" y="0" width="20" height="4" fill="url(#urnClay)" stroke="#5F3818" stroke-width="0.2"/>
      <!-- Body -->
      <path d="M -15 -10 L 15 -10 L 20 0 L -20 0 Z" fill="url(#urnClay)" stroke="#5F3818" stroke-width="0.2"/>
      <path d="M -20 -25 L 20 -25 L 15 -10 L -15 -10 Z" fill="url(#urnClay)" stroke="#5F3818" stroke-width="0.2"/>
      <!-- Neck/Rim -->
      <rect x="-12" y="-30" width="24" height="5" fill="url(#urnClay)" stroke="#5F3818" stroke-width="0.2"/>
      <!-- Handles -->
      <path d="M -15 -18 C -25 -18, -25 -5, -15 -5" fill="none" stroke="#8B4513" stroke-width="1.5"/>
      <path d="M 15 -18 C 25 -18, 25 -5, 15 -5" fill="none" stroke="#8B4513" stroke-width="1.5"/>
      <!-- Narrative Frieze -->
      <rect x="-18" y="-20" width="36" height="6" fill="#F6D713" opacity="0.9"/>
      <rect x="-14" y="-19" width="4" height="4" fill="#333" opacity="0.5"/>
      <rect x="-6" y="-19" width="4" height="4" fill="#333" opacity="0.5"/>
      <rect x="2" y="-19" width="4" height="4" fill="#333" opacity="0.5"/>
      <rect x="10" y="-19" width="4" height="4" fill="#333" opacity="0.5"/>
    </g>
  </g>

  <!-- PATHS (Pneumatic Hoses) connecting modules to Urn -->
  <g fill="none" stroke="url(#tubeGradient)" stroke-width="6" stroke-linecap="round">
    <path d="M 100 150 C 100 300, 380 300, 390 350" />
    <path d="M 250 100 C 250 250, 390 280, 395 350" />
    <path d="M 400 80  C 400 200, 400 250, 400 350" />
    <path d="M 550 100 C 550 250, 410 280, 405 350" />
    <path d="M 700 150 C 700 300, 420 300, 410 350" />
  </g>

  <!-- ANIMATED FLOW (Data/Studs traveling down pipes) -->
  <g>
    <circle r="4" fill="#287F46">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 100 150 C 100 300, 380 300, 390 350" />
    </circle>
    <circle r="4" fill="#F6D713">
      <animateMotion dur="3s" begin="0.5s" repeatCount="indefinite" path="M 250 100 C 250 250, 390 280, 395 350" />
    </circle>
    <circle r="4" fill="#5F3818">
      <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M 400 80  C 400 200, 400 250, 400 350" />
    </circle>
    <circle r="4" fill="#C91A09">
      <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M 550 100 C 550 250, 410 280, 405 350" />
    </circle>
    <circle r="4" fill="#0055BF">
      <animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M 700 150 C 700 300, 420 300, 410 350" />
    </circle>
  </g>

  <!-- MODULE 1: THE GRID -->
  <g transform="translate(60, 110)" filter="url(#brickShadow)">
    <rect width="80" height="80" rx="4" fill="#287F46" stroke="#fff" stroke-width="2"/>
    <path d="M 0 40 L 80 40 M 40 0 L 40 80" stroke="#00441b" stroke-width="2"/>
    <text x="40" y="105" text-anchor="middle" fill="#ccc" font-size="12">1. GRID</text>
  </g>

  <!-- MODULE 2: THE AUDIT -->
  <g transform="translate(210, 60)" filter="url(#brickShadow)">
    <rect width="80" height="60" rx="4" fill="#999" stroke="#fff" stroke-width="2"/>
    <circle cx="40" cy="30" r="15" fill="#F6D713"/>
    <rect x="30" y="32" width="20" height="8" rx="2" fill="#000" opacity="0.2"/>
    <text x="40" y="85" text-anchor="middle" fill="#ccc" font-size="12">2. AUDIT</text>
  </g>

  <!-- MODULE 3: THE CONSTRUCT -->
  <g transform="translate(360, 40)" filter="url(#brickShadow)">
    <rect width="80" height="80" rx="4" fill="#5F3818" stroke="#fff" stroke-width="2"/>
    <circle cx="40" cy="40" r="25" fill="#287F46"/>
    <text x="40" y="105" text-anchor="middle" fill="#ccc" font-size="12">3. BUILD</text>
  </g>

  <!-- MODULE 4: ESCALATION -->
  <g transform="translate(510, 60)" filter="url(#brickShadow)">
    <rect width="80" height="60" rx="4" fill="#C91A09" stroke="#fff" stroke-width="2"/>
    <rect x="20" y="20" width="40" height="15" fill="#000"/>
    <path d="M 10 10 L 70 10" stroke="#F6D713" stroke-width="4"/>
    <text x="40" y="85" text-anchor="middle" fill="#ccc" font-size="12">4. VECTORS</text>
  </g>

  <!-- MODULE 5: CALIBRATION -->
  <g transform="translate(660, 110)" filter="url(#brickShadow)">
    <rect width="80" height="80" rx="4" fill="#0055BF" stroke="#fff" stroke-width="2"/>
    <line x1="20" y1="60" x2="60" y2="20" stroke="#F6D713" stroke-width="10" stroke-linecap="round"/>
    <circle cx="20" cy="60" r="2" fill="#000"/>
    <circle cx="60" cy="20" r="2" fill="#000"/>
    <text x="40" y="105" text-anchor="middle" fill="#ccc" font-size="12">5. FIX</text>
  </g>

  <!-- OUTPUT ARROW -->
  <defs>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#F6D713" />
    </marker>
  </defs>

  <g transform="translate(400, 560)">
    <path d="M 0 0 L 0 30" stroke="#F6D713" stroke-width="6" marker-end="url(#arrowGold)"/>
    <text x="0" y="35" text-anchor="middle" fill="#F6D713" font-size="14" font-weight="bold">forest_skirmish.mpd</text>
  </g>
</svg>

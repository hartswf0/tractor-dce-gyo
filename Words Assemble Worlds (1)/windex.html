<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAG · PNG Walkthrough</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #e5e7eb;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 8px 14px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #020617;
      border-bottom: 1px solid #111827;
    }
    header span.label {
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #facc15;
      font-weight: 600;
    }
    header span.meta {
      font-size: 11px;
      color: #9ca3af;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 12px 12px 12px;
      gap: 8px;
    }
    .stage {
      flex: 1;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #111827;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-top: 4px;
    }
    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button.nav-btn {
      background: #020617;
      color: #e5e7eb;
      border: 1px solid #1f2937;
      padding: 4px 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 3px;
    }
    button.nav-btn:hover {
      border-color: #38bdf8;
      color: #f9fafb;
    }
    button.nav-btn:disabled {
      opacity: 0.4;
      cursor: default;
      border-color: #111827;
    }
    .slide-indicator { color: #e5e7eb; }
    .filename { font-family: "Courier New", monospace; color: #9ca3af; font-size: 11px; }
    .hint { font-size: 10px; color: #6b7280; }
  </style>
</head>
<body>
  <header>
    <span class="label">WAG · PNG WALKTHROUGH</span>
    <span class="meta">Use 190 / 192 or buttons</span>
  </header>

  <main>
    <div class="stage">
      <img id="slideImage" src="" alt="Slide" />
    </div>
    <div class="controls">
      <div class="controls-left">
        <button class="nav-btn" id="prevBtn">◀ Prev</button>
        <button class="nav-btn" id="nextBtn">Next ▶</button>
        <span class="slide-indicator" id="slideIndicator"></span>
      </div>
      <div class="controls-right">
        <span class="filename" id="filenameLabel"></span>
        <span class="hint">Home / End jump to 1 / 15</span>
      </div>
    </div>
  </main>

  <script>
    const slides = [
      '1.png','2.png','3.png','4.png','5.png',
      '6.png','7.png','8.png','9.png','10.png',
      '11.png','12.png','13.png','14.png','15.png'
    ];

    let currentIndex = 0;
    const imgEl = document.getElementById('slideImage');
    const indicatorEl = document.getElementById('slideIndicator');
    const filenameEl = document.getElementById('filenameLabel');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    function updateSlide() {
      const file = slides[currentIndex];
      imgEl.src = file;
      imgEl.alt = `Slide ${currentIndex + 1}: ${file}`;
      indicatorEl.textContent = `Slide ${currentIndex + 1} / ${slides.length}`;
      filenameEl.textContent = file;
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === slides.length - 1;
    }

    function go(delta) {
      const next = currentIndex + delta;
      if (next < 0 || next >= slides.length) return;
      currentIndex = next;
      updateSlide();
    }

    prevBtn.addEventListener('click', () => go(-1));
    nextBtn.addEventListener('click', () => go(1));

    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'ArrowRight') go(1);
      else if (ev.key === 'ArrowLeft') go(-1);
      else if (ev.key === 'Home') { currentIndex = 0; updateSlide(); }
      else if (ev.key === 'End') { currentIndex = slides.length - 1; updateSlide(); }
    });

    updateSlide();
  </script>
</body>
</html>

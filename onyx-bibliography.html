<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCE-GYO Bibliography — Guardian Debates</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-dim: #8b949e;
            --accent: #f0883e;
            --success: #3fb950;
            --p1-color: #58a6ff;
            --p2-color: #f85149;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        
        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .header h1 span {
            color: var(--accent);
        }
        
        .header p {
            color: var(--text-dim);
            font-size: 0.95rem;
        }
        
        .header-actions {
            display: flex;
            gap: 0.75rem;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.15s;
        }
        
        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }
        
        .btn-primary:hover {
            background: #d97706;
            border-color: #d97706;
            color: #000;
        }
        
        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }
        
        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Graph Section */
        .graph-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .graph-section h2 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: var(--text-dim);
        }
        
        .chapter-graph {
            display: flex;
            gap: 2px;
            height: 60px;
            align-items: flex-end;
        }
        
        .graph-bar {
            flex: 1;
            min-width: 8px;
            background: var(--accent);
            border-radius: 2px 2px 0 0;
            position: relative;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .graph-bar:hover {
            background: #fff;
        }
        
        .graph-bar.no-media {
            background: var(--border);
        }
        
        .graph-bar .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
        }
        
        .graph-bar:hover .tooltip {
            opacity: 1;
        }
        
        /* Table */
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        
        thead {
            background: var(--bg);
            position: sticky;
            top: 0;
        }
        
        th {
            padding: 0.75rem 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
        }
        
        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }
        
        tr:hover {
            background: rgba(240, 136, 62, 0.05);
        }
        
        .chapter-id {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
        }
        
        .chapter-title {
            font-weight: 600;
        }
        
        .chapter-pair {
            color: var(--text-dim);
            font-size: 0.8rem;
        }
        
        .chapter-author {
            color: var(--p1-color);
            font-style: italic;
        }
        
        .chapter-logline {
            color: var(--text-dim);
            font-size: 0.8rem;
            max-width: 400px;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .status-badge.has {
            background: rgba(63, 185, 80, 0.15);
            color: var(--success);
        }
        
        .status-badge.missing {
            background: rgba(139, 148, 158, 0.15);
            color: var(--text-dim);
        }
        
        .winner-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .winner-p1 {
            background: rgba(88, 166, 255, 0.15);
            color: var(--p1-color);
        }
        
        .winner-p2 {
            background: rgba(248, 81, 73, 0.15);
            color: var(--p2-color);
        }
        
        /* Print Styles */
        @media print {
            body {
                background: #fff;
                color: #000;
            }
            
            .header-actions, .btn {
                display: none !important;
            }
            
            .container {
                max-width: 100%;
                padding: 0.5in;
            }
            
            .stat-card, .table-container, .graph-section {
                background: #fff;
                border: 1px solid #ccc;
            }
            
            .stat-card .value {
                color: #d97706;
            }
            
            table {
                font-size: 9pt;
            }
            
            th, td {
                padding: 4pt 8pt;
            }
            
            .chapter-logline {
                max-width: none;
            }
            
            .graph-bar {
                background: #d97706 !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            
            .graph-bar.no-media {
                background: #ccc !important;
            }
            
            .status-badge.has {
                background: #d4edda !important;
                color: #155724 !important;
            }
            
            .winner-p1, .winner-p2 {
                background: #e8e8e8 !important;
                color: #333 !important;
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 1rem;
            }
            
            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
            
            table {
                font-size: 0.75rem;
            }
            
            th, td {
                padding: 0.5rem;
            }
            
            .chapter-logline {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
                <h1><span>DCE-GYO</span> Bibliography</h1>
                <p>Complete catalog of Guardian Debates — Dialectical Encounters in Technological Governance</p>
            </div>
            <div class="header-actions">
                <a href="onyx-thumb.html" class="btn"><i class="fas fa-play-circle"></i> Open Player</a>
                <button class="btn" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
                <button class="btn btn-primary" onclick="exportCSV()"><i class="fas fa-download"></i> Export CSV</button>
            </div>
        </header>
        
        <div class="stats-bar" id="stats-bar">
            <div class="stat-card">
                <div class="value" id="total-chapters">—</div>
                <div class="label">Total Chapters</div>
            </div>
            <div class="stat-card">
                <div class="value" id="with-text">—</div>
                <div class="label">With Text</div>
            </div>
            <div class="stat-card">
                <div class="value" id="with-media">—</div>
                <div class="label">With Images</div>
            </div>
            <div class="stat-card">
                <div class="value" id="unique-authors">—</div>
                <div class="label">Authors Cited</div>
            </div>
            <div class="stat-card">
                <div class="value" id="p1-wins">—</div>
                <div class="label">P1 Wins</div>
            </div>
            <div class="stat-card">
                <div class="value" id="p2-wins">—</div>
                <div class="label">P2 Wins</div>
            </div>
        </div>
        
        <div class="graph-section">
            <h2><i class="fas fa-chart-bar"></i> Chapter Coverage Graph</h2>
            <div class="chapter-graph" id="chapter-graph"></div>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Ch</th>
                        <th>Title / Pair</th>
                        <th>Author</th>
                        <th>Text</th>
                        <th>Media</th>
                        <th>Winner</th>
                        <th>Logline</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="7" style="text-align:center; padding:2rem; color:var(--text-dim);">
                            <i class="fas fa-spinner fa-spin"></i> Loading chapters...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
let chaptersData = [];

async function loadChapters() {
    try {
        const res = await fetch('chapter-final-decisions.json');
        if (!res.ok) throw new Error('Failed to load');
        chaptersData = await res.json();
        
        // Check which chapters have media
        await checkMediaStatus();
        
        renderStats();
        renderGraph();
        renderTable();
    } catch (e) {
        console.error('Error loading chapters:', e);
        document.getElementById('table-body').innerHTML = `
            <tr>
                <td colspan="7" style="text-align:center; padding:2rem; color:var(--text-dim);">
                    <i class="fas fa-exclamation-triangle"></i> Failed to load chapter data
                </td>
            </tr>
        `;
    }
}

async function checkMediaStatus() {
    // Known chapters without media (from previous analysis)
    const noMedia = [18, 25, 38, 41, 45, 51, 53, 63];
    
    for (const ch of chaptersData) {
        ch.hasText = !!ch.file;
        ch.hasMedia = !noMedia.includes(ch.chapterId);
    }
}

function renderStats() {
    const total = chaptersData.length;
    const withText = chaptersData.filter(c => c.hasText).length;
    const withMedia = chaptersData.filter(c => c.hasMedia).length;
    const authors = new Set(chaptersData.map(c => c.author).filter(Boolean));
    
    // Count wins
    let p1Wins = 0, p2Wins = 0;
    chaptersData.forEach(ch => {
        const winner = ch.finalDecision?.winner || '';
        // P1 is typically the first name in pairTitle
        const pair = ch.pairTitle || '';
        const p1Match = pair.match(/THE\s+(\w+)/);
        const p1Name = p1Match ? `THE ${p1Match[1]}` : '';
        
        if (winner && winner === p1Name) {
            p1Wins++;
        } else if (winner) {
            p2Wins++;
        }
    });
    
    document.getElementById('total-chapters').textContent = total;
    document.getElementById('with-text').textContent = withText;
    document.getElementById('with-media').textContent = withMedia;
    document.getElementById('unique-authors').textContent = authors.size;
    document.getElementById('p1-wins').textContent = p1Wins;
    document.getElementById('p2-wins').textContent = p2Wins;
}

function renderGraph() {
    const graph = document.getElementById('chapter-graph');
    graph.innerHTML = '';
    
    chaptersData.forEach(ch => {
        const bar = document.createElement('div');
        bar.className = 'graph-bar' + (ch.hasMedia ? '' : ' no-media');
        
        // Height based on chapter having content
        const height = ch.hasText ? (ch.hasMedia ? 100 : 60) : 20;
        bar.style.height = height + '%';
        
        bar.innerHTML = `<div class="tooltip">Ch ${ch.chapterId}: ${ch.chapterTitle || 'Untitled'}</div>`;
        bar.onclick = () => window.open(`onyx-thumb.html#ch${ch.chapterId}`, '_blank');
        
        graph.appendChild(bar);
    });
}

function renderTable() {
    const tbody = document.getElementById('table-body');
    
    if (!chaptersData.length) {
        tbody.innerHTML = `
            <tr>
                <td colspan="7" style="text-align:center; padding:2rem; color:var(--text-dim);">
                    No chapters found
                </td>
            </tr>
        `;
        return;
    }
    
    tbody.innerHTML = chaptersData.map(ch => {
        const winner = ch.finalDecision?.winner || '—';
        const summary = ch.finalDecision?.summary || '';
        const logline = summary.replace(/^\.\s*/, '').split('.')[0] + '.';
        
        // Determine if winner is P1 or P2
        const pair = ch.pairTitle || '';
        const p1Match = pair.match(/THE\s+(\w+)/);
        const p1Name = p1Match ? `THE ${p1Match[1]}` : '';
        const isP1Winner = winner === p1Name;
        
        return `
            <tr>
                <td><span class="chapter-id">M-${String(ch.chapterId).padStart(2, '0')}</span></td>
                <td>
                    <div class="chapter-title">${ch.chapterTitle || 'Untitled'}</div>
                    <div class="chapter-pair">${ch.pairTitle || ''}</div>
                </td>
                <td><span class="chapter-author">${ch.author || '—'}</span></td>
                <td>
                    <span class="status-badge ${ch.hasText ? 'has' : 'missing'}">
                        <i class="fas fa-${ch.hasText ? 'check' : 'times'}"></i>
                        ${ch.hasText ? 'Yes' : 'No'}
                    </span>
                </td>
                <td>
                    <span class="status-badge ${ch.hasMedia ? 'has' : 'missing'}">
                        <i class="fas fa-${ch.hasMedia ? 'image' : 'times'}"></i>
                        ${ch.hasMedia ? 'Yes' : 'No'}
                    </span>
                </td>
                <td>
                    <span class="winner-badge ${isP1Winner ? 'winner-p1' : 'winner-p2'}">${winner}</span>
                </td>
                <td><span class="chapter-logline">${logline}</span></td>
            </tr>
        `;
    }).join('');
}

function exportCSV() {
    const headers = ['Chapter', 'Title', 'Pair', 'Author', 'Has Text', 'Has Media', 'Winner', 'Logline'];
    
    const rows = chaptersData.map(ch => {
        const summary = ch.finalDecision?.summary || '';
        const logline = summary.replace(/^\.\s*/, '').split('.')[0] + '.';
        
        return [
            `M-${String(ch.chapterId).padStart(2, '0')}`,
            ch.chapterTitle || '',
            ch.pairTitle || '',
            ch.author || '',
            ch.hasText ? 'Yes' : 'No',
            ch.hasMedia ? 'Yes' : 'No',
            ch.finalDecision?.winner || '',
            logline.replace(/"/g, '""')
        ];
    });
    
    const csv = [
        headers.join(','),
        ...rows.map(r => r.map(c => `"${c}"`).join(','))
    ].join('\n');
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'dce-gyo-bibliography.csv';
    a.click();
    URL.revokeObjectURL(url);
}

// Initialize
loadChapters();
</script>
</body>
</html>

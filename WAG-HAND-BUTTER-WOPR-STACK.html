<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WOPR Hand Butter</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Games are walls of nine screens, stacked in depth; the front wall is the one you play.
   One hand puts and trims clips; the other hand grips the stack to move through it.
   A game's move list is its edit: each move holds a clip and its in and out points. */
:root{
  color-scheme:dark;
  --bg:#000; --ink:#e8f2ef; --dim:#6b7f79; --line:#1c2a31;
  --x:#3b82f6; --o:#ff2e2e; --phos:#19e6c8; --amber:#ffd23f;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 var(--mono);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}

#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px))}
header{flex:none;height:46px;display:flex;align-items:center;gap:12px}
#status{flex:1;min-width:0;font-size:13px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status b{font-weight:600}
.x{color:var(--x)} .o{color:var(--o)} .w{color:var(--amber)} .d{color:var(--dim)}
#hands{height:32px;padding:0 10px;border:1px solid var(--line);font-size:10.5px;letter-spacing:.14em;color:var(--dim)}
#hands.on{border-color:var(--amber);color:var(--amber)}

/* the stack */
#stage{flex:1;min-height:0;position:relative;perspective:1300px;perspective-origin:50% 40%;touch-action:none;overflow:hidden}
#stack{position:absolute;inset:0;transform-style:preserve-3d}
.board{position:absolute;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;transform-origin:50% 100%;will-change:transform,opacity}
.board.back{pointer-events:none}
.board .tag{position:absolute;left:0;bottom:100%;padding:2px 6px;font-size:10px;letter-spacing:.12em;color:var(--dim);background:#000;white-space:nowrap}
.sq{position:relative;background:#05090c;border:1px solid var(--line);overflow:hidden}
.sq video,.sq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.sq .lbl{position:absolute;inset:0;display:grid;place-items:center;color:var(--amber);font-size:18px;font-weight:600}
.sq.x{border-color:var(--x);box-shadow:inset 0 0 0 1px var(--x)}
.sq.o{border-color:var(--o);box-shadow:inset 0 0 0 1px var(--o)}
.sq .mk{position:absolute;left:0;top:0;padding:1px 6px;font-size:11px;font-weight:600;color:#fff;z-index:1}
.sq.x .mk{background:var(--x)} .sq.o .mk{background:var(--o)}
.sq .n{position:absolute;right:4px;bottom:3px;font-size:10px;color:#fff;text-shadow:0 0 3px #000;z-index:1}
.sq .tr{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:1}
.sq .tr i{position:absolute;top:0;bottom:0;background:var(--amber)}
.sq.target{border-color:var(--phos)!important;background:#071a18}
.board.armed .sq:not(.x):not(.o)::after{content:"";position:absolute;inset:40% 45%;border:2px solid var(--phos)}
.board.over .sq:not(.line){opacity:.3}
.sq.line{border-color:var(--amber)!important;box-shadow:inset 0 0 0 2px var(--amber)}
.sq.sel{outline:2px solid var(--amber);outline-offset:2px;z-index:2}
.board.trimming .sq:not(.sel){opacity:.3}

/* depth rail: one mini board per game, front to back */
#rail{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:20}
.ri{width:34px;height:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;padding:2px;border:1px solid var(--line);background:#000}
.ri i{background:#0c1418}
.ri i.x{background:var(--x)} .ri i.o{background:var(--o)}
.ri.on{border-color:var(--ink)}
.ri.done{border-color:var(--amber)}
.ri.add{display:grid;place-items:center;color:var(--dim)}
.ri.add::before,.ri.add::after{content:"";position:absolute;width:12px;height:2px;background:currentColor}
.ri.add::after{transform:rotate(90deg)}
.ri.add{position:relative}

/* the cut */
#cut{position:absolute;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
#cutView{flex:1;min-height:0;position:relative}
#cutView video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;visibility:hidden}
#cutView video.on{visibility:visible}
#cutTag{position:absolute;left:0;top:0;padding:3px 8px;font-size:11px;letter-spacing:.1em;background:#000;z-index:2}

/* time strips: the trim strip and the cut timeline share one form */
.strip{flex:none;position:relative;height:58px;margin:6px 0 10px;border:1px solid var(--line);background:#05090c;touch-action:none;cursor:ew-resize;overflow:hidden}
.strip .fr{position:absolute;inset:0;display:flex}
.strip .fr i{flex:1;background:#0a1014 center/cover no-repeat;border-right:1px solid #000}
.strip .shade{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.72)}
.strip .h{position:absolute;top:0;bottom:0;width:12px;margin-left:-6px;cursor:col-resize}
.strip .h::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:4px;background:var(--amber)}
.strip .ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;pointer-events:none}
.strip .seg{position:absolute;top:0;bottom:0;border-right:2px solid #000;background:#0a1014 center/cover no-repeat}
.strip .seg b{position:absolute;left:0;top:0;font-size:10px;padding:0 4px;color:#fff}
.strip .seg.x b{background:var(--x)} .strip .seg.o b{background:var(--o)}
.strip .seg.x{box-shadow:inset 0 -3px 0 var(--x)} .strip .seg.o{box-shadow:inset 0 -3px 0 var(--o)}

/* one row: the dominant action and its recovery */
#act{flex:none;display:flex;gap:8px;padding:8px 0 0}
#act button{height:46px;padding:0 16px;border:1px solid var(--line);font-size:12px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
#act .main{flex:1;border-color:var(--amber);color:var(--amber)}
#act .main:hover{background:var(--amber);color:#000}
#act .back{color:var(--dim)}

/* clips */
#tray{flex:none;display:flex;gap:6px;overflow-x:auto;margin:8px 0 10px;touch-action:pan-x;scrollbar-width:none;overscroll-behavior-x:contain}
#tray::-webkit-scrollbar{display:none}
.clip{flex:none;width:92px;aspect-ratio:4/3;background:#05090c center/cover no-repeat;border:1px solid var(--line);position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.clip video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.clip.armed{border-color:var(--phos);box-shadow:0 0 0 1px var(--phos)}
.clip.used{opacity:.3}
.clip span{position:absolute;left:0;bottom:0;font-size:9px;padding:0 4px;background:rgba(0,0,0,.8);color:var(--dim)}
#tray.locked{opacity:.25;pointer-events:none}

#ghost{position:fixed;z-index:40;width:84px;aspect-ratio:4/3;border:1px solid var(--phos);background:#000 center/cover no-repeat;pointer-events:none;transform:translate(-50%,-50%)}
#hand{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
@media (min-width:900px){ .clip{width:120px} .ri{width:44px;height:34px} .strip{height:70px} }
@media (prefers-reduced-motion:reduce){.board{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="status" role="status" aria-live="polite"></div>
    <button id="hands" title="Camera hands. Right hand: pinch picks up, trims and scrubs; open hand drops; thumbs-up runs the main action. Left hand: pinch grips the stack; up and down moves between games, side to side tilts it.">Hands</button>
  </header>
  <div id="stage">
    <div id="stack"></div>
    <div id="rail"></div>
    <div id="cut" hidden>
      <div id="cutView"><div id="cutTag"></div></div>
    </div>
  </div>
  <div id="act"></div>
  <div id="tray"></div>
  <div class="strip" id="trim" hidden></div>
  <div class="strip" id="timeline" hidden></div>
</div>
<div id="ghost" hidden></div>
<canvas id="hand"></canvas>
<video id="cam" playsinline muted></video>

  tray.innerHTML = CLIPS.map(c => `<div class="clip" data-id="${c.id}" style="${c.img ? `background-image:url('${c.img}')` : ''}">${c.img ? '' : `<video src="${c.src}#t=4" preload="metadata" muted playsinline></video>`}<span>${c.code} ${c.id.toUpperCase()}</span></div>`).join('');

function arm(id){ armed = id; render(); }

/* ---------- frames for strips (same origin, so canvas reads are allowed) ---------- */
const frameCache = new Map();
function frames(id){

/* ---------- the trim strip: in, out, scrub ---------- */
function buildTrim(){

function selVideo(){ if (!sel) return null; const d = boards[front] && boards[front].querySelector(`.sq[data-i="${sel.m.i}"] video`); return d || null; }
let trimDrag = null;
function trimDown(x){

}

/* ---------- the cut: the front game's moves, in order, at their trims; scrub on the timeline ---------- */

function tlMove(x){ if (!tlDrag || !cut) return; const r = tlEl.getBoundingClientRect(); seekCut((x - r.left) / r.width * cut.total); }

/* ---------- one grab-place transaction for mouse, touch and the tool hand ---------- */
const ghost = document.getElementById('ghost');
let press = null, carry = null;
const cellAt = (x, y) => { const e = document.elementFromPoint(x, y); const d = e && e.closest('.board:not(.back) .sq'); return d ? +d.dataset.i : -1; };
function pdown(x, y, src){
  const e = document.elementFromPoint(x, y); if (!e) return;
  if (e.closest('#trim') && sel) { press = { kind:'trim' }; trimDown(x); return; }
  if (e.closest('#timeline') && cut) { press = { kind:'tl' }; tlDown(x); return; }
  if (src === 'hand') { const b = e.closest('button'); if (b) { b.click(); return; } }
  const clip = e.closest('.clip');
  if (clip && tray.classList.contains('locked')) return;

}
function pmove(x, y){

    if (press.clip && !carry) { if (press.src === 'touch' && Math.abs(x - press.x) > Math.abs(y - press.y) * .8) { press = null; return; } begin(press.clip.dataset.id, x, y); }

  if (carry) { ghost.style.left = x + 'px'; ghost.style.top = y + 'px'; const i = cellAt(x, y), s = sqOf(F()); boards[front].querySelectorAll('.sq').forEach((d, k) => d.classList.toggle('target', k === i && !s[k])); }
}
function pup(x, y){
  if (!press) return;
  const p = press; press = null;
  if (p.kind === 'trim') return trimUp();
  if (p.kind === 'tl') return tlUp();
  if (carry) { const id = carry; carry = null; ghost.hidden = true; boards[front].querySelectorAll('.sq').forEach(d => d.classList.remove('target')); const i = cellAt(x, y); if (i >= 0) playerPut(i, id); return; }
  if (p.moved) return;
  if (p.clip) { arm(armed === p.clip.dataset.id ? null : p.clip.dataset.id); return; }
  const i = cellAt(x, y); if (i < 0) return;
  const g = F(), m = sqOf(g)[i];
  if (sel) { if (m && m !== sel.m) selectSquare(i); else if (!m || m === sel.m) doneTrim(); return; }
  if (m) selectSquare(i); else if (armed) playerPut(i, armed);
}
function begin(id, x, y){ carry = id; const c = byId[id]; ghost.style.backgroundImage = c.img ? `url("${c.img}")` : 'none'; ghost.hidden = false; ghost.style.left = x + 'px'; ghost.style.top = y + 'px'; }

/* pointers: one finger is the tool; two fingers on the stage grip the stack */
const touches = new Map(); let grip = null;
function gripStart(x, y){ grip = { x, y, d0:depth.d, yaw0:depth.yaw }; }
function gripMove(x, y){
  if (!grip) return;
  depth.d = Math.max(0, Math.min(G.length - 1, grip.d0 - (y - grip.y) / (stage.clientHeight * .35)));
  depth.yaw = Math.max(-35, Math.min(35, grip.yaw0 + (x - grip.x) / stage.clientWidth * 70));
  const k = Math.round(depth.d); if (k !== front) { stopCut(); sel = null; front = k; save(); render(); } else placeBoards();
}
function gripEnd(){ if (!grip) return; grip = null; depth.t = Math.round(depth.d); depth.tyaw = 0; }
stage.addEventListener('pointerdown', e => {
  touches.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (touches.size === 2) { press = null; const [a, b] = [...touches.values()]; gripStart((a.x + b.x) / 2, (a.y + b.y) / 2); return; }
  pdown(e.clientX, e.clientY, e.pointerType);
});
for (const el of [tray, trimEl, tlEl]) el.addEventListener('pointerdown', e => pdown(e.clientX, e.clientY, e.pointerType));
addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (grip && touches.size >= 2) { const [a, b] = [...touches.values()]; gripMove((a.x + b.x) / 2, (a.y + b.y) / 2); e.preventDefault(); return; }

}, { passive:false });
const endPtr = e => { touches.delete(e.pointerId); if (grip) { if (touches.size < 2) gripEnd(); return; } if (e.type === 'pointercancel' && press && press.kind === 'tap' && !carry) { press = null; return; } pup(e.clientX, e.clientY); };

stage.addEventListener('wheel', e => { e.preventDefault(); if (Math.abs(e.deltaY) > 4) { const k = front + (e.deltaY > 0 ? 1 : -1); wheelAcc += e.deltaY; if (Math.abs(wheelAcc) > 60) { wheelAcc = 0; goTo(k); } } }, { passive:false });
let wheelAcc = 0;
rail.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.add) addGame(); else goTo(+b.dataset.k); });
addEventListener('keydown', e => {
  if (e.key === 'Escape') { arm(null); if (cut) stopCut(); else if (sel) doneTrim(); }
  if (e.key === 'ArrowDown' || e.key === 'PageDown') goTo(front + 1);
  if (e.key === 'ArrowUp' || e.key === 'PageUp') goTo(front - 1);
  if (e.key === ' ' && cut) { e.preventDefault(); togglePlay(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'z') takeBack();
});

/* ---------- hands: the right hand is the tool, the left hand grips the stack ---------- */
const handBtn = document.getElementById('hands'), cam = document.getElementById('cam'), hc = document.getElementById('hand'), hg = hc.getContext('2d');
const mk = () => ({ lm:null, x:innerWidth / 2, y:innerHeight / 2, pinch:false, lost:0 });
const H = { on:false, tool:mk(), plane:mk(), thumb:0, lastThumb:0, t:-1 };
let landmarker = null;
handBtn.onclick = async () => {
  if (H.on) { H.on = false; handBtn.classList.remove('on'); handBtn.textContent = 'Hands'; cam.srcObject && cam.srcObject.getTracks().forEach(t => t.stop()); return; }

    handBtn.textContent = 'Starting';
    cam.srcObject = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ ideal:640 }, height:{ ideal:480 } }, audio:false }); await cam.play();

      const o = d => ({ baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d }, runningMode:'VIDEO', numHands:2 });
      try { landmarker = await vision.HandLandmarker.createFromOptions(fs, o('GPU')); } catch(e) { landmarker = await vision.HandLandmarker.createFromOptions(fs, o('CPU')); }
    }
    H.on = true; handBtn.classList.add('on'); handBtn.textContent = 'Hands on';

};
const dd = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function readHand(h, lm){
  const size = dd(lm[0], lm[9]) || 1e-3, pr = dd(lm[4], lm[8]) / size;
  const ext = [[8,6],[12,10],[16,14],[20,18]].filter(([t, p]) => dd(lm[0], lm[t]) > dd(lm[0], lm[p]) * 1.12).length;
  const was = h.pinch;

function lose(h, now, onLost){ if (!h.lm && !h.lost) return; if (!h.lost) h.lost = now; h.lm = null; if (now - h.lost > 700 && h.pinch) { h.pinch = false; onLost(); } }
function handTick(now){

/* ---------- loop: depth settles, trims hold, the cut advances ---------- */
let last = performance.now();
(function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try { handTick(now); } catch(e){}
  drawHand(now);

    const k = Math.min(1, dt * 9);

  }

depth.d = depth.t = front;
renderTray(); render();
